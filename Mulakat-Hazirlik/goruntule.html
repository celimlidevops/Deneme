0.000 örnek gerekir. Hata 10 kat küçülünce örnek sayısı 100 kat büyür.\n\n**Nadir olay için.** Nadir olay daha pahalıdır. Aşırı yüklenme olasılığı `p = 0,01` ise ve bunu %10 göreli hatayla kestirmek istiyorsam:\n\nAşağıdaki satır, olasılık kestiriminin göreli hata formülüne `p = 0,01` ve göreli hata `0,1` koyar:\n\n```\nN ≈ (1 − p) / (p × 0,1²) = 0,99 / (0,01 × 0,01) ≈ 9.900 örnek\n```\n\n`p = 0,0001` için yaklaşık bir milyon. Güvenilirlik hesaplarının neden pahalı olduğu bu sayıdadır.\n\n### Hızlandırma\n\n| Yöntem | Nasıl | Artı / eksi |\n| --- | --- | --- |\n| **Doğrusallaştırma** | DC model veya çalışma noktası çevresinde duyarlılık (PTDF, Power Transfer Distribution Factor, güç transfer dağıtım faktörü). Çıktı, girdilerin doğrusal birleşimidir; dağılım analitik bulunur. | Hızlı, büyük sapmada hatalı |\n| **Nokta kestirim yöntemi** | Her belirsiz girdi için iki-üç özenle seçilmiş noktada yük akışı; `2m` veya `2m + 1` çözüm (`m` belirsiz girdi sayısı). | Momentleri verir, kuyrukları iyi vermez |\n| **Akıllı örnekleme** | Latin hiperküp, yarı rastgele diziler, önem örneklemesi (nadir olay için). | Aynı doğruluğa daha az örnekle ulaşır |\n| **Paralellik** | Örnekler bağımsızdır; iş parçacıklarına veya makinelere doğrudan dağıtılır. | Her işin kendi rastgele sayı tohumu olmalıdır, yoksa sonuç yinelenemez |\n\n### Korelasyon\n\nEn sık yapılan modelleme hatası girdileri bağımsız çekmektir. Gerçekte girdiler birlikte hareket eder:\n\n- Aynı bölgedeki rüzgâr santralleri birlikte üretir.\n- Sıcak günde her yerde yük birlikte artar.\n- Güneş ile öğlen yükü ilişkilidir.\n\nBağımsız çekim uçları birbirine götürtür ve riski **küçük** gösterir.\n\nKorelasyon modele şu yollarla girer:\n\n- korelasyon matrisi ve Cholesky ayrışımı,\n- kopula.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"Dengesizlik küçük bir düzeltmedir.\"** | Alçak gerilimde kaybı ikiye katlayabilir ve tek bir fazı bant dışına çıkarabilir. |\n| **\"Üç fazı ayrı ayrı çözer, toplarım.\"** | Fazlar manyetik olarak bağlıdır; ayrı çözülemez. |\n| **\"Simetrik bileşenler dağıtımı da çözer.\"** | Dizi devrelerinin birbirinden bağımsız olması, hattın simetrik olmasını gerektirir. Çaprazlanmamış dağıtım hattında diziler de bağlıdır; faz koordinatlarında çalışılır. |\n| **\"Monte Carlo'da bin örnek her şeye yeter.\"** | Ortalama için yeter, yüzde birlik kuyruk için yetmez. |\n| **\"Olasılıksal sonuç kesin sonuçtan daha doğrudur.\"** | Girdi dağılımı yanlışsa çıktı da hassas görünen bir yanlıştır. |\n\n## Panel takip sorusu\n\nPanelin bu konudan sonra sorabileceği iki soru ve cevapları:\n\n> Mülakatta şöyle söyle — \"Monte Carlo sonucunun yeterli olduğunu nasıl anlarsın?\" Cevap: ilgilendiğim büyüklüğün (ortalama, yüzdelik, ihlal olasılığı) güven aralığını izlerim; aralık kabul sınırının altına inince dururum. Sabit bir örnek sayısıyla durmam.\n\n> Mülakatta şöyle söyle — \"On bin yük akışını nasıl hızlandırırsın?\" Cevap: topoloji değişmediği için matrisin simgesel çarpanlara ayrılmasını bir kez yaparım, her örneği önceki çözümden başlatırım, örnekleri paralel koşarım. Yetmezse doğrusal modelle tarar, yalnız sınıra yakın örnekleri AC ile çözerim.\n\nAC burada alternatif akım modeli, yani tam doğrusal olmayan yük akışı demektir.\n\nAşağıdaki metin, bu sayfanın mülakatta yüksek sesle söylenecek özetidir.\n\n## 90 saniye\n\n> Mülakatta şöyle söyle: \"Dağıtım şebekesi dengesizdir: tek fazlı yükler, çaprazlanmamış hatlar ve akım taşıyan nötr vardır. Bu yüzden her hattı üçe üç empedans matrisiyle modeller, radyal şebekede ileri-geri süpürmeyle çözerim. Dengesizlik aynı toplam akımda kaybı katlar ve tek bir fazın gerilimini bozar. Belirsizlik için olasılıksal yük akışı kullanırım; en basit hali Monte Carlo'dur: dağılımdan örnek çek, çöz, tekrarla. Hata örnek sayısının kareköküyle azalır, nadir olaylar çok örnek ister ve girdiler arasındaki korelasyonu atlamak riski küçük gösterir.\"\n"}, {"id": "06-Kisa-Devre/00-Alt-Basliklar.md", "group": "06  Kısa devre", "title": "06 — Kısa devre", "body": "# 06 — Kısa devre\n\nBu klasör kısa devre hesabını anlatır. **Kısa devre**, bir fazın başka bir faza veya toprağa istemeden, çok düşük empedansla değmesidir. O anda akım normalin kat kat üstüne çıkar.\n\nKlasörde iki sayfa var:\n\n| Sayfa | Ne anlatır |\n|---|---|\n| `01-Ariza-IEC-Kesici.md` | Kısa devrenin neden ve nasıl yapıldığını anlatır. |\n| `02-Asimetrik-Ariza-Elle-IEC-Evirici.md` | Dengesiz arızaları sayılarla elle çözer, IEC 60909 hesabını ve evirici katkısını gösterir. |\n\n**IEC** (International Electrotechnical Commission, Uluslararası Elektroteknik Komisyonu) bu klasörde sık geçen standart kuruluşudur. **IEC 60909**, bu kuruluşun kısa devre akımı hesabı için yayımladığı standarttır.\n\n## Alt başlıklar\n\n1. **Kısa devrenin amacı: ekipman, kesici, koruma, topraklama.** Kısa devre hesabının yük akışından farkını ve hangi kararları beslediğini öğreneceksin.\n2. **Arıza türleri ve olasılık sırası.** Hangi arızanın en sık, hangisinin en seyrek olduğunu ve bunun koruma tasarımına etkisini öğreneceksin.\n3. **Thevenin eşdeğeri ve Zbus.** Arıza noktasından bakılan tek empedansın, bara empedans matrisinden (Zbus) nasıl okunduğunu öğreneceksin.\n4. **Simetrik üç faz arızası.** Dengeli arızanın tek bir formülle nasıl çözüldüğünü öğreneceksin.\n5. **Tek faz-toprak, iki faz, iki faz-toprak.** Dengesiz arızaların dizi devreleriyle nasıl bağlanıp elle çözüldüğünü öğreneceksin.\n6. **Arıza direnci ve ark.** Arıza noktasındaki direncin (Z_f) formüle nereden girdiğini öğreneceksin.\n7. **Generatör katkısının zamanı: alt geçici, geçici, sürekli.** Senkron makinenin arıza akımının zamanla neden ve nasıl söndüğünü öğreneceksin.\n8. **Motor ve evirici katkısı.** Asenkron motorun ve eviricinin arızaya ne kadar ve ne kadar süre akım verdiğini öğreneceksin.\n9. **IEC 60909: gerilim katsayısı, empedans düzeltmesi, tepe akım.** Standardın c katsayısını, düzeltme katsayılarını ve tepe akım hesabını öğreneceksin.\n10. **ANSI/IEEE ile IEC’nin farkı (hangi standardı kullandığını söylemek).** ANSI (American National Standards Institute, Amerikan Ulusal Standartlar Enstitüsü) ve IEEE (Institute of Electrical and Electronics Engineers, Elektrik ve Elektronik Mühendisleri Enstitüsü) sorusuna mülakatta nasıl cevap vereceğini öğreneceksin.\n11. **Kesici seçimi: kesme akımı, tepe, DC bileşen, X/R.** DC (doğru akım) bileşeni ve X/R (reaktansın dirence oranı) yüzünden kesicinin neden yalnızca etkin akıma göre seçilemeyeceğini öğreneceksin.\n12. **Bara kısa devre gücünün alt ve üst sınırı.** Çok zayıf ve çok sert baranın neden ayrı ayrı sorun olduğunu öğreneceksin.\n13. **Topraklama biçiminin arıza akımına etkisi.** Topraklama türünün arıza akımı ile aşırı gerilim arasında nasıl bir takas kurduğunu öğreneceksin.\n14. **Yazılımda veri hatası: sıfır dizi, trafo grubu, şönt.** Kısa devre yazılımında sonucu bozan tipik veri eksiklerini öğreneceksin.\n15. **Dağıtımda zayıf kısa devre ve koruma görme sorunu.** Dağıtık üretimin röleyi nasıl körleyebildiğini veya yanlış açtırabildiğini öğreneceksin.\n16. **Arıza yerinin hesaplanması.** Hat uçlarındaki ölçümden arıza mesafesinin nasıl bulunduğunu öğreneceksin.\n"}, {"id": "06-Kisa-Devre/01-Ariza-IEC-Kesici.md", "group": "06  Kısa devre", "title": "Kısa devre analizi", "body": "# Kısa devre analizi\n\n## Ne için yapılır\n\nKısa devre yük akışı değildir. Yük akışı normal işletmeyi hesaplar. Kısa devre ise arıza anını hesaplar.\n\nAmaç, arıza anında akımın ve gerilimin ekipmanı, kesiciyi ve röleyi nasıl zorladığını görmektir.\n\n> Sade anlatım: Bir hatta iletken toprağa ya da başka bir faza değdiğinde çok büyük bir akım akar. Kısa devre hesabı, “bu akım ne kadar büyük olur ve ekipmanım buna dayanır mı, rölem bunu fark eder mi?” sorusunu cevaplar.\n\nKısa devre hesabının beslediği kararlar:\n\n- Kesici kesme akımı ve tepe dayanımı\n- Bara, iletken, topraklama ve termik dayanım\n- Röle görme (pick-up, rölenin çalışmaya başladığı akım eşiği) ve koordinasyon\n- Yeni santral veya evirici bağlanınca kısa devre gücünün artması\n- Zayıf barada korumanın arızayı görememesi\n\n### “En büyük akım üç fazdır” ezberi\n\nÜç faz metalik arıza (araya direnç girmeyen arıza) en büyük dengeli akımı verir sanılır. Oysa tek faz-toprak arızası, sıfır dizi empedansı küçükse ve topraklama katıysa üç fazdan büyük olabilir.\n\n“En büyüğü üç fazdır” ezberi yanlıştır. Her iki hesabı da koştur.\n\n### Olasılık sırası\n\n| Arıza türü | Ne sıklıkta |\n| --- | --- |\n| Tek faz-toprak | En sık |\n| İki faz | Daha seyrek |\n| Üç faz | Daha seyrek |\n\nKoruma her türü görmelidir. Planlama iki ayrı ölçü kullanır:\n\n- Ekipmanı en büyük akıma göre seçer.\n- Röle hassasiyetini en küçük makul arızaya göre seçer.\n\n## Thevenin ve Zbus\n\nThevenin eşdeğeri, bütün şebekeyi arıza noktasından bakınca tek bir gerilim kaynağı ve tek bir seri empedansa indirir.\n\nArıza noktasına doğru Thevenin empedansı, o noktadan bakılan Zbus köşegenidir. Zbus, bara empedans matrisidir. Ybus ise bara admitans matrisidir.\n\nZbus, Ybus’un tersidir. Pratikte ters alınmaz. Bunun yerine dal ekleme veya seyrek çarpanlarla (seyrek matris ayrıştırması) çalışılır.\n\n### Üç faz metalik arıza\n\nAşağıdaki formül, arıza öncesi gerilimi Thevenin empedansına bölerek arıza akımını verir:\n\n```\nI_f = V_pre / Z_th\n```\n\nÖn arıza gerilimi (V_pre) 1 pu alınabilir. pu (per unit, birim değer), büyüklüğün seçilen baz değere oranıdır.\n\nIEC (International Electrotechnical Commission, Uluslararası Elektroteknik Komisyonu) bu gerilimi gerilim katsayısıyla (c) büyütür veya küçültür:\n\n- Azami hesapta cmax\n- Asgari hesapta cmin\n\nTürkiye pratiğinde ekipman seçimi IEC 60909’a dayanır.\n\n> Mülakatta şöyle söyle: “ANSI mi IEC mi?” sorusuna “ekipman ve kesici için IEC 60909, dinamik katkı için zaman tanım bölgesi veya makine modeli” diye cevap ver.\n\nANSI, American National Standards Institute (Amerikan Ulusal Standartlar Enstitüsü) demektir.\n\n### Dengesiz arıza\n\nDengesiz arızada artı, eksi ve sıfır Zbus ayrıdır. Bunlar doğru (artı), ters (eksi) ve sıfır dizi devrelerinin empedans matrisleridir.\n\nArıza noktasında dizi devrelerinin nasıl bağlanacağını gösteren kural `02` klasöründeki tablodur.\n\nTek faz-toprak arıza akımı, üç dizi empedansının ve arıza direncinin toplamından bulunur:\n\n```\nI_f = 3 V_pre / (Z1 + Z2 + Z0 + 3 Z_f)\n```\n\n| Sembol | Anlamı |\n| --- | --- |\n| Z1 | Doğru (artı) dizi Thevenin empedansı |\n| Z2 | Ters (eksi) dizi Thevenin empedansı |\n| Z0 | Sıfır dizi Thevenin empedansı |\n| Z_f | Ark ve direk topraklama direnci |\n\nZ0’ı yanlış girmek bu akımı en çok bozan hatadır.\n\n### Trafo bağlantı grubu ve sıfır dizi\n\nTrafo bağlantı grubu (Yyn, Dyn, YNd) sıfır diziyi geçirip geçirmemeyi belirler.\n\nDyn11 gibi bir dağıtım trafosu, AG (alçak gerilim) tarafındaki toprak arızasının OG (orta gerilim) sıfır dizisine geçişini sınırlar.\n\nGrubu boş bırakılmış model, AG arızasını iletime taşır. Yani gerçekte olmayan bir sıfır dizi akımı iletim tarafında görünür.\n\n## Zaman\n\nSenkron makine arıza akımı zamanla sönümlenir. Her evreyi farklı bir reaktans belirler:\n\n| Evre | Reaktans | Ne olur |\n| --- | --- | --- |\n| İlk çevrimler | Alt geçici reaktans X''d | En büyük AC (alternatif akım) |\n| Ardından | Geçici X'd | Akım azalır |\n| Sürekli hal | Senkron reaktans Xs | Uyarma tavanı belirler |\n\n### DC bileşen ve tepe akım\n\nDC (doğru akım) bileşen, arıza anındaki akı sürekliliğinden gelir. Bobindeki akı bir anda değişemediği için akım dalgası bir yana kayar.\n\nBu bileşen X/R zaman sabitiyle söner. X/R, reaktansın dirence oranıdır.\n\n- Tepe akım AC tepesinin üzerine biner.\n- Kesicinin tepe dayanımı bu yüzden AC etkin değerinden büyüktür.\n- Yüksek X/R (büyük generatör barası, trafo yanı) DC’yi uzatır; kesici asimetrisi artar.\n- IEC’nin κ tepe faktörü X/R’den gelir.\n\n### Diğer kaynaklar\n\n| Kaynak | Arıza katkısı |\n| --- | --- |\n| Asenkron motor | İlk anda kaynak gibi katkı verir, hızla söner. |\n| Statik yük | Katkı vermez. |\n| Evirici | Akım limitine kadar katkı verir. Kontrolü arızayı “beslemeye devam” diye tasarlanmamışsa hızla keser. |\n| Şebeke oluşturan (grid-forming) evirici | Bu davranışı değiştirir; klasik IEC generatör eğrisi ona uymaz. |\n\nYeni santral çalışmasında grid-forming davranışını ayrıca söyle.\n\n## Azami ve asgari\n\nİki hesap iki farklı soruyu cevaplar.\n\n| | Azami kısa devre | Asgari kısa devre |\n| --- | --- | --- |\n| Soru | Ekipman ve kesici dayanır mı? | Röle görüyor mu? |\n| Makineler | Tüm makineler devrede | Zayıf üretim |\n| Gerilim katsayısı | cmax | cmin |\n| Arıza direnci | Düşük | Dirençli arıza |\n| Şebeke / topoloji | Şebeke güçlü | Hat sonu, bakım topolojisi |\n\nDağıtık üretim hat ucundaki kısa devreyi bazen büyütür. Bazen de evirici sınırından dolayı korumanın beklediği kadar büyütmez.\n\n“Arıza akımı arttı, röle daha kolay görür” her zaman doğru değildir; yön ve süre değişir.\n\n### Bara kısa devre gücü\n\nBara kısa devre gücü, baranın arızaya ne kadar güç basabildiğini gösterir:\n\n```\nS_sc = √3 V I_sc\n```\n\n| | Büyük S_sc (sert şebeke) | Küçük S_sc (zayıf şebeke) |\n| --- | --- | --- |\n| Gerilim | Gerilim çökmesi küçük | Gerilim hassas |\n| Ekipman | Ekipman pahalı | — |\n| Harmonik | Harmonik yayılımı kolay | — |\n| Evirici | — | Evirici kararlılığı zor |\n| Koruma | — | Koruma görme zayıf |\n\nBağlantı görüşlerinde her iki uç da sınırdır. Yenilenebilir santral “çok zayıf baraya” ve “aşırı sert baraya” ayrı takılır.\n\n## Arıza yeri\n\nHat uçlarındaki akım veya empedans, arıza noktasını mesafeye çevirir.\n\n- Çift uç yöntemi tek uçtan daha iyidir. Ara yük ve karşılıklı besleme tek ucu kaydırır.\n- PMU (Phasor Measurement Unit, fazör ölçüm birimi) ile iki uç fazörü senkron ise mesafe hesabı klasik empedans rölesinden daha temizdir.\n- SIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) ve geniş alan izleme bu veriyi sistem düzeyinde kullanır. Röle ise kendi bölgesinde kullanır.\n\n## Yazılım kontrol listesi\n\nKısa devre yazılımında sonuca güvenmeden önce şunları sor:\n\n- Artı, eksi, sıfır dizi ayrı mı?\n- Trafo grubu ve nötr topraklama direnci girilmiş mi?\n- Şönt ve hat kapasitesi kısa devrede hangi standarda göre ihmal ediliyor?\n- Generatör X'' mu Xd mu? Sürekli hal reaktansıyla kesici seçilmez.\n- Ön arıza yükü ihmal mi, tam yük mü? IEC belirli bir yöntemi dayatır; karışık kullanma.\n- Paralel yollar ve kuplaj kesicisi topolojiyle uyumlu mu?\n- Sonuç kA (kiloamper), pu ve MVA (megavoltamper) aynı bazda mı?\n\nAşağıdaki konuşma metni bu sayfanın özünü toplar: azami/asgari ayrımı, dizi empedansları, X/R, evirici ve IEC 60909.\n\n## 90 saniye\n\n> “Kısa devreyi ekipman için azami, röle için asgari koştururum. Üç faz Thevenin Z1, tek faz-toprak Z1+Z2+Z0. En büyük akım her zaman üç faz değildir. Generatör katkısı X'' ile başlar, X/R tepeyi belirler. Evirici, senkron makine gibi katkı vermez. IEC 60909 gerilim katsayısı ve empedans düzeltmesiyle kesici seçilir. Sıfır dizi ve trafo grubu boşsa sonuç çöptür.”\n"}, {"id": "06-Kisa-Devre/02-Asimetrik-Ariza-Elle-IEC-Evirici.md", "group": "06  Kısa devre", "title": "Asimetrik arıza", "body": "# Asimetrik arıza\n\nBu sayfa üç şeyi anlatır: dengesiz arızanın simetrik bileşenlerle elle çözümü, IEC 60909 hesabı ve evirici katkısı. IEC, International Electrotechnical Commission (Uluslararası Elektroteknik Komisyonu) demektir.\n\n## Simetrik bileşenler neden var\n\nÜç faz kısa devrede sistem dengeli kalır; tek fazı çözersin.\n\nArızaların büyük çoğunluğu ise tek faz-topraktır ve dengesizdir. Dengesiz üç fazlı devreyi doğrudan çözmek, birbirine bağlı üç denklem demektir.\n\nFortescue'nun fikri: dengesiz herhangi bir üç faz kümesi, üç **dengeli** kümenin toplamı olarak yazılabilir.\n\n| Dizi | Dönüş | Ne zaman oluşur |\n| --- | --- | --- |\n| **Doğru dizi (1)** | Normal dönüş yönü, a-b-c | Sağlıklı şebekenin kendisi. |\n| **Ters dizi (2)** | Ters dönüş, a-c-b | Yalnızca dengesizlik varsa oluşur. |\n| **Sıfır dizi (0)** | Üç faz aynı açıda | Yalnızca toprak yolu varsa akar. |\n\nAşağıdaki denklemler, dizi gerilimlerinden faz gerilimlerine geri dönüşü verir. `a`, fazörü 120° döndüren işleçtir:\n\n```\nV_a = V_0 + V_1 + V_2\nV_b = V_0 + a² V_1 + a V_2             a = 1∠120°\nV_c = V_0 + a V_1 + a² V_2\n```\n\n> Sade anlatım: Yazılımcı gözüyle bu bir baz değişimidir. Faz koordinatlarında birbirine bağlı olan üç denklem, dizi koordinatlarında **birbirinden bağımsız** üç devreye ayrılır. Köşegenleştirme. Her dizi devresini tek fazlı devre gibi çözer, sonra geri dönersin.\n\nHer dizinin kendi empedansı vardır: `Z_1`, `Z_2`, `Z_0`.\n\nYalnızca doğru dizi devresinde gerilim kaynağı bulunur. Çünkü generatörler dengeli gerilim üretir.\n\n## Dört arıza, dört bağlantı\n\nArıza türü, üç dizi devresinin arıza noktasında nasıl bağlanacağını belirler.\n\n| Arıza | Dizi devreleri | Akım |\n| --- | --- | --- |\n| Üç faz | Yalnız doğru dizi | `I = E / Z_1` |\n| Faz-toprak | Üçü **seri** | `I_0 = I_1 = I_2 = E / (Z_1 + Z_2 + Z_0)`, `I_f = 3 I_0` |\n| Faz-faz | Doğru ve ters **paralel** (sıfır yok) | `I_1 = E / (Z_1 + Z_2)`, `I_f = √3 I_1` |\n| İki faz-toprak | Doğru, (ters ∥ sıfır) ile seri | `I_1 = E / (Z_1 + Z_2 ∥ Z_0)` |\n\nTabloda `E` arıza öncesi gerilim, `∥` paralel bağlantıdır.\n\nArıza empedansı `Z_f` varsa faz-toprak formülünün paydasına `3 Z_f` eklenir.\n\n## Elle örnek\n\n### Veriler\n\n- 154 kV bara.\n- Arıza noktasından görülen Thevenin empedansları (100 MVA baz): `Z_1 = Z_2 = j0,2`, `Z_0 = j0,1` pu.\n- Arıza öncesi gerilim 1,0 pu.\n\npu (per unit, birim değer), büyüklüğün baz değere oranıdır. MVA megavoltamper, kV kilovolttur. `j`, empedansın saf reaktif (endüktif) olduğunu gösterir.\n\nBaz akım, pu sonuçları ampere çevirmek için gerekir:\n\n```\nI_baz = 100 MVA / (√3 × 154 kV) = 374,9 A\n```\n\n### 1. Üç faz\n\nYalnız doğru dizi devresi çalışır. Gerilimi doğru dizi empedansına bölüp baz akımla çarparak ampere geçeriz:\n\n```\nI = 1 / 0,2 = 5,00 pu = 1875 A\n```\n\n### 2. Faz-toprak\n\nİlk satır, üç dizi devresi seri olduğu için ortak dizi akımını bulur:\n\n```\nI_0 = 1 / (0,2 + 0,2 + 0,1) = 2,00 pu\n```\n\nİkinci satır, faz akımının dizi akımının üç katı olduğunu kullanır ve ampere çevirir:\n\n```\nI_f = 3 × 2,00 = 6,00 pu = 2249 A\n```\n\nFaz-toprak akımı üç faz akımından **büyük** çıktı.\n\n- Neden: `Z_0 \u003c Z_1`.\n- Nerede olur: yıldız noktası doğrudan topraklı büyük trafoların yakınında.\n- Sonuç: kesici seçerken yalnızca üç faz akımına bakmak bu yüzden yetmez.\n\n#### Sağlam fazın gerilimi\n\nİlk satır, her dizi devresinde kaynak geriliminden empedans üzerindeki düşümü çıkararak dizi gerilimlerini bulur. Ters ve sıfır dizide kaynak olmadığı için yalnızca düşüm kalır.\n\nİkinci satır, dizi gerilimlerini toplayıp arızalı fazın geriliminin sıfır olduğunu doğrular.\n\nÜçüncü satır, dönüşüm denklemiyle sağlam b fazının gerilimini hesaplar:\n\n```\nV_1 = 1 − 0,2 × 2 = 0,6        V_2 = −0,2 × 2 = −0,4        V_0 = −0,1 × 2 = −0,2\nV_a = −0,2 + 0,6 − 0,4 = 0                        (arızalı faz, beklenen)\nV_b = V_0 + a² V_1 + a V_2 = −0,3 − j0,866   →   |V_b| = 0,917 pu\n```\n\nSağlam faz gerilimi düştü.\n\n`Z_0` büyük olsaydı (yüksek empedanslı topraklama) sağlam faz gerilimi yükselirdi. Yalıtılmış sistemde hat gerilimine (1,73 pu) kadar çıkardı.\n\nTopraklama türü, arıza akımı ile aşırı gerilim arasındaki takastır.\n\n| Topraklama | Arıza akımı | Sağlam faz gerilimi |\n| --- | --- | --- |\n| Doğrudan (küçük `Z_0`) | Büyük | Düşer |\n| Yüksek empedanslı / yalıtılmış (büyük `Z_0`) | Küçük | Yükselir, 1,73 pu'ya kadar |\n\n### 3. Faz-faz\n\nİlk satır, doğru ve ters dizi paralel bağlı olduğu için doğru dizi akımını bulur. Sıfır dizi devreye girmez:\n\n```\nI_1 = 1 / (0,2 + 0,2) = 2,50 pu\n```\n\nİkinci satır, faz akımını `√3` katsayısıyla bulur ve ampere çevirir:\n\n```\nI_f = √3 × 2,50 = 4,33 pu = 1623 A\n```\n\n`Z_1 = Z_2` iken faz-faz akımı, üç faz akımının `√3/2 = 0,866` katıdır. Akılda tutmaya değer.\n\n### 4. İki faz-toprak\n\nHer satırın işlevi:\n\n1. Ters ve sıfır dizinin paralel eşdeğerini bulur.\n2. Doğru dizi akımını, doğru dizi empedansı ile bu paralel eşdeğerin seri toplamından bulur.\n3. Doğru dizi akımını akım bölücüyle ters diziye paylaştırır.\n4. Aynı akım bölücüyle sıfır dizi payını bulur.\n5. Toprağa akan akımı sıfır dizi akımının üç katı olarak bulur ve ampere çevirir.\n6. Arızalı fazlardan birinin akımını verir.\n\n```\nZ_2 ∥ Z_0 = (0,2 × 0,1) / 0,3 = 0,0667\nI_1 = 1 / (0,2 + 0,0667) = 3,75 pu\nI_2 = −3,75 × 0,1 / 0,3 = −1,25 pu\nI_0 = −3,75 × 0,2 / 0,3 = −2,50 pu\nToprak akımı = 3 × 2,50 = 7,50 pu = 2812 A\nArızalı faz akımı = 5,73 pu\n```\n\n### Özet\n\n| Arıza | pu | A |\n| --- | --- | --- |\n| Üç faz | 5,00 | 1875 |\n| Faz-toprak | 6,00 | 2249 |\n| Faz-faz | 4,33 | 1623 |\n| İki faz-toprak (toprak akımı) | 7,50 | 2812 |\n\nSayıların tamamı `14-Programlama/ornekler/elle_ornekler.py` ile doğrulanmıştır.\n\n## IEC 60909 ve c katsayısı\n\n### Neden bir kısayol gerekir\n\nYukarıdaki hesap arıza öncesi gerilimi 1,0 pu aldı. Gerçekte arıza öncesi gerilim, yük ve kademe konumu bilinmez.\n\nTam yöntem (süperpozisyon) arıza öncesi yük akışı ister.\n\nIEC 60909 bunun yerine standart bir kısayol tanımlar:\n\n- Arıza noktasına **eşdeğer gerilim kaynağı** `c × U_n / √3` konur.\n- Diğer bütün kaynaklar kısa devre edilir.\n- Yükler ve hat kapasiteleri ihmal edilir.\n\nBaşlangıç simetrik kısa devre akımı, bu eşdeğer kaynağın kısa devre empedansına bölünmesiyle bulunur. `U_n` anma hat gerilimi, `Z_k` kısa devre empedansıdır:\n\n```\nI\"k = c × U_n / (√3 × Z_k)\n```\n\n`c`, bu ihmallerin ve gerilim değişiminin güvenli tarafta kalmasını sağlayan katsayıdır.\n\n| Gerilim | `c_max` (en büyük akım) | `c_min` (en küçük akım) |\n| --- | --- | --- |\n| Alçak gerilim (1 kV'a kadar) | 1,05 veya 1,10 (gerilim toleransına göre) | 0,95 |\n| 1 kV üstü | 1,10 | 1,00 |\n\n### İki hesap, iki amaç\n\n- **En büyük akım (`c_max`):** ekipman dayanımı. Kesicinin kesme kapasitesi, baranın mekanik ve ısıl dayanımı.\n- **En küçük akım (`c_min`):** koruma duyarlılığı. Röle en zayıf arızayı da görebilmeli.\n\n### Elle\n\nAynı bara. İlk adım, pu empedansı baz empedansla (154² / 100 = 237,16 Ω) çarpıp ohm'a çevirir:\n\n```\nZ_k = 0,2 pu × 237,16 Ω = 47,43 Ω\n```\n\nİkinci adım, 1 kV üstü için `c_max = 1,1` alıp IEC formülünü uygular:\n\n```\nI\"k = 1,1 × 154 / (√3 × 47,43) = 2,062 kA\n```\n\n`c` olmadan 1,875 kA bulmuştuk; fark tam %10'dur.\n\n### Standardın diğer büyüklükleri\n\n| Sembol | Anlamı |\n| --- | --- |\n| `I\"k` | Başlangıç simetrik akımı |\n| `i_p` | Tepe akımı: `κ × √2 × I\"k`. Doğru akım bileşeni yüzünden ilk tepe daha yüksektir; `κ` R/X oranına bağlıdır. |\n| `I_b` | Kesme akımı |\n| `I_k` | Sürekli akım |\n| `I_th` | Isıl eşdeğer akım |\n\nR/X, direncin reaktansa oranıdır. Standart ayrıca trafo ve generatör empedanslarına düzeltme katsayıları (`K_T`, `K_G`) uygular.\n\n## Evirici tabanlı üretimin arıza katkısı\n\nSenkron generatör, arızada fiziği gereği anma akımının 5–10 katını verir. Manyetik alanındaki enerjiyi boşaltan bir gerilim kaynağıdır.\n\nEvirici ise yarı iletkenlerini korumak için akımını **kontrol yazılımıyla** sınırlar.\n\n| | Senkron generatör | Evirici (güneş, tam dönüştürücülü rüzgâr, batarya) |\n| --- | --- | --- |\n| Arıza akımı | Anma akımının 5–10 katı | Tipik olarak 1,0–1,2 katı |\n| Davranış | Empedans arkasında gerilim kaynağı | Sınırlı akım kaynağı |\n| Belirleyen | Makine reaktansları | Kontrol algoritması ve şebeke kodu |\n| Ters dizi akımı | Doğal olarak var | Kontrole bağlı; çoğu zaman bastırılır |\n\n### Elle örnek\n\n154 kV'a bağlı 50 MVA santral.\n\nİlk adım, santralin anma akımını bulur; iki kaynağı bu akımın katı olarak karşılaştıracağız:\n\n```\n50 MVA / (√3 × 154 kV) = 187,4 A\n```\n\nİkinci adım, iki kaynağın arıza akımını anma akımıyla çarparak bulur:\n\n- Senkron, `X\"d = 0,2 pu`: `1 / 0,2 = 5 pu` → **937 A**\n- Evirici, 1,2 pu sınır: **225 A**\n\nAynı kurulu güç, dörtte bir arıza akımı.\n\n### Korumaya etkisi\n\n1. **Aşırı akım rölesi.** Arıza akımı yük akımına yaklaşır; röle arızayı yükten ayıramaz. Evirici ağırlıklı adada aşırı akım koruması çalışmayabilir.\n2. **Mesafe rölesi.** Akım sınırlı ve açısı kontrolle belirlendiği için ölçülen empedans yanlış çıkar; erişim kısalır veya uzar.\n3. **Yön ve faz seçimi.** Ters dizi büyüklüklerine dayanan elemanlar, evirici ters dizi akımı vermediğinde yanlış karar verir.\n4. **Düşen kısa devre gücü.** Senkron santraller devreden çıktıkça şebeke zayıflar: gerilim daha çok oynar, evirici kontrolü kararsızlaşabilir. Ölçüsü kısa devre oranıdır (SCR, Short Circuit Ratio).\n5. **Dağıtımda körleme ve yanlış açma.** Fider ortasındaki üretim, fider başındaki rölenin gördüğü akımı azaltır (körleme). Ya da komşu fider arızasına katkı vererek sağlam fideri açtırır.\n\n### Çözüm yönleri\n\n- Şebeke kodunun arıza sırasında reaktif (ve ters dizi) akım enjeksiyonu istemesi\n- Diferansiyel ve haberleşmeli koruma\n- Uyarlamalı ayar\n- Senkron kompanzatör\n- Şebeke kuran evirici\n\n### Standart tarafı\n\nIEC 60909'un 2016 baskısı tam dönüştürücülü üniteleri akım kaynağı olarak hesaba katar.\n\nTürkiye şebeke yönetmeliğinin arıza sırasında istediği reaktif akım eğrisinin sayılarını **doğrulamadım**; rakam verme (`17/02`).\n\n## Yaygın yanlış\n\n| Yanlış cümle | Doğrusu |\n| --- | --- |\n| **\"En büyük arıza akımı her zaman üç fazdır.\"** | `Z_0 \u003c Z_1` ise faz-toprak daha büyüktür. Örnekte 6 pu'ya karşı 5 pu. |\n| **\"Faz-toprak akımı `I_0`'dır.\"** | `3 I_0`'dır. |\n| **\"Faz-faz arızada sıfır dizi akar.\"** | Toprak yolu yoktur, akmaz. |\n| **\"c katsayısı bir güvenlik payıdır, keyfe göre seçilir.\"** | Standartta tanımlıdır ve amaca göre (en büyük, en küçük) seçilir. |\n| **\"Evirici arıza akımına katkı vermez.\"** | Verir; ama küçük, sınırlı ve kontrolle belirlenen bir akım. |\n| **\"Kısa devre gücü düşükse şebeke daha güvenlidir.\"** | Ekipman için evet; gerilim kararlılığı, koruma ve evirici kontrolü için zayıf şebeke demektir. |\n\n## Panel takip sorusu\n\n**\"Dizi devrelerini neden seri bağlıyoruz?\"**\n\n> Mülakatta şöyle söyle: Faz-toprak arızasının sınır koşulları `I_b = I_c = 0` ve `V_a = 0`'dır. Bunları dizi büyüklüklerine çevirince `I_0 = I_1 = I_2` ve `V_0 + V_1 + V_2 = 0` çıkar; bu, seri bağlantının tanımıdır.\n\n**\"Yazılımda faz-toprak akımı sıfır çıkıyor, neden?\"**\n\n> Mülakatta şöyle söyle: Sıfır dizi yolu kapalı. Trafo bağlantı grubu, nötr topraklaması veya sıfır dizi empedans verisi eksik.\n\nAşağıdaki konuşma metni sayfanın özüdür: dizi devreleri, bağlantı kuralı, `Z_0` etkisi, IEC 60909 ve evirici.\n\n## 90 saniye\n\n> \"Dengesiz arızayı simetrik bileşenlerle çözerim: sistemi doğru, ters ve sıfır dizi devrelerine ayırırım; bu üç devre birbirinden bağımsızdır. Arıza türü devrelerin bağlantısını belirler: üç fazda yalnız doğru dizi, faz-toprakta üçü seri, faz-fazda doğru ve ters paralel. Sıfır dizi empedansı küçükse faz-toprak akımı üç fazdan büyük çıkar. IEC 60909, arıza noktasına c katsayılı eşdeğer kaynak koyar; en büyük akımla ekipmanı, en küçük akımla korumayı sınarım. Evirici akımını anma değerinin biraz üstünde sınırlar; bu, aşırı akım ve mesafe korumasını zorlar.\"\n"}, {"id": "07-Guvenlik-Analizi/00-Alt-Basliklar.md", "group": "07  Güvenlik", "title": "07 — Güvenlik analizi", "body": "# 07 — Güvenlik analizi\n\nBu klasör, “şebekede bir şey bozulursa ne olur?” sorusunu sistemli biçimde nasıl sorduğumuzu anlatır. Aşağıdaki başlıklar `01` ve `02` sayfalarında işlenir.\n\n1. **Güvenilirlik, güvenlik ve kararlılık kelimelerinin ayrımı** — Birbirine karıştırılan bu üç kelimenin neyi ölçtüğünü öğreneceksin.\n2. **Normal, N-1, N-1-1, N-2, ortak mod** — Bir, iki veya ardışık eleman kaybının ne demek olduğunu ve ortak nedenli arızanın neden ayrı sayıldığını öğreneceksin.\n3. **Türkiye planlama hükmü: kullanıcı kaybı yok, ada yok** — Türkiye'de N-1 sonrası sistemin hangi koşulları sağlaması gerektiğini öğreneceksin.\n4. **Termik, gerilim ve kararlılık ihlali** — Arıza sonrası hangi limit türlerinin aşılabileceğini öğreneceksin.\n5. **Beklenmeyen durum listesi nasıl kurulur** — Hangi arızaların incelenmeye alınacağını seçmenin mantığını öğreneceksin.\n6. **Tarama ve sıralama (screening, ranking)** — Binlerce arızayı hızlıca eleyip en tehlikeliyi öne almayı öğreneceksin.\n7. **DC elek, AC doğrulama** — Hızlı doğrusal model ile tam modelin nasıl birlikte kullanıldığını öğreneceksin.\n8. **Önleyici ve düzeltici kontrol** — Arızadan önce mi sonra mı müdahale edileceğinin maliyet farkını öğreneceksin.\n9. **AC güvenlik kısıtlı OPF (SCOPF)** — OPF (Optimal Power Flow, optimal güç akışı) problemine N-1 kısıtlarının nasıl eklendiğini öğreneceksin.\n10. **Zincirleme arıza ve ada** — Tek bir açmanın nasıl büyük bir kararmaya dönüşebildiğini öğreneceksin.\n11. **SIPS ve özel koruma şemaları** — SIPS'in (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) zincirlemeyi nasıl kontrollü kayba çevirdiğini öğreneceksin.\n12. **İşletme güvenliği ile planlama güvenliği zaman farkı** — Aynı analizin dakikalık işletmede ve yıllık planlamada nasıl farklılaştığını öğreneceksin.\n13. **Belirsizlik: yük, rüzgâr, güneş, bakım** — Tahmin hatalarının “güvenli” sonucunu nasıl bozabileceğini öğreneceksin.\n14. **Performans: binlerce arıza, dakikalar içinde** — Büyük taramanın süreye nasıl sığdırıldığını öğreneceksin.\n15. **Sonuç raporunun operatör dili** — Analiz çıktısının operatöre hangi biçimde sunulması gerektiğini öğreneceksin.\n"}, {"id": "07-Guvenlik-Analizi/01-N-1-Tarama-SIPS.md", "group": "07  Güvenlik", "title": "Güvenlik analizi", "body": "# Güvenlik analizi\n\nBu sayfa güvenlik analizinin temelini anlatır. Önce üç kelimeyi ayırır. Sonra N-1 kuralını, binlerce arızanın nasıl tarandığını, arızaya karşı iki müdahale türünü, zincirleme arızayı ve SIPS'i işler. Son olarak sonucun operatöre nasıl raporlandığını gösterir.\n\n## Kelimeler\n\nMülakatta en sık karışan üç kelime vardır. Her biri farklı bir soruya cevap verir.\n\n| Kelime | Ne sorar? | Zaman ölçeği | Örnek ölçüt |\n| --- | --- | --- | --- |\n| Güvenilirlik | Enerji uzun dönemde kesintisiz ve yeterli olacak mı? | Uzun dönem (yıllar) | LOLE, EENS, SAIDI |\n| Güvenlik (security) | Şu anki işletme anında makul bir arıza olsa sistem limitler içinde kalır mı? | Belirli bir işletme anı | N-1 |\n| Kararlılık | Bozucu etkiden sonra sistem yeni bir dengeye oturur mu? | Bozucu etkiden sonraki saniyeler | Açı, gerilim, frekans kararlılığı |\n\nKısaltmalar:\n\n- **LOLE** (Loss of Load Expectation, yük kaybı beklentisi): yükün karşılanamayacağı beklenen süre.\n- **EENS** (Expected Energy Not Supplied, beklenen karşılanmayan enerji): verilemeyecek enerji miktarının beklentisi.\n- **SAIDI** (System Average Interruption Duration Index, sistem ortalama kesinti süresi indeksi): müşteri başına ortalama kesinti süresi.\n\nGüvenilirlik bu ailedendir. Güvenlik ise bir işletme anına bakar; N-1 onun işletme kuralıdır.\n\nKararlılık açı, gerilim veya frekans olarak bozulabilir. Bir durum termik olarak N-1 güvenli olup dinamik olarak kararsız olabilir. Yani termik hesap “sorun yok” dese bile salınım başlayabilir.\n\n> **Sade anlatım:** Güvenilirlik “uzun vadede ışık hep yanar mı?”, güvenlik “şimdi bir hat koparsa limitler aşılır mı?”, kararlılık “sarsıntıdan sonra sistem yerine oturur mu?” sorusudur.\n\n> **Mülakatta şöyle söyle:** Üç kelimeyi aynı cümlede “sağlam” diye birleştirme.\n\n## N-1\n\nN-1, “sistemden bir eleman eksilince de çalışabilmeli” kuralıdır. Eksilen eleman bir iletim elemanıdır: hat, trafo, büyük üretim ünitesi, bara kesiti, bazen büyük yük.\n\nBu eleman devre dışıyken şu altı koşul sağlanmalıdır:\n\n- Kalan hat ve trafolar termik limitin altında\n- Gerilimler işletme bandında\n- Frekans bandında\n- Kararlılık bozulmuyor\n- Kullanıcı kaybedilmiyor\n- Sistem adalara bölünmüyor\n\nBu liste Elektrik Şebeke Yönetmeliği'nin planlama ve işletme diliyle uyumludur. Yönetmeliğe göre iki ek hüküm vardır:\n\n- Planlama yükü puantın %5 üzeridir. Puant, yılın en yüksek tüketim anıdır.\n- Nükleer bağlantıda N-2 aranır.\n\n### N-1-1, N-2 ve ortak mod\n\n| Durum | Ne olur? | Neden önemli? |\n| --- | --- | --- |\n| N-1-1 | Bir eleman bakımdayken ikinci eleman arızalanır. | Yaz bakımı ile yaz puantı çakışırsa asıl risk budur. |\n| N-2 | İki eleman aynı anda devre dışı kalır. | Ortak nedenli olaylar bu sınıfa girer. |\n| Ortak mod | Ortak direkte çift devre, ortak koridor, ortak kesici arızası. | Bağımsız iki arıza değildir; olasılığı iki bağımsız arızadan yüksektir. |\n\n> **Sade anlatım:** Aynı direği paylaşan iki hat, iki ayrı şanssızlık değildir. Direk düşerse ikisi birden gider.\n\n### Bara arızası\n\nBara arızası N-1'in ağır halidir. Bara, birçok hattın ve trafonun bağlandığı ortak iletkendir; o giderse bağlı her şey etkilenir.\n\nKesici ve yarım düzen (breaker-and-a-half), bara arızasında kaybı sınırlamak için vardır. Model barayı tek düğüm görüyorsa bu arızayı temsil edemez.\n\n## Tarama\n\nTürkiye iletiminde eleman sayısı binlerle ölçülür. Her biri için tam AC (alternatif akım, tam doğrusal olmayan) analiz artı dinamik simülasyon, işletme döngüsüne sığmaz.\n\nYTBS (Yük Tevzi Bilgi Sistemi, MAM'ın enerji yönetim platformu) duyurusundaki “4000'den fazla arıza simülasyonu” bu işin endüstriyel ölçeğidir. MAM, TÜBİTAK Marmara Araştırma Merkezi'dir.\n\nÇözüm, işi katmanlara bölmektir. Her katman bir öncekinin elediği vakalarla uğraşır:\n\n1. **Liste.** Topoloji, bakım, fırtına koridoru, daha önce ihlal üretmiş elemanlar. Her hattı kör taramak ile akıllı listelemek yazılım tasarımıdır.\n2. **DC elek.** DC (doğru akım yaklaşımı, yalnız aktif güç ve açı kullanan doğrusal model) ile hesaplanır. LODF (Line Outage Distribution Factor, hat açma dağılım katsayısı) ile açılma sonrası akış bulunur. Termik ihlali hızlı eler. Gerilimi görmez.\n3. **Sıralama.** İhlal miktarı, ihlal sayısı ve ağırlık (400 kV hat, santral çıkışı) birlikte değerlendirilir.\n4. **AC doğrulama.** Elekten geçenler Newton-Raphson ile çözülür. Burada Q (reaktif güç) limiti, kademe ve gerilim görülür.\n5. **Dinamik seçki.** Büyük üretim kaybı, zayıf koridor, daha önce salınım görülen kesitler için zaman tanım bölgesi veya hızlı kararlılık metriği kullanılır. Her N-1 için 10 saniyelik dinamik koşmak işletme aracında ancak seçilerek yapılır. YTBS'nin geçici hal modülü bu seçkinin ürün tarafıdır.\n\n### Performans indeksi\n\nSıralama adımında klasik ölçüt performans indeksidir (PI). Her arızaya tek bir sayı verir; büyük olan önce incelenir.\n\n```\nPI = Σ (S_i / S_i,max)^(2n)\n```\n\n- `S_i`: arıza sonrası i. hattın akışı.\n- `S_i,max`: o hattın limiti.\n- `n`: üstel. Yüksek n, limite yakın hatları öne çıkarır.\n\nElle örnek ve üssün etkisi `02` sayfasındadır.\n\n## Önleyici ve düzeltici\n\nArızaya iki zamanda hazırlanabilirsin: arızadan önce veya arızadan sonra.\n\n| | Önleyici kontrol | Düzeltici kontrol |\n| --- | --- | --- |\n| Ne zaman | Arıza olmadan | Arızadan sonra |\n| Ne yapar | Çalışma noktasını güvenli bölgeye çeker | İhlali sonradan giderir |\n| Araçlar | Üretimi kaydır, trafo kademesini değiştir, şönt al, kısıtlı hatta akışı azalt | Üretim kaydırma, yük atma, şema (SIPS), gerilim cihazı |\n| Maliyet | Arıza olmadan da ödenir | Daha ucuz işletilir, çünkü her arıza olmaz |\n| Şart | — | Eylemin yetişeceği süre ve güvenilirlik kanıtlanmalıdır |\n\nYönetmelik ve işletme prosedürü, hangi ihlalin düzelticiye bırakılacağını söyler.\n\nTermik limitin kısa süreli acil değeri ile sürekli değeri farklıdır. 15 dakikalık acil limit, operatöre düzeltici süre tanır. Hat bu süre boyunca biraz fazla yük taşıyabilir; operatör de bu arada müdahale eder.\n\n### SCOPF\n\nSCOPF (Security-Constrained Optimal Power Flow, güvenlik kısıtlı optimal güç akışı), önleyici kaydırmayı ekonomik amaçla birlikte çözer.\n\n- **Amaç fonksiyonu:** üretim maliyeti veya kayıp.\n- **Kısıtlar:** hem baz durum hem seçilmiş N-1.\n\nTam N-1 kısıt kümesi çok büyüktür. Pratik çözüm, önce ihlal adaylarını bulup sadece onları kısıta almaktır (contingency filtering, arıza süzme). Ayrıntı `11` ve `13` içindedir.\n\n## Zincirleme ve SIPS\n\nZincirleme arıza şöyle ilerler:\n\n1. Bir hat açılır.\n2. Akış komşuya yüklenir.\n3. Komşu da açar.\n4. Ada oluşur.\n5. Frekans çöker.\n\n2000'lerin büyük kararmaları bu desendedir. Koruma kendi ekipmanını kurtarırken sistemi parçalayabilir.\n\nSIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) bu döngüyü geniş alan ölçümüyle görür. Sonra daha küçük ve kontrollü bir kayıp verir: seçilmiş üretim veya yük atılır, sistemin geri kalanı kalır.\n\n> **Sade anlatım:** SIPS, yangının yayılmasını beklemek yerine bir odayı bilerek kapatan itfaiyecidir. Küçük bir kayıp, büyük kararmayı önler.\n\n### SIPS tasarım soruları\n\n- Hangi koridor, hangi ölçüm, hangi eşik?\n- Eylem yük atma mı, üretim kısıntısı mı, ada kontrolü mü?\n- Yanlış tetik ve kaçırılmış tetik maliyeti nedir?\n- Haberleşme gecikmesi eylemi anlamsız kılıyor mu? Kararlılık eylemi yüz milisaniye–birkaç saniye penceresindedir. Dakikalık SCADA (Supervisory Control and Data Acquisition, denetleyici kontrol ve veri toplama) bu pencereye yetişmez. PMU (Phasor Measurement Unit, fazör ölçüm birimi) ve yerel şema yetişir.\n- Eylem sonrası sistem N-1'e geri dönebiliyor mu?\n\nMAM SIPS sayfası tam olarak bu katmanı anlatır: PMU sınıfı senkron veri, otomatik eylem, kayıt, operatör arayüzü.\n\n## Belirsizlik\n\nTek bir yük akışı “güvenli” diyebilir. Ama şu üç şey bu sonucu bozar:\n\n- Yük tahmin hatası\n- Rüzgâr sapması\n- Plansız devre dışı kalma\n\nİşletme aracı en azından yakın senaryoları koşar:\n\n- Tahmin üst bandı\n- En büyük yenilenebilir sapması\n- Planlı bakım\n\nStokastik güvenlik, her N-1'e bir olasılık bağlar. Ürün tarafında bunun sade hali, “kritik senaryo seti”dir.\n\n> **Mülakatta şöyle söyle:** Stokastik optimizasyon anlatıp ürünü unutma; önce senaryo setini söyle.\n\n## Rapor\n\nOperatörün okuyacağı çıktı Jacobian değildir. Jacobian, Newton-Raphson'un iç matrisidir; operatöre bir şey söylemez. Rapor şunları içermelidir:\n\n- İhlal eden eleman, yüzde, limit türü (sürekli, acil)\n- Hangi arıza bu ihlali doğurdu\n- Önerilen düzeltici: hangi santral, hangi yönde, kaç MW\n- Gerilim için hangi bara, hangi şönt veya kademe\n- Eylemin yeni ihlal doğurup doğurmadığı (düzeltici sonrası tekrar tarama)\n\nAşağıdaki konuşma metni sayfanın sözlü özetidir. İçindeki kısaltmalar yukarıda açıldı: N-1, DC, AC, SIPS, YTBS.\n\n## 90 saniye\n\n> **Mülakatta şöyle söyle:** “Güvenlik, arıza olduktan sonra limitlerin içinde kalmaktır. Türkiye kriteri N-1'de termik, gerilim, frekans, kararlılık, kullanıcı ve ada. Taramayı DC elek artı AC doğrulama artı seçilmiş dinamik diye katmanlarım. Önleyici kontrol arızadan önce maliyeti öder, düzeltici sonra öder. Zincirlemeyi SIPS, geniş alan ölçümüyle küçük ve kontrollü bir kayba çevirir. YTBS'deki güvenlik ve arıza simülasyonu bu zincirdir.”\n"}, {"id": "07-Guvenlik-Analizi/02-Siralama-AC-DC-N-1-1-SCOPF-Marj.md", "group": "07  Güvenlik", "title": "Sıralama, N-1-1, SCOPF, marj", "body": "# Sıralama, N-1-1, SCOPF, marj\n\nBu sayfa güvenlik analizinin hesap tarafını anlatır. Başlık konularının tamamı şunlardır: beklenmeyen durum sıralaması, AC ve DC N-1, N-1-1, SCOPF, güvenlik marjı.\n\nKısaltmalar:\n\n- **AC** (alternatif akım) yük akışı: gerilim genliği, açı, aktif ve reaktif gücü birlikte çözen tam, doğrusal olmayan model.\n- **DC** yük akışı: yalnız aktif güç ve açıyı kullanan doğrusal yaklaşım.\n- **LODF** (Line Outage Distribution Factor, hat açma dağılım katsayısı): bir hat açılınca akışının diğer hatlara hangi oranla dağıldığını veren katsayı.\n- **SCOPF** (Security-Constrained Optimal Power Flow): güvenlik kısıtlı optimal güç akışı.\n- **SIPS** (System Integrity Protection Scheme): sistem bütünlüğü koruma şeması, yani özel koruma sistemi.\n- **pu** (per unit, birim değer): büyüklüğün seçilmiş bir taban değere oranı.\n\n## Problem\n\nGüvenlik analizi şunu sorar: şu anki işletme noktasında herhangi bir eleman devre dışı kalırsa sistem sınırlar içinde kalır mı?\n\nZorluk ölçektir:\n\n- Türkiye ölçeğinde binlerce hat ve trafo vardır.\n- Operatör bu cevabı birkaç dakikada bir, taze durum kestirimiyle isteyecektir.\n- Hepsini tam AC yük akışıyla çözmek pahalıdır.\n- Çoğu arıza da zararsızdır.\n\nÇözüm üç kademelidir. Aşağıdaki akış, vakaların her kademede nasıl azaldığını gösterir: ucuz yöntem herkese, pahalı yöntem yalnız kritik olanlara uygulanır.\n\n```\nBütün arızalar  →  hızlı tarama (DC, LODF)  →  sıralama  →  kritik olanlara AC yük akışı  →  en kritiklere dinamik benzetim\n```\n\n## Performans indeksi ile sıralama\n\nHer arıza için tek bir sayı üretilir; büyük olan önce incelenir. Aşağıdaki iki formül, biri hat akışları biri bara gerilimleri için bu sayıyı hesaplar.\n\n```\nPI_akış    = Σ  w_l (P_l / P_l,sınır)^(2n)\nPI_gerilim = Σ  w_i (|V_i − V_i,nom| / ΔV_sınır)^(2n)\n```\n\n| Sembol | Anlamı |\n| --- | --- |\n| `PI` | Performans indeksi |\n| `w_l`, `w_i` | Hat veya baranın önem ağırlığı |\n| `P_l / P_l,sınır` | Hattın yüklenme oranı |\n| `|V_i − V_i,nom| / ΔV_sınır` | Gerilimin nominalden sapmasının izin verilen sapmaya oranı |\n| `n` | Üstel |\n\n`n = 1` hesabı kolaydır ama **maskeleme** yapar: çok sayıda orta yüklü hat, tek bir aşırı yüklü hattan daha yüksek puan alabilir. `n` büyüdükçe indeks, en kötü elemana odaklanır.\n\n> **Sade anlatım:** Oran 1'den küçükse yüksek kuvvet onu sıfıra yaklaştırır, 1'den büyükse şişirir. Böylece büyük üs, limiti aşan hattı öne iter.\n\n### Elle örnek\n\n**Adım 1 — Şebekeyi kur.** Bu adım, hesabın hangi şebeke ve hangi sınırlarla yapılacağını belirler.\n\n`03` klasöründeki üç baralı şebeke kullanılır. Sınırlar: hat 1–2 için 0,5; hat 1–3 ve 2–3 için 0,6 pu.\n\n**Adım 2 — Her arıza için kalan akışları ve yüklenmeyi yaz.** Bu adım, her hat açıldığında geri kalan hatların ne kadar yüklendiğini gösterir. Yüklenme, akışın sınıra bölünmesidir.\n\nArıza sonrası akışlar (DC):\n\n| Arıza | Kalan hat akışları | Yüklenme |\n| --- | --- | --- |\n| 1–3 açık | 1–2: 0,30 ve 2–3: 0,80 | %60 ve **%133** |\n| 1–2 açık | 1–3: 0,30 ve 2–3: 0,50 | %50 ve %83 |\n| 2–3 açık | 1–2: 0,50 ve 1–3: 0,80 | %100 ve **%133** |\n\n**Adım 3 — `n = 1` ile indeksi hesapla.** Bu adım, her yüklenme oranının karesini alıp toplar ve arızaya tek bir puan verir (ağırlıklar 1 alınmıştır).\n\n`n = 1` ile:\n\n```\n1–3 açık:  0,60² + 1,333² = 0,36 + 1,78 = 2,14\n1–2 açık:  0,50² + 0,833² = 0,25 + 0,69 = 0,94\n2–3 açık:  1,00² + 1,333² = 1,00 + 1,78 = 2,78\n```\n\n**Adım 4 — Sırala.** Bu adım, puanı en büyük arızayı incelenecekler listesinin başına koyar.\n\nSıra: 2–3, sonra 1–3, sonra 1–2.\n\n**Adım 5 — Üssü büyüt ve karşılaştır.** Bu adım, yüksek üssün ihlalli ve ihlalsiz vakaları ne kadar net ayırdığını gösterir.\n\n`n = 5` ile değerler 18,8; 17,8 ve 0,16 olur. İhlal olan ile olmayan arasındaki fark 3 kattan 100 kata çıktı; ayrım netleşti.\n\n**Adım 6 — Sonucu yorumla.** Bu adım, sayının arkasındaki işletme veya planlama sorununu okur.\n\nİkinci ders: bara 3'ün 0,8'lik yükü, her biri 0,6 taşıyabilen iki hatla besleniyor. Birini kaybedince diğeri yetmez. Bu, **üretimi yeniden dağıtarak çözülemez**, çünkü bara 3'e başka yol yoktur.\n\nGeriye üç seçenek kalır:\n\n- Yük atma\n- Bara 3'te yerel üretim\n- Üçüncü bir hat\n\nBu bir işletme değil **planlama** sorunudur.\n\n## DC ile AC N-1\n\nİki model birbirinin rakibi değil, tamamlayıcısıdır. DC eler, AC doğrular.\n\n| | DC tarama | AC doğrulama |\n| --- | --- | --- |\n| Model | `P = B θ`, doğrusal | Tam doğrusal olmayan yük akışı |\n| Hız | Çok hızlı; LODF ile çözüm bile gerekmez | Her arıza için yineleme |\n| Görür | Aktif güç akışı, ısıl aşırı yük | Isıl, gerilim, reaktif sınır |\n| Görmez | Gerilim, reaktif güç, kayıp | Dinamik davranış |\n| Hata | İletimde akışta tipik olarak birkaç yüzde; ağır yükte ve yüksek R/X'te artar | Model ve veri kadar doğru |\n| Yakınsama | Her zaman çözer | Yakınsamayabilir; bu da bir bulgudur |\n\n`P = B θ` formülünde `P` bara aktif güçleri, `B` susseptans matrisi, `θ` bara açılarıdır. R/X, hattın direncinin reaktansına oranıdır.\n\nKurallar:\n\n- DC taramada sınıra yakın çıkan (örneğin %90 üstü) her vakayı AC'ye gönder. DC'nin hata payı kadar tampon bırak.\n- Gerilim sorunu olduğu bilinen bölgeleri DC sonucuna bakmadan AC ile çöz.\n- AC yakınsamazsa vakayı atma. Gerilim çökmesi adayıdır ve listenin başına yazılır.\n- Arıza sonrası otomatik tepkileri modelle:\n  - generatör reaktif sınırları,\n  - kademe değiştirici,\n  - özel koruma sistemi,\n  - salınım barası yerine üretimin governor (hız regülatörü) payına göre dağıtılması.\n\n## N-1-1 ve N-2\n\n| Ölçüt | Tanım | Örnek veya kural |\n| --- | --- | --- |\n| **N-1** | Tek eleman kaybı | Türkiye şebeke yönetmeliğinin planlama ölçütü (nükleer bağlantı noktasında N-2) |\n| **N-2** | İki elemanın **aynı anda** kaybı | Ortak direkteki çift devre hat, bara arızası, kesici arızası gibi ortak nedenli olaylar |\n| **N-1-1** | Bir eleman kaybedilir, operatör sistemi **yeniden ayarlar** (30 dakika gibi bir sürede), sonra ikinci eleman kaybedilir | Bakım sırasında ikinci arıza |\n\nN-1-1'in N-2'den farkı aradaki ayardır. İlk arızadan sonra sistem N-1 güvenli değildir; operatörün işi onu yeniden N-1 güvenli hale getirmektir.\n\nBakım planlaması da aynı mantıktır: bir hat bakıma alındığında kalan sistem N-1 sağlamalıdır.\n\nVaka sayısı hızla büyür:\n\n- `n` eleman için N-1 `n` vakadır.\n- N-2 yaklaşık `n²/2` vakadır. 5.000 eleman için 12,5 milyon.\n\nHepsi çözülmez; ortak nedenli ve ağır sonuçlu çiftler seçilir.\n\n## SCOPF: güvenlik kısıtlı optimal güç akışı\n\nOPF (Optimal Power Flow, optimal güç akışı), en ucuz üretimi şebeke sınırları içinde bulur. SCOPF, buna \"her N-1 durumunda da sınırlar korunmalı\" koşulunu ekler.\n\nAşağıdaki problem, baz durum maliyetini en küçüklerken her arıza durumunda da denklemlerin ve sınırların sağlanmasını ister.\n\n```\nen küçük  maliyet(u_0)\nöyle ki   baz durum denklemleri ve sınırları        g_0(x_0, u_0) = 0,  h_0 ≤ 0\n          her k arızası için                        g_k(x_k, u_k) = 0,  h_k ≤ 0\n          |u_k − u_0| ≤ Δu_k                        (arıza sonrası yapılabilecek ayar)\n```\n\n| Sembol | Anlamı |\n| --- | --- |\n| `u_0` | Baz durumdaki kontrol değişkenleri (üretim, kademe vb.) |\n| `x_0`, `x_k` | Baz ve k. arıza durumundaki durum değişkenleri (gerilim, açı) |\n| `g` | Yük akışı denklemleri |\n| `h` | Sınırlar (akış, gerilim) |\n| `Δu_k` | Arızadan sonra kontrolde izin verilen değişim |\n\nİki tür:\n\n- **Önleyici (preventive):** `Δu = 0`. Baz durum öyle seçilir ki arızadan sonra **hiçbir şey yapmadan** sınırlar korunur. Pahalı, basit, güvenli.\n- **Düzeltici (corrective):** arızadan sonra kısa sürede yapılabilecek ayarlara izin verir (hızlı yeniden dağıtım, faz kaydırıcı, özel koruma sistemi). Daha ucuz; ama o ayarın gerçekten zamanında yapılacağına güvenir. Hatların kısa süreli aşırı yük dayanımı bu zamanı verir.\n\n### Boyut sorunu\n\nHer arıza, değişkenlerin bir kopyasını ekler. Bin arıza, bin katı büyük problem demektir.\n\nPratik çözüm, arızaların çoğunun bağlayıcı olmamasına dayanır:\n\n1. Önce arızasız çöz.\n2. İhlal üreten arızaları bul.\n3. Yalnız onları ekle.\n4. Tekrar çöz.\n\nBu yönteme kısıt üretimi denir; Benders ayrıştırması da bu ailedendir.\n\n### SIPS ile bağ\n\nSIPS düzeltici bir eylemdir. Sistemi, önleyici ölçütün izin verdiğinden daha yüklü ve daha ucuz işletmeyi mümkün kılar. Karşılığında SIPS'in güvenilirliği sistemin güvenliğinin parçası olur.\n\n## Güvenlik marjı\n\n\"Güvenli\" evet-hayır değil, mesafedir. Dört marj vardır:\n\n| Marj | Tanım | Örnek |\n| --- | --- | --- |\n| Isıl | `(sınır − arıza sonrası akış) / sınır` | Sınır 0,6; akış 0,5 → %17 |\n| Gerilim kararlılığı | Çökme noktasına kadar artırılabilecek yük (MW) | P–V eğrisinin burnuna uzaklık |\n| Geçici hal | Kritik temizleme süresi − koruma temizleme süresi | 302 ms − 150 ms = 152 ms |\n| Frekans | Kalan yedek, en büyük ünite kaybına göre | Atalet ve primer yedek |\n\nIsıl örneğin adımı: `(0,6 − 0,5) / 0,6` hesaplanır; bu, hattın sınırına kadar kalan payı oran olarak verir.\n\nGeçici hal örneğinin adımı: kritik temizleme süresinden (302 ms) korumanın arızayı gerçekte temizlediği süre (150 ms) çıkarılır; kalan 152 ms, korumanın gecikebileceği zaman payıdır.\n\nMarj neden bırakılır?\n\n- Tahmin hatası\n- Model hatası\n- Ölçüm hatası\n- Zaman gecikmesi\n\nMarj fazlaysa şebeke boşa çalışır, azsa risk büyür. Olasılıksal güvenlik değerlendirmesi, marjı sabit bir yüzde yerine arıza olasılığı ve sonucuyla tartar.\n\n### Operatör durumları\n\n| Durum | Anlamı |\n| --- | --- |\n| **Normal** | N-1 güvenli |\n| **Alarm** | Sınırlar içinde ama N-1 güvenli değil |\n| **Acil** | Sınır ihlali var |\n| **Çöküş** | Sistem parçalanmış veya kararmış |\n| **Toparlanma** | Sistem yeniden kuruluyor |\n\nGüvenlik analizinin işi, sistemi alarm durumuna girmeden önce uyarmaktır.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"N-1, bir santral kaybı demektir.\"** | Hat, trafo, generatör, bara, kompanzatör: herhangi bir tek eleman. |\n| **\"DC taramada ihlal yoksa sistem güvenlidir.\"** | DC gerilimi görmez. |\n| **\"AC yakınsamadıysa vaka bozuktur, atlarım.\"** | En tehlikeli vaka o olabilir. |\n| **\"N-1-1 ile N-2 aynıdır.\"** | Arada operatörün ayarı vardır. |\n| **\"Her ihlal yeniden dağıtımla çözülür.\"** | Elle örnekteki gibi, yük tek koridordan besleniyorsa çözülmez. |\n| **\"Performans indeksi yüksekse ihlal vardır.\"** | `n = 1` ile ihlalsiz bir vaka, ihlalli bir vakanın üstüne çıkabilir. |\n\n## Panel takip sorusu\n\n**\"Beş bin arızayı beş dakikada nasıl koşarsın?\"**\n\n> **Mülakatta şöyle söyle:** LODF ile doğrusal tarama, sınıra yakın olanlara AC; AC vakaları bağımsızdır, paralel koşarım; hepsi aynı baz çözümden başlar; baz matrisin çarpanlarını tek hat çıkarma için düşük ranklı güncellemeyle yeniden kullanırım.\n\nDüşük ranklı güncelleme, tek bir hat çıkınca matrisi baştan ayrıştırmak yerine eski ayrıştırmayı küçük bir düzeltmeyle yeniden kullanmaktır.\n\n**\"Önleyici mi düzeltici mi?\"**\n\n> **Mülakatta şöyle söyle:** Düzeltici eylem hızlı, otomatik ve güvenilirse düzeltici daha ekonomiktir. Eylem operatöre bağlıysa veya süre yetmiyorsa önleyici. Gerçek sistemde ikisi karışıktır.\n\nAşağıdaki konuşma metni sayfanın sözlü özetidir. İçinde “doğrusal model” DC yük akışını, “hat açma katsayıları” LODF'yi, “güvenlik kısıtlı optimal güç akışı” SCOPF'yi anlatır.\n\n## 90 saniye\n\n> **Mülakatta şöyle söyle:** \"Güvenlik analizinde bütün tek eleman kayıplarını üç kademede tararım. Önce doğrusal modelle ve hat açma katsayılarıyla hızlı tarama yapar, performans indeksiyle sıralarım; indeksin üssünü yüksek tutarım ki orta yüklü çok hat tek bir ağır ihlali maskelemesin. Sınıra yakın vakaları AC yük akışıyla doğrularım, çünkü doğrusal model gerilimi görmez; yakınsamayan vaka da bir bulgudur. Güvenlik kısıtlı optimal güç akışı bu denetimi üretim planına gömer: önleyici olan arızadan sonra hiçbir şey yapmadan, düzeltici olan hızlı bir eylemle sınırı korur. Sonucu marj olarak raporlarım.\"\n"}, {"id": "08-Kararlilik/00-Alt-Basliklar.md", "group": "08  Kararlılık", "title": "08 — Kararlılık", "body": "# 08 — Kararlılık\n\nBu sayfa bölümün içindekiler listesidir. Her maddenin yanında, o konuyu çalışınca ne öğreneceğin yazıyor. Konuların ayrıntısı `01`, `02` ve `03` dosyalarındadır.\n\n**Kararlılık**, şebeke bir arıza ya da ani değişiklikle \"itildiğinde\" ayakta kalıp kalamayacağı sorusudur. Aşağıdaki maddeler bu soruyu adım adım açar.\n\n## Bölümdeki dosyalar\n\n| Dosya | Ne anlatır |\n| --- | --- |\n| [01 — Açı, gerilim, frekans](01-Aci-Gerilim-Frekans.md) | Kararlılığın üç ailesi, frekans katmanları, hızlı kestirim ve hangi çalışmaya hangi model. Bölümün genel haritası. |\n| [02 — Salınım denklemi ve eşit alan](02-Salinim-Denklemi-Esit-Alan-Elle.md) | Rotorun hareket denklemi, eşit alan ölçütünün çizimi ve kritik temizleme süresinin elle hesabı. |\n| [03 — Düşük atalet, RoCoF, GFM/GFL, özdeğer](03-Dusuk-Atalet-RoCoF-GFM-GFL-Ozdeger.md) | Ataletin neden düştüğü, frekans değişim hızı, iki evirici türü ve küçük sinyal kararlılığı. |\n\n## Alt başlıklar\n\n1. **Kararlılığın tanımı ve üç ailesi: açı, frekans, gerilim.** Sistem itildiğinde neden üç ayrı fiziğe bakıldığını ve her ailenin neyi dengelediğini öğreneceksin.\n2. **Küçük bozucu ve büyük bozucu.** Ne zaman doğrusal modelin yettiğini, ne zaman zaman tanım bölgesi simülasyonu gerektiğini öğreneceksin.\n3. **Kısa ve uzun dönem.** Aynı kararlılık sorununun saniyeler ve dakikalar ölçeğinde nasıl farklı göründüğünü öğreneceksin.\n4. **Salınım denklemi, atalet sabiti H.** Rotor için Newton yasasını ve H'ın saniye cinsinden ne anlama geldiğini öğreneceksin.\n5. **Eşit alan kriteri ve kritik temizleme açısı.** Diferansiyel denklem çözmeden, alan karşılaştırarak kararlılığa nasıl karar verildiğini öğreneceksin.\n6. **Çok makineli geçici hal, kritik temizleme süresi.** Gerçek sistemde kritik sürenin nasıl bulunduğunu ve koruma süresiyle nasıl kıyaslandığını öğreneceksin.\n7. **Zaman tanım bölgesi simülasyonu.** Diferansiyel denklemlerin adım adım sayısal çözümünün neyi gösterdiğini öğreneceksin.\n8. **Küçük sinyal: doğrusal model, özdeğer, sönüm oranı.** Özdeğerin gerçek ve sanal kısmından sönüm ve frekansın nasıl okunduğunu öğreneceksin.\n9. **Yerel mod, bölgeler arası mod, kontrol modu.** Salınım türlerini frekans aralıklarıyla birlikte ayırt etmeyi öğreneceksin.\n10. **PSS, AVR, hız regülatörü.** Güç sistemi dengeleyicisi (PSS, Power System Stabilizer), otomatik gerilim regülatörü (AVR, Automatic Voltage Regulator) ve hız regülatörünün kararlılıktaki rolünü öğreneceksin.\n11. **Gerilim kararlılığı: PV, QV, burun, modal analiz.** Güç–gerilim (PV) ve reaktif güç–gerilim (QV) eğrilerinden marjın ve zayıf baranın nasıl bulunduğunu öğreneceksin.\n12. **OLTC ve yük toparlanmasının gerilim çökmesine katkısı.** Yük altında kademe değiştiricinin (OLTC, On-Load Tap Changer) gerilimi kurtarmaya çalışırken çöküşü nasıl hızlandırdığını öğreneceksin.\n13. **Frekans kararlılığı, RoCoF, UFLS.** Frekans değişim hızını (RoCoF, Rate of Change of Frequency) ve düşük frekansta yük atmayı (UFLS, Under-Frequency Load Shedding) öğreneceksin.\n14. **Primer, sekonder, tersiyer; Türkiye eşikleri.** Frekans kontrol katmanlarının sürelerini ve yönetmelikteki sayısal eşikleri öğreneceksin.\n15. **Düşük atalet ve evirici tabanlı kaynak.** Güneş ve rüzgâr arttıkça ataletin neden düştüğünü, şebeke izleyen ve şebeke kuran eviricinin farkını öğreneceksin.\n16. **Geçici hal kararlılığının kestirimi (hızlı metrik ve öğrenen model).** İşletmede saniyeler içinde \"bu arıza kararlı mı\" sorusunun nasıl yanıtlandığını öğreneceksin.\n17. **Hangi çalışmanın hangi modele ihtiyacı olduğu.** Yük akışı, RMS (efektif değer, fazör tabanlı) dinamik ve EMT (elektromanyetik geçici) modelleri arasında doğru seçimi yapmayı öğreneceksin.\n"}, {"id": "08-Kararlilik/01-Aci-Gerilim-Frekans.md", "group": "08  Kararlılık", "title": "Kararlılık", "body": "# Kararlılık\n\n## Kararlılık ne demek\n\nBir çalışma noktası yük akışında vardır. Yük akışı, sistemin \"şu an hangi gerilim ve açılarda durduğunu\" verir.\n\nKararlılık başka bir sorudur: sistem itilince o noktanın yakınında veya yeni bir noktada kalabilir mi?\n\n| İttirmenin büyüklüğü | Örnek | Gereken model |\n| --- | --- | --- |\n| Küçük | Yük artışı, anahtarlama | Doğrusal model yeter |\n| Büyük | Kısa devre, hat açma, büyük ünite kaybı | Zaman tanım bölgesi gerekir |\n\n> **Sade anlatım:** Yük akışı topun tepede durduğunu söyler. Kararlılık, topa dokununca geri gelip gelmediğini sorar.\n\n## Üç aile, üç fizik\n\nKararlılık tek bir konu değildir. Her aile farklı bir dengeyi korur ve farklı sürede bozulur.\n\n| Aile | Denge | Tipik süre | Belirti |\n| --- | --- | --- | --- |\n| Rotor açısı | Mekanik güç = elektriksel güç | 1–10 s, küçük sinyal daha da izlenir | Açılar ayrılır veya salınır |\n| Gerilim | Reaktif denge | 1–10 s kısa, dakikalar uzun | Gerilim çöker, kademe yetişemez |\n| Frekans | Sistem güç dengesi | Ani RoCoF, sonra saniyeler ve dakikalar | Frekans 47,5–51,5 penceresine gider |\n\nRoCoF (Rate of Change of Frequency), frekansın değişim hızıdır; birimi Hz/s.\n\n## Açı: salınım denklemi\n\nRotor açısı kararlılığı, generatör rotorunun şebekeyle eşzamanlı kalıp kalmadığını sorar. Temel denklem, dönen kütle için yazılmış Newton yasasıdır.\n\n```\n(2H / ω0) d²δ/dt² = Pm - Pe - D Δω\nH saniye, δ elektrik radyan, ω0 senkron hız\n```\n\nTerimler:\n\n- `Pm`: türbinden gelen mekanik güç.\n- `Pe`: şebekeye verilen elektriksel güç.\n- `D Δω`: hız sapmasıyla orantılı sönüm terimi.\n- `δ`: rotor açısı.\n\n### Atalet sabiti H\n\nH, nominal güç bazında saniyedir.\n\n- Büyük turbo gruplarda tipik 3–7 s'dir.\n- Hidroda daha düşüktür. Atalet küçüktür sanılır ama su kütlesi ayrı değerlendirilir.\n- Sistem H'ı, makinelerin H'larının baz güce göre ağırlıklı toplamıdır.\n- Evirici takip (grid-following, şebeke izleyen) modunda doğal H katmaz.\n- Şebeke oluşturan (grid-forming) kontrol sentetik atalet verebilir. Bu bir kontrol parametresidir, fiziksel volan değildir.\n\n### Tek makine sonsuz bara ve eşit alan\n\nTek makine sonsuz bara, bir generatörün gerilimi ve frekansı sabit dev bir şebekeye bağlı olduğu basit modeldir. Olaylar şu sırayla gelişir:\n\n1. Arıza sırasında `Pe` düşer, `δ` hızlanır.\n2. Arıza temizlenince `Pe`, `Pm`'in üstüne çıkar ve makineyi yavaşlatır.\n3. Eşit alan: hızlanma alanı, yavaşlama alanından küçükse açı yakalanır.\n\nKritik temizleme açısı bu eşitliğin sınırıdır. Süre, açının o değere kaç milisaniyede geldiğidir.\n\nKoruma ne kadar gecikirse geçici hal o kadar zorlaşır. \"Röle hızlı olsun\" isteğinin kararlılık gerekçesi budur. Ayrıntılı çizim ve elle çözüm `02` dosyasındadır.\n\n### Çok makineli sistem\n\nÇok makineli sistemde eşit alan sezgi olarak kalır. Gerçek hesap şunların diferansiyel denklemlerinin sayısal integralidir:\n\n- makinelerin dinamik modeli,\n- AVR (Automatic Voltage Regulator, otomatik gerilim regülatörü),\n- hız regülatörü,\n- şebeke.\n\nTipik adım milisaniye, tipik pencere 5–20 s'dir. Çıktı üç soruya cevap verir:\n\n- Rotor açıları birbirinden ayrılıyor mu?\n- Gerilim toparlanıyor mu?\n- Koruma istenmeyen açma yapar mı?\n\n### Kritik temizleme süresi (CCT)\n\nKritik temizleme süresi (CCT, Critical Clearing Time), o arıza için kararlılığın döndüğü en uzun kısa devre süresidir.\n\nCCT koruma süresinin altındaysa üç yol vardır:\n\n- Koruma hızlanır.\n- Şebeke güçlendirilir: seri kompanzasyon, üretim kaydırma, yeni hat.\n- SIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) eylemi tanımlanır.\n\n## Küçük sinyal\n\nKüçük sinyal analizi, sistemi hafifçe dürtünce salınımın sönüp sönmediğini sorar.\n\nÇalışma noktası etrafında doğrusallaştır: `Δx' = A Δx`. A'nın özdeğerleri λ = σ ± jω.\n\n- σ \u003c 0 sönümlü.\n- Sönüm oranı ζ = -σ / √(σ²+ω²). Yüzde 5 altı zayıf sayılır; işletmeciler bölgeler arası modda daha yüksek sönüm ister.\n- Frekans f = ω / 2π.\n\n### Mod türleri\n\n| Mod | Frekans | Ne salınır |\n| --- | --- | --- |\n| Yerel mod | 0,7–2 Hz civarı | Bir santral ile sistemin geri kalanı |\n| Bölgeler arası mod | 0,1–0,8 Hz | İki bölge birbirine karşı |\n| Kontrol modu | — | AVR veya PSS'ten gelir |\n\n### PSS\n\nPSS (Power System Stabilizer), güç sistemi dengeleyicisidir.\n\n- Yönetmelik, büyük konvansiyonel ünitelerde 0–5 Hz salınımı ve ENTSO-E (Avrupa iletim sistemi işletmecileri ağı) ile gelen bölgeler arası salınımı söndüren PSS ister.\n- PSS, hız veya güç sapmasını alıp AVR referansına sönümleyici bir sinyal ekler.\n- Kötü ayarlanmış PSS sönümü azaltır.\n\n\"PSS koyalım, bitti\" deme. Kazanç ve faz kompanzasyonu çalışma noktasına bağlıdır.\n\n## Gerilim\n\n### PV eğrisi\n\nPV eğrisi, bir baradaki aktif güç (P) arttıkça gerilimin (V) nasıl değiştiğini çizer.\n\n- Yükü artırırsın.\n- Burun noktasında dV/dP sonsuza gider, Jacobian tekilleşir.\n- Alt yarı kararsızdır.\n\nJacobian, yük akışında kullanılan türev matrisidir; tekilleşmesi çözümün kaybolması demektir.\n\nİşletme burnun üst yarısında, gerilimi yüksek tarafta kalır. Marj, buruna kalan MW veya yüzde yüktür.\n\n### QV eğrisi\n\nQV eğrisi bir barada ne kadar reaktif (Q) enjeksiyonla gerilimin tutulduğunu gösterir. Eğrinin dibi, o baranın reaktif açığıdır.\n\n### Modal analiz\n\nModal analiz, Jacobian'ın Q–V alt matrisinin küçük özdeğerlerini bulur.\n\n| Kavram | Ne söyler |\n| --- | --- |\n| Küçük özdeğer | Zayıf mod |\n| Sağ özvektör | Hangi baraların o moda girdiği |\n| Sol özvektör veya katılım faktörü | Hangi baraya reaktif konursa modun düzeleceği |\n\n\"Kapasitörü her yere koyalım\" yerine katılım faktörü yüksek baraya koymak planlama cevabıdır.\n\n### Uzun dönem gerilim çökmesi\n\nÇöküş adım adım ilerler:\n\n1. Hat açılır.\n2. Gerilim düşer.\n3. Motor yükü toparlar.\n4. OLTC (On-Load Tap Changer, yük altında kademe değiştirici) gerilimi geri kaldırmaya çalışırken iletimden daha çok reaktif çeker.\n5. Şöntler yetmez.\n6. Saniyeler-dakikalar içinde çöküş.\n\nKısa devre simülasyonu 5 saniyede bunu görmez. Yük toparlanması ve kademe modeli gerekir.\n\nDağıtık üretim volt-var'ı (gerilime göre reaktif güç ayarı) bu sürece yardım veya köstek olabilir.\n\n## Frekans\n\n### RoCoF formülü\n\nAni açık `ΔP` için, kayıplar ve regülatör henüz yokken frekansın ilk düşme hızı:\n\n```\nRoCoF ≈ (ΔP / S_sys) * f0 / (2 H_sys)\n```\n\n- `S_sys`: sistemin baz gücü.\n- `H_sys`: sistem ataleti.\n- `f0`: nominal frekans.\n\nH_sys düşünce aynı ünite kaybı daha dik frekans eğimi verir. RoCoF röleleri jeneratörü veya dağıtık üretimi gereksiz açabilir, olay büyür.\n\n### Türkiye bağlantısı\n\nDüşük atalet, Türkiye'de güneş ve rüzgâr payı arttıkça YTBS'nin \"sistem ataleti hesabı\" modülünün gerekçesidir. YTBS (Yük Tevzi Bilgi Sistemi), grubun enerji yönetim platformudur (ayrıntısı `01-Kurum-Ilan-ve-Surec` bölümünde).\n\nAtalet hesabı, devredeki senkron makinelerin H ve S değerlerinin envanteridir. Eviricilerin sentetik katkısı ancak kontrol modu biliniyorsa eklenir.\n\n### Kontrol katmanları (yönetmelikle)\n\n| Katman | Ne yapar | Süre / eşik |\n| --- | --- | --- |\n| **Primer** | Hız regülatörü | Saniyeler, 200 mHz basamakta 30 s tanımı |\n| **Sekonder** | AGC (Automatic Generation Control, otomatik üretim kontrolü), MYTM'den (Milli Yük Tevzi Merkezi) set-point. Frekansı 50 Hz'e ve sınır programını hedefine getirir | Normal kontrol bandı 49,8–50,2 Hz |\n| **Tersiyer** | Dengeleme piyasası. Sekonder rezervi serbest bırakır | 15 dakika |\n| **UFLS** | Under-Frequency Load Shedding: düşük frekans rölesi ile talep kesmesi | TEİAŞ kademeleri her yıl 31 Ekim'e kadar sonraki yıl için belirler |\n\nPrimer kontrolün iki ayarı:\n\n- Droop (hız eğimi), yüzde olarak güç değişimini frekans sapmasına bağlar.\n- Ölü bant küçük salınımda aşınmayı keser. Ölü bant büyükse primer geç kalır.\n\nUFLS son çaredir. SIPS'in kontrollü yük atmasından daha kördür. TEİAŞ, Türkiye Elektrik İletim A.Ş.'dir.\n\n### LFSM\n\nLFSM (Limited Frequency Sensitive Mode), sınırlı frekans duyarlı moddur.\n\n- LFSM-U (under) 49,8 Hz altında gücü artırır.\n- LFSM-O (over) 50,2 Hz üstünde kısar.\n\nPrimer hizmet sözleşmesi olan ünite ile sadece LFSM yükümlü ünite aynı şey değildir.\n\n## Hızlı kestirim\n\nZaman tanım bölgesi kesin ve yavaştır. İşletmede \"bu arıza kararlı mı\" sorusu dakikalar süremez. Üç aile yaklaşım vardır:\n\n| Yaklaşım | Not |\n| --- | --- |\n| Enerji fonksiyonu ve eşdeğer tek makine | Model kısıtı çoktur |\n| Önceden hesaplanmış CCT veya kararlılık indeksi tablosu | — |\n| Öğrenen model | Arıza öncesi gerilim, açı, üretim ve arıza tanımından kararlı/kararsız sınıfı |\n\nÖğrenen modelde iki seçenek:\n\n- Karar ağacı yorumlanabilir olduğu için operatör aracında anlatması kolaydır.\n- Yapay sinir ağı daha esnek, gerekçesi daha opaktır.\n\nYTBS'nin yapay zekâ destekli güvenlik ve geçici hal modülü bu üçüncü ailenin ürünleşmiş halidir.\n\n> **Mülakatta şöyle söyle:** Öğrenen model tarama motorudur, şüpheli durumda fizik tabanlı simülasyon doğrular. Kritik altyapıda tek başına kara kutu karar vermez. Eğitim verisi, görülmemiş topolojiyi kapsamaz; model eskimesi (concept drift) yeniden eğitim ister.\n\n## Hangi model\n\nHer soru aynı modeli istemez. Aşağıdaki tablo hangi sorunun hangi araçla yanıtlanacağını eşler.\n\n| Soru | Model |\n| --- | --- |\n| Limit aşılır mı | AC yük akışı |\n| Açı yakalanır mı | RMS dinamik, 5–20 s |\n| Salınım sönüyor mu | Özdeğer veya daha uzun simülasyon |\n| Gerilim dakikada çöker mi | Kademe + yük toparlanması |\n| Frekans bandı | Sistem frekans modeli, atalet envanteri |\n| Milisaniye, evirici kontrolü, ferrorezonans | EMT (elektromanyetik geçici). RMS yetmez |\n\nRMS dinamik model, büyüklükleri efektif değer (fazör) olarak izler. EMT ise anlık dalga şeklini çözer.\n\n- EMT her bara için pahalıdır.\n- Hibrit: kritik bölge EMT, geri kalan RMS.\n- Gerçek zamanlı simülatör (RTDS, Real Time Digital Simulator sınıfı) kontrolörü kapalı çevrim test eder.\n\nGrubun \"gerçek zamanlı modelleme\" maddesi bu ihtiyaca bağlanır. Her çalışmayı EMT'de koşarım deme.\n\n## 90 saniye\n\n> “Kararlılığı açı, gerilim ve frekans diye ayırırım. Açıda salınım denklemi ve kritik temizleme süresi, küçük sinyalde özdeğer ve PSS. Gerilimde PV burnu ve kademenin reaktif tüketmesi. Frekansta RoCoF ataletle ters gider; primer 30 saniye, sekonder AGC, tersiyer 15 dakika, normal bant 49,8–50,2. Düşük atalette öğrenen model tarar, fizik simülasyonu doğrular. YTBS’nin atalet ve geçici hal modülü bu yüzden işletme aracıdır.”\n"}, {"id": "08-Kararlilik/02-Salinim-Denklemi-Esit-Alan-Elle.md", "group": "08  Kararlılık", "title": "Salınım denklemi ve eşit alan ölçütü: çiz, anlat, elle çöz", "body": "# Salınım denklemi ve eşit alan ölçütü: çiz, anlat, elle çöz\n\nPanel tahtaya çizmeni isteyebilir. Bu sayfayı kâğıda üç kez çizmeden mülakata girme.\n\n## Fiziksel resim\n\nSenkron generatör, türbinin döndürdüğü büyük bir kütledir. Üzerinde iki tork yarışır:\n\n| Güç | Nereden gelir | Hızı |\n| --- | --- | --- |\n| **Mekanik güç `P_m`** | Türbinden | Buhar veya su vanası yavaştır; arıza süresince sabit kabul edilir |\n| **Elektriksel güç `P_e`** | Şebekeye verilen güç | Şebeke koşullarına anında tepki verir |\n\nİkisinin farkı rotorun ne yapacağını belirler:\n\n- İkisi eşitse rotor sabit hızla döner.\n- `P_m > P_e` ise rotor hızlanır.\n- `P_m \u003c P_e` ise yavaşlar.\n\nBu, Newton'un ikinci yasasının dönen kütle için yazılmış halidir.\n\n```\n(2H / ω_0) × d²δ/dt² = P_m − P_e          (pu)\n```\n\n`pu` (per unit, birim değer), büyüklüklerin bir baz değere bölünmüş halidir.\n\n- `δ`: rotor açısı. Rotorun, şebekeyle eşzamanlı dönen referansa göre ne kadar önde olduğu.\n- `H`: atalet sabiti, saniye. Anma hızında depolanan kinetik enerjinin anma gücüne oranı. \"Bu makine, depoladığı enerjiyle anma gücünü kaç saniye verebilir.\" Tipik 2–9 s.\n- `ω_0 = 2π × 50 = 314 rad/s`.\n\n### Güç–açı eğrisi\n\nElektriksel güç, tek makine–sonsuz bara modelinde şöyle yazılır. Sonsuz bara, gerilimi ve frekansı hiç değişmeyen dev şebekedir.\n\n```\nP_e = (E V / X) sin δ = P_max sin δ\n```\n\n- `E`: generatörün iç gerilimi.\n- `V`: sonsuz bara gerilimi.\n- `X`: aradaki reaktans.\n\nGüç açının **sinüsüyle** gider. Açı 90°'yi geçince daha fazla açı daha az güç demektir. Kararsızlığın kaynağı bu eğridir.\n\n> **Sade anlatım:** Yazılımcı için benzetme: yaylı bir sarkaç. `P_e` geri çağıran kuvvettir; ama yay doğrusal değildir ve belli bir açıdan sonra gevşer.\n\n## Eşit alan ölçütü\n\nEşit alan ölçütü, diferansiyel denklemi çözmeden kararlılığı söylemenin yoludur. Yalnızca tek makine–sonsuz bara (veya iki makine) için geçerlidir.\n\nFikir enerji dengesidir:\n\n- Rotor hızlanırken kinetik enerji kazanır.\n- Yavaşlarken geri verir.\n- Kazandığı enerjinin tamamını, geri dönüşsüz noktaya varmadan geri verebiliyorsa kararlıdır.\n\n`P–δ` düzleminde enerji, **alan**dır.\n\n### Çizim\n\n\u003cdiv>\n\u003csvg viewBox=\"0 0 500 290\" width=\"100%\" style=\"max-width:560px\" role=\"img\" aria-label=\"Eşit alan ölçütü: güç-açı eğrisi, hızlanma alanı A1 ve yavaşlama alanı A2\">\n\u003crect x=\"112.4\" y=\"168\" width=\"146.2\" height=\"72\" fill=\"#d9534f\" fill-opacity=\"0.35\"/>\n\u003cpath d=\"M258.6,168.0 L258.6,60.0 L267.9,60.3 L277.2,61.6 L286.5,63.9 L295.9,67.1 L305.2,71.2 L314.5,76.2 L323.8,82.1 L333.1,88.9 L342.4,96.4 L351.7,104.7 L361.0,113.8 L370.4,123.5 L379.7,133.8 L389.0,144.7 L398.3,156.1 L407.6,168.0 Z\" fill=\"#0f6e56\" fill-opacity=\"0.35\"/>\n\u003cg fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\">\n\u003cpath d=\"M60,30 L60,240 L480,240\"/>\n\u003cpath d=\"M60,168 L480,168\" stroke-dasharray=\"5 4\"/>\n\u003cpath d=\"M112.4,168 L112.4,240 M258.6,60 L258.6,240 M407.6,168 L407.6,240\" stroke-dasharray=\"2 3\"/>\n\u003cpath stroke-width=\"2\" d=\"M60.0,240.0 L70.0,225.9 L80.0,211.8 L90.0,198.0 L100.0,184.4 L110.0,171.1 L120.0,158.3 L130.0,146.0 L140.0,134.2 L150.0,123.1 L160.0,112.7 L170.0,103.1 L180.0,94.4 L190.0,86.5 L200.0,79.6 L210.0,73.7 L220.0,68.8 L230.0,65.0 L240.0,62.2 L250.0,60.6 L260.0,60.0 L270.0,60.6 L280.0,62.2 L290.0,65.0 L300.0,68.8 L310.0,73.7 L320.0,79.6 L330.0,86.5 L340.0,94.4 L350.0,103.1 L360.0,112.7 L370.0,123.1 L380.0,134.2 L390.0,146.0 L400.0,158.3 L410.0,171.1 L420.0,184.4 L430.0,198.0 L440.0,211.8 L450.0,225.9 L460.0,240.0\"/>\n\u003c/g>\n\u003cg fill=\"currentColor\" font-size=\"13\" font-family=\"Segoe UI, sans-serif\">\n\u003ctext x=\"44\" y=\"34\" text-anchor=\"end\">P\u003c/text>\n\u003ctext x=\"484\" y=\"256\">δ\u003c/text>\n\u003ctext x=\"54\" y=\"172\" text-anchor=\"end\">P_m\u003c/text>\n\u003ctext x=\"54\" y=\"64\" text-anchor=\"end\">P_max\u003c/text>\n\u003ctext x=\"112\" y=\"258\" text-anchor=\"middle\">δ₀\u003c/text>\n\u003ctext x=\"258\" y=\"258\" text-anchor=\"middle\">δ_c\u003c/text>\n\u003ctext x=\"408\" y=\"258\" text-anchor=\"middle\">π − δ₀\u003c/text>\n\u003ctext x=\"185\" y=\"210\" text-anchor=\"middle\" font-weight=\"600\">A₁ hızlanma\u003c/text>\n\u003ctext x=\"318\" y=\"135\" text-anchor=\"middle\" font-weight=\"600\">A₂ yavaşlama\u003c/text>\n\u003ctext x=\"150\" y=\"80\" text-anchor=\"middle\">P_max sin δ\u003c/text>\n\u003ctext x=\"185\" y=\"278\" text-anchor=\"middle\" font-size=\"11\">arıza sürüyor, P_e = 0\u003c/text>\n\u003ctext x=\"335\" y=\"278\" text-anchor=\"middle\" font-size=\"11\">arıza temizlendi\u003c/text>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\n\nTahtada sırayla çiz:\n\n1. Eksenler.\n2. Sinüs eğrisi.\n3. Yatay `P_m` çizgisi.\n4. Üç dikey çizgi (`δ_0`, `δ_c`, `π − δ_0`).\n5. Sonra iki alanı tara.\n\n### Olayların sırası\n\n1. **Arıza öncesi:** `P_m` yatay çizgisi sinüs eğrisini `δ_0`'da keser. Denge noktası.\n2. **Arıza anı:** generatör çıkışında üç faz kısa devre. Gerilim çöker, `P_e = 0` olur. Rotor `P_m` ile hızlanır. Açı `δ_0`'dan `δ_c`'ye kayar. `P_m` çizgisinin altındaki dikdörtgen **hızlanma alanı `A_1`**'dir.\n3. **Arıza temizlendi:** `δ_c` açısında kesici açar, `P_e` sinüs eğrisine geri sıçrar. Artık `P_e > P_m`, rotor yavaşlar. Ama hızı hâlâ eşzamanlı hızın üstündedir; açı artmaya devam eder. Eğri ile `P_m` çizgisi arasındaki alan **yavaşlama alanı `A_2`**'dir.\n4. **Karar:** `δ_max = π − δ_0`'a varmadan `A_2 = A_1` olursa rotor durur ve geri döner: **kararlı**. `δ_max`'ı geçerse `P_e` yeniden `P_m`'in altına düşer, rotor tekrar hızlanır ve geri dönemez: **senkronizmden çıkar**.\n\nKritik temizleme açısı `δ_kr`, kullanılabilir bütün yavaşlama alanının hızlanma alanına tam eşit olduğu açıdır.\n\n### Türetim (üç satır)\n\nBu üç satır, iki alanı formülle yazıp eşitler ve kritik açıyı çeker.\n\n- İlk satır: arıza sırasında `P_e = 0` olduğu için hızlanma alanı basit bir dikdörtgendir.\n- İkinci satır: yavaşlama alanı, eğri ile `P_m` arasındaki integraldir.\n- Üçüncü satır: iki alan eşitlenince `δ_c` yerine sınır değer `δ_kr` gelir.\n\n```\nA_1 = P_m (δ_c − δ_0)\nA_2 = ∫[δ_c → δ_max] (P_max sin δ − P_m) dδ = P_max (cos δ_c − cos δ_max) − P_m (δ_max − δ_c)\n\nA_1 = A_2   →   cos δ_kr = (P_m / P_max)(δ_max − δ_0) + cos δ_max\n```\n\n`δ_max = π − δ_0` ve `P_m / P_max = sin δ_0` yerine konursa formül yalnızca başlangıç açısına bağlı kalır:\n\n```\ncos δ_kr = (π − 2δ_0) sin δ_0 − cos δ_0\n```\n\n### Açıdan süreye\n\nKritik açı tek başına yetmez; korumacı milisaniye ister. Açıyı süreye çevirmek için hareket denklemi kullanılır.\n\nArıza sırasında `P_e = 0` olduğu için ivme sabittir. Sabit ivmeli hareket: `δ(t) = δ_0 + (ω_0 P_m / 4H) t²`. Buradan `t` çekilir:\n\n```\nt_kr = √[ 4H (δ_kr − δ_0) / (ω_0 P_m) ]\n```\n\n## Elle örnek\n\nVeriler: `P_m = 0,8 pu`, `P_max = 2,0 pu`, `H = 5 s`, 50 Hz. Arıza süresince `P_e = 0`; temizlenince şebeke eski haline döner.\n\n**Adım 1, başlangıç açısı.** Arıza öncesi denge `P_m = P_max sin δ_0` olduğundan buradan `δ_0` bulunur; dönüşsüz açı `δ_max` da ondan çıkar.\n\n```\nsin δ_0 = 0,8 / 2,0 = 0,4   →   δ_0 = 0,4115 rad (23,58°)\ncos δ_0 = 0,9165\nδ_max = π − 0,4115 = 2,730 rad (156,42°)\n```\n\n**Adım 2, kritik açı.** `δ_0` değerleri kapalı formüle konur; bu, kesicinin en geç hangi açıda açması gerektiğini verir.\n\n```\ncos δ_kr = (3,1416 − 2 × 0,4115) × 0,4 − 0,9165 = 0,9274 − 0,9165 = 0,0109\nδ_kr = 1,560 rad (89,4°)\n```\n\n**Adım 3, kritik süre.** Kritik açı, sabit ivmeli hareket formülüyle milisaniyeye çevrilir.\n\n```\nt_kr = √[ 4 × 5 × (1,560 − 0,4115) / (314,16 × 0,8) ] = √(22,97 / 251,3) = 0,302 s\n```\n\n**Sonuç: 302 ms.** Koruma arızayı 100–150 ms'de temizliyorsa marj 150 ms'nin üstündedir.\n\n**Doğrulama.** `elle_ornekler.py` aynı denklemi zaman tanım bölgesinde Runge-Kutta ile çözer.\n\n- 297 ms'de temizlenince rotor geri döner.\n- 307 ms'de senkronizmden çıkar.\n\nEşit alan sonucu ile benzetim tutuyor.\n\n**Adım 4, duyarlılık.** Aynı formül farklı girdilerle tekrar çalıştırılır; bu, hangi parametrenin kritik süreyi ne kadar oynattığını gösterir.\n\n| Değişiklik | `t_kr` | Yorum |\n| --- | --- | --- |\n| Baz durum | 302 ms | |\n| Atalet yarıya iner (`H = 2,5`) | 214 ms | `t_kr`, `√H` ile orantılı |\n| Yükleme artar (`P_m = 1,2`) | 180 ms | Hem alan küçülür hem ivme büyür |\n| Arıza sonrası hat kaybı (`P_max` düşer) | Daha kısa | Yavaşlama alanı küçülür |\n\n## Kararlılığı iyileştiren önlemler\n\nHepsi çizimde okunur: ya `A_1` küçülür ya `A_2` büyür.\n\n| Önlem | Çizimdeki etkisi |\n| --- | --- |\n| Hızlı koruma ve kesici | `δ_c` küçülür, `A_1` küçülür |\n| Hızlı tekrar kapama, tek kutup açma | Arıza sonrası eğri yüksek kalır |\n| Paralel hat, seri kompanzasyon | `X` düşer, `P_max` yükselir |\n| Hızlı uyartım | `E` artar, eğri yükselir |\n| Hızlı vana kapama, frenleme direnci | `P_m` düşer veya `P_e` yapay artar |\n| Daha düşük ön yükleme | `δ_0` küçülür, marj büyür |\n\n## Çok makineli gerçek sistem\n\nEşit alan ölçütü öğretir, ürün olmaz. Gerçek sistemde yüzlerce makine, uyartım ve hız regülatörü modelleri, yük dinamiği ve evirici vardır. Orada üç yol kullanılır:\n\n| Yöntem | Ne yapar | Ne zaman |\n| --- | --- | --- |\n| **Zaman tanım bölgesi benzetimi** | Diferansiyel-cebirsel denklemler adım adım çözülür | Doğru ama yavaş |\n| **Doğrudan yöntemler** | Enerji işlevi, genişletilmiş eşit alan (SIME, SIngle Machine Equivalent) | Hızlı tarama için |\n| **Makine öğrenmesi ile tarama** | Çok sayıda benzetimden öğrenilmiş sınıflandırıcı | Sonucu benzetimle doğrulanır |\n\nYTBS (Yük Tevzi Bilgi Sistemi) eğitim duyurularında geçici hal kararlılığı modülü adı geçer; yöntemini bilmiyorum.\n\n## Yaygın yanlış\n\n- **\"Açı 90°'yi geçerse kararsızdır.\"** Hayır. 90° sürekli hal sınırıdır. Geçici halde açı 90°'yi geçip geri dönebilir; örnekte kritik temizleme açısı zaten 89°'dir ve rotor ondan sonra da ilerler. Dönüşsüz nokta `π − δ_0`'dır.\n- **\"Arıza temizlenince rotor hemen durur.\"** Hızı kalmıştır; açı artmaya devam eder.\n- **\"Kritik temizleme süresi koruma ayarıdır.\"** Sistemin özelliğidir. Koruma süresi ondan kısa olmalıdır.\n- **\"Yüksek atalet her zaman iyidir.\"** Geçici halde ilk salınımı yavaşlatır, evet. Ama salınım frekansını düşürür ve sönüm ayrıca sağlanmalıdır.\n- **\"Eşit alan gerçek sistemde uygulanır.\"** Tek makine eşdeğeri içindir.\n- **\"H ile M aynıdır.\"** `M = 2H / ω_0`. Birim farkı sonucu 314 kat şaşırtır.\n\n## Panel takip sorusu\n\n**\"Arıza temizlendikten sonra bir hat devre dışı kalırsa çizim nasıl değişir?\"**\n\n> **Mülakatta şöyle söyle:** Arıza sonrası eğri, arıza öncesinden alçak olur (`X` büyüdü). Yavaşlama alanı küçülür, yeni denge açısı büyür, `δ_max` küçülür. Kritik süre kısalır.\n\n**\"Arıza sırasında `P_e` sıfır değilse?\"**\n\n> **Mülakatta şöyle söyle:** Arıza generatörden uzaktaysa bir miktar güç aktarılır; üçüncü, alçak bir eğri çizilir. Hızlanma alanı o eğri ile `P_m` arasındadır. İvme sabit olmadığı için süre kapalı formülle değil sayısal bulunur.\n\n**\"Evirici ağırlıklı sistemde bu resim ne olur?\"**\n\n> **Mülakatta şöyle söyle:** Eviricinin rotoru ve açısı yoktur; kararlılığını kontrol döngüsü ve faz kilitlemesi belirler. Ama kalan senkron makineler daha düşük toplam ataletle daha hızlı ivmelenir (`03` dosyası).\n\n## 90 saniye\n\n> \"Salınım denklemi, rotor için Newton yasasıdır: atalet çarpı açısal ivme, mekanik güç eksi elektriksel güçtür. Elektriksel güç açının sinüsüyle gider. Arızada elektriksel güç düşer, rotor hızlanır; bu, güç–açı düzleminde bir hızlanma alanıdır. Arıza temizlenince elektriksel güç mekanik gücün üstüne çıkar ve rotor yavaşlar; bu da yavaşlama alanıdır. Rotor, dönüşsüz açıya varmadan iki alan eşitlenirse sistem kararlıdır. Alanların tam eşitlendiği temizleme süresi kritik süredir; atalet azaldıkça ve ön yükleme arttıkça kısalır. Örnekte üç yüz iki milisaniye buldum ve benzetimle doğruladım.\"\n"}, {"id": "08-Kararlilik/03-Dusuk-Atalet-RoCoF-GFM-GFL-Ozdeger.md", "group": "08  Kararlılık", "title": "Düşük atalet, RoCoF, şebeke kuran ve şebeke izleyen evirici, küçük sinyal", "body": "# Düşük atalet, RoCoF, şebeke kuran ve şebeke izleyen evirici, küçük sinyal\n\n## Atalet neden azalıyor\n\nSenkron generatörün rotoru şebekeye **manyetik olarak kilitlidir**. Frekans düşmeye başladığı anda rotor yavaşlar ve kinetik enerjisini kendiliğinden şebekeye verir. Kontrol, ölçüm, gecikme yoktur; fiziktir.\n\nYenilenebilir kaynaklarda durum farklıdır:\n\n- Güneş paneli dönmez.\n- Rüzgâr türbini döner ama evirici onu şebeke frekansından ayırır.\n- İkisi de varsayılan haliyle atalet vermez.\n\nEvirici tabanlı üretim senkron santralin yerini aldıkça sistemin toplam kinetik enerjisi düşer.\n\nSistem ataleti, makinelerin ağırlıklı ortalamasıdır. Formül, her makinenin H'ını kendi gücüyle (S) ağırlıklandırır:\n\n```\nH_sistem = Σ (H_i × S_i) / S_sistem          toplam kinetik enerji  E_k = Σ H_i S_i   (MW·s)\n```\n\n## RoCoF: frekans değişim hızı\n\nRoCoF (Rate of Change of Frequency), büyük bir santral kaybından sonraki ilk anda, hiçbir kontrol henüz tepki vermeden frekansın düşme hızıdır:\n\n```\nRoCoF = df/dt = (ΔP × f_0) / (2 × H_sistem × S_sistem) = (ΔP × f_0) / (2 E_k)\n```\n\n- `ΔP`: kaybedilen güç.\n- `f_0`: nominal frekans (50 Hz).\n- `E_k`: toplam kinetik enerji.\n\n### Elle örnek 1\n\nSistemde 50.000 MVA (megavolt-amper) senkron kapasite devrede. 1000 MW'lık bir santral aniden çıkıyor.\n\nAynı kayıp iki farklı atalet için formüle konur; bu, ataletin RoCoF'u nasıl değiştirdiğini gösterir.\n\n```\nH = 4 s:   RoCoF = (1000 × 50) / (2 × 4 × 50.000) = 0,125 Hz/s\nH = 2 s:   RoCoF = (1000 × 50) / (2 × 2 × 50.000) = 0,250 Hz/s\n```\n\nAtalet yarıya inince frekans iki kat hızlı düşer. Primer kontrolün tepki vermesi birkaç saniye sürer; o sürede frekansın ne kadar düşeceğini atalet belirler.\n\n### Elle örnek 2: en az ne kadar atalet gerekir\n\nVarsayım (Türkiye'nin değeri değil, hesap için): izin verilen en büyük RoCoF 0,5 Hz/s, en büyük tekil kayıp 1000 MW.\n\nBu kez formül ters çevrilir: RoCoF sınırı verilir, gereken en az kinetik enerji bulunur.\n\n```\nE_k,min = (ΔP × f_0) / (2 × RoCoF) = (1000 × 50) / (2 × 0,5) = 50.000 MW·s\n```\n\nSonra kinetik enerji, ortalama atalete bölünerek kapasiteye çevrilir. Devredeki senkron makinelerin ortalama ataleti 4 s ise en az 12.500 MVA senkron kapasite devrede kalmalıdır.\n\nBu bir **işletme kısıtıdır**: güneşin bol olduğu bir öğlen, ucuz olduğu halde bütün senkron santralleri kapatamazsın.\n\nYTBS (Yük Tevzi Bilgi Sistemi)
