Aşağıdaki konuşma metni bir kalıptır. (Kalıp. Köşeli parantezleri doldur.) \"İlk üç ay\" planı yukarıdaki 90 günlük döneme, \"[konu]\" ise lisansüstü konu listesine karşılık gelir.\n\n## 90 saniye\n\n\"Elektrik-elektronik mühendisiyim; mezuniyetten sonra [gerçek neden] yazılıma yöneldim ve [kaç] yıldır üretimde çalışan sistemler geliştiriyorum. [Dönüş noktası.] Bu ilan, mühendislik eğitimimle yazılım tecrübemin aynı işte birleştiği ilk yer. Açık söyleyeyim: güç sistemi analizinde iş tecrübem yok. İlandan sonra temelleri yeniden çalıştım; anladığımı sınamak için yük akışını, durum kestirimini ve ekonomik dağıtımı sıfırdan kodlayıp elle çözülmüş örneklerle doğruladım. Getirdiğim şey analiz kodunu test edilebilir ve servis edilebilir kılma tecrübesi. Eksiğimi kapatmak için ilk üç ayda grubun araçlarını ve bir ders kitabını bitirmeyi, ilk yıl içinde de [konu] üzerine yüksek lisansa başlamayı planlıyorum.\"\n"}, {"id": "20-Soru-Bankasi/00-Alt-Basliklar.md", "group": "20  Soru bankası", "title": "20 — Soru bankası", "body": "# 20 — Soru bankası\n\nBu klasör, mülakatta sesli söyleyeceğin kısa cevapları konu konu toplar. Aşağıdaki her maddenin yanında, o bölümde ne öğreneceğin yazıyor.\n\n1. **Temel ve birim sistem soruları** — Aktif/reaktif gücün neyi belirlediğini, per-unit (birim değer) sistemini, dizi bağlantısını ve hat kapasitesi sınırlarını kısa cevapla söylemeyi öğreneceksin.\n2. **İletim ve dağıtım soruları** — Türkiye gerilim bantlarını, ENTSO-E (Avrupa iletim sistemi işletmecileri birliği) bağlantısını, FACTS (esnek AC iletim cihazları) seçimini ve barındırma kapasitesini anlatmayı öğreneceksin.\n3. **Yük akışı soruları** — Bara tiplerini, Jacobian'ın rolünü, DC yük akışının sınırını ve ıraksamada ilk bakılacak yerleri öğreneceksin.\n4. **Kısa devre soruları** — En büyük arıza türünü, makine reaktanslarının farkını ve eviricinin kısa devre katkısını öğreneceksin.\n5. **Güvenlik soruları** — N-1'i yönetmelik diline yakın söylemeyi, güvenlik ile kararlılık farkını ve binlerce arızanın nasıl tarandığını öğreneceksin.\n6. **Kararlılık soruları** — Salınım denklemini, PSS'yi (güç sistemi dengeleyicisi), gerilim çökmesini, RoCoF (frekans değişim hızı) ile ataleti ve frekans kontrol katmanlarını öğreneceksin.\n7. **Durum kestirimi soruları** — SCADA'nın (uzaktan izleme ve veri toplama) neden yetmediğini, WLS (ağırlıklı en küçük kareler) denklemlerini, kötü veri tespitini ve PMU'nun (fazör ölçüm birimi) katkısını öğreneceksin.\n8. **Koruma ve topraklama soruları** — Korumanın dört niteliğini, mesafe bölgelerini, diferansiyel korumayı ve topraklamanın korumayla bağını öğreneceksin.\n9. **Ekonomik işletme ve planlama soruları** — Eşit λ kuralını, ekonomik dağıtım–ünite tahsisi–OPF (optimal güç akışı) farkını, piyasa ile fiziğin ayrımını ve LOLE (beklenen yük kaybı süresi) ile N-1 farkını öğreneceksin.\n10. **Optimizasyon soruları** — AC-OPF'nin neden kesin çözüm vermediğini, gölge fiyatı ve büyük N-1 optimizasyonunun kurgusunu öğreneceksin.\n11. **Yazılım, veri modeli ve ürün soruları** — YTBS'yi (Yük Tevzi Bilgi Sistemi) tek cümlede anlatmayı, SIPS (sistem bütünlüğü koruma şeması) ile röle farkını, dijital ikizin sınırını, CIM'i (ortak bilgi modeli) ve yazılım tarafındaki tipik soruları öğreneceksin.\n12. **Yenilenebilir ve yapay zekâ soruları** — Öğrenen modelin kararlılıktaki yerini ve düşük atalette ilk üç önlemi öğreneceksin.\n13. **Davranışsal sorular** — Kendini tanıtma, zor hata, yetişmeyen teslim, anlaşmazlık ve motivasyon sorularının cevap iskeletini öğreneceksin.\n14. **İngilizce mini cevaplar** — Durum kestirimi, N-1 ve DC yük akışı sorularını İngilizce kısa cevaplamayı öğreneceksin.\n15. **Formül kartı** — Temel formülleri, tarihli rakamları ve birim reflekslerini tek sayfada tekrar etmeyi öğreneceksin.\n\nMaddelerin bulunduğu dosyalar:\n\n| Dosya | İçerdiği maddeler |\n| --- | --- |\n| [Teknik sorular](01-Teknik-Sorular.md) | 1–12 ve 14 |\n| [Yazılım, davranışsal, formül](02-Yazilim-Davranissal-Formul.md) | 11'in yazılım kısmı, 13 ve 15 |\n| [Sözlü cevap kalıbı ve bilmiyorum çalışması](03-Sozlu-Cevap-Kalibi-ve-Bilmiyorum-Calismasi.md) | Bu cevapların 60–90 saniyede nasıl kurulacağı ve bilinmeyen soruya nasıl cevap verileceği |\n\nCevaplar sesli söylenecek kısalıktadır. Türev ve istisna, ilgili klasördedir.\n\nSayı uydurma; yönetmelik ve TEİAŞ (Türkiye Elektrik İletim A.Ş.) rakamını yalnızca kartta yazan tarihle söyle.\n"}, {"id": "20-Soru-Bankasi/01-Teknik-Sorular.md", "group": "20  Soru bankası", "title": "Teknik sorular ve kısa cevaplar", "body": "# Teknik sorular ve kısa cevaplar\n\nBu sayfa, teknik mülakatta sık gelen soruların sesli söylenecek cevaplarını toplar. Sorular konu başlıklarına göre gruplanmıştır.\n\nNasıl kullanılır:\n\n- Her cevabı 60–90 saniyede söyle.\n- “Derinleşirlerse” satırı ikinci tur içindir. Panel aynı konuda ikinci bir soru sorarsa onu kullanırsın.\n- Cevabın içinde geçen kısaltmalar, ilk geçtikleri yerde parantez içinde açılmıştır. Sesli cevapta kısaltmayı söylemen yeterlidir; açılımı senin anlaman içindir.\n\n## Temel\n\n**Aktif ve reaktif güç işletmede neyi bozar?**\n\nAktif güç (P, gerçekten iş yapan güç) dengesi açıyı ve frekansı belirler. Reaktif güç (Q, alanlar arasında gidip gelen güç) dengesi gerilimi belirler.\n\nİletimde X (reaktans) baskın olduğu için bu ayrışır: P açıya, Q gerilime bağlı kalır.\n\nDağıtımda R (direnç) büyüyünce aktif güç de gerilimi kaydırır. Çatı güneşi öğlen gerilimi böyle yükseltir: öğlen üretilen aktif güç, R üzerinden gerilimi yukarı iter.\n\nDerinleşirlerse: `P = V_s V_r / X sin δ`. Burada `V_s` gönderen uç gerilimi, `V_r` alan uç gerilimi, `δ` iki uç arasındaki açı farkıdır. Küçük açıda `Q` gerilim farkıyla gider. Dağıtımda `ΔV ≈ (PR + QX) / V` olur; formülde PR terimi, dağıtımda P'nin de gerilim düşümüne katıldığını gösterir.\n\n**Per-unit neden?**\n\nPer-unit (pu, birim değer), her büyüklüğü seçilmiş bir taban (baz) değere bölerek boyutsuz yazma yöntemidir.\n\nNeden kullanılır:\n\n- Farklı gerilim bölgeleri aynı matriste buluşsun diye.\n- Trafo oranı baz seçimine gömülsün diye. Doğru baz seçilince trafo, devrede oran olarak ayrıca görünmez.\n\nKural: tek S baz (tüm sistem için bir güç tabanı), bölge başına V baz (her gerilim bölgesi için ayrı gerilim tabanı).\n\nEmpedans `Z_pu = Z * S_baz / V_baz²` ile taşınır. Trafo plaka değeri çevrilmeden Ybus’a (bara admitans matrisi) girmez; önce sistem bazına dönüştürülür.\n\n**Tek faz-toprak arızada diziler nasıl bağlanır?**\n\nSimetrili bileşenler yönteminde dengesiz arıza; artı (pozitif), eksi (negatif) ve sıfır dizi devrelerine ayrılır.\n\nTek faz-toprak arızada artı, eksi ve sıfır dizi devreleri arıza noktasında seri bağlanır.\n\nAkım: `3 V / (Z1+Z2+Z0+3Zf)`. Burada Z1, Z2, Z0 sırasıyla artı, eksi ve sıfır dizi empedansı; Zf arıza empedansıdır.\n\nSıfır diziyi trafo grubu (sargıların yıldız/üçgen bağlanışı) ve topraklama belirler. Üçgen sargı sıfır diziyi geçirmez.\n\n**Hattın kapasitesi neden tek sayı değil?**\n\nBir hattın taşıyabileceği gücü üç ayrı sınır belirler:\n\n| Sınır | Neye bakar |\n| --- | --- |\n| Termik sınır | İletken sıcaklığı |\n| Gerilim sınırı | Gerilim profili |\n| Kararlılık sınırı | Açı ve salınım |\n\nKısa hat termiğe, uzun hat kararlılığa takılır. Yüzde yükün hangi limite göre olduğunu söylerim.\n\n## İletim ve dağıtım\n\n**Türkiye iletim gerilimleri ve planlama bandı?**\n\nNominal (anma) gerilimler 400, 154 ve 66 kV'tur.\n\nArıza öncesi planlama bandı:\n\n| Nominal | Planlama bandı |\n| --- | --- |\n| 400 kV | 370–420 kV |\n| 154 kV | 146–162 kV; kısıtlı bölgede 140–170 kV kabulü |\n| 66 kV | 62–70 kV |\n\nNormal işletme bandı daha geniştir:\n\n| Nominal | Normal işletme bandı |\n| --- | --- |\n| 400 kV | 340–420 kV |\n| 154 kV | 140–170 kV |\n\nPlanlama yükü puantın (en yüksek yükün) yüzde 5 üzeridir.\n\n**ENTSO-E bağlantısı neyi değiştirir?**\n\nENTSO-E (European Network of Transmission System Operators for Electricity), Avrupa iletim sistemi işletmecilerinin birliğidir.\n\nTürkiye, Yunanistan ve Bulgaristan üzerinden Kıta Avrupası ile senkron çalışır. Senkron demek, aynı frekansta, tek bir sistem gibi dönmek demektir.\n\nBunun sonuçları:\n\n- Frekans ve primer rezerv paylaşılır.\n- Bölgeler arası salınım PSS (Power System Stabilizer, güç sistemi dengeleyicisi) ile sönümlenir.\n\nGürcistan tarafı back-to-back HVDC’dir (High Voltage Direct Current, yüksek gerilim doğru akım; iki ucu aynı tesiste olan doğru akım bağlantısı). Aynı senkron ada değildir.\n\n**FACTS cihazını nasıl seçersin?**\n\nFACTS (Flexible AC Transmission Systems), güç elektroniğiyle akışı ve gerilimi denetleyen esnek alternatif akım iletim cihazlarıdır. Seçim, çözülecek soruna göre yapılır:\n\n| İhtiyaç | Cihaz |\n| --- | --- |\n| Gerilim ve dinamik reaktif | SVC (Static Var Compensator, statik reaktif güç kompanzatörü) veya STATCOM (Static Synchronous Compensator, statik senkron kompanzatör) |\n| Hat akışını kaydırmak | Seri cihaz: TCSC (Thyristor Controlled Series Capacitor, tristör kontrollü seri kondansatör) veya SSSC (Static Synchronous Series Compensator, statik senkron seri kompanzatör) |\n| P ve Q birlikte | UPFC (Unified Power Flow Controller, birleşik güç akışı denetleyicisi) |\n\nZayıf gerilimde STATCOM, ürettiği reaktifi daha iyi tutar.\n\nMilisaniye kontrol için EMT (ElectroMagnetic Transient, elektromanyetik geçici) veya RMS (Root Mean Square, etkin değer) kontrol modeli gerekir. Statik PV modeli (cihazı sabit P ve gerilimli bara gibi gösteren model) yetmez.\n\n**Dağıtım yük akışı iletimden neden ayrılır?**\n\nDağıtım şebekesinin dört özelliği farklıdır:\n\n- Radyaldir (ağaç yapısında, tek yönden beslenir).\n- R/X oranı yüksektir.\n- Dengesizdir (fazlar eşit yüklü değildir).\n- Ölçü eksiktir.\n\nBu yüzden geri-ileri süpürme veya üç faz model gerekir. Dengeli DC (doğru akım yaklaşımlı) tarama fider ucu gerilimini gizler.\n\n**Barındırma kapasitesi nedir?**\n\nBarındırma kapasitesi, limitler bozulmadan o düğüme bağlanabilecek üretimdir.\n\nGerilim, termik, koruma ve ters akış ayrı kapasite verir; en küçüğü geçerlidir.\n\nTrafo yanı ile fider ucu aynı MW’yi taşımaz. En kötü saat, minimum yük ve maksimum üretimin aynı anda olduğu saattir.\n\n## Yük akışı\n\n**Bara tipleri?**\n\n| Tip | Bilinen | Bilinmeyen |\n| --- | --- | --- |\n| PQ | Güç (P ve Q) | Gerilim ve açı |\n| PV | P ve gerilim | Q ve açı |\n| Slack (salınım barası) | Gerilim ve açı | Kayıp ve dengeyi toplar |\n\nSlack bir santral değildir; hesabın denge noktasıdır.\n\nPV bara, Q limitine çarpınca PQ olur. Bu dönüşüm yoksa gerilim sahte düzelir.\n\n**Newton-Raphson’da Jacobian ne işe yarar?**\n\nJacobian, güç artığını (hesaplanan ile istenen güç arasındaki farkı) gerilim düzeltmesine çeviren türev matrisidir.\n\nBloklar H N M L'dir: P ve Q’nun açıya ve gerilime türevleri.\n\nSeyrek lineer sistem çözülür, yoğun ters alınmaz. İletimde 3–6 iterasyon tipiktir.\n\nIraksamanın olası nedenleri: ada, veri hatası, kontrol salınımı veya burun noktası (gerilim çökmesinin eşiği).\n\n**DC yük akışı nerede meşru, nerede değil?**\n\nDC yük akışı varsayımları: açı küçük, gerilim yaklaşık 1 pu, kayıp ve reaktif ihmal.\n\n| Meşru | Meşru değil |\n| --- | --- |\n| Termik N-1 eleği | Gerilim ihlali |\n| PTDF (Power Transfer Distribution Factor, güç aktarım dağılım çarpanı) | Dağıtım |\n| | Ağır yük |\n\nElekten geçen durum AC (alternatif akım, tam) yük akışıyla doğrulanır.\n\n**Yük akışı ıraksadı, ilk bakacağın üç şey?**\n\n1. Ada ve kesici topolojisi.\n2. Sıfır empedans veya yanlış baz.\n3. Q limiti ve kademe salınımı.\n\nVeri sağlamsa yükü ölçekleyip burun noktasına bakılır. Çözücüyü değiştirmek ilk adım değildir.\n\n## Kısa devre\n\n**En büyük arıza her zaman üç faz mıdır?**\n\nHayır. Katı topraklı şebekede tek faz-toprak arıza, Z0 küçükse üç fazı geçebilir.\n\nEkipman için azami, röle için asgari hesabı ayrı koşarım. IEC 60909 (International Electrotechnical Commission'ın kısa devre hesap standardı) gerilim katsayısı kullanır.\n\n**X'', X' ve Xd neden karışmaz?**\n\nSenkron makinenin üç reaktansı üç ayrı zaman dilimine aittir:\n\n| Reaktans | Adı | Nerede kullanılır |\n| --- | --- | --- |\n| X'' | Alt geçici reaktans | Kesici ve ilk tepe |\n| X' | Geçici reaktans | Kararlılık modeli |\n| Xd | Senkron reaktans | Sürekli hal |\n\nX/R oranı, DC bileşenin sönümünü ve tepe çarpanını belirler.\n\n**Evirici kısa devreye ne katkı verir?**\n\nTakip eden evirici (şebekeyi izleyerek akım basan evirici), akımını kontrolle sınırlar. Senkron makinenin katları gibi beslemez.\n\nKoruma görme ve yön bundan bozulur. Şebeke oluşturan kontrol (gerilimi kendisi kuran evirici) ayrı senaryodur. Üretici modeli olmadan sayı vermem.\n\n## Güvenlik\n\n**N-1’i yönetmelik diline yakın söyle.**\n\nN-1, tek bir elemanın devre dışı kalmasına karşı güvenlik ölçütüdür. Tek eleman devre dışıyken:\n\n- termik limit aşılmaz,\n- gerilim ve frekans bandında kalır,\n- kararlılık bozulmaz,\n- kullanıcı kaybedilmez,\n- sistem adalara bölünmez.\n\nNükleer bağlantıda N-2 aranır. Ortak direkte çift devre bağımsız iki arıza değildir.\n\n**Güvenlik ile kararlılık?**\n\nGüvenlik, arıza sonrası limit içinde kalmaktır. Kararlılık, yeni dengeye oturmaktır.\n\nTermik olarak güvenli bir durum, açı olarak kararsız olabilir. İkisi ayrı hesaptır, aynı işletme kararında buluşur.\n\n**Binlerce arızayı nasıl tararsın?**\n\nKatmanlı bir eleme yaparım:\n\n1. Aday liste.\n2. DC ve LODF (Line Outage Distribution Factor, hat açma dağılım çarpanı) eleği.\n3. Performans indeksiyle sıra.\n4. Şüphelide AC.\n5. Büyük üretim ve zayıf koridorda dinamik.\n\nYTBS (Yük Tevzi Bilgi Sistemi) ölçeğindeki arıza simülasyonu bu katmandır. Her arızaya EMT koşmam.\n\n**Önleyici ve düzeltici?**\n\n| Tür | Ne yapar |\n| --- | --- |\n| Önleyici | Arızadan önce üretimi kaydırır, maliyeti hemen öder |\n| Düzeltici | Arızadan sonra kaydırır veya yük atar |\n\nSIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) düzeltici ve otomatiktir. Acil termik limit, operatöre süre tanır.\n\n## Kararlılık\n\n**Salınım denklemi ne söyler?**\n\n`(2H/ω0) δ'' = Pm - Pe`. Burada H atalet sabiti, ω0 nominal açısal hız, δ'' rotor açısının ikinci türevi, Pm mekanik güç, Pe elektriksel güçtür.\n\nAçık güç (Pm ile Pe arasındaki fark) açıyı hızlandırır.\n\nEşit alan ölçütü: hızlanma alanı yavaşlama alanından küçükse açı yakalanır. Kritik temizleme süresi koruma süresinden büyük olmalıdır.\n\n**PSS neyi söndürür?**\n\nKüçük sinyal salınımını söndürür.\n\nPSS, hız veya güç sapmasını AVR (Automatic Voltage Regulator, otomatik gerilim regülatörü) referansına ekler.\n\n- Yerel mod yaklaşık 1 Hz'dir.\n- Bölgeler arası mod daha yavaştır.\n\nYönetmelik, büyük konvansiyonel ünitelerde 0–5 Hz ve ENTSO-E bölgeler arası mod için PSS arar. Kötü kazanç sönümü azaltır.\n\n**Gerilim neden dakikalar sonra çöker?**\n\nZincir şöyle işler:\n\n1. Hat açılır.\n2. Gerilim düşer.\n3. Yük toparlar.\n4. OLTC (On-Load Tap Changer, yük altında kademe değiştirici) gerilimi kaldırmak için iletimden daha çok reaktif çeker.\n\nBeş saniyelik kısa devre simülasyonu bunu görmez. PV eğrisinin (güç–gerilim eğrisi) burnu statik marjdır.\n\n**RoCoF ve atalet?**\n\nRoCoF (Rate of Change of Frequency), frekansın değişim hızıdır.\n\n`RoCoF ≈ (ΔP/S) f0 / (2H)`. Burada ΔP kaybedilen güç, S sistem gücü, f0 nominal frekans, H atalet sabitidir.\n\nH düşünce aynı ünite kaybı daha dik frekans düşüşü yapar. Takip eden evirici doğal H katmaz.\n\nYTBS atalet hesabı bu envanterdir. Düşük frekans rölesi son çaredir; kademeleri TEİAŞ (Türkiye Elektrik İletim A.Ş.) yıllık belirler.\n\n**Primer, sekonder, tersiyer?**\n\n| Kontrol | Nasıl çalışır | Süre / eşik |\n| --- | --- | --- |\n| Primer | Hız regülatörü | 200 mHz tanımında 30 saniye |\n| Sekonder | AGC (Automatic Generation Control, otomatik üretim kontrolü); frekansı 50 Hz’e ve sınır programına çeker | Normal bant 49,8–50,2 Hz |\n| Tersiyer | Dengeleme piyasasında | 15 dakika |\n\nLFSM (Limited Frequency Sensitive Mode, sınırlı frekans duyarlı mod) eşikleri 49,8 ve 50,2 Hz’dir.\n\n## Durum kestirimi\n\n**SCADA yetmez mi?**\n\nSCADA (Supervisory Control and Data Acquisition, uzaktan izleme ve veri toplama) ölçüsü gürültülü, eksik ve bazen bozuktur. Yük akışı ise gücün doğru bilindiğini varsayar.\n\nDurum kestirimi, fazla ölçüden en olası gerilim ve açıyı çıkarır. Güvenlik analizi ancak sağlam kestirime koşar.\n\n**WLS’yi yaz.**\n\nWLS (Weighted Least Squares), ağırlıklı en küçük kareler yöntemidir. Denklemler:\n\n- Amaç fonksiyonu: `J = (z-h)ᵀ W (z-h)`, `W = R⁻¹`. Burada z ölçüm vektörü, h(x) ölçümlerin durumdan hesaplanan değeri, R ölçüm hata kovaryansıdır.\n- Kazanç matrisi ve adım: `G = Hᵀ W H`, `G Δx = Hᵀ W (z-h)`. H ölçüm Jacobian'ıdır.\n\nG tekilse sistem gözlenemez. Referans açı sabitlenmezse de G tekil olur. Pseudo-ölçüm (tahminle doldurulan sahte ölçüm) ağırlığı düşük tutulur.\n\n**Kötü veriyi nasıl bulursun?**\n\n1. Tespit: J, serbestlik derecesi m−n olan ki-kare eşiğini aşarsa sette kötü veri vardır (m ölçüm sayısı, n durum sayısı).\n2. Yer bulma: normalize artığı en büyük olan ölçü işaret edilir.\n\nSınırları:\n\n- Kritik ölçüde test kördür.\n- Kaldıraç noktasında artık küçük kalabilir.\n- Topoloji hatası ölçü atarak düzelmez.\n\n**PMU neyi değiştirir?**\n\nPMU (Phasor Measurement Unit, fazör ölçüm birimi), senkron fazör ölçer. Bu, durumu lineer ve hızlı tahmin ettirir.\n\nSCADA ile hibrit kullanılır. Dakikalık SCADA, SIPS’in yüz milisaniye penceresine yetişmez.\n\n## Koruma ve topraklama\n\n**Dört nitelik?**\n\n1. Seçicilik.\n2. Hız.\n3. Duyarlılık.\n4. Güvenilirlik.\n\nGüvenilirliğin iki yüzü vardır: gerektiğinde çalışma ve gerekmediğinde susma. Yedek koruma daha yavaş ve daha geniş bölgededir.\n\n**Mesafe bölgelerini tipik değerle, ayar iddiası olmadan söyle.**\n\n| Bölge | Kapsam | Gecikme |\n| --- | --- | --- |\n| Bölge 1 | Hattın yaklaşık yüzde 80’i | Gecikmesiz |\n| Bölge 2 | Hattın tamamı ve karşı ucun bir kısmı | Birkaç yüz milisaniye |\n| Bölge 3 | Geniş yedek | — |\n\nYük istilası ve güç salınımı yanlış açmayı bölge 3’te doğurur. Salınım bloğu, kararlı salınımda açmayı keser. Gerçek ayar şirket standardındadır.\n\n**Diferansiyel neden ayrı?**\n\nDiferansiyel koruma, bölgeye giren ve çıkan akımın farkına bakar. Bu, seçiciliği süreden bağımsız yapar.\n\nCT (Current Transformer, akım trafosu) doyması ve trafo inrush'ı (enerjilendirme anındaki ani mıknatıslanma akımı) yanlış fark üretir. Tutma ve ikinci harmonik bunun içindir.\n\n**Topraklama neden korumayla birlikte?**\n\nTopraklama biçimi, toprak arıza akımını yani sıfır diziyi belirler.\n\nAdım ve dokunma gerilimi arıza temizleme süresine bağlıdır. IEEE 80 (Institute of Electrical and Electronics Engineers'ın trafo merkezi topraklama standardı), süreyi ve toprak özdirencini birlikte kullanır.\n\nYavaş koruma, izin verilen dokunma gerilimini düşürür.\n\n## Ekonomi ve planlama\n\n**Eşit λ?**\n\nKayıpsız sistemde optimum, devredeki ünitelerin artan yakıt maliyetinin (bir MW daha üretmenin maliyetinin) eşitlenmesidir. Bu ortak değere λ (lambda) denir.\n\nLimitteki ünite eşitliğin dışındadır.\n\nKayıp varsa ceza faktörü `1/(1-∂Pkayıp/∂P)` ile çarpılır.\n\n**Ekonomik dağıtım, ünite tahsisi, OPF?**\n\n| Problem | Ne yapar |\n| --- | --- |\n| Ekonomik dağıtım | Devredeki MW’yi paylaşır |\n| Ünite tahsisi | Kimin açık olacağıdır; ikili değişkendir; rampa ve en az açık süre vardır |\n| OPF (Optimal Power Flow, optimal güç akışı) | Şebeke limitini ekler |\n| SCOPF (Security Constrained OPF, güvenlik kısıtlı OPF) | Bir de N-1 ekler |\n\n**Piyasa ile fizik nerede ayrılır?**\n\n- Gün öncesi ve gün içi piyasa EPİAŞ’tadır (Enerji Piyasaları İşletme A.Ş.).\n- Dengeleme, AGC ve kısıt talimatı TEİAŞ’tadır.\n\nProgram şebekeye sığmazsa yeniden dağıtım yapılır, ardından N-1 tekrar bakılır.\n\n**LOLE ile N-1?**\n\nLOLE (Loss of Load Expectation), üretim yeterliliğinin beklenen yük kaybı süresidir. N-1 ise iletimin deterministik güvenlik kuralıdır. İkisi aynı göstergenin iki adı değildir.\n\nELCC (Effective Load Carrying Capability, etkin yük taşıma kapasitesi), rüzgârın isim plakasının tamamını kapasite saymaz.\n\n**Fayda/maliyette gizleme.**\n\nİskonto, talep ve kısıntı fiyatı değişince sıralama değişiyor mu, ona bakarım.\n\nAda riskini iç verim oranının içine saklamam. Düşük olasılıklı ülkeyi bölen koridoru, sık ama yerel arızayla aynı kefeye koyarım.\n\n## Optimizasyon\n\n**AC-OPF neden “çözdüm” demez?**\n\nAC-OPF (tam AC modelli optimal güç akışı) dışbükey değildir; yerel çözüm vardır.\n\nYük akışıyla fizibiliteyi, mümkünse bir alt sınırla kaliteyi kontrol ederim. Kademe yuvarlanır, ünite yuvarlanmaz.\n\n**Gölge fiyat?**\n\nGölge fiyat, bir kısıtın Lagrange çarpanıdır:\n\n- Güç dengesinin çarpanı, o baradaki bir MW’nin fiyatıdır.\n- Hat limitinin çarpanı, sıkışıklık maliyetidir.\n- Boş kısıtın çarpanı sıfırdır.\n\n**Büyük N-1 optimizasyonu?**\n\n1. Önce baz durumu çöz.\n2. İhlal eden arızayı kısıt olarak ekle.\n3. Tekrarla.\n\nBenders ayrıştırması aynı fikrin ayrıştırılmış halidir. Tüm arızayı baştan koymak bellek yer.\n\n## Ürün, yazılım, yenilenebilir, veri\n\n**YTBS’yi bir cümleyle.**\n\nTEİAŞ’ın kullandığı, şebekenin ölçümle güncellenen modelinde güvenlik, tahmin ve optimizasyon koşan, SCADA ile web servisle konuşan dijital ikiz platformu. THS 9.\n\nTHS, Teknoloji Hazırlık Seviyesi demektir; 9 en üst basamaktır ve ürünün gerçek işletmede kanıtlandığını söyler.\n\n**SIPS ile röle?**\n\nRöle ekipmanı korur.\n\nSIPS, PMU sınıfı geniş alan verisiyle sistem bütünlüğü için üretim veya yük atar. Zincirleme açmayı küçük ve kontrollü kayba çevirmek içindir.\n\n**Dijital ikiz kumanda eder mi?**\n\nHayır. Senaryo ve karar desteği üretir.\n\nKumanda yetkisi ve prosedür SCADA tarafında kalır. Kalite bayrağı bozuksa sonuç otomasyona bağlanmaz.\n\n**CIM neden her şeyi çözmez?**\n\nCIM (Common Information Model, ortak bilgi modeli), şebeke verisinin standart veri modelidir.\n\n- Ekipman, topoloji ve analog ayrı profillerdir.\n- CGMES (Common Grid Model Exchange Standard, ortak şebeke modeli alışveriş standardı), Avrupa iletim alışverişinin profilidir.\n- Koruma çoğu zaman ayrı kalır.\n\nBaz, kademe ve işaret bozulmasını sayı ve seçilmiş akışla doğrularım.\n\n**Öğrenen model kararlılıkta ne yapar?**\n\nAday arızayı eler ve sıralar. İhlal fizikle doğrulanır.\n\nYük atma eşiği onaysız değişmez. Yeni hat modeli eskidir: şebekeye yeni hat eklenince, eski veriyle eğitilmiş model artık güncel değildir. Veri azsa derin ağ kurmam.\n\n**Düşük atalette ilk üç önlem?**\n\n1. Atalet envanteri ve RoCoF izleme.\n2. Primer ve hızlı frekans desteği olan kaynak veya depolama.\n3. RoCoF rölelerinin yanlış açmasını gözden geçirmek.\n\nSentetik atalet, şebeke oluşturan kontrolün bir ayarıdır. Fiziksel H ile aynı sınıfta söylemem, katkı olarak söylerim.\n\n## İngilizce kısa tur\n\nBu bölümde cevaplar İngilizce söylenir. Altlarındaki Türkçe not, cevabın ne dediğini anlaman içindir.\n\n**What is state estimation?**\n\nIt finds the most likely bus voltages and angles from redundant, noisy measurements by weighted least squares. Bad data is detected with the chi-square test and located with the normalized residual. Contingency analysis runs on that estimate only if the quality flag is healthy.\n\nTürkçe not: Durum kestirimi, fazla ve gürültülü ölçülerden ağırlıklı en küçük kareler ile en olası bara gerilim ve açılarını bulur. Kötü veri ki-kare testiyle tespit edilir, normalize artıkla yeri bulunur. Arıza analizi bu kestirim üzerinde yalnızca kalite bayrağı sağlamsa koşar.\n\n**What does N-1 mean in Turkey?**\n\nAfter a single outage, thermal, voltage and frequency limits hold, the system stays stable, no customer is lost and the system does not split into islands. The planning case is five percent above peak. Nuclear connection points are planned for N-2.\n\nTürkçe not: Tek bir eleman kaybından sonra termik, gerilim ve frekans limitleri korunur, sistem kararlı kalır, kullanıcı kaybedilmez ve sistem adalara bölünmez. Planlama vakası puantın yüzde 5 üzeridir. Nükleer bağlantı noktaları N-2'ye göre planlanır.\n\n**Why can a DC power flow not replace an AC power flow?**\n\nIt ignores voltage, reactive power and losses. It is a fast thermal screen. Critical cases are confirmed with an AC solution, including generator reactive limits.\n\nTürkçe not: DC yük akışı gerilimi, reaktif gücü ve kayıpları yok sayar. Hızlı bir termik elektir. Kritik vakalar, generatör reaktif limitleri dahil AC çözümle doğrulanır.\n"}, {"id": "20-Soru-Bankasi/02-Yazilim-Davranissal-Formul.md", "group": "20  Soru bankası", "title": "Yazılım, davranışsal sorular ve formül kartı", "body": "# Yazılım, davranışsal sorular ve formül kartı\n\nBu sayfada dört parça var:\n\n1. Yazılım soruları ve kısa cevapları.\n2. Davranışsal sorular (kişilik, deneyim, motivasyon) ve cevap iskeletleri.\n3. Panele senin sorabileceğin sorular.\n4. Formül kartı, rakam kartı ve birim refleks listesi: mülakattan hemen önce göz gezdirmek için.\n\n## Yazılım soruları\n\n**Python’da büyük Ybus neden yavaşlar?**\n\nYbus (bara admitans matrisi), şebekedeki baraların birbirine bağlantısını tutan matristir. Çoğu elemanı sıfırdır; buna seyrek matris denir.\n\nYavaşlığın nedeni yoğun matris kurulmasıdır. Yoğun matris, sıfırları da tek tek bellekte tutar. On bin barada yoğun Ybus gigabayt bellek, yoğun LU (alt-üst üçgen çarpanlara ayırma) ise dakikalar demektir.\n\nÇözüm:\n\n- `scipy.sparse` ile matrisi seyrek tutarım.\n- Profilde (kodun hangi kısmının ne kadar sürdüğünü ölçerek) asıl sürenin çözücüde mi, Python döngüsünde mi olduğuna bakarım.\n\n**Yük akışı servisi ıraksarsa API ne döner?**\n\nAPI (Application Programming Interface, uygulama programlama arayüzü), başka programların servisi çağırdığı arayüzdür.\n\nBoş 200 (HTTP \"başarılı\" kodu) ve sessiz liste dönmem. Şunları döndürürüm:\n\n- Kalite bayrağı.\n- Neden: ada, iterasyon veya limit.\n- Son iterasyonun artığı.\n\nÇağıran N-1 modülü, o bayrakla gelen sonucu operatöre “kesin” diye basmaz.\n\n**REST ile SOAP?**\n\nİkisi de servisler arası haberleşme biçimidir:\n\n| Yer | Tercih |\n| --- | --- |\n| Yeni modüller arasında | REST (Representational State Transfer) ve JSON (JavaScript Object Notation, metin tabanlı veri biçimi) |\n| Eski EMS (Energy Management System, enerji yönetim sistemi) entegrasyonunda | SOAP (Simple Object Access Protocol) ve WSDL (Web Services Description Language, servisin tanım dosyası) |\n\nYTBS’nin (Yük Tevzi Bilgi Sistemi) SCADA (Supervisory Control and Data Acquisition, uzaktan izleme ve veri toplama) tarafı web servistir.\n\nAğır hesap, istek zaman aşımında değil, kuyrukta koşar. Yani uzun süren hesap, isteği bekletmeden ayrı bir iş kuyruğuna verilir.\n\n**Java’da paralel N-1 neden bozulur?**\n\nİş parçacıkları (thread'ler) aynı vaka nesnesini değiştirirse yarış (race condition) olur: sonuç, hangi iş parçacığının önce yazdığına bağlı hale gelir.\n\nÇözüm:\n\n- Her işe kopya veya değişmez (immutable) girdi veririm.\n- Sonuçlar ihlal tablosuna kimlikleriyle yazılır.\n\n**Test setin nedir?**\n\nTest setim şu vakalardan oluşur:\n\n1. Elde çözülmüş üç bara.\n2. Bilinen bir N-1 ihlali.\n3. Bilinen bir kötü ölçüm.\n4. Bilerek ıraksayan vaka.\n5. Boş veri.\n\nAltın değer (doğru olduğu bilinen beklenen sonuç) dosyada kilitlidir.\n\nUlusal modeli teste ham koyamam; sentetik veya maskelenmiş vaka kullanırım.\n\n**MATLAB prototipi nasıl ürüne iner?**\n\nSıra şöyledir:\n\n1. Denklem ve kazanç doğrulanır.\n2. Birim ve işaret sözleşmesi yazılır.\n3. Python veya Java’da aynı üç barada aynı sayı üretilir.\n4. Ancak ondan sonra servise girer.\n\nSimulink diyagramı sunucuya gömülmez.\n\n**Modeli Git’e koyar mısın?**\n\nGit, kod sürüm kontrol aracıdır.\n\n| Git'e girer | Git'e girmez |\n| --- | --- |\n| Kod | Gizli şebeke, parola, ticari üretim ve müşteri verisi |\n\nBüyük vaka için sürüm notu ve erişim kuralı tutulur. Model sürümü, algoritma sürümü ve limit sürümü ayrıdır.\n\n## Davranışsal sorular\n\n**Kendini tanıt.**\n\n[`19` dosyasındaki](../19-Davranissal/00-Alt-Basliklar.md) iskeleti kullan. İskeletin soruları:\n\n- Üç yılda hangi şebeke, hangi analiz, hangi araç?\n- Hangi karar değişti?\n- Yazılımda ne tekrarlanabilir oldu?\n- MAM’daki (TÜBİTAK Marmara Araştırma Merkezi) hangi halkaya bağlanıyor?\n\n**Zor bir analiz hatası.**\n\nSTAR kalıbıyla anlat: Situation (durum), Task (görev), Action (eylem), Result (sonuç).\n\nÖrnek iskelet:\n\n1. Sonuç beklenenden uzaktı.\n2. Baz veya işaret hipotezi kurdum.\n3. İki araçta aynı barayı karşılaştırdım.\n4. Kademe sargısının ters girildiğini buldum.\n5. Modeli kilitledim.\n6. Raporu düzelttim.\n\nKendi hikâyen yoksa bu örneği kendi hayatın gibi anlatma.\n\n**Yetişmeyen teslim.**\n\nKapsamı önden kestim: önce güvenlik için zorunlu senaryo, sonra duyarlılık.\n\nBunu tek başıma sessizce yapmadım; hangi senaryonun ertelendiğini yazdım. Kaliteyi “idare eder” diye düşürmedim.\n\n**Bilmediğin bir araç.**\n\nÖğrenme döngüm:\n\n1. Küçük resmi örnek.\n2. Elde doğrulama.\n3. Sonra gerçek vaka.\n4. Fark varsa baz ve işarete bakma.\n\nÖğrendiğin son aracı bu döngüyle anlat.\n\n**Ekipte anlaşmazlık.**\n\nKoruma süresi ile kararlılık CCT’si (Critical Clearing Time, kritik temizleme süresi) çatışırsa, sayıyı aynı vakada yan yana koyarım.\n\nKarar, kimin sesi yüksekse değil, hangi limitin yönetmelikte bağlayıcı olduğuna göre verilir.\n\n**Neden MAM, neden bu grup?**\n\nÜlke iletiminin işletme yazılımı burada üretilmiş; YTBS ve SIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) sahada.\n\nBen analiz ile kodun birleştiği yerde çalışıyorum. Danışmanlık dosyası değil, tekrar koşulan araç istiyorum.\n\n**Lisansüstü?**\n\nCevabın dört parçası:\n\n1. Bir cümlelik problem.\n2. Neden Türkiye sisteminde büyüyor.\n3. Hangi modüle değer.\n4. Senin tecrüben nasıl bağlanıyor.\n\nYapmayacaksan söyleme. Motivasyon, ilanda “yapmış olmak” ile eşdeğer kabul edilir; sahte kayıt kabul edilmez.\n\n**Online envanter?**\n\nOnline envanter, süreçteki çevrimiçi kişilik değerlendirmesidir (ayrıntısı: [Envanter ve online değerlendirme](../01-Kurum-Ilan-ve-Surec/05-Envanter-ve-Online-Degerlendirme.md)).\n\n- Tutarlı işaretle.\n- Her maddeye “her zaman” deme.\n- Araştırmacı profili: analitik, planlı, öğrenmeye açık.\n- Kahraman yönetici profili bu kadroyla çelişir.\n\n## Panele sor\n\nMülakat sonunda \"sizin sorunuz var mı?\" denirse sorabileceğin üç soru:\n\n- İşe başlayan araştırmacı ilk yıl hangi halkada duruyor: model, kestirim, güvenlik, tahmin, optimizasyon?\n- İletim işletmesi ile dağıtım veya planlama işinin önümüzdeki yıldaki ağırlığı nedir?\n- Lisansüstü ve proje teslimi takvimde nasıl ayrılıyor?\n\n## Formül kartı\n\nAşağıdaki kod bloğu, notlardaki temel formüllerin tek yerde toplanmış halidir. Satır grupları sırasıyla şunlardır:\n\n| Grup | Ne anlatır |\n| --- | --- |\n| `S`, `Z_pu`, `Z_yeni` | Kompleks güç, per-unit (birim değer) dönüşümü ve baz değiştirme |\n| `P`, `ΔV` | İki bara arası aktif güç aktarımı ve dağıtımda gerilim düşümü |\n| `I_3faz`, `I_faz-toprak` | Üç faz ve tek faz-toprak kısa devre akımı |\n| `NR`, `DC` | Newton-Raphson yük akışı adımı ve DC yük akışı |\n| `J`, `G`, `r_N,i` | Durum kestirimi: WLS (ağırlıklı en küçük kareler) amacı, kazanç matrisi, normalize artık |\n| Salınım denklemi, `RoCoF` | Rotor açısı dinamiği ve frekans değişim hızı (Rate of Change of Frequency) |\n| `dC_i/dP_i = λ` | Ekonomik dağıtım: kayıpsız ve kayıplı eşit artan maliyet koşulu |\n| `ζ` | Bir salınım modunun sönüm oranı (σ özdeğerin gerçek kısmı, ω sanal kısmı) |\n\n```\nS = P + jQ\nZ_pu = Z_ohm * S_baz / V_baz²\nZ_yeni = Z_eski * (S_yeni/S_eski) * (V_eski/V_yeni)²\n\nP = (Vs Vr / X) sin δ\nΔV ≈ (P R + Q X) / V\n\nI_3faz = V / Z1\nI_faz-toprak = 3 V / (Z1 + Z2 + Z0 + 3 Zf)\n\nNR:  [ΔP; ΔQ] = [H N; M L] [Δθ; ΔV/V]\nDC:  P = B θ ,  B_ik = -1/x_ik\n\nJ = (z - h)ᵀ W (z - h) ,  W = R⁻¹\nG = Hᵀ W H\nr_N,i = |r_i| / sqrt(Ω_ii)\n\n(2H/ω0) d²δ/dt² = Pm - Pe\nRoCoF ≈ (ΔP / S_sys) * f0 / (2 H_sys)\n\ndC_i/dP_i = λ          kayıpsız\n(dC_i/dP_i) / (1 - ∂Pkayıp/∂P_i) = λ\n\nζ = -σ / sqrt(σ² + ω²)\n```\n\n## Rakam kartı (tarihiyle söyle)\n\nBu rakamları söylerken yanındaki tarihi de söyle; rakamlar zamanla değişir.\n\n| Konu | Değer |\n| --- | --- |\n| Kurulu güç, 2025 sonu | 122.518,6 MW |\n| Ani puant (en yüksek anlık yük), 2025 | 60.414 MW |\n| Kurulu güç, Eylül 2026 sonu | 127.355,2 MW |\n| Hat uzunluğu, Ekim 2026 sonu | 77.863 km |\n| Frekans hedef bandı | 49,8–50,2 Hz |\n| Uç tasarım frekansları | 47,5 ve 51,5 Hz |\n| Primer frekans kontrolü tanımı | 200 mHz, 30 s |\n| Tersiyer kontrol | 15 dk |\n| PSS (Power System Stabilizer, güç sistemi dengeleyicisi) şartı | 75 MW ve üzeri ünite veya 300 MW ve üzeri konvansiyonel santral, 0–5 Hz |\n| Planlama | Puant + %5, N-1, nükleer bağlantıda N-2 |\n| Mülakat | Baraj 70. Kontenjan 3. Çağrı yaklaşık 10 kat |\n\n## Birim refleks listesi\n\nHesapta en sık yapılan birim hataları ve doğru alışkanlık:\n\n| Büyüklük | Kural |\n| --- | --- |\n| Açı | Denklemde radyan, ekranda derece |\n| Güç | Ya hep pu ya hep MW |\n| Gerilim | pu ile kV aynı tabloda toplanmaz |\n| Zaman | Milisaniye ile saniye karışmaz; RoCoF birimi Hz/s |\n| Atalet H | Birimi saniye; sistem bazı ile makine bazı karışmaz |\n"}, {"id": "20-Soru-Bankasi/03-Sozlu-Cevap-Kalibi-ve-Bilmiyorum-Calismasi.md", "group": "20  Soru bankası", "title": "Sözlü cevap kalıbı ve \"bilmiyorum\" çalışması", "body": "# Sözlü cevap kalıbı ve \"bilmiyorum\" çalışması\n\nBu sayfa iki şeyi öğretir:\n\n1. 60–90 saniyelik sözlü cevap kalıbı: bir soruya beş parçada, doğru uzunlukta cevap vermek.\n2. \"Bilmiyorum, şöyle yaklaşırdım\" çalışması: bilmediğin bir soruda puan kaybetmeden, dürüstçe cevap vermek.\n\n## Neden süre\n\nSözlü mülakatta puanı bilgi değil, **iletilen** bilgi alır. Yani bildiğin şey, ancak panele ulaştığı kadar puan getirir.\n\nSüre neden önemli:\n\n| Cevap uzunluğu | Panelde yarattığı etki |\n| --- | --- |\n| 20 saniye | Yüzeysel görünür |\n| Üç dakika | Panelin sorusunu unutturur ve takip sorusuna yer bırakmaz |\n| 60–90 saniye | Bir fikri gerekçesiyle ve bir örnekle söylemeye yeter |\n\nÖlçü:\n\n- Türkçe'de sakin konuşma dakikada yaklaşık 120–140 kelimedir.\n- 90 saniye **en fazla 200 kelime** eder.\n- Notlardaki \"90 saniye\" kutuları 90–120 kelimedir. Yani bir örnek veya sayı eklemene yer vardır.\n\n## Beş parçalı kalıp\n\nHer cevabı aşağıdaki beş parçayla kur. Süreler, toplamın 60–90 saniyede kalması içindir.\n\n| # | Parça | Süre | İçerik |\n| --- | --- | --- | --- |\n| 1 | **Doğrudan cevap** | 10 s | Sorunun cevabı, tek cümle. Giriş yapma |\n| 2 | **Mekanizma** | 30 s | Neden öyle? İki-üç cümle fizik veya mantık |\n| 3 | **Sayı veya örnek** | 20 s | Elle çözdüğün örnekten bir sayı |\n| 4 | **Sınır** | 15 s | Bu ne zaman geçerli değil? Hangi varsayım? |\n| 5 | **Bağ** (isteğe bağlı) | 10 s | Yazılım tarafı veya grubun işi |\n\nDördüncü parça seni diğer adaylardan ayırır. Sınırı söyleyen aday, konuyu ezberlemediğini gösterir.\n\n### Örnek: \"N-1 güvenlik analizi nedir?\"\n\nN-1, sistemin herhangi bir tek elemanını kaybettikten sonra güvenli kalıp kalmadığını soran ölçüttür. Aşağıdaki cevapta parantez içindeki numaralar, kalıbın beş parçasını gösterir. AC, alternatif akımlı tam yük akışı demektir.\n\n> **(1)** \"Herhangi bir tek elemanın kaybından sonra sistemin sınırlar içinde kalıp kalmadığını denetleyen analizdir. **(2)** Her hat, trafo ve generatör sırayla devre dışı bırakılır; arıza sonrası akışlar ısıl sınırla, gerilimler bantla karşılaştırılır. Hepsini tam yük akışıyla çözmek pahalı olduğu için önce doğrusal modelle taranır, sınıra yakın vakalar AC ile doğrulanır. **(3)** Elle çözdüğüm üç baralı örnekte bir hattın kaybı, komşu hattı yüzde yüz otuz üç yüklüyordu ve bu, üretimi yeniden dağıtarak çözülemiyordu; çünkü yük tek koridordan besleniyordu. **(4)** Doğrusal tarama gerilimi ve reaktif gücü görmez; ayrıca N-1 statik bir denetimdir, arıza anındaki geçici hal kararlılığını söylemez. **(5)** Yazılım tarafında vakalar birbirinden bağımsızdır, paralel koşar.\"\n\nYaklaşık 110 kelime, 55–60 saniye.\n\n## Kendi cevabını kurma\n\nSoru bankasındaki ([`01-Teknik-Sorular`](01-Teknik-Sorular.md)) her soru için şu adımları uygula:\n\n1. Cevabı kâğıda beş parça halinde yaz. Her parça tek satır.\n2. Kâğıda bakmadan, ayakta, sesli söyle. Telefonla kaydet.\n3. Dinle ve şunlara bak:\n   - Süre 60–90 saniye arasında mı?\n   - İlk cümle sorunun cevabı mı, yoksa giriş mi?\n   - Bir sayı veya örnek var mı?\n   - Sınır söylendi mi?\n   - \"Şey\", \"yani\", \"aslında\" kaç kez geçti?\n4. İkinci kez kaydet. Çoğunlukla ikinci kayıt yeter.\n\nBütün soruları böyle yapmaya vakit yetmez. Öncelik sırası:\n\n1. Her klasörün \"90 saniye\" kutusu (zaten yazılı).\n2. Sonra `04-Panel-Provasi`'ndaki açılış soruları.\n\n## Sık yapılan anlatım hataları\n\n| Hata | Düzeltme |\n| --- | --- |\n| Tarihçeyle başlamak (\"Güç sistemlerinde yük akışı çok eski bir konudur...\") | İlk cümle cevap olsun |\n| Formül okumak (\"P eşittir V bir çarpı V iki bölü X çarpı sinüs delta\") | Formülün **ne dediğini** söyle; istenirse tahtaya yaz |\n| Her şeyi söylemeye çalışmak | Bir fikir, bir örnek. Gerisini takip sorusuna bırak |\n| Emin olmadığın şeyi kesin söylemek | \"Yanılmıyorsam\", \"bildiğim kadarıyla\", \"bunu doğrulamam gerekir\" |\n| Her cümleye \"sanırım\" eklemek | Bildiğini düz söyle; yalnız emin olmadığını işaretle |\n| Soruyu yanlış anlayıp devam etmek | \"Şunu mu soruyorsunuz: ...?\" diye sor. Puan kaybettirmez |\n| Sessizlik korkusuyla hemen konuşmak | \"Bir saniye düşüneyim\" de. Beş saniye sessizlik normaldir |\n| Yazılım benzetmesini fazla uzatmak | Bir cümle. Panel güç sistemcidir; benzetme senin anlaman içindir |\n\n## Tahta kullanımı\n\nBazı konular çizerek daha iyi anlatılır. Parantez içindeki kod, konunun anlatıldığı klasör/dosya numarasıdır:\n\n| Konu | Not dosyası |\n| --- | --- |\n| Eşit alan ölçütü | `08/02` — [Salınım denklemi ve eşit alan](../08-Kararlilik/02-Salinim-Denklemi-Esit-Alan-Elle.md) |\n| Dizi devrelerinin bağlantısı | `06/02` — [Asimetrik arıza](../06-Kisa-Devre/02-Asimetrik-Ariza-Elle-IEC-Evirici.md) |\n| Ybus kurulumu | `02/04` — [Ybus elle ve seyrek matris](../02-Guc-Sistemleri-Temelleri/04-Ybus-Elle-ve-Seyrek-Matris.md) |\n| EMS (Energy Management System, enerji yönetim sistemi) veri akışı | `16/02` — [SCADA, protokoller, CIM](../16-Yazilim-Mimarisi/02-SCADA-Protokoller-CIM-TSDB-Ikiz-Siber.md) |\n| Koordinasyon eğrileri | `10/02` — [Koordinasyon, CTI, mesafe](../10-Koruma-ve-Topraklama/02-Koordinasyon-CTI-Mesafe-Evirici.md) |\n| P–V burun eğrisi | — |\n\nKural:\n\n1. Önce eksenleri ve adlarını çiz.\n2. Sonra eğriyi.\n3. Sonra noktaları.\n\nÇizerken konuş. Sırtını panele tam dönme.\n\n---\n\n## \"Bilmiyorum, şöyle yaklaşırdım\"\n\nBilmediğin soruda bu cümleyi birkaç kez kurabilirsin.\n\n- İyi kurulursa puan getirir: ilanın \"analitik düşünme, problem analizi ve çözüm geliştirme\" maddesi tam olarak bunu ölçer.\n- Kötü kurulursa (sessizlik, uydurma, özür) puan götürür.\n\n### Dört adım\n\n| # | Adım | Cümle kalıbı |\n| --- | --- | --- |\n| 1 | **Açık kabul** | \"Bunu bilmiyorum.\" / \"Bunu uygulamadım.\" Özür yok, uzun açıklama yok |\n| 2 | **En yakın bildiğin** | \"Bildiğim en yakın şey şu: ...\" |\n| 3 | **Yaklaşım** | \"Çözmem gerekse şöyle başlardım: ...\" (ilk ilke, küçük örnek, hangi veri, hangi kaynak) |\n| 4 | **Dur** | \"Bundan ötesi tahmin olur.\" Sus ve bekle |\n\nToplam 30–45 saniye.\n\nDördüncü adım en zorudur. Tahmin yürütmeye devam etmek, ilk üç adımın kazandırdığını geri alır.\n\nTahmin istenirse: \"Tahminimi söyleyeyim ama emin değilim: ...\" diye **etiketle**.\n\n### Üç tür \"bilmiyorum\"\n\nHangisi olduğunu ayırt et; cevap değişir.\n\nTablodaki Ek-18, Elektrik Şebeke Yönetmeliği'nin rüzgâr ve güneş santrallerinin bağlantı koşullarını içeren ekidir. PSS/E (Power System Simulator for Engineering), yaygın bir güç sistemi analiz programıdır.\n\n| Tür | Örnek | Doğru tepki |\n| --- | --- | --- |\n| **Olgu bilmiyorum** | \"Ek-18'de arıza süresi kaç milisaniye?\" | \"Sayıyı ezbere bilmiyorum, yanlış söylemek istemem. Yönetmeliğin Ek-18'inden okurum.\" Akıl yürütmeye çalışma; olgu türetilmez |\n| **Kavramı bilmiyorum** | \"Alt senkron rezonans nedir?\" | Dört adımın tamamı. En yakın ilkeden yaklaş |\n| **Yapmadım** | \"PSS/E'de arıza dosyası yazdın mı?\" | \"Hayır.\" Sonra eşdeğer iş akışı (`15/02` — [Açık kaynak araçlar ve dürüst strateji](../15-Analiz-Yazilimlari/02-Acik-Kaynak-Araclar-ve-Durust-Strateji.md)) |\n\n### Altı örnek\n\nAşağıdaki cevaplar, **senin şu anki bilginle** verilebilecek dürüst cevaplardır. \"En yakın bildiğim\" kısmındaki bilgiler bu notlarda geçer.\n\nHer örnekte dört adımı izleyebilirsin: açık kabul, en yakın bilgi, yaklaşım, durma.\n\n#### 1. \"Alt senkron rezonans nedir?\"\n\nBu bir **kavramı bilmiyorum** örneğidir; dört adımın tamamı kullanılır.\n\n> \"Ayrıntısını bilmiyorum. Bildiğim şu: uzun hatlarda reaktansı azaltmak için seri kondansatör kullanılır ve kondansatör hattın endüktansıyla bir rezonans frekansı oluşturur. Adından bu frekansın şebeke frekansının altında olduğunu ve sorunun bir etkileşimden doğduğunu çıkarıyorum; neyle etkileştiğini kesin söyleyemem. İncelemem gerekse küçük sinyal analiziyle başlardım: sistemi doğrusallaştırır, özdeğerlerde zayıf sönümlü veya kararsız mod arardım. Bundan ötesi tahmin olur.\"\n\n(Bilgi için: etkileşim, türbin–generatör şaftının burulma titreşim modlarıyladır. Mülakattan önce öğrendiysen söyle; öğrenmediysen yukarıdaki cevap yeterlidir.)\n\n#### 2. \"Ek-18'e göre rüzgâr santrali gerilim sıfıra düştüğünde kaç milisaniye bağlı kalmalı?\"\n\nBu bir **olgu bilmiyorum** örneğidir; sayı uydurulmaz, kaynağı söylenir.\n\n> \"Sayıyı ezbere bilmiyorum ve yanlış bir sayı söylemek istemem. Mantığını biliyorum: bağlantı noktası gerilimi bir gerilim–zaman eğrisinin üstünde kaldığı sürece santral ayrılmamalı, arıza sırasında reaktif akım vermeli ve sonrasında aktif gücünü hızla geri getirmeli. Sayı gerekirse yönetmeliğin Ek-18'indeki eğriden okurum.\"\n\n#### 3. \"Trafo enerjilendirilirken diferansiyel koruma neden açabilir?\"\n\nBu cevapta en yakın ilkeden (diferansiyel korumanın çalışma mantığından) akıl yürütülür.\n\n> \"Bunu çalışmadım. Diferansiyel korumanın giren ve çıkan akımı karşılaştırdığını biliyorum; fark varsa iç arıza sayar. Enerjilendirme anında trafonun bir tarafından akım girip diğer tarafından çıkmıyorsa röle bunu arıza gibi görür diye akıl yürütüyorum; bu akımın kaynağı çekirdeğin mıknatıslanması olmalı. Rölenin bunu arızadan nasıl ayırdığını bilmiyorum.\"\n\n(Bilgi için: mıknatıslanma ani akımı ikinci harmonik bakımından zengindir; röle ikinci harmonik oranına bakarak açmayı tutar.)\n\n#### 4. \"PSS/E'de dinamik benzetim için hangi dosyaları hazırlarsın?\"\n\nBu bir **yapmadım** örneğidir; aracı bilmediğini söyleyip genel ihtiyacı anlatırsın.\n\n> \"PSS/E kullanmadım, dosya adlarını bilmiyorum. Genel olarak dinamik benzetimin neye ihtiyaç duyduğunu söyleyebilirim: yakınsamış bir yük akışı çözümü başlangıç koşulu olarak, her makine için generatör, uyartım ve hız regülatörü model parametreleri, bozucunun tanımı ve izlenecek büyüklükler. Aracı öğrenirken küçük bir vakayı kurar, tek makineli örnekte kritik temizleme süresini eşit alan ölçütüyle bulduğum değerle karşılaştırırdım.\"\n\n#### 5. \"Türkiye'de sekonder frekans kontrol yedeği kaç megavat?\"\n\nBu da bir **olgu bilmiyorum** örneğidir. TEİAŞ, Türkiye Elektrik İletim A.Ş.'dir.\n\n> \"Bilmiyorum; güncel değer TEİAŞ'ın yan hizmet duyurularında olmalı. Boyutlandırma mantığını söyleyebilirim: en büyük tekil üretim kaybı ve tahmin hatası kadar yedek gerekir; yenilenebilir payı arttıkça tahmin hatası payı büyür.\"\n\n#### 6. \"Yazdığın yük akışını beş bin baralı bir sistemde denedin mi?\"\n\nKendi işin hakkındaki bir **yapmadım** örneğidir; ne yaptığını, neyi ölçmediğini ve sıradaki adımı söylersin. IEEE (Institute of Electrical and Electronics Engineers) test sistemleri, yöntemleri karşılaştırmak için kullanılan standart örnek şebekelerdir.\n\n> \"Hayır. Üç baralı örnekte ve kapalı çözümü olan iki baralı örnekte doğruladım. Büyük sistemde ne olacağını ölçmeden bilemem. Beklentim şu: kısa sürümüm baştan sona seyrek olduğu için bellek sorun olmaz; süreyi Jacobian'ın kurulması ve çarpanlara ayrılması belirler. IEEE 118 baralı test sistemiyle ve bir referans araçla karşılaştırmak sıradaki adımım.\"\n\n### Çalışma listesi\n\nAşağıdaki sorular bilerek senin bilgi sınırının dışından seçildi. Her biri için dört adımı sesli uygula ve kaydet. Amaç doğru cevap vermek değil, **kalıbı otuz saniyede akıcı kurmak**.\n\nSorulardaki kısaltmalar: HVDC (High Voltage Direct Current, yüksek gerilim doğru akım), SDP (Semidefinite Programming, yarı tanımlı programlama), DPL (DIgSILENT Programming Language, PowerFactory'nin betik dili), ENTSO-E (European Network of Transmission System Operators for Electricity, Avrupa iletim sistemi işletmecileri birliği), SCADA/EMS (Supervisory Control and Data Acquisition / Energy Management System, uzaktan izleme ve veri toplama / enerji yönetim sistemi).\n\n1. Ferrorezonans nedir?\n2. HVDC'de hat komütasyonlu dönüştürücü ile gerilim kaynaklı dönüştürücünün farkı nedir?\n3. Carson denklemleri ne işe yarar?\n4. Durum kestiriminde Hachtel yöntemi nedir?\n5. Prony analizi nedir, nerede kullanılır?\n6. 154 kV baralarda tasarım kısa devre akımı sınırı Türkiye'de kaç kiloamperdir?\n7. Kordal genişletme SDP gevşetmesinde ne işe yarar?\n8. Bir senkron generatörün yetenek eğrisindeki düşük uyartım sınırını ne belirler?\n9. Güç salınımı engelleme işlevi mesafe rölesinde nasıl çalışır?\n10. PowerFactory'de DPL ile Python arayüzünün farkı nedir?\n11. ENTSO-E'nin akış tabanlı kapasite hesabında \"kalan kullanılabilir pay\" nedir?\n12. TEİAŞ'ın kullandığı SCADA/EMS üreticisi hangisi?\n\nDeğerlendirme ölçütleri:\n\n- Birinci cümle \"bilmiyorum\" veya \"yapmadım\" mıydı?\n- Doğru olan bir ilkeye bağlandın mı, yoksa ilgisiz bir şey mi söyledin?\n- Somut bir ilk adım söyledin mi?\n- Durabildin mi?\n- Uydurduğun bir şey var mı? Varsa en baştan.\n\n### Ne zaman \"bilmiyorum\" denmez\n\n- **Temelde.** \"Aktif ve reaktif güç nedir\", \"N-1 nedir\", \"bara tipleri nelerdir\" sorularına bu kalıp uygulanmaz. Bu notlardaki `02`–`13` klasörlerinin \"90 saniye\" kutularını bilmek zorundasın.\n- **Arka arkaya üç kez.** Üçüncüsünde panel kararını vermiştir. Bu yüzden kalıp, hazırlığın yerini tutmaz.\n- **Kendi yaptığın iş hakkında.** Kendi projendeki bir kararı \"hatırlamıyorum\" diye geçiştirme.\n\n### Yaygın yanlış\n\n| Yanlış inanç | Neden yanlış |\n| --- | --- |\n| **\"Bilmiyorum demek zayıflıktır.\"** | Panel alanın içindendir; uydurmayı tanır. Uydurma, diğer cevaplarının da güvenilirliğini düşürür |\n| **\"Bilmiyorum deyip susarım.\"** | Yarım cevap. Puanı ikinci ve üçüncü adım getirir |\n| **\"Bir şeyler söylersem belki tutar.\"** | Tutmazsa hem bilgisiz hem güvenilmez görünürsün |\n| **\"Özür dilerim.\"** | Gerek yok. Olgu bildiriyorsun |\n| **\"Hızlı öğrenirim\" diye bitirmek.** | Kanıtsız. Bunun yerine nasıl öğreneceğini söyle |\n\nAşağıdaki metin bu sayfanın özetidir; kendine sesli söylemen içindir. İçindeki \"beş parça\" yukarıdaki beş parçalı kalıp, \"dört adım\" ise bilmiyorum çalışmasının dört adımıdır.\n\n## 90 saniye\n\n\"Her cevabı beş parçada kurarım: doğrudan cevap, mekanizma, bir sayı veya örnek, geçerlilik sınırı ve gerekirse yazılım bağlantısı; altmış ile doksan saniye. İlk cümlem sorunun cevabıdır. Bilmediğim soruda dört adım izlerim: açıkça bilmediğimi söylerim, bildiğim en yakın ilkeyi söylerim, nasıl yaklaşacağımı söylerim ve dururum. Olgu sorusunda akıl yürütmem, kaynağını söylerim. Uydurmam; tahmin istenirse tahmin olduğunu belirtirim.\"\n"}, {"id": "21-Calisma-Plani/00-Alt-Basliklar.md", "group": "21  Çalışma planı", "title": "21 — Çalışma planı", "body": "# 21 — Çalışma planı\n\nBu klasörde tek bir ders sayfası var: [14-Gun.md](14-Gun.md). Aşağıdaki dört başlık o sayfanın bölümleridir.\n\n1. **On dört günün klasör eşlemesi** — Hangi gün hangi klasörü (01'den 20'ye) çalışacağını ve o akşam ne üreteceğini öğreneceksin.\n2. **Her akşam sesli 90 saniye** — Günün konusunu neden ayakta ve sesli anlatman gerektiğini, günü hangi dört satırla kapatacağını öğreneceksin.\n3. **Karıştırılan kavram çiftleri** — Bu ilanda en sık karıştırılan yedi kavram çiftini ve 14. günde onları nasıl sınayacağını öğreneceksin.\n4. **Son gün: yeni konu yok, hikâye ve formül kartı** — Mülakattan bir gün önce neyi yapıp neyi yapmayacağını öğreneceksin.\n"}, {"id": "21-Calisma-Plani/14-Gun.md", "group": "21  Çalışma planı", "title": "21 — 14 günlük çalışma planı", "body": "# 21 — 14 günlük çalışma planı\n\nBu sayfa, mülakata kadar bütün klasörleri iki haftada bir kez dolaşmanı sağlayan günlük plandır.\n\n## Planı nasıl kullanırsın\n\nMülakat tarihi belli değilse bu plan iki haftada bir tur atar. Tur bitince baştan başlarsın.\n\nTarih erkense bazı günleri öne çek. Öne çekilecek günler şunlar:\n\n- 1. gün (kurum ve sistem)\n- 4. gün (yük akışı)\n- 7. gün (kararlılık)\n- 8. gün (durum kestirimi)\n- 9. gün (ekonomi, planlama, optimizasyon)\n- 20. gün\n\nNot: Plan 14 gündür. Asıl notta “20. gün” yazıyor. Bu büyük olasılıkla 20 numaralı soru bankası klasörünü (13. ve 14. günler) kastediyor.\n\nHer akşam ilgili 90 saniye kutusunu ayakta, sesli söyle. “90 saniye kutusu”, her ders sayfasının sonundaki kısa sözlü anlatım bölümüdür.\n\n> Sade anlatım: Okumak bilmek değildir. Bir konuyu ancak sesli, notsuz anlatabiliyorsan biliyorsun demektir.\n\n## Günlük süre\n\nGünde iki blok yeter:\n\n| Blok | Süre | Ne yaparsın |\n| --- | --- | --- |\n| Teknik | 70 dakika | Klasörü okur, formülü ve kavramı çalışırsın |\n| Sesli anlatım veya kod | 25 dakika | 90 saniye kutusunu söyler ya da örnek kodu çalıştırırsın |\n\nBlok uzadıkça formül ezberi artar, anlatım düşer. Bu yüzden blokları uzatma.\n\n## On dört günün klasör eşlemesi\n\nTablo her gün için iki şey söyler. “Klasör” sütunu o gün çalışacağın klasör numaralarını verir. “Akşam çıktısı” sütunu akşam elinde olması gereken somut sonucu verir.\n\nÖnce plandaki kısaltmaları açalım:\n\n| Kısaltma | Açılımı | Kısa anlamı |\n| --- | --- | --- |\n| YTBS | Yük Tevzi Bilgi Sistemi | Grubun TEİAŞ için geliştirdiği enerji yönetim platformu |\n| SIPS | System Integrity Protection Scheme (Akıllı Koruma Sistemi) | Büyük arızada sistemi otomatik koruyan özel koruma şeması |\n| NR | Newton-Raphson | Yük akışını yinelemeli çözen sayısal yöntem |\n| DC | Doğru akım (direct current) yaklaşımı | Yük akışının doğrusallaştırılmış, hızlı ama kaba hali |\n| N-1 | Bir eleman kaybı ölçütü | Herhangi bir hat veya ünite düşünce sistemin ayakta kalması koşulu |\n| ED | Economic Dispatch (ekonomik dağıtım) | Çalışan üniteler arasında yükü en ucuza paylaştırma |\n| UC | Unit Commitment (ünite devreye alma) | Hangi ünitenin hangi saatte çalışacağına karar verme |\n| OPF | Optimal Power Flow (optimal güç akışı) | Şebeke kısıtlarını da içeren maliyet optimizasyonu |\n| SCOPF | Security-Constrained OPF (güvenlik kısıtlı OPF) | N-1 durumlarını da kısıt olarak ekleyen OPF |\n| EMS | Energy Management System (enerji yönetim sistemi) | Kontrol merkezindeki ölçüm, kestirim, analiz ve kontrol zinciri |\n| STAR | Situation, Task, Action, Result (durum, görev, eylem, sonuç) | Davranışsal sorulara hikâye anlatma kalıbı |\n\nŞimdi günlük plan:\n\n| Gün | Klasör | Akşam çıktısı |\n| --- | --- | --- |\n| 1 | 01 kurum, YTBS, SIPS, Türkiye sistemi | Üç dakikalık “nereye başvurdum” |\n| 2 | 02 temeller, birim sistem, simetrik bileşen | Tahtada tek faz-toprak eşdeğeri |\n| 3 | 03 iletim, 04 dağıtım | İletim ve dağıtım farkını beş maddede söyle |\n| 4 | 05 yük akışı + `dc_yuk_akisi.py` | NR bloklarını ve DC’nin kör noktasını söyle |\n| 5 | 06 kısa devre, 10 koruma ve topraklama | Azami ve asgari hesabı ayır |\n| 6 | 07 güvenlik | N-1 tarama katmanlarını sırayla çiz |\n| 7 | 08 kararlılık | Açı, gerilim, frekans için birer örnek olay |\n| 8 | 09 durum kestirimi + `wls_durum_kestirimi.py` | Kötü veriyi artıkla göster |\n| 9 | 11 ekonomi, 12 planlama, 13 optimizasyon + `ekonomik_dagitim.py` | ED, UC, OPF, SCOPF’i dört cümlede ayır |\n| 10 | 14 ve 15 programlama ve araçlar | Kullandığın aracı dürüstçe, kullanmadığını iddiasız anlat |\n| 11 | 16 mimari, 17 yenilenebilir | EMS zincirini kutularla çiz |\n| 12 | 18 veri ve yapay zekâ, 19 davranışsal | İki STAR hikâyesi yaz |\n| 13 | 20 soru bankası, yarısını sesli | Takıldığın soruyu klasöre geri götür |\n| 14 | 20 kalan yarısı, formül kartı, İngilizce üç cevap | Kendini tanıt, 3 dakika, notsuz |\n\nTablodaki birkaç ifadenin anlamı:\n\n- **Tek faz-toprak eşdeğeri:** Bir fazın toprağa kısa devre olduğu arızada pozitif, negatif ve sıfır bileşen devrelerinin nasıl bağlandığını gösteren çizim.\n- **DC’nin kör noktası:** DC yük akışının gerilim genliğini ve reaktif gücü hesaba katmaması.\n- **Azami ve asgari hesap:** Kısa devre akımının en büyük (cihaz seçimi için) ve en küçük (korumanın algılaması için) değerini ayrı hesaplamak.\n- **Artık:** Ölçülen değer ile kestirilen değer arasındaki fark. Kötü veri, artığı büyük çıkan ölçümdür.\n- **WLS:** `wls_durum_kestirimi.py` adındaki WLS, Weighted Least Squares (ağırlıklı en küçük kareler) yöntemidir.\n\nÖrnek Python dosyaları [14-Programlama/ornekler](../14-Programlama/ornekler/) klasöründedir:\n\n| Gün | Dosya |\n| --- | --- |\n| 4 | [dc_yuk_akisi.py](../14-Programlama/ornekler/dc_yuk_akisi.py) |\n| 8 | [wls_durum_kestirimi.py](../14-Programlama/ornekler/wls_durum_kestirimi.py) |\n| 9 | [ekonomik_dagitim.py](../14-Programlama/ornekler/ekonomik_dagitim.py) |\n\nKlasörlerin içindekiler sayfaları:\n\n| No | Klasör |\n| --- | --- |\n| 01 | [Kurum, ilan ve süreç](../01-Kurum-Ilan-ve-Surec/00-Alt-Basliklar.md) |\n| 02 | [Güç sistemleri temelleri](../02-Guc-Sistemleri-Temelleri/00-Alt-Basliklar.md) |\n| 03 | [İletim şebekeleri](../03-Iletim-Sebekeleri/00-Alt-Basliklar.md) |\n| 04 | [Dağıtım sistemleri](../04-Dagitim-Sistemleri/00-Alt-Basliklar.md) |\n| 05 | [Yük akışı](../05-Yuk-Akisi/00-Alt-Basliklar.md) |\n| 06 | [Kısa devre](../06-Kisa-Devre/00-Alt-Basliklar.md) |\n| 07 | [Güvenlik analizi](../07-Guvenlik-Analizi/00-Alt-Basliklar.md) |\n| 08 | [Kararlılık](../08-Kararlilik/00-Alt-Basliklar.md) |\n| 09 | [Durum kestirimi](../09-Durum-Kestirimi/00-Alt-Basliklar.md) |\n| 10 | [Koruma ve topraklama](../10-Koruma-ve-Topraklama/00-Alt-Basliklar.md) |\n| 11 | [Ekonomik işletme](../11-Ekonomik-Isletme/00-Alt-Basliklar.md) |\n| 12 | [Planlama](../12-Planlama/00-Alt-Basliklar.md) |\n| 13 | [Optimizasyon](../13-Optimizasyon/00-Alt-Basliklar.md) |\n| 14 | [Programlama](../14-Programlama/00-Alt-Basliklar.md) |\n| 15 | [Analiz yazılımları](../15-Analiz-Yazilimlari/00-Alt-Basliklar.md) |\n| 16 | [Yazılım mimarisi](../16-Yazilim-Mimarisi/00-Alt-Basliklar.md) |\n| 17 | [Yenilenebilir ve akıllı şebeke](../17-Yenilenebilir-ve-Akilli-Sebeke/00-Alt-Basliklar.md) |\n| 18 | [Veri ve yapay zekâ](../18-Veri-ve-Yapay-Zeka/00-Alt-Basliklar.md) |\n| 19 | [Davranışsal](../19-Davranissal/00-Alt-Basliklar.md) |\n| 20 | [Soru bankası](../20-Soru-Bankasi/00-Alt-Basliklar.md) |\n\n## Her günün aynı kapanışı\n\nHer günü aynı şekilde bitir. Dört satır yaz ve hepsini tek bir dosyaya ekle. Böylece iki hafta sonunda kendi zayıf noktalarının listesi oluşur.\n\n- Bugün tahtada türevini yapabildiğim formül\n- Hâlâ karıştırdığım iki terim\n- Kendi işimden bağlayabildiğim bir örnek\n- Yarın ilk bakacağım sayfa\n\n## Karıştırılan kavram çiftleri\n\nBu ilanda karıştırılan çiftler şunlar olur:\n\n| No | Birinci kavram | İkinci kavram |\n| --- | --- | --- |\n| 1 | Güvenlik | Kararlılık |\n| 2 | Ekonomik dağıtım | OPF |\n| 3 | Kestirim | Yük akışı |\n| 4 | SIPS | Röle |\n| 5 | Kurulu güç | Puant |\n| 6 | Takip eden evirici | Şebeke oluşturan evirici |\n| 7 | Önleyici kontrol | Düzeltici kontrol |\n\nTerimlerin kısa anlamı:\n\n- **Puant:** Sistemin belli bir dönemde gördüğü en yüksek tüketim (yük).\n- **Kurulu güç:** Sistemdeki santrallerin toplam etiket gücü.\n- **Takip eden evirici (grid-following):** Şebekenin gerilim ve frekansını izleyip ona göre akım basan evirici.\n- **Şebeke oluşturan evirici (grid-forming):** Gerilim ve frekansı kendisi kuran evirici.\n- **Önleyici kontrol:** Arıza olmadan önce işletme noktasını değiştirmek.\n- **Düzeltici kontrol:** Arıza olduktan sonra müdahale etmek.\n\nBu çiftleri 14. gün yan yana söyleyemiyorsan o klasörü tekrar aç.\n\n## Mülakattan bir gün önce\n\nBu gün için kurallar:\n\n1. Yeni konu açma.\n2. Formül kartını bir kez oku.\n3. Kendi üç STAR hikâyeni ve üç sorunu yaz. “Üç soru”, mülakatın sonunda kurula soracağın sorulardır.\n4. Rakamların tarihini kontrol et. Kurulu güç ayda değişir. Karttaki aydan yenisini ezberleme.\n5. Gerçek bara adı ve müşteri verisi yok. Örneklerde bunları kullanma.\n\n> Sade anlatım: Uyku, karttan daha çok puan getirir.\n"}]</script>
<script>
const pages = JSON.parse(document.getElementById("data").textContent);
const nav = document.getElementById("nav");
const doc = document.getElementById("doc");
const q = document.getElementById("q");
const side = document.getElementById("side");
let index = 0;

function visible() {
  const needle = q.value.trim().toLocaleLowerCase("tr");
  if (!needle) return pages.map((_, i) => i);
  return pages.flatMap((p, i) => {
    const hay = (p.title + "\n" + p.group + "\n" + p.body).toLocaleLowerCase("tr");
    return hay.includes(needle) ? [i] : [];
  });
}

function renderNav() {
  const ids = visible();
  nav.innerHTML = "";
  if (!ids.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Eşleşen sayfa yok.";
    nav.appendChild(p);
    return;
  }
  let group = "";
  for (const i of ids) {
    const page = pages[i];
    if (page.group !== group) {
      group = page.group;
      const label = document.createElement("div");
      label.className = "group";
      label.textContent = group;
      nav.appendChild(label);
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = page.title;
    if (i === index) btn.className = "on";
    btn.addEventListener("click", () => openPage(i));
    nav.appendChild(btn);
  }
  const on = nav.querySelector(".on");
  if (on) on.scrollIntoView({ block: "nearest" });
}

function dress() {
  doc.querySelectorAll("h2").forEach((h) => {
    if (!/90 saniye/i.test(h.textContent)) return;
    const box = document.createElement("section");
    box.className = "speak";
    h.parentNode.insertBefore(box, h);
    box.appendChild(h);
    while (box.nextSibling) {
      const n = box.nextSibling;
      if (n.tagName && /^H[12]$/.test(n.tagName)) break;
      box.appendChild(n);
    }
  });
}

function openPage(i, push) {
  index = i;
  const page = pages[i];
  doc.innerHTML = marked.parse(page.body);
  dress();
  document.title = page.title + " · Mülakat hazırlığı";
  const ids = visible();
  const at = ids.indexOf(i);
  document.getElementById("pos").textContent = (i + 1) + " / " + pages.length;
  document.getElementById("prev").disabled = i <= 0;
  document.getElementById("next").disabled = i >= pages.length - 1;
  if (push !== false) history.replaceState(null, "", "#" + encodeURIComponent(page.id));
  document.getElementById("main").scrollTop = 0;
  side.classList.remove("open");
  renderNav();
  if (at < 0 && q.value) {
    /* arama bu sayfayı elemişse liste yine de güncel kalsın */
  }
}

function step(dir) {
  const next = index + dir;
  if (next < 0 || next >= pages.length) return;
  openPage(next);
}

document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.getElementById("menu").addEventListener("click", () => side.classList.toggle("open"));
q.addEventListener("input", renderNav);
document.addEventListener("keydown", (e) => {
  const typing = e.target === q;
  if (e.key === "/" && !typing) {
    e.preventDefault();
    q.focus();
    return;
  }
  if (typing) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

const start = decodeURIComponent(location.hash.slice(1));
const found = pages.findIndex((p) => p.id === start);
openPage(found >= 0 ? found : 0, false);
</script>
