 eğitim duyurularında \"sistem ataleti hesabı\" adlı bir modül geçer; amacı büyük ihtimalle budur, yöntemini bilmiyorum.\n\n### RoCoF neden tehlikeli\n\n- Generatör şaftlarına mekanik zorlanma.\n- RoCoF'a duyarlı ada koruma rölelerinin dağıtık üretimi topluca devreden çıkarması (zincirleme kayıp).\n- Düşük frekans yük atma kademelerine primer kontrol yetişemeden ulaşılması.\n\n## Frekans tepkisinin kademeleri\n\n| Kademe | Süre | Kaynak |\n| --- | --- | --- |\n| Atalet tepkisi | 0–5 s | Dönen kütlelerin kinetik enerjisi; kendiliğinden |\n| Hızlı frekans tepkisi | \u003c 1 s | Batarya, evirici; ölçüp tepki verir |\n| Primer kontrol | Saniyeler; yönetmelikte 30 s içinde | Hız regülatörü eğimi (droop) |\n| Sekonder kontrol (AGC) | Dakikalar | Frekansı 50 Hz'e geri getirir |\n| Tersiyer | 15 dakika | Yedekleri yeniler |\n\nAGC (Automatic Generation Control), otomatik üretim kontrolüdür.\n\nAyrım:\n\n- Atalet düşüşü **yavaşlatır**.\n- Primer kontrol düşüşü **durdurur**.\n- Sekonder kontrol frekansı **geri getirir**.\n\n### Elle örnek 3: eğim (droop)\n\n200 MW'lık ünite, %5 eğim. Frekans 0,1 Hz düşüyor.\n\nFormül önce frekans sapmasını yüzdeye çevirir, eğime bölerek güç oranını bulur, sonra anma gücüyle çarpıp MW'a çevirir.\n\n```\nΔP = (Δf / f_0) / R × P_anma = (0,1 / 50) / 0,05 × 200 = 8 MW\n```\n\n- `R`: eğim (droop), burada 0,05.\n- `P_anma`: ünitenin anma gücü.\n\n%5 eğim, frekans %5 (2,5 Hz) değiştiğinde ünitenin çıkışını %100 değiştirmesi demektir.\n\n## Şebeke izleyen ve şebeke kuran evirici\n\nGFL (Grid-Following) şebeke izleyen, GFM (Grid-Forming) şebeke kuran eviricidir.\n\n| | Şebeke izleyen (GFL) | Şebeke kuran (GFM) |\n| --- | --- | --- |\n| Davranış | Akım kaynağı | Empedans arkasında gerilim kaynağı |\n| Eşzamanlama | Faz kilitlemeli döngü (PLL) şebeke gerilimini ölçer ve izler | Kendi gerilim büyüklüğünü ve frekansını üretir |\n| Şebekeye ihtiyaç | Güçlü bir gerilim referansı ister | Referansın kendisi olabilir |\n| Frekans olayına tepki | Ölçer, sonra tepki verir (gecikmeli) | Anında, fiziğe benzer |\n| Zayıf şebeke | PLL kararsızlaşabilir | Daha dayanıklı |\n| Sıfırdan enerjilendirme | Yapamaz | Yapabilir |\n| Bugünkü yaygınlık | Kurulu eviricilerin neredeyse tamamı | Batarya projelerinde artıyor |\n\nPLL (Phase-Locked Loop), faz kilitlemeli döngüdür.\n\n> **Sade anlatım:** Yazılımcı benzetmesi: şebeke izleyen evirici bir istemcidir; saati sunucudan alır. Sunucu yoksa çalışamaz. Şebeke kuran evirici saati üreten düğümlerden biridir; diğerleriyle uzlaşma kuralı (eğim) üzerinden eşzamanlanır.\n\nŞebeke kuran kontrol yöntemleri:\n\n- Eğim kontrolü.\n- Sanal senkron makine (salınım denklemini yazılımda taklit eder).\n- Sanal osilatör.\n\n### Sınırı unutma\n\n- Evirici akımı anma değerinin biraz üstünde sınırlıdır.\n- Sanal atalet, gerçek bir enerji kaynağı (batarya, DC bara, kısılmış üretim payı) ve akım payı gerektirir.\n- Akım sınırına dayanan şebeke kuran evirici, gerilim kaynağı gibi davranmayı bırakır.\n\n\"Yazılımla atalet\" bedava değildir.\n\n## Küçük sinyal kararlılığı\n\nİki kararlılık sorusu farklı büyüklükte bozucuyu sorar:\n\n- Geçici hal kararlılığı büyük bozucuyu (kısa devre) sorar.\n- Küçük sinyal kararlılığı küçük bozucuyu sorar: sistem kendi çalışma noktası çevresinde hafifçe dürtülünce salınım **sönüyor mu, büyüyor mu**?\n\nYöntem: doğrusal olmayan denklemler çalışma noktası çevresinde doğrusallaştırılır.\n\n```\ndΔx/dt = A Δx\n```\n\n`A` durum matrisidir. Davranışı özdeğerleri belirler: `λ = σ ± jω`.\n\n| Özdeğer | Anlam |\n| --- | --- |\n| `σ \u003c 0` | Mod sönüyor: kararlı |\n| `σ > 0` | Mod büyüyor: kararsız |\n| `ω` | Salınım frekansı, `f = ω / 2π` |\n| `ζ = −σ / √(σ² + ω²)` | Sönüm oranı |\n\nBütün özdeğerlerin gerçek kısmı negatifse sistem küçük sinyal kararlıdır. Ama yeterli değildir: `ζ` de yeterli olmalıdır. Uygulamada %5 civarı bir alt sınır aranır; %3'ün altı zayıf sönümlü sayılır.\n\n### Elektromekanik modlar\n\n| Mod | Ne salınır | Frekans | Not |\n| --- | --- | --- | --- |\n| **Yerel mod** | Bir santralin sisteme karşı salınımı | Yaklaşık 1–2 Hz | |\n| **Bölgeler arası mod** | Bir bölgedeki makinelerin topluca başka bölgeye karşı salınımı | Yaklaşık 0,1–0,8 Hz | Uzun ve zayıf bağlantılarda görülür; Türkiye'nin Avrupa ile senkron bağlantısında izlenen konudur |\n\n### Özvektörler\n\nÖzvektörler de bilgi taşır:\n\n- **Sağ özvektör (mod şekli):** hangi makine hangi yönde salınıyor. Bölgeler arası modda iki grup zıt fazdadır.\n- **Katılım faktörü:** hangi durum değişkeni bu modu en çok etkiliyor. Sönümleyiciyi (PSS) nereye koyacağını söyler.\n\nTürkiye şebeke yönetmeliği 75 MW ve üzeri konvansiyonel ünitelerde 0–5 Hz aralığındaki elektromekanik salınımları sönümleyecek güç sistemi dengeleyicisi (PSS, Power System Stabilizer) ister (`01/02`).\n\n### Elle örnek 4: tek makinenin modu\n\n`02` dosyasındaki makine: `P_max = 2,0`, `δ_0 = 23,58°`, `H = 5 s`, sönüm katsayısı `D = 10 pu`.\n\n**Doğrusallaştırma.** Sinüs eğrisi çalışma noktasında düz bir çizgiyle değiştirilir: `P_e ≈ P_e0 + K_s Δδ`. Senkronlayıcı güç katsayısı eğrinin eğimidir; yayın sertliği gibi düşün.\n\n```\nK_s = P_max cos δ_0 = 2,0 × 0,9165 = 1,833 pu/rad\n```\n\n**Denklemi kurmak.** Doğrusallaştırılmış salınım denklemi ikinci dereceden bir sistemdir (kütle-yay-sönümleyici). Her satırın işi:\n\n- İlk satır: kütle (`2H/ω_0`), sönüm (`D/ω_0`) ve yay (`K_s`) terimleriyle hareket denklemi.\n- `ω_n` satırı: sönümsüz doğal frekansı yay ve kütleden bulur.\n- `ζ` satırı: sönüm oranını hesaplar.\n- `λ` satırı: ikisini birleştirip özdeğeri yazar; gerçek kısım sönüm, sanal kısım salınım frekansıdır.\n\n```\n(2H/ω_0) Δδ'' + (D/ω_0) Δδ' + K_s Δδ = 0\n\nω_n = √(K_s ω_0 / 2H) = √(1,833 × 314,16 / 10) = 7,59 rad/s  →  1,21 Hz\nζ   = D / (4 H ω_n) = 10 / (4 × 5 × 7,59) = 0,066\nλ   = −ζ ω_n ± j ω_n √(1 − ζ²) = −0,50 ± j7,57\n```\n\n**Yorum.** 1,21 Hz'lik yerel mod, %6,6 sönüm. Kabul edilebilir.\n\n**Yükleme etkisi.** Makineyi daha ağır yüklersen:\n\n1. `δ_0` büyür.\n2. `cos δ_0` küçülür.\n3. `K_s` düşer: yay gevşer, frekans düşer.\n\n`δ_0 = 90°`'de `K_s = 0` olur; geri çağıran kuvvet kalmaz. Sürekli hal kararlılık sınırı budur.\n\n**Uyartımın yan etkisi.** Hızlı ve yüksek kazançlı uyartım sistemi senkronlayıcı torku artırır ama sönümleyici torku **azaltabilir**, hatta negatife çevirebilir. PSS'in var oluş nedeni budur.\n\n## Yaygın yanlış\n\n- **\"Atalet frekans düşüşünü durdurur.\"** Yavaşlatır. Durduran primer kontroldür.\n- **\"Evirici de atalet sağlar, yazılımla hallolur.\"** Enerji ve akım payı varsa ve şebeke kuran kontrolle. Varsayılan şebeke izleyen evirici sağlamaz.\n- **\"Hızlı frekans tepkisi ile atalet aynıdır.\"** Biri ölçüp tepki verir (gecikmeli), diğeri kendiliğindendir. İlk yüz milisaniyelerde fark eder.\n- **\"Kurulu güç büyükse atalet de büyüktür.\"** Atalet devrede olan **senkron** makinelere bağlıdır; güneşli bir öğlen en düşük değerindedir.\n- **\"Özdeğerlerin gerçek kısmı negatifse iş tamamdır.\"** Zayıf sönümlü mod, küçük bir işletme değişikliğiyle kararsızlaşır. Sönüm oranına bakılır.\n- **\"Küçük sinyal analizi büyük arızayı da söyler.\"** Doğrusaldır; yalnız çalışma noktasının yakınını anlatır.\n\n## Panel takip sorusu\n\n**\"Bölgeler arası salınımı gerçek zamanda nasıl izlersin?\"**\n\n> **Mülakatta şöyle söyle:** Fazör ölçüm birimleriyle (PMU, Phasor Measurement Unit). İki bölgenin açı farkındaki salınımın frekansını ve sönümünü ölçüm verisinden kestiririm (Prony veya benzeri yöntemler). Model tabanlı özdeğer analizi çevrim dışıdır; ölçüm tabanlısı gerçek zamanlıdır.\n\n**\"Evirici oranı arttıkça küçük sinyal resmi nasıl değişir?\"**\n\n> **Mülakatta şöyle söyle:** Elektromekanik modlara ek olarak kontrol etkileşimi modları çıkar: PLL, akım kontrolü ve şebeke empedansı arasında, daha yüksek frekanslarda. Klasik fazör modeli bunları görmeyebilir; elektromanyetik geçici hal modeli gerekir.\n\n## 90 saniye\n\n> \"Senkron makineler frekans değişimine kinetik enerjileriyle kendiliğinden karşı koyar; evirici tabanlı üretim varsayılan haliyle bunu yapmaz. Bu yüzden yenilenebilir arttıkça atalet düşer ve frekansın ilk düşme hızı, yani RoCoF artar; RoCoF, kayıp gücün iki katı kinetik enerjiye oranıyla orantılıdır. Şebeke izleyen evirici faz kilitlemeyle şebekeyi takip eden bir akım kaynağıdır; şebeke kuran evirici kendi gerilimini ve frekansını üretir, ama enerji ve akım sınırı içinde. Küçük sinyal kararlılığında sistemi doğrusallaştırır, durum matrisinin özdeğerlerine bakarım: gerçek kısım sönümü, sanal kısım frekansı verir. Yerel ve bölgeler arası modların sönüm oranını izlerim.\"\n"}, {"id": "09-Durum-Kestirimi/00-Alt-Basliklar.md", "group": "09  Durum kestirimi", "title": "09 — Durum kestirimi", "body": "# 09 — Durum kestirimi\n\nBu klasör, enerji yönetim sisteminin (EMS, Energy Management System) ölçümden \"şebekenin şu anki hâli\"ni çıkaran halkasını anlatır. Aşağıdaki her madde, bu sayfada ne öğreneceğini bir cümleyle söyler.\n\n1. **Neden SCADA ham değeri yetmez** — SCADA (Supervisory Control and Data Acquisition, uzaktan izleme ve kontrol sistemi) ölçümünün neden gürültülü, eksik ve birbiriyle çelişkili olduğunu öğreneceksin.\n2. **Durum vektörü: açı ve gerilim** — Şebekenin \"durumu\" denince hangi bilinmeyenlerin kastedildiğini ve neden bir açının referans alındığını öğreneceksin.\n3. **Ölçüm türleri: P, Q, V, I, kademe, fazör** — Aktif güç (P), reaktif güç (Q), gerilim (V), akım (I), trafo kademesi ve fazör ölçümünün kestirime nasıl girdiğini öğreneceksin.\n4. **Ölçüm modeli z = h(x) + e** — Ölçümü, durumu ve hatayı birbirine bağlayan temel denklemi öğreneceksin.\n5. **Ağırlıklar ve standart sapma** — Her ölçüme neden `1/σ²` kadar güvenildiğini öğreneceksin.\n6. **Ağırlıklı en küçük kareler (WLS)** — WLS (Weighted Least Squares) amaç fonksiyonunu ve adım adım türetimini öğreneceksin.\n7. **Kazanç matrisi ve normal denklemler** — `G = HᵀWH` matrisinin ne taşıdığını ve her iterasyonda hangi denklemin çözüldüğünü öğreneceksin.\n8. **Gözlenebilirlik ve kritik ölçüm** — Ölçümlerin durumu tek anlamlı belirleyip belirlemediğini nasıl test edeceğini ve hangi ölçümün \"kritik\" sayıldığını öğreneceksin.\n9. **Pseudo-ölçüm** — Ölçüm yetmeyen yere tahmin değerini nasıl ve hangi ağırlıkla koyacağını öğreneceksin.\n10. **Kötü veri: ki-kare, normalize artık, en büyük normalize artık testi** — Bozuk ölçümün önce varlığını, sonra yerini nasıl bulacağını elle hesapla öğreneceksin.\n11. **Kaldıraç noktası ve ölçüm hatasının yayılması** — Bir ölçümün çözümü aşırı etkilediği durumu ve bir hatanın komşu artıklara nasıl bulaştığını öğreneceksin.\n12. **Topoloji hatası ve parametre hatası** — Yanlış kesici durumu ve yanlış hat parametresinin neden ölçüm atarak düzelmediğini öğreneceksin.\n13. **PMU ile lineer kestirim ve hibrit kestirim** — PMU (Phasor Measurement Unit, fazör ölçüm birimi) ile modelin neden doğrusal olduğunu ve SCADA ile nasıl birleştirildiğini öğreneceksin.\n14. **İzleme hızı: klasik SE dakikalar, WAMS alt saniye** — Klasik durum kestirimi (SE, State Estimation) ile WAMS (Wide Area Monitoring System, geniş alan izleme sistemi) arasındaki hız farkını öğreneceksin.\n15. **Dağıtım durum kestirimi** — Dağıtım şebekesinde ölçüm azlığı yüzünden kestirimin neden bir tahmin problemine dönüştüğünü öğreneceksin.\n16. **Tahmin destekli kestirim** — Bir sonraki durumu önceden öngörüp ölçüm gelince düzeltmenin ne kazandırdığını öğreneceksin.\n17. **Kestirim çıktısının güvenlik analizine bağlanması** — Kestirim sonucunun hangi kalite koşuluyla N-1 analizine verileceğini öğreneceksin.\n18. **Yazılımda sayısal sorunlar: referans açı, ağırlık koşullandırma** — Kazanç matrisini tekil ya da kötü koşullu yapan yazılım hatalarını ve çarelerini öğreneceksin.\n"}, {"id": "09-Durum-Kestirimi/01-WLS-Kotu-Veri-PMU.md", "group": "09  Durum kestirimi", "title": "Durum kestirimi", "body": "# Durum kestirimi\n\n## Neden var\n\nSCADA (Supervisory Control and Data Acquisition, uzaktan izleme ve veri toplama sistemi) şebekede üç tür büyüklük ölçer:\n\n- bara gerilimleri,\n- hat akışları,\n- bara enjeksiyonları (baraya giren ya da çıkan net güç).\n\nBu ölçümlerin dört kusuru vardır:\n\n| Kusur | Anlamı |\n| --- | --- |\n| Gürültü | Her ölçüm gerçek değerin biraz sapmış hâlidir |\n| Eksiklik | Bazı noktalarda ölçüm cihazı yoktur |\n| Bozukluk | Bir kısım ölçü tamamen yanlıştır |\n| Senkron eksikliği | Zaman damgaları tam olarak aynı ana ait değildir |\n\nYük akışı ise üretimin ve yükün doğru bilindiğini varsayar. İşletmede ne ölçüm kusursuzdur ne de üretim ve yük tam bilinir.\n\nDurum kestirimi bu boşluğu doldurur. Fazla ve gürültülü ölçümden şebekenin **en olası gerilim profilini** çıkarır. Güvenlik analizi bundan sonra bu profil üzerinde koşar.\n\nEMS (Energy Management System, enerji yönetim sistemi) zincirinin ortasındaki halka budur:\n\n```\ntopoloji işlemcisi → durum kestirimi → kötü veri → yük akışı ve N-1\n```\n\nTopoloji işlemcisi, kesici ve ayırıcı durumlarından şebekenin o anki bağlantı şemasını kurar. N-1, herhangi bir tek elemanın devre dışı kalması durumunda şebekenin güvenli kalıp kalmadığını sınayan analizdir.\n\n> **Sade anlatım:** Ölçümler birbirini tutmaz. Durum kestirimi, fizik kurallarına uyan ve ölçümlere en yakın düşen tek bir \"şebeke fotoğrafı\" çizer.\n\n## Durum vektörü ve ölçüm modeli\n\nDurum vektörü, şebekenin bütün bara gerilim açıları ve büyüklükleridir:\n\n```\nx = [θ₂ … θn, V₁ … Vn]\n```\n\n- `θ`: bara gerilim açısı\n- `V`: bara gerilim büyüklüğü\n- `θ₁` yoktur, çünkü bir açının referansı sabitlenir. Açılar ancak birbirine göre anlamlıdır.\n\nÖlçüm modeli, her ölçümü durumun bir fonksiyonu artı hata olarak yazar:\n\n```\nz = h(x) + e\n```\n\n- `z`: ölçüm vektörü\n- `h`: ölçüm fonksiyonu; durumu ölçüme çevirir\n- `e`: ölçüm hatası\n\nÖlçüm türüne göre `h` şöyle davranır:\n\n| Ölçüm | h(x) ne olur |\n| --- | --- |\n| Güç akışı | Yük akışı denklemlerinin aynısıdır |\n| Gerilim | Doğrudan `V`'dir |\n| Akım | Daha da doğrusal değildir; kötü veri testini zorlaştırır |\n\n## Ağırlıklar\n\n`e`'nin varyansı ölçümün kalitesini gösterir. Varyans küçükse ölçüm hassastır.\n\n```\nW = R⁻¹       R köşegen,  köşegen elemanları σ² (varyans)\n```\n\n- `R`: ölçüm hatalarının kovaryans matrisi. Hatalar bağımsız kabul edildiği için köşegendir.\n- `W`: ağırlık matrisi; `R`'nin tersidir.\n- Sonuç: iyi sayaca büyük ağırlık verilir.\n\nTipik `σ` (standart sapma), ölçünün tam skala değerinin yüzdesi olarak verilir. Gerilim ölçümünün σ'sı güç ölçümününkinden daha dar olabilir.\n\nAğırlığı \"hepsi 1\" yapmak bir hatadır. Bozuk sayacı sağlam sayaçla eşitler.\n\n## WLS\n\nWLS (Weighted Least Squares, ağırlıklı en küçük kareler), ölçüm ile model arasındaki farkın ağırlıklı kareler toplamını en aza indirir. Aşağıdaki ifade bu amaç fonksiyonudur:\n\n```\nJ(x) = [z - h(x)]ᵀ W [z - h(x)]\n```\n\nBu problem NR (Newton-Raphson, doğrusal olmayan denklemi ardışık doğrusallaştırarak çözen yöntem) ile çözülür.\n\n`H = ∂h/∂x` Jacobian'dır. Dikkat: bu, yük akışı Jacobian'ı değil, **ölçüm Jacobian'ıdır**. Satırları ölçümler, sütunları durum değişkenleridir.\n\nHer iterasyonda aşağıdaki iki satır kurulur ve çözülür. İlki kazanç matrisini tanımlar, ikincisi durum düzeltmesi `Δx`'i verir:\n\n```\nG = Hᵀ W H\nG Δx = Hᵀ W [z - h(x)]\n```\n\n`G` kazanç matrisidir. Gözlenebilir sistemde tekil değildir.\n\nÇözüm, artıklar (ölçüm ile kestirilen değer arasındaki farklar) ölçüm gürültüsüyle uyumlu olana kadar iterasyonla sürer.\n\nLineer ölçümde, yani yalnız PMU gerilim ve akım fazörü varsa, tek adım yeter. Aşağıdaki formül kestirimi iterasyonsuz verir:\n\n```\nx̂ = (Hᵀ W H)⁻¹ Hᵀ W z\n```\n\nPMU (Phasor Measurement Unit, fazör ölçüm birimi) gerilim fazörü durumu doğrudan görür. Akım fazörü, dikdörtgen koordinatta (gerçek ve sanal kısım) lineer yazılabilir. Bu yüzden geniş alan kestirimi klasiğinden daha hızlıdır.\n\n## Gözlenebilirlik\n\nÖlçümler durumu tek türlü belirliyorsa sistem **gözlenebilirdir**.\n\nİki pratik test vardır:\n\n| Test | Koşul |\n| --- | --- |\n| Sayısal | `G` tam rank |\n| Topolojik | Her adada bir gerilim ölçümü ve yeterli akış ölçümüyle bütün baraları kapsayan bir ağaç kurulabiliyor |\n\n**Kritik ölçüm:** o ölçüm kalkarsa gözlenebilirlik biter.\n\nKritik ölçünün hatası artık testinde gizlenir. Sebep: hesap o ölçüme birebir uymaya mecburdur, artığı sıfır çıkar.\n\n**Kritik ölçüm çifti** de benzerdir: iki ölçüm birlikte kritiktir, birinin hatası ikisine eşit dağılır.\n\nÖlçüm yerleşim planı, kritik ölçüm bırakmamaya çalışır.\n\n### Pseudo-ölçüm\n\nÖlçüm yetmezse **pseudo-ölçüm** (sözde ölçüm) konur. Örnekler:\n\n- yük tahmini,\n- bir önceki kestirim,\n- tipik güç faktörü.\n\nAğırlığı gerçek ölçüden küçük tutulur.\n\nPseudo-ölçümün iki yüzü vardır. Çözümü kurtarır, çünkü gözlenebilirliği sağlar. Aynı anda çözümü kendine çeker, çünkü bir tahmin olduğu hâlde denkleme girer.\n\nDağıtımda pseudo-ölçüm çoğunluktadır. Bu yüzden dağıtım kestirimi \"ölçüm\" kadar \"tahmin\" problemidir. AMI (Advanced Metering Infrastructure, akıllı sayaç altyapısı) bu oranı düzeltir.\n\n## Kötü veri\n\nArtık, ölçüm ile kestirimden hesaplanan değer arasındaki farktır:\n\n```\nr = z - h(x̂)\n```\n\n**Tespit (ki-kare):** Sağlam modelde `J(x̂)` yaklaşık ki-kare dağılıdır. Serbestlik derecesi `m - n`'dir (ölçüm sayısı eksi durum sayısı). `J` eşiğin üstündeyse sette kötü veri vardır.\n\n**Teşhis (normalize artık):** Hangi ölçüm olduğunu bulmak için her artık kendi standart sapmasına bölünür. İlk satır artık kovaryansını, ikinci satır normalize artığı verir:\n\n```\nΩ = R - H G⁻¹ Hᵀ     (artık kovaryansı, W = R⁻¹ ise bu form)\nr_N,i = |r_i| / √Ω_ii\n```\n\nKural şöyle işler:\n\n1. En büyük normalize artık eşikten (çoğunlukla 3) büyükse o ölçüm şüpheli çıkar.\n2. Ağırlığı düşürülür veya atılır.\n3. Kestirim tekrarlanır.\n\nBir turda bir ölçüm atmak güvenlidir. Birden fazla atmak iyiyi de götürebilir.\n\n### Kaldıraç noktası\n\nNormalize artık, **kaldıraç noktasında** şaşırır.\n\nKaldıraç, o ölçümün çözümü fazla etkilemesidir. Tipik örnek az yedekli bir koldur. Bu durumda ki-kare bozulur ama normalize artık küçük kalır.\n\nŞüphede ölçümün kaldıracına da bakılır. Mülakatta bu ayrımı söylemen, ders notunu aştığını gösterir.\n\n### Kötü verinin kaynakları\n\nKötü veri üç kaynaktan gelir:\n\n| Kaynak | Örnek |\n| --- | --- |\n| Ölçüm | Sayaç, polarite, ölçek, takılı kalmış değer |\n| Topoloji | Kesici durumu yanlış; hesap, olmayan bir hattı varmış gibi görür |\n| Parametre | Yanlış hat uzunluğu, yanlış kademe |\n\nTopoloji hatası ölçüm atılarak düzelmez. Artıklar tek ölçümde değil, bir bölgede sistematik büyür.\n\nParametre kestirimi ayrı bir problemdir. Hat empedansı şüpheliyse onu da bilinmeyen yapmak istersin. Bu durumda bilinmeyen sayısı artar, gözlenebilirlik daha da zorlaşır.\n\n## Hız ve hibrit\n\n| Kaynak | Hız |\n| --- | --- |\n| Klasik SE (State Estimation, durum kestirimi) | SCADA turunda saniyeler-dakika çalışır |\n| PMU | Saniyede onlarca fazör verir |\n\n**Hibrit kestirim**, SCADA'nın geniş kapsamasını PMU'nun senkron açısıyla birleştirir.\n\nZaman hizasızlığı bir sorundur: SCADA ölçümü 5 saniye eski, PMU 20 ms eski olabilir. Modelde bu fark ya yok sayılır ya öngörüyle düzeltilir.\n\n**Tahmin destekli kestirim**, bir sonraki durumu yük ve üretim eğiliminden öngörür. Ölçüm gelince düzeltir. Kayıp ölçüm anında pseudo-ölçüm kalitesini yükseltir.\n\n### Güvenlik analizine bağlama\n\nÇıktı güvenlik analizine ancak **kalite damgasıyla** girer. Şunlar \"kestirim sağlam\" sayılmaz:\n\n- büyük artık,\n- çözülmemiş ada,\n- limit dışı gerilim.\n\nSağlam değilse N-1 sonucu operatöre kesinmiş gibi sunulmaz. Yazılımda bunun bayrağı olur.\n\n## Sayısal işler\n\nYazılımda karşılaşılan sayısal sorunlar ve çareleri:\n\n| Sorun | Sonuç / çare |\n| --- | --- |\n| Referans açı sabitlenmez | `G` tekildir |\n| Ağırlıklar 10⁶ farkla yayılır | `G` hastadır (kötü koşullu). σ tabanını makul aralıkta tut |\n| Sıfır empedanslı kuplaj | Durumu iki bara arasında bölüştüremez. Bara birleştir |\n| Akım ölçümü mutlak değer | Türevi gerilim sıfır civarında patlar. Dikdörtgen koordinat veya dikkatli başlangıç gerekir |\n| Büyük sistem | `G` seyrektir. Yoğun ters yok; seyrek çarpanlara ayırma kullanılır |\n\n`14-Programlama/ornekler/wls_durum_kestirimi.py` üç baralık lineer bir kestirimi ve bir kötü veriyi koşar. Onu çalıştırıp artığın kime işaret ettiğini elle doğrula.\n\nAşağıdaki konuşma metni, bu sayfanın tamamını 90 saniyeye sığdırır.\n\n> **Mülakatta şöyle söyle:** Önce \"neden var\" cümlesiyle başla, sonra WLS, gözlenebilirlik, kötü veri ve PMU sırasıyla git.\n\n## 90 saniye\n\n“Durum kestirimi, gürültülü ve fazla ölçüden gerilim ve açıyı bulur. WLS, ölçüm varyansının tersiyle ağırlıklar. Gözlenemeyen yere pseudo-ölçüm koyarım, ağırlığını düşük tutarım. Kötü veriyi ki-kare ile sezer, normalize artık ile yerini bulur, kritik ölçüde bu test körleşir. Topoloji hatası ölçüm atarak düzelmez. Kestirim sağlamsa N-1 ona koşar. PMU lineer ve hızlıdır, SCADA ile hibrit kullanılır.”\n"}, {"id": "09-Durum-Kestirimi/02-WLS-Turetim-Elle-Kotu-Veri-PMU.md", "group": "09  Durum kestirimi", "title": "WLS türetimi ve elle örnekler", "body": "# WLS türetimi ve elle örnekler\n\nBu sayfa WLS (Weighted Least Squares, ağırlıklı en küçük kareler) türetimini, elle örnekleri, kötü veri testini, gözlenebilirliği ve PMU'yu (Phasor Measurement Unit, fazör ölçüm birimi) anlatır.\n\n## Durum kestirimi ne iş yapar\n\nSCADA'dan (Supervisory Control and Data Acquisition, uzaktan izleme ve veri toplama sistemi) gelen ölçümlerin dört kusuru vardır:\n\n- gürültülüdür,\n- eksiktir,\n- bazen yanlıştır,\n- aynı anda alınmamıştır.\n\nHam ölçümle yük akışı ya da güvenlik analizi koşulmaz. Çünkü ölçümler birbiriyle bile tutmaz: bir baraya giren ve çıkan güçlerin toplamı sıfır etmez.\n\nDurum kestirimi, fazlalık ölçümü kullanarak şebeke denklemleriyle **tutarlı**, en olası durumu bulur.\n\nDurum, bütün bara gerilimlerinin büyüklüğü ve açısıdır. Bunları bilirsen her akışı hesaplarsın.\n\n> **Sade anlatım:** Yazılımcı gözüyle durum kestirimi, fizik kısıtlı, ağırlıklı, doğrusal olmayan bir regresyondur.\n\nYük akışından farkı:\n\n| | Yük akışı | Durum kestirimi |\n| --- | --- | --- |\n| Denklem sayısı | Bilinmeyene eşittir | Bilinmeyenden fazladır |\n| Veriye bakış | Veri doğru kabul edilir | Hiçbir veri doğru kabul edilmez |\n\nEnerji yönetim sistemindeki (EMS, Energy Management System) zincir:\n\n```\nSCADA → topoloji işleyici → durum kestirimi → güvenlik analizi, optimal güç akışı, operatör ekranı\n```\n\nKestirim bozulursa arkasındaki her şey bozulur.\n\n## Model\n\nÖlçümü, durumu ve hatayı birbirine bağlayan denklem:\n\n```\nz = h(x) + e\n```\n\n| Sembol | Anlamı |\n| --- | --- |\n| `z` | Ölçüm vektörü (`m` adet): akışlar, enjeksiyonlar, gerilim büyüklükleri |\n| `x` | Durum vektörü (`n = 2N − 1` adet): `N` gerilim büyüklüğü, `N − 1` açı |\n| `h(x)` | Durumu ölçüme bağlayan şebeke denklemleri |\n| `e` | Ölçüm hatası; sıfır ortalamalı, `σ_i` standart sapmalı, bağımsız kabul edilir |\n\n`N` bara sayısıdır. Açı sayısı `N − 1`'dir, çünkü bir bara referans alınır.\n\n**Fazlalık oranı** `m / n`'dir, yani ölçüm sayısının durum sayısına oranı. Pratikte 1,5–3 arasında olması istenir.\n\n## WLS türetimi\n\nAmaç: ölçüm ile model arasındaki farkın, **güvenilirliğe göre ağırlıklandırılmış** kareler toplamını en aza indirmek.\n\nAşağıdaki satır amaç fonksiyonunu önce toplam, sonra matris biçiminde yazar:\n\n```\nJ(x) = Σ (z_i − h_i(x))² / σ_i²  =  (z − h(x))ᵀ W (z − h(x))          W = R⁻¹ = diag(1/σ_i²)\n```\n\n- `R`: ölçüm hata kovaryans matrisi, köşegeni `σ_i²`.\n- `W`: ağırlık matrisi, köşegeni `1/σ_i²`.\n\nAğırlık neden `1/σ²`: hassas ölçüme çok, kaba ölçüme az güvenilir. Hatalar Gauss dağılımlıysa bu, en büyük olabilirlik kestirimidir (gözlenen veriyi en olası kılan durumu seçer).\n\n**Adım 1.** En küçük noktada türev sıfırdır. Bu adım, minimumun koşulunu yazar.\n\n```\n∂J/∂x = −2 Hᵀ W (z − h(x)) = 0          H = ∂h/∂x   (ölçüm Jacobian'ı, m × n)\n```\n\n**Adım 2.** `h(x)` doğrusal değildir; çevresinde doğrusallaştır. Bu adım, denklemi çözülebilir bir doğrusal biçime getirir.\n\n```\nh(x + Δx) ≈ h(x) + H Δx\n```\n\n**Adım 3.** Yerine koy. Bu adım, doğrusallaştırılmış `h`'yi Adım 1'deki koşula yerleştirir ve `Δx`'i yalnız bırakır.\n\n```\nHᵀ W (z − h(x) − H Δx) = 0\n(Hᵀ W H) Δx = Hᵀ W (z − h(x))\n```\n\n**Adım 4.** Tanımla ve yinele. Bu adım, sol taraftaki matrise isim verir ve çözümü bir döngüye çevirir.\n\n```\nG = Hᵀ W H                      kazanç matrisi (n × n, simetrik, seyrek)\nG Δx = Hᵀ W r                   normal denklemler,   r = z − h(x)\nx ← x + Δx                      |Δx| küçülene kadar\n```\n\nÜç matrisi ayır:\n\n| Matris | Boyut | Ne taşır |\n| --- | --- | --- |\n| `H` | `m × n` | Fizik: hangi ölçüm hangi duruma ne kadar duyarlı |\n| `W` | `m × m`, köşegen | Güven: her ölçümün hassasiyeti |\n| `G` | `n × n` | İkisinin birleşimi. Tersi, kestirimin kovaryansıdır. Tekilse sistem gözlenemez |\n\n**Sayısal not:** `G`, `H`'nin koşul sayısının karesini taşır. Koşul sayısı, bir matrisin sayısal hatayı ne kadar büyüttüğünün ölçüsüdür.\n\nÇok farklı ağırlıklar (sanal ölçümler, sıfır enjeksiyonlar) `G`'yi kötü koşullu yapar. Çözüm iki yoldan biridir:\n\n- normal denklemler yerine QR ayrışımı,\n- sıfır enjeksiyonları eşitlik kısıtı olarak yazmak.\n\n## Elle örnek 1: iki ölçüm, bir durum\n\n**Kurulum.** İki bara, hat `x = 0,1` pu, DC model. Bara 1 referans (`θ_1 = 0`). Tek bilinmeyen `θ_2`.\n\n- pu (per unit, birim değer): büyüklüğün seçilen bir taban değere oranı.\n- DC model: kayıpsız, gerilimleri 1 pu kabul eden, yalnız açılarla çalışan basit akış modeli.\n\nAynı hattın akışı iki ayrı cihazla ölçülmüş:\n\n```\nz_1 = 1,02 pu    σ_1 = 0,01       (hassas)\nz_2 = 0,98 pu    σ_2 = 0,02       (kaba)\n```\n\nModel: `P_12 = (θ_1 − θ_2) / x = −10 θ_2`. Doğrusal olduğu için tek adımda çözülür.\n\n**Hesap.** Aşağıdaki blok sırasıyla şunları yapar:\n\n1. `H` satırlarını yazar: her iki ölçüm de `θ_2`'ye −10 duyarlıdır.\n2. `W`'yi yazar: `1/0,01² = 10.000` ve `1/0,02² = 2.500`.\n3. `G = HᵀWH`'yi hesaplar.\n4. Sağ taraf `HᵀWz`'yi hesaplar.\n5. `θ_2`'yi bölmeyle bulur.\n6. Bulunan açıdan akışı geri hesaplar.\n\n```\nH = [ −10 ]        W = [ 10.000     0  ]\n    [ −10 ]            [    0    2.500 ]\n\nG     = Hᵀ W H = 100 × 10.000 + 100 × 2.500 = 1.250.000\nHᵀ W z = −10 × 10.000 × 1,02 − 10 × 2.500 × 0,98 = −126.500\n\nθ_2 = −126.500 / 1.250.000 = −0,1012 rad\nP̂   = −10 × (−0,1012) = 1,012 pu\n```\n\n**Yorum.** Kestirim 1,012; iki ölçümün düz ortalaması 1,000 olurdu. Hassas ölçümün ağırlığı dört kat fazla olduğu için sonuç ona yakın.\n\nBu örnekte WLS, **ağırlıklı ortalamadan** başka bir şey değildir: `(10.000 × 1,02 + 2.500 × 0,98) / 12.500 = 1,012`.\n\n**Artıklar.** Aşağıdaki blok her ölçümün kestirimden farkını alır, sonra bu farkların ağırlıklı kareler toplamı `J`'yi hesaplar:\n\n```\nr_1 = 1,02 − 1,012 = +0,008\nr_2 = 0,98 − 1,012 = −0,032\nJ   = 0,008² × 10.000 + 0,032² × 2.500 = 0,64 + 2,56 = 3,20\n```\n\n## Kötü veri: tespit\n\nÖlçümler yalnızca gürültü içeriyorsa `J`, serbestlik derecesi `m − n` olan ki-kare dağılımına uyar. `J` eşiği aşıyorsa içeride gürültüden fazlası vardır.\n\nÖrnekte serbestlik derecesi `m − n = 2 − 1 = 1`. %95 güven için ki-kare eşiği 3,84.\n\nAşağıdaki satır, hesaplanan `J`'yi eşikle karşılaştırır:\n\n```\nJ = 3,20 \u003c 3,84   →   kötü veri şüphesi yok\n```\n\nSık kullanılan eşikler (%95):\n\n| Serbestlik derecesi | Eşik |\n| --- | --- |\n| 1 | 3,84 |\n| 2 | 5,99 |\n| 3 | 7,81 |\n| 10 | 18,31 |\n\n## Kötü veri: teşhis (en büyük normalize artık)\n\nKi-kare \"bir sorun var\" der, hangisi olduğunu söylemez.\n\nHam artığa bakmak da yanıltır. Kötü ölçüm kestirimi kendine çeker, kendi artığını küçültür ve komşularının artığını büyütür. Buna **bulaşma** denir.\n\nÇare: her artık kendi standart sapmasına bölünür. İlk satır artık kovaryansını, ikinci satır normalize artığı verir:\n\n```\nΩ = R − H G⁻¹ Hᵀ              artık kovaryansı\nr_N,i = |r_i| / √Ω_ii          normalize artık\n```\n\nKural: en büyük `r_N` 3,0'ı aşıyorsa o ölçüm kötüdür. Çıkar, yeniden kestir, tekrarla.\n\n**Hesap.** Örnekte `H G⁻¹ Hᵀ` matrisinin bütün elemanları `100 / 1.250.000 = 0,00008`.\n\nAşağıdaki blok her ölçüm için şunu yapar: `R`'nin köşegeninden (`0,01² = 0,0001` ve `0,02² = 0,0004`) 0,00008'i çıkarıp `Ω_ii`'yi bulur, sonra ham artığı `√Ω_ii`'ye böler:\n\n```\nΩ_11 = 0,0001 − 0,00008 = 0,00002       r_N,1 = 0,008 / 0,00447 = 1,79\nΩ_22 = 0,0004 − 0,00008 = 0,00032       r_N,2 = 0,032 / 0,01789 = 1,79\n```\n\nİkisi de 3'ün altında.\n\nAma asıl ders başka: **iki normalize artık birbirine eşit.** Bir durumu yalnızca iki ölçüm gözlüyorsa hangisinin yanlış olduğu ayırt edilemez. Biri bozulsa ikisinin normalize artığı birlikte büyür.\n\nBuna **kritik çift** denir. Tespit edilir, teşhis edilemez. Teşhis için en az üç ölçüm gerekir.\n\n## Elle örnek 2: üçüncü ölçüm ve kaba hata\n\nAynı hatta üçüncü bir ölçüm ekleniyor ve bozuk: `z_3 = 1,20`, `σ_3 = 0,02`. Üçüncü ölçümün ağırlığı `1/0,02² = 2.500`'dür.\n\nAşağıdaki blok sırasıyla şunları yapar:\n\n1. Yeni `G`'yi üç ağırlığın toplamıyla kurar.\n2. Akışı üç ölçümün ağırlıklı ortalaması olarak kestirir.\n3. Artıkları ve `J`'yi hesaplar, `J`'yi 2 serbestlik derecesinin eşiğiyle karşılaştırır (`m − n = 3 − 1 = 2`).\n4. Normalize artıkları hesaplar ve en büyüğünü seçer.\n\n```\nG = 100 × (10.000 + 2.500 + 2.500) = 1.500.000\nP̂ = (10.000 × 1,02 + 2.500 × 0,98 + 2.500 × 1,20) / 15.000 = 1,0433\n\nr = [ −0,0233   −0,0633   +0,1567 ]\nJ = 76,8        eşik (2 serbestlik derecesi) = 5,99     →   kötü veri VAR\n\nr_N = [ 4,04    3,47    8,58 ]                          →   en büyük: üçüncü ölçüm\n```\n\n**Bulaşmaya dikkat.** Sağlam olan birinci ve ikinci ölçümün normalize artıkları da 3'ü aştı. Hepsini birden atmak yanlıştır.\n\nYalnız **en büyüğü** çıkarılır ve yeniden kestirilir. Sonuç 1,012'ye döner, `J = 3,20` olur, test geçer.\n\nSayılar `elle_ornekler.py` ve ek bir hesapla doğrulanmıştır.\n\n## Gözlenebilirlik\n\nEldeki ölçümlerle bütün durum değişkenleri tek anlamlı bulunabiliyorsa sistem **gözlenebilirdir**.\n\n| Ölçüt | Koşul |\n| --- | --- |\n| Sayısal | `G` tekil değilse (`H`'nin rankı `n` ise) |\n| Topolojik | Ölçümler, bütün baraları kapsayan bir ağaç oluşturabiliyorsa |\n\n`m ≥ n` gerekir ama yetmez. Ölçümlerin hepsi şebekenin bir köşesinde toplanmışsa öbür köşe gözlenemez.\n\nGözlenemeyen kısım için:\n\n1. sistemi gözlenebilir adalara böl,\n2. eksik kısmı **sözde ölçümle** (tahmin, geçmiş veri) tamamla,\n3. sözde ölçümün ağırlığını küçük ver.\n\n**Kritik ölçüm:** çıkarılırsa sistemi gözlenemez yapan ölçüm. Artığı her zaman sıfırdır, çünkü kestirim onu birebir karşılar. Bu yüzden hatası **tespit edilemez**.\n\nÖlçüm yerleşimi planlanırken kritik ölçüm bırakılmamaya çalışılır.\n\n## PMU ve doğrusal kestirim\n\n| | Klasik SCADA | PMU |\n| --- | --- | --- |\n| Ne ölçer | Güç ve gerilim büyüklüğü | GPS saatiyle eşzamanlanmış **gerilim ve akım fazörü**: büyüklük ve açı |\n| Durumla ilişki | Doğrusal değil; yineleme gerekir | Dikdörtgen koordinatta doğrusal |\n| Hız | Tarama birkaç saniyede bir | Saniyede 25–50 ölçüm (50 Hz sistemde) |\n| Eşzamanlılık | Ölçümler eşzamanlı değildir | GPS ile eşzamanlı |\n\nZaman doğruluğu neden önemli: 1 mikrosaniyelik zaman hatası 50 Hz'te 0,018° açı hatasıdır.\n\n**Doğrusallık nereden gelir.** Durumu dikdörtgen koordinatlarda (gerilimin gerçek ve sanal kısmı) yazarsan iki şey olur:\n\n- gerilim fazörü ölçümü durumun kendisidir,\n- akım fazörü ölçümü `I = Y V` ile durumun **doğrusal** işlevidir (`Y`: şebekenin admitans matrisi).\n\nBu durumda model ve çözüm şöyledir. İlk satır doğrusal ölçüm modelini, ikinci satır iterasyonsuz çözümü verir:\n\n```\nz = H x + e          H sabit\nx̂ = (Hᵀ W H)⁻¹ Hᵀ W z          tek adım, yineleme yok\n```\n\nSonuçları:\n\n- yakınsama sorunu yoktur,\n- `G`'nin çarpanları bir kez hesaplanıp saklanır,\n- kestirim saniyede onlarca kez koşabilir.\n\n### Elle örnek 3\n\n`05` klasöründeki iki baralı örnek. Bara 1'deki PMU şunları ölçüyor: `V_1 = 1,0∠0°` ve hat akımı `I_12 = 0,5 − j0,2303` pu.\n\nAşağıdaki blok iki adım yapar. İlk satır, hattaki gerilim düşümünü (`j x I_12`) bara 1 geriliminden çıkararak `V_2`'yi bulur. İkinci satır, bu karmaşık sayıyı büyüklük ve açıya çevirir:\n\n```\nV_2 = V_1 − j x I_12 = 1,0 − j0,1 × (0,5 − j0,2303) = 0,97697 − j0,05\n|V_2| = 0,9782       açı = −2,93°\n```\n\nNewton-Raphson'ın üç turda bulduğu sonuç, tek satır karmaşık sayı aritmetiğiyle geldi.\n\nAyrıca bara 2'de ölçüm cihazı yokken durumu bulundu: bir PMU, akım ölçtüğü her hattın karşı ucunu da gözlenebilir kılar.\n\n**Pratik gerçek:** her baraya PMU konmaz. Uygulamada **hibrit** kestirim kullanılır: SCADA ölçümleriyle klasik kestirim, PMU ölçümleriyle iyileştirme.\n\nPMU'nun ek değerleri:\n\n- doğrudan açı ölçümü,\n- dinamikleri görmek (salınım, RoCoF — Rate of Change of Frequency, frekansın değişim hızı),\n- geniş alan koruma.\n\nSIPS'in (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) veri kaynağı budur.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"Durum kestirimi ölçümleri filtreler.\"** | Yumuşatmaz; şebeke denklemlerine uyan en olası durumu bulur. |\n| **\"Ölçüm sayısı bilinmeyenden fazlaysa sistem gözlenebilirdir.\"** | Dağılım da önemlidir. |\n| **\"En büyük ham artık kötü ölçümdür.\"** | Normalize artığa bakılır; ham artık bulaşmadan etkilenir ve ölçüm türleri arasında karşılaştırılamaz. |\n| **\"Eşiği aşan bütün ölçümleri atarım.\"** | Yalnız en büyüğü, sonra yeniden kestirim. |\n| **\"Kritik ölçümdeki hata yakalanır.\"** | Artığı hep sıfırdır; yakalanamaz. |\n| **\"Ağırlık, ölçümün önemidir.\"** | Hassasiyetidir: `1/σ²`. |\n| **\"Kötü veri her zaman ölçüm hatasıdır.\"** | Topoloji hatası (kesici konumu yanlış) ve parametre hatası (hat empedansı yanlış) da aynı belirtiyi verir; ama artıklar tek ölçümde değil bir bölgede büyür. |\n| **\"PMU varsa SCADA'ya gerek yok.\"** | Kapsama yetmez; hibrit çalışılır. |\n\n## Panel takip sorusu\n\n**\"Birbirini doğrulayan iki kötü ölçüm olursa?\"**\n\n> **Mülakatta şöyle söyle:** Etkileşen ve uyumlu çoklu kötü veri, en büyük normalize artık testini yanıltabilir; sağlam ölçüm suçlanır. Çareler: hipotez testi ile teşhis, dayanıklı kestiriciler (en küçük mutlak değer), ve daha fazla fazlalık.\n\n**\"Kestirim yakınsamazsa operatöre ne gösterirsin?\"**\n\n> **Mülakatta şöyle söyle:** Eski sonucu taze gibi göstermem. Son geçerli çözümü zaman damgasıyla, yakınsamama nedenini (topoloji değişimi, gözlenemeyen ada, kaba hata) ve hangi alt uygulamaların durduğunu gösteririm.\n\n**\"Normal denklemler neden sorun çıkarır?\"**\n\n> **Mülakatta şöyle söyle:** `G = HᵀWH` koşul sayısını kareler. Ağırlıklar arasında milyon kat fark varsa çarpanlara ayırma sayısal olarak bozulur. QR veya Hachtel yöntemi kullanılır.\n\nHachtel yöntemi, normal denklemleri kurmadan ölçüm ve kısıt denklemlerini birlikte genişletilmiş bir matrisle çözer; böylece koşul sayısının karesi alınmaz.\n\n## 90 saniye\n\n\"Durum kestirimi, gürültülü ve fazlalıklı ölçümlerden şebeke denklemleriyle tutarlı en olası gerilim ve açıları bulur. Ağırlıklı en küçük karelerde her artığı ölçümün varyansına böler, toplamı en aza indiririm. Türevi sıfıra eşitleyip doğrusallaştırınca normal denklemler çıkar: kazanç matrisi H devrik W H'dir ve tekilse sistem gözlenemez. Kötü veriyi önce ki-kare testiyle tespit eder, sonra en büyük normalize artıkla teşhis eder, o ölçümü çıkarıp yeniden kestiririm. Bir durumu tek ölçüm gözlüyorsa hatası yakalanamaz, iki ölçüm gözlüyorsa tespit edilir ama teşhis edilemez. PMU fazör ölçtüğü için dikdörtgen koordinatlarda model doğrusaldır ve çözüm tek adımdır.\"\n"}, {"id": "10-Koruma-ve-Topraklama/00-Alt-Basliklar.md", "group": "10  Koruma ve topraklama", "title": "10 — Koruma ve topraklama", "body": "# 10 — Koruma ve topraklama\n\nBu klasör iki soruya cevap verir. Birincisi: şebekede bir arıza olunca hangi cihaz, ne kadar sürede, neyi ayırır? Buna **koruma** denir. İkincisi: arıza akımı toprağa giderken insanlar ve ekipman nasıl güvende kalır? Buna **topraklama** denir.\n\nAşağıdaki liste, bu klasörde çalışacağın alt başlıklardır. Her maddenin altında o başlıkta ne öğreneceğin bir cümleyle yazıyor. Dersin kendisi şu iki sayfadadır:\n\n- [01 — Röle, koordinasyon, topraklama](01-Role-Koordinasyon-Topraklama.md): korumanın genel çerçevesi, röle aileleri, evirici etkisi ve topraklama.\n- [02 — Koordinasyon, CTI, mesafe, evirici](02-Koordinasyon-CTI-Mesafe-Evirici.md): aynı konuların elle hesaplı, sayılı derin hali.\n\n## Alt başlıklar\n\n1. **Korumanın dört niteliği: seçicilik, hız, duyarlılık, güvenilirlik**\n   Bir koruma sisteminin \"iyi\" sayılması için hangi dört şartı sağlaması gerektiğini ve bu şartların neden birbiriyle çatıştığını öğreneceksin.\n2. **Birincil ve yedek koruma**\n   Asıl röle veya kesici çalışmazsa işi kimin, ne kadar gecikmeyle devraldığını öğreneceksin.\n3. **Akım ve gerilim trafosu, doyma, yön**\n   Rölenin şebekeyi doğrudan değil ölçü trafoları üzerinden gördüğünü ve bu trafoların doyunca rölenin nasıl yanılabileceğini öğreneceksin.\n4. **Aşırı akım: sabit zaman, ters zaman, yönlü**\n   En yaygın röle ailesinin çalışma mantığını, eğri türlerini ve akım yönüne bakmanın ne zaman şart olduğunu öğreneceksin.\n5. **Mesafe rölesi: bölge 1, 2, 3, güç salınımı**\n   İletim hattında rölenin arızaya uzaklığı empedansla nasıl ölçtüğünü ve bölgelerin neden %100 değil de daha kısa ayarlandığını öğreneceksin.\n6. **Diferansiyel: hat, trafo, bara**\n   Bir bölgeye giren ve çıkan akımı karşılaştıran korumanın neden çok seçici olduğunu ve hangi durumlarda yanılabileceğini öğreneceksin.\n7. **Aşırı ve düşük gerilim, frekans, RoCoF**\n   Gerilim ve frekans eşiklerine bakan korumaları ve frekansın değişim hızına (RoCoF) bakan korumanın düşük atalette neden önem kazandığını öğreneceksin.\n8. **Otomatik tekrar kapama**\n   Geçici arızadan sonra hattın kendiliğinden yeniden enerjilenmesinin adımlarını ve dağıtık üretimle ilgili riskini öğreneceksin.\n9. **Sigorta-röle-kesici koordinasyonu**\n   Arka arkaya dizilmiş koruma cihazlarının, arızaya en yakın olan önce açacak şekilde nasıl sıralandığını öğreneceksin.\n10. **Generatör, trafo, hat, bara koruma paketi**\n    Her ana ekipman türü için hangi korumaların bir arada kullanıldığını öğreneceksin.\n11. **Haberleşmeli koruma: izinli, blokaj, diferansiyel**\n    Hattın iki ucundaki rölelerin haberleşerek bütün hattı gecikmesiz nasıl koruyabildiğini öğreneceksin.\n12. **SIPS ile rölenin katman farkı**\n    Tek ekipmanı koruyan röle ile bütün sistemin bütünlüğünü koruyan SIPS'in (System Integrity Protection Scheme, Sistem Bütünlüğü Koruma Düzeni) farkını öğreneceksin.\n13. **Eviricinin korumayı bozduğu yerler**\n    Güneş ve rüzgâr gibi evirici bağlı üretimin küçük ve kontrollü arıza akımı yüzünden hangi korumaların zorlandığını öğreneceksin.\n14. **Topraklama biçimleri: doğrudan, dirençli, rezonans, izole**\n    Trafonun nötr noktasının toprağa nasıl bağlandığına göre arıza akımının ve güvenliğin nasıl değiştiğini öğreneceksin.\n15. **Topraklama hesabı: dokunma, adım, GPR**\n    Arıza anında insanın üzerine binebilecek gerilimlerin ve toprak potansiyel yükselmesinin (GPR, Ground Potential Rise) nasıl kontrol edildiğini öğreneceksin.\n16. **Topraklama tasarımının sıfır diziye etkisi**\n    Topraklama seçiminin toprak arızasında akan akımı ve dolayısıyla koruma ayarlarını nasıl etkilediğini öğreneceksin.\n17. **Koruma ayarının yazılımla doğrulanması**\n    Koordinasyonun bütün arıza yerleri ve senaryolar için yazılımla nasıl taranıp kontrol edildiğini öğreneceksin.\n"}, {"id": "10-Koruma-ve-Topraklama/01-Role-Koordinasyon-Topraklama.md", "group": "10  Koruma ve topraklama", "title": "Koruma ve topraklama", "body": "# Koruma ve topraklama\n\nBu sayfa korumanın genel çerçevesini anlatır. Önce iyi bir korumanın dört niteliğini, sonra röle ailelerini, koordinasyonu, eviricinin (inverter) korumaya etkisini ve en sonda topraklamayı göreceksin. Sayılı ve elle hesaplı derin anlatım `02-Koordinasyon-CTI-Mesafe-Evirici.md` dosyasındadır.\n\n> **Sade anlatım:** Koruma, şebekenin sigortasıdır ama akıllı bir sigortadır. Bir yerde kısa devre olunca yalnız o parçayı, olabildiğince çabuk ve doğru yerden keser. Topraklama ise o arıza akımını toprağa, çevredeki insanı çarpmadan akıtmanın yoludur.\n\n## Dört nitelik\n\nBir koruma sistemi dört ölçütle değerlendirilir:\n\n| Nitelik | Ne ister | Ek not |\n| --- | --- | --- |\n| **Seçicilik** | Yalnız arızalı eleman ayrılsın. | Sağlam kısımlar enerjili kalır. |\n| **Hız** | Arıza süresi kısa olsun. | Kararlılık ve hasar, süreyi kısaltır. Geçici hal CCT'si (Critical Clearing Time, kritik temizleme süresi) koruma süresinin üstündedir. |\n| **Duyarlılık** | En küçük makul arızayı görsün. | Asgari kısa devre burada kullanılır. |\n| **Güvenilirlik** | Çalışması gereken yerde çalışsın (dependability), çalışmaması gereken yerde suskun kalsın (security). | İkisi ters yöndedir. Çok hassas röle yanlış açar. |\n\nHız satırını açalım: arıza ne kadar uzun sürerse ekipman o kadar hasar görür ve generatörler senkronizmadan o kadar kolay kopar. CCT, arızanın sistem kararsız olmadan en geç ne zaman temizlenmesi gerektiğidir. Koruma bu süreden önce işini bitirmelidir.\n\nGüvenilirlik satırını açalım: \"her arızada mutlaka aç\" (dependability) ile \"arıza yokken asla açma\" (security) birbirini çeker. Röleyi çok hassas yaparsan birinciyi kazanır, ikinciyi kaybedersin.\n\n### Yedek koruma ve kesici arıza koruması\n\nYedek koruma, birincil röle veya kesici arızalanırsa devreye girer. Yedek daha yavaş ve daha geniş bölgeli olmak zorundadır. Yavaş olmalıdır ki önce asıl korumaya fırsat tanısın. Geniş olmalıdır ki asıl korumanın bölgesini de kapsasın.\n\nKesici arıza koruması (CBF, Circuit Breaker Failure), açma emri gittiği halde akım kesilmezse komşu kesicileri açar.\n\n## Röle aileleri\n\nRöle, ölçü trafoları üzerinden akımı ve gerilimi izleyen, arıza görünce kesiciye açma emri veren cihazdır. Başlıca aileler aşağıdadır.\n\n### Aşırı akım\n\nAkım, ayarlanmış eşiği geçince röle zaman saymaya başlar: `I > I_pickup` ise zaman sayar. `I_pickup`, rölenin \"uyandığı\" (çalışmaya başladığı) akım değeridir.\n\n| Tür | Davranış |\n| --- | --- |\n| Sabit zaman | Kademelidir: eşik aşılınca hep aynı gecikmeyle açar. |\n| Ters zaman | Akım büyüdükçe hızlanır; sigortayla koordinasyonu kolaydır. |\n| Yönlü aşırı akım | Akımın yönüne de bakar; halka ve çift beslemede şarttır. |\n\nDağıtım fiderinin (dağıtım hattının) klasik aracı budur. Üretim katkısı arttıkça pickup ve zaman eğrisi yeniden çizilir, çünkü arıza akımları değişir.\n\n### Mesafe\n\nMesafe rölesi, ölçtüğü gerilimi ölçtüğü akıma böler. Görülen empedans `Z = V/I` hattın empedansına bölününce mesafe olur. Hattın empedansı boyuyla orantılı olduğu için bu oran arızanın ne kadar uzakta olduğunu verir.\n\nTipik bölge uygulaması aşağıdadır. Sayılar şirket standardına göre kayar. Mülakatta tipik değer söyle ve \"TEİAŞ (Türkiye Elektrik İletim A.Ş.) ayar değeri standarttır\" diye kes.\n\n| Bölge | Erişim ve gecikme | Neden |\n| --- | --- | --- |\n| Bölge 1 | Hat empedansının yaklaşık %80'i, gecikmesiz. | %100 yapılmaması, ölçü hatasının bir sonraki barayı içine almasını önler. |\n| Bölge 2 | Hattın tamamı artı bir sonraki en kısa hattın bir kısmı, yaklaşık 0,3–0,5 s. | Karşı uç yedeği. |\n| Bölge 3 | Daha geniş yedek, daha uzun gecikme. | Yük istilası (load encroachment) riski taşır. |\n\nYük istilası şudur: ağır yük, bölge 3'ün içine empedans olarak girebilir. Yani arıza olmadığı halde yükün empedansı röleye arıza gibi görünür. Yük blinder'ı (yük körleyicisi) bunu keser.\n\n**Güç salınımı.** Güç salınımı, empedansın röle düzleminde daire çizmesidir. Generatörler birbirine göre salındıkça röle değişen bir empedans görür. Salınım bloğu, kararlı salınımda açmayı engeller, gerçek arızada bırakır.\n\nYanlış bölge 3 açması zincirleme arızanın klasik tetiğidir. SIPS'in (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) var olma nedenlerinden biri, rölelerin yerel doğruyu yapıp sistemi bölmesidir. Her röle kendi açısından haklıdır ama toplam sonuç sistemin parçalanması olabilir.\n\n### Diferansiyel\n\nDiferansiyel koruma, koruma bölgesine giren ve çıkan akımın farkına bakar. Sağlam durumda giren akım çıkan akıma eşittir. Fark varsa akım bölgenin içinde bir yere kaçıyordur, yani arıza içeridedir. Uygulandığı yerler: hat, trafo, bara.\n\nYanılma kaynakları ve çareleri:\n\n| Sorun | Ne olur | Çare |\n| --- | --- | --- |\n| Haberleşme gecikmesi ve CT (Current Transformer, akım trafosu) doyması | Dış akımı (bölge dışındaki arızayı) iç arıza gibi taklit eder. | Tutma (restraint) eğrisi, dış arızada yanlış açmayı keser. |\n| Trafo mıknatıslanma akımı (inrush) | Trafo enerjilenirken yalnız bir sargıdan akım akar, fark varmış gibi görünür. | Trafo diferansiyeli ikinci harmonik tutması kullanır. |\n\nBara diferansiyeli, bara arızasını N-1'in (bir elemanın devre dışı kaldığı durumun) ağır halinden hızla çıkarır.\n\n### Frekans ve gerilim\n\n| Koruma | Ne yapar |\n| --- | --- |\n| Düşük frekans | Yük atma |\n| Yüksek frekans | Üretim kısıntısı |\n| RoCoF (Rate of Change of Frequency, frekansın değişim hızı) | Ada veya kayıp şebeke tespiti |\n| Düşük gerilim | Yük atma |\n\nEşikler sistem koruma planındadır, fider rölesinin keyfi değildir. Yani bu değerleri tek bir fiderin mühendisi değil, bütün sistemi planlayan kurum belirler.\n\nDüşük atalette RoCoF büyür. Atalet, dönen kütlelerin frekans değişimine direncidir; evirici ağırlıklı şebekede azalır. Dağıtık üretim RoCoF ile kendini ayırırsa üretim tam da ihtiyaç anında gider.\n\n## Koordinasyon\n\nKoordinasyon, arka arkaya dizilmiş koruma cihazlarının doğru sırayla açmasını sağlamaktır.\n\nZaman-akım eğrisi üst üste bindirilir. Aşağıdaki cihaz (arızaya yakın olan) yukarıdakinden, tüm arıza akımı aralığında bir zaman marjı (çoğunlukla 0,2–0,3 s artı kesici süresi) kadar önce açar.\n\nSigorta eğrisi, röle eğrisi ve OTK (otomatik tekrar kapama) sayısı aynı grafiğe çizilir. Yazılım (ETAP, PowerFactory protection, CYMTCC) eğriyi çizer; mühendis marjı ve istisnayı okur.\n\n### Otomatik tekrar kapama (OTK)\n\nHatlardaki arızaların bir kısmı geçicidir (örneğin hatta değen dal). OTK, kesici açtıktan sonra hattı kendiliğinden yeniden kapatır. Sırası:\n\n1. Ölü zaman (hattın enerjisiz beklediği süre).\n2. Kapama.\n3. Varsa ikinci deneme.\n4. Sonra kilit (arıza kalıcı sayılır, kesici açık kalır).\n\nDağıtık üretim ölü zamanda adayı söndürmelidir. Söndürmezse kesici, şebekeyle senkron olmayan bir adayı yeniden bağlar. Senkron olmayan kapama, mekanik moment üretir.\n\n### Haberleşmeli hat koruması\n\nHaberleşmeli hat koruması bölge 1'i hattın yüzde 100'üne çıkarmak için kullanılır. İki uçtaki röle birbirine haber gönderir:\n\n- **İzinli şema:** karşı uç da arızayı görüyorsa izin ver.\n- **Blokaj şeması:** karşı uç arızayı görmüyorsa (arıza dışarıdaysa) blokaj.\n\nFiber veya kuranportör (enerji hattı üzerinden taşıyıcı frekanslı haberleşme) giderse şema yedek bölgeye düşer. Haberleşme arızası korumasız bırakmamalıdır.\n\n## Evirici\n\nGüneş ve rüzgâr santralleri şebekeye evirici (inverter) üzerinden bağlanır. Eviricinin arıza davranışı senkron generatöre benzemez:\n\n- Kısa devre katkısı küçüktür, kontrol edilir, negatif dizi davranışı üreticiye göre değişir.\n- Mesafe rölesi zayıf beslemede ve evirici kontrolünde yanlış mesafe görebilir.\n- Yön, polarizasyon gerilimi çökünce bozulur. Polarizasyon gerilimi, yön elemanının akımı karşılaştırdığı referans gerilimdir.\n- Şebeke oluşturan evirici arıza akımını bilinçli büyütürse koordinasyon yeniden yapılır.\n\nKoruma çalışması \"kısa devre dosyasını bir kez koştum\" ile kapanmaz; kontrol modu senaryosu da koşulur. Çünkü eviricinin arıza akımı donanımdan çok kontrol yazılımına bağlıdır.\n\n## Topraklama\n\nTopraklama biçimi, yani trafonun nötr noktasının toprağa nasıl bağlandığı, hem can güvenliğini hem sıfır dizi akımını belirler. Sıfır dizi akımı, toprak arızasında toprak üzerinden dönen akımdır.\n\n| Biçim | Davranış |\n| --- | --- |\n| Doğrudan topraklı | Büyük toprak arıza akımı, kolay algı, yüksek dokunma gerilimi riski. İletim trafolarının Y tarafı çoğunlukla böyledir. |\n| Direnç üzerinden | Akım sınırlı, ark daha kolay söner, algı için hassas röle gerekir. |\n| Rezonans (Peterson) | Bobin kapasitif akımı söndürür, dağıtımda geçici arızayı yaşatmadan temizleyebilir. |\n| İzole | Akım kapasitiftir, küçük şebekede kalır, gerilim yükselmeleri izlenir. |\n\n### Trafo merkezi topraklaması\n\nTrafo merkezi topraklaması, arıza akımını toprağa güvenli yayar. Hesabın parçaları:\n\n- Topraklama ağı direnci.\n- Toprak özdirenci (Wenner ölçümü ile; dört elektrotlu standart ölçüm yöntemi).\n- Adım gerilimi: yürüyen birinin iki ayağı arasına binen gerilim.\n- Dokunma gerilimi: topraklı bir metale dokunan birinin eli ile ayağı arasına binen gerilim.\n- Toprak potansiyel yükselmesi (GPR, Ground Potential Rise).\n\nIEEE 80 çerçeve standarttır. İzin verilen dokunma gerilimi arıza temizleme süresine bağlıdır; koruma yavaşsa izin verilen gerilim düşer. İnsan vücudu kısa süreli akıma daha fazla dayanır, bu yüzden süre uzadıkça sınır sıkılaşır. Bu yüzden koruma süresi ile topraklama tasarımı aynı projenin iki sayfasıdır.\n\n### Yazılımda topraklama\n\nYazılımda topraklama ağı, iletim yük akışının içinde çözülmez. Ayrı bir elektrot modelidir. Grubun çalışma alanları listesinde ayrı madde olarak durur.\n\nMülakatta şu cümle yeter:\n\n> **Mülakatta şöyle söyle:** \"Kısa devre akımını alırım, temizleme süresine göre adım ve dokunma gerilimini IEEE 80 ile kontrol ederim, aşım varsa iletken sıklaştırırım veya yüzeye yüksek özdirençli kaplama koyarım.\"\n\nElektrot elektrot mesh çizmeyi iddia etme, yapmadıysan.\n\n### Sıfır dizi bağlantısı\n\nSıfır dizi empedansı, guard teli (hattın üstündeki koruma teli), kule ayağı ve nötr topraklama direncinden gelir. Koruma ayarı ile topraklama modeli birbirini besler: toprak arıza rölesinin göreceği akım, topraklama modelinden çıkan sıfır dizi empedansına bağlıdır.\n\n## 90 saniye\n\n“Koruma seçici, hızlı, duyarlı ve güvenilir olmalı; yedek daha yavaş ve daha geniş. İletimde mesafe bölgeleri ve salınım bloğu, dağıtımda ters zaman ve OTK, kritik elemanda diferansiyel. Evirici kısa devreyi senkron makine gibi beslemez. SIPS yerel rölenin üstünde sistem bütünlüğü katmanıdır. Topraklama biçimi sıfır dizi akımını belirler; adım ve dokunma gerilimi arıza süresiyle birlikte IEEE 80’e bakılır.”\n"}, {"id": "10-Koruma-ve-Topraklama/02-Koordinasyon-CTI-Mesafe-Evirici.md", "group": "10  Koruma ve topraklama", "title": "Röle koordinasyonu", "body": "# Röle koordinasyonu\n\nBu sayfanın konuları: zaman-akım eğrileri, CTI, mesafe bölgeleri, evirici ağırlıklı şebeke. CTI (Coordination Time Interval), Türkçesiyle koordinasyon zaman aralığıdır: yedek rölenin asıl röleden ne kadar geç açması gerektiğini söyler. Konular dört elle hesaplı örnekle anlatılır.\n\n> **Sade anlatım:** Bir hatta arka arkaya birkaç röle dizilidir. Arıza olunca arızaya en yakın röle önce açmalı, arkadakiler biraz bekleyip \"o açtı mı?\" diye bakmalıdır. Koordinasyon, bu bekleme sürelerini ve eşiklerini doğru ayarlama işidir.\n\n## Korumanın dört ölçütü\n\n| Ölçüt | Ne ister |\n| --- | --- |\n| **Seçicilik** | Yalnız arızalı kısım ayrılmalı; arızaya en yakın kesici açmalı. |\n| **Hız** | Ekipman hasarı ve kararlılık için hızlı açmalı (`08` klasörü: kritik temizleme süresi). |\n| **Duyarlılık** | En küçük arıza akımını bile görmeli. |\n| **Güvenilirlik** | Gerektiğinde açmalı (bağımlılık), gerekmediğinde açmamalı (emniyet). |\n\nBu dördü birbiriyle çatışır. Örneğin çok duyarlı bir röle, arıza olmayan durumda da açabilir. Koordinasyon, aralarındaki dengeyi kurma işidir.\n\n**Yazılımcı benzetmesi: zaman aşımı zinciri.** Çağrı zincirinde en içteki servisin zaman aşımı en kısa, dıştakilerin giderek uzun olmalıdır; yoksa iç servis yanıt veremeden dış katman bütün isteği düşürür. Radyal fiderde röleler aynı mantıkla sıralanır. Radyal fider, tek yönden beslenen, dallanarak yüke giden hattır.\n\n## Ters zamanlı aşırı akım rölesi\n\nAkım ne kadar büyükse o kadar hızlı açar. Bu davranışın standart eğrileri IEC 60255'te (IEC: International Electrotechnical Commission, Uluslararası Elektroteknik Komisyonu) tanımlıdır.\n\nAşağıdaki formül, rölenin açma süresini arıza akımına göre verir. `M`, arıza akımının ayar akımına oranıdır (ayarın kaç katı akım aktığı).\n\n```\nt = TMS × k / (M^α − 1)          M = I_arıza / I_ayar\n```\n\n`k` ve `α` sabitleri eğri tipine göre değişir:\n\n| Eğri | `k` | `α` | Kullanım |\n| --- | --- | --- | --- |\n| Standart ters (SI, Standard Inverse) | 0,14 | 0,02 | Genel |\n| Çok ters (VI, Very Inverse) | 13,5 | 1 | Arıza akımı mesafeyle hızlı düşüyorsa |\n| Aşırı ters (EI, Extremely Inverse) | 80 | 2 | Sigortalarla koordinasyon, soğuk yük alma |\n\n`α` büyüdükçe eğri dikleşir: büyük akımda çok hızlı, küçük akımda çok yavaş açar.\n\n### İki ayar\n\n- **Akım ayarı `I_ayar`:** rölenin çalışmaya başladığı akım. En büyük yük akımının üstünde, en küçük arıza akımının altında olmalı. Böylece normal yükte açmaz, en zayıf arızayı da görür.\n- **Zaman çarpanı `TMS` (Time Multiplier Setting):** eğriyi zaman ekseninde aşağı yukarı kaydırır. Eğrinin şeklini değil, ne kadar geç açtığını değiştirir.\n\nEk olarak **ani eleman:** akım çok büyükse gecikmesiz açar. Yalnız kendi bölgesindeki arızada o akıma ulaşılacak şekilde ayarlanır. Böylece komşu bölgedeki arızada gecikmesiz açıp seçiciliği bozmaz.\n\n## Koordinasyon zaman aralığı (CTI)\n\nArkadaki (yedek) röle, öndeki (asıl) röleden en az CTI kadar geç açmalıdır. Bu süre, asıl rölenin ve kesicinin işini bitirmesine yetmelidir. İçinde ne var:\n\n| Bileşen | Tipik |\n| --- | --- |\n| Kesici açma süresi | 50–100 ms |\n| Rölenin aşma süresi (elektromekanikte) | 0–50 ms |\n| Röle ve akım trafosu zaman hatası | 50–100 ms |\n| Güvenlik payı | 50–100 ms |\n| **Toplam** | **0,2–0,4 s** |\n\nAşma süresi (overshoot), elektromekanik rölede akım kesildikten sonra diskin ataletle bir süre daha dönmesidir.\n\n| Röle tipi | Kullanılan CTI |\n| --- | --- |\n| Sayısal röle | 0,2–0,3 s |\n| Elektromekanik röle | 0,3–0,4 s |\n\n**Bedeli:** her kademe 0,3 s ekler. Beş kademeli bir fiderde kaynağa en yakın röle, arıza akımının en büyük olduğu yerde, en geç açan röledir. Ters zamanlı eğri bu sorunu hafifletir; ani eleman ve haberleşmeli koruma çözer.\n\n## Elle örnek 1: iki rölenin koordinasyonu\n\n**Durum:** Radyal fider: kaynak → röle A → röle B → yük. B'nin hemen ötesinde arıza, arıza akımı 2000 A. İkisi de standart ters eğri (`k = 0,14`, `α = 0,02`).\n\n### Röle B (asıl)\n\nAyarlar: `I_ayar = 200 A`, `TMS = 0,10`.\n\nAşağıdaki blok B'nin açma süresini üç adımda hesaplar:\n\n1. `M = 2000 / 200 = 10` satırı, arıza akımının B'nin ayarının kaç katı olduğunu bulur.\n2. `10^0,02 = 1,0471` satırı, formüldeki `M^α` terimini hesaplar.\n3. Son satır bu değerleri formüle koyar: önce `0,14 / (1,0471 − 1)` bölümü (2,971) bulunur, sonra `TMS = 0,10` ile çarpılarak B'nin açma süresi elde edilir.\n\n```\nM = 2000 / 200 = 10\n10^0,02 = 1,0471\nt_B = 0,10 × 0,14 / (1,0471 − 1) = 0,10 × 2,971 = 0,297 s\n```\n\n### Röle A (yedek)\n\nAyarlar: `I_ayar = 400 A`. CTI = 0,3 s isteniyor. Bilinmeyen, A'nın `TMS` değeridir.\n\nAşağıdaki blok A'nın gereken `TMS` değerini beş adımda bulur:\n\n1. \"Gereken süre\" satırı, B'nin süresine CTI'yı ekleyerek A'nın en erken ne zaman açabileceğini bulur.\n2. `M = 2000 / 400 = 5` satırı, aynı arıza akımının A'nın ayarının kaç katı olduğunu bulur.\n3. `5^0,02 = 1,0327` satırı, A için `M^α` terimini hesaplar.\n4. \"TMS = 1 iken süre\" satırı, eğrinin çarpansız (TMS = 1) halinde A'nın ne kadar sürede açacağını bulur.\n5. \"Gereken TMS\" satırı, istenen süreyi çarpansız süreye bölerek TMS'yi bulur; çünkü süre TMS ile doğru orantılıdır.\n\n```\nGereken süre: t_A = 0,297 + 0,300 = 0,597 s\nM = 2000 / 400 = 5\n5^0,02 = 1,0327\nTMS = 1 iken süre = 0,14 / 0,0327 = 4,280 s\nGereken TMS = 0,597 / 4,280 = 0,1395\n```\n\n**Seçim:** `TMS = 0,14`. Hesaplanan 0,1395 bir üst ayar adımına yuvarlanır, çünkü aşağı yuvarlamak aralığı CTI'nın altına düşürür. Röle A 0,599 s'de açar; aralık 0,302 s. Koşul sağlandı.\n\n### Kontrol edilmesi gerekenler\n\n1. Koordinasyon **en büyük** arıza akımında yapılır, çünkü ters zamanlı eğriler orada birbirine en yakındır. Aynı tip eğride, büyük akımda tutan aralık küçük akımda da tutar.\n2. A'nın akım ayarı, B'ninkinden büyük olmalı (400 > 200). Yoksa küçük akımlarda eğriler kesişir.\n3. A, B'nin bölge sonundaki **en küçük** arızayı da görebilmeli (yedek koruma duyarlılığı).\n4. A'nın ayarı en büyük yük akımının üstünde kalmalı.\n\n## Mesafe koruması\n\nİletimde aşırı akım yetmez. Üç neden vardır:\n\n- Şebeke gözlüdür (birçok döngü içerir).\n- Akım iki yönden gelir.\n- Arıza akımı üretim durumuna göre değişir.\n\nMesafe rölesi gerilimi akıma böler ve **empedans** ölçer: `Z = V / I`. Hattın empedansı uzunluğuyla orantılı olduğundan ölçülen empedans arızaya uzaklığı verir ve kaynak gücünden büyük ölçüde bağımsızdır.\n\n| Bölge | Erişim | Gecikme | Amaç |\n| --- | --- | --- | --- |\n| 1 | Hattın %80–85'i | Gecikmesiz | Asıl koruma |\n| 2 | Hattın tamamı + komşu en kısa hattın %20–50'si | 0,3–0,5 s | Hattın kalan kısmı ve karşı bara |\n| 3 | Komşu hattın tamamını kapsayacak kadar | 0,8–1,5 s | Uzak yedek |\n\n**Neden %80:** ölçü trafosu hataları, hat empedans verisindeki belirsizlik ve röle hatası toplamda %10–15'e varır. %100 ayarlansa röle, komşu hattın başındaki arızayı kendi hattında sanıp gecikmesiz açabilir (aşırı erişim). Seçicilik bozulur.\n\nKalan %15–20'deki arıza 2. bölgede gecikmeli temizlenir. Bunu hızlandırmak için iki uç haberleşir (izinli veya bloklamalı şemalar) ya da hat diferansiyel koruması kullanılır.\n\n### Elle örnek 2: ikincil empedans\n\nRöle, ölçü trafolarının ikincil tarafını görür. Yani röleye şebekenin gerçek akımı ve gerilimi değil, küçültülmüş kopyası gelir. Ayar da bu küçültülmüş tarafta yapılır.\n\n**Durum:** 154 kV hat, birincil empedans 40 Ω. Akım trafosu (AT) 1000/1 A, gerilim trafosu (GT) 154.000/100 V.\n\nAşağıdaki satır, birincil empedansı rölenin gördüğü ikincil empedansa çevirir. AT oranı 1000/1 = 1000, GT oranı 154.000/100 = 1540'tır. Empedans gerilim bölü akım olduğu için AT oranı pay, GT oranı paydaya gelir.\n\n```\nZ_ikincil = Z_birincil × (AT oranı / GT oranı) = 40 × (1000 / 1540) = 25,97 Ω\n```\n\nSonraki adım bölge 1 ayarını bulur: ikincil hat empedansı %80 ile çarpılır.\n\n1. bölge ayarı: `0,8 × 25,97 = 20,8 Ω` ikincil.\n\n### Elle örnek 3: ara besleme (infeed)\n\nAra besleme, röle ile arıza arasındaki bir baraya başka bir kaynaktan da akım girmesidir.\n\n**Durum:** Röle A'nın hattı 40 Ω. Karşı baradan sonra komşu hatta, 10 Ω ileride arıza var. Karşı baraya başka bir kaynaktan da A'nınkine eşit akım giriyor.\n\nAşağıdaki blok iki empedansı karşılaştırır:\n\n1. \"Gerçek empedans\" satırı, röleden arızaya kadar olan fiziksel empedansı toplar.\n2. \"Görülen empedans\" satırı, komşu hattaki gerilim düşümünü iki akımın birlikte oluşturduğunu hesaba katar. Röle yalnız kendi akımını (`I_A`) ölçtüğü için komşu hattın 10 Ω'u `(1 + I_diğer / I_A)` katsayısıyla büyümüş görünür. Akımlar eşit olduğundan katsayı 2'dir.\n\n```\nGerçek empedans   = 40 + 10 = 50 Ω\nGörülen empedans  = 40 + (1 + I_diğer / I_A) × 10 = 40 + 2 × 10 = 60 Ω\n```\n\nRöle arızayı olduğundan **uzakta** görür (eksik erişim). 2. ve 3. bölge ayarları bu etki hesaba katılarak yapılır. Ara besleme kaynağı devre dışıysa erişim uzar; iki durum da kontrol edilir.\n\n### Elle örnek 4: yük taşması\n\nYük taşması (load encroachment), arıza olmadığı halde ağır yükün empedansının röle bölgesine girmesidir.\n\n**Durum:** 154 kV hat, 300 MVA yük taşıyor.\n\nAşağıdaki satır, yükün röleye görünen empedansını hesaplar. Gerilimin karesi (kV cinsinden) görünür güce (MVA cinsinden) bölünür; sonuç doğrudan ohm çıkar.\n\n```\nZ_yük = V² / S = 154² / 300 = 79 Ω\n```\n\n3. bölge uzun erişimle ayarlanmışsa (örneğin 80 Ω), ağır yük empedansı bölgenin içine girebilir. Röle arıza olmadığı halde açar, yük komşu hatlara biner, onlar da açar. Büyük sistem çökmelerinde tekrar tekrar görülen mekanizmadır.\n\nÇare:\n\n- Yük taşması engeli (açıya göre kör bölge). Yük empedansının açısı küçük, arıza empedansının açısı büyüktür; engel bu farka bakar.\n- 3. bölge erişiminin sınırlanması.\n\n## Diğer koruma türleri (bir cümle)\n\n| Koruma | Ne yapar |\n| --- | --- |\n| **Diferansiyel** | Giren ve çıkan akımı karşılaştırır. Trafo, bara, generatör, kısa hat. Kesin seçicidir; yedek koruma sağlamaz. |\n| **Yönlü aşırı akım** | Halka ve paralel fiderlerde akımın yönüne bakar. |\n| **Toprak arıza koruması** | Artık akımı (`3 I_0`) ölçer; faz korumasından çok daha duyarlı ayarlanır. `I_0` sıfır dizi akımıdır. |\n| **Düşük frekans yük atma** | Frekans kademeli eşiklerin altına inince yük keser. |\n| **Kesici arıza koruması** | Kesici açmazsa çevredeki kesicileri açtırır. |\n\n## Evirici ağırlıklı şebekede zorluklar\n\nGüneş ve rüzgâr santralleri şebekeye evirici (inverter) üzerinden bağlanır. Fiziksel neden `06/02` dosyasında: evirici arıza akımını anma değerinin yaklaşık 1,0–1,2 katında sınırlar ve açısını kontrol belirler. Senkron generatör ise anma akımının birkaç katı arıza akımı verir; klasik korumalar buna göre tasarlanmıştır.\n\n| Koruma | Sorun |\n| --- | --- |\n| Aşırı akım | Arıza akımı yük akımına yakın; ayar aralığı kalmaz |\n| Mesafe | Akım sınırlı ve kontrollü; ölçülen empedans kayar, erişim hatası |\n| Yön ve faz seçimi | Ters dizi akımı bastırılmışsa yön elemanı yanılır |\n| Salınım engelleme | Evirici dinamiği klasik güç salınımına benzemez |\n| Ada tespiti | RoCoF (Rate of Change of Frequency, frekansın değişim hızı) ve vektör sıçraması röleleri sistem olayında topluca açabilir |\n| Dağıtım | Çift yönlü akış; körleme, yanlış açma, tekrar kapamada eşzamansız kapama |\n\n### Elle kontrol\n\n`06/02`'deki örnekte 50 MVA evirici santrali 225 A arıza akımı veriyordu; anma akımı 187 A. Aşırı akım ayarı yükün 1,25 katına (234 A) konursa röle **kendi arızasını göremez**.\n\nAdım adım:\n\n1. Anma akımı 187 A'dır; bu santralin normal en büyük akımıdır.\n2. Ayar, yükün 1,25 katına konur: 187 × 1,25 ≈ 234 A. Bu, normal yükte açmamak için konan eşiktir.\n3. Arıza akımı 225 A'dır; bu, 234 A'lık eşiğin altında kalır. Röle eşiği hiç aşılmadığı için arızayı görmez.\n\n### Çözüm yönleri\n\n- Haberleşmeli ve diferansiyel koruma (akım büyüklüğüne değil farkına bakar).\n- Gerilim tabanlı ve yürüyen dalga korumaları.\n- Uyarlamalı ayar grupları.\n- Şebeke kodunda arıza sırasında reaktif ve ters dizi akım zorunluluğu.\n- Senkron kompanzatör.\n- Şebeke kuran evirici.\n\nKoruma çalışmasının fazör modeli yerine elektromanyetik geçici hal modeliyle (EMT) ve gerçek röleyle döngüde sınanması gerekir. Fazör modeli yalnız temel frekansı izler; eviricinin hızlı kontrol davranışını göstermez.\n\n**SIPS ile ayrım:** yukarıdakiler **ekipman** korumasıdır. SIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması), ekipman koruması doğru çalıştıktan sonra **sistemin** bütünlüğünü korur.\n\n## Yaygın yanlış\n\n| Yanlış inanç | Doğrusu |\n| --- | --- |\n| **\"Koruma arızayı önler.\"** | Önlemez; arızalı kısmı ayırır. |\n| **\"Kaynağa yakın röle hızlı açmalı, akım orada büyük.\"** | Zaman kademeli şemada en yavaş odur. Ters eğri ve ani eleman bunu hafifletir. |\n| **\"1. bölgeyi %100 ayarlarsam hattın tamamını korurum.\"** | Aşırı erişir, komşu hattın arızasında açar. |\n| **\"CTI küçüldükçe iyidir.\"** | Kesici süresinden ve hatalardan küçük olursa iki röle birlikte açar. |\n| **\"Koordinasyon bir kez yapılır.\"** | Yeni santral, yeni hat veya topoloji değişimi kısa devre akımlarını değiştirir; ayarlar yeniden doğrulanır. |\n| **\"Mesafe rölesi kaynak gücünden bağımsızdır.\"** | Ara besleme, arıza direnci ve evirici davranışı ölçümü kaydırır. |\n\n## Panel takip sorusu\n\n**Soru 1:** \"Koordinasyonu yazılımla nasıl denetlersin?\"\n\n> **Mülakatta şöyle söyle:** Her arıza yeri ve türü için kısa devre hesabından röle akımlarını alır, her asıl–yedek çifti için açma sürelerini hesaplar, CTI'dan küçük olan çiftleri ve hiç açmayan durumları listelerim. Bunu en büyük ve en küçük üretim senaryosunda ve N-1 topolojilerinde tekrarlarım. Aslında bir kısıt denetimidir; ayarın kendisini bulmak ise optimizasyon problemidir.\n\nN-1, herhangi bir elemanın devre dışı kaldığı durumdur.\n\n**Soru 2:** \"Arıza direnci mesafe rölesini nasıl etkiler?\"\n\n> **Mülakatta şöyle söyle:** Ark ve toprak direnci ölçülen empedansa direnç bileşeni ekler; nokta, karakteristiğin dışına kayabilir. Dörtgen karakteristik direnç yönünde daha geniş erişim sağlar.\n\nDörtgen (quadrilateral) karakteristik, röle düzleminde dikdörtgene benzer açma bölgesidir; daire biçimli karakteristiğe göre direnç eksenine daha fazla uzanır.\n\n## 90 saniye\n\n\"Koruma seçici, hızlı, duyarlı ve güvenilir olmalıdır. Radyal fiderde ters zamanlı aşırı akım röleleri kullanırım: akım ayarı ve zaman çarpanı olmak üzere iki ayarı vardır. Yedek röle, asıl röleden koordinasyon aralığı kadar, tipik olarak sıfır virgül üç saniye geç açar; bu aralık kesici süresini ve hataları kapsar ve en büyük arıza akımında denetlenir. İletimde mesafe rölesi empedans ölçer: birinci bölge hattın yüzde seksenini gecikmesiz, ikinci bölge tamamını ve komşunun başını gecikmeli, üçüncü bölge uzak yedeği korur. Evirici arıza akımını sınırladığı için aşırı akım ve mesafe koruması zorlanır; diferansiyel ve haberleşmeli korumaya kayılır.\"\n"}, {"id": "11-Ekonomik-Isletme/00-Alt-Basliklar.md", "group": "11  Ekonomik işletme", "title": "11 — Ekonomik işletme", "body": "# 11 — Ekonomik işletme\n\nBu bölüm, santrallerin yükü en düşük maliyetle ve güvenli biçimde nasıl paylaştığını anlatır. Aşağıdaki her madde bir alt başlıktır. Yanındaki cümle, o başlıkta ne öğreneceğini söyler.\n\n1. **Ekonomik işletmenin üç terimi: maliyet, kayıp, güvenlik** — Bu başlıkta işletme kararlarının neden aynı anda bu üç hedefi tartmak zorunda olduğunu öğreneceksin.\n2. **Maliyet eğrisi ve artan maliyet** — Bu başlıkta bir santralin yakıt maliyetinin üretimle nasıl değiştiğini ve \"bir MW daha\" üretmenin maliyetinin (artan maliyet) nasıl hesaplandığını öğreneceksin.\n3. **Kayıpsız ekonomik dağıtım, eşit λ** — Bu başlıkta iletim kaybı yokken yükün, bütün ünitelerin artan maliyeti aynı λ (lambda) değerinde eşitlenerek nasıl paylaştırıldığını öğreneceksin.\n4. **Kayıplı dağıtım, ceza faktörü** — Bu başlıkta yükten uzak santralin hat kaybı yüzünden neden daha pahalı sayıldığını ve bunun ceza faktörüyle nasıl hesaba katıldığını öğreneceksin.\n5. **Ünite tahsisi: ikili değişken, min süre, rampa, yedek** — Bu başlıkta hangi ünitenin hangi saatte açık veya kapalı olacağına (açık/kapalı ikili kararla) nasıl karar verildiğini ve en az çalışma süresi, rampa ve yedek kısıtlarını öğreneceksin.\n6. **Optimal güç akışı: amaç ve kısıtlar** — Bu başlıkta OPF'nin (Optimal Power Flow, optimal güç akışı) ekonomik dağıtıma şebekenin gerilim, hat ve üretim sınırlarını nasıl eklediğini öğreneceksin.\n7. **Güvenlik kısıtlı OPF** — Bu başlıkta planın N-1 (tek bir elemanın arızası) sonrasında da sınırları aşmamasını sağlayan SCOPF (Security-Constrained OPF, güvenlik kısıtlı optimal güç akışı) yaklaşımını öğreneceksin.\n8. **Reaktif OPF ve kayıp minimizasyonu** — Bu başlıkta aktif üretim sabitken kademe, şönt ve generatör reaktif gücüyle kaybı ve gerilim sapmasını nasıl azalttığını öğreneceksin.\n9. **Rezerv türleri ve maliyeti** — Bu başlıkta primer, sekonder ve tersiyer yedeğin ne işe yaradığını ve boşta tutulan kapasitenin neden bedava olmadığını öğreneceksin.\n10. **Türkiye piyasası: gün öncesi, gün içi, dengeleme, YEKDEM** — Bu başlıkta Türkiye'de elektriğin gün öncesinden gerçek zamana kadar hangi piyasalarda, hangi kurum tarafından fiyatlandığını ve YEKDEM'in (Yenilenebilir Enerji Kaynakları Destekleme Mekanizması) yerini öğreneceksin.\n11. **Kısıt ve yeniden dağıtım** — Bu başlıkta piyasa sonucu şebekeye sığmadığında sistem işletmecisinin üretimi bölgeler arasında nasıl yeniden dağıttığını ve bunun maliyetini öğreneceksin.\n12. **Hidro, termik, yenilenebilir birlikte** — Bu başlıkta suyun yarınki değerinin, termik maliyetin ve sıfır marjinal maliyetli yenilenebilirin aynı planda nasıl birlikte ele alındığını öğreneceksin.\n13. **Belirsizlik altında işletme: senaryo ve yedek** — Bu başlıkta yük ve yenilenebilir tahmini saptığında planın senaryolar ve yedek paylarıyla nasıl sağlam tutulduğunu öğreneceksin.\n14. **Optimizasyon sonucunun uygulanabilirliği** — Bu başlıkta \"kâğıtta ucuz\" bir planın sahada uygulanabilir olup olmadığını sınamak için hangi soruları soracağını öğreneceksin.\n"}, {"id": "11-Ekonomik-Isletme/01-ED-UC-OPF-Piyasa.md", "group": "11  Ekonomik işletme", "title": "Ekonomik işletme", "body": "# Ekonomik işletme\n\nBu sayfa, ekonomik işletmenin dört ana problemini sırayla anlatır:\n\n| Kısaltma | Açılımı | Türkçesi | Sorduğu soru |\n| --- | --- | --- | --- |\n| ED | Economic Dispatch | Ekonomik dağıtım | Devredeki üniteler yükü nasıl paylaşsın? |\n| UC | Unit Commitment | Ünite tahsisi | Hangi ünite, hangi saatte devrede olsun? |\n| OPF | Optimal Power Flow | Optimal güç akışı | Şebeke sınırlarıyla birlikte üretim ne olsun? |\n| SCOPF | Security-Constrained Optimal Power Flow | Güvenlik kısıtlı optimal güç akışı | N-1 arızalarından sonra da sınırlar korunsun mu? |\n\nSonra rezervi, Türkiye piyasasını ve bir optimizasyon sonucunun sahada uygulanabilir olup olmadığını nasıl sınayacağını anlatır.\n\n## Eşit artan maliyet\n\nTermik ünitenin yakıt maliyeti çoğunlukla ikinci dereceden (karesel) bir fonksiyonla yaklaştırılır.\n\nAşağıdaki blok iki şey yazar: birinci satır ünitenin saatlik maliyetini, ikinci satır bu maliyetin türevini, yani artan maliyeti verir.\n\n```\nC_i(P_i) = a_i + b_i P_i + c_i P_i²\ndC_i/dP_i = b_i + 2 c_i P_i\n```\n\nTerimler:\n\n- `C_i`: i. ünitenin maliyeti.\n- `P_i`: i. ünitenin ürettiği aktif güç (MW).\n- `a_i`: sabit terim; ünite çalıştığı sürece üretimden bağımsız ödenen maliyet.\n- `b_i`, `c_i`: maliyetin üretimle doğrusal ve karesel artışını belirleyen katsayılar.\n- `dC_i/dP_i`: artan maliyet; bir MW daha üretmenin maliyeti.\n\nKayıpsız ve limitsiz bir sistemde optimum, her ünitenin artan maliyetinin eşitlenmesidir. Bu ortak değere λ (lambda) denir. λ, sistemin bir MW daha istemesinin fiyatıdır.\n\n> **Sade anlatım:** İki ünitenin \"bir MW daha\" maliyeti farklıysa, pahalıdan alıp ucuza vermek toplam faturayı düşürür. Bu alışveriş, iki maliyet eşitlenince biter. Eşitlendikleri değer λ'dır.\n\nAşağıdaki blok optimum koşulunu yazar: birinci satır \"her ünitenin artan maliyeti λ'ya eşit\", ikinci satır \"toplam üretim yüke eşit\" der.\n\n```\nb_i + 2 c_i P_i = λ\nΣ P_i = P_yük\n```\n\nPmin ve Pmax (ünitenin alt ve üst üretim sınırı) varsa problem eşitsizlik içerir. Limitine dayanmış ünitenin λ'sı, serbest ünitelerin λ'sına eşit olmak zorunda değildir.\n\nLagrange çarpanı limitte eşitsizlik olarak kalır. Bu koşullara KKT (Karush-Kuhn-Tucker) koşulları denir. Bunu `13` klasöründeki dille aynı söyle.\n\n### Kayıp varsa: ceza faktörü\n\nKayıp varsa her ünitenin artan maliyeti bir ceza faktörüyle çarpılır.\n\nAşağıdaki blokta birinci satır ceza faktörünün tanımıdır, ikinci satır kayıplı durumdaki optimum koşuludur.\n\n```\nL_i = 1 / (1 - ∂P_kayıp/∂P_i)\n(dC_i/dP_i) * L_i = λ\n```\n\n- `L_i`: i. ünitenin ceza faktörü.\n- `∂P_kayıp/∂P_i`: i. ünite 1 MW artınca toplam kaybın ne kadar arttığı (artan kayıp).\n\nYükün uzağındaki üretim kaybı artırıyorsa L_i > 1 olur. O üretim, gerçekte olduğundan daha pahalıymış gibi değerlendirilir.\n\nBu, \"reaktif ve aktif yerinde kalsın\" (güç tüketildiği yere yakın üretilsin) ilkesinin ekonomik halidir.\n\n## Ünite tahsisi\n\nEkonomik dağıtım, zaten devrede olan üniteler arasında yükü paylaşır. Ünite tahsisi ise kimin devrede olacağına karar verir. Karar ikilidir: açık veya kapalı.\n\nÜnite tahsisinin kısıtları:\n\n- Güç dengesi ve yedek\n- Pmin, Pmax, rampa (ünitenin çıkışını dakikada en fazla ne kadar değiştirebileceği)\n- En az açık kalma, en az kapalı kalma süresi\n- İlk yol alma maliyeti ve ısınma\n- Hidro için suyun günlük enerji bütçesi, rezervuar\n- Emisyon veya yakıt kotası, varsa\n\nProblemin boyutları:\n\n| Özellik | Değer |\n| --- | --- |\n| Ufuk | 24 veya 36 saat |\n| Zaman adımı | 15 veya 60 dakika |\n| Model türü | MILP (Mixed-Integer Linear Programming, karışık tam sayılı doğrusal programlama) |\n| Çözüm yöntemi | Lagrange gevşetmesi veya modern MILP çözücüleri (dal-kesme, branch-and-cut) |\n\nİkili değişken çoktur; bu yüzden özel çözüm yöntemleri gerekir. Sonuç, gün öncesi planın iskeletidir.\n\nRampa ihmal edilirse plan kâğıtta ucuz, sahada uygulanamaz olur.\n\n### Yenilenebilir ünite tahsisine nasıl girer\n\nYenilenebilir \"negatif yük\" gibi yükten düşülürse problem sadeleşir. Ama tahmin sapması yedeğe kalır.\n\nDaha doğru kurulum, yenilenebiliri senaryolu veya ihtiyat paylı yazmaktır.\n\nKısıntı (curtailment, yenilenebilir üretimin bilerek azaltılması) bir karar değişkenidir. Sıfır kısıntı her zaman en ekonomik veya en güvenli çözüm değildir.\n\n## OPF\n\nEkonomik dağıtım şebekeyi tek bir bara (tek düğüm) sanır. OPF (optimal güç akışı) ise yük akışı denklemlerini ve şebeke limitlerini problemin içine alır.\n\nAşağıdaki blok OPF'nin genel yazımıdır: ilk satır amaç fonksiyonu, \"kısıt:\" altındaki satırlar uyulması gereken koşullardır.\n\n```\nmin  Σ C_i(P_i)     veya kayıp, veya kısıntı\nkısıt:\n  güç dengesi (AC veya DC)\n  Pmin ≤ P ≤ Pmax\n  Qmin ≤ Q ≤ Qmax\n  Vmin ≤ V ≤ Vmax\n  |S_hat| ≤ Smax\n  kademe ve şönt, ayrık veya sürekli gevşetilmiş\n```\n\nSatırların anlamı:\n\n- Amaç: toplam maliyet, veya kayıp, veya kısıntı en aza indirilir.\n- Güç dengesi: AC (tam alternatif akım) veya DC (doğru akım yaklaşımı) yük akışı denklemleri.\n- `P`, `Q`: aktif ve reaktif üretim sınırları.\n- `V`: bara gerilim sınırları.\n- `|S_hat|`: hattan geçen görünür güç; hattın taşıma sınırı `Smax`'ı aşmamalı.\n- Kademe ve şönt: transformatör kademesi ve şönt kompanzasyon; gerçekte ayrık (basamaklı) değerlerdir, ya öyle ya da sürekli değişkene gevşetilerek modellenir.\n\nAC-OPF ile DC-OPF farkı:\n\n| Özellik | AC-OPF | DC-OPF |\n| --- | --- | --- |\n| Matematik | Lineer değil, dışbükey değil | Lineer veya karesel |\n| Çözüm | Yerel minimumu vardır | Hızlıdır, piyasa motorlarında kullanılır |\n| Gördükleri | Gerilim ve kayıp dahil | Gerilimi ve kaybı görmez |\n\nİşletme yazılımı çoğu zaman şöyle çalışır:\n\n1. DC-OPF ile fiyat ve MW üretir.\n2. AC ile fizibiliteyi (fiziksel olarak uygulanabilirliği) kontrol eder.\n3. İhlal varsa kısıt ekleyip tekrar çözer.\n\n### Güvenlik kısıtlı OPF\n\nGüvenlik kısıtlı OPF (SCOPF), baz duruma ek olarak seçilmiş N-1 kısıtlarını taşır. N-1, tek bir elemanın (hat, transformatör, ünite) devre dışı kaldığı durumdur.\n\n| Tür | Ne yapar | Maliyet ve zorluk |\n| --- | --- | --- |\n| Önleyici SCOPF | Tek bir üretim planını tüm arızalara dayanıklı kılar | Daha pahalı |\n| Düzelticili SCOPF | Arıza sonrası ikinci bir kontrol hareketine izin verir | Daha ucuz, modellemesi daha zor |\n\n### Reaktif OPF\n\nReaktif OPF ayrı koşulabilir:\n\n- Amaç: kayıp veya gerilim sapması.\n- Karar değişkenleri: kademe, şönt, generatör Q (reaktif güç).\n\nAktif üretim piyasa tarafından kilitliyse geriye gerilim planlaması kalır. YTBS (Yük Tevzi Bilgi Sistemi) eğitim duyurusundaki \"gerilim planlaması\" bu ailedendir.\n\n## Rezerv ve piyasa\n\nRezerv, henüz gerçekleşmemiş bir arıza için boşta tutulan kapasitedir.\n\nBedavadır sanılır, değildir. Ucuz üniteyi tam yüklemeyip pahalı üniteyi boşta tutmak günlük bir maliyettir.\n\n| Rezerv | Görevi |\n| --- | --- |\n| Primer | Frekans sapmasına saniyeler içinde tepki; sözleşmeli |\n| Sekonder | AGC (Automatic Generation Control, otomatik üretim kontrolü) |\n| Tersiyer | 15 dakikalık dengeleme talimatı |\n\n### Türkiye piyasası\n\n| Mekanizma | Ne yapar | Kim işletir |\n| --- | --- | --- |\n| Gün öncesi piyasa | Bir sonraki günün saatlik enerji fiyatını kurar | EPİAŞ (Enerji Piyasaları İşletme A.Ş.) |\n| Gün içi piyasa | Teslimata yakın düzeltme | EPİAŞ |\n| Dengeleme Güç Piyasası ve sistem işletme talimatı | Gerçek zamanlı denge | TEİAŞ (Türkiye Elektrik İletim A.Ş.) / MYTM (Milli Yük Tevzi Merkezi) |\n| YEKDEM (Yenilenebilir Enerji Kaynakları Destekleme Mekanizması) | Yenilenebilir destek mekanizması | — |\n\nYEKDEM, üretim tahminini ve kısıntı tartışmasını etkiler. Ama bir yük akışı denklemi değildir.\n\nPiyasa fiyatı ile fizik kısıtı çelişirse fizik kazanır. Aradaki fark, yeniden dağıtım maliyeti olarak ortaya çıkar.\n\n### Kısıt yönetimi\n\nGün öncesi sonuç şebekeye sığmıyorsa TEİAŞ bir bölgede yük aldırır, başka bir bölgede yük attırır.\n\n- İki talimatın fiyat farkı, kısıtın maliyetidir.\n- Analiz yazılımı, bu talimatın limitleri çözdüğünü ve yeni bir N-1 sorunu doğurmadığını göstermelidir.\n\n### Hidro farklıdır\n\nHidro, termikten farklıdır: bugünkü suyun yarınki değeri vardır.\n\n- Sadece bu saatin λ'sına bakmak barajı boşaltır.\n- Zincirleme santral (aynı nehir üzerinde arka arkaya santraller) su gecikmesini de modele koyar.\n- Pompalı depolama hem yük hem üretimdir.\n\n## Uygulanabilirlik\n\nBir optimizasyon \"%2 daha ucuz\" dediğinde şunları sor:\n\n- AC yük akışı çözüyor mu, yoksa DC mi?\n- N-1 dahil mi?\n- Rampa ve kişilerin sahada uygulayacağı adım var mı?\n- Tam sayı karar (kademe, kesici, ünite) gevşetilip unutulmuş mu?\n- Tahmin saparsa plan devriliyor mu?\n\nYTBS'nin \"en düşük maliyet ve en yüksek güvenilirlik\" cümlesi tam olarak bu çok amaçlı yapıdır.\n\nTek amaçlı en ucuz plan, güvenilirliği satmış olabilir. Güvenilirliği ağırlık veya kısıt olarak yazmak bir mühendislik tercihidir; tercihi gizlemek olmaz.\n\n`ornekler/ekonomik_dagitim.py` iki üniteli eşit λ çözümünü analitik ve çözücüyle yan yana koyar.\n\n## 90 saniye\n\n“Ekonomik dağıtım, artan maliyetleri eşitleyerek devredeki üniteleri paylaşır; kayıp varsa ceza faktörü biner. Ünite tahsisi kimin açık olacağıdır, MILP’dir, rampa ve en az açık süre vardır. OPF buna şebeke limitini ekler. SCOPF bir de N-1 ekler. Türkiye’de enerji fiyatı EPİAŞ’ta, dengeleme ve kısıt talimatı TEİAŞ’ta oluşur. Fizik sığmıyorsa yeniden dağıtım yapılır ve yeni durum tekrar taranır.”\n"}, {"id": "11-Ekonomik-Isletme/02-Lambda-Iterasyonu-Elle.md", "group": "11  Ekonomik işletme", "title": "Lambda iterasyonu, elle", "body": "# Lambda iterasyonu, elle\n\nBu sayfa ekonomik dağıtımı (ED, Economic Dispatch) anlatır: eşit artımsal maliyet ilkesi ve lambda iterasyonu, elle çözülmüş örneklerle.\n\n## Problem\n\nDevrede olan santraller arasında toplam yükü, toplam yakıt maliyeti en az olacak şekilde paylaştır.\n\nAşağıdaki blok problemin matematiksel yazımıdır: birinci satır amaç (toplam maliyeti küçült), ikinci satır güç dengesi, üçüncü satır her ünitenin üretim sınırıdır.\n\n```\nen küçük   Σ C_i(P_i)\nöyle ki    Σ P_i = P_yük (+ kayıp)\n           P_i,min ≤ P_i ≤ P_i,max\n```\n\nHangi santralin devrede olacağı ayrı bir problemdir: ünite tahsisi (UC, Unit Commitment). Ekonomik dağıtım, devredekilerin **ne kadar** üreteceğini bulur.\n\n### Maliyet eğrisi ve artımsal maliyet\n\nMaliyet eğrisi çoğunlukla ikinci derecedendir: `C(P) = a P² + b P + c`.\n\nBu yazımda harfler şöyledir:\n\n- `a`: karesel katsayı; eğrinin ne kadar dik büküldüğünü belirler.\n- `b`: doğrusal katsayı.\n- `c`: sabit maliyet.\n\nNot: `01-ED-UC-OPF-Piyasa.md` aynı eğriyi `a_i + b_i P_i + c_i P_i²` diye yazar; orada `a` sabit, `c` karesel katsayıdır. Bu sayfada harflerin görevi terstir.\n\nMaliyetin türevi **artımsal maliyettir** (IC, Incremental Cost): bir sonraki megavat-saatin maliyeti.\n\nAşağıdaki blok artımsal maliyeti yazar; birimi TL/MWh'tir.\n\n```\nIC(P) = dC/dP = 2a P + b          (TL/MWh)\n```\n\n## Eşit artımsal maliyet ilkesi\n\nEn ucuz noktada, sınırına dayanmamış bütün üniteler **aynı artımsal maliyette** çalışır. Bu ortak değere `λ` (lambda) denir.\n\n> **Sade anlatım:** İki ünitenin artımsal maliyeti farklıysa, pahalı olandan 1 MW alıp ucuz olana verirsin ve toplam maliyet düşer. Bunu, fark kalmayana kadar sürdürürsün. Fark kalmadığında bütün serbest üniteler aynı λ'dadır.\n\n###
