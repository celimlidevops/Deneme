mi duruma göre yapılır. TRV, şüpheli barada EMT (elektromanyetik geçici hal) benzetimiyle bakılır |\n| Trafo | Sürekli ve acil yüklenme, kademe çalışma aralığı, kısa devre dayanımı, kayıp (boşta ve yükte), paralel çalışma koşulları (gerilim, sargı grubu, empedans) | — |\n| Hat iletkeni | Termik sınır, sehim ve yaklaşım, mevsimsel kapasite | Dinamik hat kapasitesi, hava ölçümüyle statik limiti gevşetir. Koruma ve gerilim limiti ayrıca durur |\n| Ölçü trafosu | Doyma, koruma sınıfı mı ölçü sınıfı mı, polarite | Durum kestirimindeki ölçek hatası ve diferansiyel korumadaki doyma buradan gelir |\n| Reaktör, kapasitör, parafudr | Sürekli gerilim, geçici aşırı gerilim, enerji emme | — |\n| Röle | Görme (arızayı algılama), zaman, haberleşme kaybında yedek | Performans, koordinasyon eğrisi ve olay kaydıyla değerlendirilir |\n\nTerimler:\n\n- **X/R oranı:** Reaktansın dirence oranı. Büyükse arıza akımındaki DC bileşen yavaş söner ve kesiciyi daha çok zorlar.\n- **TRV (geçici toparlanma gerilimi):** Kesici akımı kestikten hemen sonra kontakları arasında beliren gerilim. Kesici buna dayanamazsa ark yeniden tutuşur.\n- **Doyma:** Ölçü trafosunun çekirdeği büyük akımda dolar ve çıkışı gerçek akımı izlemez.\n\n## Değerlendirmenin sırası\n\n1. Şebeke çalışmasından zorlayan büyüklüğü al: azami akım, azami ve asgari gerilim, arıza süresi, frekans ucu.\n2. Ekipmanın etiket ve tip deney değerini aynı birime çevir.\n3. Marjın hangi senaryoda eridiğini yaz. Tek bir \"uygundur\" tüm topolojileri kapsamaz. Bakım topolojisi ve N-1 (tek eleman devre dışı) ayrı bakılır.\n4. Yetmezse seçenekler şunlardır: ekipman değişimi, şebeke güçlendirme, işletme kısıtı, koruma süresini kısaltma. Süre kısalınca topraklamadaki dokunma gerilimi de rahatlar. Yani iki iş birbirine bağlıdır.\n\nTip deneyi laboratuvarın işidir. Araştırmacının işi, sahadaki zorlamanın o deneyin kapsadığı aralıkta olup olmadığını hesabıyla göstermektir.\n\n> **Mülakatta şöyle söyle:** \"Deney kapsamıyorsa 'deney var, sorun yok' denmez.\"\n\nAşağıdaki metin, ekipman yeterliliği sorulduğunda 90 saniyede söyleyeceğin özettir.\n\n## 90 saniye\n\n\"Ekipman yeterliliği, analiz sonucunu etiket değeriyle karşılaştırmaktır. Kesicide azami kısa devre ve tepe, trafoda yüklenme ve kısa devre dayanımı, hatta sehimli termik sınır, ölçü trafosunda doyma. Karşılaştırma azami, asgari ve bakım topolojisinde ayrı yapılır. Yetmeyen yerde ekipman, şebeke veya koruma süresi birlikte düşünülür.\"\n"}, {"id": "03-Iletim-Sebekeleri/03-PTDF-LODF-NTC-ATC-ve-Kisit.md", "group": "03  İletim", "title": "PTDF, LODF, NTC/ATC ve kısıt", "body": "# PTDF, LODF, NTC/ATC ve kısıt\n\nBu sayfa, iletim güvenlik analizinde kullanılan iki duyarlılık katsayısını (PTDF ve LODF), sınır ötesi kapasite kavramlarını (TTC, TRM, NTC, AAC, ATC) ve Türkiye'de iletim kısıtının nasıl oluşup yönetildiğini anlatır.\n\n## Neden bu iki katsayı\n\nGüvenlik analizi \"şu hat açılırsa ne olur\" sorusunu binlerce kez sorar. Her biri için yük akışını baştan çözmek pahalıdır.\n\nDC yaklaşımında şebeke doğrusaldır. DC yaklaşımı; gerilimleri 1 pu, hat direncini sıfır ve açı farklarını küçük kabul edip yalnız aktif gücü hesaplayan sade modeldir. Doğrusal sistemde her sorunun cevabı önceden hesaplanmış bir katsayıdır.\n\n> **Sade anlatım:** Yazılımcı gözüyle bu, pahalı bir işlevin sonucunu önceden hesaplayıp tabloya koymaktır.\n\n- **PTDF** (güç transfer dağıtım katsayısı): Bir baraya 1 MW enjekte edip referans baradan çekersem, bu 1 MW'ın ne kadarı hangi hattan geçer?\n- **LODF** (hat açma dağıtım katsayısı): Bir hat açılırsa, üzerindeki akışın ne kadarı diğer hatlara biner?\n\nAşağıdaki üç satır, katsayıların formülüdür. İlki PTDF'yi reaktans matrisinden, ikincisi LODF'yi PTDF'den hesaplar. Üçüncüsü, hat açılınca yeni akışı eski akışlardan bulur.\n\n```\nPTDF_(ij),k = (X_ik − X_jk) / x_ij           X = B⁻¹ (referans bara satır ve sütunu sıfır)\nLODF_(l),k  = PTDF_l(k hattının uçları arası transfer) / (1 − PTDF_k(aynı transfer))\nYeni akış_l = Eski akış_l + LODF_(l),k × Eski akış_k\n```\n\nSemboller:\n\n| Sembol | Anlamı |\n| --- | --- |\n| `i`, `j` | Hattın iki ucundaki baralar |\n| `k` | Enjeksiyonun yapıldığı bara (PTDF'de) veya açılan hat (LODF'de) |\n| `l` | Etkisine bakılan hat |\n| `x_ij` | i–j hattının reaktansı |\n| `B` | Bara süseptans matrisi |\n| `X` | `B`'nin tersi |\n\n## Elle örnek\n\n`05` klasöründeki üç baralı şebeke kullanılır:\n\n- Hat reaktansları: `x12 = 0,10`, `x13 = 0,20`, `x23 = 0,25` pu (birim değer).\n- Bara 1 referans.\n- Bara 2 üretim +0,5, bara 3 yük −0,8.\n\n**Adım 1, B matrisi (referans bara çıkarılmış).** Bu adım şebekenin bağlantı ve reaktans bilgisini tek bir matrise koyar. Köşegen, baraya bağlı hatların `1/x` toplamıdır. Köşegen dışı, iki bara arasındaki hattın `−1/x` değeridir.\n\n```\nB = [ 1/0,1 + 1/0,25    −1/0,25        ]  =  [ 14   −4 ]\n    [ −1/0,25           1/0,2 + 1/0,25 ]     [ −4    9 ]\n```\n\n**Adım 2, tersi.** Bu adım, enjeksiyondan bara açısına geçen `X` matrisini bulur. 2×2 matrisin tersi için önce determinant hesaplanır: `14 × 9 − 16 = 110`.\n\n```\nX = (1/110) [ 9   4 ]  =  [ 0,0818  0,0364 ]\n            [ 4  14 ]     [ 0,0364  0,1273 ]\n```\n\n**Adım 3, PTDF.** Bu adım, her baraya yapılan 1 birim enjeksiyonun her hatta ne kadar akış yarattığını formülle hesaplar. Bara 1 referans olduğu için `X_1k = 0`.\n\n| Hat | Bara 2'ye enjeksiyon | Bara 3'e enjeksiyon |\n| --- | --- | --- |\n| 1–2 | `(0 − 0,0818)/0,1 = −0,8182` | `(0 − 0,0364)/0,1 = −0,3636` |\n| 1–3 | `(0 − 0,0364)/0,2 = −0,1818` | `(0 − 0,1273)/0,2 = −0,6364` |\n| 2–3 | `(0,0818 − 0,0364)/0,25 = +0,1818` | `(0,0364 − 0,1273)/0,25 = −0,3636` |\n\nTabloyu okuma: Bara 2'ye enjekte edilen 1 MW'ın %82'si 1–2 hattından doğrudan, %18'i 2–3 ve 3–1 üzerinden dolanarak referansa gider. Güç en kısa yoldan değil, **empedansla ters orantılı olarak bütün yollardan** akar.\n\n**Adım 4, baz akışlar.** Bu adım, gerçek üretim ve yükü PTDF'lerle çarpıp her hattın normal durumdaki akışını bulur. Akış = PTDF × enjeksiyon:\n\n```\nP12 = −0,8182 × 0,5 + (−0,3636) × (−0,8) = −0,1182\nP13 = −0,1818 × 0,5 + (−0,6364) × (−0,8) = +0,4182\nP23 = +0,1818 × 0,5 + (−0,3636) × (−0,8) = +0,3818\n```\n\nKontrol: Bara 3'e giren `0,4182 + 0,3818 = 0,80`. Bara 3'teki yük 0,8 olduğu için hesap tuttu.\n\n**Adım 5, hat 1–3 açılırsa.** Bu adım, LODF ile açılan hattın akışını kalan hatlara dağıtır ve yeni akışları yük akışı çözmeden bulur. Üç baralı halkada tek alternatif yol 1–2–3'tür. Bu yüzden iki LODF de 1,0'dır:\n\n```\nP12 yeni = −0,1182 + 1,0 × 0,4182 = 0,30\nP23 yeni =  0,3818 + 1,0 × 0,4182 = 0,80\n```\n\nSağduyu kontrolü: Yük 0,8; bara 2 0,5 üretiyor. Kalan 0,3 referanstan 1–2 üzerinden gelir ve 0,8'in tamamı 2–3'ten geçer. Tuttu.\n\n**Sonuç.** Hat 2–3'ün limiti 0,6 ise bu arıza %133 aşırı yük demektir. Sistem N-1 güvenli değildir. N-1 güvenli, herhangi bir eleman tek başına düştüğünde hiçbir limitin aşılmaması demektir.\n\n## PTDF nerede kullanılır\n\n- N-1 taraması (LODF ile, yük akışı çözmeden)\n- Kısıt yönetimi: Hangi santrali 1 MW azaltırsam o hat kaç MW rahatlar?\n- Bölgesel fiyatın kısıt bileşeni (`13` klasörü)\n- Sınır ötesi kapasite hesabı (akış tabanlı yöntem)\n\nSınırları:\n\n- Doğrusaldır ve yalnız aktif gücü hesaplar.\n- Gerilimi ve reaktif gücü görmez.\n- Topoloji değişince yeniden hesaplanır.\n\n## NTC ve ATC\n\nBu kavramlar, iki bölge arasında ticarete ne kadar kapasite verilebileceğinin hesabıdır. ENTSO-E (Avrupa iletim sistemi operatörleri ağı) tanımları:\n\n| Kısaltma | Açılımı | Anlam |\n| --- | --- | --- |\n| TTC | Toplam transfer kapasitesi | Güvenlik kriterleri (N-1 dahil) bozulmadan aktarılabilecek en büyük güç |\n| TRM | İletim güvenilirlik payı | Frekans regülasyonu sapmaları, acil yardım ve ölçüm belirsizliği için ayrılır |\n| NTC | Net transfer kapasitesi | NTC = TTC − TRM |\n| AAC | Önceden tahsis edilmiş kapasite | Daha önce kullanıcılara verilmiş kısım |\n| ATC | Kullanılabilir transfer kapasitesi | ATC = NTC − AAC |\n\nElle örnek:\n\n1. TTC 1000 MW, TRM 100 MW ise NTC = 1000 − 100 = 900 MW. Bu adım güvenlik payını düşer.\n2. 600 MW önceden tahsis edildiyse ATC = 900 − 600 = 300 MW. Bu adım, satılmış kısmı düşüp piyasaya kalanı bulur.\n\nTTC'yi çoğunlukla hattın ısıl kapasitesi belirlemez. **N-1 sonrası** bir başka elemanın aşırı yüklenmesi, gerilim veya kararlılık sınırı belirler. Bu yüzden iki 1000 MW'lık hattın TTC'si 2000 MW değildir.\n\n## Türkiye'de iletim yapısı ve kısıt\n\n### Yapı\n\nKaynak: Elektrik Şebeke Yönetmeliği ve TEİAŞ (Türkiye Elektrik İletim A.Ş.) verisi; `01/02` dosyasında kaynaklı.\n\n- 400 kV omurga\n- 154 kV bölgesel iletim\n- Az sayıda 66 kV\n- Avrupa ile Bulgaristan ve Yunanistan üzerinden senkron bağlantı\n\n### Kısıt nerede oluşur\n\nAşağıdaki resim genel mühendislik bilgisidir. Güncel sayıları **doğrulamadım**:\n\n- Tüketim Marmara ve batıda yoğundur. Büyük hidroelektrik ve linyit kapasitesinin önemli kısmı doğu ve güneydoğudadır. Sistemin tarihsel ana akış yönü doğudan batıyadır.\n- Rüzgâr batı kıyısı ve Trakya'da, güneş İç Anadolu ve güneyde yoğunlaşır. Kaynağın iyi olduğu yerde şebeke zayıf, şebekenin güçlü olduğu yerde yük vardır.\n- Güneş santralleri öğlen aynı anda üretir. Bir bölgenin trafo merkezi ve hat kapasitesi, o bölgedeki toplam kurulu güce göre değil **eşzamanlı** üretime göre dolar.\n\n### Doğrulanan kurumsal mekanizma\n\n- 6446 sayılı Kanun'un 23. maddesi gereği TEİAŞ, **bağlanabilir kapasiteyi** bölge bazında yayımlar.\n- TEİAŞ \"İlgili Raporlar\" sayfasında \"Bağlanabilir Bölgesel Üretim Tesisi Kapasite Raporu 2024-2028 / 2029-2033\" yer alır. Kapasite 15 bölge üzerinden verilir.\n- Aynı sayfada \"Kısa Devre Akımları (2025)\" raporu ve talep tahmin raporları bulunur.\n\nBölge bazındaki MW değerlerini ezbere söyleme.\n\n> **Mülakatta şöyle söyle:** \"TEİAŞ'ın bağlanabilir kapasite raporundan bakarım; rapor beş yıllık iki dönem için bölge bazında değer verir.\"\n\n### Kısıt nasıl yönetilir\n\n- Gün öncesi piyasası Türkiye'yi **tek fiyat bölgesi** olarak eşleştirir. Şebeke kısıtını görmez.\n- Kısıt, gerçek zamana yakın dengeleme güç piyasasında TEİAŞ'ın verdiği yük alma ve yük atma talimatlarıyla çözülür.\n- Kısıt nedeniyle verilen talimat ayrı etiketlenir (`11/03` dosyası).\n- Yenilenebilir üretimin kısılması ve yeni kapasite tahsisinin durması da kısıtın sonuçlarıdır.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"Elektrik sözleşmedeki yoldan akar.\"** | Fizik sözleşmeyi bilmez. A'dan B'ye satılan güç, komşu ülkelerin şebekesinden de geçer (döngü akışı). |\n| **\"PTDF topolojiden bağımsızdır.\"** | Bir hat açılınca değişir. LODF bunun için vardır. |\n| **\"PTDF referans baraya bağlıdır, o yüzden güvenilmez.\"** | Tek tek değerler referansa bağlıdır. İki bara arasındaki transferin PTDF farkı bağlı değildir. |\n| **\"NTC hattın MVA değeridir.\"** | Güvenlik kriterinden sonra kalan değerdir. Yöne, mevsime ve topolojiye göre değişir. |\n| **\"Kurulu güç fazlaysa kısıt olmaz.\"** | Kısıt enerji değil yer problemidir. |\n\n## Panel takip sorusu\n\n\"LODF paydası sıfıra giderse ne olur?\"\n\n> **Mülakatta şöyle söyle:** \"Açılan hat, iki bölge arasındaki tek bağlantıdır; açılması sistemi adalara böler. LODF tanımsızdır, vaka ayrıca ele alınır.\"\n\n\"DC katsayılarla bulduğun ihlale güvenir misin?\"\n\n> **Mülakatta şöyle söyle:** \"Tarama için evet, karar için hayır. Sınıra yakın ve gerilim açısından şüpheli vakaları AC yük akışıyla doğrularım.\"\n\nAşağıdaki metin, bu konu sorulduğunda 90 saniyede söyleyeceğin özettir.\n\n## 90 saniye\n\n\"DC yaklaşımında şebeke doğrusaldır, bu yüzden duyarlılıkları önceden hesaplarım. PTDF, bir baraya enjekte edilen bir megavatın hangi hattan ne kadar geçtiğini; LODF, açılan bir hattın akışının diğer hatlara nasıl dağıldığını verir. Bunlarla binlerce arıza durumunu yük akışı çözmeden tararım, kritik olanları AC ile doğrularım. Sınır ötesi kapasitede toplam transfer kapasitesinden güvenilirlik payını düşünce net kapasite, tahsis edilmişi düşünce kullanılabilir kapasite kalır. Türkiye'de piyasa tek bölgedir; kısıt dengeleme piyasasında talimatla çözülür ve bağlanabilir kapasite bölge bazında yayımlanır.\"\n"}, {"id": "04-Dagitim-Sistemleri/00-Alt-Basliklar.md", "group": "04  Dağıtım", "title": "04 — Dağıtım sistemleri", "body": "# 04 — Dağıtım sistemleri\n\nBu bölüm, elektriğin trafo merkezinden evlere ve işyerlerine ulaştığı son kısmı, yani **dağıtım şebekesini** anlatır. Aşağıdaki her madde bir alt başlıktır. Yanındaki cümle, o konuda ne öğreneceğini söyler.\n\nKonular üç sayfaya dağılmıştır:\n\n| Sayfa | Ne anlatır |\n|---|---|\n| [`01-Dagitim-DG-DMS.md`](01-Dagitim-DG-DMS.md) | Dağıtımın iletimden farkı, gerilim düşümü, kayıp, dağıtık üretim (DG), koruma, yazılım sistemleri ve planlama |\n| [`02-VoltVAR-Yeniden-Yapilandirma-Guvenilirlik.md`](02-VoltVAR-Yeniden-Yapilandirma-Guvenilirlik.md) | Gerilim ve reaktif güç optimizasyonu, şebekenin yeniden yapılandırılması, kayıp azaltma, SAIDI (ortalama kesinti süresi) ve SAIFI (ortalama kesinti sıklığı) |\n| [`03-Dagitim-Durum-Kestirimi-AMI-DERMS-EV.md`](03-Dagitim-Durum-Kestirimi-AMI-DERMS-EV.md) | Dağıtımda durum kestirimi, akıllı sayaç altyapısı, dağıtık kaynak yönetimi ve elektrikli araç şarjı |\n\n## Alt başlıklar\n\n1. **Radyal yapı, R/X, dengesizlik, düğüm ölçeği** — Dağıtım şebekesinin neden tek yoldan beslendiğini, direncin reaktansa oranının (R/X) neden yüksek olduğunu, fazların neden eşit yüklenmediğini ve modelin neden çok büyük olduğunu öğreneceksin.\n2. **Türkiye dağıtım gerilimleri** — Dağıtımda kullanılan gerilim seviyelerini ve iletim bağlantısında 154 kV ile 34,5 kV arasındaki seçimi öğreneceksin.\n3. **Fider topolojisi: radyal, açık halka, kapalı halka** — Bir **fiderin** (trafo merkezinden çıkan tek bir dağıtım hattının) hangi şekillerde kurulup nasıl işletildiğini öğreneceksin.\n4. **Yük çeşitliliği ve puant kayması** — Yüz dairenin neden aynı anda en yüksek tüketimi (puant) çekmediğini ve elektrikli aracın bu durumu nasıl değiştirdiğini öğreneceksin.\n5. **Gerilim düşümü ve regülasyon araçları** — Fider boyunca gerilimin neden düştüğünü ve onu ucuzdan pahalıya hangi araçlarla düzelteceğini öğreneceksin.\n6. **Teknik kayıp ve ticari kayıp** — Isınmayla kaybolan enerji ile kaçak ve ölçüm hatası yüzünden kaybolan enerjiyi nasıl ayıracağını öğreneceksin.\n7. **Kapasitör, volt-var, volt-watt** — Gerilimi kapasitörle ve eviricinin reaktif/aktif gücüyle nasıl ayarlayacağını öğreneceksin.\n8. **Dağıtık üretim bağlantı soruları** — Çatı güneşi gibi küçük bir üretim fidere bağlanırken sorulan standart soruları öğreneceksin.\n9. **Ters güç akışı** — Üretim yükü aşınca gücün neden kaynağa doğru geri aktığını ve bunun trafoya ve röleye etkisini öğreneceksin.\n10. **Barındırma kapasitesi** — Bir fidere limitleri bozmadan ne kadar üretim bağlanabileceğini ve bunun neden konuma bağlı olduğunu öğreneceksin.\n11. **Ada çalışması ve otomatik tekrar kapama** — Şebeke gittiğinde eviricinin neden kapanması gerektiğini ve otomatik tekrar kapamayla (OTK) nasıl çakıştığını öğreneceksin.\n12. **Dengesiz üç faz yük akışı** — Dağıtımda neden üç fazı ayrı ayrı (üç faz, dört tel) modellemek gerektiğini öğreneceksin.\n13. **Sigorta, röle, OTK koordinasyonu** — Radyal fiderde koruma cihazlarının hangi sırayla açması gerektiğini öğreneceksin.\n14. **GIS, SCADA, DMS, OMS, AMI** — Dağıtım şirketinin kullandığı coğrafi bilgi sistemi (GIS), merkezi izleme ve kumanda sistemi (SCADA), dağıtım yönetim sistemi (DMS), kesinti yönetim sistemi (OMS) ve gelişmiş sayaç altyapısının (AMI) her birinin ne iş yaptığını öğreneceksin.\n15. **SAIDI ve SAIFI** — Kesinti süresini ve sıklığını ölçen güvenilirlik endekslerini ve elle hesabını öğreneceksin.\n16. **Dağıtım planlama kararları** — Yeni fider, kesit artırımı, yeni trafo gibi planlama kararlarının nasıl verildiğini öğreneceksin.\n17. **Elektrikli araç ve depolama** — Elektrikli araç şarjının trafoyu ne zaman doldurduğunu ve bataryanın fiderde nasıl kullanıldığını öğreneceksin.\n18. **Dağıtım durum kestiriminin zorluğu** — İletimde olgun olan durum kestirimi yönteminin dağıtıma taşınınca neden bozulduğunu öğreneceksin.\n"}, {"id": "04-Dagitim-Sistemleri/01-Dagitim-DG-DMS.md", "group": "04  Dağıtım", "title": "Dağıtım sistemi", "body": "# Dağıtım sistemi\n\nBu sayfa dağıtım şebekesinin iletimden nerede ayrıldığını anlatır. Sonra gerilim düşümünü, kaybı, dağıtık üretimin bağlantı sorularını, korumayı, dağıtım şirketinin yazılım sistemlerini ve planlamayı sırayla açar.\n\n**Dağıtım**, elektriği trafo merkezinden evlere ve işyerlerine daha düşük gerilimle ulaştıran yerel şebekedir. **İletim** ise elektriği santrallerden şehirlere yüksek gerilimle taşıyan ana şebekedir. Bu sayfadaki her şey bu iki şebekenin farkına dayanır.\n\n## Sayfa haritası\n\n1. **İletimden ayrılan yer:** radyal işletme, R/X oranı, dengesizlik ve ölçek.\n2. **Gerilim ve kayıp:** gerilim düşümü formülü, regülasyon araçları, teknik ve ticari kayıp, çeşitlilik.\n3. **Dağıtık üretim:** bağlantı çalışmasının standart soruları ve barındırma kapasitesi.\n4. **Koruma ve otomasyon:** aşırı akım kademelemesi, OTK, FLISR, SAIDI ve SAIFI.\n5. **Sistemler:** GIS, SCADA, DMS, AMI ve kimlik eşleme sorunu.\n6. **Planlama:** dağıtım planlama kararları ve dağıtım durum kestirimi.\n7. **90 saniye:** mülakatta söyleyeceğin kısa metin.\n8. **Kendini yokla:** sorular ve cevaplar.\n\n## 1. İletimden ayrılan yer\n\n### Radyal işletme\n\nDağıtım çoğunlukla **radyal** işletilir. Radyal, ağaç dalları gibi demektir: her yük kaynağa tek bir yoldan bağlıdır.\n\nŞebekede halka varsa bile bir yerde **açık nokta** bırakılır. Yani halkadaki bir anahtar açık tutulur. Bunun iki sebebi vardır:\n\n- arıza bölgesi küçük kalsın,\n- koruma basit kalsın.\n\nSonuçları:\n\n- Tek besleme yolu vardır.\n- Ters akış yokken gerilim kaynaktan uca doğru düşer.\n- **Kısa devre gücü** uçta zayıftır. Kısa devre gücü, bir noktada arıza olduğunda şebekenin oraya basabileceği güçtür; şebekenin o noktadaki \"sağlamlığını\" gösterir.\n\n### R/X oranı yüksek\n\n**R** hattın direnci, **X** reaktansıdır. Reaktans, alternatif akımda bobin etkisinden doğan, enerjiyi harcamayan ama akımı zorlaştıran büyüklüktür. **R/X**, bu ikisinin oranıdır.\n\nDağıtımda R/X iletimden yüksektir. Özellikle AG (alçak gerilim) kabloda R, X'ten büyük olabilir.\n\nO zaman **aktif güç** (gerçekten iş yapan güç, P) de gerilimi değiştirir. İletimde gerilimi daha çok **reaktif güç** (iş yapmayan ama gerilimi ayakta tutan güç, Q) belirler; dağıtımda bu kural zayıflar.\n\nÖrnek: çatı güneşinin öğlen gerilimi yükseltmesi, reaktiften çok aktif güç enjeksiyonudur. Bu yüzden \"Daha fazla kapasitör basalım\" cevabı bu problemi büyütebilir. Kapasitör reaktif güç üretir ve gerilimi daha da yükseltir.\n\n> **Sade anlatım:** İletimde gerilimi reaktif güç oynatır. Dağıtımda direnç büyük olduğu için aktif güç de oynatır. Güneşin yükselttiği gerilimi kapasitörle düzeltmeye çalışmak, ateşe odun atmaktır.\n\n### Fazlar eşit yüklenmez\n\nÜç fazlı şebekede ideal olan, üç fazın eşit yüklenmesidir. Dağıtımda bu olmaz. Sebepler:\n\n- kırsal fider (uzun, az müşterili hat),\n- tek fazlı müşteri,\n- bitişik iki fazda kaynak (iki faz arasına bağlanan tek bir yük, örneğin kaynak makinesi).\n\n**Dengeli yük akışı** üç fazı eşit varsayarak tek faz çözer. Bu varsayım gerilim ihlalini gizler, çünkü en çok yüklü fazın gerilimi ortalamada kaybolur.\n\nDağıtım yazılımı **üç faz, dört tel** düşünebilmelidir: üç faz iletkeni artı nötr. OpenDSS (Open Distribution System Simulator, açık kaynak dağıtım sistemi simülatörü) ve benzeri araçlar bu yüzden iletim paketlerinden ayrı anılır.\n\n### Ölçek\n\nÖlçek de farklıdır:\n\n| | İletim | Dağıtım |\n|---|---|---|\n| Model büyüklüğü | Binlerce bara zor bir modeldir | On binlerce düğüm normaldir |\n| Veri kalitesi | Görece tam | Eksik sayaç ve hatalı GIS normaldir |\n\n**Bara** (veya düğüm), hatların, trafoların ve yüklerin birleştiği bağlantı noktasıdır. **GIS** (Geographic Information System, Coğrafi Bilgi Sistemi), şebekenin harita üzerindeki kaydıdır; Bölüm 5'te tekrar geçiyor.\n\nAlgoritma \"veri tam\" varsayarsa sahada susar.\n\n## 2. Gerilim ve kayıp\n\n### Gerilim düşümü\n\nRadyal fiderde yaklaşık gerilim düşümü şu formülle verilir. **Fider**, trafo merkezinden çıkan tek bir dağıtım hattıdır.\n\nFormülde P aktif güç, Q reaktif güç, R direnç, X reaktans, V gerilimdir:\n\n```\nΔV ≈ (P R + Q X) / V\n```\n\nFormül, Bölüm 1'deki fikri gösterir: R büyükse PR terimi de büyür, yani aktif güç gerilimi belirgin biçimde değiştirir.\n\n### Regülasyon araçları\n\n**Regülasyon**, gerilimi izin verilen bantta tutmaktır. Araçlar ucuzdan pahalıya düşünülür:\n\n1. İletken kesiti ve faz dengeleme\n2. Hat başı gerilim ayarı, OLTC (On-Load Tap Changer, yük altında kademe değiştirici: trafonun sarım oranını enerji kesmeden değiştiren düzenek)\n3. Hat regülatörü (seri regülasyon trafosu)\n4. Şönt kapasitör, sabit veya anahtarlamalı (**şönt**: hatta seri değil, hat ile toprak arasına paralel bağlı)\n5. Dağıtık üretimin reaktif modu (volt-var, volt-watt)\n6. Depolama ve talep kaydırma\n7. Yeni çıkış fideri veya yeni trafo merkezi\n\nBeşinci maddedeki modlar:\n\n- **Volt-var:** evirici, gerilime bakarak reaktif güç üretir veya tüketir.\n- **Volt-watt:** evirici, gerilim çok yükselince aktif gücünü kısar.\n\n**Evirici** (inverter), güneş panelinin doğru akımını şebekenin alternatif akımına çeviren güç elektroniği cihazıdır.\n\n### Teknik kayıp ve ticari kayıp\n\nKayıp iki parçadır:\n\n| Tür | İçeriği | Nasıl bulunur |\n|---|---|---|\n| **Teknik kayıp** | I²R (akımın karesi çarpı direnç; iletkendeki ısınma), trafo bakır ve boşta demir kaybı, korona, bağlantı direnci | Yük akışıyla hesaplanır |\n| **Ticari kayıp** | Kaçak ve ölçüm hatası | Enerji bilançosu ile teknik kayıp arasındaki farktan tahmin edilir; bu bir veri problemidir |\n\nTerimler:\n\n- **Bakır kaybı:** trafo sargılarındaki, yükle artan ısınma kaybı.\n- **Boşta demir kaybı:** trafo enerjili olduğu sürece, yük olmasa da çekirdekte oluşan kayıp.\n- **Korona:** yüksek gerilimde iletken çevresindeki havanın iyonlaşmasıyla oluşan kayıp.\n- **Enerji bilançosu:** fidere giren enerji ile faturalanan enerji arasındaki fark.\n\nİkisi aynı projeyle çözülmez. Teknik kaybı mühendislik düşürür; ticari kaybı veri analizi bulur.\n\n### Çeşitlilik\n\n**Çeşitlilik**, yüklerin aynı anda en yüksek değerini çekmemesidir. Yüz dairenin aynı anda **puant** (en yüksek tüketim) çekmemesi, trafo boyutunu kurtarır.\n\nElektrikli araç ve elektrikli ısıtma çeşitliliği azaltır, çünkü insanlar bunları benzer saatlerde kullanır.\n\nEski **çakışma katsayısıyla** (aynı anda devrede olan yük oranı) yeni yükü boyutlamak, fideri sessizce doldurur.\n\n> **Sade anlatım:** Her ev kendi en yüksek tüketimine çıkabilir, ama hepsi aynı anda çıkmaz; trafo bu yüzden bütün evlerin en yüksek değerlerinin toplamı kadar büyük olmak zorunda kalmaz. Herkes akşam aynı saatte arabasını takınca bu rahatlık biter.\n\n## 3. Dağıtık üretim\n\n**Dağıtık üretim** (DG, Distributed Generation), dağıtım şebekesine bağlanan küçük üretimdir: çatı güneşi, küçük rüzgâr, batarya gibi.\n\n### Bağlantı çalışmasının standart soruları\n\n| Soru | Ne kontrol edilir |\n|---|---|\n| **Ters akış var mı?** | Üst trafo ve röle ters gücü görüyor mu? |\n| **Gerilim yükselmesi limitin içinde mi?** | En kötü durum: minimum yük, maksimum üretim. |\n| **Kademe kontrolü avlanıyor mu?** | Güneş bir bulutla düşünce OLTC peşinden gidiyor mu? |\n| **Kısa devre katkısı artıyor mu?** | Evirici katkısı senkron makine gibi 6–10 kat değildir; çoğunlukla 1,1–1,5 kat nominal akım civarında sınırlanır ve hızla kesilir. Koruma \"eski kısa devre gücü\" ile koordineli kalmayabilir. |\n| **Ada** | Şebeke gidince evirici adayı canlı tutmamalı. |\n| **Güç kalitesi** | Harmonik, DC enjeksiyon, fliker, dengesizlik. Şebeke yönetmeliği ve dağıtım bağlantı kriterleri bu başlıkları sayar. |\n\nTablodaki terimler:\n\n- **Ters akış:** üretim yerel yükten fazla olunca gücün kaynağa, yani trafo merkezine doğru geri akması.\n- **Avlanma:** kademe değiştiricinin gerilim inip çıktıkça sürekli kademe değiştirmesi; cihazı aşındırır.\n- **Senkron makine:** klasik santral jeneratörü. Kısa devrede nominal akımının 6–10 katını basabilir.\n- **Nominal akım:** cihazın etiket akımı.\n- **Ada:** şebekeden kopmuş ama içindeki üretim sayesinde enerjili kalan küçük şebeke parçası.\n- **DC enjeksiyon:** eviricinin şebekeye istemeden doğru akım bileşeni vermesi.\n- **Fliker:** gerilimdeki hızlı dalgalanmanın lambalarda gözle görülen titremesi.\n\n### Ada koruması ile OTK'nın çakışması\n\n**Anti-islanding** (ada önleme), eviricinin şebeke gidince adayı fark edip kapanmasıdır. Yöntemleri: aktif frekans kaydırma, gerilim-frekans penceresi.\n\n- **Aktif frekans kaydırma:** evirici frekansı bilerek hafifçe iter; şebeke varsa bu itme tutmaz, yoksa frekans kayar ve evirici adayı anlar.\n- **Gerilim-frekans penceresi:** gerilim veya frekans belirli bir aralığın dışına çıkınca evirici kapanır.\n\nAnti-islanding ile **otomatik tekrar kapama** (OTK) çakışır. OTK, arızadan sonra kesiciyi kısa bir süre sonra otomatik olarak yeniden kapatan işlevdir.\n\nKapama ölü devreye olmazsa, senkron olmayan iki kaynağı üst üste bindirir. Yani ada hâlâ canlıysa ve frekansı şebekeyle aynı değilse, kesici kapandığı an iki farklı fazdaki gerilim çarpışır.\n\n### Barındırma kapasitesi\n\n**Barındırma kapasitesi**, seçilen limitler bozulmadan fidere bağlanabilecek üretimdir.\n\nTek sayı değildir. Her limit ayrı bir kapasite verir:\n\n- gerilim,\n- termik,\n- koruma,\n- ters akış,\n- güç kalitesi.\n\nBunlardan **en küçüğü** ilan edilir. **Termik limit**, iletkenin aşırı ısınmadan taşıyabileceği en yüksek akımdır.\n\nKonum önemlidir. Trafo yanında 5 MW ile fider ucunda 5 MW aynı sonucu vermez. Fider ucu zayıf olduğu için aynı üretim orada gerilimi çok daha fazla yükseltir.\n\nYazılım işi tam olarak budur: her düğüm için kapasite eğrisi.\n\n## 4. Koruma ve otomasyon\n\n### Radyal fiderde koordinasyon\n\nRadyal fiderde **zaman kademeli aşırı akım** koruması kullanılır: kaynak tarafı daha yavaş, uç daha hızlı açar. Böylece arızaya en yakın cihaz önce açar, fiderin geri kalanı enerjili kalır.\n\nSigorta, röle ve otomatik tekrar kapama (OTK) birlikte koordinedir.\n\n- OTK geçici arızayı (dal, kuş) kapatır; yani kısa kesintiden sonra hattı geri verir.\n- Kalıcı arızada kilitler; yani birkaç denemeden sonra açık kalır.\n\nDağıtık üretim varsa, OTK'nın **ölü zamanında** (açık kaldığı kısa süre) adanın sönmüş olması gerekir.\n\n### Halka kapanırsa\n\nHalka kapanacaksa yönlü röle veya diferansiyel gerekir. Yönsüz aşırı akım, kapalı halkada seçiciliği kaybeder.\n\n- **Yönlü röle:** akımın hangi yönde aktığına bakarak açar.\n- **Diferansiyel koruma:** bir bölgeye giren ve çıkan akımı karşılaştırır; fark varsa arıza içeridedir.\n- **Seçicilik:** yalnızca arızalı kısmın açılması.\n\nKapalı halkada akım iki yönden gelir; yön bilmeyen röle hangi tarafın arızaya yakın olduğunu ayırt edemez.\n\n### FLISR ve OMS\n\n**FLISR** (Fault Location, Isolation and Service Restoration; arıza tespiti, izolasyon, hizmet iadesi), dağıtım otomasyonunun işletme değeridir. Arızayı bulur, ayırır, sağlam kısma enerjiyi geri verir.\n\n**OMS** (Outage Management System, Kesinti Yönetim Sistemi), kesintiyi müşteriye ve regülasyona raporlar.\n\n### SAIDI ve SAIFI\n\n| Endeks | Açılımı | Ne ölçer |\n|---|---|---|\n| **SAIDI** | System Average Interruption Duration Index, Sistem Ortalama Kesinti Süresi Endeksi | Süre |\n| **SAIFI** | System Average Interruption Frequency Index, Sistem Ortalama Kesinti Sıklığı Endeksi | Sıklık |\n\nCIGRE (Conseil International des Grands Réseaux Électriques, Uluslararası Büyük Elektrik Sistemleri Konseyi) 2026 Türkiye özetindeki dağıtım değerleri, planlı kesinti hariç ve dahil olmak üzere ayrı raporlanır.\n\nRakamı ezberlemekten çok, planlı ile plansızın karıştırılmaması gerekir. **Planlı kesinti**, bakım gibi önceden duyurulan kesintidir.\n\n2025 özetinde geçen değerler:\n\n| | SAIDI | SAIFI |\n|---|---|---|\n| Planlı dahil | 1,820 | 21,17 |\n| Planlı hariç | 1,099 | 17,8 |\n\nBirim dakikadır. Güncel hedef EPDK (Enerji Piyasası Düzenleme Kurumu) kalite göstergesindedir.\n\nNot: SAIDI değerleri kaynakta \"1,820\" ve \"1,099\" diye yazılmış ve birimi dakika verilmiş. Türkçede virgül ondalık ayırıcıdır; bu yazımla \"1,8 dakika\" okunur. İngilizce yazımda ise virgül binlik ayırıcıdır ve \"1.820 dakika\" anlamına gelir. Kullanmadan önce kaynaktan hangisi olduğunu teyit et.\n\nHesabı ve formülleri [`02-VoltVAR-Yeniden-Yapilandirma-Guvenilirlik.md`](02-VoltVAR-Yeniden-Yapilandirma-Guvenilirlik.md) sayfasında bulacaksın.\n\n## 5. Sistemler\n\nDağıtım şirketinin yazılım sistemleri:\n\n| Sistem | Açılımı | Ne yapar |\n|---|---|---|\n| **GIS** | Geographic Information System, Coğrafi Bilgi Sistemi | Coğrafi ve elektriksel varlık kaydı. Hatalı GIS, hatalı yük akışı demektir. Faz bağlantısı yanlışsa dengesiz analiz anlamsızdır. |\n| **SCADA** | Supervisory Control and Data Acquisition, Denetleyici Kontrol ve Veri Toplama | İzlenen anahtarlar ve gerilimler. Dağıtımda her ayırıcı izlenmez. |\n| **DMS** | Distribution Management System, Dağıtım Yönetim Sistemi | Yük akışı, anahtarlama planı, gerilim kontrolü, arıza yeri. |\n| **AMI** | Advanced Metering Infrastructure, Gelişmiş Sayaç Altyapısı | Akıllı sayaç. Gerilim ve enerjiyi saatlik veya daha sık getirir. Durum kestiriminin yeni ölçüm kaynağıdır. |\n\n**Ayırıcı**, hattı yüksüzken açıp kapatan, görünür bir açıklık sağlayan anahtardır.\n\n### Kimlik eşleme sorunu\n\n**GIS + AMI + SCADA** aynı barayı farklı isimle tutuyorsa, yazılım projesi ölçümden önce **kimlik eşlemeyle** boğulur. Yani önce \"bu üç sistemdeki üç farklı kayıt aynı nokta mı?\" sorusu çözülmelidir.\n\n> **Mülakatta şöyle söyle:** Bunu söylemen, \"yazılım projesinde çalıştım\" cümlesini inandırıcı kılar.\n\n## 6. Planlama\n\n### Dağıtım planlama kararları\n\nDağıtım planı, iletim **master planından** (uzun vadeli ana plan) daha kısa adımlıdır ve coğrafyaya yapışıktır:\n\n- parsel,\n- kanal,\n- direk,\n- müşteri büyümesi.\n\nTipik kararlar:\n\n- yeni fider,\n- kesit artırımı (daha kalın iletken),\n- yeni dağıtım trafosu,\n- yeni TM (trafo merkezi) çıkışı,\n- iletim bağlantı geriliminin 154 kV mi 34,5 kV mi olacağı.\n\nElektrikli araç kümelenmesi bir sokağı, bir iletim hattından önce doldurur.\n\nDepolama, hem gerilim hem **puant tıraşlama** (en yüksek tüketim anını bataryadan karşılayıp tepeyi düşürme) için bir fider varlığıdır.\n\nAma **enerji arbitrajı** (ucuzken şarj edip pahalıyken satmak) ile şebeke hizmeti aynı bataryada çakışabilir. Bu yüzden kontrol önceliği yazılır: hangi durumda hangisi önce gelir, açıkça belirlenir.\n\n### Dağıtım durum kestirimi\n\n**Durum kestirimi**, eldeki ölçümlerden şebekenin o anki gerilim ve açılarını en olası şekilde tahmin etmektir.\n\nDağıtım durum kestirimi iletim kestiriminin küçüğü değildir:\n\n- Ölçüm azdır.\n- **Pseudo-ölçüm** (sözde ölçüm; ölçülmeyen yer için tahminî yük) çoktur.\n- Faz bilgisi kirlidir.\n- Topoloji (şebekenin bağlantı şekli) belirsizdir.\n\n**Ağırlıklı en küçük kareler** (WLS, Weighted Least Squares) yine kullanılır. Bu yöntem, güvenilir ölçüme büyük, güvensiz ölçüme küçük ağırlık vererek en uygun çözümü bulur.\n\nAsıl mesele iki şeydir: **gözlenebilirlik** (eldeki ölçümlerin şebekeyi çözmeye yetip yetmediği) ve pseudo-ölçümün ağırlığı.\n\nAyrıntı `09` klasöründe ([`../09-Durum-Kestirimi/`](../09-Durum-Kestirimi/00-Alt-Basliklar.md)) ve [`03-Dagitim-Durum-Kestirimi-AMI-DERMS-EV.md`](03-Dagitim-Durum-Kestirimi-AMI-DERMS-EV.md) sayfasında.\n\n### 90 saniyelik metin için not\n\nAşağıdaki metin sayfanın kısa sözlü özetidir. İçindeki kısaltmalar yukarıda açıldı: R/X (Bölüm 1), OTK (Bölüm 3 ve 4), GIS ve SCADA (Bölüm 5). \"PR+QX\", Bölüm 2'deki gerilim düşümü formülünün payıdır.\n\n## 90 saniye\n\n“Dağıtım radyal, R/X yüksek ve dengesiz. Gerilim düşümü PR+QX ile gider. Çatı güneşi ters akış ve gerilim yükseltmesi yaratır; barındırma kapasitesi düğüme ve limite göre değişir. Eviricinin kısa devre katkısı senkron makine gibi değildir, OTK ile ada koruması birlikte düşünülür. Yazılım tarafında GIS, SCADA ve sayaç kimliği birleşmeden yük akışı güvenilmez.”\n\n## Kendini yokla\n\nÖnce cevabı kapat, kendin söyle, sonra kontrol et.\n\n1. **Dağıtım neden radyal işletilir?**\n   Arıza bölgesi küçük kalsın, koruma basit kalsın diye. Halka varsa bile açık nokta bırakılır.\n\n2. **Çatı güneşi gerilimi neden yükseltir, kapasitör neden çözüm değildir?**\n   Dağıtımda R/X yüksektir; aktif güç enjeksiyonu gerilimi yükseltir. Kapasitör reaktif üretip problemi büyütebilir.\n\n3. **Radyal fiderde yaklaşık gerilim düşümü formülü nedir?**\n   ΔV ≈ (P R + Q X) / V.\n\n4. **Teknik ve ticari kayıp nasıl ayrılır?**\n   Teknik kayıp (I²R, trafo bakır ve boşta demir, korona, bağlantı direnci) yük akışıyla hesaplanır. Ticari kayıp (kaçak, ölçüm hatası) enerji bilançosu ile teknik kayıp farkından tahmin edilir.\n\n5. **Eviricinin kısa devre katkısı senkron makineden nasıl farklıdır?**\n   Senkron makine 6–10 kat verir. Evirici çoğunlukla 1,1–1,5 kat nominal akım civarında sınırlanır ve hızla kesilir.\n\n6. **Gerilim yükselmesinde en kötü durum nedir?**\n   Minimum yük, maksimum üretim.\n\n7. **Barındırma kapasitesi neden tek sayı değildir?**\n   Gerilim, termik, koruma, ters akış ve güç kalitesi ayrı kapasite verir; en küçüğü ilan edilir. Konum da önemlidir: trafo yanında 5 MW ile fider ucunda 5 MW aynı değildir.\n\n8. **OTK ile ada koruması neden çakışır?**\n   Ada canlı kalırsa, ölü devreye olmayan kapama senkron olmayan iki kaynağı üst üste bindirir. OTK'nın ölü zamanında adanın sönmüş olması gerekir.\n\n9. **Kapalı halkada neden yönsüz aşırı akım yetmez?**\n   Seçiciliği kaybeder; yönlü röle veya diferansiyel gerekir.\n\n10. **2025 özetinde SAIDI ve SAIFI değerleri nedir?**\n    Planlı dahil SAIDI 1,820 ve SAIFI 21,17; planlı hariç SAIDI 1,099 ve SAIFI 17,8. Birim dakika. Planlı ile plansızı karıştırma.\n\n11. **GIS, SCADA, DMS ve AMI ne yapar?**\n    GIS varlık kaydı, SCADA izleme ve kumanda, DMS yük akışı/anahtarlama/gerilim kontrolü/arıza yeri, AMI akıllı sayaç verisi.\n\n12. **Dağıtım durum kestiriminde asıl mesele nedir?**\n    Ağırlıklı en küçük kareler yine kullanılır; asıl mesele gözlenebilirlik ve pseudo-ölçümün ağırlığıdır.\n"}, {"id": "04-Dagitim-Sistemleri/02-VoltVAR-Yeniden-Yapilandirma-Guvenilirlik.md", "group": "04  Dağıtım", "title": "Volt/VAR, yeniden yapılandırma, güvenilirlik", "body": "# Volt/VAR, yeniden yapılandırma, güvenilirlik\n\nBu sayfa dört konuyu anlatır: dağıtımda gerilimi ve reaktif gücü birlikte ayarlayan Volt/VAR optimizasyonu, açık noktaları değiştirerek şebekeyi yeniden yapılandırma, kayıp azaltma ve kesinti süresini ile sıklığını ölçen güvenilirlik endeksleri.\n\n## Volt/VAR optimizasyonu\n\nDağıtım şirketi, fider boyunca her müşterinin gerilimini izin verilen bant içinde tutmak zorundadır. Fider, trafo merkezinden çıkan tek bir dağıtım hattıdır.\n\nŞirketin elinde üç ayar vardır:\n\n| Cihaz | Ne yapar | Kısıtı |\n| --- | --- | --- |\n| Yük altında kademe değiştirici (OLTC), hat regülatörü | Gerilimi bütün fider için kaydırır | Ayrık kademe, mekanik aşınma, günde sınırlı işlem |\n| Kapasitör bankası | Reaktif üretir, gerilimi yükseltir, kaybı düşürür | Aç-kapa, hafif yükte aşırı gerilim |\n| Evirici reaktif gücü | Hem üretir hem tüketir, hızlı ve sürekli | MVA sınırı; reaktif verirken aktif güçten yiyebilir |\n\nEvirici, güneş panelinin doğru akımını şebekenin alternatif akımına çeviren güç elektroniği cihazıdır. MVA sınırı, eviricinin toplam (aktif ve reaktif birlikte) güç kapasitesidir.\n\n### Problem tanımı\n\nVolt/VAR optimizasyonu (VVO), bu üç cihazı birlikte ayarlayan problemdir.\n\n| Parça | İçeriği |\n| --- | --- |\n| Amaç | Kayıp en az, gerilim sapması en az, kademe işlemi en az. Bazen de CVR (gerilim düşürerek tasarruf): gerilimi bandın alt yarısında tutarak tüketimi azaltmak |\n| Kısıt | Her barada gerilim bandı, hat ve trafo akım sınırı, cihaz sınırları |\n| Değişken | Kademe konumu (tam sayı), kapasitör durumu (0/1), evirici reaktifi (sürekli) |\n\nMatematik sınıfı: karışık tam sayılı doğrusal olmayan problem. Yani bazı değişkenler tam sayı, bazıları süreklidir ve denklemler doğrusal değildir.\n\nPratikte iki yol izlenir:\n\n- **Kural tabanlı yerel kontrol:** Her cihaz kendi gerilimine bakar.\n- **Merkezi optimizasyon:** DMS (dağıtım yönetim sistemi) veya ADMS (gelişmiş dağıtım yönetim sistemi) içinde, dakikalar mertebesinde çözülür.\n\n### Zaman ölçeği\n\nZaman ölçeği ayrımı önemlidir:\n\n- Kademe ve kapasitör yavaştır, saatlik planlanır.\n- Evirici hızlıdır, bulut geçişine saniyeler içinde tepki verir.\n\nİkisi aynı gerilimi düzeltmeye çalışırsa birbirini kovalar. Buna avlanma denir.\n\nÇözüm: Yavaş cihaza ölü bant ve gecikme, hızlı cihaza eğim verilir. Ölü bant, cihazın tepki vermediği küçük gerilim aralığıdır. Eğim, eviricinin gerilim sapmasıyla orantılı tepki vermesidir.\n\n> **Sade anlatım:** Aynı odada iki kişi termostatı ayarlıyorsa oda hiç dengeye gelmez. Biri yavaş ve sabırlı, diğeri hızlı ama ölçülü davranırsa sorun çözülür.\n\n### Elle örnek: evirici neden reaktif **tüketir**\n\nDurum: Öğlen, fider sonunda güneş 2 MW üretiyor, yük 0,5 MW. Net 1,5 MW geriye akıyor. Fider `R = 2 Ω`, `X = 2 Ω`, 34,5 kV.\n\n**Adım 1.** Bu adım, eviricinin reaktif desteği yokken gerilim değişimini bulur. Geriye akan güç negatif P olarak formüle girer:\n\n```\nΔV ≈ (P R + Q X) / V = (−1,5 × 2 + 0) / 34,5 = −0,087 kV\n```\n\nEksi işaret, gerilimin fider sonunda **yükseldiğini** söyler: +%0,25. Küçük görünür. Alçak gerilim tarafında ve uzun kırsal fiderde aynı etki birkaç yüzdeye çıkar.\n\n**Adım 2.** Bu adım, evirici 1 Mvar reaktif tükettiğinde (`Q = +1`) gerilimin ne kadar düzeldiğini gösterir:\n\n```\nΔV = (−1,5 × 2 + 1 × 2) / 34,5 = −0,029 kV\n```\n\n**Sonuç.** Yükselme üçte birine indi. Bedeli: fiderden fazladan 1 Mvar aktı, kayıp arttı. Volt/VAR optimizasyonunun özü bu takastır.\n\n## Şebekenin yeniden yapılandırılması\n\nDağıtım şebekesi halka olarak kurulur, **radyal** işletilir. Radyal, her yükün kaynağa tek yoldan bağlı olması demektir.\n\nHalkayı açık tutan anahtara **normalde açık nokta** denir. Yeniden yapılandırma, hangi anahtarın açık olacağını yeniden seçmektir.\n\n### Neden yapılır\n\n1. Kaybı azaltmak ve yükü dengelemek.\n2. Arızadan sonra sağlam kısmı başka fiderden beslemek (FLISR: arızayı bul, ayır, yeniden enerjilendir).\n3. Bakım için bir kesimi boşaltmak.\n4. Dağıtık üretimin barındırma kapasitesini artırmak. Barındırma kapasitesi, fidere limitler bozulmadan bağlanabilecek üretimdir.\n\n### Kısıtlar\n\n- Şebeke radyal kalmalı: her yük tek yoldan beslenmeli, halka kalmamalı.\n- Kimse enerjisiz kalmamalı.\n- Gerilim ve akım sınırları korunmalı.\n- Koruma koordinasyonu bozulmamalı.\n\n### Yazılımcı gözüyle\n\nBu, bir çizgede **kapsayan ağaç** seçme problemidir. Kapsayan ağaç, bütün düğümlere ulaşan ama hiç döngü içermeyen kenar kümesidir.\n\n`n` anahtar için `2ⁿ` durum vardır; kombinatoryal olarak patlar.\n\nYöntemler:\n\n- **Dal değiştirme sezgiseli:** Bir anahtarı kapat, oluşan halkada en az akım taşıyan yeri aç.\n- **Karışık tam sayılı konik program.**\n- **Meta-sezgiseller.**\n\n### Elle örnek: yük dengeleme kaybı düşürür\n\nDurum: Aynı trafo merkezinden çıkan iki fider var. Her birinin direnci faz başına 1 Ω.\n\n**Önce.** Bu satır dengesiz durumdaki üç fazlı kaybı hesaplar. Biri 300 A, diğeri 100 A taşıyor:\n\n`3 × (300² + 100²) × 1 = 300 kW`\n\n**Sonra.** Bu satır, açık nokta kaydırılıp iki fider de 200 A taşıyınca kaybı hesaplar:\n\n`3 × 2 × 200² = 240 kW`\n\n**Sonuç.** Toplam akım aynı kaldı, kayıp %20 düştü. Neden: kayıp akımın karesiyle gider. Kareler toplamı, dağılım eşitken en küçüktür.\n\n## Kayıp azaltma\n\nKayıp iki türdür:\n\n| Tür | İçeriği | Nasıl ele alınır |\n| --- | --- | --- |\n| **Teknik kayıp** | İletkende `I²R`, trafoda demir (yükten bağımsız) ve bakır (yüke bağlı) kaybı | Mühendislik önlemleriyle azaltılır |\n| **Teknik olmayan kayıp** | Kaçak kullanım, sayaç ve faturalama hatası | Mühendislik değil tespit problemidir; sayaç verisi analitiği burada devreye girer |\n\nTeknik kaybı azaltma yolları, ucuzdan pahalıya:\n\n1. Yeniden yapılandırma\n2. Faz dengeleme\n3. Reaktif kompanzasyon\n4. Gerilim seviyesini yükseltme\n5. İletken kesitini büyütme\n6. Trafoyu yüke yaklaştırma\n7. Verimli trafo\n\n## Güvenilirlik endeksleri\n\n| Endeks | Açılımı | Formül | Anlam |\n| --- | --- | --- | --- |\n| SAIFI | Sistem ortalama kesinti sıklığı endeksi | Kesintiden etkilenen müşteri sayısı toplamı / toplam müşteri | Ortalama müşteri yılda kaç kez kesinti yaşar |\n| SAIDI | Sistem ortalama kesinti süresi endeksi | Müşteri kesinti süreleri toplamı / toplam müşteri | Ortalama müşteri yılda kaç dakika enerjisiz kalır |\n| CAIDI | Müşteri ortalama kesinti süresi endeksi | SAIDI / SAIFI | Bir kesinti ortalama kaç dakika sürer |\n| ENS | Verilemeyen enerji | Kesilen güç × süre | Verilemeyen enerji |\n\nTürkiye'de EPDK (Enerji Piyasası Düzenleme Kurumu) aynı kavramları Türkçe kısaltmalarla izler:\n\n- OKSÜRE (ortalama kesinti süresi)\n- OKSIK (ortalama kesinti sıklığı)\n\nGüncel hedef değerleri ve tazminat kurallarını **doğrulamadım**.\n\n> **Mülakatta şöyle söyle:** Sorulursa Elektrik Dağıtımı ve Perakende Satışına İlişkin Hizmet Kalitesi Yönetmeliği'ne atıf yap, rakam söyleme.\n\n### Elle örnek\n\nDurum: 1000 müşterili fider, yılda iki kesinti.\n\n- Kesinti A: 200 müşteri, 90 dakika\n- Kesinti B: 500 müşteri, 30 dakika\n\nAşağıdaki üç satırda ilki etkilenen müşterileri toplayıp sıklığı, ikincisi müşteri × dakikayı toplayıp süreyi bulur. Üçüncüsü, ikisini bölerek bir kesintinin ortalama süresini verir.\n\n```\nSAIFI = (200 + 500) / 1000 = 0,70 kesinti/müşteri\nSAIDI = (200 × 90 + 500 × 30) / 1000 = 33.000 / 1000 = 33 dakika/müşteri\nCAIDI = 33 / 0,70 = 47,1 dakika\n```\n\n### Yorum\n\n- SAIFI'yi koruma ve ayırma düşürür: daha az müşteri etkilenir.\n- SAIDI'yi otomasyon ve yeniden yapılandırma düşürür: enerji daha çabuk geri gelir.\n- CAIDI tek başına yanıltıcıdır. Kısa kesintileri otomasyonla ortadan kaldırırsan geriye uzun olanlar kalır ve CAIDI **yükselir**. Oysa hizmet iyileşmiştir.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"Dağıtım şebekesi halka çalışır.\"** | Halka kurulur, radyal işletilir. Koruma bu varsayıma göre ayarlıdır. |\n| **\"Güneş çok üretince gerilim reaktif yüzünden yükselir.\"** | Dağıtımda R büyüktür; neden aktif güçtür. |\n| **\"Kapasitör her zaman kaybı düşürür.\"** | Hafif yükte aşırı kompanzasyon kaybı ve gerilimi artırır. |\n| **\"CAIDI düştüyse hizmet iyileşmiştir.\"** | Yukarıdaki gibi ters de olabilir. SAIDI ve SAIFI birlikte okunur. |\n| **\"Yeniden yapılandırma bir optimizasyon sorusudur, koruma ayrı.\"** | Besleme yönü değişince kısa devre akımı ve röle koordinasyonu değişir. |\n\n## Panel takip sorusu\n\n\"Volt/VAR için amaç fonksiyonun ne olur?\"\n\n> **Mülakatta şöyle söyle:** \"Kayıp ve gerilim sapmasının ağırlıklı toplamı, artı kademe işlemine ceza. Ağırlıkları işletmecinin önceliği belirler; tek doğru yoktur.\"\n\n\"Yeniden yapılandırmada radyalliği nasıl garanti edersin?\"\n\n> **Mülakatta şöyle söyle:** \"Kapalı dal sayısı = bara sayısı − besleme noktası sayısı ve şebeke bağlı olmalı. Formülasyonda tek mal akışı veya kapsayan ağaç kısıtlarıyla yazılır.\"\n\nTek mal akışı: her yüke kaynaktan sanal bir \"mal\" gönderilir. Mal her yüke ulaşabiliyorsa şebeke bağlıdır.\n\nAşağıdaki metin, bu konu sorulduğunda 90 saniyede söyleyeceğin özettir.\n\n## 90 saniye\n\n\"Dağıtımda gerilimi üç cihaz yönetir: kademe değiştirici, kapasitör ve eviricinin reaktif gücü. Volt/VAR optimizasyonu bunları kayıp, gerilim sapması ve kademe aşınması arasında dengeleyen karışık tam sayılı bir problemdir; yavaş ve hızlı cihazların birbirini kovalamaması için zaman ölçekleri ayrılır. Yeniden yapılandırma, radyal kalmak şartıyla açık noktaları yeniden seçmektir; kaybı düşürür ve arıza sonrası beslemeyi geri getirir. Hizmet kalitesini SAIFI ile sıklık, SAIDI ile süre olarak ölçerim; CAIDI ikisinin oranıdır ve tek başına yanıltabilir.\"\n"}, {"id": "04-Dagitim-Sistemleri/03-Dagitim-Durum-Kestirimi-AMI-DERMS-EV.md", "group": "04  Dağıtım", "title": "Durum kestirimi, AMI, DERMS, EV", "body": "# Durum kestirimi, AMI, DERMS, EV\n\nBu sayfa dört konuyu anlatır: dağıtımda durum kestiriminin neden zor olduğu, AMI (gelişmiş sayaç altyapısı), DERMS (dağıtık enerji kaynakları yönetim sistemi) ve EV (elektrikli araç) şarjının şebekeye etkisi.\n\nDurum kestirimi, eldeki ölçümlerden şebekenin o anki gerilim ve açılarını en olası şekilde tahmin etmektir.\n\n## Dağıtımda durum kestirimi neden zor\n\nİletimde durum kestirimi olgun bir üründür (`09` klasörü). Aynı yöntemi dağıtıma taşıyınca beş şey bozulur:\n\n| İletimdeki varsayım | Dağıtımdaki gerçek | Sonuç |\n| --- | --- | --- |\n| Ölçüm, bilinmeyenden fazladır | Fider başında birkaç ölçüm, gerisi ölçümsüz | Sistem gözlenemez; açığı **sözde ölçüm** kapatır |\n| Üç faz dengelidir | Tek fazlı yükler, dengesiz hatlar | Üç faz model gerekir, bilinmeyen sayısı üçe katlanır |\n| `X ≫ R` | `R ≈ X` | P–θ ve Q–V ayrışması tutmaz, hızlı ayrık yöntem çalışmaz |\n| Topoloji bilinir | Anahtar konumu ve müşterinin hangi faza bağlı olduğu belirsizdir | Model hatası ölçüm hatasından büyük olabilir |\n| Ölçümler eşzamanlıdır | SCADA saniyelik, sayaç 15 dakikalık ve gecikmeli | Zaman hizalama gerekir |\n\nTablodaki terimler:\n\n- **Gözlenebilirlik:** Eldeki ölçümlerin bütün bilinmeyenleri çözmeye yetmesi.\n- **P–θ ve Q–V ayrışması:** İletimde aktif gücün (P) çoğunlukla açıya (θ), reaktif gücün (Q) çoğunlukla gerilime (V) bağlı olması. Hızlı ayrık yöntem bu ayrışmaya dayanır.\n- **SCADA:** Merkezi izleme ve kumanda sistemi.\n\n### Sözde ölçüm\n\n**Sözde ölçüm (pseudo-measurement):** Ölçülmeyen yük için tahmin kullanmaktır.\n\nKaynakları:\n\n- Sayaç geçmişi\n- Trafo anma gücüne göre paylaştırma\n- Yük profili\n\nBelirsizliği büyüktür (%20–50). Bu yüzden ağırlığı küçük verilir. Kestirimin kalitesi doğrudan sözde ölçümün kalitesine bağlıdır.\n\n### Durum değişkeni\n\nDurum değişkeni seçimi de değişir:\n\n- İletimde bara gerilimi ve açısı kullanılır.\n- Radyal dağıtımda **dal akımı** tabanlı kestirim daha iyi koşullu ve daha hızlıdır.\n\n> **Sade anlatım:** Yazılımcı gözüyle iletim kestirimi, fazla belirlenmiş ve temiz veriyle yapılan bir regresyondur. Dağıtım kestirimi ise eksik veriyle, güçlü önsel bilgiyle ve hatalı şemayla yapılan bir çıkarımdır.\n\n### Elle örnek: ağırlığın etkisi\n\nDurum: Bir fider kesimindeki akış için iki bilgi var.\n\n- SCADA ölçümü 2,00 MW (σ = 0,02)\n- Sayaç profilinden sözde ölçüm 2,60 MW (σ = 0,50)\n\nσ (sigma), bilginin standart sapmasıdır; ne kadar belirsiz olduğunu gösterir.\n\nAşağıdaki ilk satır, her bilgiye belirsizliğinin karesinin tersi kadar ağırlık verir. İkinci satır, iki değerin bu ağırlıklarla ortalamasını alır.\n\n```\nağırlık = 1/σ²:   2500   ve   4\nkestirim = (2500 × 2,00 + 4 × 2,60) / 2504 = 2,001 MW\n```\n\nSonuç: Sözde ölçüm sonucu neredeyse hiç oynatmadı. Ölçümün olduğu yerde belirleyici olan ölçümdür. Sözde ölçüm yalnızca ölçümün olmadığı yerde sistemi çözülebilir kılar.\n\n## AMI: gelişmiş sayaç altyapısı\n\nAMI; akıllı sayaç, haberleşme ağı, veri toplayıcı ve sayaç veri yönetim sistemi (MDMS) bütünüdür.\n\n### Ne verir\n\n- 15 dakikalık veya saatlik tüketim ve üretim\n- Gerilim\n- Kesinti ve geri gelme bildirimi (\"son nefes\" mesajı: sayacın enerji giderken gönderdiği son mesaj)\n- Uzaktan açma-kapama\n\n### Analiz için değeri\n\n- Kestirim için sözde ölçüm kaynağı\n- Yük profili ve tahmin\n- Teknik olmayan kayıp tespiti: trafo ölçümü ile altındaki sayaçların toplamı tutmuyorsa\n- Topoloji ve faz tespiti: aynı faza bağlı sayaçların gerilimleri birlikte hareket eder\n- Kesinti yerinin hızlı bulunması\n\n### Sınırları\n\n- Veri gecikmelidir. Çoğu sistem günde bir kez toplu aktarır.\n- Gerçek zamanlı kontrol için uygun değildir.\n- Veri hacmi büyüktür.\n- Kişisel veridir (KVKK, Kişisel Verilerin Korunması Kanunu).\n\nTürkiye'deki güncel akıllı sayaç yaygınlaştırma takvimini ve oranını **doğrulamadım**.\n\n> **Mülakatta şöyle söyle:** Akıllı sayaç yaygınlığı için rakam verme.\n\n## DERMS: dağıtık enerji kaynakları yönetim sistemi\n\nDERMS; çatı güneşi, batarya, şarj istasyonu ve esnek yük gibi binlerce küçük kaynağı izleyen, tahmin eden ve yöneten yazılımdır.\n\n### Kardeş sistemlerden ayrımı\n\n| Sistem | Sorumluluğu |\n| --- | --- |\n| SCADA | Ölçer, kumanda eder |\n| DMS / ADMS (dağıtım yönetim sistemi / gelişmiş DMS) | Şebekeyi yönetir: yük akışı, kestirim, FLISR (arıza tespiti, izolasyon, hizmet iadesi), volt/VAR |\n| DERMS | Şebekeye bağlı kaynakları yönetir: toplar, sınır koyar, ayar noktası gönderir |\n| Sanal santral (VPP) | Kaynakları **piyasa** için toplar; şebeke kısıtını bilmek zorunda değildir |\n\n### Tipik işlevleri\n\n- Kayıt ve görünürlük\n- Üretim ve esneklik tahmini\n- Toplama\n- Kısıt yönetimi: dinamik işletme zarfı. Bu, her bağlantı noktasına o an izin verilen en büyük ithalat ve ihracattır.\n- Volt/VAR desteği\n\n### Standartlar\n\n- Haberleşme standartları: IEEE 2030.5, OpenADR, SunSpec Modbus, IEC 61850-7-420.\n- Evirici davranışı IEEE 1547-2018 ile tanımlanır.\n\n### Bu ilanla bağı\n\nTEİAŞ'ın (Türkiye Elektrik İletim A.Ş.) güneş tahmin projesi 34 binden fazla santrali kapsar (`01/03`).\n\n- İletim operatörü için bu kaynakların toplam davranışı önemlidir.\n- Dağıtım için tek tek davranışı önemlidir.\n\nİkisi arasındaki veri alışverişi (TSO–DSO koordinasyonu, yani iletim ve dağıtım sistemi operatörlerinin koordinasyonu) açık bir araştırma alanıdır.\n\n## Elektrikli araç şarjı\n\nŞebeke açısından üç etki vardır:\n\n1. **Eşzamanlılık.** Akşam eve dönüş, evsel puantla çakışır. Trafo ve alçak gerilim kablosu ısıl sınıra dayanır.\n2. **Gerilim düşümü ve dengesizlik.** Tek fazlı ev şarjı faz dengesini bozar.\n3. **Hızlı şarj.** 150–350 kW'lık istasyon, orta gerilimde küçük bir sanayi tesisi gibidir; ani yüklenir.\n\n### Elle örnek: trafo ne zaman dolar\n\nDurum: 400 kVA dağıtım trafosu, 100 hane. Akşam puantında hane başına 2 kW, güç faktörü 0,95.\n\n**Adım 1.** Bu adım, mevcut yükü kVA'ya çevirip trafonun ne kadar dolu olduğunu bulur. Ardından boş kalan kapasiteyi hesaplar:\n\n```\nMevcut yük = 100 × 2 / 0,95 = 210,5 kVA      (%53)\nKalan      = 400 − 210,5    = 189,5 kVA\n```\n\n**Adım 2.** Bu adım, boş kapasiteye aynı anda kaç aracın sığacağını bulur. Ev tipi şarj 7,4 kW'tır (tek faz, 32 A). Güç faktörü 1 kabul edilir:\n\n```\nAynı anda şarj edebilecek araç ≈ 189,5 / 7,4 ≈ 25\n```\n\n**Adım 3.** Bu adım, 40 aracın aynı anda takıldığı kötü senaryoyu hesaplar. Yüz hanenin 40'ında araç varsa ve hepsi 19.00'da takarsa `40 × 7,4 = 296 kW` ister. Toplam `200 + 296 = 496 kW` ve 65,7 kvar, yani 500 kVA eder. Trafo %125 yüklenir.\n\n**Sonuç.** Aynı 40 araç gece boyunca sıraya konursa sorun yoktur. Çözüm bakır değil, zamanlama.\n\n### Araçlar\n\n| Araç | Ne yapar |\n| --- | --- |\n| **Akıllı şarj (V1G)** | Şarjın zamanını ve gücünü kaydırır. Tarife, sinyal veya doğrudan kontrol ile |\n| **Araçtan şebekeye (V2G)** | Bataryadan şebekeye geri verir. Teknik olarak mümkündür; batarya ömrü, sayaç ve mevzuat engelleri vardır |\n| **Planlama** | Eşzamanlılık katsayısı kullanılır. Yüz aracın hepsi aynı anda tam güçte şarj etmez; katsayı ölçümle belirlenir |\n\nDikkat: Herkesi aynı ucuz saate yönlendiren basit tarife, puantı yok etmez; **yeni bir puant** yaratır (geri tepme etkisi). Başlangıç saatini dağıtmak gerekir.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"İletimdeki kestirim kodunu dağıtıma kurarım.\"** | Gözlenebilirlik, denge ve R/X varsayımlarının üçü de tutmaz. |\n| **\"Akıllı sayaç gerçek zamanlı ölçümdür.\"** | Çoğu kurulumda saatler gecikmeli toplu veridir. |\n| **\"DERMS ile sanal santral aynıdır.\"** | Biri şebeke kısıtını, diğeri piyasa gelirini optimize eder; çatışabilirler. |\n| **\"Elektrikli araç sorunu enerji sorunudur.\"** | Yıllık enerji payı küçüktür. Sorun eşzamanlı güç ve yereldir. |\n| **\"Sözde ölçüm ölçüm gibidir.\"** | Büyük varyanslı tahmindir; ağırlığı buna göre verilmezse kestirimi bozar. |\n\n## Panel takip sorusu\n\n\"Dağıtımda gözlenebilirliği nasıl artırırsın?\"\n\n> **Mülakatta şöyle söyle:** \"Önce mevcut veriyi kullanırım: sayaç verisinden sözde ölçüm, trafo ölçümleri. Sonra kestirim varyansını en çok düşürecek noktalara ölçüm yerleştiririm; bu bir optimal sensör yerleşimi problemidir.\"\n\n\"Topoloji hatasını ölçüm hatasından nasıl ayırırsın?\"\n\n> **Mülakatta şöyle söyle:** \"Ölçüm hatası tek bir artığı büyütür. Topoloji hatası, yanlış modellenen anahtarın çevresindeki birçok artığı birlikte büyütür.\"\n\nArtık, ölçülen değer ile kestirimin o ölçüm için öngördüğü değer arasındaki farktır.\n\nAşağıdaki metin, bu konu sorulduğunda 90 saniyede söyleyeceğin özettir.\n\n## 90 saniye\n\n\"Dağıtımda durum kestirimi iletimdekinden zordur, çünkü ölçüm azdır, şebeke dengesizdir, direnç reaktansa yakındır ve topoloji belirsizdir. Eksik ölçümü sayaç geçmişinden üretilen sözde ölçümle kapatır, belirsizliği büyük olduğu için ağırlığını küçük veririm. Akıllı sayaç altyapısı bu verinin kaynağıdır ama gerçek zamanlı değildir. DERMS, binlerce küçük kaynağı şebeke kısıtı içinde yönetir; sanal santral ise piyasa için toplar. Elektrikli araçta sorun enerji değil eşzamanlı güçtür; ilk çözüm şarjı zamana yaymaktır.\"\n"}, {"id": "05-Yuk-Akisi/00-Alt-Basliklar.md", "group": "05  Yük akışı", "title": "05 — Yük akışı", "body": "# 05 — Yük akışı\n\nBu bölüm yük akışını baştan kurar. Aşağıdaki her madde bir alt başlıktır. Yanındaki cümle, o konuda ne öğreneceğini söyler. Konular üç sayfaya dağılmıştır: `01-NR-FDLF-DC-Dagitim.md` genel çerçeve, `02-NR-Elle-Jacobian-Q-Limit.md` elle Newton-Raphson, `03-Uc-Faz-Dengesiz-ve-Olasiliksal.md` dağıtım ve belirsizlik.\n\n1. **Problemin tanımı: verilen üretim ve yükten gerilim ve akı** — Elinde hangi bilgiler olduğunu ve yük akışının hangi bilinmeyenleri bulduğunu öğreneceksin.\n2. **Bara tipleri: PQ, PV, slack, izolasyon** — Her bara tipinde (PQ: P ve Q bilinen yük barası, PV: P ve gerilim büyüklüğü bilinen üretim barası, slack: referans/salınım barası) neyin verilip neyin arandığını öğreneceksin.\n3. **Ybus kurulumu** — Bara admitans matrisini (Ybus) hat ve şönt değerlerinden nasıl yazacağını öğreneceksin.\n4. **Güç denklemleri, polar form** — Her baradaki P ve Q'yu gerilim büyüklüğü ve açıyla veren denklemleri öğreneceksin.\n5. **Gauss-Seidel: neden zayıf kaldığı** — Eski yinelemeli yöntemin büyük sistemde neden tercih edilmediğini öğreneceksin.\n6. **Newton-Raphson ve Jacobian blokları** — NR (Newton-Raphson) yönteminin Jacobian matrisinin H, N, M, L bloklarıyla nasıl adım attığını öğreneceksin.\n7. **Ayrık hızlı yük akışı (fast decoupled)** — FDLF'nin (Fast Decoupled Load Flow, ayrık hızlı yük akışı) neyi atarak hız kazandığını ve nerede yanıldığını öğreneceksin.\n8. **DC yük akışı ve ne zaman meşru olduğu** — Doğrusallaştırılmış aktif güç modelinin varsayımlarını ve kör noktasını öğreneceksin.\n9. **Kontrol: kademe, şönt, Q limiti, PV'den PQ'ya düşme** — Trafo kademesi, şönt ve reaktif sınırının çözüme nasıl girdiğini öğreneceksin.\n10. **Iraksama: ağır yük, kötü başlangıç, ada, veri hatası** — Yük akışı yakınsamadığında nedeni nasıl ayırt edeceğini öğreneceksin.\n11. **Dağıtım yük akışı: geri-ileri süpürme** — Radyal fiderin neden ayrı bir yöntemle çözüldüğünü ve süpürmenin adımlarını öğreneceksin.\n12. **Üç faz dengesiz yük akışı** — Fazların neden ayrı ama bağlı modellendiğini ve dengesizliğin kayba etkisini öğreneceksin.\n13. **Devam güç akışı ve PV eğrisine köprü** — Yükü adım adım artırıp gerilim çökmesi noktasına (burun) nasıl yaklaşıldığını öğreneceksin.\n14. **Hassasiyet ve dağıtım faktörleri (PTDF, LODF)** — PTDF (Power Transfer Distribution Factor, güç transfer dağıtım faktörü) ve LODF (Line Outage Distribution Factor, hat açılma dağıtım faktörü) ile hızlı tarama yapmayı öğreneceksin.\n15. **Büyük sistemde seyrek matris ve performans** — Binlerce baralı şebekenin neden seyrek çözücüyle hızlı çözüldüğünü öğreneceksin.\n16. **Sonuçların işletme diline çevrilmesi** — Çıktıdaki sayıları işletmecinin soracağı sorulara nasıl çevireceğini öğreneceksin.\n"}, {"id": "05-Yuk-Akisi/01-NR-FDLF-DC-Dagitim.md", "group": "05  Yük akışı", "title": "Yük akışı", "body": "# Yük akışı\n\nYük akışı, güç sisteminin statik fotoğrafıdır. Şebekenin belli bir andaki hâlini tek bir çözümle gösterir.\n\nBaşka hesapların çoğu bunun etrafında döner:\n\n- güvenlik taraması,\n- OPF (Optimal Power Flow, optimal güç akışı),\n- planlama,\n- durum kestirimi.\n\n“Analiz yazdım” diyorsan bu hesabı tahtada kurabilmen gerekir.\n\n> Sade anlatım: Üretimi ve tüketimi biliyorsun. Yük akışı, bu durumda her baradaki gerilimin ne olacağını ve hatlardan ne kadar güç geçeceğini hesaplar.\n\n## Problem\n\nBu bölüm, hesaba neyle girdiğini ve neyle çıktığını ayırır.\n\n| | Ne? |\n| --- | --- |\n| Bilinenler | Şebeke admitansı; yüklerin P'si ve Q'su; gerilim kontrollü baraların P ve \\|V\\| değeri; bir referans baranın açısı ve gerilimi |\n| Bilinmeyenler | Her baranın gerilim büyüklüğü ve açısı; sonra hat akışları, kayıp, üretim reaktifi |\n\nBurada P aktif güç, Q reaktif güç, |V| gerilim büyüklüğü, θ gerilim açısıdır.\n\nGüç dengesi her barada aşağıdaki denklemle yazılır. İlk satır baraya giren aktif gücü, ikinci satır reaktif gücü verir. G ve B, admitansın gerçel ve sanal kısımlarıdır.\n\n```\nP_i = V_i Σ_k V_k (G_ik cos θ_ik + B_ik sin θ_ik)\nQ_i = V_i Σ_k V_k (G_ik sin θ_ik - B_ik cos θ_ik)\nθ_ik = θ_i - θ_k\n```\n\n### Ybus\n\nYbus, bara admitans matrisidir. Akımı gerilime bağlar: `I = Y V`.\n\n- Köşegen dışı eleman: `Y_ik = -y_ik`. Yani iki bara arasındaki seri admitansın eksi işaretlisi.\n- Köşegen eleman: o baraya bağlı seri admitansların toplamı artı şönt.\n\nKademeli trafoda off-nominal oran (nominal dışı dönüştürme oranı) köşegeni bozar. “Sadece hat y’sini yazdım” yetmez.\n\n## Bara tipleri\n\nHer barada dört büyüklük vardır: P, Q, V, θ. Bara tipi, bunlardan hangisinin verildiğini söyler.\n\n| Tip | Bilinen | Bilinmeyen | Fiziksel karşılık |\n| --- | --- | --- | --- |\n| PQ / yük | P, Q | V, θ | Yük, reaktif limiti dolmuş üretim |\n| PV / gerilim kontrollü | P, V | Q, θ | Uyarma kontrollü senkron, STATCOM (Static Synchronous Compensator, statik senkron kompanzatör) yaklaşık |\n| Slack / salınım | V, θ | P, Q | Açı referansı ve kayıp dahil güç dengesi |\n| İzole | — | — | Enerjisiz ada, hesap ayrı yapılır |\n\n### Slack\n\nSlack bir santral değildir. Kayıpları ve dengesizliği üstlenen matematiksel kaptır.\n\n- Büyük modelde slack’i zayıf bir baraya koymak açıyı ve kaybı çarpıtır.\n- Pratikte güçlü bir üretim barası seçilir.\n- Birden fazla ada varsa her adaya bir slack gerekir.\n- Tek slack ile ıraksama çoğu zaman topoloji hatasıdır.\n\n### PV barasından PQ'ya\n\nPV bara Q limitine çarpınca PQ’ya döner. Bu dönüşüm yapılmazsa gerilim “mükemmel” görünür, reaktif ise fiziksel olarak imkânsız çıkar.\n\nİyi bir yük akışı Q limitini iterasyon içinde denetler. Limit kalkınca barayı tekrar PV yapabilir.\n\n## Newton-Raphson\n\nDenklemler lineer değildir. NR (Newton-Raphson), artık vektörünü Jacobian ile çözer. Artık, verilen güç ile hesaplanan güç arasındaki farktır. Jacobian, gücün açıya ve gerilime göre türevlerinden oluşan matristir.\n\nAşağıdaki sistem, artığı (sol taraf) açı ve gerilim düzeltmesine (sağdaki vektör) bağlar:\n\n```\n[ ΔP ]   [ H  N ] [ Δθ ]\n[ ΔQ ] = [ M  L ] [ ΔV/V ]\n```\n\nBloklar:\n\n| Blok | Anlamı |\n| --- | --- |\n| H | ∂P/∂θ |\n| N | ∂P/∂V |\n| M | ∂Q/∂θ |\n| L | ∂Q/∂V |\n\nHangi satırlar düşer:\n\n- Slack satır ve sütunları düşer.\n- PV barada Q denklemi ve ΔV bilinmeyeni düşer.\n\n### Başlangıç\n\n- Düz (flat) profil çoğu iletim sisteminde yeter: açılar 0, gerilimler 1 pu (per unit, birim değer).\n- Ağır yüklü veya dağıtım sisteminde önceki çözümün sıcak başlangıcı daha iyidir.\n\n### Hız ve maliyet\n\nNR yerel kuadratik yakınsar. Güç sisteminde çoğunlukla 3–6 iterasyon yeter.\n\nHer iterasyon Jacobian’ı yeniden kurar ve seyrek lineer sistem çözer. Büyük şebekede maliyet buradadır.\n\nYoğun matris tersi almak yanlıştır. Seyrek LU (alt-üst üçgen ayrışım) veya KLU sınıfı çözücüler kullanılır.\n\n### Iraksama\n\nIraksamanın anlamı “çözücü bozuk” olmak zorunda değildir:\n\n- **Çözüm yoktur:** gerilim çökmesi sınırının ötesi, ada, veri hatası (hat empedansı sıfır, paralel hat iki kez).\n- **Başlangıç kötüdür:** başlangıç çekim havzasının dışındadır.\n- **Kontroller salınıyordur:** kademe, şönt, Q limiti birbirini kovalıyordur. Kontrolleri dondurup önce kontrolsüz çözmek teşhistir.\n- **Çok küçük empedans vardır:** bara kuplajı Jacobian’ı hasta eder. Küçük empedanslı kuplaj yerine bara birleştirme daha sağlıklıdır.\n\n## Ayrık hızlı yük akışı\n\nİletimde P–θ ve Q–V zayıf bağlaşır. Yani aktif güç çoğunlukla açıya, reaktif güç çoğunlukla gerilime bağlıdır.\n\nFDLF (Fast Decoupled Load Flow, ayrık hızlı yük akışı) bu yüzden iki ayrı denklem çözer. B’ ve B’’ sabit matrislerdir; her turda yeniden kurulmazlar:\n\n```\nB' Δθ = ΔP / V\nB'' ΔV = ΔQ / V\n```\n\n| Artı | Eksi |\n| --- | --- |\n| Jacobian her tur kurulmaz, hız kazanılır | Dağıtımda yalan söyler veya ıraksar |\n| R/X (direnç/reaktans oranı) küçükken doğruluk iyidir | Ağır yüklü, gerilimi çökmüş sistemde yalan söyler veya ıraksar |\n\n“Her yerde FDLF kullanırım” yanlış cevaptır. İletim tarama motorunda makul, dağıtım fiderinde NR veya süpürme daha doğrudur.\n\n## DC yük akışı\n\nDC yük akışı, AC (alternatif akım) şebekenin doğrusallaştırılmış aktif güç modelidir. Varsayımları:\n\n- açılar küçük,\n- gerilimler 1 pu,\n- direnç ve şönt ihmal.\n\nBu varsayımlarla güç denklemi tek bir lineer bağıntıya iner. x hat reaktansıdır:\n\n```\nP = B θ ,   B_ik = -1/x_ik\n```\n\n| Kaybettiğin | Kazandığın |\n| --- | --- |\n| Kayıp yoktur | Lineerdir |\n| Reaktif yoktur | Binlerce beklenmeyen durum saniyede taranır |\n| Gerilim yoktur | PTDF ve LODF bu modelden gelir |\n\nPTDF (güç transfer dağıtım faktörü) ve LODF (hat açılma dağıtım faktörü) bu lineer modelden gelir.\n\nGüvenlik taramasının eleği çoğu zaman DC’dir. Elekten geçen ağır durumlar AC ile doğrulanır.\n\nDC sonucu gerilim ihlali söylemez. Bunu unutmak, tarama motorunun kör noktasıdır.\n\n## Dağıtım yük akışı\n\nRadyal fider, kaynaktan uca ağaç gibi dallanan, halka içermeyen hattır. Radyal fiderde geri-ileri süpürme (backward-forward sweep) kullanılır:\n\n1. Uçtan kaynağa akım veya güç topla. Bu adım her hattan geçen yükü bulur.\n2. Kaynaktan uca gerilimi güncelle. Bu adım bulunan akımlarla gerilim düşümünü hesaplar.\n3. Gerilim ve güç artık bitene kadar tekrarla. Bu adım iki tahminin birbirine oturmasını sağlar.\n\nYbus-NR ile karşılaştırma:\n\n- Ybus-NR radyal zayıf şebekede de çalışır.\n- Süpürme daha az bellek ister ve dengesiz modele daha doğal oturur.\n- Kapalı halka varsa süpürme kırılır. Zayıf döngüler için telafi akımı kullanılır veya NR’ye dönülür.\n\nÜç faz dengesiz modelde her hat 3×3 veya 4×4 empedans matrisidir (fazlar ve nötr).\n\nKariyer paketi “dengeli” kutusunu sessizce işaretli bırakıyorsa sonucu fider ucuna uygulamadan önce bunu söyle.\n\n## Devam gücü akışı\n\nYükü λ ile ölçekleyip her adımda yük akışı çözmek, PV eğrisini çıkarır. PV eğrisi, yük arttıkça gerilimin nasıl düştüğünü gösteren eğridir.\n\n- Burun noktasında Jacobian tekildir, düz NR ıraksar.\n- Devam yöntemi burun noktasını öngör-düzelt ile döner.\n- Gerilim kararlılığı marjı “buruna kaç MW var” sorusudur. Ayrıntı `08` içindedir.\n\nYük akışı ıraksadı diye “kararsız” deme. Önce veri ve ada kontrolü, sonra burun noktası.\n\n## Dağıtım faktörleri\n\n| Faktör | Sorduğu soru |\n| --- | --- |\n| PTDF | A barasından B barasına 1 MW transfer, her hatta kaç MW ekler? |\n| LODF | Bir hat açılırsa akışı diğer hatlara nasıl dağılır? |\n\nİkisi de DC modelin hızlı çocuklarıdır.\n\nN-1 taraması, her seferinde tek bir elemanın devre dışı kaldığı durumları tek tek denemektir. Bunu her seferinde baştan faktörize etmeden yapmak LODF ile mümkündür.\n\nAC doğrulama şarttır. Özellikle gerilim ve Q limiti devreye girince lineer faktör şaşar.\n\n## İşletme dili\n\nÇıktıyı şöyle okursun:\n\n- Gerilimler planlama veya işletme bandında mı?\n- Hat ve trafo yükü termik limite göre yüzde kaç?\n- Üretim reaktifi limite mi yapışmış?\n- Kayıp ve slack gücü makul mü? Slack, modeldeki dengesizliğin aynasıdır.\n- Hangi kontrol limitte? Limitteki kontrol, bir sonraki MW’nin daha pahalıya mal olacağı yerdir.\n\nAşağıdaki metin, bu sayfanın mülakatta yüksek sesle söylenecek özetidir.\n\n## 90 saniye\n\n> Mülakatta şöyle söyle: “Yük akışı, P ve Q bilinen baralardan gerilim ve açıyı bulur. Slack referans ve kayıp kaptır. Newton-Raphson Jacobian’ın H N M L bloklarıyla çözer; Q limiti dolan PV bara PQ olur. İletimde ayrık hızlı ve DC tarama hızlıdır, gerilimi DC görmez. Dağıtımda R büyük olduğu için süpürme veya tam AC, mümkünse üç faz gerekir. Iraksama her zaman çözücü hatası değildir; ada, veri ve burun noktası ayrı ayrı bakılır.”\n"}, {"id": "05-Yuk-Akisi/02-NR-Elle-Jacobian-Q-Limit.md", "group": "05  Yük akışı", "title": "Newton-Raphson elle", "body": "# Newton-Raphson elle\n\nBu sayfa Newton-Raphson (NR) yük akışını elle çözmeyi, Jacobian yapısını, yakınsamayı ve Q limitini anlatır.\n\n## Problem neden doğrusal değil\n\nŞebeke denklemi `I = Y V` doğrusaldır. Ama bize akım değil **güç** verilir: yük 50 MW çeker, santral 200 MW üretir.\n\nGüç, gerilim ile akımın çarpımıdır. Yani gerilimin karesini ve açıların sinüsünü içerir. Bu yüzden kapalı çözüm yoktur, yineleme gerekir.\n\n> Sade anlatım: Akım verilseydi tek bir matris denklemiyle biterdi. Güç verildiği için tahmin et, düzelt, tekrar et yapmak zorundasın.\n\nHer bara için dört büyüklük vardır: `P`, `Q`, `|V|`, `θ`. İkisi verilir, ikisi bulunur.\n\n| Bara tipi | Verilen | Bulunan | Fiziksel karşılığı |\n| --- | --- | --- | --- |\n| PQ (yük) | P, Q | V, θ | Tüketim; ayrıca reaktif sınırına dayanmış santral |\n| PV (üretim) | P, V | Q, θ | Gerilimini AVR (Automatic Voltage Regulator, otomatik gerilim regülatörü) ile tutan santral |\n| Salınım (slack) | V, θ = 0 | P, Q | Açı referansı; kaybı ve dengesizliği üstlenir |\n\nSalınım barası neden şart:\n\n- Kayıplar çözümden önce bilinmez. Bu yüzden bütün üretimleri önceden belirleyemezsin. Bir bara farkı kapatır.\n- Açılar görelidir. Biri sıfır seçilmezse denklem takımı tekildir.\n\n## Denklemler\n\nBara `i` için hesaplanan güç aşağıdaki gibidir. Bu iki denklem, tahmin edilen gerilim ve açılarla baraya giren gücü hesaplar:\n\n```\nP_i = V_i Σ V_k (G_ik cos θ_ik + B_ik sin θ_ik)\nQ_i = V_i Σ V_k (G_ik sin θ_ik − B_ik cos θ_ik)          θ_ik = θ_i − θ_k\n```\n\nArtık (mismatch), verilen ile hesaplanan arasındaki farktır:\n\n- `ΔP = P_verilen − P_hesaplanan`\n- `ΔQ = Q_verilen − Q_hesaplanan`\n\nNewton adımı, artığı sıfırlayacak düzeltmeyi doğrusal yaklaşımla bulur. Aşağıdaki matris denklemi, artığı açı ve gerilim düzeltmesine çevirir:\n\n```\n[ ΔP ]   [ H  N ] [ Δθ ]          H = ∂P/∂θ    N = ∂P/∂V\n[ ΔQ ] = [ M  L ] [ ΔV ]          M = ∂Q/∂θ    L = ∂Q/∂V\n```\n\nBilinmeyen sayısı:\n\n- PV ve PQ baraların açıları,\n- yalnız PQ baraların gerilimleri.\n\n`n` baralı, `g` üretim baralı sistemde Jacobian boyutu `(2n − g − 1)`'dir (salınım dahil `g`).\n\n## Jacobian'ın yapısı\n\nKöşegen elemanlar aşağıdadır. Ezberleme, türet. Her biri, baranın kendi gücünün kendi açısına veya gerilimine göre türevidir:\n\n```\nH_ii = −Q_i − B_ii V_i²        N_ii = P_i / V_i + G_ii V_i\nM_ii =  P_i − G_ii V_i²        L_ii = Q_i / V_i − B_ii V_i\n```\n\nKöşegen dışı elemanlar yalnızca `Y_ik ≠ 0` ise sıfırdan farklıdır. Yani **Jacobian, Ybus ile aynı seyreklik desenine sahiptir.** Büyük sistemlerin çözülebilmesinin nedeni budur.\n\n### Bloklardan basit modellere\n\nİletimde `X ≫ R` ve açı farkları küçüktür. O zaman `N` ve `M` blokları `H` ve `L`'ye göre küçük kalır: aktif güç açıya, reaktif güç gerilime bağlıdır.\n\n| Model | Ne yapar |\n| --- | --- |\n| Tam Newton | Dört bloğu da kullanır |\n| Hızlı ayrık yöntem (FDLF, Fast Decoupled Load Flow) | `N` ve `M` bloklarını atar, kalanları sabit matrislerle değiştirir |\n| DC yük akışı | Bir adım daha ileri gider: yalnızca `P = B θ` kalır |\n\n## Elle örnek: iki bara, iki tur\n\nBu örnek, Newton'un bir turda ne yaptığını sayılarla gösterir.\n\n**Veri.** Bara 1 salınım, `V = 1,0∠0`. Bara 2 yük: `P = 0,5`, `Q = 0,2` pu (per unit, birim değer) çekiyor. Hat `x = 0,1` pu, direnç yok.\n\n**Ybus elemanları.** Hat admitansı `1/(j0,1)` olduğu için:\n\n`B_22 = −10`, `B_21 = +10`, `G = 0`.\n\n**Bara 2 güç denklemleri.** Genel denklemlere bu değerler konunca bara 2 için şu kalır:\n\n```\nP_2 = 10 V_2 sin θ_2\nQ_2 = 10 V_2² − 10 V_2 cos θ_2\n```\n\n**Başlangıç (düz başlatma):** `V_2 = 1,0`, `θ_2 = 0`. Bu, sağlıklı şebekede çözüme yakın bir ilk tahmindir.\n\n### Tur 1\n\nAşağıdaki bloğun adımları:\n\n1. İlk satır, başlangıç tahminiyle bara 2'nin gücünü hesaplar.\n2. İkinci satır artığı bulur. Yük çektiği için verilen güç eksi işaretlidir.\n3. Orta iki satır Jacobian'ın dört elemanını köşegen formüllerinden hesaplar.\n4. Son iki satır düzeltmeyi bulur ve tahmini günceller. N ve M sıfır olduğu için her denklem ayrı bölmeyle çözülür.\n\n```\nP_2 = 0,   Q_2 = 0\nΔP = −0,5 − 0 = −0,5         ΔQ = −0,2 − 0 = −0,2\n\nH = −Q_2 − B_22 V² = 0 + 10 = 10        N = P_2/V + G V = 0\nM =  P_2 − G V²    = 0                  L = Q_2/V − B_22 V = 10\n\nΔθ = −0,5 / 10 = −0,05 rad      ΔV = −0,2 / 10 = −0,02\nθ_2 = −0,05 rad                 V_2 = 0,98\n```\n\n### Tur 2\n\nAşağıdaki bloğun adımları:\n\n1. İlk iki satır, yeni tahminle gücü yeniden hesaplar.\n2. Üçüncü satır kalan artığı verir. Artık şimdiden çok küçülmüştür.\n3. `J` yeni noktada hesaplanmış Jacobian'dır. Artık N ve M sıfır değil, bu yüzden 2×2 sistem birlikte çözülür.\n4. Son iki satır düzeltmeyi ve güncel tahmini verir.\n\n```\nP_2 = 10 × 0,98 × sin(−0,05)             = −0,48980\nQ_2 = 10 × 0,98² − 10 × 0,98 × cos(0,05) = −0,18375\nΔP = −0,01020        ΔQ = −0,01625\n\nJ = [  9,7878  −0,4998 ]\n    [ −0,4898   9,6125 ]\n\nΔθ = −0,001132       ΔV = −0,001748\nθ_2 = −0,051132 rad  V_2 = 0,978252\n```\n\n### Tur 3\n\nArtıklar `−0,00002` ve `−0,00004`. Bu tur sonucun artık değişmediğini doğrular.\n\nSonuç `θ_2 = −0,051134 rad` (−2,93°), `V_2 = 0,978248`.\n\nBu küçük örneğin kapalı çözümü vardır ve aynı sayıyı verir: `V_2 = 0,978248`.\n\n### Yakınsamayı okumak\n\nArtığın gidişine bak: 0,5 → 0,016 → 0,00004.\n\nHer turda hata yaklaşık **karesi** kadar küçülür. Newton'un ayırt edici özelliği budur (ikinci dereceden yakınsama). Üç-beş turda yakınsamayan bir vaka, hasta bir vakadır.\n\n### Üç baralı örnek\n\nÜç baralı örneğin (PV baralı, dirençli) çıktısı `nr_yuk_akisi.py` ile:\n\n- 5 turda artık `7,9e-1 → 4,0e-2 → 3,1e-4 → 2,1e-8 → 4,4e-16`,\n- `V_3 = 0,9515`,\n- kayıp 0,019 pu,\n- salınım barası 0,319 pu üretir.\n\n## Q limiti: PV barası PQ olur\n\nPV barası, gerilimini sabit tutmak için ne kadar reaktif gerekiyorsa onu üretir. Ama generatörün sınırı vardır. Yük akışı bunu şöyle uygular:\n\n1. Yakınsadıktan sonra her PV barasının `Q`'sunu hesapla. Bu adım, santralden istenen reaktifi gösterir.\n2. `Q > Q_max` ise barayı PQ yap, `Q = Q_max` olarak sabitle, gerilimi serbest bırak. Bu adım fiziksel sınırı modele yazar.\n3. Yeniden çöz. Bu adım, sınırlı reaktifle oluşan yeni gerilimleri bulur.\n4. Bara PQ iken gerilimi ayar değerinin üstüne çıkarsa (sınır artık bağlamıyorsa) PV'ye geri al. Bu adım gereksiz yere PQ'da kalmayı önler.\n\nÜç baralı örnekte bara 2 gerilimini 1,02'de tutmak için 0,3995 pu reaktif üretiyor. Sınır 0,10 pu olarak verilince:\n\n| | Sınırsız | `Q_max = 0,10` |\n| --- | --- | --- |\n| Bara 2 tipi | PV | PQ |\n| Bara 2 gerilimi | 1,0200 | 0,9959 |\n| Bara 3 gerilimi | 0,9515 | 0,9399 |\n| Bara 2 reaktif üretimi | 0,3995 | 0,1000 |\n| Salınım barası reaktifi | −0,0046 | +0,2939 |\n\nTabloyu şöyle oku:\n\n- Santral reaktif veremeyince gerilimi tutamadı.\n- Yük barası 0,94'e düştü.\n- Eksik reaktif uzaktaki salınım barasından geldi.\n\nGerilim çökmesinin başlangıç mekanizması budur.\n\n## Yakınsama sorunları\n\nYük akışı yakınsamıyorsa nedeni ya **veri** ya **fizik**tir. Önce veriye bak.\n\n| Belirti | Olası neden | İlk bakılacak yer |\n| --- | --- | --- |\n| İlk turda devasa artık | Birim veya baz hatası (MW yerine pu, ohm yerine pu) | Girdi ölçekleri |\n| Tek bir barada artık küçülmüyor | Ada: baranın şebekeyle bağlantısı yok | Topoloji, bağlı bileşen sayısı |\n| Salınıyor, yakınsamıyor | PV–PQ geçişi iki bara arasında gidip geliyor | Geçiş mantığı, histerezis |\n| Yavaş yakınsıyor, gerilimler düşük | Sistem gerçekten sınıra yakın | Yük seviyesi, reaktif kaynaklar |\n| Hiç yakınsamıyor, yük artınca başladı | Çözüm yok: gerilim çökmesi noktası aşıldı | Yükü kademeli artır (sürekli yük akışı) |\n| Sayısal hata, tekil matris | Sıfıra yakın empedans (kesici, kısa bağlantı), salınım barası yok | Küçük empedanslı dallar |\n\nÇareler:\n\n- daha iyi başlangıç (önceki çözüm veya DC çözümü),\n- adım küçültme (sönümlü Newton),\n- yükü kademeli artırma,\n- reaktif sınırları ilk turlarda uygulamama.\n\nYazılım kuralı: yakınsamayan vaka **sessizce** sonuç dönmemeli. `nr_yuk_akisi.py` bu durumda `YakinsamaHatasi` fırlatır ve artık geçmişini taşır; bunu bir test sabitler.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"Salınım barası en büyük santraldir.\"** | Matematiksel bir gerekliliktir. Seçimi sonuçları (özellikle kayıp dağılımını) etkiler; büyük sistemde dağıtılmış salınım kullanılır. |\n| **\"Yakınsamadıysa tur sayısını artırırım.\"** | Newton beş turda yakınsamadıysa elli turda da yakınsamaz. Nedenini ara. |\n| **\"Yakınsadıysa sonuç doğrudur.\"** | Yanlış veriyle de yakınsar. Ayrıca düşük gerilimli ikinci bir matematiksel çözüm vardır; kötü başlangıç oraya götürebilir. |\n| **\"PV barası hep PV kalır.\"** | Reaktif sınırına dayanınca PQ olur. |\n| **\"Açılar derece girilir.\"** | Denklemlerde radyan. En sık yapılan kod hatasıdır. |\n| **\"DC yük akışı doğru akımdır.\"** | Hayır; alternatif akım şebekesinin doğrusallaştırılmış aktif güç modelidir. |\n\n## Panel takip sorusu\n\nPanelin bu konudan sonra sorabileceği üç soru ve cevapları:\n\n> Mülakatta şöyle söyle — \"Jacobian'ı her turda yeniden mi kurarsın?\" Cevap: tam Newton'da evet. Maliyeti düşürmek için birkaç tur aynı çarpanları kullanan yöntemler ve hızlı ayrık yöntem vardır; yakınsama hızı düşer, tur maliyeti azalır.\n\n> Mülakatta şöyle söyle — \"Düz başlatma neden çoğu zaman çalışır?\" Cevap: sağlıklı şebekede gerilimler 1,0'a, açılar birbirine yakındır; başlangıç çözümün çekim bölgesindedir. Ağır yüklü veya bozuk veride çalışmaz.\n\n> Mülakatta şöyle söyle — \"Dağıtımda Newton neden zorlanır?\" Cevap: R/X oranı yüksek, şebeke radyal, çok kısa ve çok uzun hatlar bir arada; matris kötü koşullu olur. İleri-geri süpürme veya akım enjeksiyonu yöntemi tercih edilir.\n\nAşağıdaki metin, bu sayfanın mülakatta yüksek sesle söylenecek özetidir.\n\n## 90 saniye\n\n> Mülakatta şöyle söyle: \"Yük akışı, verilen üretim ve yük için bara gerilimlerini bulur. Güç gerilimin doğrusal olmayan işlevi olduğu için Newton-Raphson kullanırım: güç artığını hesaplar, Jacobian ile doğrusallaştırır, açı ve gerilim düzeltmesini çözer, tekrarlarım. Jacobian, admitans matrisiyle aynı seyrek yapıdadır ve yakınsama ikinci derecedendir; sağlıklı vaka üç-beş turda biter. Üretim barası reaktif sınırına dayanırsa yük barasına çevirir, yeniden çözerim. Yakınsamayan vakada önce veriye, adaya ve birime, sonra sistemin gerçekten sınırda olup olmadığına bakarım.\"\n"}, {"id": "05-Yuk-Akisi/03-Uc-Faz-Dengesiz-ve-Olasiliksal.md", "group": "05  Yük akışı", "title": "Dengesiz ve olasılıksal yük akışı", "body": "# Dengesiz ve olasılıksal yük akışı\n\nBu sayfa iki konuyu anlatır: dağıtımda fazların neden ayrı modellendiği (dengesiz üç fazlı yük akışı) ve belirsiz girdilerle nasıl hesap yapıldığı (olasılıksal yük akışı).\n\n## Dengesiz üç fazlı yük akışı\n\nİletimde üç faz dengeli kabul edilir ve tek faz çözülür. Dağıtımda bu varsayım tutmaz:\n\n- Evler ve çatı güneşleri tek fazlıdır; fazlara eşit dağılmaz.\n- Hatlar çaprazlanmaz; fazlar arası karşılıklı empedans eşit değildir.\n- Tek ve iki fazlı kol hatlar vardır.\n- Nötr iletkeni akım taşır.\n\nSonuç: her bara üç gerilim, her hat `3 × 3` empedans matrisi ile temsil edilir.\n\nAşağıdaki denklem, hattın uç gerilimini baş gerilimden empedans matrisi ile akımın çarpımını çıkararak bulur:\n\n```\n[ V_a ]         [ V_a ]       [ Z_aa  Z_ab  Z_ac ] [ I_a ]\n[ V_b ]       = [ V_b ]     − [ Z_ba  Z_bb  Z_bc ] [ I_b ]\n[ V_c ] uç      [ V_c ] baş   [ Z_ca  Z_cb  Z_cc ] [ I_c ]\n```\n\nKöşegen dışı elemanlar fazlar arası manyetik kuplajdır. Bir fazdaki akım, diğer fazın gerilimini de düşürür.\n\n> Sade anlatım: Üç faz aynı direğin üstünde yan yana gider. Birinden geçen akım, komşusunun gerilimini de etkiler. Bu yüzden fazları birbirinden bağımsız çözemezsin.\n\n### Yöntemler\n\n| Yöntem | Nasıl çalışır | Nerede |\n| --- | --- | --- |\n| **İleri-geri süpürme** | Geri süpürmede uçtan kaynağa akımlar toplanır, ileri süpürmede kaynaktan uca gerilim düşümleri hesaplanır. Matris çarpanlara ayırmaz; R/X (direnç/reaktans oranı) yüksekliğinden etkilenmez. | Radyal şebeke |\n| **Akım enjeksiyonu / sabit nokta** | OpenDSS'in yaklaşımı: her elemanın admitans matrisi kurulur, doğrusal olmayan yük akım kaynağına çevrilir, yinelenir. | Halkalı şebekeyi de çözer |\n| **Üç faz Newton** | Newton-Raphson'un üç fazlı hâli. | Genel ama Jacobian üç kat büyür |\n\n### Dengesizliğin ölçüsü\n\nGerilim dengesizlik faktörü, ters dizi geriliminin doğru dizi gerilimine oranıdır (`V_2 / V_1`).\n\n- Doğru dizi, dengeli üç fazın normal bileşenidir.\n- Ters dizi, dengesizlikten doğan ters dönen bileşendir.\n\nTipik sınır %2 civarındadır. Dengesizlik motorları ısıtır, nötr akımını ve kaybı artırır.\n\n### Elle örnek: dengesizliğin kayba etkisi\n\nBu örnek, aynı toplam akımın dengesiz dağılınca neden daha fazla kayıp yaptığını gösterir.\n\n**Veri.** Dört telli alçak gerilim hattı, faz ve nötr direnci 0,1 Ω. Toplam yük 300 A.\n\n**Dengeli durum.** Her faz 100 A. Nötr akımı sıfır. Kayıp, üç fazın `I² R` toplamıdır:\n\n```\nKayıp = 3 × 100² × 0,1 = 3,0 kW\n```\n\n**Dengesiz durum.** Fazlar 200, 50 ve 50 A (aynı güç faktörü).\n\nAşağıdaki bloğun adımları:\n\n1. İlk satır nötr akımını bulur. Nötr akımı, üç fazörün toplamıdır. 120° kaymış iki 50 A'lık fazörün gerçel kısmı −25'er A'dır, sanal kısımları birbirini götürür.\n2. İkinci satır kaybı hesaplar: önce üç faz iletkenindeki `I² R`, sonra nötr iletkenindeki `I² R`.\n\n```\nI_n = 200∠0° + 50∠−120° + 50∠120° = 200 − 25 − 25 = 150 A\nKayıp = (200² + 50² + 50²) × 0,1 + 150² × 0,1 = 4,5 + 2,25 = 6,75 kW\n```\n\n**Sonuç.** Aynı toplam akım, **2,25 kat** kayıp (6,75 / 3,0).\n\n- Tek faz eşdeğeriyle çalışan bir yazılım bu farkı göremez.\n- 200 A taşıyan fazın gerilim düşümü diğerlerinden kat kat büyüktür.\n- İlk bant dışına çıkan o fazdaki müşteridir.\n\n## Olasılıksal yük akışı\n\nKlasik yük akışı tek bir senaryo çözer: \"yük 100 MW, rüzgâr 40 MW\". Gerçekte ikisi de belirsizdir.\n\nOlasılıksal yük akışı girdiyi dağılım olarak alır, çıktıyı da dağılım olarak verir: \"bu hattın aşırı yüklenme olasılığı %3\".\n\n> Sade anlatım: Tek bir yarını değil, binlerce olası yarını çözersin. Sonra \"kaçında hat aşırı yüklendi\" diye sayarsın.\n\n### Monte Carlo\n\nYazılımcı için en doğal yöntemdir:\n\n1. Belirsiz girdiler için dağılım tanımla (yük, rüzgâr, güneş; aralarındaki korelasyonla birlikte).\n2. Dağılımlardan bir örnek çek.\n3. Deterministik yük akışını çöz.\n4. Sonucu kaydet.\n5. `N` kez tekrarla; histogram, ortalama, yüzdelik ve ihlal olasılığını çıkar.\n\nHata, örnek sayısının kareköküyle azalır. σ, çıktının standart sapmasıdır:\n\n```\nstandart hata = σ / √N\n```\n\nDoğruluğu on kat artırmak yüz kat örnek ister.\n\n### Elle örnek: kaç örnek gerekir\n\n**Ortalama için.** Bir hattın akışının standart sapması 20 MW. Ortalamayı ±1 MW (bir standart hata) doğrulukla istiyorum.\n\nAşağıdaki satır, standart hata formülünü `N` için çözer ve sayıları koyar:\n\n```\nN = (σ / hata)² = (20 / 1)² = 400 örnek\n```\n\n±0,1 MW için 4
