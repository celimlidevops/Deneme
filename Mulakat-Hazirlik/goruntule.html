 doğrudan ilgili iş varsa: şu projede şu kadar süre şunu yaptım.] Güç sistemi analizinde iş tecrübem yok; lisans derslerim var ve son haftalarda yük akışını, durum kestirimini ve ekonomik dağıtımı sıfırdan kodlayıp elle çözülmüş örneklerle doğruladım. Getirdiğim şey, analiz kodunu test edilebilir ve servis edilebilir hale getirme disiplini.\"\n\nCümledeki üç teknik terim:\n\n- **Yük akışı:** şebekedeki her baranın gerilimini ve her hattan geçen gücü hesaplamak.\n- **Durum kestirimi:** gürültülü ölçümlerden şebekenin en olası gerilim ve açı değerlerini bulmak.\n- **Ekonomik dağıtım:** talebi santraller arasında en düşük maliyetle paylaştırmak.\n\n## Tablo\n\n\"Kanıtın\" sütununu kendin doldur. Köşeli parantez içindekiler örnek kalıptır; senin gerçeğin değilse silinir.\n\n| # | İlan maddesi | Dürüst durum | Kanıtın (sen doldur) | Açığı nasıl kapatıyorsun |\n| --- | --- | --- | --- | --- |\n| 1 | Elektrik enerjisi ve şebekeleri alanında geliştirilen yazılım projelerinde aktif çalışmış olmak | Büyük ihtimalle **boş veya dolaylı** | [Varsa: proje, rol, süre. Yoksa: \"Enerji alanında yazılım projem olmadı.\"] | `14-Programlama/ornekler`: sıfırdan Newton-Raphson, WLS, ekonomik dağıtım, 7 test |\n| 2 | Güç Sistemleri Analizi ve Güç Dağıtım Sistemleri dersleri | Transkripte bağlı | [Ders adı, dönem, not] | `02`, `04`, `05` klasörleri |\n| 3 | Güvenlik ve kararlılık analizleri, durum kestirimi çalışması | **Boş** | [\"İş olarak yapmadım.\"] | `07`, `08`, `09` elle örnekler; `wls_durum_kestirimi.py` |\n| 4 | Optimizasyon teknikleri ve programlama (Java, Python, JavaScript, MATLAB) | **Güçlü** (programlama), optimizasyon değişken | [Dil, yıl, üretimdeki proje] | `13` klasörü; `linprog` ile DC-OPF örneği |\n| 5 | Dağıtım, koruma, kararlılık, ekonomik işletme, planlama dersleri | Transkripte bağlı | [Ders adı, not. Almadıysan: \"almadım\"] | `04`, `08`, `10`, `11`, `12` |\n| 6 | Güç sistemleri analiz yazılımları ile çalışma | Büyük ihtimalle **boş** | [\"PowerFactory ve PSS/E kullanmadım.\"] | pandapower ile aynı iş akışı: `15/02` |\n| 7 | Lisansüstü çalışma veya motivasyon | Motivasyon | [Hangi problem, neden] | `19/02` |\n| 8 | Yeni uygulama geliştirme teknolojilerini öğrenme motivasyonu | **Güçlü** | [Son öğrendiğin teknoloji, nasıl öğrendin, nereye uyguladın] | — |\n| 9 | Araştırmaya istek, analitik düşünme, problem çözme | **Güçlü olabilir** | [Kök nedenini bulduğun bir üretim hatası: belirti, hipotez, test, sonuç] | — |\n| 10 | Koordinasyon, organizasyon, planlama | **Güçlü** (teknik liderlik) | [Ekip büyüklüğü, teslim, bağımlılık yönetimi] | `19/02` araştırma ortamına çeviri |\n\n### Tablodaki terimler\n\n| Terim | Anlamı |\n| --- | --- |\n| Newton-Raphson | Yük akışını yinelemeli olarak çözen yöntem |\n| WLS | Weighted Least Squares, ağırlıklı en küçük kareler. Durum kestiriminin temel yöntemi |\n| `wls_durum_kestirimi.py` | `14-Programlama/ornekler` altındaki WLS örnek betiği |\n| DC-OPF | DC Optimal Power Flow. Yalnızca aktif gücü hesaplayan doğrusal yaklaşık modelle optimal güç akışı |\n| `linprog` | Python SciPy kütüphanesindeki doğrusal programlama çözücüsü |\n| PowerFactory | DIgSILENT firmasının güç sistemi analiz yazılımı |\n| PSS/E | Power System Simulator for Engineering. Siemens'in iletim analiz yazılımı |\n| pandapower | Açık kaynaklı Python güç sistemi analiz kütüphanesi |\n| `15/02`, `19/02` | `15` ve `19` klasörlerindeki `02` numaralı dosya |\n\n### Maddeler duruma göre gruplanınca\n\n| Grup | Maddeler |\n| --- | --- |\n| Güçlü | 4 (programlama), 8, 10; 9 güçlü olabilir |\n| Boş veya büyük ihtimalle boş | 1, 3, 6 |\n| Transkripte bağlı | 2, 5 |\n| Motivasyon | 7 |\n\n## Transkript taraması\n\n2 ve 5 numaralı maddeler \"ders almış olmak\" der. Bu, transkriptinle doğrulanabilir tek tercih sebebidir ve panel transkripti görür.\n\nTranskriptini aç ve şu adlara benzeyen dersleri işaretle:\n\n- Güç Sistemleri Analizi\n- Enerji İletimi\n- Enerji Dağıtımı\n- Elektrik Makineleri\n- Yüksek Gerilim Tekniği\n- Güç Elektroniği\n- Koruma\n- Elektrik Tesisleri\n- Enerji Ekonomisi\n- Kontrol Sistemleri\n- Sayısal Yöntemler\n- Optimizasyon\n\nHer biri için üç bilgi yaz: dönem, not, hatırladığın tek konu.\n\nNotun düşükse saklama.\n\n> Mülakatta şöyle söyle: \"O dönem zayıftım, şimdi şu örneği elle çözebiliyorum.\" Ve çöz.\n\n## Güçlü maddeni nasıl söylersin\n\nZayıf: \"Yazılımda iyiyim.\"\n\nGüçlü:\n\n> Mülakatta şöyle söyle: \"[Kaç] yıldır üretimde çalışan sistemler geliştiriyorum. [Sistem] için [ölçek] yükte [karar] verdim. Analiz yazılımında bunun karşılığı şu: yük akışı ıraksadığında servis sessizce boş sonuç dönmemeli, nedenini ve son artığı dönmeli. Yazdığım örnekte bunu bir testle sabitledim.\"\n\nİki terim:\n\n- **Iraksamak:** yinelemeli çözümün bir sonuca yaklaşmayıp uzaklaşması.\n- **Artık:** denklemin o adımda ne kadar sağlanmadığını gösteren fark. Sıfıra yaklaşıyorsa çözüm yakınsıyordur.\n\nBu cümle 1 numaralı maddedeki boşluğu örtmez. Ama 4, 8 ve 9'u kanıtlar ve panele, eksik olan alan bilgisinin üstüne ne koyacağını gösterir.\n\n## Yaygın yanlış\n\n- **\"Enerji sektöründeki bir müşteriye yazılım yaptıysam bu şebeke yazılımıdır.\"** Müşteri enerji şirketi olabilir, yazılım muhasebe yazılımıdır. İkisini ayır ve olduğu gibi söyle.\n- **\"Boş maddeyi atlarım, sormazlar.\"** İlanın en üstteki maddesidir. Sorarlar.\n- **\"Kullanmadığım aracı 'biraz baktım' diye söylerim.\"** Takip sorusu \"hangi modülünü?\" olur. `15/02` dosyasındaki dürüst kalıbı kullan.\n- **\"Liderlik tecrübem her kapıyı açar.\"** Kadro araştırmacı kadrosudur. Liderliği \"teknik karar ve koordinasyon\" olarak çevir, \"yöneticilik\" olarak değil.\n\nAşağıdaki konuşma bir örnektir, bir özgeçmiş değildir. Kendi güçlü ve boş maddelerini söyle.\n\n## 90 saniye\n\n\"İlandaki on maddeye dürüst bakınca üçü bende güçlü: programlama, yeni teknolojiyi öğrenme ve koordinasyon. Üçü boş: şebeke yazılımı projesi, güvenlik ve kestirim çalışması, ticari analiz yazılımı. Boş olanları dolu göstermeyeceğim. Bunun yerine son haftalarda ne yaptığımı gösterebilirim: yük akışını, durum kestirimini ve ekonomik dağıtımı sıfırdan kodladım, elle çözülmüş örneklerle doğruladım ve testlerini yazdım. Getirdiğim katkı, analiz kodunu üretim kalitesine taşıma tecrübesi; öğrenmem gereken de alanın kendisi.\"\n\n## Bu sayfayı dene\n\nÇoktan seçmeli. Bilemediğin soru tarayıcıda saklanır ve doğru bilinene kadar yeniden sorulur.\n\n[Bu sayfanın sorularına geç](test.html?sayfa=01-04)\n"}, {"id": "01-Kurum-Ilan-ve-Surec/05-Envanter-ve-Online-Degerlendirme.md", "group": "01  Kurum, ilan, süreç", "title": "Envanter ve online değerlendirme", "body": "# Envanter ve online değerlendirme\n\nMülakattan önce bir ön değerlendirme gelebilir. Bu sayfa, ilanın bu konuda ne dediğini, neyi demediğini ve üç olası biçime nasıl hazırlanacağını anlatır.\n\nTerimler:\n\n- **Envanter:** kişilik ve yetkinlik anketi. Doğru cevabı yoktur.\n- **Online değerlendirme:** internet üzerinden yapılan test; yetenek testi veya teknik sınav olabilir.\n\n## İlan ne diyor\n\nBaşvuru süreci, (f) maddesi:\n\n\"Mülakata çağrılacak adaylar, mülakat öncesi uygulama olarak envanter/teknik değerlendirmeye ve/veya online değerlendirme araçları kullanılarak değerlendirmeye tabi tutulabileceklerdir.\"\n\nKesin olan budur. \"Tutulabilecekler\" yazar; yapılacağı kesin değildir.\n\nİlanda **yazmayanlar**:\n\n- hangi aracın kullanılacağı,\n- kaç soru olacağı,\n- sonucun mülakat puanına nasıl yansıyacağı.\n\nÇağrı e-postası geldiğinde orada yazanı esas al ve belirsizse İnsan Kaynakları'na sor.\n\n### İlandan bilinen diğer süreç bilgileri\n\n| Konu | İlandaki bilgi |\n| --- | --- |\n| Kaç aday çağrılır | Formül puanına göre sıralamada kontenjanın 10 katı aday çağrılır: 3 kişilik kadro için yaklaşık 30 aday |\n| Kim sıralanır | Mülakatta 100 üzerinden 70 ve üzeri alanlar sıralanır |\n| Kaç kişi seçilir | 3 asil, en fazla 3 yedek |\n| Duyuru nerede | `mam.tubitak.gov.tr` ve `tubitak.gov.tr` |\n\n**Formül puanı**, ilanda tanımlanan formülle hesaplanan ve mülakata kimin çağrılacağını belirleyen ön sıralama puanıdır. **MAM**, TÜBİTAK Marmara Araştırma Merkezi'dir; **TÜBİTAK**, Türkiye Bilimsel ve Teknolojik Araştırma Kurumu'dur.\n\nKariyer sistemindeki e-posta adresini ve istenmeyen posta klasörünü her gün kontrol et.\n\n## Üç olası biçim ve hazırlığı\n\nBiçim ilanda yazmadığı için üçüne de hazırlanılır. Hangisinin geleceği bilinmiyor.\n\n| Biçim | Neyi ölçer | Senin için risk |\n| --- | --- | --- |\n| Kişilik ve yetkinlik envanteri | Tutarlılık | Rol yapmak |\n| Genel yetenek testi | Sayısal, sözel, şekil akıl yürütme | Süre baskısı |\n| Teknik değerlendirme veya kodlama | Alan bilgisi veya kod | Güç sistemi soruları |\n\n### 1. Kişilik ve yetkinlik envanteri\n\nDoğru cevabı yoktur. Ölçtüğü şey tutarlılıktır: aynı özellik farklı cümlelerle birkaç kez sorulur.\n\n- Olduğun gibi işaretle. \"İdeal aday\" profilini oynamak, tekrar eden sorularda çelişki üretir.\n- Her maddeye uç cevap verme. \"Her zaman\" ve \"asla\" çok sayıda olunca profil güvenilmez görünür.\n- Fazla düşünme. İlk tepki çoğunlukla en tutarlı olandır.\n- Mülakatta envanter sonucu önlerinde olabilir. \"Tek başına çalışmayı tercih ederim\" işaretleyip mülakatta \"tam bir takım oyuncusuyum\" dersen bu fark sorulur.\n\n### 2. Genel yetenek testi\n\nSayısal, sözel ve şekil akıl yürütme. Süre baskısı ana zorluktur.\n\n- Takıldığın soruyu geç. Bu testlerde her sorunun değeri çoğu zaman eşittir.\n- Yüzde, oran, tablo ve grafik okuma ile sayı dizilerinden birer deneme çöz. Amaç bilgi değil tempo.\n- Yanlışın puan götürüp götürmediğini yönergeden oku. Götürmüyorsa boş bırakma.\n\n### 3. Teknik değerlendirme veya kodlama\n\nSenin profilinde iki yöne gidebilir.\n\n#### Kodlama\n\nBurada rahatsın. Risk, soruyu güç sistemi bağlamında sormalarıdır:\n\n- \"Bu admitans matrisini kur.\"\n- \"Bu ölçümlerden en küçük kareler çözümünü bul.\"\n\nTerimler:\n\n- **Admitans matrisi (Ybus):** şebekedeki baraların birbirine hangi iletkenlikle bağlı olduğunu tutan matris. Yük akışının girdisidir.\n- **En küçük kareler:** ölçümlerle modelin farkının karelerini en aza indiren çözüm. Durum kestiriminin temelidir.\n\nHazırlık: `14-Programlama/ornekler/nr_yuk_akisi.py` içindeki `ybus_kur` ve `nr_coz` işlevlerini bakmadan yeniden yaz. Ayrıntı `14/02` dosyasında.\n\n- `ybus_kur`: admitans matrisini kuran işlev.\n- `nr_coz`: yük akışını Newton-Raphson (NR) yöntemiyle çözen işlev. NR, sonucu adım adım düzelterek yaklaşan yinelemeli yöntemdir.\n\n#### Güç sistemi çoktan seçmeli\n\nZayıf tarafın. Hazırlık: `20-Soru-Bankasi` ve `21-Calisma-Plani/Mini-Sinavlar`.\n\nHesap sorularında üç refleks:\n\n1. **Birimi yaz.** kV mı V mu, MW mı pu mu, hat gerilimi mi faz gerilimi mi.\n2. **Mertebe kontrolü yap.** 154 kV'ta 100 MVA yaklaşık 375 A eder. Sonucun 37 kA çıktıysa √3 veya bin katı kaçmıştır.\n3. **Seçenekleri ele.** Dört seçenekten ikisi çoğunlukla √3 veya kare hatasının sonucudur.\n\nBirimler:\n\n| Birim | Anlamı |\n| --- | --- |\n| V, kV | Volt, kilovolt (1000 volt) |\n| MW | Megavat; aktif güç |\n| MVA | Megavolt-amper; görünür güç |\n| A, kA | Amper, kiloamper (1000 amper) |\n| pu | Per unit, birim değer. Büyüklüğün seçilen bir baz değere oranı |\n\n**Hat gerilimi** iki faz arasındaki gerilimdir. **Faz gerilimi** bir fazla nötr arasındaki gerilimdir. Aralarında √3 kat fark vardır; çoğu hata buradan çıkar.\n\nMertebe kontrolündeki 375 A şöyle bulunur:\n\n1. Üç fazlı görünür güç formülü: akım = görünür güç / (√3 × hat gerilimi). Bu adım hangi formülün kullanılacağını belirler.\n2. Değerleri koy: 100.000.000 VA / (√3 × 154.000 V). Bu adım birimleri temel birime (VA ve V) çevirir; kV–MVA karışıklığını önler.\n3. Payda: √3 × 154.000 ≈ 266.700. Bu adım √3'ü unutmadığını garantiler.\n4. Sonuç: 100.000.000 / 266.700 ≈ 375 A. Bu, cevabın olması gereken mertebedir; kA mertebesinde bir sonuç bir şeyin kaçtığını gösterir.\n\n## Teknik hazırlık\n\n- Sabit internet, şarjlı bilgisayar, yedek olarak telefon bağlantısı.\n- Kamera ve mikrofon istenebilir. Önceden dene.\n- Tarayıcı sekmesi değiştirmenin kaydedildiği araçlar vardır. Yönergede izin verilmeyen hiçbir şeyi açma.\n- Sessiz oda, kâğıt, kalem, izin veriliyorsa hesap makinesi.\n- Bağlantı koparsa: ekran görüntüsü al, saati yaz, aynı gün İnsan Kaynakları'na e-posta at.\n\n## Yaygın yanlış\n\n- **\"Envanteri geçmek için hazırlanılır.\"** Envanter geçilmez, tutarlı doldurulur.\n- **\"Online test önemsizdir, asıl mülakat.\"** Otuz adayın arasından sıyrılmak için kullanılan ilk veri olabilir.\n- **\"Teknik testte yazılım sorulur, hazırım.\"** İlanın alanı güç sistemidir. Zayıf tarafından sorulacağını varsay.\n- **\"Süre yeter.\"** Bu testler bilerek yetmeyecek şekilde tasarlanır.\n\nAşağıdaki konuşma metni dört parçalıdır: ilanın ne dediği ve ne demediği, envanter, yetenek testi, teknik test.\n\n## 90 saniye\n\n\"İlan, mülakattan önce envanter veya online değerlendirme yapılabileceğini söylüyor; biçimini söylemiyor. Üç ihtimale hazırlandım. Envanteri olduğum gibi ve tutarlı doldururum. Genel yetenek testinde tempoyu korur, takıldığımı geçerim. Teknik testte birimi yazar, mertebeyi kontrol eder, seçenek elerim. Kodlama gelirse admitans matrisini ve Newton-Raphson döngüsünü bakmadan yazabiliyorum.\"\n\n## Bu sayfayı dene\n\nÇoktan seçmeli. Bilemediğin soru tarayıcıda saklanır ve doğru bilinene kadar yeniden sorulur.\n\n[Bu sayfanın sorularına geç](test.html?sayfa=01-05)\n"}, {"id": "02-Guc-Sistemleri-Temelleri/00-Alt-Basliklar.md", "group": "02  Temeller", "title": "02 — Güç sistemleri temelleri", "body": "# 02 — Güç sistemleri temelleri\n\nBu sayfa klasörün içindekiler listesidir. Her madde bir alt başlıktır. Altındaki cümle, o konuda ne öğreneceğini söyler.\n\n1. **Anlık, etkin ve ortalama güç; aktif, reaktif, görünür güç**\n   Gücün neden ikiye ayrıldığını ve ekipmanın neden görünür güce (MVA) göre boyutlandığını öğreneceksin.\n2. **Fazör ve açı referansı**\n   Bir sinüsü büyüklük ve açıdan oluşan tek bir karmaşık sayıyla anlatmayı ve açının neden bir referans baraya göre söylendiğini öğreneceksin.\n3. **Tek faz eşdeğer ve üç faz dengeli varsayım**\n   Dengeli bir üç faz sistemde neden yalnızca bir fazı çözmenin yettiğini öğreneceksin.\n4. **Yıldız-üçgen, hat gerilimi ve faz gerilimi**\n   \"400 kV\" denince hangi gerilimin kastedildiğini ve √3 çarpanının nereden geldiğini öğreneceksin.\n5. **Güç üçgeni, güç faktörü, kompanzasyonun anlamı**\n   Güç faktörünü düzeltmenin akımı ve kaybı nasıl düşürdüğünü öğreneceksin.\n6. **Birim sistem: neden, baz seçimi, trafo kayması**\n   Farklı gerilim seviyelerini per-unit (birim değer) ile tek matriste toplamayı ve trafo plakası değerini sistem bazına çevirmeyi öğreneceksin.\n7. **Tek hat şeması ve bara-hat modeli**\n   Üç fazlı şebekenin tek çizgiyle nasıl gösterildiğini ve her elemanın bir admitansla nasıl modellendiğini öğreneceksin.\n8. **İletim hattı: kısa, orta, uzun; π modeli; sürşarj empedansı**\n   Hat uzunluğuna göre hangi modelin kullanıldığını ve hattın doğal gücünü (SIL) öğreneceksin.\n9. **Trafo modeli: sargı, kademe, kaydırma açısı, mıknatıslanma**\n   Trafonun yük akışı ve kısa devre hesabına hangi parçalarla girdiğini öğreneceksin.\n10. **Senkron makine: iç gerilim, senkron, geçici ve alt geçici reaktans**\n    Generatörün üç farklı reaktansının hangi hesapta kullanıldığını öğreneceksin.\n11. **Yük modelleri: sabit güç, sabit akım, sabit empedans, ZIP, frekans bağımlılığı**\n    Yükün gerilim ve frekans değişince çektiği gücü nasıl değiştirdiğini öğreneceksin.\n12. **Simetrik bileşenler: artı, eksi, sıfır dizi**\n    Dengesiz bir üç faz durumu üç dengeli diziye ayırmayı öğreneceksin.\n13. **Dizi şebekelerinin arıza bağlantı kuralları**\n    Her arıza türünde artı, eksi ve sıfır dizi devrelerinin nasıl bağlandığını öğreneceksin.\n14. **P–δ ilişkisi ve senkronizasyon gücü**\n    Aktif gücün iki bara arasındaki açı farkıyla nasıl aktığını ve açı marjının neden 90°'de bittiğini öğreneceksin.\n15. **Q–V ilişkisi ve gerilim desteği**\n    Reaktif gücün gerilimi nasıl belirlediğini ve neden yerinde üretilmesi gerektiğini öğreneceksin.\n16. **Kapasitenin üç sınırı: termik, gerilim, kararlılık**\n    Bir hattın taşıyabileceği gücü sınırlayan üç ayrı nedeni öğreneceksin.\n17. **Frekans ve gerilimin sistem sağlığı göstergesi olması**\n    Frekansın aktif güç dengesini, gerilimin reaktif güç dengesini gösterdiğini öğreneceksin.\n18. **Dengeli analiz ile dengesiz analizin sınırı**\n    Tek hat ve per-unit yaklaşımının nerede yetmediğini ve ne zaman simetrik bileşenlere geçildiğini öğreneceksin.\n"}, {"id": "02-Guc-Sistemleri-Temelleri/01-Guc-Birim-Sistem-Modeller.md", "group": "02  Temeller", "title": "Büyüklükler, birim sistem ve modeller", "body": "# Büyüklükler, birim sistem ve modeller\n\nBu sayfa klasörün yoğun özetidir. İlk kez okuyorsan önce `02`–`06` dosyalarını oku, bu sayfaya en son gel. Burada her konu kısa tutulmuş ama hiçbir olgu atlanmamıştır.\n\n## Güç\n\nGerilim ve akım sinüs biçimindeyse (sinüzoidal durum), onları fazörle, yani büyüklük ve açıdan oluşan karmaşık sayıyla anlatmak yeter.\n\nAnlık güç iki parçaya ayrılır:\n\n- **Ortalama kısım:** iş yapan, zamanla değişmeyen kısım.\n- **Salınım kısmı:** frekansın iki katında gidip gelen kısım.\n\nÜç faz dengeli sistemde üç fazın salınımları birbirini götürür. Toplam anlık güç sabittir. Bu yüzden iletim planlaması etkin değerle (RMS, aynı ısıyı üreten doğru akım eşdeğeri) yürür.\n\nAşağıdaki blok, gücün temel formüllerini toplar. `S` görünür güç, `P` aktif güç, `Q` reaktif güç, `V_f` ve `I_f` faz büyüklükleri, `V_L` ve `I_L` hat büyüklükleridir. `*` karmaşık eşlenik demektir. `pf` güç faktörüdür (power factor).\n\n```\nS = P + jQ = 3 V_f I_f* = √3 V_L I_L*\n|S| = √(P² + Q²)\npf = P / |S| = cos φ\nQ > 0  endüktif (akım geride)\n```\n\nİşaret sözleşmesini her yazılımda kontrol et. Bazı paketler yükü pozitif çeker, bazıları enjeksiyonu (baraya verilen gücü) pozitif sayar.\n\n> Mülakatta şöyle söyle: \"İşaret sözleşmesini baştan sabitlerim.\" Bu cümle hata ayıkladığını gösterir.\n\nGüç faktörünü düzeltmek, aynı aktif güç için akımı düşürür. Hat kaybı ve gerilim düşümü farklı şeylere bağlıdır:\n\n| Büyüklük | Neye bağlı |\n| --- | --- |\n| Hat kaybı | `I²R`, yani akımın karesi ve direnç |\n| Gerilim düşümü | Hem `R` hem `X` (reaktans) |\n\nHangi parametrenin baskın olduğu gerilim seviyesine göre değişir:\n\n| Seviye | Baskın parametre |\n| --- | --- |\n| İletim | `X` baskın |\n| Dağıtım OG (orta gerilim) | `R` ve `X` birlikte |\n| Dağıtım AG (alçak gerilim) | `R` baskınlaşır |\n\n> Mülakatta şöyle söyle: \"İletim formülünü dağıtıma neden taşımam?\" sorusunun cevabı bu tek cümledir: iletimde X baskın, AG'de R baskındır.\n\n## Fazör ve referans\n\nGerilim açısı bağıl bir büyüklüktür. Tek başına anlamı yoktur, bir referansa göre söylenir.\n\n- Slack (salınım) baranın açısı referanstır, yani 0 kabul edilir.\n- Aktif güç, gerilim açısı yüksek olan baradan düşük olan baraya akar.\n- Mutlak zaman bilgisi ancak PMU (Phasor Measurement Unit, fazör ölçüm birimi) ile gelir.\n- Klasik SCADA (Supervisory Control and Data Acquisition, uzaktan izleme ve kontrol sistemi) faz açısını doğrudan ölçmez. Açıyı durum kestirimi hesaplar.\n\n## Birim sistem\n\nBüyük şebekede 400 kV ile 0,4 kV aynı matriste buluşur. Per-unit (birim değer, pu) her büyüklüğü bir baz değere bölerek bunu ölçekler. Ayrıca trafo sargılarının dönüştürme oranını yutar, böylece admitans matrisi sadeleşir.\n\nAşağıdaki blok dört temel büyüklüğün pu tanımını ve iki türetilmiş bazı verir. `I_baz` ve `Z_baz`, seçilen `S_baz` ve `V_baz`'dan hesaplanır.\n\n```\nS_pu = S_gercek / S_baz\nV_pu = V_gercek / V_baz\nI_pu = I_gercek / I_baz ,   I_baz = S_baz / (√3 V_baz)\nZ_pu = Z_gercek / Z_baz ,   Z_baz = V_baz² / S_baz\n```\n\nKurallar:\n\n- Sistemde tek `S_baz` seçilir. 100 MVA alışkanlıktır; paket ne kullanıyorsa onu söyle.\n- Her gerilim bölgesinin kendi `V_baz`'ı vardır. Nominal gerilim çoğunlukla baz alınır.\n- `Z_pu` yeni baza `Z_yeni = Z_eski * (S_yeni/S_eski) * (V_eski/V_yeni)²` ile taşınır.\n- Trafo kaçak reaktansı kendi plaka bazında verilir. Sistem bazına çevrilmeden Ybus'a (bara admitans matrisi) girmez.\n- Kademe, off-nominal oran (nominalden farklı dönüştürme oranı) `t` olarak π modeline girer. Admitans `y/t²`, `y/t` şeklinde iki yana dağılır. Faz kaydırıcıda `t` karmaşık olur.\n- Per-unit güç üç faz toplamıdır. Tek faz formülüyle üç faz gücünü karıştırmak klasik hatadır.\n\nMülakat türevi, adım adım:\n\n1. 400 kV'ta 100 MVA bazda `Z_baz = V²/S = 1600 ohm`. Bu adım, o gerilim bölgesinde \"1 pu empedans\" kaç ohm eder onu bulur.\n2. 10 ohm'luk bir hat `10/1600 = 0,00625 pu`'dur, yani çok kısadır. Bu adım ohm değerini baza bölerek elektriksel uzunluğu gösterir.\n3. Aynı ohm, 34,5 kV'ta çok daha büyük pu olur. Çünkü `Z_baz` gerilimin karesiyle küçülür.\n\n> Mülakatta şöyle söyle: \"400 kV'ta 100 MVA bazda Z_baz = V²/S = 1600 ohm. 10 ohm'luk bir hat 10/1600 = 0,00625 pu'dur, yani çok kısadır. Aynı ohm, 34,5 kV'ta çok daha büyük pu olur.\"\n\nBu örnek, kısa devre gücünün gerilimle neden patladığını da anlatır.\n\n## Tek hat ve şebeke elemanları\n\nTek hat şeması, üç fazın simetrik olduğunu varsayar ve üç fazı tek çizgiyle gösterir. Üzerindeki her elemanın bir admitansı veya bir eşdeğer devresi vardır.\n\n### Hat\n\nHat modeli uzunluğa göre seçilir:\n\n| Hat | Model |\n| --- | --- |\n| Kısa | Kapasite ihmal edilir, yalnız seri `Z` |\n| Orta | Nominal π: seri `Z`, iki uca yarı yarıya şönt `B/2` |\n| Uzun | Dağıtılmış parametre, ABCD parametreleri veya hiperbolik fonksiyonlar |\n\n- 150 km üstü pratikte uzun sayılır.\n- 400 kV'ta Ferranti etkisi (açık uçta gerilim yükselmesi) π modeliyle bile görünür.\n- Sürşarj empedansı (karakteristik empedans) `Zc = √(z/y)`'dir.\n- Doğal güç (SIL, Surge Impedance Loading) `SIL ≈ V²/Zc`'dir.\n- Hattı SIL altında işletmek kapasitif, üstünde endüktif davranış üretir.\n- 400 kV havai hatta SIL kabaca birkaç yüz MW mertebesindedir.\n\n> Mülakatta şöyle söyle: \"Rakamı hat verisinden hesaplarım, ezberlemem.\"\n\n### Trafo\n\nTrafo modelinin parçaları:\n\n- Seri kaçak empedansı.\n- Kademe.\n- İsteğe bağlı kaydırma açısı.\n- İsteğe bağlı mıknatıslanma kolu.\n\nMıknatıslanma kolu yük akışında çoğu zaman ihmal edilir. Kısa devrede ve ferrorezonansta (demir çekirdek ile kapasitenin doğrusal olmayan rezonansı) ihmal edilmez.\n\nÜç sargılı trafo üç bara ve bir yıldız noktasıyla modellenir.\n\nOLTC (On-Load Tap Changer, yük altında kademe değiştirici) gerilimi kademe adımıyla tutar. Adım çoğunlukla %1–1,25'tir. Dinamik ve günlük işletmede kademe değişimi ayrı bir kontrol döngüsüdür. Kademe sınırına dayanmış trafo, gerilim sorununu \"daha fazla kademe\" ile çözemez.\n\n### Senkron makine\n\nSenkron makinede üç farklı reaktans üç farklı hesaba girer:\n\n| Durum | Kullanılan model |\n| --- | --- |\n| Sürekli hal | İç gerilim ve senkron reaktans: `E = V + j X_s I` |\n| Açı kararlılığı | Geçici reaktans ve atalet |\n| Kısa devrenin ilk çevrimleri | Alt geçici reaktans `X''` akımı belirler |\n\nÜç reaktansı karıştırmak hem kararlılık hem kesici hesabını bozar.\n\n### Yük\n\n- Sabit P-Q, planlama ve iletim yük akışının varsayılanıdır.\n- Gerçek yük, gerilim düşünce gücünü azaltır.\n- ZIP modeli (Z: sabit empedans, I: sabit akım, P: sabit güç karışımı) `P = P0 (a_z V² + a_i V + a_p)` şeklindedir.\n- Gerilim kararlılığında sabit güç kötümser, sabit empedans iyimser sonuç verir. Hangi varsayımı kullandığını söylemeden \"sistem çöker\" deme.\n- Motor yükü ek olarak frekansa ve yeniden yol alma akımına duyarlıdır.\n\n## Simetrik bileşenler\n\nDengesiz arıza ve dengesiz yükte üç fazı faz faz yazmak zordur. Simetrik bileşenler, üç fazı üç ayrık, dengeli diziye böler. Bu dönüşüm Fortescue dönüşümüdür.\n\nAşağıdaki blok, dizi gerilimlerinden (`V0`, `V1`, `V2`) faz gerilimlerine (`Va`, `Vb`, `Vc`) geçişi gösterir. `a`, 120° döndürme operatörüdür.\n\n```\n[Va]   [1  1  1] [V0]\n[Vb] = [1  a² a] [V1]\n[Vc]   [1  a  a²] [V2]\n\na = e^{j120°} = -1/2 + j√3/2\n```\n\nTers dönüşümde `V1`, `V2`, `V0` aynı matrisin eşleniğiyle, 1/3 çarpanıyla gelir.\n\n| Dizi | Anlamı |\n| --- | --- |\n| Artı dizi | Normal işletmenin döndüğü şebeke |\n| Eksi dizi | Ters yönlü döner alan. Generatör rotorunda ısınır, korumada dengesizlik ölçüsüdür |\n| Sıfır dizi | Üç fazda aynı yönlü akım. Dönüş yolu topraktan veya nötrden geçer. Üçgen sargı ve topraklanmamış yıldız sıfır diziyi geçirmez |\n\nHat ve trafonun artı ve eksi dizi empedansı pratikte yakındır. Sıfır dizi çok farklıdır. Onu toprak dönüşü, kule, guard teli (koruma iletkeni) ve trafo bağlantı grubu belirler. Kısa devre yazılımında \"sıfır dizi verisi yok\" ise sonuç çöptür.\n\nArıza yerinde dizi devrelerinin bağlantısı:\n\n| Arıza | Dizi bağlantısı |\n| --- | --- |\n| Üç faz dengeli | Yalnız artı dizi |\n| Tek faz-toprak | Üç dizi seri |\n| İki faz | Artı ve eksi paralel, sıfır yok |\n| İki faz-toprak | Üçü birden, artıya eksi ve sıfırın paraleli |\n\nTopraklama direnci ve arıza direnci bu eşdeğer devreye seri girer. Dirençli arıza, metalik arızadan daha küçük akım ve daha zor algılanan röle koşulu demektir.\n\n## P–δ ve Q–V\n\nKısa bir hatta direnç ihmal edilirse iki uç arasındaki güç akışı aşağıdaki gibidir. `V_s` gönderen uç, `V_r` alıcı uç gerilimi, `X` hat reaktansı, `δ` iki uç arasındaki açı farkıdır.\n\n```\nP = (V_s V_r / X) sin δ\nQ_r ≈ (V_r (V_s cos δ - V_r)) / X\n```\n\nKüçük açıda `P` açıyla, `Q` gerilim farkıyla gider. Operatör sezgisi buradan gelir:\n\n- Aktif güç dengesi frekansı ve açıyı belirler.\n- Reaktif güç dengesi gerilimi belirler.\n\nDağıtımda `R` büyükse bu ayrışma bozulur; aktif güç de gerilimi oynatır. Çatı güneşinin AG'de gerilimi yükseltmesinin nedeni budur.\n\nSenkronizasyon gücü, açı biraz değişince gücün ne kadar değiştiğidir: `dP/dδ = (V_s V_r / X) cos δ`.\n\n- Açı 90°'ye geldikçe bu türev sıfıra iner. Sistem açı olarak marjını kaybeder.\n- Kararlı hal açı sınırı ile geçici hal sınırı aynı sayı değildir.\n- Geçici halde atalet ve arıza temizleme süresi devreye girer.\n\n## Kapasitenin üç sınırı\n\nBir hattın taşıyabileceği güç üç ayrı nedenle sınırlanır:\n\n1. **Termik:** iletken sıcaklığı, sehim, hızlandırılmış yaşlanma. Mevsim ve rüzgârla değişir. Dinamik hat kapasitesi bu sınırı ölçümle gevşetir.\n2. **Gerilim:** özellikle uzun ve zayıf hatlarda, yük artınca alıcı uç çöker veya hafif yükte Ferranti etkisiyle yükselir.\n3. **Kararlılık:** açı, gerilim veya bölgeler arası salınım.\n\nKısa hatlar çoğunlukla termik sınıra, uzun hatlar kararlılık sınırına takılır.\n\nYazılım \"hat yüzde 80 yüklü\" diyorsa bunun hangi limite göre yüzde olduğunu sor. Termik yüzde ile kararlılık marjı aynı eksen değildir.\n\nAşağıdaki metin, bu sayfanın tamamını mülakatta 90 saniyede anlatmak içindir.\n\n## 90 saniye\n\n> “Dengeli işletmede tek hat ve per-unit yeter. Güç aktif ve reaktif diye ayrılır; iletimde P açıyla, Q gerilimle gider, dağıtımda R yüzünden bu ayrışır. Arıza ve dengesizlikte simetrik bileşenlere inerim: tek faz-toprak üç diziyi seri bağlar, sıfır dizi ise trafo bağlantısı ve topraklamayla belirlenir. Hat kapasitesini termik, gerilim ve kararlılık diye üç ayrı limite bölerim.”\n"}, {"id": "02-Guc-Sistemleri-Temelleri/02-Sifirdan-AC-Devre-ve-Fazor.md", "group": "02  Temeller", "title": "Sıfırdan: alternatif akım, fazör, güç", "body": "# Sıfırdan: alternatif akım, fazör, güç\n\nBu sayfa, elektrikle yıllardır uğraşmamış bir yazılımcı için yazıldı. Diğer bütün klasörler buradaki altı fikre dayanır.\n\nBurayı tahtada anlatabiliyorsan gerisi formül değil, uygulama olur.\n\n## 1. Neden alternatif akım ve neden yüksek gerilim\n\nGüç, gerilim ile akımın çarpımıdır. Aynı gücü yüksek gerilimde taşırsan akım düşer.\n\nHat kaybı akımın karesiyle gider: `P_kayıp = 3 I² R`. Buradaki 3, üç fazın her birindeki kaybın toplanmasıdır.\n\nGerilimi kolayca yükseltip düşüren cihaz trafodur. Trafo yalnızca alternatif akımda (AC) çalışır. İletimin 400 kV olmasının nedeni budur.\n\n### Elle: 100 MW'ı faz başına direnci 10 Ω olan bir hattan taşı\n\nAdım 1, 154 kV'ta:\n\n- Akım `100 MW / (√3 × 154 kV) = 375 A`. Bu adım, üç faz güç formülünden hat akımını bulur.\n- Kayıp `3 × 375² × 10 = 4,2 MW`, yani %4,2. Bu adım, akımın karesini direnç ve faz sayısıyla çarpıp kaybı bulur.\n\nAdım 2, 400 kV'ta:\n\n- Akım 144 A. Aynı formül, yalnızca gerilim değişti.\n- Kayıp 0,63 MW, yani %0,6. Aynı kayıp formülü, küçük akımla.\n\nAdım 3, karşılaştırma:\n\n- Gerilim 2,6 kat arttı, kayıp 6,75 kat düştü.\n- Oran, gerilim oranının karesidir. Bu adım, kaybın gerilimin karesiyle ters orantılı olduğunu gösterir.\n\n## 2. Sinüs ve etkin değer\n\nŞebeke gerilimi saniyede 50 kez salınan bir sinüstür: `v(t) = V_tepe sin(ωt + φ)`.\n\n| Büyüklük | Değer |\n| --- | --- |\n| Frekans | 50 Hz |\n| Periyot | 20 ms |\n| Açısal hız | `ω = 2π × 50 = 314 rad/s` |\n\nMühendis tepe değeri değil etkin değeri (RMS, Root Mean Square) söyler. Etkin değer, aynı ısıyı üreten doğru akım eşdeğeridir: `V_etkin = V_tepe / √2`.\n\nPrizdeki 230 V etkin değerdir; tepe 325 V'tur. Bu notlardaki bütün kV ve A değerleri etkin değerdir.\n\n## 3. Fazör: sinüsü iki sayıyla anlatmak\n\nFrekans herkes için aynıysa (50 Hz), bir sinüsü ayırt eden iki şey kalır: büyüklüğü ve açısı. Fazör bu ikiliyi tek bir karmaşık sayıda tutar: `V = |V| ∠φ = |V| (cos φ + j sin φ)`.\n\n> Sade anlatım: zaman ekseni olan bir sinyali, iki alanlı sabit bir yapıya indirgiyoruz. Karşılığında türev ve integral, karmaşık sayı çarpma ve bölmesine dönüşüyor.\n\nGüç sistemi analizinin tamamı bu sadeleştirmenin üstünde durur.\n\n`j`, mühendislikte `i` yerine kullanılır, çünkü `i` akımdır.\n\nAçı mutlak değildir. Bir bara referans seçilir (açısı 0), diğerleri ona göre söylenir. Yük akışındaki salınım barası bu referanstır.\n\n## 4. Üç eleman: direnç, bobin, kondansatör\n\n| Eleman | Empedans | Akım ile gerilim | Nerede karşına çıkar |\n| --- | --- | --- | --- |\n| Direnç R | `R` | Aynı fazda | İletken kaybı |\n| Bobin L | `jωL = jX_L` | Akım 90° geride | Hat, trafo, motor |\n| Kondansatör C | `1/(jωC) = -jX_C` | Akım 90° önde | Hat kapasitesi, kablo, kompanzasyon |\n\nEmpedans `Z = R + jX` karmaşık dirençtir. Ohm yasası aynen geçerlidir: `V = Z I`.\n\nAdmitans empedansın tersidir: `Y = 1/Z = G + jB`. `G` iletkenlik, `B` süseptanstır.\n\nŞebeke matrisi (Ybus, bara admitans matrisi) admitansla kurulur, çünkü paralel elemanlar admitansta toplanır.\n\nÖrnek: 31,83 mH bobin 50 Hz'te `X = 314 × 0,03183 = 10 Ω` eder. Bu hesap, `X_L = ωL` formülüne açısal hızı ve henry cinsinden endüktansı koyar.\n\n## 5. Güç: aktif, reaktif, görünür\n\nGerilim ile akım aynı fazda değilse, çarpımlarının bir kısmı iş yapar, bir kısmı kaynak ile alan arasında gidip gelir.\n\n| Güç | Birim | Anlamı |\n| --- | --- | --- |\n| Aktif güç P | MW | İş yapan kısım. Motoru döndürür, ısıtır |\n| Reaktif güç Q | Mvar | Bobinin manyetik alanı ile kondansatörün elektrik alanını her çeyrek periyotta doldurup boşaltan kısım. Ortalaması sıfırdır, ama akımı gerçektir |\n| Görünür güç S | MVA | İkisinin vektör toplamı. Ekipman S'ye göre boyutlanır, çünkü ısınma akıma bağlıdır |\n\nAşağıdaki blok üç gücün ilişkisini verir. `*` eşlenik demektir.\n\n```\nS = V I* = P + jQ        (* eşlenik demektir)\n|S| = √(P² + Q²)\ngüç faktörü = cos φ = P / |S|\n```\n\nReaktif güç neden önemli? İş yapmaz ama hattı doldurur, kayıp üretir ve gerilimi düşürür.\n\n> Sade anlatım: reaktif güç, yararlı yük taşımayan ama bant genişliğini tüketen trafik gibidir.\n\nReaktif güç tamamen yok edilmez, çünkü motor ve trafo manyetik alan olmadan çalışmaz. Hedef, onu yükün yanında üretip uzun hatta gezdirmemektir.\n\nİşaret sözleşmesi:\n\n- Endüktif yük (motor) reaktif güç **tüketir**. Q pozitif, akım geridedir.\n- Kondansatör reaktif güç **üretir**.\n- \"Geri\" ve \"ileri\" güç faktörü buradan gelir.\n\n## Elle örnek\n\n230 V etkin gerilim, `Z = 10 + j10 Ω` yük.\n\n1. `|Z| = √(10² + 10²) = 14,14 Ω`, açısı 45°. Bu adım, empedansı büyüklük ve açı biçimine çevirir.\n2. `I = 230 / 14,14 = 16,26 A`, açısı −45°. Akım geride, yük endüktif. Bu adım, Ohm yasasıyla akımı bulur; açı, empedans açısının eksi işaretlisidir.\n3. `|S| = 230 × 16,26 = 3741 VA`. Bu adım, görünür gücü gerilim ve akım büyüklüklerinin çarpımı olarak bulur.\n4. `P = 3741 × cos 45° = 2645 W`, `Q = 3741 × sin 45° = 2645 var`. Bu adım, görünür gücü aktif ve reaktif bileşenlerine ayırır.\n5. Güç faktörü 0,707 geri. Bu adım, `cos 45°`'yi güç faktörü olarak okur; akım geride olduğu için \"geri\" denir.\n\nKontrol: `P = I² R = 16,26² × 10 = 2645 W`. Tuttu. Bu kontrol, aktif gücün yalnızca dirençte harcandığını kullanarak sonucu doğrular.\n\nYorum: bu yük 2645 W iş yapıyor ama kaynak 3741 VA'lık akım taşıyor. Aradaki fark reaktif güçtür.\n\n## Yaygın yanlış\n\n- **\"Reaktif güç kayıp güçtür.\"** Hayır. Reaktif güç harcanmaz, gidip gelir. Kayıp, onun akımının dirençte ürettiği ısıdır.\n- **\"Güç faktörü 1 ise akım yoktur.\"** Hayır. Güç faktörü 1, akımın tamamının iş yaptığını söyler.\n- **\"Tepe değer ile etkin değer aynı tabloda toplanır.\"** Hayır. Notlarda ve standartlarda aksi yazmıyorsa her şey etkin değerdir.\n- **\"Empedans dirençle aynıdır.\"** Direnç empedansın gerçek kısmıdır. İletim hattında sanal kısım (reaktans) dirençten 5–10 kat büyüktür; analizlerin çoğunda belirleyici olan odur.\n- **\"j bir birimdir.\"** Değil. 90° faz kaymasını taşıyan sayıdır: `j² = −1`.\n\n## Panel takip sorusu\n\n\"Reaktif güç iş yapmıyorsa neden parasını konuşuyoruz?\"\n\n> Mülakatta şöyle söyle: \"Akımı büyütür, hat ve trafo kapasitesini tüketir, kayıp ve gerilim düşümü üretir. Bu yüzden yükün yanında kompanze edilir ve dağıtımda reaktif enerji bedeli vardır.\"\n\n\"Fazör neyi varsayar?\"\n\n> Mülakatta şöyle söyle: \"Tek frekans ve sürekli hal. Arıza anındaki milisaniyelik geçici olaylar ve harmonikler fazörle tam anlatılmaz; orada zaman tanım bölgesi (EMT) gerekir.\"\n\nEMT, Electromagnetic Transients (elektromanyetik geçici olaylar) demektir; sinyali fazör yerine zamanda adım adım çözer.\n\nAşağıdaki metin, bu sayfanın tamamını mülakatta 90 saniyede anlatmak içindir.\n\n## 90 saniye\n\n> \"Şebeke 50 Hz sinüstür; frekans ortak olduğu için her gerilimi ve akımı büyüklük ve açıdan oluşan bir fazörle, yani karmaşık sayıyla anlatırım. Bobin akımı geriletir, kondansatör ilerletir; ikisi empedansın sanal kısmıdır. Güç ikiye ayrılır: iş yapan aktif güç ve alanları doldurup boşaltan reaktif güç. Reaktif güç harcanmaz ama akım taşıdığı için kapasiteyi doldurur, kayıp ve gerilim düşümü yaratır. Yüksek gerilim, aynı gücü küçük akımla taşıyıp kaybı akımın karesiyle düşürmek içindir.\"\n"}, {"id": "02-Guc-Sistemleri-Temelleri/03-Uc-Faz-ve-Per-Unit-Elle.md", "group": "02  Temeller", "title": "Üç faz ve birim sistem, elle", "body": "# Üç faz ve birim sistem, elle\n\n## Üç faz neden var\n\nÜç iletkende, aralarında 120° olan üç sinüs taşınır. Üç yararı vardır:\n\n1. Aynı iletken miktarıyla daha çok güç.\n2. Toplamı sabit olan (titreşimsiz) anlık güç.\n3. Motorda kendiliğinden dönen manyetik alan.\n\nDengeli sistemde üç faz akımının toplamı sıfırdır. Bu yüzden dönüş iletkenine gerek kalmaz.\n\nİki gerilim vardır ve karıştırılması en sık yapılan hatadır:\n\n| Gerilim | Nerede ölçülür |\n| --- | --- |\n| Faz gerilimi | Bir faz ile nötr arası |\n| Hat gerilimi | İki faz arası. `V_hat = √3 × V_faz` |\n\n\"400 kV hat\" derken hat gerilimi söylenir. Faz gerilimi `400 / √3 = 230,9 kV`'tur. Evdeki 400/230 V da aynı ilişkidir.\n\nBağlantı türleri:\n\n| Bağlantı | Yapı | Sargı hangi gerilimi görür |\n| --- | --- | --- |\n| Yıldız (Y) | Üç sargının bir ucu ortak noktada (nötr) birleşir. Nötr topraklanabilir | Faz gerilimi |\n| Üçgen (Δ) | Sargılar uç uca kapanır, nötr yoktur | Hat gerilimi |\n\nÜç faz güç, hat büyüklükleriyle aşağıdaki gibi yazılır. `cos φ` güç faktörüdür.\n\n```\nS = √3 × V_hat × I_hat\nP = √3 × V_hat × I_hat × cos φ\n```\n\nDengeli sistemde üç fazı ayrı ayrı çözmeyiz. Bir fazı çözeriz, diğer ikisi 120° kaymış kopyasıdır. Tek hat şeması bu varsayımın çizimidir.\n\nVarsayım iki yerde bozulur: dengesiz arızada ve dağıtımın tek fazlı yüklerinde. Orada simetrik bileşenler veya üç faz model gerekir.\n\n## Elle örnek 1: akım ve reaktif güç\n\n400 kV'ta 300 MW, güç faktörü 0,95 geri.\n\n1. `S = 300 / 0,95 = 315,8 MVA`. Bu adım, aktif gücü güç faktörüne bölerek görünür gücü bulur.\n2. `I = 315,8 MVA / (√3 × 400 kV) = 455,8 A`. Bu adım, üç faz güç formülünden hat akımını çeker.\n3. `Q = 300 × tan(arccos 0,95) = 300 × 0,3287 = 98,6 Mvar`. Bu adım, güç faktörünün açısını bulup tanjantıyla reaktif gücü hesaplar.\n\nAynı güç 154 kV'ta 1184 A ister. Gerilim katının neden var olduğu bu sayıdadır.\n\n## Birim sistem (per-unit)\n\nŞebekede 400 kV ile 0,4 kV yan yanadır. Gerçek birimle çalışırsan iki sorun çıkar:\n\n- Her trafoda oran çarpmak zorunda kalırsın.\n- Sayılar altı basamak farklı olur.\n\nBirim sistem (per-unit, pu) her büyüklüğü bir baza böler:\n\n```\ndeğer_pu = gerçek değer / baz değer\n```\n\n> Sade anlatım: yazılımcı gözüyle bu bir normalizasyondur.\n\nÜç kazancı vardır:\n\n1. Trafo oranları kaybolur.\n2. Sağlıklı gerilim hep 1,0 civarındadır. 0,93 gördüğünde sorun olduğunu hemen anlarsın.\n3. Sayısal çözücü iyi koşullu matrisle çalışır.\n\nİki baz seçilir, diğerleri türetilir. Aşağıdaki blokta ilk iki satır seçilen, son iki satır türetilen bazlardır.\n\n```\nS_baz    : bütün sistem için tek değer (alışkanlık 100 MVA)\nV_baz    : her gerilim bölgesinin nominal hat gerilimi\nI_baz    = S_baz / (√3 × V_baz)\nZ_baz    = V_baz² / S_baz\n```\n\n## Elle örnek 2: bazlar ve çevirme\n\n154 kV bölgesi, 100 MVA baz.\n\n1. `Z_baz = 154² / 100 = 237,16 Ω`. Bu adım, bu gerilim bölgesinde 1 pu empedansın kaç ohm ettiğini bulur.\n2. `I_baz = 100 MVA / (√3 × 154 kV) = 374,9 A`. Bu adım, bu bölgede 1 pu akımın kaç amper ettiğini bulur.\n3. Reaktansı 20 Ω olan hat: `20 / 237,16 = 0,0843 pu`. Bu adım, ohm değerini empedans bazına bölerek pu'ya çevirir.\n4. Hattan 0,8 pu akım geçiyorsa: `0,8 × 374,9 = 300 A`. Bu adım, pu akımı akım bazıyla çarparak tekrar ampere döndürür.\n\nAynı 20 Ω, 400 kV bölgesinde `Z_baz = 1600 Ω` olduğundan 0,0125 pu eder. Aynı ohm, yüksek gerilimde elektriksel olarak çok daha kısadır.\n\n## Elle örnek 3: baz değiştirme\n\nTrafo plakası: 50 MVA, kısa devre empedansı %10. Bu değer trafonun **kendi** bazındadır. Sistem bazı 100 MVA ise aşağıdaki formülle çevrilir.\n\nBlokta ilk satır genel formül, ikinci satır sayıların yerine konmuş halidir.\n\n```\nZ_yeni = Z_eski × (S_yeni / S_eski) × (V_eski / V_yeni)²\n       = 0,10 × (100 / 50) × 1 = 0,20 pu\n```\n\nAdımların anlamı:\n\n1. `Z_eski = 0,10`. Plakadaki %10, pu olarak 0,10'dur.\n2. `S_yeni / S_eski = 100 / 50`. Bu çarpan, güç bazı büyüdükçe pu empedansın da büyüdüğünü hesaba katar.\n3. `(V_eski / V_yeni)² = 1`. Gerilim bazı değişmediği için ikinci çarpan 1'dir.\n4. Sonuç `0,20 pu`.\n\nKüçük trafo, büyük bazda daha büyük empedans görünür. Bu çevirme yapılmadan matrise giren trafo, kısa devre hesabını iki kat şaşırtır.\n\n## Yaygın yanlış\n\n- **\"400 kV faz gerilimidir.\"** Hayır, hat gerilimidir. Faz gerilimi 231 kV.\n- **\"Üç faz güç, 3 × V × I'dır.\"** Hat büyüklükleriyle `√3 × V × I`, faz büyüklükleriyle `3 × V_faz × I_faz`. İkisi aynı sonucu verir; karıştırınca √3 kat hata çıkar.\n- **\"Per-unit yüzde demektir.\"** Yakındır ama aynı değil: 1,0 pu = %100. Trafo plakası yüzde yazar, matris pu ister.\n- **\"Plaka empedansı sistem bazındadır.\"** Hayır, cihazın kendi anma gücündedir. Her zaman çevrilir.\n- **\"Per-unit'te güç tek faz gücüdür.\"** Hayır. `S_baz` üç faz toplamıdır.\n\n## Panel takip sorusu\n\n\"İki farklı gerilim bölgesini per-unit nasıl birleştirir?\"\n\n> Mülakatta şöyle söyle: \"Her bölgenin gerilim bazı trafonun anma oranıyla seçilir; o zaman ideal trafo per-unit'te 1:1 olur ve devreden düşer. Kademe nominalden farklıysa bu fark, modelde off-nominal oran olarak kalır.\"\n\n\"Baz gücü 100 yerine 1000 MVA seçsem sonuç değişir mi?\"\n\n> Mülakatta şöyle söyle: \"Fiziksel sonuç değişmez, per-unit sayılar ölçeklenir. İki ayrı yazılımın sonucu tutmuyorsa ilk baktığım yer baz farkıdır.\"\n\nAşağıdaki metin, bu sayfanın tamamını mülakatta 90 saniyede anlatmak içindir.\n\n## 90 saniye\n\n> \"Üç faz, 120 derece arayla üç sinüstür; dengeliyken tek fazını çözer, tek hat şemasıyla gösteririm. Hat gerilimi faz geriliminin kök üç katıdır ve 400 kV dediğimizde hat gerilimini söyleriz. Güç kök üç çarpı hat gerilimi çarpı akımdır. Farklı gerilim katlarını tek matriste toplamak için birim sistem kullanırım: tek güç bazı, bölge başına gerilim bazı, empedans bazı gerilimin karesi bölü güç. Trafo plakası kendi bazındadır, sisteme girmeden çeviririm.\"\n"}, {"id": "02-Guc-Sistemleri-Temelleri/04-Ybus-Elle-ve-Seyrek-Matris.md", "group": "02  Temeller", "title": "Ybus matrisi: elle kurulum ve seyrek yapı", "body": "# Ybus matrisi: elle kurulum ve seyrek yapı\n\nYbus (bara admitans matrisi), şebekenin kendisidir. Yük akışı, kısa devre, durum kestirimi ve güvenlik analizi aynı matrisi kullanır.\n\nMülakatta \"üç baralı bir şebekenin Ybus'unu yaz\" sorusu, temel bilgisini ölçmenin en kısa yoludur.\n\n## Tanım\n\nHer bara için Kirchhoff akım yasası yazılır: baraya giren akım, o baradan hatlara çıkan akımların toplamıdır. Bunu bütün baralar için matrisle yazınca tek denklem çıkar:\n\n```\nI = Y V\n```\n\n| Sembol | Anlamı |\n| --- | --- |\n| `I` | Bara enjeksiyon akımları (baraya dışarıdan verilen akım) |\n| `V` | Bara gerilimleri |\n| `Y` | Bara admitans matrisi |\n\nKurulum iki kuraldan ibarettir:\n\n- **Köşegen dışı:** `Y_ik = −y_ik`. İki bara arasındaki hattın admitansının eksilisi. Hat yoksa sıfır.\n- **Köşegen:** `Y_ii`, o baraya bağlı bütün admitansların toplamı. Hatlar, hat şöntleri, kapasitör, reaktör dahil.\n\nÖnce empedansı admitansa çevirirsin: `y = 1/z`. Saf reaktans için `1/(jx) = −j/x`.\n\n## Elle örnek: üç bara\n\nHatlar (direnç ihmal): `z12 = j0,10`, `z13 = j0,20`, `z23 = j0,25` pu.\n\nAdım 1, admitanslar. Bu adım, her hattın empedansını `1/(jx) = −j/x` kuralıyla admitansa çevirir.\n\n```\ny12 = 1/(j0,10) = −j10\ny13 = 1/(j0,20) = −j5\ny23 = 1/(j0,25) = −j4\n```\n\nAdım 2, köşegen dışı (eksilisi). Bu adım, iki bara arasındaki admitansın işaretini çevirip matrisin simetrik iki hücresine yazar.\n\n```\nY12 = Y21 = +j10\nY13 = Y31 = +j5\nY23 = Y32 = +j4\n```\n\nAdım 3, köşegen (bağlı olanların toplamı). Bu adım, her baraya dokunan bütün hat admitanslarını toplar.\n\n```\nY11 = y12 + y13 = −j15\nY22 = y12 + y23 = −j14\nY33 = y13 + y23 = −j9\n```\n\nSonuç. Bu blok, üç adımın çıktısını tek matriste birleştirir.\n\n```\n        [ −j15   j10    j5  ]\nYbus =  [  j10  −j14    j4  ]\n        [  j5    j4    −j9  ]\n```\n\nKontrol: şönt eleman yoksa her satırın toplamı sıfırdır. −15 + 10 + 5 = 0. Tuttu.\n\nBu kontrol, elle kurulumda hata yakalamanın en hızlı yoludur.\n\n## Dirençli hat ve şönt\n\nGerçek hatta direnç vardır: `z = 0,02 + j0,10`.\n\nAşağıdaki blok bu hattın admitansını hesaplar. Ortadaki adım, pay ve paydayı eşlenikle çarpıp paydayı gerçek sayı yapar.\n\n```\ny = 1/(0,02 + j0,10) = (0,02 − j0,10) / (0,02² + 0,10²) = 1,923 − j9,615\n```\n\nEşlenikle çarpıp paydayı gerçek yaparsın. Gerçek kısım iletkenlik `G`, sanal kısım süseptans `B`'dir. `Y = G + jB`.\n\nHattın kapasitesi π modelinde iki uca yarı yarıya şönt olarak konur:\n\n- Toplam şönt `jb` ise her iki uçtaki baranın köşegenine `jb/2` eklenir.\n- Köşegen dışına eklenmez.\n- O zaman satır toplamı artık sıfır olmaz; kalan değer baranın toprağa şöntüdür.\n\nKademeli trafoda (oran `t`), seri admitans `y` ise:\n\n| Hücre | Değer |\n| --- | --- |\n| Kademe tarafındaki köşegen | `y/t²` |\n| Diğer köşegen | `y` |\n| Köşegen dışları | `−y/t` |\n\nKademe 1,0 iken sıradan bir hatla aynıdır.\n\n## Seyrek matris\n\nGerçek şebekede bir bara ortalama 2–4 komşuya bağlıdır.\n\nOn bin baralı sistemde:\n\n- Matrisin 100 milyon hücresi vardır.\n- Sıfırdan farklı olan yaklaşık 40 bin tanesidir.\n- Doluluk on binde dörttür.\n\nYazılım sonucu:\n\n- Yoğun (dense) saklarsan 100 milyon karmaşık sayı, yaklaşık 1,6 GB eder. Seyrek saklarsan bir megabaytın altındadır.\n- Yoğun çarpanlara ayırma `n³` ile, seyrek çözücü yaklaşık `n` ile büyür. Fark, saatler ile milisaniyeler arasıdır.\n- Biçimler: kurarken koordinat listesi (COO, Coordinate), çözerken sıkıştırılmış satır veya sütun (CSR, Compressed Sparse Row; CSC, Compressed Sparse Column).\n- Matrisin tersi alınmaz. Tersi yoğundur, yani seyrekliği yok eder. Bunun yerine LU çarpanları (alt üçgen L ve üst üçgen U matrisleri) saklanır ve her sağ taraf için ileri-geri yerine koyma yapılır.\n- Çarpanlara ayırırken yeni sıfır olmayanlar oluşur (fill-in). Satır ve sütunları akıllı sıralamak (minimum derece, AMD, Approximate Minimum Degree) bunu azaltır.\n- Güç sistemi için özel olarak yazılmış çözücü KLU'dur.\n\nPython karşılığı:\n\n- Matrisi tutmak için `scipy.sparse.csr_matrix`.\n- Çözmek için `scipy.sparse.linalg.spsolve`.\n- Çarpanları saklamak için `splu`.\n\n`14-Programlama/ornekler/nr_yuk_akisi.py` çözümü `spsolve` ile yapar.\n\nYbus ayrıca simetriktir (faz kaydırıcı trafo yoksa).\n\nZbus (bara empedans matrisi), Ybus'un tersidir. Yoğundur ve kısa devre hesabında yalnızca gereken sütunu hesaplanır.\n\n## Yaygın yanlış\n\n- **\"Köşegen dışı elemanlar pozitif admitanstır.\"** Hayır, eksilisidir. İşaret hatası en sık yapılan hatadır.\n- **\"Hat şöntü köşegen dışına da girer.\"** Hayır, yalnız köşegene.\n- **\"Ybus'un tersini alıp gerilimi bulurum.\"** Küçük örnekte olur, gerçek sistemde bellek ve süre patlar. Çarpanlara ayır, yerine koy.\n- **\"İki bara arasında bağlantı yoksa küçük bir değer yazarım.\"** Sıfır yazılır. Tersine, kesiciyi çok küçük empedansla modellemek matrisi sayısal olarak hasta eder; iki barayı birleştirmek doğrusudur.\n- **\"Ybus topolojiden bağımsızdır.\"** Bir kesici açıldığında değişir. N-1 analizinde (her seferinde bir elemanın devre dışı kaldığı senaryolar) her arıza için baştan kurmak yerine düşük ranklı güncelleme veya LODF (Line Outage Distribution Factor, hat açılma dağılım katsayısı) kullanılır.\n\n## Panel takip sorusu\n\n\"Bir hat devre dışı kalırsa Ybus'ta ne değişir?\"\n\n> Mülakatta şöyle söyle: \"Dört eleman. İki köşegenden `y` çıkar, iki köşegen dışı sıfırlanır. Bütün matrisi yeniden çarpanlara ayırmadan düşük ranklı güncelleme yapılabilir.\"\n\n\"Satır toplamı ne zaman sıfır olmaz?\"\n\n> Mülakatta şöyle söyle: \"Toprağa şönt varsa: hat kapasitesi, kapasitör, reaktör, nominalden farklı kademe.\"\n\nAşağıdaki metin, bu sayfanın tamamını mülakatta 90 saniyede anlatmak içindir.\n\n## 90 saniye\n\n> \"Ybus, akım eşittir admitans çarpı gerilim denkleminin matrisidir. Köşegen dışına iki bara arasındaki admitansın eksilisini, köşegene o baraya bağlı bütün admitansların toplamını yazarım; şöntler yalnız köşegene girer. Şönt yoksa satır toplamı sıfırdır, bu benim hata kontrolümdür. Matris seyrektir, çünkü bir bara birkaç komşuya bağlıdır. Tersini almam; seyrek LU çarpanlarını saklar, her çözümde yerine koyma yaparım.\"\n"}, {"id": "02-Guc-Sistemleri-Temelleri/05-Reaktif-Guc-Kompanzasyon-Gerilim.md", "group": "02  Temeller", "title": "Reaktif güç kontrolü, kompanzasyon, gerilim regülasyonu", "body": "# Reaktif güç kontrolü, kompanzasyon, gerilim regülasyonu\n\n## Ana fikir\n\nFrekans ve gerilim farklı şeyleri gösterir:\n\n| Büyüklük | Kapsam | Neyin göstergesi |\n| --- | --- | --- |\n| Frekans | Bütün sistemde aynı | Aktif güç dengesi |\n| Gerilim | **Yerel** | Reaktif güç dengesi |\n\nBir bölgede reaktif güç eksikse o bölgenin gerilimi düşer. Uzaktaki bir santral bunu düzeltemez, çünkü reaktif güç uzun hatta taşınırken hattın kendi reaktansında tüketilir.\n\nBu yüzden kural: **reaktif güç, tüketildiği yerde üretilir.**\n\nKim üretir, kim tüketir:\n\n| Tüketen | Üreten |\n| --- | --- |\n| Motorlar, trafolar | Senkron generatör (aşırı uyarılı) |\n| Ağır yüklü hat (I²X) | Şönt kapasitör |\n| Şönt reaktör | Hafif yüklü hat ve kablo (kapasitesi) |\n| Düşük uyarılı generatör | STATCOM, SVC, senkron kompanzatör |\n\nTablodaki kısaltmalar: STATCOM (Static Synchronous Compensator, statik senkron kompanzatör, güç elektroniğiyle reaktif üreten veya çeken cihaz), SVC (Static Var Compensator, tristörle anahtarlanan kapasitör ve reaktör grubu).\n\nAynı hat, yüke göre iki rol oynar:\n\n- Ağır yükte reaktif tüketir, gerilim düşer.\n- Hafif yükte kendi kapasitesi baskın gelir, reaktif üretir, alıcı uç gerilimi yükselir (Ferranti etkisi).\n\nGece 400 kV hatlarda şönt reaktörün devreye alınmasının nedeni budur.\n\n## Gerilim düşümü formülü\n\nKısa bir hat için yaklaşık gerilim düşümü aşağıdadır. `P` aktif güç, `Q` reaktif güç, `R` direnç, `X` reaktans, `V` gerilimdir.\n\n```\nΔV ≈ (P R + Q X) / V\n```\n\nİletimde `X` dirençten çok büyüktür, bu yüzden gerilimi belirleyen `Q`'dur. Dağıtımda `R` büyüktür, `P` de gerilimi oynatır.\n\n## Elle örnek 1: gerilim düşümü\n\n34,5 kV fider, `R = 2 Ω`, `X = 4 Ω`. Yük 6 MW ve 3 Mvar.\n\nAdım 1, kompanzasyonsuz durum. Bu adım, formüle hem aktif hem reaktif katkıyı koyar ve sonucu nominal gerilime bölerek yüzdeye çevirir.\n\n```\nΔV = (6 × 2 + 3 × 4) / 34,5 = 24 / 34,5 = 0,696 kV   → %2,02\n```\n\nAdım 2, yük kendi reaktifini yerinde üretirse (`Q = 0`). Bu adım, reaktif terimi sıfırlayıp yalnızca aktif gücün etkisini bırakır.\n\n```\nΔV = (6 × 2) / 34,5 = 0,348 kV   → %1,01\n```\n\nGerilim düşümü yarıya indi. Kondansatörün işi budur.\n\n## Elle örnek 2: kompanzasyon hesabı\n\n10 MW yük, güç faktörü 0,80 geri. Hedef 0,95.\n\n1. Mevcut reaktif: `Q₀ = 10 × tan(arccos 0,80) = 10 × 0,75 = 7,50 Mvar`. Bu adım, şu anki güç faktörü açısından yükün çektiği reaktifi bulur.\n2. Hedef reaktif: `Q₁ = 10 × tan(arccos 0,95) = 10 × 0,3287 = 3,29 Mvar`. Bu adım, hedef güç faktöründe şebekeden çekilmesine izin verilen reaktifi bulur.\n3. Gereken kondansatör: `Q_c = 7,50 − 3,29 = 4,21 Mvar`. Bu adım, aradaki farkı kondansatörün yerinde üretmesi gereken miktar olarak alır.\n4. Görünür güç 12,5 MVA'dan 10,53 MVA'ya iner. Akım oranı 0,842. Bu adım, aynı gerilimde akımın görünür güçle orantılı düştüğünü gösterir.\n5. Kayıp akımın karesiyle gider: `0,842² = 0,709`. **Kayıp %29 azalır.** Bu adım, akım oranının karesini alarak kayıp oranına geçer.\n\nAktif güç değişmedi. Değişen, hattın taşıdığı gereksiz akımdır.\n\n## Araçlar ve zaman ölçekleri\n\n| Araç | Tepki | Özellik |\n| --- | --- | --- |\n| Generatör uyarması (AVR) | Milisaniye–saniye | Sürekli, sınırı makinenin ısıl eğrisi |\n| STATCOM | Milisaniye | Hem üretir hem tüketir. Gerilim düşse de akımını korur |\n| SVC | Onlarca milisaniye | Ürettiği reaktif, gerilimin karesiyle düşer |\n| Şönt kapasitör, reaktör | Saniye–dakika | Kademeli, ucuz. Kapasitör tam ihtiyaç anında zayıflar |\n| Yük altında kademe değiştirici (OLTC) | Onlarca saniye | Reaktif üretmez, gerilimi bir taraftan diğerine kaydırır |\n| Evirici (volt-var) | Milisaniye | Güneş ve depolama, MVA sınırı içinde |\n\nTablodaki kısaltmalar: AVR (Automatic Voltage Regulator, otomatik gerilim regülatörü), OLTC (On-Load Tap Changer). Volt-var, eviricinin gerilime göre reaktif güç ayarlaması demektir.\n\nİki inceliği bil.\n\n**Kondansatör gerilim düşünce zayıflar.** Ürettiği reaktif `Q = V² / X_c`'dir. Gerilim %10 düşerse üretimi %19 düşer (`0,9² = 0,81`). Yani en çok gerektiği anda en az verir. STATCOM bu yüzden gerilim çökmesinde üstündür. MAM'ın (TÜBİTAK Marmara Araştırma Merkezi) milli STATCOM ürünü bu ailedendir.\n\n**Kademe değiştirici reaktif güç üretmez.** Yük tarafının gerilimini yükseltirken iletim tarafından daha çok reaktif çeker. Reaktif açık varken kademe ile gerilim kurtarmaya çalışmak iletimi daha da zorlar. Uzun dönem gerilim çökmesinin mekanizması budur (`08` klasörü).\n\n## Gerilim kontrol hiyerarşisi\n\n| Katman | Ne yapar | Zaman |\n| --- | --- | --- |\n| Birincil | Generatör AVR'si ve STATCOM, kendi barasını tutar | Saniyenin altı |\n| İkincil | Bir bölgenin pilot barasının gerilimini, o bölgedeki reaktif kaynakları koordine ederek tutar | Dakika |\n| Üçüncül | Bütün sistem için gerilim ayar noktalarını kaybı en aza indirecek şekilde seçer. Bu, reaktif optimal güç akışıdır | — |\n\nYTBS'nin (Yük Tevzi Bilgi Sistemi) \"gerilim planlaması\" modülü üçüncül katmandır.\n\nGeneratörün ne kadar reaktif verebileceğini yetenek eğrisi (capability curve) belirler. Eğriyi üç sınır çizer:\n\n1. Armatür akımı.\n2. Uyarma akımı.\n3. Düşük uyarma kararlılık sınırı.\n\nAktif güç arttıkça verebileceği reaktif azalır. Yük akışındaki `Qmin` ve `Qmax` bu eğriden gelir.\n\n## Yaygın yanlış\n\n- **\"Gerilim düşükse kademeyi yükseltirim, sorun biter.\"** Kademe reaktif üretmez, sorunu iletime taşır.\n- **\"Kondansatör ne kadar çoksa o kadar iyi.\"** Aşırı kompanzasyon hafif yükte gerilimi yükseltir, kapasitif güç faktörü cezası doğurur ve harmoniklerle rezonansa girebilir.\n- **\"Reaktif güç santralden de gönderilir.\"** Uzun hatta taşınamaz; hattın reaktansında harcanır ve kayıp yaratır.\n- **\"Çatı güneşi gerilimi reaktiften yükseltir.\"** Dağıtımda R büyük olduğu için asıl neden aktif güç enjeksiyonudur. Çözüm de çoğu zaman eviricinin reaktif **tüketmesidir**.\n- **\"Güç faktörünü 1,00 yapmak hedeftir.\"** Ekonomik hedef çoğunlukla 0,95–0,98'dir; son yüzde için gereken kondansatör orantısız büyür.\n\n## Panel takip sorusu\n\n\"Aynı Mvar'ı kapasitörle mi STATCOM'la mı verirsin?\"\n\n> Mülakatta şöyle söyle: \"Sürekli hal ve ucuzluk için kapasitör; arıza sonrası toparlanma ve zayıf şebeke için STATCOM. Çoğu merkezde ikisi birlikte kullanılır: taban yükü kapasitör, dinamik payı STATCOM alır.\"\n\n\"Gerilim 1,05 pu'nun üstüne çıkıyor, ne yaparsın?\"\n\n> Mülakatta şöyle söyle: \"Önce nedenini ayırırım. Hafif yükte hat kapasitesi ise reaktör alırım veya kapasitörü çıkarırım. Dağıtımda ters akış ise evirici volt-var, kademe düşürme, gerekirse aktif güç sınırlama.\"\n\nAşağıdaki metin, bu sayfanın tamamını mülakatta 90 saniyede anlatmak içindir.\n\n## 90 saniye\n\n> \"Frekans sistemin aktif güç dengesini, gerilim ise bölgenin reaktif güç dengesini gösterir. Reaktif güç uzun hatta taşınamaz, bu yüzden tüketildiği yerde üretilir. Gerilim düşümü yaklaşık PR artı QX bölü V'dir; iletimde Q, dağıtımda P de belirleyicidir. Kompanzasyon aktif gücü değiştirmez, akımı ve kaybı düşürür. Kapasitör ucuzdur ama gerilim düşünce zayıflar; STATCOM hızlıdır ve akımını korur. Kademe değiştirici reaktif üretmez, yalnızca gerilimi kaydırır.\"\n"}, {"id": "02-Guc-Sistemleri-Temelleri/06-Yuk-Modelleri-ve-Trafo-Gruplari.md", "group": "02  Temeller", "title": "Yük modelleri, trafo bağlantı grupları, sıfır bileşen yolu", "body": "# Yük modelleri, trafo bağlantı grupları, sıfır bileşen yolu\n\n## Yük modelleri\n\nYük akışında yükü \"100 MW\" diye yazarız. Gerçekte yükün çektiği güç gerilime bağlıdır. Üç saf davranış vardır:\n\n| Model | Güç nasıl değişir | Örnek cihaz |\n| --- | --- | --- |\n| Sabit empedans (Z) | `P ∝ V²` | Rezistanslı ısıtıcı, akkor lamba |\n| Sabit akım (I) | `P ∝ V` | Bazı aydınlatma ve elektronik |\n| Sabit güç (P) | `P` sabit | Motor sürücüleri, güç elektroniği, şarj cihazı |\n\nGerçek yük bunların karışımıdır. ZIP modeli (Z, I ve P harflerinden gelir) üçünü ağırlıklandırır.\n\nAşağıdaki blokta `P₀` nominal güç, `V₀` nominal gerilim, `a_z`, `a_i`, `a_p` üç davranışın payıdır. Paylar toplamı 1'dir.\n\n```\nP = P₀ [ a_z (V/V₀)² + a_i (V/V₀) + a_p ]      a_z + a_i + a_p = 1\n```\n\nReaktif güç için ayrı katsayılar vardır.\n\nÜstel model aynı şeyi tek üsle yazar: `P = P₀ (V/V₀)^α`.\n\n| `α` | Karşılığı |\n| --- | --- |\n| 2 | Sabit empedans |\n| 1 | Sabit akım |\n| 0 | Sabit güç |\n\n### Elle örnek\n\nNominalde 100 MW çeken yük, gerilim 0,95 pu'ya düşünce:\n\n- Sabit empedans: `100 × 0,95² = 90,25 MW`. Bu satır, gücü gerilimin karesiyle ölçekler.\n- Sabit akım: `100 × 0,95 = 95,00 MW`. Bu satır, gücü gerilimle doğrusal ölçekler.\n- Sabit güç: `100 MW`. Bu satır, gerilim ne olursa olsun gücü sabit tutar.\n\nSabit güç yükü, gerilim düşünce akımını **artırır** (`I = P/V`). Bu, gerilimi daha da düşürür. Sabit empedans yükü ise kendiliğinden hafifler ve sisteme yardım eder.\n\n### Neden önemli\n\n- Gerilim kararlılığında sabit güç varsayımı kötümser, sabit empedans iyimser sonuç verir. Hangisini kullandığını söylemeden \"sistem çöker\" veya \"çökmez\" denmez.\n- Modern yük (evirici, sürücü, LED, şarj) sabit güce kayıyor. Şebeke eskisine göre daha az \"kendiliğinden toparlanıyor\".\n- Motor yükü ayrıca dinamiktir: gerilim düşünce yavaşlar, durma noktasına gelirse nominalin birkaç katı reaktif çeker. Arıza sonrası gerilimin geç toparlanmasının nedeni budur.\n- Yük frekansa da bağlıdır: frekans %1 düşünce yük yaklaşık %1–2 azalır. Buna yük sönümü denir ve frekans kararlılığına yardım eder.\n- CVR (Conservation Voltage Reduction, gerilimi bilinçli düşürerek tüketimi azaltma), yükün sabit empedans payı kadar çalışır.\n\nPlanlama yük akışında varsayılan sabit güçtür. Dinamik çalışmada ZIP veya motor modeli şarttır.\n\n## Trafo bağlantı grupları\n\nTrafonun iki sargısı yıldız (Y) veya üçgen (D) bağlanabilir. Plakadaki gösterim şöyle okunur:\n\n| İşaret | Anlamı |\n| --- | --- |\n| Büyük harf | Yüksek gerilim sargısı |\n| Küçük harf | Alçak gerilim sargısı |\n| `N` veya `n` | Nötrün dışarı çıkarıldığı |\n| Sondaki sayı | Saat açısı. Her saat 30°'dir |\n\nYaygın gruplar:\n\n- **Dyn11:** yüksek taraf üçgen, alçak taraf nötrü çıkarılmış yıldız, alçak taraf 30° ileride. Dağıtım trafosunun standart grubudur.\n- **YNd11:** santral yükseltici trafolarında yaygın.\n- **YNyn0:** iletim ototrafolarında, çoğunlukla üçgen bağlı üçüncü (tersiyer) sargıyla.\n\nSaat açısı neden önemli: iki trafo paralel çalışacaksa aynı saat grubunda olmalıdır. Farklı grupta iki sekonder arasında sürekli gerilim farkı ve büyük dolaşım akımı oluşur.\n\nDengeli yük akışında bu 30° kayma göz ardı edilebilir. Koruma ve dengesiz analizde edilemez.\n\n## Sıfır bileşen yolu\n\nSimetrik bileşenlerde sıfır dizi, üç fazda aynı yönde akan akımdır. Üç faz aynı anda aynı yöne akıyorsa bir dönüş yolu lazımdır: toprak veya nötr.\n\nKural tek cümledir: **sıfır bileşen akımı, ancak topraklanmış bir yıldız noktası varsa akar. Üçgen sargı onu dışarı vermez, içinde dolaştırır.**\n\n| Bağlantı | Sıfır bileşen davranışı |\n| --- | --- |\n| YNyn (iki nötr de topraklı) | İki taraf arasında geçer |\n| YNd | Yıldız tarafında toprağa yol verir, üçgen tarafına geçmez |\n| Dyn | Alçak taraf arızasında yol verir, yüksek tarafa geçmez |\n| Yy (nötrler topraksız) | Hiç geçmez |\n| Dd | Hiç geçmez |\n| Yd (yıldız topraksız) | Hiç geçmez |\n\nNötr bir empedans `Z_n` üzerinden topraklanmışsa sıfır dizi devresine `3 Z_n` olarak girer. Üç katı olmasının nedeni, nötrden üç fazın sıfır akımının toplamının (`3 I₀`) geçmesidir.\n\n### Elle örnek\n\n34,5 kV fider, Dyn11 dağıtım trafosuyla 0,4 kV'a iniyor. Alçak gerilim tarafında bir faz toprağa değdi.\n\n1. Alçak taraf yıldızdır ve nötrü topraklıdır. Sıfır bileşen akımı akar, arıza akımı büyüktür, sigorta veya şalter açar. Bu adım, arıza tarafında sıfır dizi yolunun açık olduğunu gösterir.\n2. Yüksek taraf üçgendir. 34,5 kV tarafındaki toprak rölesi bu arızayı **görmez**. Aynı arıza 34,5 kV'ta faz-faz akımı gibi görünür. Bu adım, üçgen sargının sıfır diziyi diğer tarafa geçirmediğini gösterir.\n\nSonuç: her gerilim seviyesinin toprak koruması kendi içinde koordine edilir. Bu, Dyn bağlantısının bilinçli bir faydasıdır.\n\n## Yaygın yanlış\n\n- **\"Yük sabittir.\"** Yük akışı varsayımıdır, fizik değildir.\n- **\"Gerilim düşünce yük hep azalır.\"** Sabit güç yükü azalmaz, akımı artar.\n- **\"Üçgen sargı sıfır bileşeni yok eder.\"** Yok etmez; içinde dolaştırır ve diğer tarafa geçirmez. Yıldız tarafı için düşük empedanslı bir yol oluşturur.\n- **\"Yıldız bağlantı her zaman sıfır bileşen geçirir.\"** Yalnızca nötrü topraklıysa.\n- **\"Saat açısı yalnızca plakada duran bir bilgidir.\"** Paralel çalışmada ve diferansiyel korumada doğrudan sonuç değiştirir.\n\n## Panel takip sorusu\n\n\"Kısa devre yazılımında tek faz-toprak akımı sıfır çıkıyor, neden?\"\n\n> Mülakatta şöyle söyle: \"Sıfır dizi yolu kapalıdır. Trafo grubu yanlış girilmiştir, nötr topraklaması eksiktir veya sıfır dizi empedansı boş bırakılmıştır.\"\n\n\"Gerilim kararlılığı çalışmasında hangi yük modelini seçersin?\"\n\n> Mülakatta şöyle söyle: \"Ölçüme dayalı ZIP varsa onu. Yoksa sabit güç ile sabit empedans arasında iki uç senaryo koşar, sonucun hangi varsayıma duyarlı olduğunu raporlarım.\"\n\nAşağıdaki metin, bu sayfanın tamamını mülakatta 90 saniyede anlatmak içindir.\n\n## 90 saniye\n\n> \"Yük gerilime bağlıdır. Sabit empedans gerilimin karesiyle, sabit akım gerilimle değişir, sabit güç değişmez; ZIP üçünün karışımıdır. Sabit güç yükü gerilim düşünce akımını artırdığı için kararlılıkta en zor olanıdır. Trafoda bağlantı grubu iki şeyi belirler: saat açısı paralel çalışmayı, yıldız ve üçgen sıfır bileşen yolunu. Sıfır bileşen akımı yalnızca topraklı yıldız noktasından akar; üçgen onu diğer tarafa geçirmez. Bu yüzden dağıtımdaki Dyn trafosu, alçak gerilim toprak arızasını orta gerilimden ayırır.\"\n"}, {"id": "02-Guc-Sistemleri-Temelleri/07-Sozluk-ve-Kendini-Yokla.md", "group": "02  Temeller", "title": "Sözlük ve kendini yokla", "body": "# Sözlük ve kendini yokla\n\n## Bu klasörü hangi sırayla oku\n\nDosyalar numara sırasıyla değil, aşağıdaki sırayla okunur. Her satır, o dosyada ne öğreneceğini söyler.\n\n1. `02-Sifirdan-AC-Devre-ve-Fazor` — fazör, empedans, aktif ve reaktif güç\n2. `03-Uc-Faz-ve-Per-Unit-Elle` — hat ve faz gerilimi, birim sistem\n3. `04-Ybus-Elle-ve-Seyrek-Matris` — şebekenin matrisi\n4. `05-Reaktif-Guc-Kompanzasyon-Gerilim` — gerilim neden yereldir\n5. `06-Yuk-Modelleri-ve-Trafo-Gruplari` — yük ve sıfır bileşen yolu\n6. `01-Guc-Birim-Sistem-Modeller` — hepsinin yoğun özeti, en son\n\nİlk beş dosyadaki elle örnekleri kâğıtta kendin çöz. Sayın tutmuyorsa `14-Programlama/ornekler/elle_ornekler.py` aynı örnekleri hesaplar.\n\n## Sözlük\n\nPanel bir terimi İngilizce söyleyebilir. Türkçesini ve bir cümlelik anlamını bil.\n\n| Türkçe | İngilizce | Bir cümle |\n| --- | --- | --- |\n| Bara | Bus | Şebekede elemanların bağlandığı düğüm |\n| Fider | Feeder | Trafo merkezinden çıkan dağıtım hattı |\n| Trafo merkezi (TM) | Substation | Gerilimin değiştiği ve hatların buluştuğu tesis |\n| Kesici | Circuit breaker | Yük ve arıza akımını kesebilen anahtar |\n| Ayırıcı | Disconnector | Akım yokken açılan, görünür ayırma sağlayan anahtar |\n| Kademe değiştirici | Tap changer (OLTC, On-Load Tap Changer) | Trafonun sarım oranını yük altında değiştirir |\n| Yük akışı | Power flow, load flow | Verilen üretim ve yükte gerilim ve akışları bulur |\n| Salınım barası | Slack, swing bus | Açı referansı; kaybı ve dengesizliği üstlenir |\n| Kısa devre | Short circuit, fault | Fazların birbirine veya toprağa istenmeyen teması |\n| Beklenmeyen durum | Contingency | Bir elemanın plansız devre dışı kalması |\n| Güvenlik analizi | Security analysis | Arıza sonrası limitlerin korunup korunmadığı |\n| Kararlılık | Stability | Bozucudan sonra yeni dengeye oturabilme |\n| Durum kestirimi | State estimation | Gürültülü ölçümden en olası gerilim ve açıyı bulma |\n| Atalet | Inertia | Dönen kütlelerin frekans değişimine direnci |\n| Hız eğimi | Droop | Frekans sapmasına karşı güç tepkisinin oranı |\n| Puant | Peak load | En yüksek anlık talep |\n| Kurulu güç | Installed capacity | Santrallerin anma güçleri toplamı |\n| Yedek | Reserve | Arıza ve sapma için boşta tutulan kapasite |\n| Kısıt | Congestion | Hattın, ucuz üretimi taşımaya yetmemesi |\n| Yeniden dağıtım | Redispatch | Kısıtı çözmek için üretimin yerini değiştirme |\n| Ekonomik dağıtım | Economic dispatch | Devredeki ünitelerin en ucuz yük paylaşımı |\n| Ünite tahsisi | Unit commitment | Hangi ünitenin ne zaman devrede olacağı |\n| Optimal güç akışı | Optimal power flow (OPF) | Şebeke limitleriyle birlikte en ucuz işletme |\n| Evirici | Inverter | Doğru akımı şebeke frekansında alternatif akıma çevirir |\n| Dağıtık üretim | Distributed generation | Dağıtım şebekesine bağlı küçük üretim |\n| Barındırma kapasitesi | Hosting capacity | Limit bozulmadan bağlanabilecek üretim |\n| Fazör ölçüm birimi | PMU (Phasor Measurement Unit) | Zaman damgalı gerilim ve akım fazörü ölçer |\n| Arıza boyunca kalma | Fault ride through | Gerilim çökünce santralin ayrılmaması |\n| Yük atma | Load shedding | Sistemi kurtarmak için tüketimin kesilmesi |\n| Kısıntı | Curtailment | Üretimin bilerek kesilmesi |\n| Simetrik bileşenler | Symmetrical components | Dengesiz üç fazı üç dengeli diziye ayırma |\n| Koruma koordinasyonu | Protection coordination | Arızaya en yakın rölenin önce açmasını sağlama |\n\n## Kendini yokla\n\nCevaba bakmadan yaz. On sorudan sekizi tutmadan `03` klasörüne geçme.\n\n1. 230 V etkin gerilimin tepe değeri kaçtır?\n2. 154 kV hat gerilimine karşılık faz gerilimi kaçtır?\n3. 50 MW, güç faktörü 0,9. Görünür güç ve reaktif güç?\n4. `Z = 3 + j4 Ω` için büyüklük ve açı?\n5. 154 kV ve 100 MVA için empedans bazı?\n6. 25 MVA, %8 empedanslı trafo 100 MVA bazında kaç pu eder?\n7. `z = j0,2` hattın admitansı ve Ybus'taki köşegen dışı elemanı?\n8. Gerilim 0,9 pu'ya düşerse sabit empedans yükü yüzde kaç azalır?\n9. Dyn11 trafonun alçak gerilim toprak arızası yüksek tarafta sıfır bileşen akımı üretir mi?\n10. Kondansatör gerilimi %10 düşerse ürettiği reaktif yüzde kaç düşer?\n\nCevaplar. Her cevabın yanında hangi kuralı kullandığı yazılıdır.\n\n1. `230 × √2 = 325 V` — tepe değer, etkin değerin √2 katıdır.\n2. `154 / √3 = 88,9 kV` — faz gerilimi, hat geriliminin √3'e bölümüdür.\n3. `S = 50 / 0,9 = 55,6 MVA`, `Q = 50 × tan(25,84°) = 24,2 Mvar` — önce görünür güç, sonra güç faktörü açısının tanjantıyla reaktif güç.\n4. `|Z| = 5 Ω`, açı `arctan(4/3) = 53,1°` — büyüklük `√(R² + X²)`, açı `arctan(X/R)`.\n5. `154² / 100 = 237,2 Ω` — `Z_baz = V_baz² / S_baz`.\n6. `0,08 × 100 / 25 = 0,32 pu` — baz değiştirme; gerilim bazı aynı olduğu için yalnız güç oranı çarpılır.\n7. `y = −j5`, köşegen dışı `+j5` — `1/(jx) = −j/x`, köşegen dışı admitansın eksilisidir.\n8. `0,9² = 0,81`, yani %19 azalır — sabit empedans yükünde güç gerilimin karesiyle gider.\n9. Hayır. Üçgen sargı sıfır bileşeni yüksek tarafa geçirmez — sıfır bileşen yolu kuralı.\n10. `0,9² = 0,81`, yani %19 düşer — kondansatör reaktifi `Q = V² / X_c`.\n"}, {"id": "03-Iletim-Sebekeleri/00-Alt-Basliklar.md", "group": "03  İletim", "title": "03 — İletim şebekeleri", "body": "# 03 — İletim şebekeleri\n\nBu bölüm, elektriği santralden şehirlerin girişine kadar taşıyan yüksek gerilim şebekesini, yani **iletim şebekesini** anlatır. Aşağıdaki her madde bir alt başlıktır. Yanındaki cümle, o konuda ne öğreneceğini söyler.\n\nKonular üç sayfaya dağılmıştır:\n\n| Sayfa | Ne anlatır |\n|---|---|\n| [`01-Iletim-Yapi-FACTS-Enterkonneksiyon.md`](01-Iletim-Yapi-FACTS-Enterkonneksiyon.md) | Gerilim kademeleri, trafo merkezi, hat ve trafo işletmesi, FACTS, HVDC, enterkonneksiyon, kayıp, kısıt, master plan |\n| [`02-Ekipman-Yeterlilik.md`](02-Ekipman-Yeterlilik.md) | Kesici, trafo, hat ve ölçü trafosunun şebekedeki zorlamaya dayanıp dayanmadığının nasıl değerlendirildiği |\n| [`03-PTDF-LODF-NTC-ATC-ve-Kisit.md`](03-PTDF-LODF-NTC-ATC-ve-Kisit.md) | Duyarlılık katsayıları, sınır ötesi transfer kapasitesi ve Türkiye'de iletim kısıtı |\n\n## Alt başlıklar\n\n1. **İletim–dağıtım sınırı ve Türkiye gerilim katları** — İletimin hangi gerilimden başladığını ve Türkiye'de hangi gerilim kademelerinin kullanıldığını öğreneceksin.\n2. **400 kV omurga, 154 kV alt iletim, 66 kV'nin dar alanı** — Her gerilim kademesinin şebekede hangi işi gördüğünü ve 66 kV'nin neden küçük bir katman olduğunu öğreneceksin.\n3. **Trafo merkezleri ve bara düzenleri** — Bir trafo merkezinde hangi ekipmanların bulunduğunu ve bara düzeninin güvenilirliği nasıl belirlediğini öğreneceksin.\n4. **Hat parametreleri: R, X, B, termik sınır, sehim** — Bir hattın direnç (R), reaktans (X) ve şönt süseptans (B) değerlerinin yanında ısınma sınırı ve iletken sarkmasının (sehim) neden önemli olduğunu öğreneceksin.\n5. **Seri ve şönt kompanzasyon, reaktör, kapasitör** — Reaktör ve kapasitörün gerilimi nasıl aşağı veya yukarı çektiğini ve seri kapasitörün bedelini öğreneceksin.\n6. **OLTC ve gerilim kontrol hiyerarşisi** — Yük altında kademe değiştiricinin (OLTC) gerilim kontrolündeki yerini ve hangi aracın hangi hızda devreye girdiğini öğreneceksin.\n7. **Senkron kompanzatör, SVC, STATCOM** — Reaktif güç üreten döner ve elektronik cihazların farkını, özellikle zayıf gerilimde hangisinin daha iyi olduğunu öğreneceksin.\n8. **TCSC, SSSC, UPFC** — Hattın güç akışını değiştiren seri ve birleşik güç elektroniği cihazlarını öğreneceksin.\n9. **HVDC ve back-to-back** — Yüksek gerilim doğru akım (HVDC) bağlantısının AC hattan farkını ve iki senkron olmayan sistemin nasıl bağlandığını öğreneceksin.\n10. **Enterkonneksiyon çalışmasının soruları** — Komşu ülke şebekesine bağlanırken hangi soruların sorulduğunu öğreneceksin.\n11. **Kayıp, gerilim profili, reaktif denge** — İletim kaybının nereden geldiğini ve reaktif gücün neden yerinde üretilmesi gerektiğini öğreneceksin.\n12. **İletim kısıtı ve yeniden dağıtım** — Ucuz üretimin yüke neden ulaşamadığını ve bunun üretimi yeniden dağıtarak nasıl çözüldüğünü öğreneceksin.\n13. **Düğüm-kesici modeli ile bara-hat modeli** — Yazılımdaki sade bara modelinin gerçek kesici topolojisinden farkını öğreneceksin.\n14. **Kablo, denizaltı hat ve Ferranti etkisi** — Hafif yükte hat ucunda gerilimin neden yükseldiğini ve reaktörün bunu nasıl bastırdığını öğreneceksin.\n15. **İletim modelinin yazılım alanları** — Bir iletim modelinde hangi veri alanlarının bulunması gerektiğini ve eksik alanın hangi yanlışı ürettiğini öğreneceksin.\n16. **Master plan senaryo seti** — Uzun vadeli iletim planında hangi senaryo ailelerinin koşulduğunu öğreneceksin.\n17. **Ekipman teknik yeterliliği: kesici, trafo, hat, ölçü trafosu** — Analiz sonucunu ekipmanın etiket değeriyle karşılaştırmayı öğreneceksin.\n"}, {"id": "03-Iletim-Sebekeleri/01-Iletim-Yapi-FACTS-Enterkonneksiyon.md", "group": "03  İletim", "title": "İletim şebekesi", "body": "# İletim şebekesi\n\nBu sayfa, Türkiye iletim şebekesinin yapısını, gerilimi ve güç akışını yöneten cihazları, komşu ülkelere bağlanma çalışmasını ve uzun vadeli planlamayı anlatır.\n\n## Yapı\n\n### Gerilim kademeleri\n\nTürkiye'de 36 kV'nin üstü iletim sayılır. Nominal kademeler 400, 154 ve 66 kV'dir.\n\n| Kademe | Görevi |\n| --- | --- |\n| 400 kV | Uzun mesafe taşıma ve büyük santral çıkışı |\n| 154 kV | Bölge iletimi ve büyük tüketim noktaları |\n| 66 kV | Dar bir kalıntı katman. 2025 sonunda 18 transformatörle temsil edilir. Analizde \"yok\" sayılmaz ama omurga değildir |\n| 220 kV | Türkiye iç şebekesinde kullanılan bir kademe değildir. Bazı sınır hatlarında karşı ülkenin gerilimidir |\n\n### Örgülü yapı\n\nİletim **örgüldür** (meshed). Yani bir noktaya birden çok yoldan güç gelebilir. Bir hat açılınca güç kaybolmaz, başka yollara itilir.\n\nBu yüzden iletim analizi N-1 olmadan eksiktir. N-1, \"herhangi bir elemanın tek başına devre dışı kalması\" durumudur. Dağıtımdaki radyal \"güç hep aşağı akar\" sezgisi iletimde yanlıştır.\n\n### Trafo merkezi\n\nTipik bir trafo merkezinde şunlar bulunur:\n\n- Hat fiderleri (merkeze giren ve çıkan hat bağlantıları)\n- Güç trafoları\n- Bara (ekipmanların bağlandığı ortak iletken)\n- Kesici, ayırıcı, toprak bıçağı\n- Ölçü trafoları\n- Parafudr (aşırı gerilim tutucu)\n- Reaktör veya kapasitör\n- Koruma ve kontrol panoları\n- Haberleşme: kuranportör (hat üzerinden sinyal taşıma) ve fiber\n\n### Bara düzenleri\n\nBara düzeni güvenilirliği belirler:\n\n| Düzen | Özelliği |\n| --- | --- |\n| Tek bara | Ucuzdur. Bara arızası bütün merkezi karartır |\n| Çift bara | Transfer imkânı ve bakım esnekliği verir |\n| Kesici ve yarım (breaker-and-a-half) | Her iki hat için iki kesici yolu vardır. 400 kV'ta sık tercih edilir |\n| Halka | Orta sayıda fider için uygundur |\n\n### Yazılımdaki bara modeli\n\nYazılım modeli barayı çoğu zaman tek bir düğüm olarak görür. Koruma ve bakım çalışmasında ise gerçek bara-kesici topolojisi gerekir.\n\nDüğüm-kesici modeli ile bara-hat modeli aynı şey değildir. Durum kestirimi ve SCADA (merkezi izleme ve kumanda sistemi) topoloji işlemcisi bu ikisinin arasında durur. Topoloji işlemcisi, kesici konumlarından bara-hat modelini üretir.\n\n## Hat ve trafo işletmesi\n\n### Hat verisi\n\nHat verisi R (direnç), X (reaktans), B (şönt süseptans) ve limitten ibaret değildir:\n\n- Limit mevsimseldir.\n- Sehim (iletkenin sarkması) sıcaklıkla artar. Yere ve nesnelere yaklaşım mesafesi limiti kısıtlar.\n- İletken tipi termik eğriyi değiştirir. İletkenler A, C, H gibi harflerle ve kuş türü adlarıyla anılır.\n- Çift devre bir direkteyse ortak mod arızası N-1'i N-2'ye çevirebilir. Yani tek olay iki devreyi birlikte düşürür. Planlamada ortak koridor riski bu yüzden sorulur.\n\n### Reaktör ve kapasitör\n\n| Cihaz | Ne yapar | Bedeli |\n| --- | --- | --- |\n| Şönt reaktör | Hafif yükte 400 kV gerilimini aşağı çeker | — |\n| Şönt kapasitör | Ağır yükte gerilimi yukarı çeker ve kaybı azaltır | — |\n| Seri kapasitör | Hattın elektriksel boyunu kısaltır, açı kararlılığı marjını açar | Alt senkron rezonans riski doğurur |\n\nAlt senkron rezonans, seri kapasitörlü hattın generatör miliyle şebeke frekansının altındaki bir frekansta salınım alışverişine girmesidir. Yönetmelik alt senkron rezonansı ayrıca tanımlar.\n\n> **Mülakatta şöyle söyle:** \"Seri kompanzasyon bedava kapasite değildir.\"\n\n### OLTC ve gerilim kontrol hiyerarşisi\n\nOLTC (yük altında kademe değiştirici), 400/154 ve 154/OG (orta gerilim) trafolarında günlük gerilim aracının başıdır. Kademe değişimi ayrık ve yavaştır.\n\nHızlı bir gerilim çökmesinde kademe yetişmez. STATCOM, SVC veya senkron makine uyarımı yetişir.\n\nGerilim kontrol hiyerarşisi zaman ölçeğine göre üç kattır:\n\n| Zaman ölçeği | Araç |\n| --- | --- |\n| Milisaniye | Uyarma ve FACTS |\n| Saniye–dakika | Kademe ve şönt anahtarlama |\n| Saat | Planlama |\n\n## FACTS ve HVDC\n\nFACTS (esnek AC iletim sistemleri), güç elektroniğiyle gerilimi veya hat akışını hızla ayarlayan cihaz ailesidir. HVDC ise yüksek gerilim doğru akım bağlantısıdır.\n\n| Cihaz | Açılımı | Ne enjekte eder veya değiştirir | Tipik iş |\n| --- | --- | --- | --- |\n| SVC | Statik VAR kompanzatörü | Tristörlü reaktif, kademeli-sürekli | Gerilim, dinamik destek |\n| STATCOM | Statik senkron kompanzatör | Gerilim kaynaklı evirici, reaktif | Zayıf gerilimde SVC'den daha iyi destek, simetrik kapasitif-endüktif |\n| TCSC | Tristör kontrollü seri kapasitör | Hattın seri reaktansı | Güç akışı, sönüm |\n| SSSC | Statik senkron seri kompanzatör | Hatta seri gerilim | Güç akışı |\n| UPFC | Birleşik güç akış kontrolörü | Seri + şönt | P ve Q birlikte |\n| HVDC LCC / VSC | Hat komütasyonlu / gerilim kaynaklı dönüştürücü | Doğru akım koridoru | Uzun mesafe, kablo, asenkron bağlama |\n| Back-to-back | Sırt sırta HVDC | Kısa DC ara halka | İki senkron olmayan AC sistem |\n\n### STATCOM'un zayıf şebekedeki üstünlüğü\n\nSVC'nin üretebildiği reaktif güç gerilimle düşer. STATCOM ise akımı daha geniş bir aralıkta tutar. Bu yüzden gerilim düştüğünde STATCOM daha çok destek verir.\n\nMAM'ın (TÜBİTAK Marmara Araştırma Merkezi) milli STATCOM'u bu ailedendir.\n\nModelleme tarafında iki ayrı model gerekir:\n\n- Statik hal için PV (aktif güç ve gerilim sabit), PQ (aktif ve reaktif güç sabit) veya reaktif limitli bir kaynak.\n- Dinamik hal için kontrol çevrimli bir kaynak.\n\nKontrol modeli yoksa kararlılık çalışması ancak \"reaktif destek varmış\" kadar doğru olur.\n\n### HVDC\n\nHVDC, AC açı kararlılığına AC hat gibi girmez. Çünkü üzerinden geçen güç açı farkıyla değil, ayar noktasıyla kontrol edilir.\n\n- VSC-HVDC gerilim ve frekans desteği de verebilir.\n- Klasik LCC daha çok bir güç koridorudur.\n\nGürcistan bağlantısını AC enterkonneksiyon gibi anlatma.\n\n## Enterkonneksiyon çalışması\n\nEnterkonneksiyon, komşu ülke şebekesine bağlanmaktır. Grubun açıkça yazdığı iştir. Tipik soru seti:\n\n- Bağlantı AC mi, HVDC mi? Senkron ada büyüyor mu?\n- N-1'de sınır hattı düşerse frekans sapması ve açı salınımı ne olur?\n- İthalat, yerli üretim ve atalet nasıl değişir? İthalat artınca sistem ataleti düşebilir, çünkü sınırın ötesindeki atalet elektriksel olarak uzaktır.\n- Bölgeler arası salınım modu (0,1–0,8 Hz tipik bant) sönümleniyor mu? PSS (güç sistemi kararlı kılıcısı) ayarı bu yüzden ENTSO-E (Avrupa iletim sistemi operatörleri ağı) bağlantısıyla birlikte yönetmelikte anılır.\n- NTC (net transfer kapasitesi), güvenilirlik marjı düşüldükten sonra kalan ticarî kapasitedir. Termik limit tek başına NTC değildir.\n- Koruma: sınır hattında mesafe rölesi, güç salınımı blokajı, ada koruması.\n\n## Kayıp ve kısıt\n\n### Kayıp\n\nİletim kaybı kabaca yüzde birkaçtır. Dağıtım kaybı daha büyüktür ve orada teknik kayıp ile kaçak ayrı raporlanır.\n\nKayıp I²R'dir, yani akımın karesiyle büyür. Bu yüzden iki şey kaybı düşürür:\n\n- Gerilimi yüksek tutmak (aynı güç için daha az akım).\n- Reaktifin uzun yol gezmesini engellemek.\n\nReaktif yerinde üretilir. Bu ilke hem planlamanın hem OPF'nin (optimal güç akışı) cümlesidir.\n\n### Kısıt\n\nİletim kısıtı, ucuz üretimin yükün olduğu bölgeye akamamasıdır. Piyasa bunu bölge fiyatı veya yeniden dağıtımla fiyatlar.\n\nTürkiye uygulamasında kısıt yönetimi TEİAŞ (Türkiye Elektrik İletim A.Ş.) işletme talimatı ve dengeleme mekanizmasıyla yürür.\n\nFizik tarafı: kısıtlı hatta akışı azaltmak için bir tarafta üretimi kısar, diğer tarafta artırırsın. Bu, güvenlik kısıtlı ekonomik dağıtımdır.\n\n## Master plan senaryoları\n\nİletim planı tek bir pik yük durumu koşmaz. En az şu aileler gerekir:\n\n- Kış puant, yaz puant, bahar minimum (Ferranti etkisi ve reaktör ihtiyacı için)\n- Yüksek yenilenebilir, düşük atalet\n- Büyük santral devrede / devre dışı\n- Sınır ithalatı ve ihracatı\n- N-1 ve seçilmiş ortak mod N-2\n- 5–10 yıllık yük ve üretim senaryosu, puantın %5 üzeri planlama yükü\n\nFerranti etkisi: hafif yüklü uzun hatta veya kabloda, hattın kendi kapasitesi yüzünden uçtaki gerilimin baştakinden yüksek çıkmasıdır.\n\nHer senaryoda şunlara bakılır:\n\n- Yük akışı\n- Kısa devre: bara kısa devre gücünün koruma ve ekipman için alt ve üst sınırı\n- Gerilim\n- Seçilmiş olaylarda kararlılık\n\nMaster plan, bu taramayı yatırım adaylarına ve fayda/maliyet sırasına bağlar. Grubun \"risk/etki eksenli planlama\" dediği yer burasıdır.\n\n## Yazılıma nasıl girer\n\nBir iletim modeli en az şunları taşır:\n\n- Bara numarası ve gerilim bazı\n- Hat ve trafo parametreleri\n- Kademe sınırları\n- Üretim Pmin/Pmax/Qmin/Qmax\n- Yük P-Q\n- Limitler\n- Topoloji (kesici durumu)\n- Kontrol modu: PV, PQ, slack (salınım barası), kademe kontrol\n\nEksik Q limiti \"gerilim sorunu yok\" yalanı üretir. Çünkü makine uyarması sınırsız sanılır.\n\n> **Sade anlatım:** Generatöre \"en fazla şu kadar reaktif verebilirsin\" demezsen, model gerilimi her yerde tutturur ve sorun hiç görünmez.\n\nAşağıdaki metin, iletim konusu sorulduğunda 90 saniyede söyleyeceğin özettir.\n\n## 90 saniye\n\n\"Türkiye iletimi 400 ve 154 kV örgü, 66 kV dar bir katman. Güç açıyla, reaktif yerinde yönetilir. Kapasite termik, gerilim ve kararlılık diye üçe ayrılır. FACTS ve kademe farklı zaman ölçeklerinde gerilime yardım eder. ENTSO-E bağlantısı senkron adayı büyütür; doğudaki HVDC ve radyal hatlar aynı adaya eklenmez. Planlama puantın yüzde 5 üzerinde, N-1'de kullanıcı kaybı ve ada oluşumu olmadan yapılır.\"\n"}, {"id": "03-Iletim-Sebekeleri/02-Ekipman-Yeterlilik.md", "group": "03  İletim", "title": "Ekipman yeterliliği", "body": "# Ekipman yeterliliği\n\nGrubun çalışma listesinde ayrı bir madde var: şebeke ekipmanının teknik yeterliliği ve performans değerlendirmesi.\n\nBu yeni bir analiz türü değildir. Yük akışı, kısa devre ve geçici hal sonuçlarını ekipmanın dayanım verisiyle karşılaştırmaktır. Soru şudur: şebeke bu cihazı ne kadar zorluyor, cihaz ne kadarına dayanıyor?\n\n> **Sade anlatım:** Asansörün kapısında taşıyabileceği kişi sayısı yazar. Yeterlilik çalışması, en kalabalık saatte asansöre kaç kişinin bindiğini sayıp o yazıyla karşılaştırmaktır.\n\n## Ne karşılaştırılır\n\n| Ekipman | Karşılaştırılan büyüklükler | Not |\n| --- | --- | --- |\n| Kesici | Kesme akımı, tepe dayanımı, X/R oranı veya DC zaman sabiti, geçici toparlanma gerilimi (TRV) | Kısa devre hesabı aza
