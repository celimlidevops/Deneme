renir.\n- **Arızada büyük akım basar:** koruma röleleri bu akımı görüp arızayı ayırır.\n- **Gerilimi uyartımla tutar:** uyartım, rotor sargısına verilen akımdır; bununla gerilim ayarlanır.\n\nEvirici bunların hiçbirini kendiliğinden yapmaz; **ne programlanırsa onu yapar**. Evirici, güneş veya rüzgârın ürettiği elektriği şebekeye uygun alternatif akıma çeviren güç elektroniği cihazıdır.\n\nŞebeke kodu, bu programın asgari içeriğini belirleyen kurallar bütünüdür.\n\n### Tarihsel ders\n\nEvirici tabanlı üretim azken kural \"arıza olursa hemen ayrıl\" idi.\n\nPay büyüyünce bu kural tehlikeli oldu. Zincir şöyle işler:\n\n1. Bir iletim arızası gerilimi geniş bir bölgede düşürür.\n2. Binlerce megavat aynı anda ayrılır.\n3. Arıza bir frekans olayına dönüşür; üretim aniden kaybolduğu için frekans düşer.\n\nBugünkü kural tersidir: **bağlı kal ve destek ol.**\n\n### Türkiye'deki ve Avrupa'daki kaynak\n\nTürkiye'de kaynak: Elektrik Şebeke Yönetmeliği.\n\n**Doğrulandı:** rüzgâr ve güneş santrallerinin bağlantı koşulları yönetmeliğin **Ek-18**'indedir.\n\nAvrupa'daki karşılığı ENTSO-E'nin (European Network of Transmission System Operators for Electricity, Avrupa İletim Sistemi İşletmecileri Ağı) üreticiler için bağlantı kodu (RfG, Requirements for Generators) ve onun ulusal uygulamalarıdır.\n\n## Dört temel gereksinim\n\n### 1. Arıza boyunca bağlı kalma (FRT, LVRT)\n\nFRT (Fault Ride Through), arıza boyunca bağlı kalmadır. LVRT (Low Voltage Ride Through), düşük gerilimde bağlı kalmadır; FRT'nin gerilim çökmesine ait halidir.\n\nSantral, bağlantı noktasındaki gerilim belirli bir **gerilim–zaman eğrisinin** üstünde kaldığı sürece şebekeden ayrılmamalıdır.\n\nAşağıdaki çizim eğrinin biçimini gösterir. Arıza anında gerilim düşer, arıza temizlenince basamak basamak toparlanır. Eğrinin üstündeki her noktada santral bağlı kalmak zorundadır.\n\n```\nGerilim\n1,0 ┤━━━━━━┓                         ┏━━━━━━━━━━\n    │      ┃                    ┏━━━━┛\n    │      ┃               ┏━━━━┛         Eğrinin üstü: BAĞLI KAL\n    │      ┃          ┏━━━━┛\n    │      ┗━━━━━━━━━━┛                   Eğrinin altı: ayrılabilir\n0   ┼──────┴──────────┴─────────────────────── zaman\n          arıza    arıza temizlendi\n```\n\nÜç parçası vardır:\n\n1. **Bağlı kal:** gerilim sıfıra yakın düşse bile birkaç yüz milisaniye.\n2. **Arıza sırasında reaktif akım ver:** gerilimi desteklemek ve korumanın arızayı görebilmesi için.\n3. **Arıza sonrası aktif gücü hızla geri getir:** frekansı korumak için.\n\nYüksek gerilimde bağlı kalma (HVRT, High Voltage Ride Through) da aynı mantıkla tanımlanır.\n\n**Doğrula:** Türkiye Ek-18'deki eğrinin köşe noktalarını (gerilim ve süre değerleri) ve istenen reaktif akım katsayısını doğrulamadım. **Mülakatta rakam söyleme.**\n\n> **Mülakatta şöyle söyle:** \"Eğrinin biçimini ve mantığını biliyorum; Ek-18'deki sayıları yönetmelikten okurum.\"\n\n#### Elle örnek: arızada reaktif akım (Genel)\n\nBirçok Avrupa kodunda kural şöyledir: gerilimdeki her %1 düşüş için anma akımının %2'si kadar ek reaktif akım (`k = 2`).\n\npu (per unit, birim değer), bir büyüklüğün anma değerine oranıdır. 1,0 pu gerilim anma gerilimi, 0,5 pu ise yarısı demektir.\n\nHesabın adımları:\n\n- **Birinci satır:** gerilimin anma değerinden ne kadar düştüğünü (ΔV) bulur. 1,0 pu'dan 0,5 pu'ya inince düşüş 0,5'tir.\n- **İkinci satır:** bu düşüşü `k` katsayısıyla çarparak istenen reaktif akımı bulur. Sonuç anma akımının tamamıdır.\n\n```\nGerilim 0,5 pu'ya düştü   →   ΔV = 0,5\nI_reaktif = k × ΔV = 2 × 0,5 = 1,0 pu\n```\n\nSonuç: eviricinin bütün akım kapasitesi reaktif akıma ayrılır; aktif güç geçici olarak sıfıra iner.\n\nNeden? Akım sınırı 1,0–1,2 pu olduğu için ikisini birden veremez (`06/02`).\n\n### 2. Reaktif güç ve gerilim desteği\n\nReaktif güç (Q), gerilimi ayakta tutan güç bileşenidir. Birimi Mvar'dır (megavolt-amper reaktif). Aktif güç (P) ise işe dönüşen güçtür.\n\nKontrol kipleri:\n\n| Kip | Davranış | Kullanım |\n| --- | --- | --- |\n| Sabit güç faktörü | `Q = P × tan φ` | En basit; gerilime tepkisiz |\n| Sabit Q | Verilen Mvar | İşletmeci talimatıyla |\n| **Volt-var** `Q(V)` | Gerilim düşükse üret, yüksekse tüket; ortada ölü bant | Yerel gerilim desteği |\n| Gerilim kontrolü | Bağlantı noktası gerilimini ayar değerinde tut (eğimli) | Büyük santraller, iletim |\n| Volt-watt `P(V)` | Gerilim çok yüksekse aktif gücü kıs | Son çare; dağıtımda |\n\nTablodaki `φ`, gerilim ile akım arasındaki açıdır. Güç faktörü bu açının kosinüsüdür (cos φ).\n\n#### Volt-var eğrisi\n\nAşağıdaki çizim volt-var kipini gösterir:\n\n- Gerilim düşükse (soldaki bölge) evirici reaktif güç üretir (kapasitif davranış) ve gerilimi yükseltir.\n- Gerilim ortadaki ölü bantta ise hiçbir şey yapmaz.\n- Gerilim yüksekse (sağdaki bölge) reaktif güç tüketir (endüktif davranış) ve gerilimi düşürür.\n\n```\n Q\n + ┤━━━━━━┓  üret (kapasitif)\n   │       ╲\n 0 ┤        ━━━━━━━━        ölü bant\n   │                ╲\n − ┤                 ┗━━━━━━  tüket (endüktif)\n   └──┴────┴────────┴────┴───── V\n     0,92  0,98    1,02  1,08          (örnek noktalar; ayar işletmeciye aittir)\n```\n\n#### Elle örnek: eviricinin reaktif kapasitesi\n\nEvirici görünür güce göre sınırlıdır: `P² + Q² ≤ S²`.\n\nGörünür güç (S), birimi MVA (megavolt-amper) olan, aktif ve reaktif gücün vektörel toplamıdır. Eviricinin akım sınırı aslında S'yi sınırlar.\n\nHesabın adımları:\n\n- **Birinci satır:** evirici 0,9 MW aktif güç üretirken S sınırından geriye kalan reaktif payı bulur.\n- **İkinci satır:** evirici tam 1,0 MW ürettiğinde reaktif paya hiç yer kalmadığını gösterir.\n\n```\n1 MVA evirici, 0,9 MW üretirken:   Q_max = √(1² − 0,9²) = 0,436 Mvar\nAynı evirici, 1,0 MW üretirken:    Q_max = 0\n```\n\nTam güneşte, yani gerilim yükselmesinin en büyük olduğu anda, reaktif kapasite sıfırdır.\n\nÇözüm: eviriciyi büyük seçmek. Anma gücünde 0,95 güç faktörü isteniyorsa:\n\n- **Sol taraf:** 1 MW aktif gücü 0,95 güç faktörüyle verebilmek için gereken görünür gücü (S) bulur.\n- **Sağ taraf:** bu S ile 1 MW üretirken elde kalan reaktif gücü (Q) gösterir.\n\n```\nS = P / 0,95 = 1,053 MVA     →     Q = 0,329 Mvar\n```\n\nYani %5,3 büyük evirici. Şebeke kodundaki reaktif güç gereksinimi, doğrudan donanım maliyetidir.\n\n### 3. Frekans tepkisi\n\n**Doğrulandı** (şebeke yönetmeliği, `01/02`):\n\n| Büyüklük | Değer |\n| --- | --- |\n| Normal kontrol bandı | 49,8–50,2 Hz |\n| Sınırlı frekans duyarlılık kipinin (LFSM) eşikleri | 49,8 ve 50,2 Hz |\n| Tasarım uçları | 47,5 ve 51,5 Hz |\n\nLFSM, Limited Frequency Sensitive Mode, yani sınırlı frekans duyarlı moddur. Hz (hertz) frekans birimidir; Türkiye şebekesinin anma frekansı 50 Hz'dir.\n\n| Kip | Ne zaman | Davranış |\n| --- | --- | --- |\n| LFSM-O (yüksek frekans) | `f > 50,2 Hz` | Aktif gücü eğimle azalt. Her santral yapabilir |\n| LFSM-U (düşük frekans) | `f \u003c 49,8 Hz` | Aktif gücü artır. Yalnız payı (kısılmış üretim, depolama) olan yapabilir |\n| FSM (frekans duyarlı kip) | Sürekli | Primer frekans kontrolüne katılım |\n\nLFSM-O'daki O, Over (üstünde); LFSM-U'daki U, Under (altında) demektir. FSM, Frequency Sensitive Mode'dur.\n\n#### Elle örnek: LFSM-O\n\n100 MW üreten güneş santrali, eğim %5 (örnek değer), frekans 50,5 Hz.\n\nEğim (droop), frekansın yüzde kaç değişmesiyle gücün tamamen değişeceğini söyler. %5 eğim, frekans %5 değişirse güç %100 değişir demektir.\n\nHesabın adımları:\n\n- **Birinci satır:** frekansın eşiği ne kadar aştığını bulur. Tepki eşikten itibaren başladığı için 50'den değil 50,2'den çıkarılır.\n- **İkinci satır:** bu aşımı önce anma frekansına (`f_n` = 50 Hz) bölerek oransal hale getirir, sonra eğime bölüp santral gücüyle çarpar. Sonuç santralin azaltması gereken güçtür.\n\n```\nΔf = 50,5 − 50,2 = 0,3 Hz\nΔP = (Δf / f_n) / eğim × P = (0,3 / 50) / 0,05 × 100 = 12 MW azaltır\n```\n\nAyrıca istenenler:\n\n- Frekans aralıklarında bağlı kalma süreleri.\n- RoCoF (Rate of Change of Frequency, frekansın değişim hızı) dayanımı.\n- Yüklenme hızı (rampa) sınırı.\n\n### 4. İzlenebilirlik ve kontrol edilebilirlik\n\n- **Doğrulandı:** dağıtım sistemine bağlı 10 MW ve üzeri rüzgâr ve güneş santrallerinin MW ve MVAr verisi, dağıtım şirketinin SCADA sistemi üzerinden TEİAŞ SCADA sistemine aktarılır.\n- İşletmecinin aktif güç sınırlama talimatını uygulama yeteneği.\n- Tahmin verisi sağlama.\n\nKısaltmalar:\n\n- **SCADA** (Supervisory Control and Data Acquisition): uzaktan izleme, kumanda ve veri toplama sistemi.\n- **TEİAŞ:** Türkiye Elektrik İletim A.Ş., iletim sistemi işletmecisi.\n- **MVAr:** megavolt-amper reaktif, reaktif güç birimi (Mvar ile aynı).\n\nBu madde, TEİAŞ'ın güneş tahmin ve \"YTBS–sistem kullanıcıları entegrasyonu\" projesinin (`01/03`) mevzuat dayanağıdır. YTBS, Yük Tevzi Bilgi Sistemi'dir (MAM'ın enerji yönetim platformu).\n\n10 MW'ın altındaki on binlerce santral ölçülmez; tahmin edilir.\n\nDiğer başlıklar:\n\n- Güç kalitesi (harmonik, kırpışma)\n- Koruma ayarları\n- Ada çalışmayı önleme\n- Model ve benzetim sunma\n- Uygunluk testleri\n\n## Lisanssız üretim\n\nLisanssız üretim, belirli bir gücün altındaki tesislerin, üretim lisansı almadan ve şirket kurmadan, öncelikle kendi tüketimini karşılamak üzere kurulmasıdır.\n\nÇoğunluğu çatı ve arazi tipi güneştir ve **dağıtım şebekesine** bağlanır.\n\n### Güncel mevzuat\n\n**Doğrulandı** (EPDK duyurusu; EPDK, Enerji Piyasası Düzenleme Kurumu'dur):\n\n- Lisanssız Elektrik Üretim Yönetmeliği'nde 2 Nisan 2026 tarihli ve 33212 sayılı Resmî Gazete ile değişiklik yapıldı.\n- **1 Mayıs 2026'dan itibaren saatlik mahsuplaşmaya** geçildi. İşlemler EPİAŞ'ın (Enerji Piyasaları İşletme A.Ş.) Lisanssız Üretim Modülü (LÜM) üzerinden yürür.\n- **Mesken abonelerinde aylık mahsuplaşma devam ediyor.**\n- İlgili Kurul Kararı: 30 Nisan 2026, 14531 sayılı.\n\n**İkincil** (haber ajansı): 2026 için tahsis edilen lisanssız kapasite yaklaşık 3,5 GW (gigavat); bunun 1.500 MW'ı iletim, yaklaşık 2.000 MW'ı dağıtım seviyesinde.\n\n**Çelişkili, doğrula:** lisanssız tesisin kurulu güç üst sınırı için kaynaklarda hem 1 MW hem 5 MW geçiyor. Tesis türüne ve bağlantı anlaşmasındaki sözleşme gücüne göre farklı kurallar var. Mülakatta tek sayı söyleme; yönetmeliğin güncel metnine bak.\n\n**Doğrulandı:** bağlanabilir kapasite, 6446 sayılı Kanun'un 23. maddesi uyarınca TEİAŞ tarafından bölge bazında (15 bölge) yayımlanır.\n\n### Mahsuplaşma neden önemli\n\nMahsuplaşma, üretim ile tüketimin hangi zaman aralığında birbirinden düşüleceğidir.\n\n#### Elle örnek\n\nBir işyeri bir günde şöyle üretip tüketiyor. Net sütunu, üretimden tüketimin çıkarılmasıdır: artı ise şebekeye verir, eksi ise şebekeden çeker.\n\n| Saat | Üretim | Tüketim | Net |\n| --- | --- | --- | --- |\n| Öğlen | 10 kWh | 2 kWh | +8 (şebekeye verir) |\n| Akşam | 0 kWh | 8 kWh | −8 (şebekeden çeker) |\n| Gün toplamı | 10 | 10 | 0 |\n\nkWh, kilovat-saat, enerji birimidir.\n\nİki mahsuplaşma türü aynı günü farklı hesaplar:\n\n- **Aylık mahsuplaşma:** dönem sonunda net sıfır. Şebeke bedava batarya gibi kullanılmıştır.\n- **Saatlik mahsuplaşma:** öğlen verilen 8 kWh ile akşam çekilen 8 kWh ayrı ayrı, kendi saatlerinin koşullarıyla uzlaştırılır. Net sıfır değildir.\n\nSonuç: saatlik mahsuplaşma, üretimi tüketildiği saate yaklaştırmayı ödüllendirir: öz tüketim, yük kaydırma, depolama.\n\n| Bakış açısı | Etkisi |\n| --- | --- |\n| Şebeke | Öğlen ters akışı ve akşam puantı azalır |\n| Yatırımcı | Geri ödeme süresi uzar |\n\n> **Sade anlatım:** Aylıkta şebeke senin bedava bataryandı; öğlen fazlanı yazıp akşam geri alıyordun. Saatlikte her saat kendi hesabını kapatır, bu yüzden üretimini o saatte kendin kullanman ya da bir bataryada tutman kârlı hale gelir.\n\n### Dağıtım şebekesine etkileri\n\n| Etki | Mekanizma | Ayrıntı |\n| --- | --- | --- |\n| Gerilim yükselmesi | Ters aktif güç akışı, R baskın hat | `04/02` elle örnek |\n| Ters güç akışı | Üretim yerel yükü aşar; trafo ters yüklenir | Kademe değiştirici ve koruma tek yön varsayar |\n| Koruma | Körleme, yanlış açma, tekrar kapamada eşzamansızlık, istenmeyen ada | `10/02` |\n| Kısa devre | Evirici katkısı küçük ama sıfır değil; çok sayıda eviricide toplanır | `06/02` |\n| Dengesizlik | Tek fazlı çatı sistemleri fazlara eşit dağılmaz | `05/03` |\n| Kayıp | Az üretim kaybı düşürür; çok üretim (ters akış) artırır | U biçimli eğri |\n| Gözlenebilirlik | Sayaç arkasındaki üretim görülmez; yalnız net yük ölçülür | `04/03` |\n| Net yük biçimi | Öğlen çukur, akşam dik rampa (\"ördek eğrisi\") | Esneklik ihtiyacı |\n| Tahmin | Yük tahmini artık yük eksi görülmeyen üretimin tahminidir | `18/02` |\n| İletim | Toplamda büyük; trafo merkezlerinden iletime ters akış | Bağlanabilir kapasiteyi tüketir |\n\nTablodaki bazı terimler:\n\n- **R baskın hat:** direnci (R) reaktansına göre büyük olan dağıtım hattı; burada aktif güç akışı gerilimi doğrudan etkiler.\n- **Körleme:** üretim kaynağının arıza akımının bir kısmını karşılaması yüzünden rölenin arızayı görememesi.\n- **Tekrar kapama:** arızadan sonra kesicinin hattı otomatik olarak yeniden kapatması.\n- **Ördek eğrisi:** öğlen çöken, akşam dikleşen net yük eğrisi; biçimi ördeğe benzer.\n\n**Barındırma kapasitesi:** bir fidere, hiçbir sınır (gerilim, ısıl, koruma, güç kalitesi) bozulmadan bağlanabilecek en büyük üretim. Fider, trafo merkezinden çıkan dağıtım hattıdır.\n\nTek bir sayı değildir; nereye bağlandığına ve evirici ayarlarına bağlıdır.\n\nArtırma yolları, ucuzdan pahalıya:\n\n1. Evirici volt-var\n2. Kademe ayarı\n3. Yeniden yapılandırma\n4. Dinamik ihracat sınırı\n5. Depolama\n6. İletken ve trafo yenileme\n\n## Depolama kullanım alanları\n\nDepolama tek bir hizmet değil, bir hizmetler demetidir. Hizmetleri zaman ölçeğine göre ayır:\n\n| Zaman ölçeği | Hizmet | Ne gerektirir |\n| --- | --- | --- |\n| Milisaniye–saniye | Hızlı frekans tepkisi, sanal atalet, şebeke kurma | Güç (MW), hızlı evirici; az enerji |\n| Saniye–dakika | Primer ve sekonder frekans kontrolü | Güç; sık ve sığ çevrim |\n| Dakika–saat | Yenilenebilir üretimi düzgünleştirme, rampa desteği, dengesizlik azaltma | Güç ve enerji |\n| Saat | Enerji arbitrajı, puant tıraşlama, kısıntıyı azaltma | Enerji (MWh) |\n| Saat (yerel) | İletim ve dağıtım yatırımını erteleme, kısıt giderme, gerilim desteği | Doğru **yer** |\n| Olay bazlı | Sıfırdan enerjilendirme, yedek güç | Şebeke kuran evirici |\n\nİki boyutu ayır:\n\n- **Güç (MW, megavat):** ne kadar hızlı verebildiği.\n- **Enerji (MWh, megavat-saat):** ne kadar süre verebildiği.\n\n100 MW / 200 MWh batarya iki saatliktir (200 / 100 = 2 saat).\n\n### Elle örnek: arbitraj\n\nArbitraj, ucuz saatte alıp pahalı saatte satmaktır.\n\nVeriler: 100 MWh boşaltabilen batarya, gidiş-dönüş verimi %85. Ucuz saatte 1.000, pahalı saatte 3.000 TL/MWh.\n\nGidiş-dönüş verimi, şarj edilen enerjinin ne kadarının geri alınabildiğidir. %85, 100 birim yüklersen 85 birim geri alırsın demektir.\n\nHesabın adımları:\n\n- **Birinci satır:** 100 MWh satabilmek için verim kaybı yüzünden daha fazla enerji almak gerektiğini, yani ne kadar alınacağını bulur.\n- **İkinci satır:** bu enerjinin ucuz saatteki fiyatla maliyetini bulur.\n- **Üçüncü satır:** boşaltılan 100 MWh'nin pahalı saatteki satış gelirini bulur.\n- **Dördüncü satır:** gelirden maliyeti çıkararak bir şarj-boşaltma çevriminin brüt kazancını bulur.\n\n```\n100 MWh satmak için alınması gereken enerji = 100 / 0,85 = 117,6 MWh\nAlış maliyeti = 117,6 × 1.000 = 117.647 TL\nSatış geliri  = 100 × 3.000   = 300.000 TL\nÇevrim başına brüt kazanç     = 182.353 TL\n```\n\nBaşa baş koşulu: `satış fiyatı / alış fiyatı > 1 / 0,85 = 1,18`. Bu oran, verim kaybını tam karşılayan fiyat farkıdır.\n\nFiyat farkı %18'in altındaysa çevrim zarar eder. Buna batarya yıpranma maliyeti eklenir.\n\n### Depolamanın sınırları\n\n- **Enerji üretmez**, kaydırır; ve kayıpla kaydırır.\n- Lityum iyon bataryalar tipik olarak 1–4 saatliktir. Günlerce süren rüzgârsız ve güneşsiz dönemi çözmez; orada pompaj depolamalı hidroelektrik, hidrojen veya esnek termik gerekir.\n- Bir megavat aynı anda iki hizmete satılamaz. Hizmetleri üst üste koymak (değer yığma) gelir için şarttır ama şarj durumu yönetimi ister.\n- Şebeke açısından **yeri** belirleyicidir: kısıtın yanlış tarafındaki batarya kısıtı çözmez.\n\n### Türkiye\n\n- **İkincil:** 2022'nin sonundan itibaren depolamalı rüzgâr ve güneş santrali ön lisans başvuruları alındı ve büyük bir hacim oluştu. Rakamı doğrulamadım.\n- **İkincil, doğrula** (bir hukuk bürosu bülteni): Nisan 2026 tarihli Kurul Kararlarıyla (14482–14484) depolamalı tesisler için yeni kapasite tahsisinin durdurulduğu, önceliğin mevcut santrallere eklenen birleşik (hibrit) kapasiteye verildiği belirtiliyor. EPDK'nın kendi metninden okumadım.\n\n### Analiz yazılımı açısından\n\nDepolama zordur, çünkü dönemleri birbirine bağlar: bu saatteki karar, sonraki saatin şarj durumunu belirler.\n\nTek dönemli optimal güç akışı, çok dönemli bir probleme döner. Optimal güç akışı, şebeke sınırlarını bozmadan maliyeti en aza indiren üretim dağılımını bulan hesaptır.\n\n## Yaygın yanlış\n\n| Yanlış inanış | Doğrusu |\n| --- | --- |\n| **\"Arızada evirici kendini korumak için ayrılmalı.\"** | Eski kural. Bugün bağlı kalması ve reaktif akım vermesi istenir. |\n| **\"Evirici istediği kadar reaktif güç verir.\"** | Görünür güç sınırı içinde; tam üretimde kapasitesi sıfıra iner. |\n| **\"Güneş santrali frekans düşünce destek olur.\"** | Zaten elindekinin tamamını üretiyorsa artıramaz. Yalnızca azaltabilir (yüksek frekansta). |\n| **\"Lisanssız üretim küçüktür, iletimi etkilemez.\"** | Toplamı gigavatlar mertebesindedir ve öğlen net yükü belirler. |\n| **\"Mahsuplaşma bir muhasebe ayrıntısıdır.\"** | Yatırımcının davranışını, dolayısıyla şebekeye ters akışı belirler. |\n| **\"Depolama yenilenebilirin bütün sorunlarını çözer.\"** | Saatlik kaydırmayı çözer; mevsimlik dengeyi ve iletim kısıtını (yanlış yerdeyse) çözmez. |\n| **\"Batarya kapasitesi megavatla söylenir.\"** | İki sayı gerekir: MW ve MWh. |\n| **\"Şebeke kodu evrenseldir.\"** | Her ülkenin eğrileri ve katsayıları farklıdır. Türkiye'ninkini yönetmelikten oku. |\n\n## Panel takip sorusu\n\n### Gerilim yükselen fider\n\nSoru: \"Çatı güneşinin yoğun olduğu bir fiderde gerilim yükseliyor. Sırayla ne yaparsın?\"\n\n> **Mülakatta şöyle söyle:** Önce ölçümle doğrularım: hangi saat, hangi faz, fiderin neresi. Sonra ucuzdan pahalıya: evirici volt-var ayarı, trafo kademesi, faz dengeleme, yeniden yapılandırma, ihracat sınırı, depolama, en son iletken değişimi. Her adımın yan etkisini (kayıp, kademe aşınması, üretim kaybı) söylerim.\n\n### Görünmeyen küçük santraller\n\nSoru: \"10 MW altındaki santralleri göremiyorsan net yükü nasıl tahmin edersin?\"\n\n> **Mülakatta şöyle söyle:** Ölçülen temsilî santrallerden ve uydu veya hava modeli ışınımından bölgesel üretimi kestirir, kurulu güç kaydıyla ölçeklerim. MAM'ın SEERC 2025 bildirisi bu konudadır; yöntemin ayrıntısını bildiriden okumam gerekir.\n\nMAM, TÜBİTAK Marmara Araştırma Merkezi'dir. SEERC, bildirinin sunulduğu bölgesel konferanstır (ayrıntısı `01/03`).\n\n### Depolama ve optimal güç akışı\n\nSoru: \"Depolamayı optimal güç akışına nasıl eklersin?\"\n\nCevaptaki denklem, bir sonraki dönemin enerjisini (`E_{t+1}`) bu dönemin enerjisinden (`E_t`) hesaplar. Şarjda verim (`η`) kadar az enerji girer, deşarjda verime bölündüğü için daha fazla enerji çıkar. `Δt` dönem uzunluğudur.\n\n> **Mülakatta şöyle söyle:** Her dönem için şarj ve deşarj gücü ile şarj durumu değişkenleri; `E_{t+1} = E_t + η P_şarj Δt − P_deşarj Δt / η`; şarj durumu ve güç sınırları. Aynı anda şarj ve deşarjı önlemek için ikili değişken veya gevşetme.\n\nAşağıdaki metin mülakatta 90 saniyede söyleyebileceğin özettir. Metindeki \"on sekizinci ek\", yukarıdaki Ek-18'dir.\n\n## 90 saniye\n\n\"Evirici ne programlanırsa onu yapar; şebeke kodu bu programın asgarisini belirler. Dört temel gereksinim var: arızada gerilim–zaman eğrisinin üstünde bağlı kalmak ve reaktif akım vermek, volt-var gibi kiplerle gerilimi desteklemek, yüksek frekansta aktif gücü eğimle azaltmak ve işletmeci tarafından izlenip kontrol edilebilmek. Türkiye'de rüzgâr ve güneş için bu koşullar şebeke yönetmeliğinin on sekizinci ekindedir; eğri sayılarını ezberden söylemem. Lisanssız üretim dağıtıma bağlanır; gerilim yükselmesi, ters akış, koruma ve gözlenebilirlik sorunları getirir. Mayıs 2026'da mesken dışı aboneler için saatlik mahsuplaşmaya geçildi; bu, öz tüketimi ve depolamayı özendirir. Depolamada gücü ve enerjiyi ayırırım; hizmeti zaman ölçeği ve yer belirler.\"\n"}, {"id": "18-Veri-ve-Yapay-Zeka/00-Alt-Basliklar.md", "group": "18  Veri ve yapay zekâ", "title": "18 — Veri analitiği ve yapay zekâ", "body": "# 18 — Veri analitiği ve yapay zekâ\n\nBu bölüm, güç sisteminde tahmin ve öğrenen modellerin (makine öğrenmesi, derin öğrenme) nerede işe yarayıp nerede yaramadığını anlatır. Konular iki sayfaya dağılmıştır:\n\n- [01-Tahmin-Ogrenir-Model-Sinir.md](01-Tahmin-Ogrenir-Model-Sinir.md): tahminin hangi işletme kararını beslediği, güvenlikte öğrenen modelin rolü, altyapının görünen yüzü.\n- [02-Tahmin-Dogrulama-Fizik-Bilgili-ML-Sinirlari.md](02-Tahmin-Dogrulama-Fizik-Bilgili-ML-Sinirlari.md): tahmin doğrulaması, hata ölçütleri ve elle örnekler, fizik bilgili modeller, makine öğrenmesinin (ML, machine learning) sınırları.\n\n## Alt başlıklar\n\n1. **İşletme tahmininin türleri**\n   Bu maddede tahminin ufka göre (saniyeden yıla) hangi işletme kararını beslediğini öğreneceksin.\n2. **Yük tahmini: takvim, hava, özel gün**\n   Bu maddede yükü hangi girdilerin (saat, gün, tatil, sıcaklık) belirlediğini ve hangi modelin baz alındığını öğreneceksin.\n3. **Rüzgâr ve güneş tahmini**\n   Bu maddede hava tahmininden güç tahminine nasıl geçildiğini ve santral ile bölge hatasının neden farklı olduğunu öğreneceksin.\n4. **Net yük ve rampa**\n   Bu maddede sistem işletmecisinin asıl gördüğü net yükün ne olduğunu ve rampa olaylarının neden ayrı incelendiğini öğreneceksin.\n5. **Tahmin hatası ve yedek**\n   Bu maddede hata ölçütlerini (MAE, RMSE, MAPE, NMAE) ve hata bandının yedek boyutunu nasıl belirlediğini öğreneceksin.\n6. **Güvenlik ve kararlılıkta öğrenen model**\n   Bu maddede öğrenen modelin arıza vakalarını elemek için nasıl kullanıldığını ve kararın neden fizik motoruna bırakıldığını öğreneceksin.\n7. **Anomali ve kötü veri**\n   Bu maddede anomali tespitinin durum kestirimindeki kötü veri testiyle ilişkisini öğreneceksin.\n8. **Özellik ile fizik**\n   Bu maddede fizik bilgisini modele sokmanın yollarını (fiziksel öznitelik, artık modelleme, fizikle doğrulama) öğreneceksin.\n9. **Eğitim, doğrulama, test; zaman sızıntısı**\n   Bu maddede zaman serisinde veriyi neden zamana göre bölmen gerektiğini ve sızıntı türlerini öğreneceksin.\n10. **Açıklanabilirlik ve operatör**\n    Bu maddede operatörün neden gerekçesini anlamadığı öneriyi uygulamadığını ve açıklama yöntemlerini öğreneceksin.\n11. **Modelin eskimesi**\n    Bu maddede yeni hat, yeni santral gibi değişimlerden sonra modelin neden eskidiğini ve nasıl izlendiğini öğreneceksin.\n12. **Büyük veri altyapısının analizciye görünen yüzü**\n    Bu maddede veri ve model sürümleme, çevrimiçi süre ve başarısızlık durumunda ne olacağını öğreneceksin.\n13. **Ne zaman fizik, ne zaman öğrenen model**\n    Bu maddede veri boyuna ve kararın kritikliğine göre fizik tabanlı yöntemle öğrenen model arasında nasıl seçim yapılacağını öğreneceksin.\n"}, {"id": "18-Veri-ve-Yapay-Zeka/01-Tahmin-Ogrenir-Model-Sinir.md", "group": "18  Veri ve yapay zekâ", "title": "Tahmin ve öğrenen modeller", "body": "# Tahmin ve öğrenen modeller\n\nBu sayfada şunları öğreneceksin: tahminin hangi işletme kararını beslediği, hata ölçütlerinin neden tek başına yetmediği, güvenlik analizinde öğrenen modelin sınırı ve altyapıda neyi anlatman gerektiği.\n\n\"Öğrenen model\", veriden kalıp çıkaran model demektir (makine öğrenmesi, derin öğrenme). \"Fizik motoru\" ise yük akışı gibi denklemleri doğrudan çözen hesap yazılımıdır.\n\n## Neden bu konu önemli\n\nGrubun iş tanımındaki madde açıktır: büyük veri, derin öğrenme ve optimizasyon destekli iletim işletme ve planlama araçları.\n\nYTBS (Yük Tevzi Bilgi Sistemi, MAM'ın enerji yönetim platformu; MAM = TÜBİTAK Marmara Araştırma Merkezi) bunu dört yerde kullanır:\n\n- güvenlik,\n- yük tahmini,\n- yenilenebilir tahmini,\n- işletme planı.\n\nTEİAŞ (Türkiye Elektrik İletim A.Ş.) RİTM projesi (rüzgâr üretim izleme ve tahmin projesi) rüzgâr tahminini üç tür modelle kurmayı hedefler: fiziksel, istatistiksel ve hibrit (ikisinin karışımı). Çözünürlük saatliktir, ufuk çok günlüktür.\n\n> Sade anlatım: \"Yapay zekâ biliyorum\" demek yetmez. Hangi işletme kararını beslediğini söylemen gerekir.\n\n## Tahmin\n\n### Yük tahmini\n\nYükü belirleyen girdiler:\n\n| Girdi türü | Örnekler |\n| --- | --- |\n| Takvim | Saat, haftanın günü, tatil, ramazan, sanayi vardiyası |\n| Hava | Sıcaklık, nem, rüzgâr |\n| Büyük müşteri | Büyük müşterinin üretim planı |\n\nHangi model nerede güçlü:\n\n- **Doğrusal modeller ve gradyan ağaçlar** (örneğin gradyan boosting; çok sayıda küçük karar ağacının art arda birbirinin hatasını düzelttiği yöntem) saatlik yükte hâlâ güçlü bir bazdır. \"Baz\", yeni modelin yenmesi gereken basit kıyas modelidir.\n- **Derin ağ** (çok katmanlı sinir ağı), çok bölgeli ve hava alanlı (harita biçiminde hava verisi kullanan) problemde işe yarar.\n\nKural: baz modelini yenmeden derin model anlatma.\n\n### Rüzgâr ve güneş tahmini\n\nTahmin üç adımda kurulur:\n\n1. Sayısal hava tahmini alınır (hava modelinin rüzgâr hızı, ışınım gibi çıktıları).\n2. Güç eğrisiyle güce çevrilir (rüzgâr hızı veya ışınım → MW, megavat).\n3. Sahadaki ölçümle düzeltilir.\n\nSantral altı (türbin, invertör) tahmin ile bölge tahmini farklı hatalıdır:\n\n- Bölge hatası daha küçüktür, çünkü santrallerin hataları birbirini iptal eder.\n- Yedek, bölge hatasına göre boyutlanır.\n\nDikkat: kapasite faktörünü tahmin hatası sanma. Kapasite faktörü, santralin ortalamada kurulu gücünün ne kadarını ürettiğidir; tahminin ne kadar yanıldığıyla ilgisi yoktur.\n\n### Ufuklar\n\nHer tahmin ufku farklı bir kararı besler:\n\n| Ufuk | Karar |\n| --- | --- |\n| Saniye–dakika | Regülasyon, birincil sapma |\n| Saat öncesi | Gün içi, dengeleme |\n| Gün öncesi | Ünite tahsisi, gün öncesi piyasa |\n| Hafta | Bakım, hidro su |\n| Yıl | Planlama senaryosu, nokta tahmin değil |\n\n\"Ünite tahsisi\", hangi santralin hangi saatte devrede olacağına karar vermektir.\n\n### Hata ölçütleri\n\nKısaltmalar:\n\n- **MAE** (Mean Absolute Error, ortalama mutlak hata)\n- **RMSE** (Root Mean Square Error, karekök ortalama kare hata)\n- **MAPE** (Mean Absolute Percentage Error, ortalama mutlak yüzde hata)\n\nYüzde hata (MAPE) iki yerde yanıltır:\n\n- puantta (yükün en yüksek olduğu saatlerde),\n- sıfıra yakın güneşte. Güneş gece sıfırken MAPE anlamsızlaşır, çünkü sıfıra bölmeye yaklaşır.\n\nBu yüzden mutlak MW hatasını da söyle.\n\nHata bandı (quantile, yüzdelik) tek noktadan değerlidir. Tek nokta tahmin yalnız bir değer söyler; hata bandı ise gerçek değerin büyük olasılıkla düşeceği bir aralık verir. Rezerv, bandın genişliğine göre tutulur.\n\n### Zaman sızıntısı\n\nZaman sızıntısı, modelin tahmin anında bilemeyeceği bir bilgiyi eğitimde görmesidir. İki tipik hali:\n\n- yarının havasını bugünün modeline \"bilgi\" diye vermek,\n- rastgele bölmeyle geleceği karıştırmak.\n\nDoğru yöntem:\n\n- Test seti son yıl olmalı; karışık satır bölmesi olmamalı.\n- Tatil ve fırtına testte ayrı bakılmalı.\n- Ortalama hata iyi, en kötü gün kötüyse model işletme aracı olmaz.\n\nAyrıntılı doğrulama yöntemi için: [02-Tahmin-Dogrulama-Fizik-Bilgili-ML-Sinirlari.md](02-Tahmin-Dogrulama-Fizik-Bilgili-ML-Sinirlari.md).\n\n## Güvenlik ve kararlılık\n\n### Öğrenen model ne yapar\n\nÖğrenen model, binlerce simülasyondan öğrenip \"bu arıza büyük ihtimalle kararlı / termik ihlalli\" diye eleme yapar. Termik ihlal, hattın ısınma sınırını aşacak kadar yüklenmesidir.\n\nModel seçenekleri:\n\n| Model | Artısı | Eksisi |\n| --- | --- | --- |\n| Karar ağacı | Eşiği operatöre cümle gibi okunabilir | Daha az doğru olabilir |\n| Orman ve gradyan ağaç | Daha doğru olabilir | Okunması zor |\n| Sinir ağı | Daha esnek | Gerekçesi daha zor |\n\nFizik tabanlı özellikler ham SCADA (Supervisory Control and Data Acquisition, uzaktan izleme ve veri toplama sistemi) dökümünden daha iyi geneller. Örnekler:\n\n- açı farkı,\n- koridor akışı,\n- atalet,\n- gerilim marjı.\n\n### Kural: model eler, fizik doğrular\n\n- Öğrenen model eleme ve sıralama yapar.\n- İhlal adayı fizik motorunda doğrulanır.\n- Kumanda veya yük atma, yalnız öğrenen skorla tetiklenmez.\n- SIPS'te (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması) tetik, önceden tanımlanmış ve test edilmiş mantıktır.\n- Öğrenen model o mantığın eşiğini önermek için kullanılırsa, değişiklik yine mühendislik onayından geçer.\n\n### Model eskimesi\n\nEğitim verisi yalnız görülmüş topolojileri (şebekenin hat ve bara bağlantı yapısını) kapsar. Yeni hat girdikten sonra model eskir.\n\nBunu \"concept drift\" (kavram kayması, verideki ilişkinin zamanla değişmesi) diye adlandırıp bırakma. Şöyle de:\n\n> Mülakatta şöyle söyle: \"Model sürümü, şebeke sürümüne bağlı; büyük topoloji değişiminde yeniden eğitim ve yeniden doğrulama.\"\n\n### Anomali tespiti ve kötü veri testi\n\nDurum kestirimi, ölçümlerden şebekenin anlık durumunu hesaplayan yöntemdir. İçindeki kötü veri testi, hatalı ölçümü yakalar.\n\nAnomali tespiti bu testin rakibidir, yerine geçeni değildir:\n\n| Yöntem | Neye dayanır | Ne söyler |\n| --- | --- | --- |\n| Artık testi (kötü veri testi) | Fizik ölçüm fonksiyonuna | Ölçüm fiziğe uymuyor |\n| Anomali modeli | Geçmiş veriye | \"Bu ölçek alışılmadık\"; polarite hatasını kanıtlamaz |\n\nİkisi birlikte, operatöre daha az yanlış alarm vermek için kullanılır.\n\n## Altyapının görünen yüzü\n\nAraştırmacının anlatacağı mimari, platform pazarlaması değildir. Anlatman gerekenler:\n\n- Ölçüm kimliği, zaman damgası, kalite\n- Eğitim veri setinin versiyonu\n- Özelliklerin şebeke modelinden tekrar üretilebilir olması\n- Model dosyasının sürümü ve hangi kodla eğitildiği\n- Çevrimiçi süre: tahmin saatlikse saniye yeter; güvenlik elemesi N-1 döngüsüne sığmalı (N-1: herhangi tek bir elemanın kaybında sistemin güvenli kalması ölçütü)\n- Başarısızlık: model cevap vermezse fizik motoru veya son sağlam tahmin devreye girer\n\n### Derin öğrenme ne zaman haklı\n\nDerin öğrenme, özelliğin kendisinin öğrenildiği yerde haklıdır. Örnekler: ham hava alanı, çok değişkenli zaman serisi.\n\nOn baralık bir fiderde üç yıllık veriyle derin ağ kurmak, ezber ve gürültüdür.\n\nKural: veri boyu, model kapasitesinden küçükse basit modeli seç.\n\n## 90 saniye\n\n“Tahmini, beslediği kararla anlatırım: gün öncesi ünite tahsisi, saat öncesi dengeleme, saniye mertebesi rezerv. Hata bandı rezervi belirler, MAPE tek başına yetmez. Güvenlikte öğrenen model arızayı eler, fizik doğrular, SIPS eşiği onaysız değişmez. Test seti gelecektedir, karışık satır değildir. Yeni hat, modeli eskidir. Veri azsa derin ağ değil, fizik özellikli basit model kullanırım.”\n"}, {"id": "18-Veri-ve-Yapay-Zeka/02-Tahmin-Dogrulama-Fizik-Bilgili-ML-Sinirlari.md", "group": "18  Veri ve yapay zekâ", "title": "Tahmin doğrulaması ve ML sınırları", "body": "# Tahmin doğrulaması ve ML sınırları\n\nBu sayfanın tam konusu: tahmin doğrulaması, fizik bilgili modeller, güç sistemlerinde makine öğrenmesinin (ML, machine learning) sınırları.\n\nBu sayfada şunları öğreneceksin:\n\n- yük ve üretim tahmininin ufuklara göre nasıl ayrıldığı,\n- zaman serisinde doğrulamanın nasıl yapıldığı ve sızıntının nasıl önlendiği,\n- hata ölçütlerinin elle nasıl hesaplandığı,\n- fizik bilgisini modele sokmanın altı yolu,\n- makine öğrenmesinin güç sisteminde nerede durması gerektiği.\n\n## İki tuzak\n\nBu konuda iki tuzak var:\n\n1. **Fazla hevesli görünmek:** \"her şeyi yapay zekâyla çözerim.\"\n2. **Fazla şüpheci görünmek.**\n\nMAM'ın (TÜBİTAK Marmara Araştırma Merkezi) YTBS (Yük Tevzi Bilgi Sistemi) tanımında \"yapay zekâ destekli güvenlik analizi ve tahmin\" geçer; grup bu araçları kullanıyor.\n\n> Sade anlatım: Panelin duymak istediği, **nerede işe yaradığını ve nerede yaramadığını** bilen biri.\n\n## Yük ve üretim tahmini\n\n### Ufuklar\n\nTahmin ufku, ne kadar ileriyi tahmin ettiğindir. Her ufkun kullanıldığı karar ve baskın girdisi farklıdır:\n\n| Ufuk | Kullanım | Baskın girdi |\n| --- | --- | --- |\n| Çok kısa (dakika–saat) | Gerçek zamanlı dengeleme, AGC, kısıt | Son ölçümler, gökyüzü görüntüsü, uydu |\n| Kısa (saat–birkaç gün) | Gün öncesi piyasa, ünite tahsisi, güvenlik analizi | Sayısal hava tahmini, takvim |\n| Orta (hafta–ay) | Bakım, yakıt, hidrolik planlama | Mevsim, iklim normalleri |\n| Uzun (yıl–on yıl) | Yatırım planlaması | Ekonomi, nüfus, teknoloji benimseme |\n\nAGC (Automatic Generation Control, otomatik üretim kontrolü), frekansı ve bölgeler arası akışı korumak için santral çıkışlarını otomatik ayarlayan kontroldür.\n\n### Neyi tahmin ediyoruz\n\n| Büyüklük | Özelliği |\n| --- | --- |\n| **Yük** | Güçlü günlük, haftalık ve yıllık örüntü; sıcaklığa doğrusal olmayan bağımlılık (ısıtma ve soğutma); tatiller ve özel günler |\n| **Rüzgâr** | Rüzgâr hızının küpüyle gider; güç eğrisi doğrusal değildir; hava tahmininin hatası baskındır |\n| **Güneş** | Büyük kısmı belirlenimlidir (güneşin konumu, açık gökyüzü modeli); belirsiz olan buluttur |\n| **Net yük** | Yük eksi sayaç arkası üretim. Sistem işletmecisinin asıl gördüğü budur |\n\n\"Sayaç arkası üretim\", çatı güneşi gibi tüketicinin kendi tarafında olan ve şebekeye görünmeyen üretimdir.\n\n### Olasılıksal tahmin\n\nTek bir sayı yerine dağılım verilebilir. **Olasılıksal tahmin** yüzdelikler veya aralık verir.\n\nYedek boyutlandırma ve stokastik eniyileme (`13/02`, bkz. [02-DCOPF-LMP-Gevsetme-Stokastik-Araclar.md](../13-Optimizasyon/02-DCOPF-LMP-Gevsetme-Stokastik-Araclar.md)) bunu ister. Stokastik eniyileme, belirsizliği senaryolarla hesaba katan optimizasyondur.\n\n## Doğrulama yöntemi\n\nZaman serisinde doğrulama, sıradan makine öğrenmesinden farklıdır. En sık yapılan hatalar buradadır ve hepsi sonucu **olduğundan iyi** gösterir.\n\n### 1. Rastgele bölme yapılmaz\n\nVeriyi karıştırıp %80 eğitim, %20 sınama ayırırsan, model sınama gününün hem dününü hem yarınını görmüş olur.\n\nZaman serisinde komşu örnekler ilişkilidir; bu bir sızıntıdır. Sızıntı, modelin gerçek kullanımda bilemeyeceği bilgiyi eğitimde görmesidir.\n\nDoğrusu: **zamana göre böl.** Eğitim geçmişte, sınama gelecekte.\n\n### 2. Kayan başlangıçlı doğrulama\n\nTek bir bölme tek bir mevsimi sınar. Bunun yerine eğitim penceresi her adımda bir ay büyütülür ve bir sonraki ay sınanır. Aşağıdaki şema bu sırayı gösterir:\n\n```\nEğitim: [Oca–Haz]              →  Sınama: Tem\nEğitim: [Oca–Tem]              →  Sınama: Ağu\nEğitim: [Oca–Ağu]              →  Sınama: Eyl\n...\n```\n\n- Her adımda model yeniden eğitilir ve bir sonraki dönemi tahmin eder.\n- Gerçek işletmedeki kullanımın benzetimidir.\n- En az bir tam yılı kapsamalıdır; yaz ve kış hataları farklıdır.\n\n### 3. Sızıntı denetimi\n\nSızıntının beş tipik türü:\n\n| Sızıntı | Örnek |\n| --- | --- |\n| Gerçekleşen hava verisi kullanmak | İşletmede elinde yalnız hava **tahmini** olur. Gerçekleşen sıcaklıkla eğitilen modelin hatası sahada iki katına çıkar |\n| Tahmin anında bilinmeyen girdi | Yarının yükünü tahmin ederken yarının gerçekleşen üretimini kullanmak |\n| Ölçekleme sızıntısı | Normalleştirme katsayılarını bütün veriden hesaplamak |\n| Hedef sızıntısı | Hedefin gecikmeli hali, gecikme tahmin ufkundan kısaysa |\n| Veri düzeltme sızıntısı | Sonradan düzeltilmiş sayaç verisiyle eğitmek; işletmede ham veri gelir |\n\nKural: her girdi için sor, \"tahmini yaptığım anda bu değeri gerçekten biliyor muyum?\"\n\n### 4. Kıyas modeli\n\nBir modelin hatası tek başına anlamsızdır. Karşılaştırılacak basit modeller:\n\n| Kıyas modeli | Varsayımı | Nerede güçlü |\n| --- | --- | --- |\n| **Kalıcılık** | \"Bir sonraki değer şimdiki değerdir.\" | Çok kısa ufukta yenmesi zordur |\n| **Mevsimsel kalıcılık** | \"Yarın bu saat, geçen hafta aynı gün aynı saat gibidir.\" | Yük için güçlü |\n| **İklim ortalaması** | O saat ve mevsim için tarihsel ortalama | — |\n\n**Beceri puanı** = `1 − hata_model / hata_kıyas`\n\n- Sıfırsa model kıyastan iyi değil.\n- Eksiyse daha kötü.\n\n### 5. Ölçütler\n\nFormüllerde `e` hatadır (tahmin − gerçek), `ort` ortalamadır.\n\n| Ölçüt | Açılımı | Formül | Not |\n| --- | --- | --- | --- |\n| MAE | Mean Absolute Error, ortalama mutlak hata | `ort(|e|)` | Anlaşılır; MW (megavat) cinsinden |\n| RMSE | Root Mean Square Error, karekök ortalama kare hata | `√ort(e²)` | Büyük hataları cezalandırır. Yedek, büyük hataya göre boyutlandığı için sistem işletmecisi için anlamlıdır |\n| MAPE | Mean Absolute Percentage Error, ortalama mutlak yüzde hata | `ort(|e| / |gerçek|)` | Gerçek değer sıfıra yaklaşınca patlar. Güneş ve rüzgârda kullanılmaz |\n| NMAE | Normalized MAE, normalleştirilmiş ortalama mutlak hata | `MAE / kurulu güç` | Santraller ve bölgeler arası karşılaştırma. Yenilenebilirde standart |\n| Yanlılık | — | `ort(e)` | Sistematik fazla veya eksik tahmin |\n| Pinball kaybı, CRPS | CRPS: Continuous Ranked Probability Score, sürekli sıralı olasılık puanı | — | Olasılıksal tahmin için |\n\n### NMAE %2 nasıl yorumlanır\n\nMAM'ın güneş tahmin projesi ulusal ölçekte **NMAE %2** bildirir (`01/03`, bkz. [03-Guncel-Projeler-Yayinlar-Urunler.md](../01-Kurum-Ilan-ve-Surec/03-Guncel-Projeler-Yayinlar-Urunler.md)).\n\nBu sayıyı yorumlarken iki şey sor:\n\n1. Hangi ufuk için?\n2. Hangi toplama düzeyinde?\n\nUlusal toplam hata, tek santral hatasından çok küçüktür. Çünkü santrallerin hataları kısmen bağımsızdır ve toplanınca birbirini götürür. Buna **mekânsal düzgünleşme** denir.\n\n### Elle örnek\n\nDört saat, kurulu güç 200 MW. Önce her saat için hata bulunur (hata = tahmin − gerçek):\n\n| Saat | Gerçek | Tahmin | Hata |\n| --- | --- | --- | --- |\n| 1 | 50 | 60 | +10 |\n| 2 | 120 | 110 | −10 |\n| 3 | 160 | 150 | −10 |\n| 4 | 90 | 110 | +20 |\n\nAşağıdaki blokta her satır bir ölçütü hesaplar. Adımların amacı:\n\n1. **MAE:** hataların işaretini atıp ortalamasını alır; \"ortalama kaç MW yanıldım\" sorusunu cevaplar.\n2. **RMSE:** hataların karesini alıp ortalar, sonra karekök alır; büyük hatayı (20 MW) daha çok cezalandırır.\n3. **NMAE:** MAE'yi kurulu güce böler; farklı büyüklükteki santralleri karşılaştırılabilir yapar.\n4. **MAPE:** her saatin hatasını o saatin gerçek değerine böler, sonra ortalar; küçük üretimli saatlerin etkisini gösterir.\n5. **Yanlılık:** hataları işaretiyle ortalar; model sistematik olarak fazla mı eksik mi tahmin ediyor, onu gösterir.\n\n```\nMAE  = (10 + 10 + 10 + 20) / 4 = 12,5 MW\nRMSE = √((100 + 100 + 100 + 400) / 4) = √175 = 13,2 MW\nNMAE = 12,5 / 200 = %6,25\nMAPE = (10/50 + 10/120 + 10/160 + 20/90) / 4 = %14,2\nYanlılık = (10 − 10 − 10 + 20) / 4 = +2,5 MW\n```\n\nSonucun yorumu:\n\n- Aynı tahmin, ölçüte göre %6 veya %14 hatalı.\n- MAPE büyük çıktı, çünkü küçük üretimli saat (50 MW) orantısız ağırlık aldı.\n- Ölçütü söylemeden \"hata şu kadar\" denmez.\n\n**Kıyas:** kalıcılık modeli. Her saat için tahmin, bir önceki saatin gerçeğidir; ilk saatten önceki değer 40 MW.\n\nAşağıdaki blokta adımların amacı:\n\n1. **Kalıcılık tahminleri:** her saate bir önceki saatin gerçek değerini yazar (40, 50, 120, 160); hatalar bu tahminle gerçek arasındaki farktır.\n2. **MAE_kalıcılık:** bu hataların ortalamasıdır; basit modelin ne kadar yanıldığını gösterir.\n3. **Beceri:** modelimizin MAE'sini kıyas MAE'siyle karşılaştırır; modelin basit yönteme göre ne kadar iyi olduğunu tek sayıda söyler.\n\n```\nKalıcılık tahminleri: 40, 50, 120, 160     hatalar: 10, 70, 40, 70\nMAE_kalıcılık = 47,5 MW\nBeceri = 1 − 12,5 / 47,5 = 0,74\n```\n\nModel, kalıcılığa göre hatayı %74 azaltıyor.\n\n### 6. Hatanın koşullu dökümü\n\nOrtalama hata saklar. Hatayı ayrı ayrı raporla:\n\n- saate göre,\n- mevsime göre,\n- hava tipine göre (açık, parçalı bulutlu, kapalı),\n- rampa olaylarında (üretimin veya yükün kısa sürede hızla değiştiği anlarda),\n- tatillerde,\n- en büyük %1'lik hatalarda.\n\nSistem işletmecisini ilgilendiren ortalama gün değil, en kötü gündür.\n\n### 7. Sahada izleme\n\nModel devreye alındıktan sonra bozulur. Nedenleri:\n\n- yeni santraller kurulur,\n- tüketim alışkanlığı değişir,\n- ölçüm cihazı değişir.\n\nYapılacaklar:\n\n- Hata sürekli izlenir; eşik aşılınca model yeniden eğitilir.\n- Model, verisi ve hata geçmişi sürümlenir.\n\n## Fizik bilgili modeller\n\nSaf veri odaklı model, fiziği veriden yeniden öğrenmek zorundadır. Az veriyle ve görmediği koşulda bunu yapamaz.\n\nFizik bilgisini modele sokmanın altı yolu, basitten karmaşığa:\n\n| Yol | Nasıl | Örnek |\n| --- | --- | --- |\n| 1. Fiziksel öznitelik | Ham veri yerine fiziksel anlamı olan girdi | Güneş için açık gökyüzü endeksi; rüzgâr için güç eğrisi çıktısı |\n| 2. Artık modelleme (melez) | Fizik modeli tahmin eder; öğrenen model onun **hatasını** öğrenir | Hava modeli + güç eğrisi → sapmayı düzelten model |\n| 3. Kayıp işlevinde fizik | Fizik denklemlerini ihlal eden çıktıya ceza | Yük akışı vekil modelinde güç dengesi artığı |\n| 4. Katı kısıt ve izdüşüm | Çıktıyı uygun bölgeye geri düşür | Tahmin edilen üretimi sınırlar içine kırp; OPF tahminini uygun noktaya düzelt |\n| 5. Yapıda fizik | Modelin mimarisi şebekeyi yansıtır | Şebeke topolojisi üzerinde çizge sinir ağı |\n| 6. Öğren, sonra doğrula | Öğrenen model önerir veya eler; fizik çözücü kesin sonucu verir | Arıza taramasında sınıflandırıcı + AC yük akışı |\n\nTablodaki terimler:\n\n- **OPF** (Optimal Power Flow, optimal güç akışı): şebeke kısıtları altında en ucuz üretim dağılımını bulan hesap.\n- **AC yük akışı** (alternatif akım yük akışı): gerilim ve reaktif gücü de içeren tam yük akışı.\n- **Vekil model:** pahalı bir hesabın (burada yük akışının) yaklaşık ve hızlı taklidi.\n- **Kayıp işlevi:** modelin eğitimde küçültmeye çalıştığı hata ölçüsü.\n\n### Hangi yollar en değerli\n\nPratikte en çok değer üretenler 1, 2 ve 6'dır. Üçü de aynı ilkeye dayanır:\n\n> Sade anlatım: **Bildiğini öğrenme; bilmediğini öğren.**\n\n**Artık modellemenin üstünlüğü:** öğrenen model başarısız olsa bile (dağılım dışı girdi) fizik modeli makul bir tahmin vermeye devam eder. Buna zarif bozulma denir.\n\n**Altıncı yol** güvenlik analizinde tipiktir:\n\n- Binlerce arıza vakasını bir sınıflandırıcı hızla tarar.\n- Şüpheli bulduklarını fizik tabanlı çözücü doğrular.\n\nSınıflandırıcı yanılırsa iki tür bedel vardır:\n\n| Hata türü | Ne olur | Tehlikesi |\n| --- | --- | --- |\n| Yanlış alarm | Bir vaka gereksiz yere çözülür | Yalnız hesap zamanı |\n| Yanlış güven | Bir vaka kaçırılır | Tehlikelidir |\n\nİkincisi tehlikeli olduğu için eşik buna göre tutucu seçilir.\n\n## Makine öğrenmesinin sınırları\n\n### 1. Dağılım dışı girdi\n\nÖğrenen model, eğitim verisinin kapsadığı bölgede ara değer bulur. Dışına çıkınca çıktısı keyfidir ve **bunu haber vermez**; aynı güvenle yanlış cevap verir.\n\nGüç sisteminde dağılım dışı durumlar tam da önemli olanlardır:\n\n- **Topoloji değişimi.** Bir hat bakıma alındı; eğitim verisinde bu yapılandırma yok.\n- **Aşırı hava.** Rekor sıcaklık, fırtına; tanım gereği geçmişte az.\n- **Yapısal değişim.** Çatı güneşi beş yılda on katına çıktı; geçmiş yük verisi bugünü temsil etmiyor.\n- **Nadir olaylar.** Sistem çökmesi, kademeli arıza.\n\nÖnlemler:\n\n- Girdinin eğitim dağılımına uzaklığını ölç ve uzaksa uyar.\n- Modelin kararsız kaldığında çekilmesine izin ver.\n- Fizik tabanlı yedek yöntem bulundur.\n- Topolojiyi girdi olarak ver.\n\n### 2. Nadir olay ve sınıf dengesizliği\n\nGüvenli işletme olağandır; arıza ve kararsızlık nadirdir. Bu yüzden veride \"güvenli\" sınıfı çok, \"güvensiz\" sınıfı azdır. Buna sınıf dengesizliği denir.\n\n**Elle örnek.** 1000 arıza vakası; 10'u gerçekten güvensiz.\n\nTerimler:\n\n- **Doğruluk:** bütün vakalardan kaçını doğru bildiğin.\n- **Yakalama (duyarlılık):** gerçekten güvensiz olanlardan kaçını yakaladığın.\n- **Kesinlik:** \"güvensiz\" dediklerinden kaçının gerçekten güvensiz olduğu.\n\n**Model A** hepsine \"güvenli\" diyor. Aşağıdaki hesapta ilk adım doğruluğu bulur (990 güvenli vakayı doğru bildi), ikinci adım yakalamayı bulur (10 güvensiz vakadan hiçbirini yakalamadı):\n\n```\nDoğruluk = 990 / 1000 = %99          Yakalama (duyarlılık) = 0 / 10 = %0\n```\n\n**Model B**, 10 güvensiz vakanın 9'unu yakalıyor ve 50 yanlış alarm veriyor. Aşağıdaki hesabın adımları:\n\n1. **Doğruluk:** doğru bilinen güvenli vakalar (990 − 50 = 940) ile yakalanan güvensiz vakalar (9) toplanır, bütün vakalara bölünür; modelin genel isabetini verir.\n2. **Yakalama:** yakalanan 9 güvensiz vaka, toplam 10 güvensiz vakaya bölünür; kaçırma oranını gösterir.\n3. **Kesinlik:** yakalanan 9 vaka, \"güvensiz\" denen bütün vakalara (9 + 50) bölünür; alarmların ne kadarının gerçek olduğunu gösterir.\n\n```\nDoğruluk = (940 + 9) / 1000 = %94,9\nYakalama = 9 / 10 = %90\nKesinlik = 9 / (9 + 50) = %15\n```\n\nYorum:\n\n- B'nin doğruluğu daha düşük, kesinliği kötü; ama işe yarayan odur.\n- 59 vaka AC ile doğrulanır; 1000 yerine 59, yani 17 kat az hesap.\n- Ama **bir güvensiz vaka kaçtı**. Güvenlik uygulamasında bu kabul edilmez.\n- Eşik, yakalama %100'e yaklaşana kadar gevşetilir ve yanlış alarm artışına razı olunur.\n\nDers:\n\n- Doğruluk yanıltır.\n- Yakalama, kesinlik ve hataların maliyeti ayrı raporlanır.\n- Yanlış güvenin maliyeti, yanlış alarmın maliyetinden kat kat büyüktür.\n\nNadir olay verisi çoğunlukla **benzetimle** üretilir. Bu, modelin ancak benzetim kadar doğru olabileceği anlamına gelir.\n\n### 3. Açıklanabilirlik\n\nOperatör, gerekçesini anlamadığı bir öneriyle santral durdurmaz, yük atmaz. Ve haklıdır: sorumluluk ondadır.\n\n- **Yöntemler:** öznitelik önemi, SHAP (SHapley Additive exPlanations, her girdinin sonuca katkısını ölçen yöntem) değerleri, yerel doğrusal açıklamalar, karar ağacı gibi doğası gereği okunur modeller.\n- Güç sisteminde en inandırıcı açıklama fizikseldir: \"Şu hat açılırsa şu hat %112 yüklenir\" cümlesi, yük akışıyla doğrulanabilir.\n- Bu yüzden öğrenen modelin çıktısı çoğunlukla **nihai karar** değil, **neye bakılacağını gösteren işaret** olarak tasarlanır.\n- Olay sonrası inceleme ve düzenleyici hesap verebilirlik de açıklama ister.\n\n### 4. Güvenlik açısından kritik kararlar\n\nKararın hızı ve kritikliği arttıkça öğrenen modelin rolü küçülür:\n\n| Karar | Öğrenen modelin rolü |\n| --- | --- |\n| Koruma açması (milisaniye) | Yok veya çok sınırlı. Belirlenimli, sınanmış, sertifikalı mantık |\n| Otomatik kontrol (AGC, SIPS) | Çevrim dışı ayar ve tasarımda yardımcı; çevrim içinde doğrulanmış kural |\n| Operatör karar desteği | Öneri, sıralama, erken uyarı. İnsan onaylar |\n| Tahmin | Ana kullanım. Hata, yedekle karşılanır |\n| Planlama, tarama | Hızlandırıcı. Sonuç fizikle doğrulanır |\n\nSIPS (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması), büyük bir arızadan sonra seçilmiş üretim veya yükü otomatik atarak sistemi koruyan şemadır.\n\n**Yapısal nedenler:**\n\n- **Garanti yok.** Sinir ağının bütün girdiler için sınır içinde kalacağı genel olarak kanıtlanamaz.\n- **Hata asimetrisi.** Tahminde %2 hata yedekle karşılanır. Koruma kararında tek hata, ekipman hasarı veya sistem çökmesidir.\n- **Geri besleme.** Model çıktısı sistemi değiştirir; sistem modelin eğitildiği dağılımdan uzaklaşır.\n- **Saldırı yüzeyi.** Girdi verisi bozularak model yanıltılabilir (`16/02`: sahte veri enjeksiyonu; bkz. [02-SCADA-Protokoller-CIM-TSDB-Ikiz-Siber.md](../16-Yazilim-Mimarisi/02-SCADA-Protokoller-CIM-TSDB-Ikiz-Siber.md)).\n\n**Mühendislik deseni:**\n\n1. Öğrenen model önerir, fizik tabanlı denetim onaylar.\n2. Denetimden geçemeyen öneri atılır; yedek yöntem devreye girer.\n3. Önce **gölge kipte** çalıştırılır: öneri üretir, uygulanmaz, sonucu mevcut yöntemle karşılaştırılır.\n4. Kademeli devreye alma ve geri dönüş planı.\n5. Sürekli izleme: girdi dağılımı, hata, yanlış güven oranı.\n\n### 5. Veri gerçekleri\n\nTecrübenden konuşabileceğin yer burasıdır:\n\n| Gerçek | Ayrıntı |\n| --- | --- |\n| Ölçüm verisi kirlidir | Donmuş değerler, boşluklar, birim hataları, saat kaymaları, elle girilmiş değerler |\n| Etiket azdır | \"Güvensiz durum\" etiketi benzetimden gelir |\n| Veri gizlidir | Gerçek şebeke verisi dışarı çıkmaz; kıyaslama zordur |\n| Sistem durağan değildir | Bugünün şebekesi, eğitim verisinin şebekesi değildir |\n\nModel başarımının büyük kısmı algoritmadan değil veri hattından gelir. Veri hattında çalıştıysan köprün burasıdır.\n\n## Yaygın yanlış\n\n| Yanlış cümle | Neden yanlış |\n| --- | --- |\n| **\"Sınama hatam %1; model çok iyi.\"** | Rastgele bölmeyle mi, gerçekleşen hava verisiyle mi, kıyas modeline göre mi? |\n| **\"Derin öğrenme her zaman daha iyidir.\"** | Tablo biçimli tahmin verisinde gradyan artırmalı ağaçlar çoğu zaman eşit veya daha iyidir ve daha az veri ister |\n| **\"MAPE standarttır.\"** | Güneş ve rüzgârda sıfıra yakın değerler yüzünden kullanılmaz; NMAE kullanılır |\n| **\"Model emin değilse düşük olasılık verir.\"** | Dağılım dışında, yanlışken de emin görünebilir |\n| **\"Fizik bilgili sinir ağı fiziği garanti eder.\"** | Kayıp işlevindeki ceza yumuşak kısıttır; ihlali azaltır, sıfırlamaz |\n| **\"Yapay zekâ yük akışının yerini alır.\"** | Vekil model yaklaşık ve hızlıdır; taramada kullanılır, kesin sonuç çözücüden gelir |\n| **\"Daha çok veri her sorunu çözer.\"** | Nadir olayın verisi yoktur; yapısal değişimden önceki veri yanıltır |\n| **\"Açıklanabilirlik sonradan eklenen bir özelliktir.\"** | Operatörün kullanıp kullanmayacağını belirler |\n\n## Panel takip sorusu\n\n### Soru 1\n\n\"Güvenlik analizini makine öğrenmesiyle hızlandırmak istiyoruz. Nasıl tasarlarsın?\"\n\n> Mülakatta şöyle söyle: Sınıflandırıcıyı eleyici olarak kullanırım, karar verici olarak değil. Girdi: işletme noktası ve topoloji. Çıktı: her arıza için risk puanı. Eşiği, güvensiz vakaları kaçırmayacak kadar tutucu seçerim; eşiği aşanlar AC ile doğrulanır. Eğitim verisini benzetimden, mevcut analiz motoruyla üretirim. Topoloji değişince modelin geçerliliğini denetler, geçerli değilse tam taramaya dönerim. Önce gölge kipte, mevcut sonuçlarla yan yana koşarım.\n\n### Soru 2\n\n\"Tahmin modelin geçen hafta iyiydi, bu hafta kötü. Ne yaparsın?\"\n\n> Mülakatta şöyle söyle: Önce veriye bakarım: girdi boru hattında değişiklik, donmuş ölçüm, hava tahmini sağlayıcısında değişiklik. Sonra hatanın nerede yoğunlaştığına: saat, bölge, hava tipi. Sonra yapısal değişime: yeni kapasite, tatil, aşırı hava. Modeli yeniden eğitmek son adımdır, ilk değil.\n\n### Soru 3\n\n\"Güneş tahmininde NMAE %2 ne demek, iyi mi?\"\n\nHesabın amacı: oranı MW'a çevirip somut büyüklüğü görmek. 23.000 MW × %2 ≈ 460 MW.\n\n> Mülakatta şöyle söyle: Ortalama mutlak hatanın kurulu güce oranı. 23.000 MW için yaklaşık 460 MW ortalama hata. İyi olup olmadığı ufka ve kıyas modeline bağlı; ulusal toplamda mekânsal düzgünleşme hatayı düşürür. Yedek açısından ortalamaya değil en büyük hatalara bakmak gerekir.\n\n## 90 saniye\n\n\"Tahminde doğrulamayı zamana göre yaparım: eğitim geçmişte, sınama gelecekte, kayan başlangıçla ve en az bir tam yıl. Sızıntıya dikkat ederim; işletmede elimde gerçekleşen hava değil hava tahmini olur. Hatayı kalıcılık gibi basit bir modele göre ve kurulu güce oranla raporlarım; ortalamanın yanında en kötü günlere bakarım. Fiziği modele katmanın en verimli yolları fiziksel öznitelik, fizik modelinin hatasını öğrenmek ve öğrenen modelin önerisini fizik çözücüyle doğrulamaktır. Makine öğrenmesinin sınırı dağılım dışı durumlardır: topoloji değişimi, aşırı hava, nadir arıza; model burada yanlışken de emin görünür. Bu yüzden güvenlik açısından kritik kararda öğrenen model önerir, fizik tabanlı denetim ve operatör onaylar.\"\n"}, {"id": "19-Davranissal/00-Alt-Basliklar.md", "group": "19  Davranışsal", "title": "19 — Araştırma, analitik düşünme, davranışsal", "body": "# 19 — Araştırma, analitik düşünme, davranışsal\n\nBu klasör, mülakatın teknik olmayan ama eleyici kısmına hazırlar. İlandaki davranış maddeleri (araştırmaya istek, analitik düşünme, koordinasyon, planlama, yeni teknoloji öğrenme, lisansüstü motivasyon) burada ele alınır.\n\nAşağıdaki liste bir içindekiler tablosudur. Her maddenin altında, o konuda ne öğreneceğin tek cümleyle yazılı. Konunun hangi sayfada anlatıldığı parantez içinde verildi.\n\n## Bu klasördeki sayfalar\n\n| Sayfa | Ne anlatır |\n|---|---|\n| [01-STAR-Lisansustu-Ingilizce.md](01-STAR-Lisansustu-Ingilizce.md) | Araştırmacı duruşu, STAR (Situation, Task, Action, Result; Durum, Görev, Eylem, Sonuç) ile proje anlatımı, analitik anlatım kalıbı, bilmediğin soru, İngilizce anlatım, panele sorular, envanter |\n| [02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md](02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md) | \"Neden yazılımdan güç sistemlerine?\" hikâyesi, açık kapatma planı, lisansüstü motivasyonu, liderlik tecrübesinin araştırma diline çevrilmesi, zor sorular |\n\n## Alt başlıklar\n\n1. **İlandaki davranış maddeleri**\n   İlanın teknik olmayan tercih sebeplerinin neler olduğunu ve neden eleyici olduğunu öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n2. **Araştırmacı ile operasyon mühendisi farkı**\n   \"Dosyayı teslim ettim\" bakışı ile ölçülü iddia kuran araştırmacı bakışı arasındaki farkı öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md), [02](02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md))\n3. **Lisansüstü motivasyonu**\n   Lisansüstü sorusuna dürüst, konusu ve planı belli bir cevabı nasıl kuracağını öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md), [02](02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md))\n4. **Yeni teknoloji öğrenme**\n   Son öğrendiğin şeyi araç adıyla değil, öğrenme döngüsüyle nasıl anlatacağını öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n5. **Analitik problem çözme anlatımı**\n   Problemi ölçülebilir yazıp hipotez, ayırıcı test, müdahale ve doğrulama sırasıyla anlatmayı öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n6. **STAR ile proje anlatımı**\n   Her proje için dört cümlelik Durum-Görev-Eylem-Sonuç anlatımını nasıl hazırlayacağını öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n7. **Koordinasyon, organizasyon, planlama**\n   Bu maddeyi kanıtsız sözle değil, tarihli ve somut bir örnekle nasıl göstereceğini öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md), [02](02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md))\n8. **Bilmediğin soru**\n   Bilmediğin bir soruda susmadan ve uydurmadan nasıl puan alacağını öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n9. **İngilizce teknik anlatım**\n   Bir teknik konuyu İngilizce kısa bir iskeletle anlatmayı ve gereken temel kelimeleri öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n10. **Panele sorulacak sorular**\n    Mülakatın sonunda panele hangi üç soruyu sorabileceğini öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md), [02](02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md))\n11. **Anlatılmaması gerekenler**\n    Mülakatta hangi bilgileri ve tavırları dile getirmemen gerektiğini öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md), [02](02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md))\n12. **Online envanter**\n    Kişilik envanterinde neden tutarlılığın arandığını ve teknik online sınavda nasıl süre kazanacağını öğreneceksin. ([01](01-STAR-Lisansustu-Ingilizce.md))\n"}, {"id": "19-Davranissal/01-STAR-Lisansustu-Ingilizce.md", "group": "19  Davranışsal", "title": "Davranışsal ve araştırma", "body": "# Davranışsal ve araştırma\n\nİlanın son tercih sebepleri teknik değildir ve eler. Bu sebepler şunlardır:\n\n- araştırmaya istek,\n- analitik düşünme,\n- problem analizi,\n- çözüm geliştirme,\n- koordinasyon,\n- organizasyon,\n- planlama,\n- yeni teknolojiyi öğrenme,\n- lisansüstü motivasyon.\n\nTeknik soruyu doğru bilip bu maddelerde dağınık görünmek puanı 70’in altına itebilir. Yani teknik bilgi tek başına yetmez; bu sayfa, bu maddelerde nasıl toplu ve kanıtlı görüneceğini anlatır.\n\n> Sade anlatım: Panel yalnızca \"biliyor mu?\" diye bakmaz. \"Bu kişi araştırmacı gibi düşünüyor, planlı çalışıyor, öğrenebiliyor mu?\" diye de bakar. Bu sorulara somut örnekle cevap vermen gerekir.\n\n## Araştırmacı duruşu\n\nDanışmanlık işi “dosyayı teslim ettim” ile biter. Araştırma grubunda ise dosya, tekrar koşulan bir araca ve bir iddiaya dönüşür.\n\nBuradaki iddia ölçülüdür. Ölçülü iddia şu parçaları içerir:\n\n| Parça | Ne demek |\n|---|---|\n| Varsayım | Hesabı hangi kabullerle kurdun |\n| Veri | Hangi veriyle çalıştın |\n| Limit | Yöntemin sınırı ne |\n| Sonuç | Ne buldun |\n| Sonucun bozulduğu yer | Hangi durumda sonuç artık geçerli değil |\n\nLiteratürü taradığını, bir yöntemi neden seçtiğini ve neden elediğini söylemen araştırma refleksidir. Panel bunu duymak ister.\n\n| Zayıf ifade | Güçlü ifade |\n|---|---|\n| “Makale okurum.” | “Şu problemi şu yöntemle kurdum, şu yüzden sezgiseli eledim, şu vakada doğruladım.” |\n\nGüçlü ifadede problem, yöntem, elenen seçenek ve doğrulama vakası vardır. Zayıf ifadede hiçbiri yoktur.\n\n### Lisansüstü sorusu\n\nLisansüstü sorusu bir motivasyon sorusudur. Kapı açıksa, yani gerçekten lisansüstü yapmak istiyorsan, aşağıdaki problemlerden birini seç:\n\n- güvenlik kısıtlı işletme,\n- durum kestirimi,\n- yenilenebilirle azalan atalet,\n- dağıtım barındırma kapasitesi (hosting capacity: şebekenin gerilim ve akım sınırlarını aşmadan kabul edebileceği dağıtık üretim miktarı).\n\nSeçtiğin problem için üç soruya cevap hazırla:\n\n1. Neden o problem ülke sisteminde büyüyor?\n2. MAM’da (TÜBİTAK Marmara Araştırma Merkezi) hangi ürüne değer?\n3. Senin üç yılın ona nasıl bağlanıyor?\n\nYapılmaması gerekenler ve yerine söylenebilecekler:\n\n- “Doktora yapmak istiyorum çünkü CV (özgeçmiş)” deme.\n- Yapmayacaksan yalan söyleme.\n- Bunun yerine şu yeter: “ürün içindeki yöntemi yayınlanabilir hale getirmek istiyorum, lisansüstü bunun disiplini”.\n\nİlanda “yapmış olmak veya motivasyon” birlikte yazar. İkisi de kabuldür, sahtesi değildir.\n\n### Yeni teknoloji\n\nSon öğrendiğin şeyi somut söyle. Örnek iskelet:\n\n> Mülakatta şöyle söyle: “Dağıtım dengesiz yük akışı için OpenDSS’i şu iş için öğrendim, şu dokümandan gittim, küçük fiderde doğruladım, asıl modele taşıdım.”\n\nOpenDSS, dağıtım şebekesi analizi için kullanılan açık kaynaklı bir simülasyon aracıdır. Fider, dağıtım merkezinden tüketicilere giden hat demektir.\n\nÖğrenme yöntemin dört adımdır:\n\n1. birincil kaynak,\n2. küçük örnek,\n3. elde doğrulama,\n4. sonra ölçek.\n\nPanel, araç adını değil bu döngüyü dinler.\n\n## STAR\n\nSTAR, İngilizce Situation (Durum), Task (Görev), Action (Eylem), Result (Sonuç) kelimelerinin baş harfleridir. Bir projeyi bu dört parçayla anlatma yöntemidir.\n\nHer proje için dört cümle hazırla. Dört proje yeter:\n\n- analiz,\n- yazılım,\n- zor veri,\n- birlikte çalışılan.\n\nDört parçanın her birinde ne söyleyeceğin:\n\n- **Durum:** şebeke, yıl, senin rolün. Bir cümle.\n- **Görev:** karar neydi, süre neydi.\n- **Eylem:** senin yaptığın hesap, kod, kontrol. “Ekip yaptı” içinden kendi fiilini ayır.\n- **Sonuç:** sayı, karar değişikliği, hâlâ kullanılıyor mu. Sonuç yoksa ne öğrenildi.\n\nSayı uydurma. Hatırlamıyorsan mertebe söyle ve “raporda net değer var” de. Panelden biri alanı biliyorsa uydurma sayı hemen düşer.\n\n### Analitik anlatımın kalıbı\n\nBir problemi analitik anlatmak için beş adımı sırayla kullan. Her adımın yanında ne işe yaradığı ve örneği var.\n\n1. **Problemi ölçülebilir yaz.** Belirsiz şikâyeti sayıya ve koşula çevirir. “Gerilim bozuk” değil, “fider ucu 1,05 pu üstüne çıkıyor, öğlen, ters akış var.” (pu, per unit: değerin anma değerine oranı; 1,05 pu, anma geriliminin yüzde 5 üstü demektir.)\n2. **Hipotez.** Olası nedeni açıkça söyler. “Aktif güç, R baskın hatta gerilimi yükseltiyor.” (R, hattın direnci; R baskın hat, direncin reaktansa göre büyük olduğu hattır.)\n3. **Ayırıcı test.** Hipotezi diğer açıklamalardan ayırır. “Aynı P, daha kısa fiderde olmuyorsa mesafe hipotezi güçlenir.” (P, aktif güç.)\n4. **Müdahale.** Çözüm seçeneklerini ve bedelini koyar. Kademe, volt-watt, iletken, kısıntı. Yan etki.\n5. **Doğrulama.** Çözümün gerçekten işe yaradığını gösterir. Ölçüm veya ikinci araç.\n\n### Koordinasyon\n\nKoordinasyonu anlatırken üç şeyi gösterebildiğini anlat:\n\n- bir işi parçalara bölebildiğini,\n- bağımlılığı söyleyebildiğini,\n- başkasının verisini tarihli isteyebildiğini.\n\n| Kanıtsız | Kanıt |\n|---|---|\n| “Herkesle iyi anlaşırım.” | “Koruma ayarı için kısa devre sonucunu salı günü kilitledim, çarşamba röle çalışması ona göre yürüdü, veri değişince sürümü yükselttim.” |\n\nİlandaki planlama maddesi tam olarak budur.\n\n## Bilmediğin soru\n\nSessiz kalma ve uydurma. Şu sırayı izle:\n\n> Mülakatta şöyle söyle: “Bu kurumu sahada uygulamadım. İlk ilkem şu olurdu: … Bunu doğrulamak için şu veriye bakarım. Eksik kalan yer … ”\n\nBu kalıbın parçaları:\n\n1. Bilmediğini açıkça söyle.\n2. İlk ilkeden akıl yürüt.\n3. Neyle doğrulayacağını söyle.\n4. Eksik kalan yeri belirt.\n\nBilmediğini bu kalıpla söylemek, analitik maddeye puan yazar. Yarım formülü yarım yazmak puan kırar.\n\n## İngilizce\n\nİlan İngilizce şart koşar. Panel bir soruyu İngilizce sorabilir.\n\nHer teknik klasördeki 90 saniye kutusunun İngilizcesini bir kez kur. Ezber paragraf okuma. Şu iskelet yeter:\n\n> Mülakatta şöyle söyle: “The question is about security analysis. N-1 means the system stays within thermal, voltage and stability limits after a single outage. I screen with a DC method and confirm the critical cases with AC power flow. Preventive actions cost money before the fault. Corrective actions, including a SIPS, act after it.”\n\nİskeletteki kısaltmalar:\n\n| Kısaltma | Açılımı |\n|---|---|\n| N-1 | Tek bir elemanın (hat, trafo, ünite) devreden çıkması durumu |\n| DC | Direct Current; burada DC yük akışı, yani hızlı ve doğrusal yaklaşık yöntem |\n| AC | Alternating Current; burada tam AC yük akışı, yani ayrıntılı doğrulama hesabı |\n| SIPS | System Integrity Protection Scheme, sistem bütünlüğü koruma şeması |\n\nKelime dağarcığı:\n\n| İngilizce | Türkçe karşılığı |\n|---|---|\n| power flow | yük akışı |\n| contingency | olası arıza durumu |\n| state estimation | durum kestirimi |\n| bad data | hatalı ölçüm verisi |\n| inertia | atalet |\n| reserve | yedek |\n| hosting capacity | barındırma kapasitesi |\n| unit commitment | ünite tahsisi |\n| optimal power flow | optimal güç akışı |\n| ride-through | arızada devrede kalma |\n| digital twin | dijital ikiz |\n\nBu listeyi `20` formül kartının arkasına yaz.\n\n## Sorulacak sorular\n\nSoruları sona sakla, üç tane sor, ilan metnini tekrar sorma.\n\n- Önümüzdeki yıl, iletim işletme aracı ile dağıtım veya planlama işinin hangisi daha ağır?\n- Yeni araştırmacı analiz motorunda mı, model ve veri kalitesinde mi, yoksa tahmin ve optimizasyon modülünde mi işe başlıyor?\n- Lisansüstü ile proje teslimi aynı dönemde nasıl dengeleniyor?\n\n## Anlatma\n\nMülakatta şunları anlatma:\n\n- gerçek TEİAŞ (Türkiye Elektrik İletim A.Ş.) bara adı,\n- müşteri yükü,\n- gizli kısıt,\n- önceki işyerinin kodu,\n- kişi dedikodusu,\n- “şu araç kötüdür” yarışı.\n\nYöntemi anlat, veriyi anlatma.\n\n## Envanter\n\nKişilik envanteri doğru veya yanlış aramaz, tutarlılık arar. Aşırı uç işaretleme (her şeye “her zaman”) profili bozar.\n\nİş tanımındaki özellikler:\n\n- analitik,\n- planlı,\n- öğrenmeye açık,\n- koordineli.\n\nSahte bir “liderlik kahramanı” profili, araştırmacı kadrosuyla çelişir. Dürüst ve tutarlı işaretle.\n\nTeknik online sınavda süre, formül kartındaki kısa maddelerden gelir. Birim yaz, seçeneği ele.\n\nAşağıdaki metin kendini tanıtma konuşmasının iskeletidir. Boşlukları (…) mülakattan önceki gün kendi işinle doldur. YTBS (Yük Tevzi Bilgi Sistemi), grubun enerji yönetim platformudur. Bu metni ezberleme, iskeleti ezberle.\n\n## 90 saniye (kendini tanıt)\n\n“Ben … mühendisim. Son üç yılda … şebekesinde … analizini … aracıyla yaptım. Somut sonuç … oldu. Yazılım tarafında bunu … ile tekrarlanabilir hale getirdim. Sizin gruptaki karşılığı, aynı hesabın YTBS gibi bir işletme veya planlama aracında yaşaması. Başlamak istediğim yer … çünkü sahada o problemi gördüm.”\n"}, {"id": "19-Davranissal/02-Yazilimdan-Guc-Sistemlerine-Hikaye-ve-Plan.md", "group": "19  Davranışsal", "title": "Yazılımdan güç sistemlerine", "body": "# Yazılımdan güç sistemlerine\n\nBu sayfa üç konuyu işler: \"Neden yazılımdan güç sistemlerine?\" sorusunun hikâyesi, açık kapatma planı ve liderliğin çevirisi.\n\nBu soru mülakatta gelecek. Cevabın, teknik sorulardaki eksiklerini panelin nasıl yorumlayacağını belirleyecek.\n\n| Cevap | Eksiklerin nasıl çerçevelenir |\n|---|---|\n| İyi cevap | \"öğrenme sürecindeki biri\" |\n| Kötü cevap | \"yanlış yere başvurmuş biri\" |\n\nBu sayfadaki örnek cümleler **kalıptır**. Senin gerçeğin değilse kullanma; köşeli parantezleri kendi hayatınla doldur.\n\n## Dürüst zemin\n\nPanelin özgeçmişinden öğreneceği şeyleri sen söyle. Aşağıdakiler hazır bir hayat hikâyesi değildir; köşeli yeri kendi gerçeğinle doldur:\n\n- Bölümün ilanın şartını karşılamalı: elektrik veya elektrik-elektronik mühendisliği.\n- Yazılım tecrüben: [kaç yıl], [rol].\n- Güç sistemi analizindeki iş tecrüben: [var / sınırlı / yok].\n- Alandan ne kadar uzak kaldığın: [süre].\n\nBunları saklayamazsın; özgeçmişinde ve SGK (Sosyal Güvenlik Kurumu) dökümünde yazıyor. Saklamaya çalışmak, saklanacak bir şey olduğunu düşündürür.\n\nYapılacak şey, bu gerçekleri **sen** söylemek ve üstüne ne koyduğunu göstermektir.\n\n> Sade anlatım: Eksiğini panel bulmadan sen söylersen, bu bir itiraf değil bir olgu bildirimi olur. Sonra da o eksiği kapatmak için ne yaptığını gösterirsin.\n\n## Hikâyenin dört parçası\n\nHikâye toplam 90 saniye sürer. Her parça iki cümledir.\n\n| Parça | Cevapladığı soru |\n|---|---|\n| 1. Köken | Neden yazılıma gittin? |\n| 2. Dönüş noktası | Neden şimdi, neden burası? |\n| 3. Kanıt | Bu ilgi bir söz değil, ne yaptın? |\n| 4. Katkı ve eksik | Ne getiriyorsun, ne öğreneceksin? |\n\n### 1. Köken: neden yazılıma gittin\n\nGerçek nedeni söyle. Yaygın ve kabul edilebilir nedenler:\n\n- \"Mezun olduğumda en çok ilgimi çeken şey yazılımla sistem kurmaktı ve iyi bir fırsat çıktı.\"\n- \"Güç sistemleri derslerini sevmiştim ama o dönem bu alanda yazılım ağırlıklı bir iş bulamadım.\"\n- \"Lisansta hangi alanı istediğimi bilmiyordum; yazılımda iyi olduğumu gördüm ve oradan ilerledim.\"\n\nSöyleme: \"Hep güç sistemlerinde çalışmak istemiştim.\"\n\nNeden söylememelisin: Dört yıl başka bir işte çalışmış biri için inandırıcı değildir ve \"o halde neden çalışmadın?\" sorusunu doğurur.\n\n### 2. Dönüş noktası: neden şimdi, neden burası\n\nSomut bir tetikleyici gerekir. Kendi gerçeğini bul; aşağıdakiler arama yönüdür:\n\n- Bir proje, haber veya olay enerji sistemine ilgini yeniden uyandırdı mı?\n- Yazılımda bir doygunluk mu yaşadın: \"sistemi kuruyorum ama çözdüğüm problem beni artık çekmiyor\"?\n- İlanı gördüğünde iki yanının (mühendislik diploması ve yazılım tecrübesi) aynı işte birleştiğini mi fark ettin?\n- Fiziksel bir karşılığı olan, kamusal etkisi olan bir işte çalışmak mı istiyorsun?\n\nKabul edilebilir bir çerçeve aşağıda. YTBS (Yük Tevzi Bilgi Sistemi), grubun enerji yönetim platformudur.\n\n> Mülakatta şöyle söyle: \"Dört yıl boyunca başka alanların problemlerini yazılımla çözdüm. Kendi mühendislik alanımda, yazılımın belirleyici olduğu bir iş arıyordum. YTBS tam olarak bu: analiz ile üretim yazılımının birleştiği yer.\"\n\nSöyleme:\n\n- \"Devlet güvencesi\"\n- \"Ankara'ya taşınmak istiyorum\"\n- \"yazılım sektöründe işler kötüleşti\"\n\nBunlar doğru olabilir; cevabın merkezi olamaz.\n\n### 3. Kanıt: bu ilgi bir söz değil\n\nBu, hikâyenin en güçlü parçasıdır. İlgini **ne yaparak** gösterdin?\n\n- \"İlandan sonra yük akışını Newton-Raphson ile sıfırdan yazdım; kapalı çözümü olan bir örnekle doğruladım, yedi test yazdım.\"\n- \"Durum kestirimini, ekonomik dağıtımı ve DC optimal güç akışını elle çözüp kodla doğruladım.\"\n- \"MAM'ın devam eden projelerini ve iki yayınını okudum.\"\n- [Varsa: aldığın çevrim içi ders, okuduğun kitap, kurduğun açık kaynak araç.]\n\nTerimler:\n\n- Newton-Raphson, doğrusal olmayan yük akışı denklemlerini adım adım yaklaşarak çözen yöntemdir.\n- DC optimal güç akışı, ağın doğrusal (DC) yaklaşımıyla kurulan en düşük maliyetli üretim dağılımı problemidir.\n- MAM, TÜBİTAK Marmara Araştırma Merkezi'dir.\n\nYalnızca gerçekten yaptığını say. Kodu açıp göstermen istenebilir; `14-Programlama/ornekler` klasörünü yanında bulundur ve her satırını açıklayabilir ol.\n\n### 4. Katkı ve eksik: ne getiriyorsun, ne öğreneceksin\n\n- **Getirdiğin:** üretimde çalışan sistem kurma tecrübesi; test, sürüm, gözden geçirme disiplini; ölçekleme ve veri akışı kararları; yeni bir alanı hızlı öğrenme pratiği.\n- **Eksiğin:** alan derinliği. Bunu sen söyle, onlar söylemeden.\n\n> Mülakatta şöyle söyle: \"Güç sistemi bilgim şu an bir ders kitabı düzeyinde ve taze. Ticari analiz yazılımı kullanmadım. İlk altı ayda kapatmam gereken açık bu ve nasıl kapatacağımı planladım.\"\n\n## Örnek iskelet\n\nAşağıdaki metin dört parçayı birleştirir. Köşeli parantezleri kendi gerçeğinle doldur.\n\n> \"Elektrik-elektronik mühendisliği mezunuyum. Mezuniyetten sonra yazılıma yöneldim, çünkü [gerçek neden]; [kaç] yıldır üretimde çalışan sistemler geliştiriyorum, rolüm [rol]. [Dönüş noktası: gerçek tetikleyici.] Bu ilanda iki yanımın birleştiğini gördüm: grubunuz analiz yöntemlerini binlerce kullanıcılı bir yazılıma dönüştürüyor.\n>\n> Açık söyleyeyim: güç sistemi analizinde iş tecrübem yok ve üniversiteden beri bu konulardan uzaktım. İlandan sonra temelleri yeniden çalıştım ve anladığımı sınamak için yük akışını, durum kestirimini ve ekonomik dağıtımı sıfırdan kodladım, elle çözülmüş örneklerle doğruladım.\n>\n> Getirdiğim şey, analiz kodunu test edilebilir, izlenebilir ve servis edilebilir hale getirme tecrübesi. Öğrenmem gereken alanın derinliği; bunu ilk aylarda nasıl kapatacağıma dair bir planım var.\"\n\n## Açık kapatma planı\n\n\"Eksiklerini nasıl kapatacaksın?\" sorusuna \"çok çalışacağım\" cevabı sıfır puandır. Somut, tarihli ve ölçülebilir bir plan söyle.\n\nPlan üç dönemden oluşur:\n\n| Dönem | Amaç |\n|---|---|\n| İlk 30 gün | Dili öğren |\n| 90 gün | Bir modülde üretken ol |\n| 6–12 ay | Derinleş |\n\n### İlk 30 gün: dili öğren\n\n- Grubun kullandığı analiz paketini kur; bildiğim üç baralı vakayı onda çöz ve kendi kodumla karşılaştır.\n- Elektrik Şebeke Yönetmeliği'nin planlama ve işletme bölümlerini ve Ek-18'i oku; sınır değerleri çıkar.\n- Grubun yayınlarını ve proje belgelerini oku; bilmediğim her terimi bir sözlüğe yaz.\n- Mevcut kod tabanında küçük bir hata düzelt veya test ekle. Amaç katkı değil, yapıyı öğrenmek.\n- Ölçüt: bir modülün ne yaptığını ve hangi girdiyle hangi çıktıyı ürettiğini bir kıdemliye anlatabilmek.\n\n### 90 gün: bir modülde üretken ol\n\n- Bir analiz modülünün sahipliğine ortak ol: testlerini genişlet, bir iyileştirme teslim et.\n- Bir ders kitabını baştan sona bitir (aşağıdaki listeden biri) ve bölüm sonu problemlerini çöz.\n- IEEE 14 ve 118 baralı test sistemlerinde yük akışı, N-1 ve durum kestirimi koş; sonuçları yorumla.\n- Ölçüt: alan sorusunu kıdemliye sormadan önce kendi cevabımı yazabilmek ve çoğunda haklı çıkmak.\n\nIEEE (Institute of Electrical and Electronics Engineers, Elektrik ve Elektronik Mühendisleri Enstitüsü) test sistemleri, yöntemleri karşılaştırmak için herkesin kullandığı standart örnek şebekelerdir. N-1, tek bir elemanın devreden çıktığı durumda sistemin sınırlar içinde kalıp kalmadığını sınayan güvenlik analizidir.\n\n### 6–12 ay: derinleş\n\n- Lisansüstüne başvur (aşağıda).\n- Bir konuda grubun başvurduğu kişi ol. Makul aday: analiz kodunun test ve doğrulama altyapısı; alan uzmanlarının en az sevdiği, benim en iyi bildiğim iş.\n- Ölçüt: bir teknik raporda veya bildiride katkım olması.\n\n### Kaynaklar\n\nStandart ders kitapları. Mülakatta adını verebilirsin; yalnızca gerçekten açtıysan \"okudum\" de.\n\n| Yazar | Kitap | Not |\n|---|---|---|\n| Glover, Overbye, Sarma | *Power System Analysis and Design* | Lisans düzeyi, en okunur olanı. |\n| Grainger, Stevenson | *Power System Analysis* | Klasik. |\n| Wood, Wollenberg, Sheblé | *Power Generation, Operation, and Control* | Ekonomik dağıtım, ünite tahsisi, OPF (Optimal Power Flow, optimal güç akışı), durum kestirimi. |\n| Kundur | *Power System Stability and Control* | Kararlılığın başvuru kitabı. |\n| Abur, Expósito | *Power System State Estimation* | Durum kestirimi. |\n| Kersting | *Distribution System Modeling and Analysis* | Dengesiz dağıtım. |\n\nTürkçe kaynak ve üniversite ders notları için kendi lisans notlarına ve mezun olduğun bölümün güncel ders sayfalarına bak.\n\n## Lisansüstü motivasyonu\n\nİlan maddesi: \"Güç sistemlerinde lisansüstü çalışma yapmış veya yapma motivasyonuna sahip olmak.\" Motivasyon yeterlidir; ama gerçek olmalıdır.\n\n**Önce kendine sor:** gerçekten yapacak mısın?\n\nTam zamanlı iş + yüksek lisans, iki-üç yıl akşam ve hafta sonu demektir. Yapmayacaksan \"yapacağım\" deme.\n\n> Mülakatta şöyle söyle (yapmayacaksan, dürüst alternatif): \"Şu an önceliğim alanı iş içinde öğrenmek. Bir yıl sonra, hangi problemin beni çektiğini gördüğümde yüksek lisansa başlamayı düşünüyorum.\"\n\n**Yapacaksan üç şeyi söyle:**\n\n1. **Neden.** \"Alan bilgimdeki açığı sistemli kapatmanın en sağlam yolu. Kendi başıma okuyarak ilerleyebilirim ama yapı ve geri bildirim isterim.\"\n2. **Hangi konu.** Senin profiline doğal oturan, yazılım ile analizin kesiştiği konular:\n   - Güvenlik analizinin hızlandırılması (paralel hesap, duyarlılık yöntemleri, öğrenen eleyiciler)\n   - Dağıtımda durum kestirimi ve sözde ölçüm üretimi\n   - Yüksek paylı dağıtık üretimde net yük tahmini\n   - Analiz yazılımlarında model doğrulama ve veri kalitesi\n\n   Bir tanesini seç ve nedenini söyle. \"Henüz karar vermedim ama bu ikisi arasındayım\" da kabul edilir.\n3. **Nasıl.** \"Ankara'daki üniversitelerin elektrik-elektronik bölümlerinin güç sistemleri programlarına bakıyorum. Tez konusunu grubun işiyle örtüştürmek isterim; hem işe hem teze yarar.\"\n\nSözde ölçüm, ölçüm olmayan noktalar için geçmiş veri veya tahminle üretilen yaklaşık değerdir. Net yük, tüketimden dağıtık üretimin çıkarılmasıyla kalan yüktür.\n\nHangi üniversitede hangi hocanın ne çalıştığını bilmiyorsan söyleme.\n\nMülakattan önce yapılacaklar:\n\n- İki bölümün sayfasına bak.\n- Başvuru koşullarını öğren: ALES (Akademik Personel ve Lisansüstü Eğitimi Giriş Sınavı), not ortalaması, bilimsel hazırlık.\n- Lisans notun veya aradan geçen süre nedeniyle bilimsel hazırlık okuman gerekebilir; bunu bil.\n\nSoru olarak sorabilirsin: \"Grupta çalışırken lisansüstü yapanlar tez konularını nasıl seçiyor?\"\n\n## Liderlik tecrübesini araştırma ortamına çevirmek\n\nRisk şu: kadro, araştırmacı kadrosudur. Teknik lider olarak anlattığın hikâye \"bu kişi yönetmek istiyor, kıdemsiz olmayı kabul etmez\" diye okunabilir.\n\nİlanın ilgili maddesi \"koordinasyon, organizasyon ve planlama becerisi\"dir; \"yöneticilik\" değil.\n\n### Çeviri tablosu\n\nSoldaki sütun yazılım dünyasında alıştığın ifadedir. Sağdaki sütun, aynı tecrübeyi araştırma ortamında nasıl söyleyeceğindir.\n\n| Yazılım dilinde söylediğin | Araştırma ortamında karşılığı | Böyle söyle |\n| --- | --- | --- |\n| Ekip yönettim | Teknik koordinasyon | \"Beş kişilik bir işin parçalarını ve bağımlılıklarını ben planlıyordum\" |\n| Mimari kararları ben verdim | Yöntem seçimi ve gerekçelendirme | \"İki seçeneği ölçüp birini eledim; gerekçesini yazılı bıraktım\" |\n| Kod incelemesi yaptım | Hakemlik, sonuç doğrulama | \"Başkasının sonucunu, varsayımlarından başlayarak sınamaya alışığım\" |\n| Teslim tarihi tutturdum | Proje teslimi, iş paketi | \"Kapsamı önceliklendirip neyin ertelendiğini yazılı bildirdim\" |\n| Müşteriyle görüştüm | Paydaş ile gereksinim netleştirme | \"Kullanıcının istediği ile ihtiyacı arasındaki farkı ayırmayı öğrendim\" |\n| Kıdemsizleri yetiştirdim | Bilgi aktarımı, belgeleme | \"Bildiğimi yazıya ve örneğe dökmeye alışığım\" |\n| Üretim arızasını çözdüm | Kök neden analizi | \"Belirti, hipotez, ayırıcı test, düzeltme, tekrarını önleme\" |\n| Teknik borcu yönettim | Araştırma kodunu ürüne taşımak | \"Çalışan prototip ile sürdürülebilir kod arasındaki farkı bilirim\" |\n\nSayıları kendi gerçeğinle değiştir.\n\n### Araştırma ortamının farkı: bunu bildiğini göster\n\n| Yazılım ürünü | Araştırma |\n| --- | --- |\n| Gereksinim (çoğunlukla) bellidir | Sorunun kendisi belirsizdir |\n| Başarı: çalışıyor ve kullanılıyor | Başarı: doğru, yeni ve yinelenebilir |\n| Hız değerlidir | Doğruluk ve gerekçe değerlidir |\n| Başarısız deneme israftır | Olumsuz sonuç da bilgidir |\n| Karar veren: ürün sahibi, lider | Karar veren: kanıt; hiyerarşi daha düz, kıdem bilgiye dayanır |\n\n> Mülakatta şöyle söyle: \"Teknik liderlikte en çok işime yarayan şey otorite değil, kararı gerekçesiyle yazmaktı. Araştırma ortamında bunun daha da geçerli olduğunu düşünüyorum.\"\n\n### \"En kıdemsiz olacaksın, sorun olur mu?\"\n\nBu soru gelecek. Cevap:\n\n> \"Hayır, ve bunu bilerek başvurdum. Bu alanda grubun en az bilen kişisi olacağım; ilk yıl işim öğrenmek ve bana verilen parçayı sağlam teslim etmek. Liderlik tecrübemin burada işe yarayacağı yer yönetmek değil: işimi planlamak, bağımlılıklarımı erken söylemek, takıldığımda vaktinde sormak ve yaptığımı belgelemek.\"\n\nSöyleme: \"Zamanla ekip lideri olmayı hedefliyorum.\"\n\nBeş yıllık hedef sorulursa:\n\n> Mülakatta şöyle söyle: \"Bir analiz modülünün hem yöntemini hem yazılımını sahiplenebilecek düzeye gelmek.\"\n\n### \"Maaş ve unvan düşüşünü nasıl karşılarsın?\"\n\nSorulabilir. Koşulları bilmiyorum; sen araştır. Cevabın gerçek olsun.\n\n> Mülakatta şöyle söyle (kabul edilebilir çerçeve): \"Bunu hesaba katarak başvurdum. Bu aşamada önceliğim, kendi mühendislik alanımda derinleşebileceğim bir iş.\"\n\n## Zor sorular ve cevap yönleri\n\nAşağıdaki tablo hazır cevap değil, cevabın yönüdür. Her birini kendi cümlenle kur.\n\n| Soru | Yön |\n| --- | --- |\n| \"Dört yıl sonra neden şimdi?\" | Dönüş noktası; somut tetikleyici |\n| \"Sıkılınca yazılıma geri dönmez misin?\" | Burada da yazılım yapacağım; değişen problem alanı. Lisansüstü planı kalıcılığı gösterir |\n| \"Alanı bilen biri varken neden seni alalım?\" | İkisini birden yapabilen az. Analizi bilenin yazılımı öğrenmesi de zaman alır. Kanıt: yazdığım kod |\n| \"Tecrüben ilan şartını karşılıyor mu?\" | Belgede ne yazıyorsa o (`01/04`). Değerlendirme kurumundur |\n| \"Güç sistemi derslerinde notların nasıldı?\" | Transkript ne diyorsa. Düşükse: \"O dönem zayıftım; şimdi şu örneği tahtada çözebilirim\" ve çöz |\n| \"En son ne zaman bir güç sistemi problemi çözdün?\" | \"Geçen hafta\" ve hangisi |\n| \"Bu işte seni en çok ne zorlar?\" | Dürüst cevap: alan sezgisi. Sayının makul olup olmadığını hissetmek zaman ister |\n| \"Neden özel sektörde bir enerji yazılım şirketi değil?\" | Ulusal ölçekte sistem; araştırma ve lisansüstü imkânı; ürünün kamusal etkisi |\n\n## Yaygın yanlış\n\nHer satırda yanlış düşünce ve neden yanlış olduğu var.\n\n- **\"Eksiğimi söylemezsem fark etmezler.\"** Üçüncü teknik soruda fark ederler; o zaman hem eksik hem saklamış olursun.\n- **\"Her şeyi hızlı öğrenirim.\"** Kanıtsız. \"Şunu şu kadar sürede öğrendim, şöyle doğruladım\" kanıttır.\n- **\"Yazılım tecrübem güç sistemi tecrübesinin yerini tutar.\"** Tutmaz; tamamlar. Farkı sen söyle.\n- **\"Liderlik tecrübemi öne çıkarırsam avantaj olur.\"** Araştırmacı kadrosunda yanlış okunabilir. Koordinasyon ve gerekçeli karar olarak çevir.\n- **\"Lisansüstü istediğimi söylemem yeter.\"** Konu ve plan yoksa boş sözdür.\n- **\"Tutkuyla anlatırsam ikna olurlar.\"** Panel mühendistir; kanıta bakar.\n\n## Prova\n\nHer adımın amacı yanında yazılı.\n\n1. Örnek iskeleti kendi gerçeğinle yaz. Kâğıda, tam cümlelerle. (Kalıbı kendi hikâyene çevirirsin.)\n2. Sesli oku, süre tut. 90 saniyeyi aşıyorsa kısalt. (Süre sınırına uyarsın.)\n3. Telefonla kaydet, dinle. Özür diler gibi mi konuşuyorsun? Savunmaya mı geçiyorsun? İkisi de olmamalı; olgu bildiriyorsun. (Ses tonunu düzeltirsin.)\n4. \"Zor sorular\" tablosundaki her soruya 30 saniyelik cevap kaydet. (Takip sorularına hazır olursun.)\n5. Birine dinlet ve tek soru sor: \"İnandın mı?\" (Dışarıdan inandırıcılığı sınarsın.)\n\n
