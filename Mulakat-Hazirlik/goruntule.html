 Matematiği\n\n1. Lagrange işlevi kurulur: `L = Σ C_i(P_i) + λ (P_yük − Σ P_i)`. Bu, güç dengesi kısıtını λ çarpanıyla amaca ekler.\n2. `∂L/∂P_i = 0` koşulu yazılır. Bu, her ünite için en iyi noktayı arar.\n3. Sonuç `dC_i/dP_i = λ` olur. Yani her ünitenin artımsal maliyeti λ'ya eşittir.\n\n`λ`, güç dengesi kısıtının **gölge fiyatıdır**: yük 1 MW artarsa toplam maliyet `λ` kadar artar. Piyasadaki marjinal fiyatın kökeni budur.\n\n## Lambda iterasyonu\n\nLambda iterasyonu, doğru λ'yı deneme-düzeltme ile bulan yöntemdir.\n\n1. Bir `λ` tahmin et.\n2. Her ünite için `P_i = (λ − b_i) / (2 a_i)` hesapla. Sınırı aşıyorsa sınıra sabitle.\n3. `Σ P_i` yükten küçükse `λ`'yı artır, büyükse azalt.\n4. Fark tolerans içine girene kadar tekrarla.\n\nİkinci adımdaki formül, `2a_i P_i + b_i = λ` denkleminin `P_i` için çözülmüş halidir.\n\nToplam üretim `λ` ile tekdüze (monoton) arttığı için ikiye bölme veya doğrusal ara değerleme her zaman yakınsar.\n\n## Elle örnek 1: kayıpsız\n\nİki ünite var, yük 100 MW.\n\nAşağıdaki blok iki ünitenin maliyet eğrisini (solda) ve artımsal maliyetini (sağda) verir.\n\n```\nC_1 = 0,02 P_1² + 4 P_1          IC_1 = 0,04 P_1 + 4\nC_2 = 0,03 P_2² + 3 P_2          IC_2 = 0,06 P_2 + 3\n```\n\n**Tahmin 1, `λ = 5`.**\n\nBu adım ilk kaba tahminle her ünitenin üretimini bulur ve toplamı yükle karşılaştırır.\n\n```\nP_1 = (5 − 4) / 0,04 = 25,00\nP_2 = (5 − 3) / 0,06 = 33,33\nToplam = 58,33 MW   →   100'den az, λ'yı artır\n```\n\n**Tahmin 2, `λ = 7`.**\n\nBu adım λ'yı artırıp toplamın yükün üstüne çıktığını görür; böylece doğru λ'nın 5 ile 7 arasında olduğu anlaşılır.\n\n```\nP_1 = 75,00       P_2 = 66,67\nToplam = 141,67 MW   →   fazla, λ'yı azalt\n```\n\n**Tahmin 3, doğrusal ara değerleme.**\n\nBu adım iki tahmin arasında düz çizgi çekip yükün 100 MW olduğu λ'yı okur, sonra üretimleri yeniden hesaplar.\n\n```\nλ = 5 + (7 − 5) × (100 − 58,33) / (141,67 − 58,33) = 5 + 2 × 0,5 = 6\nP_1 = (6 − 4) / 0,04 = 50,00\nP_2 = (6 − 3) / 0,06 = 50,00\nToplam = 100,00 MW   ✓\n```\n\n**Sonuç:** `λ = 6 TL/MWh`, `P_1 = P_2 = 50 MW`.\n\nToplam maliyet, iki ünitenin maliyet eğrisine 50 MW konarak bulunur: `0,02 × 2500 + 200 + 0,03 × 2500 + 150 = 475 TL/saat`.\n\n### Kapalı çözümle kontrol\n\nİkinci dereceden maliyette kapalı (doğrudan formülle) çözüm de vardır; kontrol için kullanılır.\n\nAşağıdaki blok λ'yı tek formülle hesaplar: paydaki `Σ b_i / 2a_i` = 100 + 50, paydadaki `Σ 1/2a_i` = 25 + 16,67.\n\n```\nλ = (P_yük + Σ b_i / 2a_i) / Σ (1 / 2a_i) = (100 + 100 + 50) / (25 + 16,67) = 6,00\n```\n\nDikkat: ünite 2'nin sabit terimi daha ucuz (3'e karşı 4; burada kastedilen `b` katsayısı, yani artımsal maliyetin sıfır üretimdeki değeri) ama eğimi daha dik. \"Ucuz olan hepsini üretsin\" yanlıştır; önemli olan ortalama değil **marjinal** maliyettir.\n\n## Elle örnek 2: üretim sınırı\n\nÜnite 1'in üst sınırı 40 MW olsun. Sınırsız çözüm 50 MW istiyordu; yani sınır bağlıyor.\n\nAşağıdaki blok adım adım şunu yapar:\n\n1. Ünite 1'i sınırına sabitler (40 MW).\n2. Kalan yükü ünite 2'ye verir (60 MW).\n3. λ'yı sınırda olmayan ünite 2'nin artımsal maliyetinden okur.\n4. Ünite 1'in artımsal maliyetini hesaplayıp λ ile karşılaştırır.\n\n```\nP_1 = 40 (sabit)\nP_2 = 100 − 40 = 60\nλ = IC_2(60) = 0,06 × 60 + 3 = 6,60\nIC_1(40) = 0,04 × 40 + 4 = 5,60   \u003c   λ\n```\n\nÜst sınırına dayanmış ünitenin artımsal maliyeti `λ`'nın **altında** kalır: daha fazla üretmek isterdi ama üretemiyor. Alt sınırına dayanmış ünitede tersi olur. `λ`'yı sınırda olmayan (marjinal) ünite belirler.\n\nMaliyet: `0,02 × 1600 + 160 + 0,03 × 3600 + 180 = 480 TL/saat`. Sınırın bedeli 5 TL/saat (480 − 475).\n\n## Elle örnek 3: iletim kaybı\n\nÜnite 1 yükten uzakta; ürettiği gücün bir kısmı hatta kayboluyor: `P_kayıp = 0,0005 P_1²`. Ünite 2 yükün yanında, kaybı yok.\n\nGüç dengesi artık `P_1 + P_2 = 100 + P_kayıp` olur. Optimum koşulu da değişir.\n\nAşağıdaki blok kayıplı koşulu ve ceza faktörünün tanımını yazar.\n\n```\nIC_i × L_i = λ          L_i = 1 / (1 − ∂P_kayıp / ∂P_i)          ceza faktörü\n```\n\nCeza faktörü: uzaktaki ünitenin 1 MW'ı yüke 1 MW olarak ulaşmaz; ünitenin etkin maliyeti o oranda artar.\n\nAşağıdaki blok bu örnekteki artımsal kaybı ve iki ünitenin ceza faktörünü hesaplar.\n\n```\n∂P_kayıp / ∂P_1 = 0,001 P_1        L_1 = 1 / (1 − 0,001 P_1)        L_2 = 1\n```\n\nKoşul: `(0,04 P_1 + 4) / (1 − 0,001 P_1) = 0,06 P_2 + 3`, ve `P_2 = 100 − P_1 + 0,0005 P_1²`.\n\nBu, tek bilinmeyenli doğrusal olmayan bir denklemdir.\n\n### Elle iki tur deneme\n\nHer satır bir `P_1` dener. Kaybı, `P_2`'yi, koşulun sol tarafını (ünite 1'in cezalı artımsal maliyeti) ve sağ tarafını (ünite 2'nin artımsal maliyeti) hesaplar. Hangi taraf büyükse `P_1` ona göre düzeltilir.\n\n- Birinci tur (`P_1 = 50`): sol büyük çıkar; ünite 1 fazla pahalı, üretimi azaltılmalı.\n- İkinci tur (`P_1 = 47`): sağ büyük çıkar; bu kez ünite 2 pahalı, `P_1` artırılmalı. Kök 47 ile 50 arasındadır.\n\n```\nP_1 = 50:   kayıp = 1,25   P_2 = 51,25   sol = 6,00 / 0,950 = 6,316   sağ = 6,075   →  sol büyük, P_1'i azalt\nP_1 = 47:   kayıp = 1,10   P_2 = 54,10   sol = 5,88 / 0,953 = 6,170   sağ = 6,246   →  sağ büyük, P_1'i artır\n```\n\n### Sayısal çözüm\n\nAşağıdaki blok `elle_ornekler.py` dosyasının kök bulma ile verdiği sonuçtur.\n\n```\nP_1 = 47,72 MW      P_2 = 53,42 MW      kayıp = 1,14 MW\nL_1 = 1,050         λ = 6,205 TL/MWh\n```\n\nKayıpsız çözüme göre uzaktaki ünite 2,3 MW az, yakındaki 3,4 MW çok üretiyor. `λ` 6,00'dan 6,21'e çıktı: kayıp da üretilmek zorunda.\n\nGerçek sistemde kayıp `B` katsayıları (kaybı üretimlerin karesel fonksiyonu olarak veren katsayılar) ile veya doğrudan optimal güç akışıyla hesaplanır.\n\nCeza faktörü fikri, bölgesel marjinal fiyatın **kayıp bileşeninin** kökenidir (`13` klasörü).\n\n## Ekonomik dağıtım, zincirin neresinde\n\n| Problem | Soru | Ufuk | Matematik |\n| --- | --- | --- | --- |\n| Ünite tahsisi (UC) | Hangi ünite, ne zaman devrede | Gün öncesi | Karışık tam sayılı |\n| Ekonomik dağıtım (ED) | Devredekiler ne kadar üretsin | 5–15 dakika | Dışbükey, tek kısıt |\n| Optimal güç akışı (OPF, Optimal Power Flow) | Şebeke sınırlarıyla birlikte ne kadar | 5–15 dakika | Doğrusal olmayan |\n| Güvenlik kısıtlı OPF | N-1 sonrası da sınırlar korunsun | 5–15 dakika | Çok büyük |\n\nEkonomik dağıtım şebekeyi görmez. Hat dolarsa çözümü uygulanamaz. O zaman OPF gerekir ve tek bir `λ` yerine her bara için ayrı fiyat çıkar.\n\nPiyasa bağlantısı: serbest piyasada santraller maliyet eğrisi yerine **teklif** verir. Piyasa işletmecisi aynı eniyilemeyi teklifler üzerinden yapar. Takas fiyatı, kabul edilen son teklifin fiyatıdır; yani `λ`.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"En ucuz santral tam kapasite çalışır, sonra ikincisi.\"** | Bu, sabit marjinal maliyetli (doğrusal) teklifler için doğrudur: liyakat sırası. Maliyet eğrisi ikinci derecedense ünite yüklendikçe pahalılaşır ve yük paylaşılır. |\n| **\"λ ortalama maliyettir.\"** | Marjinal maliyettir. |\n| **\"Sınıra dayanan ünite de λ'da çalışır.\"** | Üst sınırdaki ünitenin artımsal maliyeti `λ`'nın altındadır. |\n| **\"Sabit maliyet `c` dağıtımı etkiler.\"** | Türevde kaybolur; ekonomik dağıtımı değil ünite tahsisini etkiler. |\n| **\"Kayıp sonradan eklenir.\"** | Kayıp, hangi ünitenin daha değerli olduğunu değiştirir; eniyilemenin içindedir. |\n| **\"Ekonomik dağıtımın sonucu uygulanabilirdir.\"** | Şebeke sınırlarını bilmez. |\n\n## Panel takip sorusu\n\n**\"Maliyet eğrisi dışbükey değilse?\"**\n\n> **Mülakatta şöyle söyle:** Vana noktası etkisi veya yasak çalışma bölgeleri varsa eşit artımsal maliyet koşulu yeterli olmaz, yerel en küçük noktalar oluşur. Parçalı doğrusallaştırıp karışık tam sayılı programla çözerim; küçük boyutta dinamik programlama da olur.\n\n**\"Rampa kısıtı nasıl girer?\"**\n\n> **Mülakatta şöyle söyle:** Ünitenin bir sonraki dönemdeki sınırları, şimdiki çıkışı ± rampa hızı olur. Dönemler birbirine bağlanır; problem dinamik ekonomik dağıtıma döner.\n\n**\"Yenilenebilirin marjinal maliyeti sıfırsa ne olur?\"**\n\n> **Mülakatta şöyle söyle:** Liyakat sırasının başına girer, pahalı üniteleri dışarı iter ve takas fiyatını düşürür. Ama esneklik, yedek ve atalet ihtiyacı ayrı kısıtlar olarak geri gelir.\n\n## 90 saniye\n\n\"Ekonomik dağıtım, devredeki ünitelerin yükü en az maliyetle paylaşmasıdır. En iyi noktada sınırına dayanmamış bütün üniteler aynı artımsal maliyette çalışır; bu ortak değer lambda'dır ve yükün bir megavat artmasının maliyetidir. Lambda iterasyonunda bir değer tahmin eder, her ünitenin üretimini hesaplar, toplam yükten azsa lambda'yı artırırım. Üst sınırına dayanan ünite lambda'nın altında kalır. Kayıp varsa her ünitenin artımsal maliyetini ceza faktörüyle çarparım; yükten uzaktaki ünite daha pahalı görünür. Şebeke sınırı devreye girerse optimal güç akışına geçerim ve tek fiyat yerine bara fiyatları çıkar.\"\n"}, {"id": "11-Ekonomik-Isletme/03-Turkiye-Piyasasi-GOP-GIP-DGP-PTF.md", "group": "11  Ekonomik işletme", "title": "Türkiye elektrik piyasası", "body": "# Türkiye elektrik piyasası\n\nBu sayfa Türkiye elektrik piyasasının ana parçalarını kaynak etiketleriyle anlatır. Sayfada sık geçen kısaltmalar:\n\n| Kısaltma | Açılımı | Kısaca |\n| --- | --- | --- |\n| GÖP | Gün Öncesi Piyasası | Ertesi günün saatlik enerji ticareti |\n| GİP | Gün İçi Piyasası | Teslimata yakın düzeltme ticareti |\n| DGP | Dengeleme Güç Piyasası | Gerçek zamanlı denge, TEİAŞ talimatları |\n| PTF | Piyasa Takas Fiyatı | GÖP'te oluşan saatlik fiyat |\n| SMF | Sistem Marjinal Fiyatı | DGP'de oluşan fiyat |\n| EPİAŞ | Enerji Piyasaları İşletme A.Ş. | Piyasa işletmecisi |\n| EPDK | Enerji Piyasası Düzenleme Kurumu | Düzenleyici |\n| TEİAŞ | Türkiye Elektrik İletim A.Ş. | Sistem ve iletim işletmecisi |\n| DUY | Elektrik Piyasası Dengeleme ve Uzlaştırma Yönetmeliği | Dengeleme ve uzlaştırma kuralları |\n\n## Kaynak etiketleri\n\nSayfadaki bilgiler güvenilirliğine göre üç etiket taşır:\n\n| Etiket | Anlamı | Mülakatta |\n| --- | --- | --- |\n| **Doğrulandı** | EPİAŞ veya EPDK'nın kendi sayfasında Kasım 2026'da okundu. | Rahatça söyle. |\n| **İkincil** | Resmî olmayan kaynak veya genel sektör bilgisi. | \"Bildiğim kadarıyla\" de. |\n| **Doğrula** | Hafızadan yazıldı. | Mülakattan önce resmî kaynaktan kontrol et. |\n\nMülakattan önce bakılacak yerler:\n\n- EPİAŞ Şeffaflık Platformu (güncel PTF ve SMF)\n- EPİAŞ piyasa sayfaları\n- EPDK Kurul Kararları\n- Elektrik Piyasası Dengeleme ve Uzlaştırma Yönetmeliği (DUY)\n\n## Kim ne yapar\n\n| Kurum | Görev |\n| --- | --- |\n| EPDK | Düzenler: lisans, tarife, yönetmelik, fiyat sınırları |\n| EPİAŞ | Piyasa işletmecisi: gün öncesi, gün içi, vadeli piyasalar ve uzlaştırma |\n| TEİAŞ | Sistem işletmecisi: dengeleme güç piyasası, yan hizmetler, iletim |\n| Dağıtım şirketleri | Dağıtım şebekesi işletmesi |\n| Görevli tedarik şirketleri ve tedarikçiler | Perakende satış |\n\nBu ayrım mülakatta işe yarar.\n\n> **Mülakatta şöyle söyle:** EPİAŞ **ticareti**, TEİAŞ **fiziği** yönetir.\n\n## Zaman çizgisi\n\nAşağıdaki blok, elektriğin teslimattan ne kadar önce hangi piyasada işlem gördüğünü sırayla gösterir.\n\n```\nYıllar–aylar önce     İkili anlaşmalar, vadeli piyasalar\nBir gün önce          GÖP   →  saatlik PTF\nGün içinde            GİP   →  sürekli ticaret, teslimata 1 saat kalana kadar\nGerçek zaman          DGP   →  TEİAŞ talimatları, SMF\nSonrası               Uzlaştırma: dengesizlikler fiyatlanır\n```\n\n## Gün Öncesi Piyasası (GÖP)\n\nGÖP, ertesi günün her saati için alış ve satış tekliflerinin toplandığı ve tek fiyatla eşleştirildiği piyasadır.\n\n### Fiyat bölgesi ve PTF\n\n- Türkiye **tek fiyat bölgesidir**: bütün ülke için saatlik tek fiyat oluşur. Şebeke kısıtı eşleştirmede dikkate alınmaz. (İkincil; yapısal olarak yıllardır böyledir.)\n- Çıkan fiyat **PTF**'dir: Piyasa Takas Fiyatı. Arz ve talep eğrilerinin kesiştiği fiyattır.\n- Kabul edilen bütün teklifler aynı fiyattan uzlaştırılır. Buna marjinal fiyatlama denir.\n\n### Fiyat sınırları\n\n- **Doğrulandı:** asgari fiyat 0, azami fiyat **4.500 TL/MWh**. Bu değer 4 Nisan 2026'dan itibaren geçerlidir; dayanağı EPDK'nın 2 Nisan 2026 tarihli ve 14459 sayılı Kurul Kararı'dır.\n- Asgari fiyat sıfır olduğu için Türkiye'de **negatif fiyat oluşmaz**.\n\nÖnceki azami değerler:\n\n| Tarih | Azami fiyat (TL/MWh) |\n| --- | --- |\n| Haziran 2024 | 3.000 |\n| Nisan 2025 | 3.400 |\n| 4 Nisan 2026'dan itibaren | 4.500 |\n\nAzami fiyat sık güncellenir. Mülakatta rakam söylerken tarihini de söyle.\n\n> **Mülakatta şöyle söyle:** \"Nisan 2026 kararıyla 4.500 lira.\"\n\n### Teklif süreci\n\n- **İkincil:** teklifler 12.30'a kadar verilir, sonuçlar 14.00 civarında kesinleşir. Saatleri doğrula.\n- Teklif türleri: saatlik, blok ve esnek teklifler. (İkincil.)\n\n### Elle örnek 1: liyakat sırası ve PTF\n\nLiyakat sırası (merit order), satış tekliflerinin ucuzdan pahalıya dizilmesidir. Talebi karşılayan son (en pahalı kabul edilen) teklif fiyatı belirler.\n\n**Adım 1: teklifleri sırala ve birikimli miktarı yaz.** Bu adım, her fiyat düzeyine kadar toplam ne kadar arz olduğunu gösterir.\n\nBir saat için satış teklifleri (fiyata göre sıralı):\n\n| Kaynak | Miktar | Fiyat (TL/MWh) | Birikimli |\n| --- | --- | --- | --- |\n| Akarsu, rüzgâr | 1000 MW | 0 | 1000 |\n| Linyit | 800 MW | 1500 | 1800 |\n| Doğal gaz | 600 MW | 2500 | 2400 |\n| Eski doğal gaz | 400 MW | 4000 | 2800 |\n\nTalep 2100 MW ve fiyattan bağımsız.\n\n**Adım 2: talebin birikimli eğride nereye düştüğünü bul.** Bu adım, marjinal teklifi ve dolayısıyla PTF'yi belirler.\n\n```\n2100 MW, birikimli 1800 ile 2400 arasına düşer   →   marjinal teklif: doğal gaz\nPTF = 2500 TL/MWh\n```\n\nRüzgâr ve linyit de 2500'den uzlaştırılır. Eski doğal gaz santrali çalışmaz.\n\n**Adım 3: sıfır fiyatlı yeni arz ekle ve sırayı yeniden kur.** Bu adım, yenilenebilirin fiyatı nasıl değiştirdiğini gösterir.\n\nŞimdi aynı saate 400 MW güneş, sıfır fiyatla giriyor. Birikimli miktarlar 400 MW kayar: 1400, 2200, 2800, 3200.\n\n**Adım 4: talebin yeni yerini bul.** Bu adım, yeni marjinal teklifi ve yeni PTF'yi verir.\n\n```\n2100 MW, 1400 ile 2200 arasına düşer   →   marjinal teklif: linyit\nPTF = 1500 TL/MWh\n```\n\n400 MW güneş, fiyatı 1000 TL/MWh düşürdü. Buna **liyakat sırası etkisi** denir.\n\nCem Şahin'in 2021 makalesi (`01/03`) yenilenebilirin Türkiye elektrik piyasalarındaki gelişimini ele alır. Özetini okurken bu etkiye nasıl değindiğine bak.\n\n## Gün İçi Piyasası (GİP)\n\nGÖP kapandıktan sonra tahminler değişir: rüzgâr farklı eser, bir santral arızalanır. Katılımcılar pozisyonlarını GİP'te düzeltir.\n\n- **Doğrulandı:** GİP **sürekli ticaret** yöntemiyle çalışır. Teklifler eşleştikçe işlem gerçekleşir; tek fiyat yoktur.\n- **Doğrulandı:** ertesi günün kontratları bir önceki gün 18.00'de açılır.\n- **Doğrulandı:** **kapı kapanışı teslimattan 1 saat öncedir.** (Kapı kapanışı, o saat için artık işlem yapılamayan andır.)\n- **Doğrulandı:** kontratlar saatliktir.\n- Fiyat sınırlarının GÖP sınırlarıyla ilişkisi için güncel kurala bak. (Doğrula.)\n\nGİP'in şebeke açısından anlamı: yenilenebilir tahmin hatasının büyük kısmı burada, piyasa katılımcıları arasında kapanır. Kapanmayan kısım gerçek zamanda TEİAŞ'a kalır.\n\n## Dengeleme Güç Piyasası (DGP)\n\nGerçek zamanda üretim ile tüketim eşit olmak zorundadır. Aradaki farkı TEİAŞ Milli Yük Tevzi Merkezi (MYTM) kapatır.\n\n- Santraller, 15 dakika içinde yerine getirebilecekleri yük alma ve yük atma tekliflerini verir.\n- Talimatlar fiyat sırasına göre verilir; oluşan fiyat **SMF**'dir: Sistem Marjinal Fiyatı.\n- **Doğrulandı:** DGP'de de asgari 0, azami 4.500 TL/MWh sınırı geçerlidir (aynı Kurul Kararı).\n\n| Talimat | Anlamı | Ne zaman |\n| --- | --- | --- |\n| **YAL (yük alma)** | Üretimi artırma talimatı | Sistemde enerji açığı varsa |\n| **YAT (yük atma)** | Üretimi azaltma talimatı | Sistemde enerji fazlası varsa |\n\n### Yön kuralı\n\nYön kuralı ikincil bilgidir ama mantığı sağlamdır. Aşağıdaki blok, sistemin açık veya fazla vermesine göre hangi talimatın verildiğini ve SMF'nin PTF'ye göre nereye düştüğünü gösterir.\n\n```\nSistem açık verdi   →  YAL talimatları  →  SMF ≥ PTF\nSistem fazla verdi  →  YAT talimatları  →  SMF ≤ PTF\n```\n\n### Talimat etiketleri\n\n**İkincil; doğrula.** Talimatlar veriliş nedenine göre etiketlenir:\n\n| Etiket | Veriliş nedeni |\n| --- | --- |\n| 0 | Enerji dengesi |\n| 1 | **İletim kısıtı** |\n| 2 | Yan hizmet (yedek oluşturma) |\n\nSMF'yi yalnızca 0 etiketli talimatlar belirler.\n\n### Bu ayrım neden önemli\n\nBu ayrım, ilan açısından en önemli noktadır.\n\n1. GÖP şebekeyi görmediği için, piyasanın ürettiği program fiziksel olarak taşınamayabilir.\n2. TEİAŞ kısıtı 1 etiketli talimatlarla çözer: kısıtın bir tarafında üretimi düşürür, diğer tarafında artırır.\n3. Bunun maliyeti vardır. Hangi talimatın verileceğini bulmak bir **güvenlik kısıtlı yeniden dağıtım** problemidir.\n4. YTBS'nin (Yük Tevzi Bilgi Sistemi) analiz modülleri bu kararın arkasındaki hesaptır.\n\n## Dengesizlik uzlaştırması\n\nHer katılımcının programı ile gerçekleşeni arasındaki fark dengesizliktir ve cezalı fiyatlanır.\n\n**Doğrula** (hafızadan; DUY'un güncel metnine bak). Aşağıdaki blok iki yöndeki dengesizliğin hangi fiyattan ödendiğini gösterir.\n\n```\nPozitif dengesizlik (fazla üretim / eksik tüketim):  min(PTF, SMF) × 0,97 üzerinden ödeme ALIR\nNegatif dengesizlik (eksik üretim / fazla tüketim):  max(PTF, SMF) × 1,03 üzerinden ödeme YAPAR\n```\n\nKatsayılar değişmiş olabilir. Mantık değişmez: dengesizlik her iki yönde de piyasada işlem yapmaktan **kötü** fiyatlanır. Böylece katılımcı iyi tahmin yapmaya ve GİP'te pozisyon kapatmaya özenir.\n\n> **Sade anlatım:** Fazla üretirsen fazlanı ucuz olan fiyatın biraz altından satarsın. Eksik üretirsen eksiğini pahalı olan fiyatın biraz üstünden alırsın. İki durumda da tahmini tutturmak daha kârlıdır.\n\n### Elle örnek 2: tahmin hatasının maliyeti\n\nBir rüzgâr santrali GÖP'te bir saat için 100 MWh sattı; 80 MWh üretti. PTF 2500, SMF 3200 TL/MWh (sistem açık). Yukarıdaki katsayılar kullanılır.\n\nAşağıdaki blokta her satır bir adımdır:\n\n1. **GÖP geliri:** satılan miktar PTF ile çarpılır; santralin piyasadan aldığı paradır.\n2. **Negatif dengesizlik:** eksik kalan 20 MWh, PTF ile SMF'nin büyüğü (3200) ve 1,03 ile çarpılır; santralin ödediği cezadır.\n3. **Net:** gelirden ceza düşülür.\n\n```\nGÖP geliri           = 100 × 2500 = 250.000 TL\nNegatif dengesizlik  = 20 MWh × max(2500, 3200) × 1,03 = 20 × 3296 = 65.920 TL (öder)\nNet                  = 184.080 TL\n```\n\n**Karşılaştırma adımı:** doğru tahminle 80 MWh satsaydı 200.000 TL kazanırdı. Bu adım, hatanın gerçek bedelini ortaya çıkarır.\n\n- Tahmin hatasının bedeli 15.920 TL.\n- Yani eksik kalan megavat-saat başına 796 TL.\n\nGüneş ve rüzgâr tahmin projelerinin (RİTM, TEİAŞ güneş tahmini) ekonomik gerekçesi bu sayıdadır. RİTM, rüzgâr üretimi izleme ve tahmin sistemidir. Sistem tarafındaki gerekçe ise yedek ihtiyacıdır.\n\n## Diğer mekanizmalar\n\nHer biri bir cümleyle; hepsi ikincil.\n\n| Mekanizma | Açıklama |\n| --- | --- |\n| **İkili anlaşmalar** | Taraflar arasında serbestçe yapılır, EPİAŞ'a bildirilir. Hacmin önemli kısmı buradadır. |\n| **Vadeli Elektrik Piyasası (VEP)** | EPİAŞ'ın işlettiği, fiziksel teslimatlı vadeli piyasa. |\n| **YEKDEM** (Yenilenebilir Enerji Kaynakları Destekleme Mekanizması) | Sabit fiyat garantisi. Eski santraller dolar bazlı, yenileri TL bazlı ve güncellemeli. |\n| **YEKA** (Yenilenebilir Enerji Kaynak Alanı) | Yenilenebilir enerji kaynak alanı yarışmaları. |\n| **Yan hizmetler** | Primer ve sekonder frekans kontrol kapasitesi TEİAŞ tarafından ihaleyle tedarik edilir. |\n| **Kapasite mekanizması** | Arz güvenliği için bazı santrallere kapasite ödemesi. |\n| **Lisanssız üretim** | Mayıs 2026'dan itibaren saatlik mahsuplaşma (`17/02`). |\n\n## Piyasa ile şebekenin buluştuğu yerler\n\n1. **Kısıt yönetimi:** tek bölgeli piyasa + fiziksel kısıt = yeniden dağıtım (1 etiketli talimat).\n2. **Yedek boyutlandırma:** tahmin hatası ve en büyük ünite kaybı kadar yedek.\n3. **Atalet ve gerilim:** piyasa bunları fiyatlamaz. Sistem işletmecisi bazı senkron santralleri piyasa dışı gerekçeyle devrede tutar.\n4. **Enterkonneksiyon kapasitesi:** sınır kapasitesi ihaleyle tahsis edilir (`03/03`: NTC ve ATC, yani net transfer kapasitesi ve kullanılabilir transfer kapasitesi).\n\n\"Grubun çalışma alanlarından biri piyasa ile şebekeyi birlikte ele alan enerji ekonomisi\" (`01/02`). Yukarıdaki dört madde bunun somut halidir.\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"PTF ile SMF aynı şeydir.\"** | PTF gün öncesi piyasasının, SMF gerçek zamanlı dengelemenin fiyatıdır. |\n| **\"EPİAŞ dengelemeyi yapar.\"** | Dengeleme güç piyasasını TEİAŞ işletir; EPİAŞ uzlaştırır. |\n| **\"GÖP şebeke kısıtını dikkate alır.\"** | Tek bölgedir; kısıt sonradan çözülür. |\n| **\"Türkiye'de de negatif fiyat oluşuyor.\"** | Asgari fiyat sıfırdır. |\n| **\"GİP de GÖP gibi tek fiyatlıdır.\"** | Sürekli ticarettir; her eşleşmenin kendi fiyatı vardır. |\n| **\"Azami fiyat sabittir.\"** | Haziran 2024'ten bu yana üç ayrı değer aldı (3.000, 3.400, 4.500). Tarihiyle söyle. |\n| **\"Yenilenebilir fiyatı düşürür, o halde sistem maliyeti de düşer.\"** | Enerji fiyatı düşer; dengeleme, yedek ve şebeke maliyeti artabilir. |\n\n## Panel takip sorusu\n\n**\"Türkiye bölgesel veya noktasal fiyata geçse ne değişir?\"**\n\n> **Mülakatta şöyle söyle:** Kısıt, gün öncesi fiyatına yansır; kısıtlı bölgede fiyat yükselir, yeniden dağıtım ihtiyacı azalır, yatırım sinyali yerelleşir. Bedeli: piyasa derinliği azalır, bölgesel piyasa gücü riski doğar, hesaplama ve mevzuat ağırlaşır. Bugünkü yapı tek bölgedir.\n\n**\"1 etiketli talimat hacmini nasıl azaltırsın?\"**\n\n> **Mülakatta şöyle söyle:** Kısa vadede daha iyi kısıt tahmini ve topoloji önlemleri; orta vadede dinamik hat kapasitesi ve depolama; uzun vadede iletim yatırımı. Hangisinin değeceğini fayda-maliyet analizi söyler.\n\n## 90 saniye\n\n\"Türkiye'de enerji önce gün öncesi piyasasında, saatlik ve ülke çapında tek fiyatla satılır; bu fiyat piyasa takas fiyatıdır. Tahmin değiştikçe katılımcılar gün içi piyasasında sürekli ticaretle, teslimata bir saat kalana kadar pozisyon düzeltir. Gerçek zamanda kalan farkı TEİAŞ dengeleme güç piyasasında yük alma ve yük atma talimatlarıyla kapatır; buradan sistem marjinal fiyatı çıkar. Dengesizlik iki yönde de cezalı fiyatlanır. Gün öncesi piyasası şebekeyi görmediği için iletim kısıtı ayrı etiketli talimatlarla çözülür; analiz yazılımının piyasayla buluştuğu yer burasıdır. Fiyat üst sınırı Nisan 2026 kararıyla megavat-saat başına dört bin beş yüz liradır.\"\n"}, {"id": "12-Planlama/00-Alt-Basliklar.md", "group": "12  Planlama", "title": "12 — Planlama", "body": "# 12 — Planlama\n\nBu bölüm, elektrik şebekesinin ve üretimin yıllar sonrası için nasıl planlandığını anlatır. İşletme bugünü yönetir; planlama ise \"on yıl sonra yeterli olsun diye bugün neye karar vermeliyim?\" sorusunu sorar.\n\nAşağıdaki liste bölümün konu haritasıdır. Her maddenin altında, o konuda ne öğreneceğin tek cümleyle yazıyor. Konular iki sayfada işleniyor:\n\n- [01-Master-Plan-Guvenilirlik-Fizibilite.md](01-Master-Plan-Guvenilirlik-Fizibilite.md): talep, üretim ve iletim birlikte, güvenilirlik, fayda/maliyet, bağlantı çalışması, esneklik, yazılım.\n- [02-Genisleme-LOLE-EENS-TEIAS-Projeksiyon.md](02-Genisleme-LOLE-EENS-TEIAS-Projeksiyon.md): genişleme planlamasının optimizasyon hali, LOLE (Loss of Load Expectation, Beklenen Yük Kaybı Süresi) ve EENS'in (Expected Energy Not Served, Beklenen Verilemeyen Enerji) elle hesabı, iletim yatırımının fayda/maliyet örneği, TEİAŞ (Türkiye Elektrik İletim Anonim Şirketi) projeksiyonları.\n\n## Konu listesi\n\n1. **İşletme ile planlamanın zaman ufku**\n   İşletmenin saatler ve günlerle, planlamanın yıllarla çalıştığını ve bu farkın neden karar biçimini değiştirdiğini öğreneceksin.\n\n2. **Talep tahmini: kısa, orta, uzun; tepe ve enerji**\n   Tüketimin farklı zaman ölçeklerinde nasıl tahmin edildiğini, en yüksek anlık tüketim (tepe, puant) ile yıllık toplam enerjinin neden ayrı tahmin edildiğini öğreneceksin.\n\n3. **Üretim gelişim planı**\n   Ne kadar, ne tür ve ne zaman santral gerektiğine nasıl karar verildiğini öğreneceksin.\n\n4. **İletim genişleme planı ve master plan**\n   Yeni hat ve trafo adaylarının senaryolarla nasıl elendiğini ve sıralandığını öğreneceksin.\n\n5. **Dağıtım genişleme planı**\n   Fider, trafo ve yeni trafo merkezi gibi daha yerel kararların nasıl planlandığını öğreneceksin.\n\n6. **N-1 ve puant + %5**\n   Şebekenin tek bir eleman kaybında da çalışması kuralını (N-1) ve planlamanın en yüksek tüketimin yüzde 5 fazlasıyla yapılması kuralını öğreneceksin.\n\n7. **Güvenilirlik: LOLE, LOLP, EENS, ELCC**\n   Üretimin talebi olasılık olarak ne kadar karşıladığını ölçen dört göstergeyi öğreneceksin: LOLE (Loss of Load Expectation, Beklenen Yük Kaybı Süresi), LOLP (Loss of Load Probability, Yük Kaybı Olasılığı), EENS (Expected Energy Not Served, Beklenen Verilemeyen Enerji) ve ELCC (Effective Load Carrying Capability, Etkin Yük Taşıma Kapasitesi).\n\n8. **Dağıtım kalitesi: SAIDI, SAIFI, CAIDI**\n   Müşterinin gözünden kesintiyi ölçen üç göstergeyi öğreneceksin: SAIDI (System Average Interruption Duration Index, Sistem Ortalama Kesinti Süresi Endeksi), SAIFI (System Average Interruption Frequency Index, Sistem Ortalama Kesinti Sıklığı Endeksi) ve CAIDI (Customer Average Interruption Duration Index, Müşteri Ortalama Kesinti Süresi Endeksi).\n\n9. **Fayda/maliyet ve risk/etki**\n   Bir yatırımın maliyet ve fayda kalemlerini, iskonto oranının etkisini ve düşük olasılıklı büyük risklerin neden ayrıca tartıldığını öğreneceksin.\n\n10. **Yenilenebilir entegrasyon çalışması**\n    Güneş ve rüzgâr arttıkça net yükün, puant saatinin ve kapasite değerinin nasıl değiştiğini öğreneceksin.\n\n11. **Bağlantı ve enterkonneksiyon çalışması**\n    Yeni bir santral veya büyük yük bağlanırken yapılan tipik analiz paketini ve ülkeler arası bağlantıda bu pakete neler eklendiğini öğreneceksin.\n\n12. **Esneklik: depolama, talep, kısıntı, rezerv**\n    Yenilenebilir arttıkça \"yeterince hat\"ın neden yetmediğini ve esnekliğin MW ve süre olarak nasıl istendiğini öğreneceksin.\n\n13. **Senaryo ve belirsizlik**\n    Planlamanın neden tek tahminle değil düşük, orta ve yüksek senaryolarla yapıldığını öğreneceksin.\n\n14. **Çözüm adaylarının sıralanması**\n    İhlali çözmeyen adayın nasıl elendiğini, kalanların fayda/maliyet ve risk ile nasıl sıralandığını öğreneceksin.\n\n15. **Planın yazılıma dökülmesi: tekrarlanabilir çalışma**\n    Planlama çalışmasının kişiye bağlı bir dosya olarak kalmaması için versiyonlu model, senaryo tablosu ve betikle nasıl tekrarlanabilir hale getirildiğini öğreneceksin.\n"}, {"id": "12-Planlama/01-Master-Plan-Guvenilirlik-Fizibilite.md", "group": "12  Planlama", "title": "Planlama", "body": "# Planlama\n\nBu sayfa, elektrik sisteminin yıllar sonrası için nasıl planlandığını anlatır. Talep tahmininden başlar, üretim ve iletimin birlikte düşünülmesine, güvenilirlik göstergelerine, fayda/maliyet hesabına, bağlantı çalışmasına, esnekliğe ve en sonda planın yazılıma dökülmesine gider.\n\nÖnce temel farkı koyalım:\n\n- **İşletme**, bugünü limit içinde tutar.\n- **Planlama**, yıllar sonra da tutacak şebekeyi ve üretimi seçer.\n\nİkisi aynı **yük akışı** motorunu kullanır. Yük akışı, belli bir üretim ve tüketim durumunda hangi hattan ne kadar güç aktığını ve baralardaki gerilimleri hesaplayan temel analizdir. Planlamada değişen şey motor değil, belirsizlik ve yatırım kararıdır.\n\nBu konu doğrudan başvurduğun grubun işidir. Grubun ilk iş paketi \"fayda/maliyet ve risk/etki eksenli yatırım planlaması\" ve \"master plan, enterkonneksiyon\"dur. **Master plan**, bir şebekenin uzun dönemli yatırım yol haritasıdır. **Enterkonneksiyon**, ülkeler arası şebeke bağlantısıdır.\n\n## Sayfa haritası\n\n1. **Talep:** planlama tahmininin neyi içerdiği, neden senaryo gerektiği, net yük.\n2. **Üretim ve iletim birlikte:** iki planın neden ayrı optimize edilmemesi gerektiği, iletim ve dağıtım adayları.\n3. **Güvenilirlik:** LOLE, LOLP, EENS, ELCC; iletimde N-1 ve risk/etki; dağıtımda SAIDI, SAIFI, CAIDI.\n4. **Fayda ve maliyet:** kalemler, iskonto oranı, duyarlılık.\n5. **Bağlantı çalışması:** yeni santral veya büyük yük için sekiz adımlık paket.\n6. **Esneklik:** yenilenebilir arttıkça neden hat yetmez.\n7. **Yazılım:** planlama çalışmasını tekrarlanabilir yapmak.\n8. **90 saniye:** mülakatta söyleyeceğin kısa metin.\n9. **Kendini yokla:** sorular ve cevaplar.\n\n## 1. Talep\n\n### Kısa dönem ile planlama tahmini\n\n**Kısa dönem tahmin** saatten haftaya kadar olan işletme tahminidir. O konu `18` klasöründe anlatılıyor.\n\n**Planlama tahmini** ise yıllıktır. Şunları içerir:\n\n| Tahmin edilen büyüklük | Birim veya not |\n|---|---|\n| Enerji | TWh (terawatt-saat), yıl boyunca tüketilen toplam |\n| Puant | MW (megavat), yılın en yüksek anlık tüketimi |\n| Puantın saati | Puantın günün hangi saatinde olduğu |\n| Bölge dağılımı | Tüketimin ülkenin neresinde olduğu |\n| Net yük | Çatı güneşi düşülmüş yük |\n\n### Hata nerede?\n\nPlanlamada hata, nokta tahminde değil senaryodadır. **Nokta tahmin**, tek bir sayı vermek demektir (\"2035'te puant şu kadar MW\").\n\nTek bir \"resmi talep\" ile hat inşa etmek tehlikelidir. Talep sapınca **atıl varlık** üretir: yapılmış ama kullanılmayan hat veya trafo.\n\nBu yüzden en az şu senaryolar gerekir:\n\n- düşük talep,\n- orta talep,\n- yüksek talep,\n- elektrifikasyon senaryosu (elektrikli araç, ısı pompası).\n\n**Elektrifikasyon**, daha önce petrol veya gazla yapılan işlerin elektriğe geçmesidir.\n\n### Net yük ve puantın kayması\n\n```\nNet yük = talep − rüzgâr − güneş\n```\n\nBu formül, şebekenin diğer santrallerle karşılaması gereken kısmı verir.\n\nGüneş arttıkça puant artık akşama, güneş batımına kayabilir. \"Yıllık puant yaz öğleni\" alışkanlığı, güneş payı yüksek bölgede bozulur. Çünkü öğlen saatlerinde güneş tüketimin bir kısmını zaten karşılıyor.\n\nPlanlama modeli net yükün **rampasını** da taşımalıdır. Rampa, net yükün kısa sürede ne kadar hızlı yükseldiği veya düştüğüdür (örneğin güneş batarken). Sadece yıllık maksimum yetmez.\n\n> **Sade anlatım:** Öğlen güneş bol olduğu için diğer santrallere az iş düşer. Akşam güneş bir anda çekilince diğer santrallerin çok kısa sürede devreye girmesi gerekir. Planlama bu hızlı yükselişi de görmelidir.\n\n## 2. Üretim ve iletim birlikte\n\n### Neden birlikte?\n\n- **Üretim planı** enerji yetmezliğini çözer.\n- **İletim planı** o enerjinin yerine ulaşmasını çözer.\n\nİkisi ayrı optimize edilirse ucuz santral kısıtlı koridora yığılır. **Koridor**, iki bölge arasındaki hat grubudur; **kısıtlı** koridor, kapasitesi dolmak üzere olan koridordur.\n\nBirlikte düşünmenin pratik hali bir döngüdür:\n\n1. Üretim senaryosunu sabitle.\n2. İletimi N-1'e göre tasarla. **N-1**, şebekedeki herhangi bir elemanın (hat, trafo, jeneratör) tek başına devre dışı kalmasında da limitlerin sağlanmasıdır.\n3. Olmazsa üretimin yerini veya kısıntı maliyetini değiştir. **Kısıntı**, üretilebilecek enerjinin şebeke taşıyamadığı için kesilmesidir.\n4. Tekrarla.\n\n### İletim adayları\n\nBir iletim sorununu çözebilecek yatırım türleri:\n\n- yeni hat,\n- yeni trafo,\n- kesit veya iletken değişimi (hattın telini daha kalın veya daha iyi iletkenle değiştirmek),\n- reaktör/kapasitör (gerilimi düşüren veya yükselten reaktif güç ekipmanı),\n- FACTS (Flexible AC Transmission Systems, Esnek Alternatif Akım İletim Sistemleri; güç elektroniğiyle akışı ve gerilimi kontrol eden cihazlar),\n- gerilim katı yükseltme (154'ten 400'e, yani 154 kV'lik bölgeyi 400 kV'ye taşımak),\n- bölge bara düzeni (trafo merkezindeki baraların bağlanış şeklini değiştirmek).\n\n### Adaylar nasıl elenir ve sıralanır?\n\nHer aday için master plan senaryo seti (`03` dosyası) koşulur.\n\n- **Elenecek aday:** hiçbir senaryoda ihlali çözmeyendir.\n- **Kalan adaylar:** fayda/maliyet ve risk ile sıralanır.\n\n### Dağıtım adayları\n\nDağıtım adayı daha yereldir:\n\n- fider (dağıtım trafo merkezinden çıkan tek bir besleme hattı),\n- trafo,\n- yeni TM (trafo merkezi),\n- gerilim seviyesi.\n\n**Barındırma kapasitesi** haritası, bir dağıtım noktasına limit ihlali olmadan ne kadar üretim bağlanabileceğini gösterir. Bu harita, nereye üretim bağlanacağını planlamanın önüne koyar.\n\n## 3. Güvenilirlik\n\n### Yeterlilik ve dört gösterge\n\n**Yeterlilik** (adequacy) şu soruyu sorar: üretim, talebi olasılık olarak karşılıyor mu?\n\n| Gösterge | Açılımı | Ne ölçer |\n|---|---|---|\n| **LOLE** | Loss of Load Expectation, Beklenen Yük Kaybı Süresi | Beklenen yük kaybı saati; yıl başına saat |\n| **LOLP** | Loss of Load Probability, Yük Kaybı Olasılığı | Yükün karşılanamama olasılığı |\n| **EENS** | Expected Energy Not Served, Beklenen Verilemeyen Enerji | Karşılanamayan enerji, MWh/yıl. Paraya çevrilebilir |\n| **ELCC** | Effective Load Carrying Capability, Etkin Yük Taşıma Kapasitesi | Bir santralin güvenilir kapasite katkısı |\n\n**LOLE hedefi hakkında:** Klasik hedef birçok sistemde 0,1 gün/yıl mertebesinde konuşulur. Türkiye hedefi sorulursa güncel kapasite mekanizması ve TEİAŞ (Türkiye Elektrik İletim A.Ş.) / EPDK (Enerji Piyasası Düzenleme Kurumu) belgesine bak. Ezber rakamı piyasaya mal etme.\n\n**ELCC hakkında:**\n\n- Rüzgârın kurulu gücünün tamamı ELCC değildir.\n- Güneşin akşam puantına katkısı düşüktür.\n- Kapasite hesabında isim plakasını (etiket kapasitesini) toplamak yanlıştır.\n- 122 GW kurulu güç ile 60 GW puant yan yana dururken aradaki farkın bir kısmı tam olarak budur.\n\n> **Sade anlatım:** 10 MW'lık bir güneş santrali, akşam puantında neredeyse hiç üretmiyorsa, puantı karşılama açısından 10 MW değil, çok daha az sayılır. ELCC bu \"gerçekten güvenilebilen\" kısmı ölçer.\n\n### İletim güvenilirliği: N-1 ve risk/etki\n\nİletim güvenilirliği N-1 **deterministik** kriterle yürür. Deterministik, olasılığa bakmadan \"her tek arıza için sağlanmalı\" diyen kural demektir.\n\n**Olasılıklı iletim planlaması** ise şu çarpımla çalışır:\n\n```\nrisk = arıza oranı × sonuç\n```\n\nBu, grubun \"risk/etki\" eksenidir.\n\n**Etki** şunlarla ölçülür:\n\n- kesilen MW,\n- kesintinin süresi,\n- kritik yük (hastane gibi kesilmemesi gereken tüketim).\n\nÖnemli nokta: düşük olasılıklı ama ülkeyi bölen bir koridor, sık ama yerel bir arızadan önce gelebilir. Sıralamayı sadece olasılığa göre yapmak büyük olayı gizler.\n\n### Dağıtım: SAIDI, SAIFI, CAIDI\n\nDağıtımda bu göstergeler müşteri gözündeki karşılıktır.\n\n| Gösterge | Açılımı | Ne anlatır |\n|---|---|---|\n| **SAIDI** | System Average Interruption Duration Index, Sistem Ortalama Kesinti Süresi Endeksi | Müşteri başına ortalama toplam kesinti süresi |\n| **SAIFI** | System Average Interruption Frequency Index, Sistem Ortalama Kesinti Sıklığı Endeksi | Müşteri başına ortalama kesinti sayısı |\n| **CAIDI** | Customer Average Interruption Duration Index, Müşteri Ortalama Kesinti Süresi Endeksi | Ortalama kesinti süresi |\n\n```\nCAIDI = SAIDI / SAIFI\n```\n\nToplam süreyi kesinti sayısına bölünce, bir kesintinin ortalama ne kadar sürdüğü çıkar.\n\nPlanlı ve plansız kesintiler ayrı tutulur.\n\n## 4. Fayda ve maliyet\n\n### Kalemler\n\n| Maliyet | Fayda |\n|---|---|\n| Yatırım | Ertelenen başka yatırım |\n| Kayıp | Kayıp düşüşü |\n| Bakım | Kısıntı azalışı |\n| Kamulaştırma | Kesinti azalışı |\n| Kısıntı | Piyasa sıkışıklığının azalması |\n| Güvenilirlik bedeli: EENS × birim kesinti maliyeti | |\n\n**Kayıp**, hatlarda ısıya dönüşüp kaybolan enerjidir. **Piyasa sıkışıklığı**, hat kapasitesi yetmediği için ucuz elektriğin istenen yere taşınamamasıdır.\n\nParaya çevrilemeyen fayda (ada riski, güvenlik) ayrı satırda kalır. **İç verim oranının** içine saklanmaz. İç verim oranı, yatırımın getirisini tek bir yüzdeyle özetleyen ölçüdür. **Ada riski**, şebekenin birbirinden kopmuş parçalara bölünme riskidir.\n\n### İskonto ve duyarlılık\n\n**İskonto oranı**, gelecekteki paranın bugünkü değerini hesaplarken kullanılan orandır. Yüksek iskonto, uzak gelecekteki faydayı küçültür. Bu yüzden iskonto oranı uzun hattı cezalandırır.\n\nÖmrü 40 yıl olan hattı 10 yıllık pencerede ucuz santralla kıyaslamak yöntemi bozar.\n\n**Duyarlılık analizi** şu soruyu sorar: iskonto, talep, yakıt, kısıntı fiyatı değişince sıralama değişiyor mu? Değişmiyorsa karar **gürbüzdür** (varsayımlar değişse de sağlam kalır).\n\n## 5. Bağlantı çalışması\n\nYeni santral veya büyük yük için tipik paket:\n\n1. Bağlantı noktası alternatifleri\n2. Yük akışı, yaz-kış, tam üretim ve kısmi\n3. N-1 ve ortak mod\n4. Kısa devre azami (ekipman) ve asgari (koruma)\n5. Gerilim ve reaktif\n6. Gerekirse geçici hal ve küçük sinyal\n7. Koruma koordinasyonu\n8. Şebeke güçlendirme bedeli ve kim öder\n\nBirkaç terim:\n\n- **Ortak mod:** iki elemanın aynı sebeple birlikte devre dışı kalması (örneğin aynı direği paylaşan iki devre).\n- **Kısa devre azami / asgari:** en büyük kısa devre akımı ekipmanın dayanıp dayanamayacağını, en küçük kısa devre akımı korumanın arızayı görüp göremeyeceğini belirler.\n- **Reaktif:** iş yapmayan ama gerilimi ayakta tutmak için gereken güç bileşeni.\n- **Geçici hal:** büyük bir arızadan hemen sonraki ilk saniyelerde jeneratörlerin uyumlu dönmeye devam edip etmediği.\n- **Küçük sinyal:** küçük bozulmalarda oluşan salınımların sönüp sönmediği.\n- **Koruma koordinasyonu:** rölelerin doğru sırayla ve doğru sürede açması.\n\n### Enterkonneksiyon ve HVDC\n\nEnterkonneksiyon çalışması aynı pakete şunları ekler:\n\n- frekans paylaşımı,\n- NTC (Net Transfer Capacity, Net Transfer Kapasitesi; iki ülke arasında güvenle aktarılabilecek güç),\n- bölgeler arası salınım.\n\n**HVDC** (High Voltage Direct Current, Yüksek Gerilim Doğru Akım) ise güç kontrol modunu ekler.\n\n## 6. Esneklik\n\nYenilenebilir arttıkça \"yeterince hat\" yetmez. **Esneklik**, sistemin üretim ve tüketimdeki hızlı değişimlere ayak uydurabilmesidir.\n\nEsneklik kaynakları:\n\n- depolama,\n- talep kaydırma (tüketimi başka saate kaydırmak),\n- hızlı termik,\n- hidro,\n- kısıntı,\n- dış ticaret,\n- sektörel bağlama (ısı, hidrojen) ileride.\n\nPlan, esnekliği **MW ve süre** olarak ister. Bunlar ayrı ihtiyaçlardır:\n\n| İhtiyaç | Ne demek |\n|---|---|\n| 15 dakikalık rampa | Kısa sürede hızlı artış veya azalış |\n| 4 saatlik enerji | Saatlerce sürecek açığı kapatmak |\n| Anlık atalet | Dönen kütlenin frekansın ani değişimine direnci |\n\nDepolamayı sadece enerji arbitrajı diye modellemek, şebeke hizmetini kaçırır. **Enerji arbitrajı**, ucuzken depolayıp pahalıyken satmaktır.\n\n## 7. Yazılım\n\nPlanlama çalışması kişiye bağlı bir PowerFactory dosyası olarak kalırsa tekrar edilemez. **PowerFactory**, güç sistemi analiz yazılımıdır.\n\nTekrarlanabilir iş şunlardan oluşur:\n\n- versiyonlu şebeke modeli,\n- senaryo tablosu,\n- betik (Python API; API = Application Programming Interface, Uygulama Programlama Arayüzü),\n- sonuç veri tabanı,\n- aynı limit kontrolü.\n\nGrubun ürün refleksi budur. Danışmanlık projesi de, sonunda TEİAŞ veya dağıtım şirketinin kendi koşacağı araca yaklaştığı ölçüde değerlidir.\n\n> **Mülakatta şöyle söyle:** \"Çalışmayı betiğe bağladım, modeli kilitledim, sonucu tabloda karşılaştırdım.\" Bu cümle, analiz ile yazılımı birleştirir.\n\n### 90 saniyelik metin için not\n\nAşağıdaki metin sayfanın sözlü özetidir. İçindeki kısaltmalar yukarıda açıldı: N-1 (Bölüm 2), ELCC ve EENS (Bölüm 3). \"Puantın yüzde 5 üzerinde\" ifadesi, şebeke yönetmeliğinin planlama yükü kuralıdır: planlama, beklenen en yüksek tüketimin yüzde 5 fazlasıyla yapılır.\n\n## 90 saniye\n\n\"Planlama, puantın yüzde 5 üzerinde N-1 ile yılları seçer. Kurulu gücü toplamak yeterlilik değildir; ELCC ve EENS bakılır. İletimde master plan senaryoları, aday yatırımı eler. Sıralama fayda, maliyet ve düşük olasılıklı büyük risktir. Yenilenebilirde net yük rampası ve esneklik süresi gerekir. Çalışmayı betik ve kilitli model ile tekrarlanabilir bırakırım.\"\n\n## Kendini yokla\n\nÖnce cevabı kapat, kendin söyle, sonra kontrol et.\n\n1. **Planlama tahmini neleri içerir?**\n   Enerji (TWh), puant (MW), puantın saati, bölge dağılımı, çatı güneşi düşülmüş net yük.\n\n2. **Neden tek \"resmi talep\" ile plan yapılmaz?**\n   Talep sapınca atıl varlık üretir. En az düşük, orta, yüksek talep ve elektrifikasyon (araç, ısı pompası) senaryosu gerekir.\n\n3. **Net yük nedir ve güneş arttıkça puanta ne olur?**\n   Net yük = talep − rüzgâr − güneş. Puant akşam güneş batımına kayabilir; model net yükün rampasını da taşımalıdır.\n\n4. **Üretim ve iletim ayrı optimize edilirse ne olur?**\n   Ucuz santral kısıtlı koridora yığılır.\n\n5. **Hangi iletim adayı elenir?**\n   Hiçbir senaryoda ihlali çözmeyen. Kalanlar fayda/maliyet ve risk ile sıralanır.\n\n6. **ELCC neden önemli? Kurulu güç ile puant örneği?**\n   Santralin güvenilir kapasite katkısını verir; isim plakasını toplamak yanlıştır. 122 GW kurulu güç ile 60 GW puant arasındaki farkın bir kısmı budur.\n\n7. **LOLE hedefi sorulursa ne dersin?**\n   Klasik hedef birçok sistemde 0,1 gün/yıl mertebesinde konuşulur; Türkiye için güncel kapasite mekanizmasına ve TEİAŞ/EPDK belgesine bakarım.\n\n8. **Risk sıralamasını sadece olasılığa göre yapmak neden yanlış?**\n   Düşük olasılıklı ama ülkeyi bölen koridor, sık ama yerel arızadan önce gelebilir; sadece olasılık büyük olayı gizler.\n\n9. **CAIDI nasıl hesaplanır?**\n   CAIDI = SAIDI/SAIFI; ortalama kesinti süresi.\n\n10. **Güvenilirlik bedeli nasıl hesaplanır, paraya çevrilemeyen fayda nereye yazılır?**\n    EENS × birim kesinti maliyeti. Paraya çevrilemeyen fayda ayrı satırda kalır, iç verim oranına saklanmaz.\n\n11. **Bağlantı çalışmasının sekiz adımı nedir?**\n    Bağlantı noktası alternatifleri; yük akışı (yaz-kış, tam ve kısmi üretim); N-1 ve ortak mod; kısa devre azami ve asgari; gerilim ve reaktif; gerekirse geçici hal ve küçük sinyal; koruma koordinasyonu; güçlendirme bedeli ve kim öder.\n\n12. **Esneklik hangi boyutlarda istenir?**\n    MW ve süre: 15 dakikalık rampa, 4 saatlik enerji, anlık atalet ayrı ayrı.\n"}, {"id": "12-Planlama/02-Genisleme-LOLE-EENS-TEIAS-Projeksiyon.md", "group": "12  Planlama", "title": "Genişleme, LOLE/EENS ve TEİAŞ projeksiyonları", "body": "# Genişleme, LOLE/EENS ve TEİAŞ projeksiyonları\n\nBu sayfa dört şeyi anlatır:\n\n1. Genişleme planlamasının bir optimizasyon problemi olarak nasıl kurulduğu.\n2. Güvenilirliğin iki göstergesi olan LOLE ve EENS'in elle nasıl hesaplandığı.\n3. Bir iletim yatırımının fayda/maliyetinin elle nasıl hesaplandığı.\n4. TEİAŞ'ın (Türkiye Elektrik İletim Anonim Şirketi) yayımladığı talep projeksiyonlarında neyin doğrulanmış olduğu.\n\nKısaltmalar:\n\n| Kısaltma | Açılımı | Türkçesi |\n| --- | --- | --- |\n| LOLP | Loss of Load Probability | Yük Kaybı Olasılığı |\n| LOLE | Loss of Load Expectation | Beklenen Yük Kaybı Süresi |\n| EENS | Expected Energy Not Served | Beklenen Verilemeyen Enerji |\n| EUE | Expected Unserved Energy | Beklenen Karşılanamayan Enerji (EENS'in diğer adı) |\n| FOR | Forced Outage Rate | Zorunlu Devre Dışı Kalma Oranı |\n| VOLL | Value of Lost Load | Verilemeyen Enerjinin (Kayıp Yükün) Değeri |\n| ELCC | Effective Load Carrying Capability | Etkin Yük Taşıma Kapasitesi (kapasite değeri) |\n| N-1 | — | Herhangi tek bir eleman (hat, trafo, ünite) kaybında sistemin limit içinde kalması kuralı |\n| DC / AC model | Direct Current / Alternating Current | Doğru akım (basitleştirilmiş, doğrusal) / alternatif akım (tam) şebeke modeli |\n\n## Planlama zinciri\n\nAşağıdaki şema, planlamanın talep tahmininden yatırım programına kadar hangi sırayla ilerlediğini gösterir.\n\n```\nTalep tahmini  →  Üretim genişleme (ne kadar, ne tür, ne zaman)\n               →  İletim genişleme (hangi hat, hangi trafo)\n               →  Doğrulama: yük akışı, N-1, kısa devre, kararlılık\n               →  Fayda-maliyet  →  yatırım programı\n```\n\nZincirin halkaları:\n\n| Halka | Ne yapar |\n| --- | --- |\n| Talep tahmini | Yıllar sonra ne kadar ve nerede tüketim olacağını tahmin eder |\n| Üretim genişleme | Ne kadar, ne tür ve ne zaman santral gerektiğine karar verir |\n| İletim genişleme | Hangi hat ve hangi trafonun yapılacağına karar verir |\n| Doğrulama | Seçilen planı yük akışı, N-1, kısa devre ve kararlılık analizleriyle sınar |\n| Fayda-maliyet | Planın parasal olarak değip değmediğine bakar ve yatırım programını çıkarır |\n\nİşletme ile planlama farklı sorular sorar:\n\n- İşletme: \"elimdeki şebekeyle bugün ne yaparım\"\n- Planlama: \"on yıl sonra yeterli olması için bugün neye karar vermeliyim\"\n\nHat inşası 5–10 yıl sürer; yanlış karar pahalıdır ve geri alınmaz.\n\n## Genişleme planlaması bir optimizasyon problemidir\n\nOptimizasyon problemi, bazı kısıtları sağlarken bir maliyeti en küçük yapan çözümü arar. Aşağıdaki blok, genişleme planlamasının amaç fonksiyonunu (\"en küçük\") ve kısıtlarını (\"öyle ki\") yazar.\n\n```\nen küçük   yatırım maliyeti + işletme maliyeti + verilemeyen enerji maliyeti\nöyle ki    her senaryo ve her saat için güç dengesi\n           hat ve trafo sınırları (yalnız kurulmuşsa kullanılabilir)\n           N-1 güvenliği\n           güvenilirlik ölçütü (LOLE ≤ hedef)\n           politika hedefleri (yenilenebilir payı, emisyon)\n```\n\nBloğun satırları:\n\n- **Amaç:** yatırım, işletme ve verilemeyen enerji maliyetlerinin toplamını en küçük yapmak. Çok az yatırım yapılırsa verilemeyen enerji maliyeti büyür; çok fazla yatırım yapılırsa yatırım maliyeti büyür. Optimum ikisinin dengesidir.\n- **Güç dengesi:** her senaryoda ve her saatte üretim tüketime eşit olmalı.\n- **Hat ve trafo sınırları:** bir hat veya trafo yalnız kurulmuşsa kullanılabilir ve kapasitesini aşamaz.\n- **N-1 güvenliği:** tek eleman kaybında da limitler sağlanmalı.\n- **Güvenilirlik ölçütü:** LOLE hedefin altında kalmalı.\n- **Politika hedefleri:** yenilenebilir payı ve emisyon sınırları sağlanmalı.\n\n### Neden karışık tam sayılı?\n\nKarar değişkenleri ikilidir: \"bu hattı kur veya kurma\". Yani değişken 0 ya da 1 olur, arası olmaz. Bu yüzden problem karışık tam sayılıdır: bazı değişkenler tam sayı (kur/kurma), bazıları sürekli (akış, üretim miktarı).\n\nŞebeke denklemleri çoğunlukla DC modelle yazılır. DC model, gerilim büyüklüklerini sabit kabul edip yalnızca aktif güç akışını doğrusal denklemlerle hesaplayan basitleştirmedir. Aday çözümler sonra AC yük akışı, kısa devre ve kararlılıkla doğrulanır.\n\n### Zorluğu\n\n| Zorluk | Açıklama | Nasıl yönetilir |\n| --- | --- | --- |\n| **Belirsizlik** | talep, yakıt fiyatı, yenilenebilirin nereye kurulacağı, politika | Tek tahmin yerine senaryolar kullanılır; iyi plan, senaryoların çoğunda kabul edilebilir olan plandır. |\n| **Boyut** | yüzlerce aday, binlerce saat, onlarca senaryo | Temsilî günler ve ayrıştırma yöntemleri kullanılır. |\n| **Tavuk-yumurta** | santral, hattın olduğu yere gelmek ister; hat, santralin olduğu yere yapılır | Bağlanabilir kapasite ilanı bu döngüyü yönetmenin aracıdır. |\n\nTemsilî gün, yılın 8760 saatinin hepsi yerine yılı iyi temsil eden birkaç tipik günün hesaplanmasıdır. Ayrıştırma, büyük problemi daha küçük alt problemlere bölüp sırayla çözmektir.\n\n## Yeterlilik ile güvenlik\n\nGüvenilirliğin iki yüzü:\n\n| Yüz | Sorduğu soru | Nasıl ölçülür |\n| --- | --- | --- |\n| **Yeterlilik (adequacy)** | talebi karşılayacak kadar kaynak var mı? | Olasılıksal ölçülür: LOLE, EENS. |\n| **Güvenlik (security)** | ani bir arızaya dayanabiliyor mu? | Deterministik ölçülür: N-1. |\n\nOlasılıksal, \"ne kadar ihtimalle\" diye bakmaktır. Deterministik, ihtimale bakmadan \"şu arıza olursa sistem dayanmalı\" diye kesin kural koymaktır.\n\nİkisi ayrı sorudur. Kâğıt üstünde bol kapasitesi olan sistem, tek bir hat kaybında çökebilir.\n\n> **Sade anlatım:** Yeterlilik \"dolapta yeterince yemek var mı\" sorusudur. Güvenlik \"tencere elinden düşerse akşam yemeği yine çıkar mı\" sorusudur. Biri evetse öbürü otomatik evet olmaz.\n\n## LOLE ve EENS\n\n| Endeks | Tanım | Birim |\n| --- | --- | --- |\n| LOLP | Belirli bir anda talebin karşılanamama olasılığı | — |\n| LOLE | Yılda talebin karşılanamadığı beklenen süre | saat/yıl veya gün/yıl |\n| EENS (EUE) | Yılda verilemeyen beklenen enerji | MWh/yıl |\n\nLOLE sıklığı, EENS büyüklüğü söyler. Yılda 3 saatlik LOLE, 10 MW'lık açık da olabilir 5000 MW'lık açık da.\n\n### Hedef değerler\n\nUluslararası tipik hedefler:\n\n| Bölge | Tipik hedef |\n| --- | --- |\n| Kuzey Amerika | 10 yılda 1 gün (0,1 gün/yıl) |\n| Avrupa | birçok ülkede yılda 3 saat civarı |\n| Türkiye | resmî hedef değerini **doğrulamadım**; rakam söyleme |\n\n### Hesabın iki girdisi\n\nHesap iki tablonun birleşimidir:\n\n1. **Kapasite kayıp olasılık tablosu:** her ünitenin zorunlu devre dışı kalma oranı (FOR) ile, kaç MW'ın hangi olasılıkla devre dışı olacağı.\n2. **Yük süre eğrisi:** yükün yılın hangi oranında hangi seviyede olduğu.\n\nZorunlu devre dışı kalma oranı (FOR), bir ünitenin plansız arıza nedeniyle çalışamaz durumda olduğu zamanın oranıdır. Yük süre eğrisi, yılın saatlerindeki yükleri büyükten küçüğe sıralayıp çizilen eğridir.\n\n> **Sade anlatım:** Birinci tablo \"elimde hangi olasılıkla kaç MW santral hazır\" sorusunu, ikinci tablo \"yılın ne kadarında ne kadar tüketim var\" sorusunu cevaplar. Hazır santral tüketimden azsa o an yük kaybı olur. İki tabloyu birleştirince yük kaybının olasılığı, süresi ve enerjisi çıkar.\n\n## Elle örnek\n\nÜç adet 100 MW ünite, her birinin zorunlu devre dışı kalma oranı %5. Üniteler bağımsız.\n\n\"Bağımsız\" demek, bir ünitenin arızalanmasının diğerinin arızalanma olasılığını değiştirmemesidir. Bu varsayım sayesinde olasılıklar çarpılabilir.\n\n### Adım 1, kapasite kayıp tablosu (binom dağılımı)\n\nBu adım, 0, 1, 2 veya 3 ünitenin aynı anda devre dışı olma olasılığını ve o durumda kalan kullanılabilir kapasiteyi hesaplar. Binom dağılımı, her biri aynı olasılıkla \"arızalı/sağlam\" olan bağımsız denemelerde kaç tanesinin arızalı çıkacağının olasılığını verir. Çarpandaki 3, üç üniteden hangisinin (veya hangi ikisinin) arızalı olduğunun 3 farklı şekilde seçilebilmesinden gelir.\n\n| Devre dışı ünite | Kullanılabilir | Olasılık |\n| --- | --- | --- |\n| 0 | 300 MW | `0,95³ = 0,857375` |\n| 1 | 200 MW | `3 × 0,05 × 0,95² = 0,135375` |\n| 2 | 100 MW | `3 × 0,05² × 0,95 = 0,007125` |\n| 3 | 0 MW | `0,05³ = 0,000125` |\n\nToplam 1,000000. Kontrol tuttu.\n\nBu kontrol, tüm durumların olasılıkları toplamının 1 olması gerektiğini sınar; tutması tablonun eksiksiz ve doğru olduğunu gösterir.\n\n### Adım 2, yük modeli\n\nBu adım, yük süre eğrisini iki basamaklı basit bir modele indirir: yılın %20'sinde 250 MW (puant), %80'inde 150 MW.\n\nPuant, yılın en yüksek tüketim seviyesidir.\n\n### Adım 3, puant saatleri (250 MW)\n\nBu adım, puant saatlerinde yük kaybı olasılığını ve ortalama açığı hesaplar.\n\nKullanılabilir kapasite 250'nin altındaysa yük kaybı var: 1, 2 veya 3 ünite devre dışı.\n\nAşağıdaki blok önce bu üç durumun olasılıklarını toplar, sonra her durumun açığını (250 − kullanılabilir kapasite: 50, 150, 250 MW) kendi olasılığıyla çarpıp toplar.\n\n```\nOlasılık       = 0,135375 + 0,007125 + 0,000125 = 0,142625\nBeklenen açık  = 0,135375 × 50 + 0,007125 × 150 + 0,000125 × 250 = 7,869 MW\n```\n\n- **Olasılık satırı:** puant saatinde yük kaybı yaşanma olasılığını verir.\n- **Beklenen açık satırı:** puant saatinde ortalama kaç MW eksik kaldığını verir. Açıklar: 1 ünite devre dışıyken 250 − 200 = 50 MW, 2 ünite devre dışıyken 250 − 100 = 150 MW, 3 ünite devre dışıyken 250 − 0 = 250 MW.\n\n### Adım 4, diğer saatler (150 MW)\n\nBu adım, puant dışı saatlerde aynı hesabı yapar.\n\nYük kaybı için 2 veya 3 ünite devre dışı olmalı. Tek ünite devre dışıyken 200 MW kalır, bu da 150 MW'ı karşılar.\n\nAşağıdaki blok iki durumun olasılığını toplar ve açıkları (150 − 100 = 50 MW, 150 − 0 = 150 MW) olasılıklarıyla ağırlıklandırır.\n\n```\nOlasılık       = 0,007125 + 0,000125 = 0,007250\nBeklenen açık  = 0,007125 × 50 + 0,000125 × 150 = 0,375 MW\n```\n\n- **Olasılık satırı:** puant dışı saatte yük kaybı olasılığını verir.\n- **Beklenen açık satırı:** puant dışı saatte ortalama kaç MW eksik kaldığını verir.\n\n### Adım 5, birleştir\n\nBu adım, iki yük seviyesinin sonuçlarını yılın içindeki payları (%20 ve %80) ile ağırlıklandırıp yıllık göstergeleri çıkarır. 8760, bir yıldaki saat sayısıdır (365 × 24).\n\n```\nLOLP = 0,20 × 0,142625 + 0,80 × 0,007250 = 0,034325\nLOLE = 0,034325 × 8760 = 300,7 saat/yıl\nEENS = 8760 × (0,20 × 7,869 + 0,80 × 0,375) = 8760 × 1,874 = 16.414 MWh/yıl\n```\n\n- **LOLP satırı:** rastgele seçilen bir saatte yük kaybı olma olasılığını verir.\n- **LOLE satırı:** bu olasılığı yılın saat sayısıyla çarparak yılda beklenen yük kaybı saatini verir.\n- **EENS satırı:** saat başına ortalama açığı (MW) yılın saat sayısıyla çarparak yılda verilemeyen beklenen enerjiyi (MWh) verir.\n\n### Yorum\n\nKurulu güç 300 MW, puant 250 MW: yedek marjı %20. Yedek marjı, kurulu gücün puantı yüzde kaç aştığıdır: (300 − 250) / 250 = %20.\n\nKâğıt üstünde rahat görünür. Ama LOLE 300 saat; hedefin yüz katı.\n\nNeden: tek bir ünite sistemin üçte biridir ve herhangi birinin devre dışı olma olasılığı %14'tür. Bu %14, Adım 3'teki 0,142625 değeridir.\n\n**Yedek marjı tek başına güvenilirliği söylemez; ünite büyüklüğü ve sayısı belirleyicidir.**\n\n> **Mülakatta şöyle söyle:** \"Yedek marjı tek başına güvenilirliği söylemez; ünite büyüklüğü ve sayısı belirleyicidir. Üç yüz megavatlık örnekte yüzde yirmi yedek marjına rağmen LOLE üç yüz saat çıktı.\"\n\n### Dördüncü ünite eklenirse\n\nAynı yöntem, `elle_ornekler.py` mantığıyla hesaplandı. Yani dördüncü bir 100 MW ünite (%5 FOR) eklenip Adım 1–5 tekrarlandı.\n\n| | 3 ünite | 4 ünite |\n| --- | --- | --- |\n| LOLP | 0,0343 | 0,0032 |\n| LOLE | 300,7 saat/yıl | 27,9 saat/yıl |\n| EENS | 16.414 MWh/yıl | 1.486 MWh/yıl |\n\nBir ünite, verilemeyen enerjiyi on birde birine indirdi.\n\n### Yatırım kararı\n\nBu adım, güvenilirlik artışını paraya çevirip yatırım maliyetiyle kıyaslar.\n\nVerilemeyen enerjinin değeri (VOLL) 100.000 TL/MWh varsayılırsa (varsayım), dördüncü ünitenin yıllık güvenilirlik faydası `(16.414 − 1.486) × 100.000 ≈ 1,49 milyar TL`'dir.\n\nBu formül, dördüncü ünitenin azalttığı verilemeyen enerjiyi (MWh/yıl) her MWh'nin değeriyle çarpar.\n\nÜnitenin yıllıklandırılmış maliyeti bunun altındaysa yatırım yapılır. Yıllıklandırılmış maliyet, toplam yatırım maliyetinin ömür boyunca eşit yıllık taksitlere çevrilmiş halidir.\n\nYeterlilik planlamasının özü bu karşılaştırmadır.\n\n## Yenilenebilirin yeterliliğe katkısı\n\nGüneş ve rüzgâr kurulu güçleri kadar güvenilirlik sağlamaz.\n\nÖlçüsü **kapasite değeri** (ELCC): bu santrali ekleyince, LOLE'yi değiştirmeden ne kadar ek yük karşılanabilir?\n\n- Akşam puantlı bir sistemde güneşin kapasite değeri düşüktür; pay arttıkça daha da düşer (puant, güneşin olmadığı saatlere kayar).\n- Depolamanın kapasite değeri süresine bağlıdır.\n- Hesap için kronolojik benzetim gerekir; yukarıdaki basit tablo yöntemi depolamayı ve korelasyonu göremez. Pratikte ardışık Monte Carlo kullanılır.\n\nTerimler:\n\n- **Kronolojik benzetim:** yılı saat saat, sırasıyla simüle etmek. Depolamanın şarj durumu bir önceki saate bağlı olduğu için sıranın korunması gerekir.\n- **Korelasyon:** örneğin bütün güneş santrallerinin aynı anda (akşam) üretimi bırakması; basit tablo yöntemi üniteleri bağımsız kabul ettiği için bunu göremez.\n- **Ardışık Monte Carlo:** rastgele arıza ve hava durumu dizileriyle yılı çok kez, saat sırasıyla simüle edip sonuçların ortalamasını almak.\n\n> **Sade anlatım:** 1000 MW güneş eklemek, akşam puantında neredeyse hiç işe yaramıyorsa, güvenilirlik açısından 1000 MW değil çok daha az sayılır. ELCC bu \"gerçekten güvenilebilen\" kısmı ölçer.\n\n## İletim yatırımının fayda-maliyeti\n\n### Elle örnek\n\n`13` klasöründeki örnekte hat 1–3'ün kısıtı, üretim maliyetini saatte 1.500'den 3.200 TL'ye çıkarıyordu: kısıt maliyeti 1.700 TL/saat. Bu kısıt yılda 2.000 saat bağlıyor olsun.\n\nKısıt maliyeti, hat kapasitesi yetmediği için ucuz santral yerine pahalı santralin çalıştırılmasından doğan ek maliyettir: 3.200 − 1.500 = 1.700 TL/saat. \"Bağlıyor\" demek, hattın o saatlerde kapasite sınırına dayanmasıdır.\n\n**Adım 1, yıllık fayda.** Aşağıdaki satır, saatlik kısıt maliyetini kısıtın bağladığı saat sayısıyla çarparak kısıt kaldırılırsa yılda kazanılacak tutarı verir.\n\n```\nYıllık kısıt maliyeti = 1.700 × 2.000 = 3,40 milyon TL\n```\n\nKısıtı kaldıran yatırım 25 milyon TL, ömür 30 yıl, iskonto oranı %10.\n\nİskonto oranı, gelecekteki parayı bugünkü değere çevirmek için kullanılan orandır.\n\n**Adım 2, yatırımı yıllığa çevir.** Aşağıdaki blok, sermaye geri kazanım faktörüyle 25 milyon TL'lik yatırımı 30 yıl boyunca ödenecek eşit yıllık tutara çevirir. Formülde r iskonto oranı (0,10), n ömürdür (30 yıl); (1,10)³⁰ = 17,449 olduğu için payda 17,449 − 1 = 16,449 olur.\n\n```\nSermaye geri kazanım faktörü = r (1+r)ⁿ / ((1+r)ⁿ − 1) = 0,10 × 17,449 / 16,449 = 0,1061\nYıllık maliyet = 25 × 0,1061 = 2,65 milyon TL\n```\n\n- **Birinci satır:** her 1 TL yatırımın yıllık eşdeğerini (0,1061 TL) verir.\n- **İkinci satır:** bu faktörü yatırım tutarıyla çarparak yıllık maliyeti verir.\n\n**Adım 3, karşılaştır.** Bu adım, yıllık faydayı yıllık maliyetle kıyaslar.\n\nFayda (3,40) maliyetten (2,65) büyük; oran 1,28. Yatırım yapılır.\n\n**Adım 4, duyarlılık.** Bu adım, varsayım değişince kararın değişip değişmediğine bakar.\n\nİskonto oranı %15 olsaydı yıllık maliyet 3,81 milyon TL'ye çıkar ve yatırım yapılmazdı. Sonuç varsayıma duyarlıdır; bu yüzden duyarlılık analizi raporun parçasıdır.\n\n| | İskonto %10 | İskonto %15 |\n| --- | --- | --- |\n| Yıllık fayda | 3,40 milyon TL | 3,40 milyon TL |\n| Yıllık maliyet | 2,65 milyon TL | 3,81 milyon TL |\n| Karar | yatırım yapılır | yatırım yapılmaz |\n\nGrubun iş paketlerinden biri \"fayda/maliyet ve risk/etki eksenli yatırım planlaması\"dır (`01/02`).\n\n## TEİAŞ projeksiyonları (kaynaklı)\n\nProjeksiyon, geleceğe dönük tahmindir. Bu bölümde neyin doğrulandığı, neyin doğrulanmadığı ayrı ayrı işaretlidir.\n\n### Doğrulanan rapor listesi\n\n**Doğrulandı** (TEİAŞ \"İlgili Raporlar\" sayfası, Kasım 2026): sayfada şu raporlar listelenir:\n\n- 2026–2035 Talep Tahmin Raporu (ve önceki yıllar: 2025–2034, 2024–2033)\n- Bağlanabilir Bölgesel Üretim Tesisi Kapasite Raporu 2024–2028 ve 2029–2033\n- Kısa Devre Akımları (2025)\n\n### Doğrulanan 2032 puant tahmini\n\n**Doğrulandı** (2023–2032 Talep Tahmin Raporu):\n\n| 2032 puant tahmini | MW |\n| --- | --- |\n| Düşük senaryo | 71.409 |\n| Baz senaryo | 77.718 |\n| Yüksek senaryo | 86.596 |\n\nYöntem: dağıtım şirketlerinin ve organize sanayi bölgelerinin tahminleri **trafo merkezi bazında** toplanır; düşük, baz ve yüksek olmak üzere üç senaryo üretilir.\n\n### Doğrulanmayan bilgi\n\n**İkincil, doğrulanmadı:** 2026–2035 raporunun baz senaryosunda yıllık ortalama talep artışının %3,7 civarında olduğu ikincil bir kaynakta geçiyor. Raporun kendisinden okumadım. Mülakattan önce raporu aç, 2035 baz puantını ve artış oranını not et.\n\n**Kullanma:** 2035 için tek bir enerji ve puant rakamı veren internet özetleri farklı kurumların farklı yıllardaki senaryolarını karıştırıyor. Kaynağını raporun sayfasında görmediğin rakamı söyleme.\n\n### Karşılaştırma için gerçekleşmeler\n\nDoğrulanmış gerçekleşmeler (`01/02`):\n\n| Gösterge | Değer |\n| --- | --- |\n| 2025 ani puantı | 60.414 MW |\n| 2025 sonu kurulu güç | 122.518,6 MW |\n\nÜretim tarafı: uzun dönemli üretim kapasite projeksiyonu ve Türkiye Ulusal Enerji Planı ayrı belgelerdir. Güncel hedef rakamlarını **doğrulamadım**.\n\n### Mülakat için anlamı\n\nTrafo merkezi bazında tahmin, **mekânsal** tahmindir; planlama yük akışının girdisidir. Mekânsal tahmin, tüketimin yalnız ne kadar olacağını değil, şebekenin hangi noktasında olacağını da söyler. Yük akışı da tam olarak bu nokta bazlı yüke ihtiyaç duyar.\n\nŞebeke yönetmeliği planlama çalışmalarında puantın %5 üzerinin kullanılmasını ister (`01/02`).\n\n> **Mülakatta şöyle söyle:** \"TEİAŞ talep tahminini trafo merkezi bazında, üç senaryolu yayımlıyor.\"\n\n## Yaygın yanlış\n\n| Yanlış inanç | Neden yanlış |\n| --- | --- |\n| **\"Kurulu güç puantın iki katıysa arz güvenliği tamamdır.\"** | Güneş gece, rüzgâr durgun havada, hidrolik kurak yılda yoktur. Kapasite değeri sorulur. |\n| **\"Yedek marjı %20 ise sistem güvenilirdir.\"** | Elle örnekte %20 marjla LOLE 300 saat çıktı. |\n| **\"LOLE düşükse kesinti küçüktür.\"** | LOLE süreyi söyler, büyüklüğü EENS söyler. |\n| **\"N-1 sağlanıyorsa yeterlilik de vardır.\"** | Biri arıza dayanımı, diğeri kaynak yeterliliğidir. |\n| **\"Planlama tek tahminle yapılır.\"** | Senaryolarla yapılır; tek tahmin neredeyse kesinlikle yanlış çıkar. |\n| **\"En ucuz plan en iyi plandır.\"** | Belirsizlik altında pişmanlığı en az olan plan aranır. |\n\nPişmanlık, seçilen planın, gerçekleşen senaryo için en iyi olabilecek plana göre ne kadar daha kötü sonuç verdiğidir. Pişmanlığı en az plan, hangi senaryo gerçekleşirse gerçekleşsin çok kötü duruma düşmeyen plandır.\n\n## Panel takip sorusu\n\nPanel, ana cevaptan sonra derine inen bu soruları sorabilir.\n\n**Soru 1:** \"İletim planında N-1'i optimizasyona nasıl sokarsın?\"\n\n> **Mülakatta şöyle söyle:** Her aday şebeke için her arıza durumunda akış kısıtı yazmak problemi patlatır. Önce arızasız çözer, çıkan planı N-1 ile denetler, ihlal eden arızaları kısıt olarak ekler, yeniden çözerim.\n\nBu yöntemin mantığı: arızaların çoğu zaten sorun çıkarmaz; yalnız sorun çıkaranları probleme eklemek, problemi küçük tutar.\n\n**Soru 2:** \"Talep tahmininde elektrikli araç ve ısı pompası nasıl girer?\"\n\n> **Mülakatta şöyle söyle:** Geçmişe dayalı ekonometrik model bunları göremez, çünkü geçmişte yoklar. Aşağıdan yukarı, teknoloji benimseme senaryolarıyla ayrıca eklenir; yalnız enerjiyi değil puantın saatini ve yerini de değiştirirler.\n\nEkonometrik model, geçmiş tüketimi ekonomik büyüme, nüfus ve fiyat gibi değişkenlerle ilişkilendiren istatistiksel modeldir. Aşağıdan yukarı tahmin, araç sayısı ve şarj alışkanlığı gibi alt kalemlerden toplam talebi kurmaktır.\n\n## 90 saniye öncesi: konuşmanın iskeleti\n\nAşağıdaki konuşma, sayfanın ana fikirlerini sırayla söyler:\n\n1. Planlama karışık tam sayılı bir eniyileme problemidir ve senaryolarla çözülür.\n2. Güvenilirliğin iki yüzü: olasılıksal yeterlilik ve deterministik güvenlik (N-1).\n3. LOLE ve EENS hesabı: kapasite kayıp tablosu + yük süre eğrisi.\n4. Elle örnek: %20 yedek marjına rağmen LOLE 300 saat.\n5. Yatırım kararı: kazanılan güvenilirlik veya azalan kısıt maliyeti ile yıllıklandırılmış maliyetin kıyası.\n6. TEİAŞ: trafo merkezi bazında, üç senaryolu talep tahmini.\n\n## 90 saniye\n\n\"Planlama, talep tahmininden başlayıp üretim ve iletim yatırımına giden, karışık tam sayılı bir eniyileme problemidir ve belirsizlik yüzünden senaryolarla çözülür. Güvenilirliğin iki yüzü vardır: yeterlilik olasılıksaldır, güvenlik ise N-1 gibi deterministik bir ölçüttür. Yeterliliği LOLE ve EENS ile ölçerim: ünitelerin devre dışı kalma olasılıklarından kapasite kayıp tablosunu kurar, yük süre eğrisiyle birleştiririm. Üç yüz megavatlık örnekte yüzde yirmi yedek marjına rağmen LOLE üç yüz saat çıktı, çünkü üniteler büyüktü. Yatırım kararını, kazanılan güvenilirliğin veya azalan kısıt maliyetinin yıllıklandırılmış yatırım maliyetiyle karşılaştırmasına bağlarım. TEİAŞ talep tahminini trafo merkezi bazında, üç senaryolu yayımlıyor.\"\n"}, {"id": "13-Optimizasyon/00-Alt-Basliklar.md", "group": "13  Optimizasyon", "title": "13 — Optimizasyon", "body": "# 13 — Optimizasyon\n\nBu klasör, optimizasyonu (eniyilemeyi) güç sistemi mülakatı için anlatır. Aşağıdaki liste konuların sırasıdır. Her maddenin altında o başlıkta ne öğreneceğin tek cümleyle yazılı.\n\n1. **Karar değişkeni, amaç, kısıt**\n   Bu sayfada bir optimizasyon probleminin üç parçasını, yani neyi seçtiğini, neyi en aza indirdiğini ve hangi sınırlara uymak zorunda olduğunu öğreneceksin.\n\n2. **Dışbükeylik neden önemli**\n   Bu sayfada dışbükey (konveks) problemde bulunan yerel en iyinin neden genel en iyi olduğunu ve AC (alternatif akım) optimal güç akışının neden bu garantiye sahip olmadığını öğreneceksin.\n\n3. **Doğrusal programlama**\n   Bu sayfada amaç ve kısıtları doğrusal olan problemi, yani LP'yi (Linear Programming, doğrusal programlama) ve güç sistemindeki DC-OPF (doğru akım yaklaşımlı optimal güç akışı) örneğini öğreneceksin.\n\n4. **Karışık tamsayılı doğrusal programlama**\n   Bu sayfada LP'ye aç-kapa gibi ikili ve tamsayı kararların eklendiği MILP'yi (Mixed-Integer Linear Programming, karışık tamsayılı doğrusal programlama) ve ünite tahsisi örneğini öğreneceksin.\n\n5. **Karesel ve doğrusal olmayan programlama**\n   Bu sayfada karesel amaçlı QP'yi (Quadratic Programming, karesel programlama) ve AC-OPF gibi doğrusal olmayan NLP'yi (Nonlinear Programming, doğrusal olmayan programlama) öğreneceksin.\n\n6. **Lagrange, çift değişken, gölge fiyat**\n   Bu sayfada bir kısıtın çarpanının, yani gölge fiyatın, o kısıtı bir birim gevşetmenin değeri olduğunu öğreneceksin.\n\n7. **KKT koşulları**\n   Bu sayfada KKT (Karush-Kuhn-Tucker) en iyilik koşullarını ve tamamlayıcı gevşekliğin hat sıkışıklığı maliyetine nasıl dönüştüğünü öğreneceksin.\n\n8. **Gradyan, Newton, iç nokta**\n   Bu sayfada çözücülerin içinde çalışan temel arama yöntemlerinin ne yaptığını ve hangi problem sınıfında kullanıldığını öğreneceksin.\n\n9. **Sezgiseller: genetik, parçacık sürüsü, ne zaman**\n   Bu sayfada genetik algoritma ve parçacık sürüsü gibi türevsiz yöntemlerin hangi durumda mantıklı, hangi durumda mantıksız olduğunu öğreneceksin.\n\n10. **Çok amaçlı karar ve Pareto**\n    Bu sayfada maliyet ile güvenilirlik gibi çelişen amaçların nasıl dengelendiğini ve Pareto cephesinin ne olduğunu öğreneceksin.\n\n11. **Güç sistemindeki standart formülasyonlar**\n    Bu sayfada ekonomik dağıtım, DC-OPF, AC-OPF ve ünite tahsisinin hangi optimizasyon sınıfına girdiğini öğreneceksin.\n\n12. **Ayrık kararlar: kademe, ünite, anahtar**\n    Bu sayfada trafo kademesinin neden gevşetilip yuvarlanabildiğini, ünite aç-kapa kararının ise neden yuvarlanamadığını öğreneceksin.\n\n13. **Büyük problem: ayrıştırma, Benders, senaryo**\n    Bu sayfada ulusal ölçekli problemi parçalara bölerek çözmeyi, Benders ayrıştırmasını ve senaryo tabanlı yaklaşımı öğreneceksin.\n\n14. **Çözücüler ve modelleme dilleri**\n    Bu sayfada modeli tarif eden araçlarla (Pyomo, CVXPY gibi) modeli çözen araçların (Gurobi, HiGHS, Ipopt gibi) farkını öğreneceksin.\n\n15. **Sonucun teşhisi: infeasible, unbounded, zayıf gevşeme**\n    Bu sayfada çözücü \"uygun çözüm yok\" (infeasible), \"sınırsız\" (unbounded) dediğinde veya gevşeme zayıf kaldığında ne yapacağını öğreneceksin.\n"}, {"id": "13-Optimizasyon/01-Siniflar-KKT-Sebeke.md", "group": "13  Optimizasyon", "title": "Optimizasyon", "body": "# Optimizasyon\n\n## İlan ne istiyor\n\nİlan, optimizasyon tekniklerini programlama dilleriyle aynı maddede ister. Yani optimizasyonu kâğıt üstünde değil, kod yazarak uygulayabilmen beklenir.\n\nBeklenen seviye üç adımdır:\n\n1. Problemi doğru sınıfa koy.\n2. Çöz.\n3. Sonucu fizikle kontrol et.\n\nÇözücü markası ezberi yetmez. \"Gurobi kullanırım\" demek, problemin neden o çözücüye uygun olduğunu açıklamanın yerini tutmaz.\n\n> **Sade anlatım:** Optimizasyon, kurallara uyarak en ucuz (veya en iyi) seçimi bulmaktır. Mülakatta önce \"bu ne tür bir problem\" sorusunu cevaplaman, sonra çözümün gerçek şebekede çalışıp çalışmadığını kontrol etmen beklenir.\n\n## Sınıflar\n\nOptimizasyon problemleri, amaç fonksiyonunun ve kısıtların biçimine göre sınıflara ayrılır. Sınıf, hangi çözücüyü kullanacağını ve sonuca ne kadar güvenebileceğini belirler.\n\nÖnce kısaltmalar:\n\n| Kısaltma | Açılımı | Türkçesi |\n| --- | --- | --- |\n| LP | Linear Programming | Doğrusal programlama |\n| QP | Quadratic Programming | Karesel programlama |\n| MILP | Mixed-Integer Linear Programming | Karışık tamsayılı doğrusal programlama |\n| NLP | Nonlinear Programming | Doğrusal olmayan programlama |\n| MINLP | Mixed-Integer Nonlinear Programming | Karışık tamsayılı doğrusal olmayan programlama |\n| SDP | Semidefinite Programming | Yarı kesin programlama |\n| SOCP | Second-Order Cone Programming | İkinci dereceden konik programlama |\n| DC-OPF | Direct Current Optimal Power Flow | Doğru akım yaklaşımlı optimal güç akışı |\n| AC-OPF | Alternating Current Optimal Power Flow | Alternatif akımlı (tam fizikli) optimal güç akışı |\n\nŞimdi sınıflar ve güç sistemindeki karşılıkları:\n\n| Sınıf | Ne zaman | Güç sistemi örneği |\n| --- | --- | --- |\n| LP | Amaç ve kısıt lineer | DC-OPF, ekonomik dağıtımın parçalı lineer hali |\n| QP | Karesel amaç, lineer kısıt | Kayıplı ekonomik dağıtım |\n| MILP | LP + ikili/tamsayı | Ünite tahsisi, hat anahtarlama, kademe |\n| NLP | Sürekli, lineer olmayan | AC-OPF |\n| MINLP | NLP + tamsayı | Kademeli AC-OPF. Zordur, çoğu zaman gevşetilir |\n| SDP / SOCP | Dışbükey gevşeme | AC-OPF araştırması. İşletme motorunda hâlâ nadir |\n\nTablodaki birkaç terimi açalım:\n\n- **İkili değişken:** Yalnızca 0 veya 1 alabilen değişkendir. Örneğin bir santralin kapalı (0) veya açık (1) olması.\n- **Ünite tahsisi:** Hangi santralin hangi saatte devrede olacağına karar vermektir.\n- **Kademe:** Trafonun gerilim oranını adım adım değiştiren ayar noktasıdır.\n- **Gevşetmek:** Zor bir kısıtı daha kolay bir kısıtla değiştirip problemi çözülebilir hale getirmektir.\n\n### Dışbükeylik\n\nDışbükey (konveks) problemde yerel minimum, küresel minimumdur. Yani çözücünün bulduğu \"dip\" noktası, bütün problemin en dip noktasıdır.\n\nAC-OPF dışbükey değildir. Bu yüzden \"Çözücü bir sayı verdi, optimumdur\" denmez.\n\nAC-OPF sonucuna güvenmek için üç kontrol gerekir:\n\n| Kontrol | Ne işe yarar |\n| --- | --- |\n| Farklı başlangıç | Çözücü farklı noktalardan başlayınca aynı sonuca varıyor mu, bakılır |\n| DC gevşeme alt sınırı | Bulunan maliyetin, olabilecek en iyi maliyete ne kadar yakın olduğu görülür |\n| AC yük akışı kontrolü | Sonucun gerçek fizikle (gerilim, reaktif güç) tutarlı olup olmadığı denetlenir |\n\n> **Sade anlatım:** Dışbükey problem tek çukurlu bir kâse gibidir; topu nereden bırakırsan bırak aynı dibe yuvarlanır. AC-OPF ise çok çukurlu bir arazidir; top bir çukura düşer ama en derin çukur o olmayabilir.\n\n## KKT\n\nKKT, Karush-Kuhn-Tucker koşullarının kısaltmasıdır. Bir noktanın en iyi nokta olabilmesi için sağlaması gereken matematiksel koşullardır.\n\n### Eşitlik kısıtı\n\nProblem şudur: `min f(x), g(x)=0`. Yani `g(x)=0` kuralına uyarak `f(x)`'i en küçük yap.\n\nKoşullar aşağıdaki iki satırdır. İlk satır, en iyi noktada amacın eğimi ile kısıtın eğiminin λ ile dengelendiğini söyler. İkinci satır, kısıtın sağlandığını söyler.\n\n```\n∇f + λ ∇g = 0\ng(x) = 0\n```\n\nBurada:\n\n- `∇f`: amaç fonksiyonunun gradyanı (eğim vektörü).\n- `∇g`: kısıtın gradyanı.\n- `λ` (lambda): Lagrange çarpanı.\n\nλ gölge fiyattır. Güç dengesinin λ'sı, o barada bir MW'nin (megavat) fiyatıdır.\n\nDüğüm bazlı fiyatlama, yani LMP (Locational Marginal Price, bölgesel/düğüm marjinal fiyatı), bu çarpandan gelir. LMP'nin üç bileşeni vardır:\n\n| Bileşen | Anlamı |\n| --- | --- |\n| Enerji | Sistemin genelindeki marjinal üretim maliyeti |\n| Kayıp | O baraya güç taşırken hatlarda kaybolan enerjinin bedeli |\n| Kısıt | Dolu hatlar yüzünden oluşan sıkışıklık bedeli |\n\n### Eşitsizlik kısıtı\n\nEşitsizlik `h(x) ≤ 0` için çarpan μ (mü) kullanılır ve μ ≥ 0 olmalıdır.\n\nEk olarak tamamlayıcı gevşeklik koşulu vardır: `μ h = 0`. Bu çarpım sıfır olduğu için iki durumdan biri doğrudur:\n\n| Durum | μ'nün değeri | Anlamı |\n| --- | --- | --- |\n| Kısıt boştaysa (h \u003c 0) | μ sıfırdır | Limit zorlamıyor, gevşetmenin değeri yok |\n| Kısıt aktifse (h = 0) | μ, o limiti bir birim gevşetmenin değeridir | Limit zorluyor, gevşetmek maliyeti düşürür |\n\nHat limiti bağlayıcıysa o hattın μ'su sıkışıklık maliyetidir.\n\n> **Sade anlatım:** μ, \"bu sınırı biraz açsam ne kazanırım\" sorusunun cevabıdır. Sınır zaten rahatsa cevap sıfırdır. Hat dolmuşsa cevap, o hattın bir MW fazla taşımasının sana kazandıracağı paradır.\n\n### Mülakatta nasıl kullanılır\n\nMülakatta türev ispatı istenirse yukarıdaki iki satırı yaz. Sayfa dolusu teori isteme.\n\nHemen güç sistemine dön ve şunu söyle:\n\n> **Mülakatta şöyle söyle:** \"Hat limitinin gölge fiyatı yeniden dağıtım maliyetidir.\"\n\n## Nasıl çözülür\n\nHer problem sınıfının kendine uygun çözüm yöntemi vardır.\n\n### LP ve MILP\n\nYöntemler:\n\n- **Simpleks:** Uygun bölgenin köşeleri arasında dolaşarak en iyi köşeyi bulur.\n- **İç nokta:** Uygun bölgenin içinden geçerek en iyiye yaklaşır.\n- **Dal-kesme (branch-and-cut):** MILP'de kullanılır. Tamsayı değişkenleri dallara ayırır ve kesme düzlemleriyle arama alanını daraltır.\n\nModeller için çözücüler: CBC, HiGHS, Gurobi, CPLEX.\n\n| Çözücü | Tür | Not |\n| --- | --- | --- |\n| CBC (COIN-OR Branch and Cut) | Açık kaynak | İş görür |\n| HiGHS | Açık kaynak | İş görür |\n| Gurobi | Ticari | Büyük ünite tahsisinde belirgin hızlanır |\n| CPLEX | Ticari | Büyük ünite tahsisinde belirgin hızlanır |\n\nAçık kaynakta HiGHS ve CBC iş görür. Büyük ünite tahsisinde ticari çözücü belirgin hızlanır.\n\nLisans yoksa dürüst bir cevap şudur:\n\n> **Mülakatta şöyle söyle:** \"HiGHS ile kurarım, ölçek büyürse ticari çözücüye aynı modeli veririm.\"\n\nModel, çözücüden bağımsız yazılırsa bu geçiş kolaydır. Pyomo ve OR-Tools (Google'ın optimizasyon araçları kütüphanesi) bunu sağlar.\n\n### NLP\n\nYöntemler: ardışık karesel programlama veya iç nokta. İç nokta için standart çözücü IPOPT'tur (Interior Point OPTimizer, iç nokta eniyileyicisi).\n\nAC-OPF için başlangıç olarak yük akışı çözümü verilir. Böylece çözücü fiziksel olarak anlamlı bir noktadan aramaya başlar.\n\n### Sezgiseller\n\nTürev yoksa son çare sezgiseldir. Genetik algoritma ve parçacık sürüsü, kısıtı ceza fonksiyonuyla tutturmaya çalışır. Yani kısıt ihlal edilirse amaca büyük bir ceza eklenir.\n\n| Kullanılır | Kullanılmaz |\n| --- | --- |\n| Küçük yerleştirme (kapasitör, DG yeri). DG: Distributed Generation, dağıtık üretim | Ulusal iletim OPF'i |\n\nUlusal iletim OPF'inde neden kullanılmaz:\n\n- Tekrar üretilemez; her çalıştırmada farklı sonuç çıkabilir.\n- Kısıt ihlalini gizleyebilir.\n\n### Ayrık kademe\n\nTrafo kademesi gibi ayrık ama sıralı adımlar için yöntem:\n\n1. Sürekli gevşet (kademeyi her değeri alabilen bir sayı gibi düşün).\n2. Çöz.\n3. En yakın adıma yuvarla.\n4. AC ile kontrol et.\n\nYuvarlama ihlal doğurursa o kademeyi sabitleyip tekrar çöz.\n\nÜnite ikilisi ise yuvarlanmaz. 0,6 açık diye bir santral yoktur. İkili, MILP'de kalır.\n\n> **Sade anlatım:** Kademe 3,4 çıkarsa 3'e yuvarlamak küçük bir hata yaratır. Santral 0,6 çıkarsa ne 0 ne 1'e yuvarlamak doğru olur; çünkü açmak minimum üretim ve yakıt maliyeti getirir. Bu yüzden santral kararı en baştan tamsayı olarak çözülür.\n\n## Büyük problem\n\nUlusal modelde N-1 kısıtlarının hepsini baştan koymak bellek ve zaman yer. N-1, \"herhangi bir tek eleman (hat, trafo, ünite) arızalansa da sistem güvenli kalmalı\" kuralıdır.\n\nBunun yerine şu döngü kullanılır:\n\n1. Baz OPF çöz.\n2. N-1 tara, ihlalleri topla.\n3. İhlalleri kısıt diye ekle.\n4. Tekrar çöz. Yeni ihlal yoksa dur.\n\nÇoğu arıza zaten sorun çıkarmadığı için, yalnızca gerçekten ihlal yaratanları eklemek problemi küçük tutar.\n\n### Benders ayrıştırması\n\nBenders ayrıştırması aynı fikrin resmidir. Problem iki kata ayrılır:\n\n| Katman | İçerik |\n| --- | --- |\n| Ana problem | Yatırım veya ünite kararları |\n| Alt problem | Her senaryo veya her arızanın fizibilitesi (uygulanabilirliği) |\n\nAlt problemden gelen kesit (cut) ana probleme \"bu karar şu arızada olmuyor\" der. Ana problem bu bilgiyi yeni kısıt olarak ekler ve tekrar karar verir.\n\nPlanlama ufku ve senaryo sayısı artınca ayrıştırma, tek parça NLP'den daha anlatılabilir olur.\n\n### Çok amaç\n\nTipik iki amaç: maliyet ve EENS (Expected Energy Not Supplied, beklenen karşılanamayan enerji). Biri ucuzluğu, diğeri güvenilirliği ölçer.\n\n- **Ağırlıklı toplam:** İki amacı ağırlıklarla toplayıp tek amaç yapar. Ağırlık politiktir; teknik değil, karar vericinin tercihidir.\n- **Pareto cephesi:** Birini bozmadan diğerinin iyileşemediği noktalardır.\n\nKarar vericiye iki üç nokta göstermek, tek \"optimum\" göstermekten daha dürüsttür.\n\n## Teşhis\n\nÇözücü beklenmedik bir sonuç verdiğinde ne yapacağını bilmek, mülakatta deneyim göstergesidir.\n\n- **Infeasible (uygun çözüm yok):** Kısıtlar çelişiyor. Hangi kısıtın çeliştiğini izolasyonla bul (yedek yetmiyor, hat limiti ile üretimin yeri uyumsuz). Ceza ile yumuşatılmış kısıt, hangi limitin pahalıya kırıldığını gösterir.\n- **Unbounded (sınırsız):** Maliyeti düşüren açık bir yön var. Eksik Pmax (en büyük üretim sınırı) veya işaret hatası.\n- **Zayıf gevşeme:** MILP alt sınırı ile bulunan tam sayı çözüm çok ayrıksa, ya süre yetmemiştir ya formülasyon gevşektir.\n- **Fizik tutmuyor:** DC optimumunu AC yük akışına ver, gerilim ve Q (reaktif güç) limitine bak.\n\nİşaret ve birim, optimizasyonda da yük akışındaki kadar çok hata üretir. MW ile pu'yu (per unit, birim değer) aynı kısıtta toplamak sessizce yanlış plan üretir.\n\n> **Sade anlatım:** Çözücü hata vermez, yanlış modeli de mutlu mutlu çözer. Birim karışıklığı uyarı üretmez; sadece yanlış bir plan çıkar.\n\n### Konuşmanın özeti için hatırlatma\n\nAşağıdaki 90 saniyelik konuşma bu sayfanın bütün ana fikirlerini sırayla toplar: sınıflandırma, λ ve μ'nün anlamı, AC kontrolü, N-1 döngüsü, kademe ile ünite farkı ve çözücüden bağımsız model.\n\n## 90 saniye\n\n“Problemi önce sınıfa koyarım: paylaşım LP veya QP, ünite tahsisi MILP, AC limit NLP. λ güç dengesinin gölge fiyatıdır, hat limitinin çarpanı sıkışıklıktır. AC-OPF’in yerel çözümünü yük akışıyla kontrol ederim. N-1’i baştan değil, ihlal oldukça eklerim. Kademeyi gevşetip yuvarlarım, üniteyi yuvarlamam. Modeli çözücüden bağımsız kurarım.”\n"}, {"id": "13-Optimizasyon/02-DCOPF-LMP-Gevsetme-Stokastik-Araclar.md", "group": "13  Optimizasyon", "title": "DC-OPF, LMP ve Gevşetmeler", "body": "# DC-OPF, LMP ve Gevşetmeler\n\nBu sayfanın konuları sırasıyla şunlardır:\n\n- DC-OPF (Direct Current Optimal Power Flow, doğru akım yaklaşımlı optimal güç akışı)\n- Gölge fiyat ve LMP (Locational Marginal Price, bölgesel marjinal fiyat)\n- Dışbükey gevşetmeler\n- Belirsizlik altında eniyileme\n- Meta-sezgiseller\n- Araçlar\n\n## Neden dışbükeylik bu kadar önemli\n\nDışbükey problemde yerel en iyi, genel en iyidir ve çözücü bunu **kanıtlar**.\n\nDışbükey olmayan problemde çözücü bir nokta bulur. Ama daha iyisinin olup olmadığını söyleyemez.\n\nAC (alternatif akım) optimal güç akışı dışbükey değildir. Sebebi şudur: güç denklemleri gerilimlerin çarpımını ve açıların sinüsünü içerir. Çarpım ve sinüs, kâse biçimli değil, dalgalı bir uygun bölge üretir.\n\nBu yüzden üç yol vardır:\n\n| Yol | Ne yapar | Bedeli |\n| --- | --- | --- |\n| Yerel çözücü (iç nokta) | AC-OPF'yi olduğu gibi çözer | Genel en iyi garantisi yok; başlangıca duyarlı |\n| Doğrusallaştırma (DC-OPF) | Fiziği basitleştirir | Gerilim ve reaktif yok; sonuç AC'de uygulanamayabilir |\n| Dışbükey gevşetme (SOCP, SDP) | Uygun bölgeyi dışbükey bir kümeyle sarar | Çözüm fiziksel olmayabilir; ama alt sınır verir |\n\nTablodaki kısaltmalar: SOCP (Second-Order Cone Programming, ikinci dereceden konik programlama) ve SDP (Semidefinite Programming, yarı kesin programlama).\n\n> **Sade anlatım:** Ya gerçek fiziği çözüp \"en iyi bu mu\" sorusunu cevapsız bırakırsın, ya fiziği basitleştirip hızlı ama yaklaşık bir sonuç alırsın, ya da problemi geniş bir kılıfla sarıp \"en iyi bundan daha iyi olamaz\" diyen bir alt sınır elde edersin.\n\n## DC-OPF: doğrusal program biçimi\n\nDC-OPF, AC güç akışının basitleştirilmiş halidir. Varsayımları:\n\n- Gerilimler 1,0 pu'dur (per unit, birim değer).\n- Açı farkları küçüktür.\n- Direnç ve reaktif güç ihmal edilir.\n\nModelde PTDF (Power Transfer Distribution Factor, güç aktarım dağılım katsayısı) kullanılır. PTDF_l,k, bara k'ya 1 MW (megavat) enjekte edilince hat l'nin akışının ne kadar değiştiğini söyler.\n\nAşağıdaki blok modelin tamamıdır. İlk satır üretim maliyetini en aza indirir. İkinci satır üretimin yüke eşit olmasını ister; çarpanı λ'dır. Üçüncü satır her hattın akışını sınırında tutar; çarpanı μ_l'dir. So
