a doğrularım. Avrupa ile model CGMES profilidir. Elle senaryo yerine betik, betiğin ürün hali servistir.”\n"}, {"id": "15-Analiz-Yazilimlari/02-Acik-Kaynak-Araclar-ve-Durust-Strateji.md", "group": "15  Analiz yazılımları", "title": "Açık kaynak araçlar ve dürüst strateji", "body": "# Açık kaynak araçlar ve dürüst strateji\n\nBu sayfanın tam başlığı: Açık kaynak araçlar ve \"ticari yazılım kullanmadım\" demenin doğru yolu.\n\nİlandaki madde: \"Güç sistemleri analiz yazılımları ile çalışma yapmış olmak.\"\n\nBüyük ihtimalle PowerFactory, PSS/E gibi ticari paketleri kullanmadın. PSS/E, Siemens'in Power System Simulator for Engineering paketidir.\n\nBu sayfanın iki işi var:\n\n1. Açık kaynak araçları tanıtmak.\n2. Bu eksiği mülakatta dürüstçe, puan kaybını en aza indirerek söylemeni sağlamak.\n\n## Beş açık kaynak araç: hangisi ne için\n\nTablodan önce birkaç kısaltma:\n\n- **OPF:** Optimal Power Flow (optimal güç akışı). Maliyet gibi bir hedefi en iyileyen yük akışıdır.\n- **IEC 60909:** IEC (International Electrotechnical Commission, Uluslararası Elektroteknik Komisyonu) kısa devre akımı hesap standardıdır.\n- **Durum kestirimi:** Hatalı ve eksik ölçümlerden şebekenin en olası durumunu hesaplamaktır.\n- **pandas:** Python'un tablo işleme kütüphanesidir.\n- **`mpc`:** MATPOWER case, yani MATPOWER'ın vaka yapısıdır.\n- **Octave:** MATLAB'ın ücretsiz, büyük ölçüde uyumlu karşılığıdır.\n\n| Araç | Dil | Güçlü olduğu yer | Zayıf olduğu yer |\n| --- | --- | --- | --- |\n| **pandapower** | Python | Dengeli yük akışı, IEC 60909 kısa devre, OPF, durum kestirimi; tablo (pandas) tabanlı veri modeli; hazır eleman kütüphanesi | Dinamik benzetim yok; dengesiz analiz sınırlı |\n| **MATPOWER** | MATLAB / Octave | Yük akışı ve OPF için akademik referans; IEEE test vakaları; `mpc` vaka biçimi fiilî standart | Yalnız sürekli hal; MATLAB bağımlılığı |\n| **OpenDSS** | Kendi betik dili; Python arayüzleri | **Dağıtım**: dengesiz çok fazlı yük akışı, zaman serisi (yıllık 8760 saat), dağıtık üretim, harmonik | İletim için tasarlanmadı; veri modeli betik tabanlı |\n| **PyPSA** | Python | **Planlama ve enerji sistemi**: çok dönemli doğrusal OPF, yatırım eniyilemesi, depolama, sektör birleştirme | Ayrıntılı şebeke analizi (kısa devre, koruma) yok |\n| **GridLAB-D** | Kendi model dili | Dağıtım + **son kullanıcı**: ev, cihaz, termostat düzeyinde ajan tabanlı zaman benzetimi; talep tepkisi | Öğrenmesi zor; iletim yok |\n\nTablodaki bazı terimler:\n\n- **IEEE test vakaları:** IEEE (Institute of Electrical and Electronics Engineers) tarafından yayımlanan, herkesin kullandığı örnek şebekelerdir.\n- **8760 saat:** Bir yıldaki saat sayısıdır (365 × 24).\n- **Sektör birleştirme:** Elektrik, ısı ve ulaşım gibi enerji sektörlerinin aynı modelde birlikte ele alınmasıdır.\n- **Ajan tabanlı:** Her ev veya cihaz kendi kuralıyla davranan ayrı bir nesne olarak benzetilir.\n- **Talep tepkisi:** Tüketicinin fiyata veya sinyale göre tüketimini kaydırmasıdır.\n\nSeçim kuralı, tek cümleyle:\n\n| İhtiyaç | Araç |\n| --- | --- |\n| İletimde yük akışı, kısa devre, hızlı prototip | **pandapower** |\n| Bir OPF yöntemini literatürle kıyaslamak | **MATPOWER** (Julia'da PowerModels.jl) |\n| Dağıtım fideri, çatı güneşi, barındırma kapasitesi, dengesizlik | **OpenDSS** |\n| On yıllık yatırım planı, yenilenebilir ve depolama senaryosu | **PyPSA** |\n| Akıllı sayaç, talep tepkisi, cihaz düzeyinde davranış | **GridLAB-D** |\n\nBarındırma kapasitesi, bir dağıtım fiderinin sınır aşmadan kabul edebileceği en fazla dağıtık üretim miktarıdır.\n\n### Dinamik benzetim için açık kaynak\n\nDinamik benzetim (geçici hal kararlılığı) için açık kaynak seçenekler daha azdır:\n\n| Araç | Dil veya kaynak |\n| --- | --- |\n| ANDES | Python |\n| PowerSimulations ve PowerSimulationsDynamics | Julia |\n| Dynawo | RTE |\n\nRTE, Réseau de Transport d'Électricité, yani Fransa'nın iletim sistemi işletmecisidir.\n\nSorulursa adlarını bilmen yeter.\n\n## Ticari paketler: ne olduklarını bil\n\n| Paket | Üretici | Tipik kullanım |\n| --- | --- | --- |\n| PowerFactory | DIgSILENT | Avrupa ve Türkiye'de yaygın; iletim, dağıtım, dinamik, koruma tek pakette |\n| PSS/E | Siemens | İletim planlaması ve dinamik; Kuzey Amerika'da standart |\n| ETAP | ETAP | Endüstriyel tesis, koruma koordinasyonu, ark parlaması |\n| PSCAD, EMTP | Manitoba Hydro, EMTP Alliance | Elektromanyetik geçici hal; evirici, HVDC, yıldırım |\n| NEPLAN, CYME, Synergi | — | Dağıtım planlaması |\n| PLEXOS | Energy Exemplar | Piyasa ve üretim planlama benzetimi |\n\nTablodaki terimler:\n\n- **EMTP:** Electromagnetic Transients Program (elektromanyetik geçici hal programı).\n- **HVDC:** High Voltage Direct Current (yüksek gerilim doğru akım) iletimidir.\n- **Ark parlaması:** Kısa devrede havada oluşan arkın açığa çıkardığı tehlikeli ısı ve ışık enerjisidir.\n\n### Fark algoritmada değil\n\nTicari paketlerin açık kaynaktan farkı algoritma değildir; algoritmalar aynı ders kitaplarındandır.\n\nFark şu beş şeydedir:\n\n1. Doğrulanmış eleman modelleri (röle, evirici, uyartım sistemi kütüphaneleri).\n2. Büyük model yönetimi.\n3. Grafik arayüz.\n4. Şebeke işletmecilerinin veri biçimleriyle uyum.\n5. Üreticinin sorumluluğu.\n\nTEİAŞ'ın (Türkiye Elektrik İletim A.Ş.) ve MAM'ın (TÜBİTAK Marmara Araştırma Merkezi) hangi paketleri kullandığını **doğrulamadım**. Mülakatta varsayma; sor.\n\n## Dürüst strateji\n\n### Söylenmeyecekler\n\n| Söylenmeyecek cümle | Neden |\n| --- | --- |\n| \"PowerFactory'ye biraz baktım.\" | Takip sorusu: \"Hangi modülüne? Kısa devre yöntemini nereden seçiyorsun?\" Cevap veremezsin. |\n| \"Aynı şey zaten, hızlı öğrenirim.\" | Küçümseyici ve kanıtsız. |\n| \"Üniversitede görmüştük.\" | Hatırlamıyorsan söyleme. |\n| Sessizce geçiştirmek. | İlanda madde olarak yazıyor; sorulacak. |\n\n### Söylenecek olan: üç parçalı cevap\n\n1. **Açık gerçek.** \"PowerFactory ve PSS/E kullanmadım.\"\n2. **Eşdeğer iş akışı.** \"Ama bu araçların yaptığı işi adım adım biliyorum, çünkü aynısını kodla yaptım.\"\n3. **Öğrenme planı ve soru.** \"İlk haftada şunu yaparım. Siz hangisini kullanıyorsunuz?\"\n\n> **Sade anlatım:** Önce eksiğini açıkça kabul edersin. Sonra o aracın yaptığı işi başka yoldan yaptığını gösterirsin. En sonda nasıl öğreneceğini söyler ve karşı tarafa soru sorarsın.\n\n### Eşdeğer iş akışı: bunu anlatabilmelisin\n\nHer analiz paketi aynı altı adımı izler. Sen bu adımları açık kaynakla ve kendi kodunla yaptın.\n\nTablodaki kısaltmalar:\n\n- **CIM:** Common Information Model (ortak bilgi modeli), şebeke modeli değişim standardı.\n- **PSS-E dosyası:** PSS/E'nin ham veri dosyası.\n- **DPL:** DIgSILENT Programming Language, PowerFactory'nin kendi betik dili.\n- **IDEV:** PSS/E'de komutları sırayla koşturan toplu komut dosyası.\n- **Newton-Raphson:** Doğrusal olmayan yük akışı denklemlerini adım adım çözen yöntem.\n\n| Adım | Ticari pakette | Senin yaptığın / yapacağın |\n| --- | --- | --- |\n| 1. Model kur | Tek hat şeması çiz, eleman verisi gir veya CIM/PSS-E dosyası içe aktar | Bara, hat, trafo, yük, üreteç tablolarını kodla kur (`nr_yuk_akisi.py`: `Hat` veri sınıfı) |\n| 2. Veriyi doğrula | Topoloji denetimi, ada raporu, birim ve baz uyarıları | Bağlı bileşen denetimi, satır toplamı denetimi, sıfır empedans reddi (testte var) |\n| 3. Baz durumu çöz | Yük akışı; yakınsama raporu | Newton-Raphson; artık geçmişi (`Sonuc.artiklar`) |\n| 4. Senaryo koş | Çalışma vakaları, değişkenler, betikle toplu koşu (DPL, Python API, IDEV) | Döngü içinde parametre değiştir, sonuçları tabloya topla |\n| 5. Sınırları denetle | Gerilim ve yüklenme raporu, renkli şema | İhlal tablosu: eleman, değer, sınır, yüzde |\n| 6. Raporla ve yinele | Rapor şablonu, sürüm | Kod + veri + sonuç birlikte sürümlü; test ile sabitlenmiş |\n\nAPI, Application Programming Interface (uygulama programlama arayüzü) demektir. Ada raporu, şebekenin birbirinden kopuk parçalara (adalara) bölünüp bölünmediğini gösterir.\n\nSöyleyeceğin cümle:\n\n> \"PowerFactory ve PSS/E kullanmadım; bunu açıkça söyleyeyim. Yaptığım şey şu: yük akışını Newton-Raphson ile sıfırdan yazdım, kapalı çözümü olan bir örnekle ve güç dengesiyle doğruladım, reaktif sınırda bara tipinin değişmesini ve yakınsamayan vakayı test ettim. Yani bu araçların yük akışı düğmesinin arkasında ne olduğunu biliyorum; bilmediğim şey arayüzleri, veri biçimleri ve eleman kütüphaneleri. Onları öğrenme yolum belli: küçük bir vakayı araçta kurar, kendi kodumla aynı sonucu verdiğini görür, sonra gerçek modele geçerim. Grubunuzda hangi paket kullanılıyor?\"\n\nBu cevap maddeyi \"var\" yapmaz. Ama üç şeyi kanıtlar:\n\n1. Dürüstlük.\n2. Yöntemi anlama.\n3. Öğrenme biçimi.\n\nİkisi (araştırma ve öğrenme motivasyonu) ilanın ayrı maddeleridir.\n\n### Bu cevabı daha güçlü yapmak için: bir akşamlık iş\n\nŞu an \"pandapower kullandım\" diyemezsin; bu makinede kurulu değil ve denemedin. Mülakattan önce şunu yap, sonra **gerçekten** söyleyebilirsin. Her adımın amacı yanında yazıyor:\n\n1. `pip install pandapower` (Python 3.14 ile kurulmazsa 3.12'lik bir sanal ortam aç).\n   Amacı: aracı kendi makinende çalışır hale getirmek.\n2. `nr_yuk_akisi.py`'deki üç baralı şebekeyi pandapower'da kur: `create_empty_network`, `create_bus`, `create_line_from_parameters`, `create_ext_grid`, `create_gen`, `create_load`, sonra `runpp`.\n   Amacı: sonucunu bildiğin bir şebekeyi yeni araçta yeniden kurmak. `runpp`, pandapower'ın yük akışını koşturan işlevidir.\n3. `net.res_bus` içindeki gerilimleri kendi sonucunla karşılaştır: beklenen `V_3 ≈ 0,9515 pu`.\n   Amacı: iki çözücünün aynı sayıyı verdiğini görmek. pu, per-unit (birim değer) demektir.\n4. Tutmazsa nedenini bul. Büyük ihtimalle birim çevirmesidir: pandapower hattı ohm/km ve kV ile, yükü MW ile ister; senin kodun per-unit. Bu ayıklama, mülakatta anlatacağın en iyi hikâyedir.\n   Amacı: araçlar arası farkın kaynağını bulmayı kendi elinle yaşamak.\n5. `runpp` yerine `pandapower.shortcircuit.calc_sc` ile kısa devreyi de dene.\n   Amacı: yük akışının yanında kısa devre hesabını da araçta görmüş olmak.\n\nBu sayfaya pandapower kodu koymadım, çünkü çalıştırıp doğrulayamadım. İşlev adları pandapower belgelerindendir; kurduğunda güncel belgeden imzalarını kontrol et.\n\nYaptıktan sonra cümlen şuna döner:\n\n> \"Ticari paket kullanmadım. pandapower ile üç baralı bir vakayı kurup kendi yazdığım çözücüyle karşılaştırdım; ilk denemede tutmadı, nedeni baz çevirmesiydi.\"\n\n## Ortak veri biçimleri\n\nAraçlar arası geçiş, yazılım işinin büyük kısmıdır.\n\n| Biçim | Ne |\n| --- | --- |\n| CIM / CGMES (IEC 61970, 61968) | Şebeke işletmecileri arası standart model değişimi; XML/RDF (`16/02`) |\n| PSS/E RAW ve DYR | Fiilî endüstri standardı metin biçimi: sürekli hal ve dinamik veri |\n| MATPOWER `mpc` | Akademik vaka biçimi |\n| IEEE Common Data Format | Eski test vakaları |\n| OpenDSS `.dss` | Dağıtım modelleri |\n\nTablodaki kısaltmalar:\n\n- **CGMES:** Common Grid Model Exchange Standard (ortak şebeke modeli değişim standardı), CIM'in Avrupa profilidir.\n- **XML/RDF:** XML (Extensible Markup Language, genişletilebilir işaretleme dili) ve RDF (Resource Description Framework, kaynak tanımlama çerçevesi). CIM dosyaları bu biçimde yazılır.\n- **RAW ve DYR:** RAW sürekli hal (yük akışı) verisini, DYR dinamik model verisini taşır.\n\n### Dönüştürmede sorun çıkan yerler\n\n| Sorun yeri | Açıklama |\n| --- | --- |\n| Per-unit bazları | Baz güç veya baz gerilim araçtan araca farklı olabilir. |\n| Trafo kademe tarafı ve oranı | Kademe hangi sargıya yazılmış, oran nasıl tanımlanmış. |\n| Hat şöntünün iki uca paylaşımı | Şönt suseptans toplam mı, her uca yarısı mı. |\n| Üç sargılı trafonun yıldız eşdeğeri | Üç sargılı trafo, ortada sanal bir baralı üç kola çevrilir; araçlar bunu farklı yapabilir. |\n| Anahtar ve bara ayrıntısı | Bara-kesici modeli ile bara-dal modeli. |\n\nBara-kesici modeli her kesiciyi ve ayırıcıyı ayrı gösterir. Bara-dal modeli bunları toplayıp yalnız elektriksel baraları ve dalları bırakır.\n\n## Yaygın yanlış\n\n| Yanlış inanç | Doğrusu |\n| --- | --- |\n| **\"Açık kaynak araç oyuncaktır.\"** | pandapower ve OpenDSS sektörde ve şebeke işletmecilerinde kullanılır. Eksikleri dinamik modeller ve doğrulanmış kütüphanelerdir. |\n| **\"Ticari paket doğru sonuç verir.\"** | Girdiği veri kadar doğru sonuç verir. İki paket aynı modelde farklı sonuç verebilir: varsayılan ayarlar, kademe ve yük modeli farkı. |\n| **\"Aracı bilmek analizi bilmektir.\"** | Düğmeye basmak ile sonucun neden öyle çıktığını söylemek ayrı şeylerdir. Panel ikincisini ölçer. |\n| **\"Kullanmadığımı söylersem elenirim.\"** | Kullandığını söyleyip takip sorusunda takılırsan elenirsin. |\n| **\"OpenDSS ile iletim, pandapower ile dengesiz dağıtım yaparım.\"** | Aracın tasarım amacının dışına çıkmak mümkündür ama verimsizdir. |\n\n## Panel takip sorusu\n\n### Soru 1\n\n\"İki araç aynı vakada farklı sonuç verdi. Ne yaparsın?\"\n\nCevap: en küçük farkı üreten vakaya inerim. Sırayla bakarım:\n\n1. Baz güç ve gerilim\n2. Trafo kademe konumu ve tarafı\n3. Hat şöntü\n4. Yük modeli (sabit güç mü)\n5. Üreteç reaktif sınırları\n6. Salınım barası\n7. Yakınsama toleransı\n\nTek bir hat ve tek bir yükle başlayıp eleman ekleyerek farkın nerede doğduğunu bulurum.\n\n> **Mülakatta şöyle söyle:** \"En küçük farkı üreten vakaya inerim. Baz güç ve gerilim, trafo kademe konumu ve tarafı, hat şöntü, yük modeli, üreteç reaktif sınırları, salınım barası ve yakınsama toleransına sırayla bakarım. Tek bir hat ve tek bir yükle başlayıp eleman ekleyerek farkın nerede doğduğunu bulurum.\"\n\n### Soru 2\n\n\"Kendi çözücünü yazmak yerine neden hazır aracı kullanmadın?\"\n\nCevap: öğrenmek için yazdım. Üretimde hazır ve doğrulanmış çözücüyü kullanırım; kendi kodum onu anlamak ve sonucunu sınamak içindir.\n\nAşağıdaki konuşma bu sayfanın tamamını kapsar: dürüst kabul, beş açık kaynak aracın işi, altı adımlı ortak iş akışı ve öğrenme yöntemi.\n\n## 90 saniye\n\n\"Ticari analiz paketlerini kullanmadım; bunu açık söylüyorum. Açık kaynak tarafını tanıyorum: pandapower iletimde yük akışı ve kısa devre için, OpenDSS dengesiz dağıtım ve zaman serisi için, PyPSA yatırım planlaması için, MATPOWER optimal güç akışında akademik referans olarak, GridLAB-D son kullanıcı davranışı için kullanılır. Bütün paketler aynı iş akışını izler: model kur, veriyi doğrula, baz durumu çöz, senaryo koş, sınırları denetle, raporla. Bu akışı kendi yazdığım yük akışı koduyla ve testleriyle uyguladım. Yeni bir aracı küçük bir vakayı kurup bildiğim sonuçla karşılaştırarak öğrenirim.\"\n"}, {"id": "16-Yazilim-Mimarisi/00-Alt-Basliklar.md", "group": "16  Yazılım mimarisi", "title": "16 — Yazılım mimarisi ve dijital ikiz", "body": "# 16 — Yazılım mimarisi ve dijital ikiz\n\nBu klasör, şebeke analiz hesabının bir yazılım ürününe nasıl dönüştüğünü anlatır. Ölçüm sahadan gelir, bir modele bağlanır, hesaplanır ve operatöre servis edilir. Aşağıdaki başlıklar bu yolculuğun durakları.\n\n## Klasördeki sayfalar\n\n| Sayfa | İçerik |\n| --- | --- |\n| [01 — EMS zinciri ve dijital ikiz](01-EMS-Ikiz-Servis.md) | Zincirin halkaları, servis, kuyruk, kalite bayrağı, arayüz, sürüm |\n| [02 — SCADA, protokoller, CIM, zaman serisi, dijital ikiz, siber güvenlik](02-SCADA-Protokoller-CIM-TSDB-Ikiz-Siber.md) | Verinin sahadan kontrol merkezine akışı ve bunun güvenliği |\n| [03 — Kendi projelerinden köprü](03-Kendi-Projelerinden-Kopru.md) | Kendi yazılım tecrübeni şebeke yazılımına bağlama şablonu |\n\n## Kısaltmalar\n\n- **EMS** (Energy Management System, Enerji Yönetim Sistemi): iletim şebekesinin hesaplarını yapan yazılım katmanı.\n- **SCADA** (Supervisory Control and Data Acquisition, Denetleyici Kontrol ve Veri Toplama): sahadan ölçüm toplayan ve uzaktan kumanda veren sistem.\n- **REST** (Representational State Transfer, temsili durum aktarımı) ve **SOAP** (Simple Object Access Protocol, basit nesne erişim protokolü): iki web servis tarzı.\n\n## Alt başlıklar\n\nHer maddenin altında o başlıkta ne öğreneceğin tek cümleyle yazılı.\n\n1. **EMS zinciri**\n   Bu sayfada ölçümün sahadan operatör ekranına kadar hangi hesap halkalarından geçtiğini sırasıyla öğreneceksin.\n\n2. **Çevrimdışı çalışma ile çevrimiçi çalışma**\n   Bu sayfada planlama ve eğitim modeli ile \"şu anki\" canlı model arasındaki farkı ve ikisi karışırsa ne olduğunu öğreneceksin.\n\n3. **Dijital ikizin bu zincirdeki anlamı**\n   Bu sayfada dijital ikizin üç boyutlu bir resim değil, ölçümle güncellenen ve üzerinde senaryo koşulan bir hesap modeli olduğunu öğreneceksin.\n\n4. **Topoloji işlemcisi**\n   Bu sayfada kesici durumlarından enerjili adaları ve bara modelini kuran adımı öğreneceksin.\n\n5. **Veri tabanı: zaman serisi ve şebeke modeli**\n   Bu sayfada şebeke kimliği ile ölçüm verisinin neden ayrı tutulduğunu öğreneceksin.\n\n6. **Web servis: REST ve SOAP**\n   Bu sayfada yeni ve eski sistemlerle konuşan iki servis tarzının nerede kullanıldığını öğreneceksin.\n\n7. **SCADA/EMS entegrasyonu**\n   Bu sayfada analiz yazılımının SCADA verisini nasıl aldığını ve neden kumanda etmediğini öğreneceksin.\n\n8. **İş kuyruğu ve binlerce arıza**\n   Bu sayfada ağır hesabın neden istek içinde değil, kuyrukta koşturulduğunu öğreneceksin.\n\n9. **Kalite bayrağı ve operatör güveni**\n   Bu sayfada her sonucun yanında \"bu sayıya ne kadar güvenebilirim\" bilgisinin nasıl taşındığını öğreneceksin.\n\n10. **Arayüzde ne gösterilir**\n    Bu sayfada operatörün ekranda gerçekten hangi bilgiyi görmek istediğini öğreneceksin.\n\n11. **Test, sürüm, izleme**\n    Bu sayfada model, algoritma ve limit sürümlerinin neden ayrı tutulduğunu ve servisin nasıl izlendiğini öğreneceksin.\n\n12. **Güvenlik: kimlik, kayıt, gizli veri**\n    Bu sayfada rol tabanlı erişim, denetim kaydı ve sırların korunması gibi asgari güvenlik hijyenini öğreneceksin.\n\n13. **Araştırmacının bu mimaride durduğu yer**\n    Bu sayfada bu zincirde senin katkının nerede olacağını ve bunu mülakatta nasıl anlatacağını öğreneceksin.\n"}, {"id": "16-Yazilim-Mimarisi/01-EMS-Ikiz-Servis.md", "group": "16  Yazılım mimarisi", "title": "EMS zinciri ve dijital ikiz", "body": "# EMS zinciri ve dijital ikiz\n\nBu sayfa, şebeke hesabının bir yazılım ürününe nasıl dönüştüğünü anlatır. Önce hesap halkalarının sırasını, sonra dijital ikizi, veri ve servis katmanını, arayüzü, güvenliği ve sürümü göreceksin. En sonda senin bu yapıda nerede duracağın var.\n\n## Zincir\n\nEMS (Energy Management System, enerji yönetim sistemi), iletim şebekesinin hesaplarını yapan yazılım katmanıdır. Klasik bir enerji yönetim sistemi işi şu halkalara bölüp sıraya dizer:\n\n| Sıra | Halka | Ne yapar |\n| --- | --- | --- |\n| 1 | Veri edinme | SCADA analog ve durum bilgisi, sayaç, PMU, hava, piyasa programı toplanır |\n| 2 | Veri doğrulama ve zaman hizalama | Gelen veri denetlenir ve aynı zaman anına oturtulur |\n| 3 | Topoloji işlemcisi | Kesici durumundan enerjili adaları ve bara modelini kurar |\n| 4 | Durum kestirimi ve kötü veri | Ölçümlerden şebekenin en olası durumu bulunur, hatalı ölçüm ayıklanır |\n| 5 | Baz durum yük akışı | Arızasız temel durumdaki güç akışları hesaplanır |\n| 6 | Güvenlik analizi | Arıza senaryolarında sınır ihlali olup olmadığı taranır |\n| 7 | Kararlılık ve atalet gibi seçilmiş dinamik hesaplar | Zamana bağlı davranışın seçilmiş parçaları hesaplanır |\n| 8 | Tahmin | Yük, rüzgâr, güneş tahmini |\n| 9 | Optimizasyon ve gerilim planı | En uygun üretim ve gerilim ayarları aranır |\n| 10 | Operatör arayüzü, kayıt, komşu sistemlere servis | Sonuç gösterilir, kaydedilir ve başka sistemlere verilir |\n\nTablodaki kısaltmalar:\n\n- **SCADA** (Supervisory Control and Data Acquisition, denetleyici kontrol ve veri toplama): sahadan ölçüm toplayan ve uzaktan kumanda veren sistem. \"Analog\" ölçülen sayı (akım, gerilim, güç), \"durum\" ise açık/kapalı bilgisidir (kesici konumu gibi).\n- **PMU** (Phasor Measurement Unit, fazör ölçüm birimi): gerilim ve akımın genliğini ve açısını uydu saatine bağlı zaman damgasıyla ölçen cihaz.\n\n> **Sade anlatım:** Zincir bir fabrika bandı gibidir. Her halka bir öncekinin çıktısını alır, kendi işini yapar, bir sonrakine verir. Bir halka bozuk veri verirse arkadaki bütün halkalar yanlış hesaplar.\n\n### YTBS bu zincirin neresinde\n\nYTBS (Yük Tevzi Bilgi Sistemi), grubun enerji yönetim platformudur. YTBS'nin kamuoyuna açık tanımı, bu zincirin ürünleşmiş halidir. Tanımda geçen parçalar:\n\n- model\n- veri\n- güvenlik\n- tahmin\n- optimizasyon\n- dijital ikiz\n- SCADA/EMS ile web servis\n\n30'dan fazla modül, aynı zincirin parçalarıdır.\n\n> **Mülakatta şöyle söyle:** \"Hepsini ben yazarım\" deme. \"Hangi halkada durduğumu ve komşu halkanın sözleşmesini bilirim\" de.\n\nBuradaki \"sözleşme\", bir halkanın komşusundan hangi veriyi hangi biçimde aldığı ve hangi biçimde verdiğidir.\n\n### Çevrimdışı ve çevrimiçi çalışma\n\nİki çalışma türü vardır:\n\n| | Çevrimdışı çalışma | Çevrimiçi çalışma |\n| --- | --- | --- |\n| Amaç | Planlama ve eğitim | Bu saatin kestirilmiş durumu |\n| Örnek | Yarının bakımı, beş yıl sonraki hat, bir eğitim senaryosu | Şu anki şebeke |\n| Model | Yayımlanmış bir sürüm | Topolojisi dakikada değişir |\n\nİkisi aynı hesap motorunu kullanabilir, aynı veriyi kullanamaz. Çevrimiçi modelin topolojisi dakikada değişir. Çevrimdışı model ise yayımlanmış, sabit bir sürümdür.\n\nİkisi karışırsa ne olur: operatör, bakımda olan hattı ayakta görür.\n\n## Dijital ikiz\n\nBu işte dijital ikiz, şebekenin üç boyutlu resmi değildir. Dijital ikiz, ölçümle güncellenen ve üzerinde senaryo koşulan bir hesap modelidir.\n\nİkizden beklenenler:\n\n- Şu anki durum, kestirim kalitesiyle birlikte\n- \"Şu hat açılırsa\" sorusunun dakikalar değil saniyeler içinde cevabı\n- Yarının tahmini üzerinde aynı soru\n- Eğitimde gerçek sistemi bozmadan oynama\n\n### İkiz ile kumanda ayrımı\n\nİkiz, sahayı kumanda eden SCADA'nın yerine geçmez. Kumanda yetkisi, prosedür ve yetki matrisi ayrıdır. Yetki matrisi, hangi rolün hangi işlemi yapabileceğini gösteren tablodur.\n\nAnaliz ekranındaki \"önerilen üretim\" bir talimat olmaz. Ancak operatör ve piyasa kuralı onu talimat yaptığında talimata dönüşür.\n\n> **Mülakatta şöyle söyle:** Bu ayrımı söylemen, kritik altyapıda çalıştığını gösterir.\n\n## Veri ve servis\n\n### İki tür veri\n\n| Veri | Ne tutar | Nerede |\n| --- | --- | --- |\n| Şebeke kimliği | Bara, ekipman, bağlantı, limitin sürümü | İlişkisel veri tabanı |\n| Zaman serisi | Ölçüm, tahmin | Ya aynı tabanda ya da zaman serisi için ayrılmış bir depoda |\n\nİkisi aynı indeksle zorlanırsa sorgu yavaşlar. Çünkü şebeke kimliği kimlik üzerinden, zaman serisi ise zaman aralığı üzerinden sorgulanır.\n\nAnahtar nokta: ekipman kimliği zaman içinde değişir. Ekipman kimliği, ölçüm kimliğiyle karıştırılmaz.\n\n### Servis yüzeyi\n\nServis yüzeyi, sistemin dışarıya açtığı kapılardır. Üç parça var:\n\n- **REST/JSON:** REST (Representational State Transfer, temsili durum aktarımı) ile JSON (JavaScript Object Notation, metin tabanlı veri biçimi), yeni modüller arasında rahat bir sözleşmedir. Dört öğesi vardır: kaynak, fiil, durum kodu, sayfalama.\n- **SOAP:** SOAP (Simple Object Access Protocol, basit nesne erişim protokolü), eski EMS ve kurumsal entegrasyonda yaşar. Sözleşmesi WSDL (Web Services Description Language, web servis tanım dili) dosyasıdır. WSDL sözleşmesi kırılmadan alan eklenir.\n- **YTBS'nin SCADA/EMS ile web servisi:** bu kapıdır.\n\n### 85 bin istek ve kuyruk\n\n85 bin istek ölçeği, ağır hesabı senkron olarak, yani isteğin içinde koşturmamayı gerektirir. Akış şöyledir:\n\n1. İstek işi kuyruğa bırakır.\n2. Hesap kuyrukta koşar.\n3. Sonuç hazır olunca alınır.\n\nNeden: ağır N-1 hesabı, HTTP (HyperText Transfer Protocol, web istek protokolü) zaman aşımının içinde bitmez. N-1, şebekeden tek bir elemanın (hat, trafo, ünite) düşürüldüğü arıza senaryosudur.\n\n### İş kuyruğu\n\nİş kuyruğu şöyle çalışır:\n\n- Her arıza bir iştir.\n- İşçiler, vaka kopyası üzerinde çözer.\n- Sonuçlar ihlal tablosuna yazılır.\n\nPaylaşılan tek vaka nesnesini on iş parçacığı değiştirirse sonuç rastgeledir. Bu yüzden kopya veya değişmez girdi şarttır.\n\n> **Sade anlatım:** On kişi aynı kâğıda aynı anda yazarsa kâğıtta ne kalacağı belli olmaz. Herkese kendi fotokopisini verirsin.\n\n### Kalite bayrağı\n\nKalite bayrağı, sonucun yanında \"bu sayıya ne kadar güvenebilirim\" bilgisini taşır. Bayrak türleri:\n\n- kestirim kötü\n- topoloji şüpheli\n- ölçüm eski\n- çözüm ıraksak (hesap yakınsamadı)\n\nBayrak varsa:\n\n- Ekranda sonuç kırmızı görünür.\n- Otomasyon o sonucu \"uygula\"ya çevirmez.\n\nOperatör güveni, her sayının yanında nedenini görmekle oluşur. Siyah kutu skoru güven oluşturmaz.\n\n## Arayüz\n\nOperatörün sorusu \"Jacobian kaç?\" değildir. Jacobian, yük akışı çözücüsünün içinde kullanılan türev matrisidir; operatörü ilgilendirmez.\n\nEkranda olması gerekenler:\n\n- Coğrafya veya tek hat şeması üzerinde ihlal\n- İhlali doğuran arıza\n- Önerilen eylem ve eylemin yan etkisi\n- Tahmin bandı\n- Son tazeleme zamanı ve veri yaşı\n\nAraştırmacı ekranı tasarlamayabilir. Ama ekranın hangi sayıyı hangi birimle istediğini bilmek zorundadır. Birim hatası bu katmanda sahaya çıkar.\n\n## Güvenlik ve sürüm\n\n### Güvenlik\n\nŞebeke modeli ve gerçek zaman ölçümü hassastır. Depoya şunlar konmaz:\n\n- parola\n- üretime ait ticari veri\n- kişisel müşteri verisi\n\nErişim rollere göre verilir. Ayrı roller:\n\n| Rol | Yetki |\n| --- | --- |\n| Analiz gören | Sonucu görür |\n| Modeli yayımlayan | Model sürümünü yayına alır |\n| Kumanda eden | Sahaya komut verir |\n\nDenetim kaydı, kimin hangi senaryoyu koştuğunu tutar.\n\nBu bir siber güvenlik uzmanlığı iddiası değildir. Ürün ekibinin asgari hijyenidir.\n\n### Sürüm\n\nÜç şey ayrı sürüm numarası taşır:\n\n- model sürümü\n- algoritma sürümü\n- limit sürümü\n\n\"Geçen ay bu hat ihlalliydi\" iddiası, ancak o ayın modeliyle tekrar koşulursa doğrudur.\n\nTest ortamı üretim verisinin birebir kopyası olmak zorunda değildir. Sentetik veya maskelenmiş veri, algoritma testi için yeter. Üretim ortamında deneme koşusu olmaz.\n\n### İzleme\n\nİzlenen metrikler:\n\n- Servis ayakta mı?\n- Kuyruk büyüyor mu?\n- Son kestirim kaç saniye sürdü?\n- Kaç kötü veri atıldı?\n\nAraştırmacı bu metrikleri, algoritması yavaşladığında okuyabilmelidir.\n\n## Senin yerin\n\nTipik katkı, zincirin bir halkasındaki yöntemi iyileştirip o halkanın sözleşmesini bozmamaktır.\n\nÖrnek: geçici hal taramasını hızlandıran bir metrik.\n\n- Aynı ihlal JSON şemasına yazar.\n- Kalite bayrağını doldurur.\n- Üç baralık ve bir büyük sentetik vakayla test edilir.\n- Çevrimiçi süre bütçesine sığar.\n\nMülakatta kendi projenden buna en yakın köprüyü seç.\n\nAşağıdaki konuşmada geçen kısaltmalar yukarıda açıldı: EMS, SCADA, N-1.\n\n## 90 saniye\n\n“EMS sırası ölçüm, topoloji, kestirim, yük akışı, N-1, tahmin ve optimizasyondur. Dijital ikiz bu modelin ölçümle yaşayan, senaryo koşulan halidir; kumanda yetkisi SCADA’da kalır. Ağır hesap istek içinde değil kuyrukta koşar. Sonuç kalite bayrağıyla çıkar. Model, algoritma ve limit ayrı sürüm taşır. Ben halkadaki hesabın sözleşmesini ve testini sahiplenirim.”\n"}, {"id": "16-Yazilim-Mimarisi/02-SCADA-Protokoller-CIM-TSDB-Ikiz-Siber.md", "group": "16  Yazılım mimarisi", "title": "SCADA, protokoller, CIM, zaman serisi, ikiz, siber güvenlik", "body": "# SCADA, protokoller, CIM, zaman serisi, ikiz, siber güvenlik\n\nBu sayfa şu konuları sırayla anlatır: SCADA/EMS veri akışı, haberleşme protokolleri, CIM (ortak bilgi modeli), zaman serisi veri tabanı, dijital ikiz ve siber güvenlik.\n\nBu klasör senin sahana en yakın olanıdır. Kavramların çoğunu başka adlarla zaten biliyorsun. Burada yapılacak iş, bu kavramların enerji sektöründeki adlarını ve kısıtlarını öğrenmek.\n\n## Veri akışı: sahadan operatöre\n\nBir ölçüm, sahadaki trafodan çıkıp operatör ekranına ve kurumsal sistemlere kadar birkaç katmandan geçer. Aşağıdaki şema bu yolu yukarıdan aşağıya gösterir.\n\nŞemada geçen kısaltmalar (ilk kez burada geçiyorlar):\n\n| Kısaltma | Açılımı | Ne iş yapar |\n| --- | --- | --- |\n| **SCADA** | Supervisory Control and Data Acquisition, denetleyici kontrol ve veri toplama | Ölçer, gösterir, kumanda eder, alarm verir. Analiz yapmaz |\n| **EMS** | Energy Management System, enerji yönetim sistemi | SCADA + iletim analiz uygulamaları |\n| **DMS / ADMS** | Distribution Management System / Advanced DMS, dağıtım yönetim sistemi / gelişmiş dağıtım yönetim sistemi | EMS'nin dağıtım karşılığı |\n| **RTU** | Remote Terminal Unit, uzak uç birimi | Sahadaki sinyalleri toplar, merkeze taşır |\n| **IED** | Intelligent Electronic Device, akıllı elektronik cihaz | Sayısal röle, ölçü cihazı, kontrolör |\n| **IEC** | International Electrotechnical Commission, Uluslararası Elektroteknik Komisyonu | Standartları yayımlayan kurum; numaralar onun standartlarıdır |\n| **DNP3** | Distributed Network Protocol 3, dağıtık ağ protokolü | Merkez ile kontrol merkezi arası protokol |\n| **FEP** | Front-End Processor, ön uç sunucusu | Kontrol merkezinde sahadan gelen haberleşmeyi karşılar |\n| **OPF** | Optimal Power Flow, optimal güç akışı | En ucuz üretimi şebeke sınırları içinde bulur |\n| **AGC** | Automatic Generation Control, otomatik üretim kontrolü | Frekansı ve alışverişi düzenler |\n| **ICCP** | Inter-Control Center Communications Protocol, kontrol merkezleri arası haberleşme protokolü | Kontrol merkezlerini birbirine bağlar |\n| **YTBS** | Yük Tevzi Bilgi Sistemi | Grubun enerji yönetim platformu |\n\n\"Historian\", ölçümleri zaman sırasıyla saklayan arşiv yazılımıdır.\n\n```\nAkım ve gerilim trafosu\n   ↓  analog / örneklenmiş değer\nKoruma rölesi, ölçü cihazı (IED), RTU                    ← trafo merkezi\n   ↓  IEC 61850 (merkez içi)\nMerkez ağ geçidi\n   ↓  IEC 60870-5-104 veya DNP3 (geniş alan ağı)\nKontrol merkezi ön uç sunucusu (FEP)                     ← yük tevzi merkezi\n   ↓\nSCADA gerçek zamanlı veri tabanı  →  arşiv (historian)\n   ↓\nEMS uygulamaları:  topoloji işleyici → durum kestirimi → güvenlik analizi → OPF, AGC\n   ↓                                                         ↓\nOperatör ekranı                                   ICCP ile diğer kontrol merkezleri\n   ↓\nKurumsal katman: web servisleri, raporlama, piyasa sistemleri        ← YTBS'nin durduğu yer\n```\n\nŞemanın katmanları adım adım:\n\n1. Akım ve gerilim trafosu, yüksek değerleri ölçülebilir seviyeye indirir; çıktısı analog veya örneklenmiş değerdir.\n2. Trafo merkezinde koruma rölesi, ölçü cihazı (IED) ve RTU bu değerleri alır.\n3. Trafo merkezi içinde haberleşme IEC 61850 ile olur.\n4. Merkez ağ geçidi, veriyi geniş alan ağı üzerinden IEC 60870-5-104 veya DNP3 ile yük tevzi merkezine gönderir.\n5. Kontrol merkezindeki ön uç sunucusu (FEP) veriyi karşılar.\n6. Veri SCADA gerçek zamanlı veri tabanına yazılır ve arşive (historian) aktarılır.\n7. EMS uygulamaları sırayla çalışır: topoloji işleyici → durum kestirimi → güvenlik analizi → OPF, AGC.\n8. Sonuç operatör ekranına gelir; ICCP ile diğer kontrol merkezlerine de gider.\n9. En üstte kurumsal katman vardır: web servisleri, raporlama, piyasa sistemleri. YTBS'nin durduğu yer burasıdır.\n\n### Zaman ölçekleri\n\nHer verinin yenilenme hızı farklıdır. Yazılım tasarımını bu zaman ölçekleri belirler.\n\n| Veri | Yenilenme | Kullanım |\n| --- | --- | --- |\n| Koruma (GOOSE, örneklenmiş değer) | Milisaniye | Açma, kilitleme |\n| PMU | 20–40 ms (saniyede 25–50) | Geniş alan izleme, SIPS |\n| SCADA taraması | 2–10 s | Operatör ekranı, durum kestirimi |\n| AGC çevrimi | 2–4 s | Frekans ve alışveriş kontrolü |\n| Durum kestirimi, güvenlik analizi | 1–5 dakika | Karar destek |\n| Sayaç | 15 dakika – 1 saat, gecikmeli | Uzlaştırma, tahmin |\n\nTablodaki yeni kısaltmalar:\n\n- **GOOSE** (Generic Object Oriented Substation Event, genel nesne yönelimli trafo merkezi olayı): IEC 61850'nin hızlı olay mesajı. Aşağıda ayrıntısı var.\n- **PMU** (Phasor Measurement Unit, fazör ölçüm birimi): gerilim ve akımın genliğini ve açısını eşzamanlı zaman damgasıyla ölçen cihaz.\n- **SIPS** (System Integrity Protection Scheme, sistem bütünlüğü koruma şeması): geniş alan ölçümüyle sistem düzeyinde koruma eylemi yapan şema.\n\n### YTBS sahayla nasıl konuşur\n\nMAM (TÜBİTAK Marmara Araştırma Merkezi) sayfasındaki YTBS tanımı \"SCADA/EMS ile web servisleri üzerinden veri alışverişi\" der.\n\nYani YTBS büyük ihtimalle protokol düzeyinde sahayla konuşmaz. SCADA'nın sağladığı veriyi servis olarak alır. İç mimarisini bilmiyorum.\n\n## Protokoller\n\nProtokol, iki sistemin veriyi hangi kurallarla taşıyacağını belirler. Enerji sektöründe yaygın olanlar:\n\n| Protokol | Nerede | Model | Özellik |\n| --- | --- | --- | --- |\n| **IEC 61850** | Trafo merkezi içi | Nesne modeli + üç servis | Aşağıda |\n| **IEC 60870-5-104** | Merkez ↔ kontrol merkezi | TCP/IP üstünde telekontrol (kapı 2404) | Avrupa ve Türkiye'de yaygın; zaman damgalı, olay tabanlı iletim. `101` seri hat sürümüdür |\n| **DNP3** | Merkez ↔ kontrol merkezi | Seri ve TCP (kapı 20000) | Kuzey Amerika'da yaygın; olay tamponu, zaman damgası, güvenli kimlik doğrulama eklentisi |\n| **Modbus** | Cihaz düzeyi: evirici, sayaç, PLC | Ana–uydu yoklama; yazmaçlar (kapı 502) | En basit ve en yaygın. Zaman damgası yok, veri modeli yok, güvenlik yok |\n| **ICCP / TASE.2** (IEC 60870-6) | Kontrol merkezi ↔ kontrol merkezi | Nesne tabanlı veri alışverişi | TSO–TSO, TSO–DSO, TSO–santral |\n| **IEEE C37.118** | PMU ↔ fazör veri toplayıcı | Akış | Eşzamanlı fazör verisi |\n| **OPC UA** | Endüstriyel birlikte çalışabilirlik | İstemci-sunucu, yayınla-abone ol | Bilgi modeli ve yerleşik güvenlik |\n\nTablodaki kısaltmalar:\n\n- **TCP/IP** (Transmission Control Protocol / Internet Protocol): internetin temel taşıma protokolleri. \"Kapı\" (port), bir sunucuda servisin dinlediği numaradır.\n- **PLC** (Programmable Logic Controller, programlanabilir mantık denetleyicisi): endüstriyel kontrol cihazı.\n- **TASE.2** (Telecontrol Application Service Element 2): ICCP'nin standart adı.\n- **TSO** (Transmission System Operator, iletim sistemi işletmecisi) ve **DSO** (Distribution System Operator, dağıtım sistemi işletmecisi).\n- **IEEE** (Institute of Electrical and Electronics Engineers, Elektrik ve Elektronik Mühendisleri Enstitüsü): C37.118 onun standardıdır.\n- **OPC UA** (Open Platform Communications Unified Architecture, açık platform haberleşmesi birleşik mimarisi): endüstriyel birlikte çalışabilirlik standardı.\n\nTablodaki diğer terimler:\n\n- **Telekontrol:** uzaktan izleme ve kumanda.\n- **Ana–uydu yoklama:** ana cihaz sırayla sorar, uydu cihaz cevap verir.\n- **Yazmaç:** cihazın numaralı veri hücresi.\n- **Yayınla-abone ol:** gönderen veriyi yayınlar, isteyen abone olup alır.\n\n### IEC 61850 biraz daha ayrıntılı\n\nDiğer protokoller \"veri nasıl taşınır\" sorusuna cevap verir. IEC 61850 önce \"veri **nedir**\" sorusuna cevap verir: cihazdan bağımsız, standart adlı bir nesne modeli sunar.\n\n**Mantıksal düğüm**, bir işlevin standart adıdır. Örnekler:\n\n| Ad | Anlamı |\n| --- | --- |\n| `XCBR` | Kesici |\n| `MMXU` | Ölçüm |\n| `PTOC` | Zamanlı aşırı akım koruması |\n| `PDIS` | Mesafe koruması |\n\nAdresleme hiyerarşiktir: `MerkezA/Fider3/XCBR1.Pos.stVal` → kesicinin konumu. Bu adres, merkezden fidere, fiderden kesiciye, kesiciden konum verisine iner.\n\nYazılımcı için fark şudur: Modbus \"40001 numaralı yazmaç\" der ve anlamını bir Excel tablosundan öğrenirsin. IEC 61850 ise tip tanımlı, kendini tarif eden bir şema sunar.\n\n> **Sade anlatım:** Modbus sana numaralı kutular verir, hangi kutuda ne olduğunu ayrı bir listeden bulursun. IEC 61850 kutunun üstüne ne olduğunu yazar.\n\n#### Üç haberleşme servisi\n\n| Servis | Taşıma | Süre | Kullanım |\n| --- | --- | --- | --- |\n| MMS | TCP/IP, istemci-sunucu | Yüzlerce ms | İzleme, kumanda, raporlama |\n| GOOSE | Doğrudan Ethernet, çoklu yayın, yayınla-abone ol | \u003c 4 ms | Açma, kilitleme; bakır kablonun yerini alır |\n| Örneklenmiş değerler (SV) | Doğrudan Ethernet | Periyot başına 80 örnek (50 Hz'te saniyede 4000) | Akım ve gerilim dalga biçimi; proses barası |\n\n- **MMS** (Manufacturing Message Specification, üretim mesaj belirtimi): istemci-sunucu tarzı mesajlaşma.\n- **SV** (Sampled Values, örneklenmiş değerler): ham dalga biçimi örnekleri. 50 Hz'te bir periyot 20 ms'dir; periyot başına 80 örnek, saniyede 50 × 80 = 4000 örnek eder.\n- **Çoklu yayın:** bir mesajın aynı anda birçok alıcıya gitmesi.\n- **Proses barası:** sahadaki ölçü trafosu ile röle arasındaki sayısal ağ.\n\n#### Yapılandırma dili\n\nYapılandırma dili SCL (Substation Configuration Language, trafo merkezi yapılandırma dili), XML (Extensible Markup Language, genişletilebilir işaretleme dili) tabanlıdır. Üç ayrı dosya türü vardır:\n\n- cihaz yeteneği\n- merkez tasarımı\n- cihaza yüklenen ayar\n\n## CIM: ortak bilgi modeli\n\nHer yazılım şebekeyi kendi biçiminde tutarsa, `n` sistem arasında `n²` dönüştürücü gerekir. CIM (Common Information Model, ortak bilgi modeli), şebeke için ortak bir sınıf modelidir. Herkes ortak modele çevirince dönüştürücü sayısı azalır.\n\n| Standart | Kapsam |\n| --- | --- |\n| IEC 61970 | İletim, EMS: şebeke elemanları, topoloji, ölçüm |\n| IEC 61968 | Dağıtım: varlık, iş emri, sayaç, müşteri |\n| IEC 62325 | Piyasa |\n| **CGMES** | ENTSO-E'nin CIM profili; iletim işletmecileri arası model değişimi |\n\n- **CGMES** (Common Grid Model Exchange Standard, ortak şebeke modeli değişim standardı).\n- **ENTSO-E** (European Network of Transmission System Operators for Electricity, Avrupa elektrik iletim sistemi işletmecileri ağı).\n\nModel UML (Unified Modeling Language, birleşik modelleme dili) ile tanımlanır. RDF/XML (Resource Description Framework, kaynak tanımlama çerçevesi; XML biçiminde) olarak serileştirilir. Her nesnenin kalıcı bir kimliği vardır: mRID (master resource identifier, ana kaynak kimliği).\n\n### Çekirdek kavram: çizge\n\nYazılımcı için CIM'in çekirdeği bir **çizgedir**. Aşağıdaki satır üç kavramın nasıl bağlandığını gösterir: iletken eleman bir uca, uç bir bağlantı düğümüne bağlanır.\n\n```\nİletken eleman (hat, trafo, kesici)  ──  Uç (Terminal)  ──  Bağlantı düğümü (ConnectivityNode)\n```\n\n### İki model düzeyi ve topoloji işleme\n\nİki model düzeyi vardır. Aralarındaki dönüşümün adı **topoloji işleme**dir.\n\n| Model | Ne içerir | Kim kullanır |\n| --- | --- | --- |\n| **Düğüm-kesici modeli** | Her kesici ve ayırıcı ayrı ayrı vardır | SCADA ve işletme |\n| **Bara-dal modeli** | Kapalı anahtarlarla birbirine bağlı düğümler tek bir baraya indirgenir | Yük akışı |\n\nTopoloji işleyici, anahtar konumlarına bakıp bağlı bileşenleri bulan bir çizge algoritmasıdır. Kullanılan yöntemler birleştir-bul veya genişlik öncelikli aramadır.\n\nBir kesici konumu yanlış gelirse bara sayısı değişir ve durum kestirimi bozulur.\n\n### CGMES profilleri\n\nCGMES modeli profillere bölünür:\n\n| Profil | İçerik | Değişme sıklığı |\n| --- | --- | --- |\n| EQ | Ekipman: ne var, nasıl bağlı | Nadiren |\n| SSH | Sürekli hal varsayımı: yük, üretim, anahtar ve kademe konumu | Her senaryo |\n| TP | Topoloji: hesaplanan baralar | Her senaryo |\n| SV | Durum değişkenleri: yük akışı sonucu | Her çözüm |\n| DL, GL | Şema yerleşimi, coğrafi konum | Nadiren |\n| DY | Dinamik modeller | Nadiren |\n\nProfil adlarının açılımı: EQ (Equipment), SSH (Steady State Hypothesis), TP (Topology), SV (State Variables), DL (Diagram Layout), GL (Geographical Location), DY (Dynamics).\n\nBu ayrım iyi bir tasarım örneğidir: yavaş değişen yapı ile hızlı değişen durum ayrı tutulur.\n\n### Gerçekte zor olan\n\n- Üreticilerin CIM yorumları farklıdır.\n- Uzantılar yaygındır.\n- Dosyalar büyüktür.\n- Modelin doğrulanması (referans bütünlüğü, eksik parametre) işin çoğunu oluşturur.\n\n## Zaman serisi veri tabanı\n\nÖlçüm verisinin özellikleri:\n\n- yazma ağırlıklı\n- zaman sıralı\n- nadiren güncellenen\n- zaman aralığıyla sorgulanan\n\nİlişkisel satır deposu bu tür veri için verimsizdir.\n\n| Araç | Not |\n| --- | --- |\n| PI System (AVEVA) | Enerji sektöründe fiilî standart arşiv |\n| TimescaleDB | PostgreSQL uzantısı; SQL ve ilişkisel veriyle birleştirme |\n| InfluxDB | Açık kaynak, etiket tabanlı |\n| ClickHouse, Parquet dosyaları | Analitik ve toplu işleme |\n\nSQL (Structured Query Language), ilişkisel veri tabanının sorgu dilidir.\n\n### Kavramlar\n\n- **Etiket (tag) + zaman damgası + değer + kalite.** Bir ölçüm kaydı bu dört parçadan oluşur. Kalite bayrağı (iyi, şüpheli, eski, elle girilmiş) verinin parçasıdır. Kalite bayrağını atan analiz, donmuş bir ölçümü taze sanar.\n- **Sıkıştırma:** ölü bant ve salınan kapı gibi kayıplı yöntemler değişmeyen değeri yazmaz. Ölü bant, belli bir eşikten küçük değişimi yok sayar. Bir de sütun bazlı kayıpsız sıkıştırma vardır.\n- **Alt örnekleme ve saklama:** ham veri kısa süre, dakikalık ve saatlik özetler uzun süre tutulur.\n- **Geç gelen ve sırasız veri:** haberleşme kesilir, cihaz tamponunu sonradan boşaltır.\n- **Zaman:** her şey UTC (Coordinated Universal Time, eşgüdümlü evrensel zaman) olarak saklanır. Olay zamanı (cihaz saati) ile alım zamanı (sunucu saati) ayrı tutulur. Yaz saati ve artık saniye hataları klasiktir.\n\n### Elle örnek: boyutlandırma\n\nSenaryo: 20.000 ölçüm noktası, 2 saniyede bir tarama.\n\nHesabın adımları ve ne işe yaradıkları:\n\n1. **Saniyede örnek:** nokta sayısını tarama süresine bölerek veri tabanına saniyede kaç yazma geleceğini buluruz.\n2. **Günde örnek:** saniyelik sayıyı bir gündeki 86.400 saniyeyle çarparak günlük satır sayısını buluruz.\n3. **Ham boyut:** günlük örnek sayısını örnek başına 16 baytla çarparak sıkıştırmasız disk ihtiyacını buluruz; yıla çevirince uzun dönem depolama ölçeği çıkar.\n4. **Sıkıştırma:** 10 kat sıkıştırma varsayımıyla gerçekçi günlük disk ihtiyacını buluruz.\n\n```\nSaniyede örnek = 20.000 / 2 = 10.000\nGünde örnek    = 10.000 × 86.400 = 864 milyon\nHam boyut      = 864 milyon × 16 bayt ≈ 13,8 GB/gün  ≈ 5 TB/yıl\n10 kat sıkıştırmayla ≈ 1,4 GB/gün\n```\n\n**PMU eklenirse:** 100 PMU × 20 kanal × saniyede 50 örnek = saniyede 100.000 örnek. Bu, SCADA'nın saniyedeki 10.000 örneğinin on katıdır. Bu adım, PMU'nun yazma yükünü SCADA ile karşılaştırmaya yarar. Bu ölçekte yazma hızı ve sıkıştırma bir tasarım kararına dönüşür.\n\nMAM'ın TEKİS-C projesi 20.678 yüksek gerilim ölçüm noktasından söz eder (`01/03`). Bu örnek o mertebededir.\n\n## Dijital ikiz\n\nÜç düzeyi birbirinden ayır:\n\n| Düzey | Veri akışı |\n| --- | --- |\n| Dijital model | Elle güncellenen çevrim dışı model. Planlama çalışması |\n| Dijital gölge | Gerçek sistemden modele otomatik akış. Durum kestirimiyle güncellenen model |\n| Dijital ikiz | İki yönlü: model kararı gerçek sisteme geri gider (operatör aracılığıyla veya otomatik) |\n\n> **Sade anlatım:** Model, elle çizilmiş bir harita. Gölge, kendiliğinden güncellenen bir harita. İkiz, haritaya bakıp yolu da değiştirebildiğin sistem.\n\n### Şebeke dijital ikizinin katmanları\n\n1. **Yapısal model:** CIM; ekipman, parametre, bağlantı.\n2. **Canlı durum:** SCADA ve PMU ölçümü → topoloji işleyici → durum kestirimi.\n3. **Hesap motoru:** yük akışı, kısa devre, güvenlik, kararlılık.\n4. **Senaryo:** \"şu hat açılırsa\", \"yarın rüzgâr şöyle olursa\". Canlı durumdan dallanan kopyalar.\n5. **Doğrulama döngüsü:** model tahmini ile ölçüm karşılaştırılır; fark, parametre veya topoloji hatasını gösterir.\n\n### Yazılım açısından zor olanlar\n\n- Modelin sürümlenmesi: dün neydi, yarın ne olacak.\n- Senaryoların yalıtılması: operatörün \"ne olursa\" denemesi canlı durumu bozmamalı.\n- Hesapların tutarlı bir anlık görüntü üzerinde koşması.\n- Sonucun hangi model ve veri sürümüyle üretildiğinin izlenebilmesi.\n\nMAM sayfası YTBS'yi \"şebekenin yaşayan dijital ikizi\" diye tanımlar.\n\n## Siber güvenlik temelleri\n\n### Bilişim ile işletme teknolojisi farkı\n\nIT (Information Technology, kurumsal bilişim) ofis ve iş sistemleridir. OT (Operational Technology, işletme teknolojisi) fiziksel süreci izleyen ve kumanda eden sistemlerdir.\n\n| | Kurumsal bilişim (IT) | İşletme teknolojisi (OT) |\n| --- | --- | --- |\n| Öncelik | Gizlilik, bütünlük, erişilebilirlik | **Erişilebilirlik** ve güvenlik (can, ekipman), bütünlük, gizlilik |\n| Yama | Haftalık | Planlı duruşta; yıllar sürebilir |\n| Ömür | 3–5 yıl | 15–30 yıl |\n| Gecikme toleransı | Saniyeler | Milisaniyeler |\n| Hata sonucu | Veri kaybı | Fiziksel hasar, kesinti |\n\nSonuç: \"şüpheli durumda sistemi kapat\" refleksi OT'de yanlıştır. Antivirüs taraması bir koruma rölesini geciktiremez.\n\n### Yapı\n\n- **Bölgeler ve kanallar** (IEC 62443): ağ, güvenlik düzeyine göre bölgelere ayrılır. Bölgeler arası her akış tanımlı bir kanaldan geçer.\n- **Katmanlı model** (Purdue): saha cihazları → kontrol → merkez gözetim → işletme → **arındırılmış bölge (DMZ)** → kurumsal ağ → internet. DMZ (Demilitarized Zone), iki ağ arasında tampon görevi gören ara bölgedir. Kurumsal ağdan kontrol ağına doğrudan bağlantı olmaz.\n- **Tek yönlü geçit (veri diyotu):** veri kontrol ağından dışarı akar, içeri fiziksel olarak akamaz.\n- **IEC 62351:** güç sistemi protokollerinin güvenliği. İçerdikleri: TLS (Transport Layer Security, aktarım katmanı güvenliği), kimlik doğrulama, GOOSE imzalama, rol tabanlı erişim.\n\nProtokollerin çoğu güvenlik düşünülmeden tasarlandı. Modbus ve klasik IEC 104 kimlik doğrulamaz: ağa erişen, komut gönderir.\n\n### Bilinen olaylar\n\n2015 ve 2016'da Ukrayna'da dağıtım ve iletim saldırıları oldu. İkincisinde kullanılan zararlı yazılım, IEC 104 ve IEC 61850 ile doğrudan konuşup kesici açtı.\n\nDers: saldırgan, protokolü ve prosesi bilen biridir.\n\n### Türkiye\n\nEPDK'nın (Enerji Piyasası Düzenleme Kurumu) enerji sektöründeki endüstriyel kontrol sistemleri için bir bilişim güvenliği yönetmeliği vardır (2017). Güncel adını ve kapsamını **doğrulamadım**.\n\n> **Mülakatta şöyle söyle:** Ad verme. \"EPDK'nın bu alandaki düzenlemesi\" de.\n\nSayaç verisi kişisel veridir; KVKK (Kişisel Verilerin Korunması Kanunu) kapsamına girer.\n\n### Analiz yazılımına özgü tehdit: sahte veri enjeksiyonu\n\nDurum kestirimi kötü veriyi artıklardan yakalar (`09/02`). Artık, ölçüm ile kestirimin ölçüme karşılık gelen değeri arasındaki farktır.\n\nŞebeke modelini bilen saldırgan, ölçümleri **modelle tutarlı** biçimde değiştirirse artıklar değişmez.\n\nSaldırı vektörü `a = H c` biçimindeyse kestirim `c` kadar kayar, artık aynı kalır. Burada `H` ölçüm matrisi (durumu ölçüme bağlayan katsayılar), `c` saldırganın durumda yaratmak istediği kayma, `a` ölçümlere eklenen saldırı vektörüdür.\n\n> **Sade anlatım:** Kötü veri testi \"ölçümler birbiriyle tutarlı mı\" diye bakar. Saldırgan bütün ölçümleri aynı yalanla tutarlı biçimde değiştirirse test bir şey görmez.\n\n**Elle örnek.** `09/02`'deki iki ölçüm: `z = [1,02  0,98]`, `H = [−10  −10]`. Saldırgan durumu `c = 0,01 rad` kaydırmak istiyor: `a = H c = [−0,1  −0,1]`.\n\nAdımların ne işe yaradığı:\n\n1. **Saldırı vektörü:** `a = H c` her ölçüm için −10 × 0,01 = −0,1 verir; bu, ölçümlere eklenecek modelle tutarlı değişikliktir.\n2. **Yeni ölçümler:** her ölçüme −0,1 eklenir; 1,02 → 0,92 ve 0,98 → 0,88 olur. Bu adım saldırganın sisteme gönderdiği sahte değerleri gösterir.\n3. **Kestirim:** iki ölçümün 10.000 ve 2.500 ağırlıklı ortalaması (ağırlıklar toplamı 12.500) alınır; sonuç 0,912 çıkar, önceki 1,012'den tam 0,1 aşağıdadır. Bu adım kestirimin saldırganın istediği kadar kaydığını gösterir.\n4. **Artıklar:** her ölçümden kestirim çıkarılır; +0,008 ve −0,032 çıkar, saldırıdan öncekiyle aynıdır. Bu adım kötü veri testinin neden bir şey görmediğini gösterir.\n5. **J:** artıklardan hesaplanan kötü veri test istatistiği (ağırlıklı artık karelerinin toplamı) 3,20 çıkar, öncekiyle aynıdır. Bu adım alarmın neden çalmadığını gösterir.\n\n```\nYeni ölçümler:  z' = [0,92  0,88]\nKestirim:       (10.000 × 0,92 + 2.500 × 0,88) / 12.500 = 0,912      (önce 1,012)\nArtıklar:       0,92 − 0,912 = +0,008      0,88 − 0,912 = −0,032    (aynı)\nJ = 3,20                                                              (aynı)\n```\n\nSonuç: operatör hattan 0,1 pu daha az güç aktığını görür; kötü veri testi hiçbir şey söylemez. pu (per unit, birim değer), büyüklüğün baz değere oranıdır.\n\n**Savunma:**\n\n- Bazı ölçümleri kriptografik olarak korumak. Saldırganın `H c` kurması için bütün ilgili ölçümlere erişmesi gerekir; birkaçı korunursa tutarlı saldırı kurulamaz.\n- PMU gibi bağımsız kaynaklarla çapraz denetim.\n- Zaman içinde tutarlılık denetimi.\n- Model bilgisini gizli tutmak.\n\n### Yazılımcının sorumluluğu\n\nBurada kendi tecrübenden konuşabilirsin:\n\n| Konu | Ne yapılır |\n| --- | --- |\n| Girdi doğrulama | Dışarıdan gelen her model ve ölçüm dosyası güvenilmezdir. Şema doğrulama, aralık denetimi, boyut sınırı |\n| Kimlik doğrulama ve yetkilendirme | Kim hangi senaryoyu koşabilir, kim sonucu görebilir, kim modele yazabilir. En az yetki |\n| Denetim izi | Kim, ne zaman, hangi model sürümüyle, hangi hesabı koştu |\n| Sırlar | Parola ve anahtar kodda ve depoda durmaz |\n| Bağımlılıklar | Sürüm sabitleme, zafiyet taraması, yazılım malzeme listesi |\n| Ağ | Analiz servisi kontrol ağına yazamaz; veri tek yönlü gelir |\n| Hata davranışı | Servis çökerse operatör eski veriyi taze sanmamalı |\n\n## Yaygın yanlış\n\n| Yanlış | Doğrusu |\n| --- | --- |\n| **\"SCADA analiz yapar.\"** | Ölçer ve kumanda eder. Analiz EMS uygulamalarındadır |\n| **\"IEC 61850 bir haberleşme protokolüdür.\"** | Önce bir veri modelidir; üç ayrı haberleşme servisi içerir |\n| **\"IEC 104 ve DNP3 aynı işi yapar, biri seçilir.\"** | Aynı işi yaparlar; hangisinin kullanılacağını bölge ve mevcut altyapı belirler |\n| **\"CIM bir dosya biçimidir.\"** | Bir bilgi modelidir; RDF/XML serileştirmelerinden biridir |\n| **\"Kontrol ağı internete bağlı değil, o halde güvenli.\"** | Ukrayna saldırıları kurumsal ağdan sıçradı. Taşınabilir bellek, bakım dizüstü bilgisayarı ve uzaktan erişim de yoldur |\n| **\"Şifrelersek güvenli olur.\"** | OT'de öncelik erişilebilirlik ve bütünlüktür; şifreleme gecikme ekler ve izlemeyi zorlaştırır. Önce kimlik doğrulama ve bölümleme |\n| **\"Dijital ikiz üç boyutlu görselleştirmedir.\"** | Ölçümle güncellenen ve üzerinde senaryo koşulabilen hesap modelidir |\n| **\"Kalite bayrağı ayrıntıdır.\"** | Donmuş bir ölçümü taze sanan durum kestirimi, sessizce yanlış sonuç üretir |\n\n## Panel takip sorusu\n\nPanelin bu konuda sorabileceği üç soru ve cevapları.\n\n**Soru 1:** \"SCADA verisi 5 saniye, PMU verisi 20 ms. İkisini aynı kestirimde nasıl kullanırsın?\"\n\n> **Mülakatta şöyle söyle:** Zaman damgasına göre hizalarım; SCADA taramasının anına en yakın PMU örneğini veya o pencerenin ortalamasını alırım. PMU'ya ölçüm doğruluğuna göre daha yüksek ağırlık veririm. SCADA ölçümlerinin kendi içinde eşzamanlı olmadığını varyansa yansıtırım.\n\n**Soru 2:** \"Web servisiniz günde 85.000 istek alıyor ve hesap 30 saniye sürüyor. Nasıl tasarlarsın?\"\n\n> **Mülakatta şöyle söyle:** İsteği kabul edip iş kimliği dönerim; hesap kuyrukta, işçilerde koşar; sonuç sorgulanır veya bildirilir. Aynı girdiyle gelen istekleri önbellekten karşılarım; anahtar, model sürümü + senaryo özetidir. İşçiler durumsuzdur, yatay ölçeklenir. Sonuç, üretildiği model sürümüyle saklanır.\n\n\"Durumsuz\" işçi, kendi içinde kalıcı bilgi tutmayan işçidir; bu yüzden sayısı artırılarak yatay ölçeklenebilir.\n\n**Soru 3:** \"Operatörün 'ne olursa' senaryosu canlı modeli bozmasın. Nasıl?\"\n\n> **Mülakatta şöyle söyle:** Senaryo, canlı durumun değişmez bir anlık görüntüsünden dallanır; değişiklikler fark olarak tutulur. Yazarken kopyala mantığı.\n\n\"Yazarken kopyala\", veriyi ancak değiştirileceği an kopyalamak demektir; değişmeyen kısım paylaşılır.\n\nAşağıdaki konuşmada geçen kısaltmalar yukarıda açıldı: IEC 61850, IEC 104 (IEC 60870-5-104), DNP3, SCADA, CIM, IEC 61970, 61968.\n\n## 90 saniye\n\n\"Veri sahadan şöyle akar: ölçü trafosundan röleye ve uzak uç birimine, trafo merkezi içinde IEC 61850 ile, merkezden kontrol merkezine IEC 104 veya DNP3 ile, oradan SCADA veri tabanına ve enerji yönetim uygulamalarına. SCADA ölçer ve kumanda eder; analiz ayrı katmandır. Şebeke modeli için ortak dil CIM'dir: iletimde IEC 61970, dağıtımda 61968; düğüm-kesici modelinden bara-dal modeline geçiş topoloji işlemedir. Ölçümler kalite bayrağıyla birlikte zaman serisi veri tabanında tutulur. Dijital ikiz, bu modelin ölçümle güncellenen ve üzerinde senaryo koşulan halidir. Güvenlikte öncelik erişilebilirliktir; ağ bölgelere ayrılır, analiz servisi kontrol ağına yazamaz.\"\n"}, {"id": "16-Yazilim-Mimarisi/03-Kendi-Projelerinden-Kopru.md", "group": "16  Yazılım mimarisi", "title": "Kendi projelerinden köprü", "body": "# Kendi projelerinden köprü\n\nBu sayfa bir **şablondur**. Proje adı, rol ve mimari buraya yazılmaz. Kartları kendi işinle doldurursun.\n\nBoşlukları doldurmadan mülakata girme. Doldurduktan sonra bu sayfa senin en güçlü sayfan olur.\n\nSayfa beş adımdan oluşur:\n\n| Adım | Ne yapacaksın |\n| --- | --- |\n| 1 | Her proje için kimlik kartı doldur |\n| 2 | Veri akışı, ölçekleme ve güvenlikte birer mimari karar seç |\n| 3 | Ad hakkındaki tahmini ve uyarıyı oku |\n| 4 | İki dakikalık anlatımı sesli çalış |\n| 5 | Gelecek zor soruların cevabını yaz |\n\n## Neden önemli\n\nPanelin karşısında iki tür aday olacak:\n\n- Güç sistemini bilen ama üretim yazılımı geliştirmemiş olanlar.\n- İkincisi: üretim yazılımı geliştirmiş, güç sistemini sonradan öğrenen.\n\nİlanın cümlesi \"analiz **ve yazılım geliştirme**\"dir. YTBS (Yük Tevzi Bilgi Sistemi), on binlerce web servis isteği ve binlerce kullanıcıyla çalışan bir üretim sistemidir (`01/03`). Senin kanıtın, böyle bir sistemin kararlarını vermiş olmandır.\n\nAma kural şu: **benzetme kur, eşitlik kurma.**\n\n> **Mülakatta şöyle söyle:** \"Eski projemde yaptığım, durum kestirimiyle aynı şey\" deme. \"Şu kararı verdim; şebeke yazılımında aynı sorunun karşılığı şudur\" de.\n\n## Adım 1: her proje için kimlik kartı\n\nHer proje için ayrı doldur. Yalnız gerçeği yaz. Hatırlamadığın sayıyı mertebe olarak ver (örneğin \"binler düzeyinde\").\n\nAşağıdaki kart, panelin projen hakkında soracağı temel bilgileri tek yerde toplar. Satırları tek tek doldur.\n\n```\nProje adı            :\nTek cümleyle ne      :\nKullanıcısı kim      :\nDönem                : ____ – ____\nSenin rolün          : (geliştirici / teknik lider / mimar / ...)\nEkip büyüklüğü       :\nSorumlu olduğun kısım:\nTeknoloji yığını     : dil, çerçeve, veri tabanı, kuyruk, bulut\nÖlçek                : kullanıcı sayısı, istek/saniye, veri hacmi, belge sayısı\nÜretimde mi          : evet / hayır; ne zamandan beri\nEnerji veya şebekeyle ilişkisi : var / dolaylı / yok   (dürüstçe)\nSGK dökümünde hangi işyeri ve dönem altında görünüyor :\n```\n\nSon iki satır, `01/04` dosyasındaki tecrübe beyanı uyarısıyla doğrudan ilgilidir. SGK (Sosyal Güvenlik Kurumu) dökümü, tecrübe süresinin resmî kanıtıdır.\n\n## Adım 2: üç mimari karar\n\nİlan maddeleri ve panelin ilgisi açısından en değerli üç eksen şunlardır: **veri akışı, ölçekleme, güvenlik**. Her biri için bir karar seç ve aşağıdaki dört satırı doldur.\n\nBu dört satırlık kalıp, bir kararı \"ne, neye karşı, neden, sonuç\" sırasıyla anlatmana yarar.\n\n```\nKarar      : Ne seçtin?\nAlternatif : Neyi eledin?\nGerekçe    : Neden? (ölçüm, kısıt, maliyet)\nSonuç      : Ne oldu? Sayıyla. Bugün olsa aynısını yapar mıydın?\n```\n\n### Veri akışı\n\nKendine sor:\n\n- Veri sisteme nereden giriyor, hangi biçimde, ne sıklıkta?\n- Girdi bozuk, eksik veya gecikmeli gelirse ne oluyor? Sessizce mi yutuluyor, reddediliyor mu, karantinaya mı alınıyor?\n- İşleme eşzamanlı mı, kuyrukla mı? Neden?\n- Aynı girdi iki kez gelirse sonuç değişiyor mu (eşgüçlülük)?\n- Bir sonucun hangi girdiden ve hangi kod sürümünden üretildiğini geriye doğru izleyebiliyor musun?\n- Şema değiştiğinde eski veriye ne oluyor?\n\nEşgüçlülük, aynı işlemi bir kez veya birçok kez yapmanın aynı sonucu vermesidir.\n\nŞebeke yazılımındaki karşılıkları:\n\n| Senin sorunun | Şebeke yazılımındaki karşılığı |\n| --- | --- |\n| Bozuk veya eksik girdi | Kalite bayrağı kötü olan ölçüm; durum kestiriminde kötü veri (`09/02`) |\n| Gecikmeli, sırasız veri | SCADA taramasının eşzamansızlığı; geç gelen sayaç verisi |\n| Kuyruk ve eşzamansız işleme | 30 saniye süren güvenlik analizinin istekten ayrılması |\n| Eşgüçlülük | Aynı model + aynı senaryo = aynı sonuç; önbellek anahtarı |\n| Veri soy izi | Sonucun hangi model, ölçüm ve algoritma sürümüyle üretildiği |\n| Şema evrimi | CIM sürümleri; model değişince eski senaryoların geçerliliği |\n| Doğrulama katmanı | Topoloji denetimi, ada tespiti, birim ve baz denetimi |\n\nTablodaki kısaltmalar: SCADA (Supervisory Control and Data Acquisition, denetleyici kontrol ve veri toplama) sahadan ölçüm toplayan sistemdir. CIM (Common Information Model, ortak bilgi modeli) şebeke modelinin ortak sınıf yapısıdır.\n\n### Ölçekleme\n\nKendine sor:\n\n- Darboğaz neredeydi? Nasıl **ölçtün**?\n- Yatay mı dikey mi ölçekledin? Durum nerede tutuluyor?\n- En pahalı işlem neydi; önbelleğe aldın mı, ön hesapladın mı, paralelleştirdin mi?\n- Yük ani arttığında sistem nasıl davranıyor: yavaşlıyor mu, reddediyor mu, çöküyor mu?\n- Ölçeklemeden önce ve sonra hangi sayı değişti?\n\nYatay ölçekleme makine sayısını artırmak, dikey ölçekleme tek makineyi güçlendirmektir.\n\nŞebeke yazılımındaki karşılıkları:\n\n| Senin sorunun | Şebeke yazılımındaki karşılığı |\n| --- | --- |\n| Bağımsız işleri paralelleştirme | Binlerce N-1 vakası birbirinden bağımsızdır (`07/02`) |\n| Pahalı hesabı ön hesaplama | PTDF ve LODF: duyarlılık bir kez hesaplanır, binlerce kez kullanılır (`03/03`) |\n| Önbellek | Matris çarpanlarının yeniden kullanımı; topoloji değişmediyse simgesel ayrışma |\n| Kademeli işleme (ucuz filtre, pahalı doğrulama) | DC tarama → AC doğrulama → dinamik benzetim |\n| Geri basınç ve öncelik | Operatörün anlık isteği, toplu gece çalışmasının önüne geçer |\n| Ölçmeden eniyileme yapmamak | Sürenin kurulumda mı çözücüde mi geçtiğini profille görmek (`14/02`) |\n\nTablodaki kısaltmalar ve terimler:\n\n- **N-1:** şebekeden tek bir elemanın (hat, trafo, ünite) düşürüldüğü arıza senaryosu.\n- **PTDF** (Power Transfer Distribution Factor, güç aktarım dağılım çarpanı): bir baradaki güç değişiminin hat akışlarına nasıl dağıldığını gösterir.\n- **LODF** (Line Outage Distribution Factor, hat açılması dağılım çarpanı): bir hat açılınca akışının diğer hatlara nasıl dağıldığını gösterir.\n- **DC / AC:** DC (doğru akım) yaklaşımı hızlı ve kaba yük akışıdır; AC (alternatif akım) yük akışı tam ve yavaştır.\n- **Geri basınç:** sistem doluyken yeni işi yavaşlatma veya reddetme mekanizması.\n\n### Güvenlik\n\nKendine sor:\n\n- Kimlik doğrulama ve yetkilendirme nasıl? Roller neler?\n- Hassas veri neydi? Nerede şifreli, kim erişebiliyor, erişim kaydı tutuluyor mu?\n- Kiracılar veya müşteriler birbirinin verisinden nasıl yalıtılıyor?\n- Dışarıdan gelen dosya veya girdi nasıl doğrulanıyor?\n- Sırlar nerede duruyor?\n- Bir güvenlik olayı veya denetim yaşadın mı? Ne değişti?\n- (Yapay zekâ bileşeni varsa) Model dışarı veri sızdırabilir mi? Girdiyle yönlendirilebilir mi? Çıktısı doğrulanmadan bir eyleme dönüşüyor mu?\n\nŞebeke yazılımındaki karşılıkları:\n\n| Senin sorunun | Şebeke yazılımındaki karşılığı |\n| --- | --- |\n| Rol tabanlı erişim | Kim senaryo koşar, kim modele yazar, kim yalnız görür |\n| Hassas veri | Ulusal şebeke modeli, kısa devre güçleri, kritik merkezler; santrallerin ticari verisi |\n| Denetim izi | Kim, ne zaman, hangi model sürümüyle hangi hesabı koştu |\n| Güvenilmeyen girdi | Dışarıdan gelen CIM dosyası, sistem kullanıcısından gelen veri |\n| Ağ yalıtımı | Analiz servisi kontrol ağına yazamaz; veri tek yönlü (`16/02`) |\n| Model çıktısının doğrulanmadan eyleme dönüşmemesi | Yapay zekâ tahmini operatöre öneridir; fizik tabanlı denetimden geçer (`18/02`) |\n\n## Adım 3: işin cinsinden köprü kur, addan tahmin yürütme\n\nProje adından ne iş yaptığını çıkarma. Aşağıdaki köprüler yalnızca belge veya yapay zekâ işi yaptıysan kullanılır. Değilse atla.\n\n| Belge işleme sisteminde | Şebeke analizinde |\n| --- | --- |\n| Modelin emin olmadığı çıktıyı insana yönlendirmek | Güvenlik açısından kritik kararda insan onayı |\n| Çıkarılan alanı kurallarla doğrulamak (toplam = kalemlerin toplamı) | Öğrenen modelin çıktısını fizikle denetlemek (güç dengesi, sınırlar) |\n| Eğitimde görülmemiş belge türünde başarımın düşmesi | Dağılım dışı işletme koşulu: hiç görülmemiş topoloji, aşırı hava |\n| Doğruluğu örneklemle sürekli izlemek | Tahmin hatasını ve model kaymasını izlemek |\n| Modelin neden o sonucu verdiğini açıklayabilmek | Operatörün öneriye güvenebilmesi için gerekçe |\n\n**Uyarı.** Bu projelerin enerji veya şebekeyle ilişkisi yoksa mülakatta da yok de. \"Şebeke yazılımına benzer bir sistem\" deme. Panel alanın içindendir ve tek soruyla ayırır.\n\n> **Mülakatta şöyle söyle:** \"Alanı farklıydı; taşıdığım şey mimari kararlar.\"\n\n## Adım 4: iki dakikalık anlatım\n\nKartı ve kararları doldurduktan sonra her proje için aşağıdaki iskeleti sesli söyle ve süre tut. Köşeli parantezler, senin dolduracağın yerlerdir.\n\n> **Mülakatta şöyle söyle:** \"[Proje], [kullanıcı] için [tek cümle]. Ben [rol] olarak [sorumluluk] kısmından sorumluydum. Ölçeği [sayı]. En zor karar [karar] idi: [alternatif] yerine [seçim] yaptım, çünkü [gerekçe]. Sonuç [sayı]. Enerji alanında bir proje değildi. Ama aynı soru sizin sistemlerinizde de var: [karşılık]. Örneğin [bu klasörden somut bir örnek].\"\n\nİskeletin sırası şudur: ne yaptın, rolün ne, ne büyüklükte, en zor karar ne, sonuç ne, alanla ilişkisi ne, şebekedeki karşılığı ne.\n\nÖrnek karşılık cümleleri. Gerçeğine uyanı seç:\n\n| Kendi deneyimin | Şebekedeki karşılığı |\n| --- | --- |\n| Uzun süren işi kuyruğa almak | Binlerce bağımsız arıza vakası |\n| Bozuk girdiyi reddetmek | Yakınsamayan yük akışında hata fırlatmak |\n| Model çıktısını kuralla doğrulamak | Güç dengesi ve sınırlarla denetim |\n\n> **Mülakatta şöyle söyle:** \"Uzun süren işi istekten ayırıp kuyruğa almıştım. Güvenlik analizinde de binlerce arıza vakası bağımsızdır ve aynı desenle koşar.\"\n\n> **Mülakatta şöyle söyle:** \"Bozuk girdiyi sessizce yutmak yerine reddedip nedenini dönüyordum. Yazdığım yük akışı kodu da yakınsamazsa boş sonuç dönmüyor, artık geçmişini taşıyan bir hata fırlatıyor.\"\n\n> **Mülakatta şöyle söyle:** \"Model çıktısını kuralla doğrulamadan sisteme yazmıyordum. Şebekede bunun karşılığı, öğrenen modelin sonucunu güç dengesi ve sınırlarla denetlemek.\"\n\n## Adım 5: gelecek zor sorular\n\nHer sorunun cevabını önceden yaz. \"Cevabın yönü\" sütunu, cevabın hangi yöne gitmesi gerektiğini gösterir.\n\n| No | Soru | Cevabın yönü |\n| --- | --- | --- |\n| 1 | \"Bu projelerin güç sistemiyle ne ilgisi var?\" | Dürüst cevap ve köprü |\n| 2 | \"Oradaki hata bir belgeyi yanlış okumaktı. Burada hata bir bölgenin karanlıkta kalması. Bu farkı nasıl yönetirsin?\" | Güvenlik açısından kritik yazılım: fizik tabanlı denetim, insan onayı, kademeli devreye alma, geri dönüş planı, gölge modda çalıştırma |\n| 3 | \"Teknik liderdin. Burada en kıdemsiz araştırmacı olacaksın. Sorun olur mu?\" | `19/02` |\n| 4 | \"Hangi mimari kararından pişmansın?\" | Gerçek bir örnek; ne öğrendin |\n| 5 | \"Ölçek dediğin sayı ne? Nasıl ölçtün?\" | Sayı ve ölçüm yöntemi |\n| 6 | \"Bu sistemi sen mi tasarladın, ekip mi?\" | Kendi payını ayır |\n\nİkinci sorudaki \"gölge modda çalıştırma\", yeni sistemin gerçek veriyle çalışıp sonucunun henüz kullanılmaması, yalnızca eskisiyle karşılaştırılmasıdır.\n\nAşağıdaki konuşma bir şablondur. Köşeli parantezleri kendi gerçeğinle doldur. Proje adı uydurma.\n\n## 90 saniye\n\n(Şablon. Köşeli parantezleri kendi gerçeğinle doldur.)\n\n\"[Kaç] yıldır üretimde çalışan yazılım sistemleri geliştiriyorum; en çok emek verdiğim ikisi [proje: tek cümle] ve [proje: tek cümle]. Enerji alanında projeler değildi. Taşıdığım şey üç tür karar: veri akışında [karar], ölçeklemede [karar], güvenlikte [karar]. Şebeke analiz yazılımında aynı sorular var: bozuk ölçümü sessizce yutmamak, binlerce bağımsız arıza vakasını paralel koşmak, sonucun hangi model sürümünden üretildiğini izlemek. Eksik olan alan bilgisi; onu kapatmak için yük akışını ve durum kestirimini sıfırdan yazıp doğruladım.\"\n"}, {"id": "17-Yenilenebilir-ve-Akilli-Sebeke/00-Alt-Basliklar.md", "group": "17  Yenilenebilir ve akıllı şebeke", "title": "17 — Yenilenebilir, depolama, akıllı şebeke", "body": "# 17 — Yenilenebilir, depolama, akıllı şebeke\n\nBu klasör, güneş ve rüzgâr gibi yenilenebilir kaynakların şebekeye nasıl bağlandığını, bataryaların ne işe yaradığını ve \"akıllı şebeke\" denince gerçekte neyin kastedildiğini anlatır. Aşağıdaki liste klasörün içindekiler tablosudur. Her maddenin yanında o başlıkta ne öğreneceğin bir cümleyle yazıyor.\n\nKonular iki sayfaya dağılmış durumda:\n\n- [01-Evirici-Depolama-Sebeke-Kodu.md](01-Evirici-Depolama-Sebeke-Kodu.md): evirici türleri, enerji ve kapasite kavramları, depolama, akıllı şebeke, güç kalitesi, model seçimi.\n- [02-Sebeke-Kodu-Lisanssiz-Uretim-Depolama.md](02-Sebeke-Kodu-Lisanssiz-Uretim-Depolama.md): şebeke kodunun dört temel gereksinimi, lisanssız üretim ve mahsuplaşma, depolamanın kullanım alanları, elle hesap örnekleri.\n\n## Alt başlıklar\n\n1. **Kaynak türleri ve şebekeye bağlanma biçimi:** güneş ve rüzgârın şebekeye doğrudan değil, bir güç elektroniği cihazı (evirici) üzerinden bağlandığını ve bunun neden önemli olduğunu öğreneceksin.\n2. **Şebeke takip ve şebeke oluşturan evirici:** şebekeyi izleyen evirici ile kendisi gerilim ve frekans kuran evirici arasındaki farkı ve bu farkın kararlılığa etkisini öğreneceksin.\n3. **Arıza katkısı ve arıza boyunca kalma (fault ride through):** eviricinin arızada ne kadar akım verdiğini ve gerilim çökünce neden hemen ayrılmaması gerektiğini öğreneceksin.\n4. **Gerilim ve frekans desteği, LFSM:** eviricinin reaktif güçle gerilimi, aktif güçle frekansı nasıl desteklediğini ve LFSM'nin (Limited Frequency Sensitive Mode, Sınırlı Frekans Duyarlı Mod) eşiklerini öğreneceksin.\n5. **Rampa, kısıntı, kapasite faktörü, ELCC:** yenilenebilir üretimin yıl boyunca ve puant saatinde ne kadar işe yaradığını ölçen kavramları, ELCC (Effective Load Carrying Capability, Etkin Yük Taşıma Kapasitesi) dahil, öğreneceksin.\n6. **Barındırma kapasitesi ve bağlantı:** bir fiderin hiçbir sınırı bozmadan ne kadar üretim kaldırabileceğini ve bu sınırı ucuzdan pahalıya nasıl artıracağını öğreneceksin.\n7. **Depolama: enerji, güç, süre, hizmetler:** bir bataryayı tanımlayan dört sayıyı ve bataryanın hangi hizmetlere hangi zaman ölçeğinde satılabileceğini öğreneceksin.\n8. **Talep tarafı ve elektrikli araç:** tüketicinin yükünü kaydırmasının ve araç şarjının şebekeyi nasıl etkilediğini öğreneceksin.\n9. **Akıllı şebeke bileşenleri:** akıllı şebekenin ölçüm, kumanda, iletişim, yazılım ve müşteri katmanlarını abartısız bir listeyle öğreneceksin.\n10. **Mikro şebeke ve ada:** bilerek planlanmış ada çalışması ile kazara oluşan ada arasındaki farkı öğreneceksin.\n11. **Güç kalitesi: harmonik, fliker, dengesizlik:** gerilim dalga biçimini bozan üç sorunun nereden geldiğini ve yönetmelikteki dengesizlik sınırlarını öğreneceksin.\n12. **Şebeke yönetmeliği yükümlülükleri:** rüzgâr ve güneş santrallerinden yönetmeliğin ne istediğini ve bu koşulların Türkiye'de nerede yazdığını öğreneceksin.\n13. **Düşük atalet senaryosu:** dönen jeneratörler azalıp eviriciler arttıkça frekansın neden daha hızlı değiştiğini öğreneceksin.\n14. **Modelleme: statik, RMS, EMT hangisi:** hangi soruda statik yük akışı, hangisinde RMS (Root Mean Square, etkin değer tabanlı fazör benzetimi), hangisinde EMT (Electromagnetic Transient, elektromanyetik geçici hal benzetimi) kullanılacağını öğreneceksin.\n"}, {"id": "17-Yenilenebilir-ve-Akilli-Sebeke/01-Evirici-Depolama-Sebeke-Kodu.md", "group": "17  Yenilenebilir ve akıllı şebeke", "title": "Yenilenebilir, depolama, akıllı şebeke", "body": "# Yenilenebilir, depolama, akıllı şebeke\n\n## Bu konu neden önemli\n\n2025 sonunda kurulu güç artışının büyük kısmı güneş ve rüzgârdır. Kurulu güç, santrallerin etiketinde yazan en yüksek üretim gücünün toplamıdır.\n\nBu yüzden grubun entegrasyon, uyumluluk, depolama ve akıllı şebeke maddeleri ilanın gövdesindedir. Yani bunlar ilanda kenar süs değil, ana iş tanımının parçasıdır.\n\n“Yenilenebilir iyidir” bir analiz cümlesi değildir. Mülakatta senden beklenen, bu kaynakların şebekeye nasıl davrandığını sayı ve mekanizmayla anlatmandır.\n\n## Evirici\n\nEvirici (inverter), güneş panelinin ya da rüzgâr türbininin ürettiği elektriği şebekenin alternatif akımına (AC, Alternating Current) çeviren güç elektroniği cihazıdır. Güneş ve rüzgâr şebekeye klasik jeneratör gibi doğrudan değil, bu cihaz üzerinden bağlanır.\n\n### Şebekeyi takip eden evirici\n\nÇoğu güneş ve rüzgâr, şebekeyi takip eden (grid-following) eviriciyle bağlanır. Bu evirici şöyle çalışır:\n\n1. Fazörü şebekeden kilitler. Fazör, gerilimin genliğini ve açısını gösteren vektördür. Evirici bu açıyı şebekeden okur ve ona uyar.\n2. Akımı bu referansa göre basar. Yani gerilimi kendisi kurmaz; var olan gerilime akım enjekte eder.\n\nBunun iki sonucu vardır:\n\n- **Doğal atalet yoktur.** Atalet, dönen jeneratör kütlesinin frekans değişimine direnmesidir. Evirici dönen bir kütle taşımadığı için bunu kendiliğinden vermez.\n- **Doğal arıza akımı yoktur.** Arıza akımı kontrolcüyle sınırlanır. Çoğu üründe yaklaşık 1,1–1,5 kat nominal civarındadır. Nominal, cihazın anma (etiket) akımıdır.\n\nDikkat: üretici belgesine bakılmadan arıza akımı için sayı söylenmez.\n\n### Şebeke oluşturan evirici\n\nŞebeke oluşturan (grid-forming) kontrol, gerilim ve frekans kaynağı gibi davranır. Yani şebekeyi takip etmez; gerilimi ve frekansı kendisi kurar.\n\nŞu üç konunun kapısı burasıdır:\n\n- **Ada:** şebekenin bir parçasının ana şebekeden ayrılıp kendi başına beslenmesi.\n- **Zayıf şebeke:** kısa devre gücü düşük, gerilimi kolay oynayan şebeke.\n- **Sentetik atalet:** eviricinin kontrol yazılımıyla atalete benzer tepki vermesi.\n\nKontrol modu değişince kararlılık modeli de değişir. “Bütün eviriciler aynıdır” yanlış cevaptır. Önce kontrol modunu sor.\n\n### Arıza boyunca kalma (FRT)\n\nFRT (Fault Ride Through), arıza boyunca bağlı kalma demektir.\n\nGerilim çökünce hemen ayrılmak, arızayı üretim kaybına çevirir. Kısa süren bir hat arızası, birçok santralin aynı anda ayrılmasıyla büyük bir güç açığına dönüşür.\n\nYönetmelik, belirli bir gerilim-süre eğrisinin altında bağlı kalmayı ve toparlanmayı ister.\n\n> **Mülakatta şöyle söyle:** Eğrinin sayılarını ezberlemek yerine “FRT eğrisi ve üretici modeli olmadan dinamik çalışma kapanmaz” de. Sayı sorulursa güncel şebeke yönetmeliği ekinin o tarihteki haline bak.\n\n### Reaktif destek\n\nReaktif güç, gerilimi ayakta tutan güç bileşenidir. Evirici bunu iki durumda verir:\n\n| Durum | Ne verir |\n| --- | --- |\n| Normal işletme | Güç faktörü bandı içinde reaktif güç |\n| Arıza | Ek reaktif akım |\n\nDağıtımda iki yaygın kontrol vardır:\n\n| Kontrol | Ne yapar |\n| --- | --- |\n| Volt-var | Gerilime göre reaktif güç ayarlar; dağıtımda gerilim yükselmesini keser |\n| Volt-watt | Gerilim çok yükselirse aktif gücü kısar |\n\nİkisi çatışırsa hangisinin önce geleceği ayar meselesidir.\n\n### Frekans desteği: LFSM\n\nLFSM (Limited Frequency Sensitive Mode), sınırlı frekans duyarlı moddur. Frekans belirli eşikleri aşınca santral aktif gücünü değiştirir.\n\nLFSM eşikleri 49,8 ve 50,2 Hz’dir (Hz: hertz, saniyedeki salınım sayısı; Türkiye şebekesinin anma frekansı 50 Hz).\n\nPrimer hizmet sözleşmesi olan santral ile sadece bu yükümlülüğü olan santral aynı rezervi vermez. Primer hizmet, frekans sapmasına saniyeler içinde sürekli tepki veren frekans kontrolüdür; LFSM ise yalnızca eşik aşılınca devreye girer.\n\n## Enerji ve kapasite\n\n### Kapasite faktörü ve ELCC\n\n| Kavram | Tanım | Ne anlatır |\n| --- | --- | --- |\n| Kapasite faktörü | Yıllık enerjinin, tam güçle geçen yıla oranı | Santralin yıl boyunca ortalama ne kadar çalıştığı |\n| ELCC (Effective Load Carrying Capability, etkin yük taşıma kapasitesi) | Puant saatine denk gelen güvenilir katkı | Tüketimin en yüksek olduğu saatte santrale ne kadar güvenebileceğin |\n\nKapasite faktörü rüzgâr ve güneş için birbirinden çok farklıdır ve bölgeye göre değişir.\n\nÖğlen güneşi akşam puantının ELCC’sine az yazar. Puant, tüketimin en yüksek olduğu saattir; akşam puantında güneş batmış olur.\n\nPlanlamada isim plakasını (etiket gücünü) toplamak bu yüzden yanlıştır.\n\n### Rampa ve esneklik\n\nRampa, net yükün hızlı yükselmesi ya da düşmesidir. Net yük, toplam tüketimden yenilenebilir üretimin çıkarılmış halidir.\n\nGüneş batımı ve rüzgâr cephesi, net yükü saat mertebesinde yükseltir.\n\nEsneklik, bu rampayı karşılayacak iki şeydir:\n\n- **MW/dakika:** gücün dakikada ne kadar artırılabildiği (MW: megavat, güç birimi).\n- **MWh:** bu artışı ne kadar süre sürdürebilecek enerji (MWh: megavat-saat, enerji birimi).\n\n### Kısıntı\n\nKısıntı, iletim kısıtı veya asgari üretim (must-run, sistemin güvenliği için çalışmak zorunda olan santraller) yüzünden üretimin bilerek kesilmesidir.\n\nSıfır kısıntı hedefi, her saatte şebekeyi o üretime göre fazladan inşa etmek demektir. Bu yüzden biraz kısıntı ekonomik olarak normaldir.\n\nEkonomik kısıntı ile güvenlik kısıntısı ayrı raporlanır.\n\n### Tahmin hatası ve yedek\n\nTahmin hatası yedek boyutunu belirler. Gün öncesi rüzgâr hatası ile saat öncesi hata aynı rezervi gerektirmez; ufuk kısaldıkça hata küçülür.\n\nYTBS (Yük Tevzi Bilgi Sistemi, MAM’ın enerji yönetim platformu) ve TEİAŞ (Türkiye Elektrik İletim A.Ş.) RİTM hattı (rüzgâr izleme ve tahmin) bu yüzden işletme aracıdır. Ayrıntı `18` içindedir.\n\n## Depolama\n\nDört sayısı olmadan batarya anlatılmaz:\n\n| Sayı | Birim | Ne söyler |\n| --- | --- | --- |\n| Güç | MW | Bir anda ne kadar hızlı verebildiği |\n| Enerji | MWh | Toplamda ne kadar enerji tuttuğu |\n| Süre | saat | Tam güçte kaç saat dayandığı (enerji / güç) |\n| Verim | % | Şarj edilen enerjinin ne kadarının geri alındığı |\n\n2 saatlik batarya ile 15 dakikalık batarya farklı hizmettir.\n\nHizmetler çakışabilir:\n\n- Enerji arbitrajı (ucuz saatte şarj)\n- Puant tıraşlama\n- Frekans rezervi\n- Rampa ve kısıntı emme\n- Dağıtımda gerilim ve fider ömrü\n- Siyah start ve ada, ancak kontrol ve koruma tasarlanmışsa\n\nTerimler:\n\n- **Arbitraj:** ucuz saatte alıp pahalı saatte satmak.\n- **Puant tıraşlama:** en yüksek tüketim anında bataryadan vererek tepeyi kırpmak.\n- **Fider:** trafo merkezinden çıkan dağıtım hattı.\n- **Siyah start:** tamamen çökmüş şebekeyi dış besleme olmadan yeniden enerjilendirmek.\n\nAynı MWh iki hizmete aynı anda satılamaz. Optimizasyon, hizmet önceliğini kısıt olarak yazmalıdır.\n\nPompalı hidro, süreyi saatlerden günlere çıkarır. Yerleşimini coğrafya seçer; batarya gibi her TM’ye (trafo merkezi) konmaz.\n\n## Akıllı şebeke\n\nAbartısız liste:\n\n| Katman | Bileşenler |\n| --- | --- |\n| Ölçüm | PMU iletimde, AMI dağıtımda, trafo çıkışı sayaçları |\n| Kumanda | Uzaktan anahtar, OLTC, kapasitör, evirici ayar noktası |\n| İletişim | Fiber, kuranportör, hücresel. Gecikme ve kesinti, koruma şemasının varsayımıdır |\n| Yazılım | DMS, OMS, EMS, tahmin, optimizasyon |\n| Müşteri | Talep kaydırma, araç şarjı, çatı güneş |\n\nKısaltmalar:\n\n- **PMU** (Phasor Measurement Unit): fazör ölçüm birimi. Gerilim ve akım fazörünü zaman damgasıyla, saniyede onlarca kez ölçer.\n- **AMI** (Advanced Metering Infrastructure): gelişmiş sayaç altyapısı, yani uzaktan okunan akıllı sayaçlar.\n- **OLTC** (On-Load Tap Changer): yük altında kademe değiştirici. Trafonun sarım oranını değiştirerek gerilimi ayarlar.\n- **Kuranportör:** enerji hattının kendi iletkeni üzerinden haberleşme.\n- **DMS** (Distribution Management System): dağıtım yönetim sistemi.\n- **OMS** (Outage Management System): kesinti yönetim sistemi.\n- **EMS** (Energy Management System): iletimde enerji yönetim sistemi.\n\nAkıllı şebeke yeni bir fizik değildir. Aynı P–δ ve Q–V ilişkisi, daha sık ölçü ve daha küçük kontrol adımıyla işletilir:\n\n- **P–δ:** aktif güç (P) ile iki uç arasındaki gerilim açısı farkı (δ) arasındaki ilişki.\n- **Q–V:** reaktif güç (Q) ile gerilim genliği (V) arasındaki ilişki.\n\nÖlçü yoksa “akıllı” algoritma pseudo-ölçüme (gerçek ölçüm yerine tahminle doldurulan değer) yaslanır ve bunu gizlememelidir.\n\n### Mikro şebeke ve ada\n\n| Durum | Ne demek | Ne yapılır |\n| --- | --- | --- |\n| Mikro şebeke | Bilinçli ada planı | Şebeke oluşturan kaynak, topraklama ve koruma yeniden kurulur |\n| Kazara ada | Planlanmamış ayrılma | Anti-islanding (adalanmayı önleme) ile söndürülmesi gerekir |\n\nİkisini aynı kelimeyle anlatma.\n\nDağıtım rölesi, ada içinde yön değiştiren akışa göre ayarlı değildir. Bu yüzden bilinçli adada koruma yeniden kurulmak zorundadır.\n\n## Güç kalitesi\n\n| Sorun | Nereden gelir |\n| --- | --- |\n| Harmonik | Evirici anahtarlaması ve doğrusal olmayan yük |\n| Fliker | Rüzgâr ve kaynak makinesinin gerilim oynaması |\n| Dengesizlik | Tek fazlı bağlanan güneş |\n\nTerimler:\n\n- **Harmonik:** 50 Hz’in tam katlarındaki istenmeyen bileşenler; dalga biçimini bozar.\n- **Fliker:** gerilimdeki hızlı, tekrarlı oynamalar; lambada titreme olarak görülür.\n- **Dengesizlik:** üç fazın gerilimlerinin eşit olmaması.\n\nYönetmelikte gerilim dengesizliği için negatif bileşen oranları vardır. Negatif bileşen, dengesizliği ölçen simetrili bileşendir; oranı ne kadar büyükse fazlar o kadar dengesizdir.\n\nNormal işletmede, ölçümün %95’inde:\n\n| Gerilim seviyesi (kV: kilovolt) | Sınır |\n| --- | --- |\n| 400 kV | %1 |\n| 154 kV | %1,5 |\n| Altı | %2 mertebesi |\n\nTEİAŞ onayıyla belirli beslemelerde biraz daha yüksek olabilir.\n\nSayıyı okurken “yüzde 95, 10 dakikalık ortalama” koşulunu düşürme. Anlık bir örneklem ihlal değildir.\n\n## Model seçimi\n\nSoruyu önce süre ölçeğine koy, sonra modeli seç:\n\n| Soru | Model |\n| --- | --- |\n| Yıllık enerji ve barındırma | Statik yük akışı zaman serisi |\n| N-1 termik | AC veya DC elek |\n| FRT ve kontrol | RMS, kontrol bloğuyla |\n| Adım değişimi, harmonik, ada geçişi | EMT |\n\nTerimler:\n\n- **Barındırma:** bir fiderin sınır bozmadan kaldırabileceği üretim.\n- **N-1:** herhangi bir tek elemanın (hat, trafo) devre dışı kaldığı durum. N-1 termik, bu durumda hatların ısıl sınırının aşılıp aşılmadığıdır.\n- **AC veya DC elek:** AC tam yük akışı ya da DC (Direct Current) yaklaşık yük akışı.\n- **RMS** (Root Mean Square): etkin değer tabanlı fazör benzetimi; saniyeler mertebesindeki elektromekanik olaylar için.\n- **EMT** (Electromagnetic Transient): elektromanyetik geçici hal benzetimi; milisaniye altı dalga biçimi olayları için.\n\nÜçünü bir vakada aynı anda koşmak çoğu projede gereksizdir.\n\n> **Sade anlatım:** Yıllık soru için hızlı ve kaba model, saniyelik soru için RMS, milisaniyelik soru için EMT. Ne kadar kısa olay, o kadar ayrıntılı ve yavaş model.\n\nAşağıdaki metin mülakatta 90 saniyede söyleyebileceğin özettir.\n\n## 90 saniye\n\n“Yenilenebilirde önce eviricinin takip mi oluşturan mı olduğunu sorarım. Takip eden doğal atalet ve büyük arıza akımı vermez; FRT eğrisiyle bağlı kalır. Kurulu güç ile ELCC ayrıdır, net yük rampası planlamanın yeni puantıdır. Depolamada MW, MWh ve hizmet önceliği yazılır. Akıllı şebeke yeni fizik değil, daha sık ölçü ve daha küçük kontrol adımıdır. Kazara ada ile bilinçli mikro şebeke ayrı tasarımdır.”\n"}, {"id": "17-Yenilenebilir-ve-Akilli-Sebeke/02-Sebeke-Kodu-Lisanssiz-Uretim-Depolama.md", "group": "17  Yenilenebilir ve akıllı şebeke", "title": "Şebeke kodu, lisanssız üretim, depolama", "body": "# Şebeke kodu, lisanssız üretim, depolama\n\nBu sayfa üç konuyu anlatır: eviricili santrallerden şebeke kodunun ne istediği, lisanssız üretimin ve mahsuplaşmanın şebekeye etkisi, depolamanın hangi işlerde kullanıldığı.\n\n## Etiketlerin anlamı\n\nSayfadaki bilgilerin ne kadar güvenilir olduğunu şu etiketler gösterir:\n\n| Etiket | Anlamı |\n| --- | --- |\n| **Doğrulandı** | Resmî kaynakta Kasım 2026'da okundu |\n| **İkincil** | Resmî olmayan kaynak veya genel bilgi |\n| **Genel** | Uluslararası tipik uygulama; Türkiye'nin değeri değildir |\n| **Doğrula** | Mülakattan önce resmî metne bak |\n\n## Şebeke kodu neden var\n\nSenkron generatör, şebekeye fiziği gereği destek olur:\n\n- **Atalet verir:** dönen kütlesi frekansın ani değişmesine di
