n satır her üretecin alt ve üst sınırıdır.\n\n```\nen küçük   Σ c_i g_i\nöyle ki    Σ g_i = Σ d_i                                   (güç dengesi)             ← λ\n           −F_l ≤ Σ_k PTDF_l,k (g_k − d_k) ≤ F_l           (hat sınırları)           ← μ_l\n           g_i,min ≤ g_i ≤ g_i,max\n```\n\nSemboller:\n\n| Sembol | Anlamı |\n| --- | --- |\n| c_i | Üreteç i'nin birim maliyeti |\n| g_i | Üreteç i'nin üretimi |\n| d_i | Bara i'deki yük |\n| F_l | Hat l'nin taşıma sınırı |\n\nMaliyet doğrusal veya parçalı doğrusal ise bu bir doğrusal programdır, yani LP'dir (Linear Programming).\n\nLP olmasının dört faydası vardır:\n\n- Milisaniyelerde çözülür.\n- Her zaman genel en iyiyi verir.\n- Her kısıtın gölge fiyatını bedavaya üretir.\n- Piyasa eşleştirme ve güvenlik kısıtlı dağıtım yazılımlarının temelidir.\n\n## Gölge fiyat ve LMP\n\n**Gölge fiyat** (ikil değişken): Bir kısıtın sağ tarafı bir birim gevşetilirse amaç işlevi ne kadar iyileşir, onu söyler. Bağlamayan kısıtın gölge fiyatı sıfırdır.\n\n**Bölgesel marjinal fiyat (LMP):** Belirli bir barada yük 1 MW artarsa toplam maliyet ne kadar artar, onu söyler.\n\nLMP'nin üç bileşeni vardır. Aşağıdaki blokta ilk satır bileşenleri toplar. İkinci satır kısıt bileşeninin nasıl hesaplandığını gösterir: her hattın gölge fiyatı, o baranın o hat üzerindeki PTDF'siyle çarpılır ve eksi işaretle toplanır.\n\n```\nLMP_k = λ (enerji)  +  kısıt bileşeni  +  kayıp bileşeni\nkısıt bileşeni = −Σ_l μ_l × PTDF_l,k\n```\n\nKısıt yoksa ve kayıp ihmal edilirse bütün baralarda LMP aynıdır ve `λ`'ya eşittir. Bir hat dolunca fiyatlar ayrışır.\n\n> **Sade anlatım:** Hatlar boşken elektrik her yere aynı fiyata gider. Bir hat dolunca bazı baralara ucuz elektrik ulaşamaz ve oradaki fiyat yükselir.\n\n### Elle örnek\n\n**Şebeke kurulumu.** Bu adım, hesapta kullanılacak bütün verileri bir araya getirir.\n\n`03` klasöründeki üç baralı şebeke kullanılır:\n\n| Bara | İçerik |\n| --- | --- |\n| Bara 1 | G1 üreteci, 10 TL/MWh (megavatsaat başına Türk lirası). Referans bara |\n| Bara 2 | G2 üreteci, 30 TL/MWh |\n| Bara 3 | 150 MW yük |\n\nÜreteçlerin kapasitesi 200 MW'tır.\n\n**Hat akışı formülü.** Bu adım, hat 1–3'ün akışını yalnızca g_2 cinsinden yazarak sınırla karşılaştırılabilir hale getirir.\n\nHat 1–3'ün PTDF değerleri: bara 2 için −0,1818, bara 3 için −0,6364. Referans bara (bara 1) için PTDF sıfırdır, bu yüzden g_1 formüle girmez.\n\n```\nHat 1–3 akışı = −0,1818 × g_2 − 0,6364 × (−150) = 95,45 − 0,1818 g_2\n```\n\n**Kısıtsız durum.** Bu adım, hat sınırı yokken ulaşılacak en ucuz çözümü ve buna karşılık gelen akışı bulur.\n\nUcuz olan hepsini üretir: `g_1 = 150`, `g_2 = 0`.\n\n- Maliyet 1.500 TL/saat.\n- Hat 1–3 akışı 95,5 MW.\n- Bütün baralarda fiyat 10 TL/MWh.\n\n**Hat 1–3 sınırı 80 MW.** Bu adım, sınır eklenince pahalı üretecin en az ne kadar çalışması gerektiğini ve yeni maliyeti bulur.\n\nAşağıda ilk satır akış sınırını g_2 için çözer. İkinci satır güç dengesinden g_1'i bulur. Üçüncü satır toplam maliyeti hesaplar.\n\n```\n95,45 − 0,1818 g_2 ≤ 80   →   g_2 ≥ 85\ng_2 = 85,  g_1 = 65\nMaliyet = 65 × 10 + 85 × 30 = 3.200 TL/saat\n```\n\n**Kısıt maliyeti.** Bu adım, hat sınırının sisteme toplam bedelini gösterir: 3.200 − 1.500.\n\nKısıt maliyeti saatte 1.700 TL.\n\n**Hattın gölge fiyatı.** Bu adım, hat sınırını 1 MW gevşetmenin kaç TL kazandırdığını bulur; bu sayı μ'dür.\n\nSınır 81 MW olsaydı: `g_2 ≥ 79,5`. Yani 5,5 MW pahalı üretim ucuzuyla yer değiştirir. Her MW'ta kazanç 30 − 10 = 20 TL'dir.\n\n```\nμ = 5,5 × (30 − 10) = 110 TL/MW·saat\n```\n\nHattın kapasitesini 1 MW artırmanın saatlik değeri 110 TL'dir. İletim yatırımının fayda hesabı bu sayıdan başlar (`12/02`).\n\n**Bara 3'ün LMP'si.** Bu adım, bara 3'te 1 MW ek yükün toplam maliyeti ne kadar artırdığını doğrudan hesaplar.\n\nBara 3'te yük 1 MW artsın. Hat sınırda kaldığı için akış değişmemeli.\n\nAşağıda ilk satır, akışın sabit kalması için G2'nin ne kadar artması gerektiğini bulur. İkinci satır, güç dengesinden G1'in ne kadar değişeceğini bulur. Üçüncü satır, bu iki değişikliğin maliyetini toplar.\n\n```\nAkış değişimi = −0,1818 Δg_2 + 0,6364 = 0   →   Δg_2 = +3,5 MW\nGüç dengesi:    Δg_1 + Δg_2 = 1               →   Δg_1 = −2,5 MW\nMaliyet değişimi = 3,5 × 30 − 2,5 × 10 = 80 TL\n```\n\n**LMP_3 = 80 TL/MWh.** Sistemdeki en pahalı santral 30 TL/MWh iken bara 3'teki fiyat 80 çıktı.\n\nNeden: bara 3'e 1 MW daha göndermek için pahalı santrali 3,5 MW artırıp ucuz santrali 2,5 MW **azaltmak** gerekiyor. Elektrik istediğin yoldan akmaz; akışı yeniden biçimlendirmenin bedeli fiyata yansır.\n\n> **Sade anlatım:** Bara 3'e 1 MW yollamak için 1 MW üretmek yetmiyor. Hattı aşmamak için ucuz santrali kısıp pahalıyı fazlasıyla artırmak gerekiyor. Bu \"dolambaçlı yol\"un bedeli 80 TL ediyor.\n\n**Formülle kontrol.** Bu adım, aynı fiyatları LMP formülüyle (λ + μ × PTDF büyüklüğü) bularak doğrudan hesabı doğrular.\n\nAşağıda her satır bir baranın fiyatıdır. Bara 1 referans olduğu için kısıt bileşeni sıfırdır. Bara 2 ve 3'e, 110'luk gölge fiyat ile o baranın PTDF büyüklüğünün çarpımı eklenir.\n\n```\nLMP_1 = 10                                    (referans, marjinal ünite G1)\nLMP_2 = 10 + 110 × 0,1818 = 30                (G2 de marjinal; kendi maliyeti)\nLMP_3 = 10 + 110 × 0,6364 = 80\n```\n\n**Kısıt rantı.** Bu adım, yükün ödediği para ile üreticilerin aldığı para arasındaki farkın nereden geldiğini gösterir.\n\n| Kalem | Hesap | Tutar |\n| --- | --- | --- |\n| Yükün ödediği | `150 × 80` | 12.000 |\n| Üreticilerin aldığı | `65 × 10 + 85 × 30` | 3.200 |\n| Fark | `μ × sınır = 110 × 80` | 8.800 TL |\n\nBu para iletim işletmecisinde birikir. İletim hakkı sahiplerine dağıtılır veya tarifeyi düşürür.\n\n**Doğrulama.** Bütün sayılar `elle_ornekler.py` içinde `scipy.optimize.linprog` (HiGHS) ile doğrulanmıştır.\n\n**Türkiye bağlamı.** Türkiye'de piyasa tek bölgelidir, LMP uygulanmaz (`11/03`). Ama aynı hesap, kısıt talimatlarının maliyetini ve iletim yatırımının değerini bulmak için kullanılır.\n\n## Dışbükey gevşetmeler\n\nFikir: Dışbükey olmayan uygun bölgeyi içine alan dışbükey bir küme üzerinde çöz.\n\nBunun üç sonucu vardır:\n\n- Gevşetilmiş problemin sonucu, gerçek problemin en iyisi için **alt sınırdır**.\n- Gevşetilmiş çözüm aynı zamanda özgün kısıtları sağlıyorsa gevşetme **sıkıdır** (exact). Genel en iyi bulunmuştur ve kanıtlıdır.\n- Sağlamıyorsa çözüm fiziksel değildir. Yine de yerel çözücünün bulduğu noktanın ne kadar iyi olduğunu ölçmek için kullanılır (en iyilik aralığı).\n\n> **Sade anlatım:** Garip biçimli bir bölgeyi bir balonla sararsın. Balonun içindeki en iyi nokta, gerçek bölgedeki en iyiden daha kötü olamaz. Bu en iyi nokta gerçek bölgenin içine düşerse şanslısın: gerçek cevabı bulmuşsundur.\n\n### SOCP: ikinci dereceden konik gevşetme\n\nRadyal (ağaç biçimli, döngüsüz) şebekeler için dal akış modeli kullanılır.\n\nDeğişkenler gerilimin ve akımın **karesi**dir: `v_i = |V_i|²`, `ℓ_ij = |I_ij|²`. Açılar modelden düşer.\n\nAşağıdaki üç satır dal akış modelidir. İlk satır güç dengesidir. İkinci satır gerilim düşümüdür. Üçüncü satır gücü, gerilimi ve akımı birbirine bağlar; problemin dışbükey olmayan tek parçası budur. Burada P etkin güç, Q reaktif güç, r direnç, x reaktanstır.\n\n```\nP_ij − r_ij ℓ_ij − Σ P_jk = p_j                              doğrusal\nv_j = v_i − 2 (r_ij P_ij + x_ij Q_ij) + (r_ij² + x_ij²) ℓ_ij    doğrusal\nℓ_ij v_i = P_ij² + Q_ij²                                     DIŞBÜKEY DEĞİL\n```\n\nTek sorunlu satır sonuncusudur. Eşitlik, eşitsizliğe gevşetilir. Aşağıdaki kısıt bir koni tanımlar ve dışbükeydir:\n\n```\nℓ_ij v_i ≥ P_ij² + Q_ij²          ikinci dereceden koni kısıtı\n```\n\n**Neden çoğu zaman işe yarar:** Amaç kaybı veya maliyeti en aza indiriyorsa çözücü `ℓ`'yi (akımı, dolayısıyla kaybı) gereksiz yere büyütmek istemez. Bu yüzden eşitsizlik kendiliğinden eşitlikle sağlanır.\n\nRadyal şebekede ve hafif koşullar altında (ters akış ve gerilim üst sınırı bağlamıyorsa) gevşetme sıkıdır.\n\n**Kullanım alanları:**\n\n- Dağıtımda volt/VAR (gerilim ve reaktif güç) kontrolü.\n- Yeniden yapılandırma (ikili değişkenlerle karışık tam sayılı SOCP).\n- Barındırma kapasitesi (şebekenin ne kadar dağıtık üretim kaldırabileceği).\n\nTicari çözücülerle büyük ölçekte çözülür.\n\n**Sıkılığın bozulduğu yer:** Yüksek güneş üretimiyle ters akış ve gerilim üst sınırının bağladığı durum. Yani tam da ilgilendiğimiz durum. Sonuç her zaman denetlenir.\n\n### SDP: yarı kesin gevşetme\n\nGözlü (iletim) şebeke için kullanılır. Gözlü şebekede döngüler vardır.\n\n`W = V Vᴴ` matrisi tanımlanır. Burada V gerilim vektörü, Vᴴ onun eşlenik devriğidir. Güç denklemleri gerilimde ikinci dereceden, `W`'de ise **doğrusaldır**.\n\nAşağıdaki iki koşul birlikte `W`'nin gerçekten bir gerilim vektöründen geldiğini garanti eder. İlki dışbükeydir ve tutulur. İkincisi dışbükey değildir ve atılır; gevşetme budur.\n\n```\nW ⪰ 0            (yarı kesin pozitif)       dışbükey\nrank(W) = 1      (W gerçekten V Vᴴ biçiminde)   DIŞBÜKEY DEĞİL  →  atılır\n```\n\nÇözümün rankı 1 çıkarsa gevşetme sıkıdır ve gerilimler `W`'den geri elde edilir. Birçok standart test sisteminde sıkı çıktığı gösterilmiştir; her zaman değil.\n\n**Sorunu ölçektir:** `W`, `n × n` boyutundadır. Binlerce baralı sistemde doğrudan çözülemez. Seyrekliği kullanan ayrıştırma (kordal genişletme) gerekir.\n\nBu yüzden SDP araştırmada ve en iyilik aralığını ölçmede kullanılır, gerçek zamanlı işletmede değil.\n\n### SOCP ile SDP karşılaştırması\n\n| Özellik | SDP | SOCP |\n| --- | --- | --- |\n| Sıkılık | SOCP'den sıkıdır | Daha gevşek |\n| Hız | Daha yavaş | Daha hızlıdır |\n| Radyal şebekede | İkisi eşdeğerdir | İkisi eşdeğerdir |\n\n## Belirsizlik altında eniyileme\n\nRüzgâr, güneş ve yük tahminle bilinir. Karar (hangi ünite devrede, ne kadar yedek) belirsizlik çözülmeden verilir.\n\nDört yaklaşım vardır:\n\n| Yaklaşım | Belirsizliği nasıl görür | Neyi eniyiler | Zayıflığı |\n| --- | --- | --- | --- |\n| Deterministik + yedek | Tek tahmin, üstüne sabit pay | Tahmin senaryosunun maliyeti | Pay keyfidir |\n| Stokastik | Olasılıklı senaryolar | **Beklenen** maliyet | Dağılımı bilmek gerekir; senaryo sayısıyla büyür |\n| Dayanıklı (robust) | Belirsizlik kümesi (aralık) | **En kötü durum** maliyeti | Tutucudur |\n| Şans kısıtlı | Dağılım | Maliyet; kısıt en az `1 − ε` olasılıkla sağlanır | Dağılım varsayımı |\n\nİki aşamalı yapı hepsinde ortaktır:\n\n| Aşama | Ne zaman | Örnek kararlar |\n| --- | --- | --- |\n| Birinci aşama | **Şimdi**, belirsizlik çözülmeden | Ünite tahsisi, yedek |\n| İkinci aşama | Belirsizlik çözüldükten **sonra** | Dağıtım, yük atma |\n\n### Elle örnek: ne kadar yedek tutmalı\n\n**Veriler.** Bu adım, karşılaştırılacak maliyetleri ve olasılıkları tanımlar.\n\n- Yedek tutmanın maliyeti 20 TL/MW.\n- Yedek yetmezse verilemeyen gücün cezası 200 TL/MW.\n\nRüzgâr tahmin hatasından doğan açık için üç senaryo:\n\n| Senaryo | Açık | Olasılık |\n| --- | --- | --- |\n| Tahmin tuttu | 0 MW | 0,60 |\n| Orta sapma | 50 MW | 0,35 |\n| Büyük sapma | 150 MW | 0,05 |\n\n**Üç seçeneğin maliyeti.** Bu adım, her yedek miktarı için yedek bedeli ile beklenen ceza bedelini toplar.\n\nAşağıda her satırın ilk terimi yedek tutma bedelidir (MW × 20). Sonraki terimler, yedeğin yetmediği senaryolarda olasılık × eksik MW × 200 cezasıdır.\n\n```\nYedek 0:    maliyet = 0 + 0,35 × 50 × 200 + 0,05 × 150 × 200 = 3.500 + 1.500 = 5.000\nYedek 50:   maliyet = 50 × 20 + 0,05 × (150 − 50) × 200     = 1.000 + 1.000 = 2.000\nYedek 150:  maliyet = 150 × 20 + 0                           = 3.000\n```\n\n**Sonuçların yorumu.** Bu adım, her yaklaşımın hangi seçeneği seçeceğini gösterir.\n\n| Karar | Yedek | Gerekçe |\n| --- | --- | --- |\n| **Stokastik karar** | 50 MW | Beklenen maliyet en düşük (2.000) |\n| **Dayanıklı karar** | 150 MW | Hiçbir senaryoda açık yok; bedeli 1.000 TL fazla |\n| **Yedeksiz** | 0 MW | En pahalısı |\n\n**Marjinal mantık.** Bu adım, sonucu tek tek MW düzeyinde gerekçelendirir.\n\nKural: Bir MW daha yedek tutmak, \"o MW'a ihtiyaç duyulma olasılığı × ceza\" yedek maliyetinden büyükse değer.\n\n- İlk 50 MW için ihtiyaç olasılığı 0,35 + 0,05 = 0,40'tır: `0,40 × 200 = 80 > 20`. Değer.\n- Sonraki 100 MW için ihtiyaç olasılığı yalnızca 0,05'tir: `0,05 × 200 = 10 \u003c 20`. Değmez.\n\n**Hangisi doğru?** Cezanın gerçekten 200 mü yoksa sistem çökmesi mi olduğuna bağlı.\n\nSonucu geri alınamaz olan durumlarda dayanıklı yaklaşım veya riske duyarlı ölçütler kullanılır. Bunlara örnek CVaR'dır (Conditional Value at Risk, koşullu riske maruz değer). CVaR, en kötü senaryoların ortalama maliyetine bakar.\n\n## Meta-sezgiseller: genetik algoritma, parçacık sürüsü\n\nTürevsiz, popülasyon tabanlı arama yöntemleridir. Aynı anda çok sayıda aday çözümü dener ve iyi olanları geliştirir.\n\nGüç sistemi literatüründe çok yaygındır. Mülakatta ölçülü konuş.\n\n**Mantıklı olduğu yer:**\n\n- Amaç işlevi kara kutudur: her değerlendirme bir benzetim çalıştırır. Örnekler: dinamik benzetimle PSS (Power System Stabilizer, güç sistemi dengeleyicisi) ayarı, koruma koordinasyonu.\n- Problem ayrık, dışbükey değil ve iyi bir matematiksel formülasyonu yok.\n- Çok amaçlı; tek çözüm değil Pareto cephesi isteniyor.\n- Çevrim dışı planlama; \"yeterince iyi\" çözüm yetiyor, süre sorun değil.\n\n**Mantıksız olduğu yer:**\n\n- Problem LP, QP (Quadratic Programming, karesel programlama), MILP (Mixed-Integer Linear Programming, karışık tamsayılı doğrusal programlama) veya SOCP olarak yazılabiliyorsa. Örnekler: ekonomik dağıtım, DC-OPF, ünite tahsisi. Kesin çözücü hem daha hızlıdır hem en iyiliği kanıtlar.\n- Gerçek zamanlı işletme. Sonuç her çalıştırmada farklı çıkar (rastlantısaldır), süre garantisi yoktur.\n- Çözümün ne kadar iyi olduğunu söylemen gerekiyorsa. Meta-sezgisel alt sınır ve en iyilik aralığı vermez.\n- Çok sayıda eşitlik kısıtı varsa. Kısıtlar ceza terimiyle sağlanır; ceza katsayısını ayarlamak ayrı bir problemdir.\n- Gölge fiyata ihtiyaç varsa.\n\nHazır cümle:\n\n> **Mülakatta şöyle söyle:** \"Önce problemi dışbükey veya karışık tam sayılı biçimde yazmaya çalışırım. Yazamıyorsam ve amaç bir benzetimin çıktısıysa meta-sezgisel kullanırım; sonucu bir alt sınırla veya basit bir sezgiselle kıyaslarım.\"\n\n## Araçlar\n\nAraçlar iki gruba ayrılır: modelleme dilleri ve çözücüler.\n\n| Araç | Ne | Ne zaman |\n| --- | --- | --- |\n| **Pyomo** | Python'da cebirsel modelleme dili. Modeli yazarsın, çözücüye o çevirir | Büyük, yapılandırılmış modeller; LP'den doğrusal olmayana her sınıf; çözücü değiştirme özgürlüğü |\n| **CVXPY** | Dışbükey eniyileme için modelleme dili. Dışbükeyliği **kurallarla denetler** | SOCP ve SDP gevşetmeleri, hızlı prototip. Dışbükey olmayan modeli reddeder; bu bir özelliktir |\n| **Gurobi** | Ticari çözücü: LP, QP, MILP, SOCP | En hızlılardan; akademik lisansı ücretsiz. Ürüne gömmek lisans ister |\n| **HiGHS** | Açık kaynak çözücü: LP, MILP, QP | Lisans engeli yok; `scipy.optimize.linprog` ve `milp`'in arkasındaki çözücü |\n| **Ipopt** | Açık kaynak iç nokta çözücü: doğrusal olmayan | AC-OPF için standart yerel çözücü |\n| MOSEK, CPLEX, SCIP | Konik, MILP | MOSEK konik problemlerde güçlü; SCIP açık kaynak |\n| PowerModels.jl | Julia'da OPF formülasyonları kütüphanesi | AC, DC, SOCP, SDP biçimlerini aynı veriyle karşılaştırmak |\n\nModelleme dili ile çözücü ayrı şeylerdir:\n\n- Pyomo ve CVXPY problemi **tarif eder**.\n- Gurobi, HiGHS ve Ipopt **çözer**.\n\nYazılım mimarisinde bu ayrım, çözücüyü değiştirebilmeni sağlar.\n\n### SciPy ile DC-OPF\n\nYukarıdaki DC-OPF, SciPy ile çözülmüştür (çalıştırılıp doğrulandı; tamamı `elle_ornekler.py` içinde).\n\nKod şunları yapar:\n\n- `c`: iki üretecin birim maliyetlerini (10 ve 30 TL/MWh) verir.\n- `A_ub` ve `b_ub`: hat 1–3 akış sınırını yazar. Yükün sabit katkısı sağ tarafa taşınmıştır.\n- `A_eq` ve `b_eq`: üretimin 150 MW yüke eşit olmasını ister.\n- `bounds`: her üreteci 0–200 MW arasında tutar.\n- `method=\"highs\"`: HiGHS çözücüsünü seçer.\n- Son üç satır: üretimi ve maliyeti, hat kısıtının gölge fiyatını ve güç dengesinin gölge fiyatını yazdırır.\n\n```python\nfrom scipy.optimize import linprog\n\nsonuc = linprog(\n    c=[10, 30],                          # TL/MWh\n    A_ub=[[0, -0.181818]],               # hat 1-3 akışı, g2'ye duyarlılık\n    b_ub=[80 - 0.636364 * 150],          # sınır eksi yükün katkısı\n    A_eq=[[1, 1]], b_eq=[150],           # güç dengesi\n    bounds=[(0, 200), (0, 200)],\n    method=\"highs\",\n)\nprint(sonuc.x, sonuc.fun)                # [65. 85.] 3200.0  (yuvarlanmış)\nprint(sonuc.ineqlin.marginals)           # [-110.]  hat kısıtı: sınır 1 MW artarsa maliyet 110 düşer\nprint(sonuc.eqlin.marginals)             # [10.]    güç dengesi: referans baradaki enerji fiyatı λ\n```\n\n**İşarete dikkat:** SciPy, kısıtın sağ tarafı bir birim artınca amacın ne kadar **değiştiğini** verir. Hat sınırını gevşetmek maliyeti düşürdüğü için değer eksidir.\n\nÇözücüler arasında işaret sözleşmesi farklıdır. İlk kullanımda küçük bir örnekle denetle.\n\n**Dürüstlük notu:** Bu makinede Pyomo, CVXPY ve Gurobi kurulu değil. Onlarla yazılmış örnek kod koymadım, çünkü çalıştırıp doğrulayamadım.\n\nMülakatta \"Pyomo veya CVXPY ile üretimde model kurdun mu?\" diye sorulursa cevabın gerçeği olsun.\n\n## Yaygın yanlış\n\nAşağıdaki her madde, sık duyulan yanlış bir cümle ve onun düzeltmesidir.\n\n| Yanlış cümle | Doğrusu |\n| --- | --- |\n| **\"DC-OPF'nin çözümü uygulanabilirdir.\"** | AC'de gerilim ve reaktif sınırları ihlal edebilir. AC yük akışıyla denetlenir. |\n| **\"LMP en pahalı çalışan santralin fiyatını geçemez.\"** | Elle örnekte 30'luk santral varken fiyat 80 çıktı. |\n| **\"Gevşetme her zaman doğru cevabı verir.\"** | Alt sınır verir. Sıkı olup olmadığı denetlenir. |\n| **\"Dayanıklı eniyileme her zaman daha güvenlidir, o halde daha iyidir.\"** | Daha pahalıdır; belirsizlik kümesi kötü seçilirse aşırı tutucu veya yetersiz olur. |\n| **\"Genetik algoritma genel en iyiyi bulur.\"** | Garanti etmez ve bulduğunu kanıtlayamaz. |\n| **\"Çözücü 'optimal' dediyse model doğrudur.\"** | Yanlış kurulmuş modelin en iyisini bulmuştur. |\n| **\"Gölge fiyat her aralıkta geçerlidir.\"** | Yalnızca bağlayan kısıt kümesi değişmediği sürece. |\n\n## Panel takip sorusu\n\nPanel, ana konuşmadan sonra bu soruları sorabilir.\n\n**\"Ünite tahsisi neden zor?\"**\n\n> **Mülakatta şöyle söyle:** \"Aç-kapa kararları ikilidir, asgari çalışma ve durma süreleri dönemleri birbirine bağlar; karışık tam sayılı programdır. Dal-sınır ve kesme düzlemleriyle çözülür; çözücü en iyilik aralığını raporlar ve kabul edilebilir bir aralıkta durdurulur.\"\n\n**\"Çözücü 'uygun çözüm yok' derse ne yaparsın?\"**\n\n> **Mülakatta şöyle söyle:** \"Hangi kısıtların çeliştiğini bulurum (indirgenemez tutarsız alt küme). Sonra katı kısıtları cezalı esnek kısıtlara çevirir, hangisinin ne kadar ihlal edildiğine bakarım. Operatöre 'çözüm yok' değil 'şu hat şu kadar aşılıyor' denir.\"\n\n**\"Stokastik modelde senaryoları nereden alırsın?\"**\n\n> **Mülakatta şöyle söyle:** \"Geçmiş tahmin hatalarından. Çok sayıda senaryo üretir, sonra temsil gücünü koruyarak azaltırım. Örneklem dışı senaryolarla çözümün kalitesini sınarım.\"\n\n### Konuşmanın özeti için hatırlatma\n\nAşağıdaki 90 saniyelik konuşma bu sayfanın ana fikirlerini sırayla toplar: AC'nin dışbükey olmaması, DC modelin gölge fiyatları, bara fiyatının en pahalı santrali aşabilmesi, gevşetmeyle alt sınır, stokastik ile dayanıklı model farkı ve meta-sezgiselin yeri.\n\n## 90 saniye\n\n\"AC optimal güç akışı dışbükey değildir. Hız ve kesinlik gerekince doğrusal DC modelini kullanırım; bu bir doğrusal programdır ve her kısıtın gölge fiyatını verir. Güç dengesinin gölge fiyatı enerji fiyatıdır; dolu bir hattın gölge fiyatı, o hattın bir megavatlık kapasitesinin değeridir. Bara fiyatı, enerji fiyatına hat gölge fiyatı çarpı duyarlılık eklenerek bulunur ve en pahalı santralin fiyatını aşabilir. Daha doğru bir model için konik veya yarı kesin gevşetmeyle alt sınır alır, sıkı olup olmadığını denetlerim. Belirsizlikte stokastik model beklenen maliyeti, dayanıklı model en kötü durumu eniyiler. Meta-sezgiseli yalnızca problem kara kutuysa kullanırım.\"\n"}, {"id": "14-Programlama/00-Alt-Basliklar.md", "group": "14  Programlama", "title": "14 — Programlama", "body": "# 14 — Programlama\n\nBu bölüm, ilandaki programlama maddesini anlatır. Amaç dil ezberi değildir. Bir güç sistemi hesabını doğru, test edilmiş ve ürüne taşınabilir bir kod olarak yazabildiğini gösterebilmektir.\n\nBölümde iki sayfa ve bir örnek kod klasörü var:\n\n- **01 — Python, MATLAB, Java, JavaScript:** dört dilin bu işteki yeri ve her dilde bilmen gerekenler.\n- **02 — Newton-Raphson'ı sıfırdan yazmak:** canlı kodlama provası, seyrek çözücüler, sayısal kararlılık, test ve CI (Continuous Integration, sürekli entegrasyon).\n- **`ornekler` klasörü:** çalışan Python örnekleri.\n\n## Alt başlıklar\n\n1. **Bu kadroda kodun yeri: analiz motoru, veri, servis, arayüz**\n   Kodun hesap motorundan operatör ekranına kadar hangi katmanlarda durduğunu ve senin hangi katmanda çalışacağını öğrenirsin.\n2. **Python: NumPy, SciPy, pandas, seyrek matris**\n   Bilimsel Python kütüphanelerinin hangi işe yaradığını ve büyük şebeke matrisinin neden seyrek tutulduğunu öğrenirsin.\n3. **Güç sistemi kütüphaneleri: pandapower, MATPOWER köprüsü**\n   Hazır yük akışı kütüphanelerini nasıl anlatacağını ve \"paketi kullanan\" ile \"motoru anlayan\" arasındaki farkı öğrenirsin.\n4. **MATLAB: matris, Simulink, MATPOWER**\n   MATLAB'ın prototip ve akademik referans olarak yerini, Simulink ile MATPOWER'ın ne işe yaradığını öğrenirsin.\n5. **Java: neden büyük EMS'te, temel dil, koleksiyon, servis**\n   Büyük EMS'lerin (Energy Management System, Enerji Yönetim Sistemi) neden Java ile yazıldığını ve bir analiz modülünü servise koyarken nelere dikkat edildiğini öğrenirsin.\n6. **JavaScript: operatör arayüzü, grafik, harita**\n   Operatör web arayüzünde araştırmacının bilmesi gerekenleri, yani çizim, grafik ve web servis temellerini öğrenirsin.\n7. **Sayısal doğruluk, seyrek matris, birim testi**\n   Bellek, tekil matris, birim karışıklığı gibi sayısal tuzakları ve bunları yakalayan testleri öğrenirsin.\n8. **Sürüm yönetimi ve tekrarlanabilir hesap**\n   Git kullanımını ve aynı girdinin her seferinde aynı sonucu vermesini nasıl sağlayacağını öğrenirsin.\n9. **Okunabilir kod ve performans nerede ayrılır**\n   Önce doğru ve okunur kod yazıp sonra ölçerek hızlandırmanın neden doğru sıra olduğunu öğrenirsin.\n10. **Mülakatta küçük kod sorusu nasıl çözülür**\n    Kod sorusunda önce sözleşmeyi söyleyip sonra en küçük doğru çözümü yazmayı ve konuşarak ilerlemeyi öğrenirsin.\n11. **Çalışan örnekler: DC yük akışı, WLS, ekonomik dağıtım**\n    `ornekler` klasöründeki DC (doğru akım yaklaşımlı) yük akışı, WLS (Weighted Least Squares, ağırlıklı en küçük kareler) durum kestirimi ve ekonomik dağıtım betiklerini nasıl çalıştıracağını öğrenirsin.\n"}, {"id": "14-Programlama/01-Python-MATLAB-Java-JavaScript.md", "group": "14  Programlama", "title": "Python, MATLAB, Java, JavaScript", "body": "# Python, MATLAB, Java, JavaScript\n\nBu sayfa, ilandaki dört programlama dilinin güç sistemi analiz işinde nerede durduğunu anlatır. Her dil için mülakatta bilmen gerekenleri ve iyi alışkanlıkları verir. Sonunda sayısal hesap ve test tuzaklarını, örnek kodları nasıl çalıştıracağını ve 90 saniyelik konuşma metnini bulursun.\n\n## Sayfa haritası\n\n1. **Dört dil, dört katman:** hangi dil hangi işe yarar, ekibin ürün yığını ne.\n2. **Python:** bilimsel kütüphaneler, pandapower, iyi alışkanlıklar.\n3. **MATLAB:** MATPOWER, Simulink ve prototipten ürüne mesafe.\n4. **Java:** büyük EMS'lerde neden yaygın, analiz modülünü servise koymak.\n5. **JavaScript:** operatör arayüzünde araştırmacının bilmesi gerekenler.\n6. **Sayısal iş ve test:** bellek, tekil matris, birim, test, Git.\n7. **Mülakatta kod sorusu ve örnekler:** cevap sırası ve örnek betikler.\n8. **90 saniye:** mülakatta söyleyeceğin kısa metin.\n9. **Kendini yokla:** sorular ve cevaplar.\n\n## 1. Dört dil, dört katman\n\nİlandaki diller: Java, Python, JavaScript, MATLAB ve \"vb.\". Bu dört dil dört katmandır, dört ayrı meslek değildir. Yani aynı hesap fikirden ekrana giderken farklı dillerden geçer.\n\n| Dil | Bu işte yeri |\n| --- | --- |\n| Python | Analiz betiği, optimizasyon modeli, veri temizleme, makine öğrenmesi, pandapower |\n| MATLAB | Algoritma prototipi, Simulink dinamik model, MATPOWER, üniversite çalışması |\n| Java | Uzun ömürlü sunucu, enerji yönetim modülü, web servis, kurumsal ürün |\n| JavaScript | Operatör ve planlamacı arayüzü, grafik, coğrafi gösterim |\n\n### Ekibin ürün yığını\n\nAynı dönemde yayımlanan aday araştırmacı ilanı, ekibin ürün yığınını daha açık yazar:\n\n- Java,\n- JavaScript,\n- ilişkisel veri tabanı,\n- REST/SOAP,\n- Git,\n- Maven,\n- Jenkins veya GitLab CI.\n\nTerimler:\n\n- **Ürün yığını:** bir yazılım ürününü oluşturan dil, araç ve altyapıların toplamı.\n- **REST** (Representational State Transfer): web üzerinden veri alışverişinin yaygın, hafif yolu. Genelde JSON (JavaScript Object Notation, metin tabanlı veri biçimi) taşır.\n- **SOAP** (Simple Object Access Protocol, Basit Nesne Erişim Protokolü): daha eski, XML (Extensible Markup Language, işaretleme dili) tabanlı web servis protokolü.\n- **Git:** kodun sürümlerini tutan sürüm yönetim aracı.\n- **Maven:** Java projesinin bağımlılıklarını ve derlemesini yöneten araç.\n- **Jenkins / GitLab CI:** her kod değişikliğinde testleri otomatik çalıştıran araçlar. **CI** (Continuous Integration), sürekli entegrasyon demektir.\n\nSenin kadron analiz araştırmacısıdır. Yine de algoritmayı bu yığına teslim edemeyen kişi ürün döngüsünün dışında kalır.\n\n> **Sade anlatım:** Sen hesabı bulan kişisin. Ama hesabın ürüne girmesi için onu ekibin kullandığı dile ve araçlara uygun biçimde teslim edebilmen gerekir.\n\n## 2. Python\n\n### Bilimsel yığın\n\n| Kütüphane | Ne işe yarar |\n| --- | --- |\n| NumPy | Dizi (sayı vektörü ve matrisi) |\n| SciPy | Seyrek doğrusal cebir ve optimizasyon |\n| pandas | Tablo |\n| matplotlib | Çizim |\n\nŞebeke için iki yol var:\n\n- **pandapower:** PowerFactory'ye benzer veri modeli kullanır, arka planda PYPOWER çalışır. PYPOWER, MATPOWER'ın Python'a aktarılmış hâlidir.\n- **Doğrudan SciPy seyrek matris:** hesabı kendin kurarsın.\n\n**Seyrek matris**, elemanlarının çoğu sıfır olan matristir. Şebekede her bara yalnızca birkaç komşusuna bağlıdır. Bu yüzden şebeke matrisleri seyrektir. Seyrek matris yalnızca sıfır olmayanları saklar.\n\nBüyük matriste `numpy.linalg` yoğun çözücü kullanma. `scipy.sparse.linalg` kullan. **Yoğun çözücü**, matrisin bütün elemanlarını, sıfırlar dahil, saklayıp işler.\n\n### İyi alışkanlıklar\n\n- **Birim:** güç, gerilim ve açı aynı birimde olsun. Fonksiyonun başında pu'ya çevir, sonunda MW'ye dön. **pu** (per-unit, birim değer), her büyüklüğün seçilmiş bir baz değere oranıdır.\n- **İşaret sözleşmesi:** gücün hangi yönde pozitif sayıldığını modülün doc'una (açıklama metnine) yaz.\n- **Rastgele tohum:** tohumu sabitle, tahmin kodunda özellikle. **Tohum**, rastgele sayı üretecinin başlangıç değeridir; sabitlenince sonuç her seferinde aynı çıkar.\n- **Elde doğrulanmış test:** her hesap için küçük bir elde doğrulanmış şebeke testi yaz. Üç baralık sistem altın değerdir.\n- **Vektörize et:** Python döngüsüyle her hat için Jacobian doldurmak binlerce barada yavaşlar. Önce doğru, sonra profil. **Vektörize etmek**, döngü yerine bütün diziyi tek işlemle hesaplamaktır. **Profil almak**, kodun zamanını nerede harcadığını ölçmektir.\n\n**Bara**, şebeke modelinde hatların, trafoların ve yüklerin birleştiği düğümdür. **Jacobian**, yük akışı denklemlerinin bilinmeyenlere göre türevlerinden oluşan matristir.\n\n### pandapower'ı nasıl anlatırsın\n\n> **Mülakatta şöyle söyle:** \"Şebekeyi eleman tablolarıyla kurarım, AC yük akışı ve N-1 koşarım, sonucu DataFrame olarak alırım. Özel algoritma gerekirse iç Ybus'u seyrek matris olarak çekip kendi NR'ımı yazarım.\"\n\nCümledeki terimler:\n\n- **AC yük akışı:** alternatif akım şebekesinde gerilimleri ve hat akışlarını tam, doğrusal olmayan denklemlerle hesaplamak.\n- **N-1:** şebekedeki elemanlardan biri devre dışı kaldığında sistemin hâlâ limitler içinde kalıp kalmadığını sınamak.\n- **DataFrame:** pandas'ın tablo nesnesi.\n- **Ybus:** bara admitans matrisi; hangi baranın hangisine hangi admitansla bağlı olduğunu tutar.\n- **NR:** Newton-Raphson, yük akışını yinelemeli çözen yöntem.\n\nBu cümle, paketi kullanan ile motoru anlayan kişiyi ayırır.\n\n## 3. MATLAB\n\n**MATPOWER**, yük akışı ve OPF'in referans akademik aracıdır. **OPF** (Optimal Power Flow, optimal güç akışı), limitlere uyarak en düşük maliyetli işletme noktasını bulan hesaptır.\n\nBilmen gereken adlar:\n\n| Ad | Ne |\n| --- | --- |\n| `runpf` | Yük akışını çalıştırır |\n| `runopf` | OPF'i çalıştırır |\n| `mpc.bus` | İç modelde bara tablosu |\n| `mpc.branch` | İç modelde dal (hat, trafo) tablosu |\n| `mpc.gen` | İç modelde üreteç tablosu |\n\nYeni bir yöntemi önce MATPOWER vakasında göstermek, hakem ve ekip için ortak dildir. **Vaka**, belli bir şebekenin hazır model dosyasıdır.\n\n**Simulink**, AVR-PSS ve evirici kontrolünün blok modelidir.\n\n- **AVR** (Automatic Voltage Regulator, Otomatik Gerilim Regülatörü): jeneratörün çıkış gerilimini ayarlayan kontrolör.\n- **PSS** (Power System Stabilizer, Güç Sistemi Dengeleyicisi): salınımları sönümleyen ek kontrol.\n- **Evirici:** doğru akımı alternatif akıma çeviren güç elektroniği cihazı; güneş ve batarya bağlantısında kullanılır.\n\nÜretime Simulink gömülmez; gömülen, orada doğrulanmış denklem ve kazançtır. **Kazanç**, kontrolördeki ayar katsayısıdır.\n\n\"MATLAB'da çalıştı\" ile \"üründe çalışıyor\" arasındaki mesafe test ve dildir.\n\n> **Sade anlatım:** MATLAB bir laboratuvar tezgâhıdır. Fikri orada denersin. Ürüne giden şey tezgâhın kendisi değil, orada kanıtladığın formüldür.\n\n## 4. Java\n\nBüyük EMS'ler (Energy Management System, Enerji Yönetim Sistemi) uzun süre ayakta kalan, çok kullanıcılı, servisleşmiş sistemlerdir. Java bu sınıfta yaygındır. Üç nedeni var:\n\n- statik tip (değişkenin türü derleme anında bellidir, hata erken yakalanır),\n- olgun servis çerçeveleri,\n- uzun destek.\n\n### Analiz modülünü servise koymak\n\nAraştırmacıdan beklenen, bir analiz modülünü şu yüzeye koyabilmektir:\n\n- **Girdi ve çıktı nesneleri nettir** (bara sonucu, ihlal listesi).\n- **Katmanlar karışmaz:** hesap, veri tabanı ve arayüz aynı sınıfta karışmaz.\n- **İstisna yutulmaz:** ıraksayan yük akışı bir istisna veya kalite bayrağıdır, sessiz boş liste değildir. **İstisna**, programın hatayı bildirme yoludur. **Iraksamak**, yinelemeli hesabın bir sonuca yaklaşmaması demektir.\n- **Koleksiyon ve eşzamanlılık:** aynı servise paralel N-1 işi düşer. Paylaşılan değişebilir liste yarış üretir. İş parçacığı başına ayrı vaka kopyası güvenli başlangıçtır.\n\n**Yarış** (race condition), iki iş parçacığının aynı veriyi aynı anda değiştirip sonucu bozmasıdır. **İş parçacığı** (thread), program içinde paralel çalışan iş koludur.\n\n> **Sade anlatım:** Aynı defteri iki kişi aynı anda silip yazarsa defter bozulur. Her kişiye kendi fotokopisini verirsen sorun çıkmaz.\n\n### Sözdizimi mülakatında yeterli olanlar\n\n- sınıf ve arayüz,\n- `List`/`Map`,\n- istisna,\n- basit bir döngü,\n- bir birim testin ne iddia ettiği.\n\nSpring ve Maven'i \"bağımlılığı ve servisi yöneten araçlar\" diye bil. Çerçeve içi ezberi, analiz sorusunun önüne geçirme.\n\n## 5. JavaScript\n\nYTBS (Yük Tevzi Bilgi Sistemi) ve SIPS'te (System Integrity Protection Scheme, Akıllı Koruma Sistemi) operatör web arayüzü vardır. Araştırmacı piksel yarıştırmaz; şunları bilir:\n\n- **Çizim yükü:** tarayıcı binlerce barayı her mouse hareketinde baştan çizmez. Çözümler: tuval veya WebGL, kümeleme, görünür alan. **Tuval** (canvas), tarayıcıda piksel düzeyinde hızlı çizim alanıdır. **WebGL**, tarayıcıda ekran kartıyla çizim yapan arayüzdür. **Kümeleme**, uzaktan bakınca yakın noktaları tek simgede toplamaktır. **Görünür alan**, yalnız ekranda görünen kısmı çizmektir.\n- **Zaman serisi:** frekans ve yük tahmini gibi zaman serileri ayrı grafiktir. Eksen birimi yazılır.\n- **Hesabın yeri:** hesap tarayıcıda değil sunucuda koşar. Arayüz sonucu ve işin durumunu gösterir.\n- **Web servis:** REST JSON taşır. SOAP, eski SCADA/EMS entegrasyonunda hâlâ kapıdadır. İkisi de \"web servis\" maddesinin içindedir. **SCADA** (Supervisory Control and Data Acquisition, Denetleyici Kontrol ve Veri Toplama), sahadaki ölçümleri toplayan ve uzaktan kumanda veren sistemdir.\n\n**TypeScript**, JavaScript'e tip ekleyen dildir. Büyük arayüzde daha az tip hatası demektir. Zorunlu ilan maddesi değildir.\n\n## 6. Sayısal iş ve test\n\n### Sayısal tuzaklar\n\n- **Bellek:** seyrek matrisin yoğun kopyasını almak bellek patlatır. 10 bin bara Ybus'u seyrek tutulursa megabayt, yoğun tutulursa gigabayttır.\n- **Tekil Jacobian:** Jacobian tekile yakınsa çözücü uyarı verir. Uyarıyı `except: pass` ile yutma. **Tekil matris**, tersi alınamayan matristir; denklem sistemi tek çözüm vermez. `except: pass`, Python'da hatayı yakalayıp hiçbir şey yapmadan geçmek demektir.\n- **Açı birimi:** açı radyan mıdır derece mi? Çizimde derece, denklemde radyan.\n\n### Test\n\nŞu durumların testi olmalı:\n\n- elde çözülmüş 3 bara,\n- bilinen kötü veri,\n- bilinen N-1 ihlali,\n- ıraksayan vaka,\n- boş ölçüm listesi.\n\nAltın değerleri dosyada sabitle. **Altın değer**, doğruluğu bilinen ve test tarafından beklenen sonuçtur.\n\n### Git\n\n- Dal (branch) aç, küçük iş yap, mesajda nedeni yaz.\n- Büyük `.pfd` veya vaka dosyası için sürüm notu tut. `.pfd`, PowerFactory'nin proje dosyası uzantısıdır.\n- Gizli şebeke verisini depoya koyma.\n\n## 7. Mülakatta kod sorusu ve örnekler\n\nMülakatta kod sorusu gelirse şu sırayı izle:\n\n1. **Önce sözleşmeyi söyle:** girdi, çıktı, birim, başarısızlık.\n2. **Sonra en küçük doğru çözümü yaz.**\n3. **Sonra iyileştir:** seyrek veya vektör diye.\n\nÜç barayı zihinden koşamıyorsan ulusal modeli konuşma.\n\n### Örnek betikler\n\nÖrnekler bu klasörün `ornekler` altındadır. Aşağıdaki komutlar önce NumPy ve SciPy'ı kurar, sonra üç örneği sırayla çalıştırır: DC yük akışı, WLS (Weighted Least Squares, ağırlıklı en küçük kareler) durum kestirimi ve ekonomik dağıtım.\n\n```\npip install numpy scipy\npython dc_yuk_akisi.py\npython wls_durum_kestirimi.py\npython ekonomik_dagitim.py\n```\n\n- **DC yük akışı:** AC denklemlerinin doğrusallaştırılmış, hızlı yaklaşımı.\n- **Durum kestirimi:** hatalı ve eksik ölçümlerden şebekenin en olası gerilim ve açılarını bulmak.\n- **Ekonomik dağıtım:** yükü santraller arasında en düşük maliyetle paylaştırmak.\n\n### 90 saniyelik metin için not\n\nAşağıdaki metin sayfanın sözlü özetidir. İçindeki terimler yukarıda açıldı: Ybus (Bölüm 2), ıraksama (Bölüm 4), WLS (Bölüm 7). Metnin ana fikri: her dili kendi katmanında düşünürsün, büyük matrisi seyrek tutarsın, her hesabı test edersin ve hatayı saklamazsın.\n\n## 90 saniye\n\n“Python’da algoritmayı ve veriyi, MATLAB’da prototipi, Java’da servis haline gelmiş hesap motorunu, JavaScript’te operatörün göreceği sonucu düşünürüm. Büyük matrisi seyrek tutarım. Her yeni hesabın üç baralık bir testi olur. Iraksama ve kötü veri bir bayraktır, boş sonuç değildir. Paket kullanırım ama Ybus ve WLS’yi kendim de yazarım.”\n\n## Kendini yokla\n\nÖnce cevabı kapat, kendin söyle, sonra kontrol et.\n\n1. **Dört dilin bu işteki yeri nedir?**\n   Python analiz betiği, optimizasyon, veri, makine öğrenmesi, pandapower. MATLAB prototip, Simulink, MATPOWER. Java uzun ömürlü sunucu, enerji yönetim modülü, web servis. JavaScript operatör arayüzü, grafik, coğrafi gösterim.\n\n2. **Aday araştırmacı ilanı ekibin ürün yığınını nasıl yazar?**\n   Java, JavaScript, ilişkisel veri tabanı, REST/SOAP, Git, Maven, Jenkins veya GitLab CI.\n\n3. **Büyük matriste hangi çözücüyü kullanırsın?**\n   `numpy.linalg` yoğun çözücüyü değil, `scipy.sparse.linalg`'ı.\n\n4. **10 bin baralı Ybus seyrek ve yoğun tutulunca bellek ne olur?**\n   Seyrek tutulursa megabayt, yoğun tutulursa gigabayt.\n\n5. **Iraksayan yük akışı Java servisinde nasıl dönmeli?**\n   Bir istisna veya kalite bayrağı olarak; sessiz boş liste olarak değil.\n\n6. **Paralel N-1 işinde yarışı nasıl önlersin?**\n   Paylaşılan değişebilir liste kullanmam; iş parçacığı başına ayrı vaka kopyası güvenli başlangıçtır.\n\n7. **Simulink'te geliştirilen kontrol ürüne nasıl girer?**\n   Simulink gömülmez; orada doğrulanmış denklem ve kazanç gömülür.\n\n8. **Açı radyan mı, derece mi?**\n   Çizimde derece, denklemde radyan.\n\n9. **Hangi testler olmalı?**\n   Elde çözülmüş 3 bara, bilinen kötü veri, bilinen N-1 ihlali, ıraksayan vaka, boş ölçüm listesi. Altın değerler dosyada sabit.\n\n10. **Kod sorusuna nasıl başlarsın?**\n    Sözleşmeyi söylerim: girdi, çıktı, birim, başarısızlık. Sonra en küçük doğru çözüm, sonra seyrek veya vektör iyileştirmesi.\n"}, {"id": "14-Programlama/02-NR-Sifirdan-Canli-Kodlama-Test-CI.md", "group": "14  Programlama", "title": "Newton-Raphson'ı sıfırdan yazmak", "body": "# Newton-Raphson'ı sıfırdan yazmak\n\nBu sayfa beş konuyu anlatır: canlı kodlama, seyrek çözücü, sayısal kararlılık, test ve CI (Continuous Integration, sürekli entegrasyon). Hepsi tek bir işin etrafında döner: yük akışını Newton-Raphson (NR) yöntemiyle sıfırdan yazmak.\n\n**Yük akışı**, şebekedeki her baranın gerilim genliğini ve açısını, verilen üretim ve yüke göre hesaplamaktır. **Bara**, hatların, trafoların, üreticilerin ve yüklerin birleştiği düğümdür. **Newton-Raphson**, doğrusal olmayan denklemleri, her turda doğrusal bir yaklaşım çözerek adım adım çözen yöntemdir.\n\n## Bu neden senin kartın\n\nBu senin en güçlü kartın.\n\nPanelde güç sistemi bilgisi senden fazla olan çok aday olacak. Ama yük akışını test edilebilir, okunur ve hatasını söyleyen bir kod olarak yazabilen az aday olacak.\n\nBu sayfanın hedefi: 20 dakikada, bakmadan, konuşarak yazmak.\n\n## Dosyalar\n\nDosyalar `14-Programlama/ornekler` klasöründe:\n\n| Dosya | Ne |\n| --- | --- |\n| `nr_canli_kodlama.py` | 59 satır, çekirdeği 35. Canlı kodlamada yazacağın sürüm: seyrek Ybus + Newton |\n| `nr_yuk_akisi.py` | Tam sürüm: açık ve vektörel Jacobian, Q limiti, hata sınıfı |\n| `test_ornekler.py` | 7 test |\n| `elle_ornekler.py` | Notlardaki bütün elle örneklerin sayısal doğrulaması |\n\nTablodaki terimler:\n\n- **Ybus:** bara admitans matrisi. Hangi baranın hangisine hangi admitansla (empedansın tersi) bağlı olduğunu tutar.\n- **Seyrek:** matrisin yalnız sıfır olmayan elemanlarını saklamak. Şebekede her bara yalnız birkaç komşusuna bağlı olduğu için matrislerin çoğu sıfırdır.\n- **Jacobian:** güç denklemlerinin açıya ve gerilime göre türevlerinden oluşan matris. Newton'un her adımı bu matrisle çözülür.\n- **Açık ve vektörel Jacobian:** aynı matrisin iki yazımı. Açık olan eleman eleman formülle, vektörel olan dizi işlemleriyle kurulur.\n- **Q limiti:** üreticinin verebileceği reaktif gücün (Q) sınırı.\n- **Hata sınıfı:** yakınsama olmadığında fırlatılan özel hata türü.\n\nHepsi bu makinede çalıştırıldı (Python 3.14, NumPy 2.3, SciPy 1.17); 7 test geçiyor.\n\n## Yazmadan önce söyleyeceklerin\n\nCanlı kodlamada ilk iki dakika kod yazma. Sözleşmeyi söyle.\n\n**Sözleşme**, kodun hangi varsayımlarla çalıştığının açık listesidir: birimler, işaretler, indisler, girdiler. Yanlış varsayımı kodun ortasında fark etmek pahalıdır.\n\n> **Mülakatta şöyle söyle:**\n>\n> 1. \"Her şey per-unit, açılar radyan.\"\n> 2. \"Enjeksiyon üretimde pozitif, yükte negatif.\"\n> 3. \"Bara indisleri sıfırdan başlıyor.\"\n> 4. \"Bir salınım barası var; PV ve PQ listelerinde yok.\"\n> 5. \"Önce Ybus, sonra güç artığı, sonra Jacobian, sonra çözüm ve güncelleme. Sonunda iki baralı analitik örnekle sınarım.\"\n\nBu cümlelerdeki terimler:\n\n| Terim | Anlamı |\n| --- | --- |\n| Per-unit (pu) | Birim değer. Her büyüklük seçilmiş bir baz değere bölünür |\n| Radyan | Açı birimi. 180 derece = π radyan |\n| Enjeksiyon | Bir baradan şebekeye verilen net güç (üretim eksi yük) |\n| Salınım barası | Gerilim genliği ve açısı sabit tutulan referans bara. Kayıpları o karşılar |\n| PV barası | Aktif gücü (P) ve gerilim genliği (V) verilen bara; genelde üretici |\n| PQ barası | Aktif (P) ve reaktif (Q) gücü verilen bara; genelde yük |\n| Güç artığı | Verilen güç ile o anki gerilimlerden hesaplanan güç arasındaki fark |\n| Analitik örnek | Kapalı formülle elde çözülebilen, sonucu kesin bilinen örnek |\n\n## İskelet: altı adım\n\nAşağıdaki blok, kodun tamamının sözle planıdır. Canlı kodlamada bunu önce yorum satırı olarak yazarsın, sonra her satırın altını doldurursun.\n\nAdımların görevi:\n\n1. **Ybus kur:** şebekenin bağlantı ve admitans bilgisini tek matrise koyar.\n2. **Hesaplanan güç:** o anki gerilimlerle her baranın gücünü bulur.\n3. **Artık:** verilen güçle hesaplanan güç arasındaki farkı alır.\n4. **Durma ölçütü:** fark yeterince küçükse çözüm bulunmuştur.\n5. **Doğrusal çözüm:** Jacobian ile düzeltme miktarını (Δx) bulur.\n6. **Güncelleme:** açıları (θ) ve gerilimleri (V) düzeltir, tekrar 2. adıma döner.\n\n```\n1. Ybus kur\n2. S = V · conj(Ybus · V)                      hesaplanan güç\n3. artık = [P_verilen − P_hesap ; Q_verilen − Q_hesap]\n4. |artık| \u003c tolerans ise bitir\n5. J · Δx = artık çöz\n6. θ ve V'yi güncelle, 2'ye dön\n```\n\n`conj` karmaşık eşleniktir (sanal kısmın işaretini çevirir). `J` Jacobian'dır.\n\n## Kod\n\nAşağıdaki blok `nr_canli_kodlama.py`'nin çekirdeğidir. İki fonksiyon var:\n\n- `ybus(n, hatlar)`: hat listesinden seyrek Ybus matrisini kurar.\n- `yuk_akisi(...)`: Newton döngüsünü koşar. Yakınsarsa gerilimleri, açıları ve tur sayısını döndürür; yakınsamazsa hata fırlatır.\n\nİçe aktarılan araçlar:\n\n- `coo_matrix`: COO (Coordinate, koordinat) biçiminde seyrek matris. Her eleman (satır, sütun, değer) üçlüsüyle verilir.\n- `diags`: köşegen matris kurar.\n- `bmat`: seyrek blokları tek bir seyrek matriste birleştirir.\n- `spsolve`: seyrek doğrusal sistemi çözer.\n\n`nr_canli_kodlama.py`'nin çekirdeği:\n\n```python\nimport numpy as np\nfrom scipy.sparse import bmat, coo_matrix, diags\nfrom scipy.sparse.linalg import spsolve\n\n\ndef ybus(n, hatlar):\n    \"\"\"hatlar: (i, j, r, x) listesi. Aynı hücreye düşen girdileri COO kendisi toplar.\"\"\"\n    i, j, r, x = (np.array(sutun) for sutun in zip(*hatlar))\n    y = 1 / (r + 1j * x)\n    satir, sutun = np.r_[i, j, i, j], np.r_[i, j, j, i]\n    return coo_matrix((np.r_[y, y, -y, -y], (satir, sutun)), shape=(n, n)).tocsc()\n\n\ndef yuk_akisi(y, p, q, pv, pq, v0, tol=1e-8, azami=20):\n    \"\"\"p, q: net enjeksiyon. pv, pq: bara indisleri; salınım barası ikisinde de yok.\"\"\"\n    v, teta = v0.astype(float).copy(), np.zeros(len(v0))\n    pvpq = np.r_[pv, pq].astype(int)\n    for tur in range(azami):\n        vc = v * np.exp(1j * teta)\n        akim = y @ vc\n        s = vc * np.conj(akim)\n        artik = np.r_[p[pvpq] - s.real[pvpq], q[pq] - s.imag[pq]]\n        if np.max(np.abs(artik)) \u003c tol:\n            return v, teta, tur\n\n        ds_dteta = (1j * diags(vc) @ (diags(akim) - y @ diags(vc)).conj()).tocsr()\n        ds_dv = (diags(vc) @ (y @ diags(vc / v)).conj() + diags(akim.conj() * vc / v)).tocsr()\n        jac = bmat(\n            [\n                [ds_dteta.real[pvpq][:, pvpq], ds_dv.real[pvpq][:, pq]],\n                [ds_dteta.imag[pq][:, pvpq], ds_dv.imag[pq][:, pq]],\n            ],\n            format=\"csc\",\n        )\n        dx = spsolve(jac, artik)\n        teta[pvpq] += dx[: len(pvpq)]\n        v[pq] += dx[len(pvpq) :]\n    raise RuntimeError(f\"{azami} turda yakınsamadı, son artık {np.max(np.abs(artik)):.2e}\")\n```\n\nÜç baralı örnekte 4 turda yakınsar: `V = [1,0  1,02  0,9515]`.\n\nYani 1. bara (salınım) 1,0 pu, 2. bara 1,02 pu, 3. bara 0,9515 pu gerilimde kalır.\n\n### Satır satır neyi savunacaksın\n\nPanel her satırın nedenini sorabilir. Hazır cevaplar:\n\n- **`ybus`, COO biçimi.** Her hat dört girdi üretir: iki köşegen (`+y`), iki köşegen dışı (`−y`). COO aynı hücreye düşen değerleri toplar; köşegeni elle biriktirmek gerekmez. Kurarken COO, çözerken CSC (Compressed Sparse Column, sıkıştırılmış seyrek sütun).\n- **`s = vc * conj(y @ vc)`.** `S = V I*` ve `I = Y V`. Bütün güç denklemleri bu tek satırdır. Burada `S` karmaşık güç, `I` akım, `I*` akımın eşleniğidir.\n- **Artık vektörü.** Önce PV ve PQ baraların aktif gücü, sonra yalnız PQ baraların reaktif gücü. Bilinmeyenlerin sırası da aynıdır: açılar, sonra gerilimler. PV barasının gerilimi zaten verildiği için onun reaktif gücü denkleme girmez.\n- **Jacobian.** Karmaşık gücün açıya ve gerilime göre türevi matris biçiminde yazılır; gerçek kısım `∂P`, sanal kısım `∂Q` bloklarını verir. `bmat` blokları seyrek olarak birleştirir. Türetimi hatırlamıyorsan söyle ve `nr_yuk_akisi.py`'deki açık formüllü (`H`, `N`, `M`, `L`) sürümü yaz; ikisinin aynı matrisi verdiğini bir test doğruluyor.\n- **`spsolve`.** Matrisin tersini almıyorum; seyrek LU ile çözüyorum. LU ayrışması, matrisi bir alt üçgen (L, lower) ve bir üst üçgen (U, upper) matrisin çarpımına ayırır; sistem bu iki üçgenle hızlıca çözülür.\n- **Son satır.** Yakınsamadıysa sessizce sonuç dönmüyorum; son artığı söyleyen bir hata fırlatıyorum.\n\n`H`, `N`, `M`, `L` Jacobian'ın dört bloğudur: sırasıyla P'nin açıya, P'nin gerilime, Q'nun açıya ve Q'nun gerilime göre türevleri.\n\n### Jacobian'ı unutursan\n\nPanik yapma. Üç seçenek var, tercih sırasıyla:\n\n1. **Açık formüller** (`05/02` dosyası): köşegen `H_ii = −Q_i − B_ii V_i²` ve diğerleri. Çift döngüyle yaz, \"bunu sonra vektörleştiririm\" de. Burada `B_ii`, Ybus'un köşegen elemanının sanal kısmıdır (süseptans).\n2. **Sayısal türev:** her bilinmeyeni `1e-6` oynat, artığın değişimini ölç. Yavaş ama doğru; \"doğrulama için kullanırım, üretimde analitik olanı\" de.\n3. **DC yük akışına düş:** `P = B θ`, tek doğrusal çözüm. \"Zamanım kalırsa AC'ye genişletirim\" de. DC (Direct Current, doğru akım) yük akışı, AC (Alternating Current, alternatif akım) denklemlerinin doğrusallaştırılmış yaklaşımıdır; gerilimleri 1 pu kabul edip yalnız açıları çözer.\n\nHangisini seçtiğini ve nedenini söylemek, formülü ezberden yazmaktan değerlidir.\n\n## Seyrek çözücüler\n\nSeyrek doğrusal sistem (`A x = b`) için ihtiyaca göre farklı araç seçilir:\n\n| İhtiyaç | SciPy aracı | Not |\n| --- | --- | --- |\n| Tek seferlik çözüm | `spsolve(A, b)` | Arkada SuperLU (veya kuruluysa UMFPACK) |\n| Aynı matris, çok sağ taraf | `lu = splu(A)` sonra `lu.solve(b)` | Çarpanlara ayırma bir kez; N-1 taraması, hızlı ayrık yük akışı, PTDF |\n| Simetrik pozitif tanımlı | Cholesky (`scikit-sparse`, CHOLMOD) | DC model `B` matrisi, durum kestirimi kazanç matrisi |\n| Çok büyük, ön koşullu | `gmres`, `bicgstab`, `cg` | Yinelemeli; güç sistemi matrislerinde iyi ön koşullayıcı şart |\n\nTablodaki adlar:\n\n| Ad | Anlamı |\n| --- | --- |\n| SuperLU, UMFPACK | Seyrek LU ayrışması yapan hazır kütüphaneler. UMFPACK: Unsymmetric MultiFrontal Package |\n| Sağ taraf | `A x = b` denklemindeki `b` vektörü |\n| N-1 taraması | Şebekedeki elemanların her birini tek tek devre dışı bırakıp sonucu inceleme |\n| Hızlı ayrık yük akışı | Fast decoupled load flow; P-açı ve Q-gerilim denklemlerini ayırıp sabit matrislerle çözen hızlı yöntem |\n| PTDF | Power Transfer Distribution Factor, güç aktarım dağılım katsayısı. Bir baradan diğerine aktarılan gücün her hatta ne kadar akış yarattığını verir |\n| Simetrik pozitif tanımlı | Kendi devriğine eşit ve bütün özdeğerleri pozitif matris. Cholesky ayrışmasına uygundur |\n| Cholesky, CHOLMOD | Cholesky, simetrik pozitif tanımlı matrisi `L Lᵀ` olarak ayırır. CHOLMOD bunun seyrek kütüphanesidir; `scikit-sparse` ile Python'dan kullanılır |\n| Kazanç matrisi | Durum kestiriminde (WLS: Weighted Least Squares, ağırlıklı en küçük kareler) çözülen normal denklem matrisi |\n| `gmres`, `bicgstab`, `cg` | Yinelemeli çözücüler: GMRES (Generalized Minimal Residual), BiCGSTAB (Biconjugate Gradient Stabilized), CG (Conjugate Gradient, eşlenik gradyan) |\n| Ön koşullayıcı | Sistemi yinelemeli çözücünün daha hızlı yakınsayacağı hale getiren yardımcı matris |\n\n### Bilmen gereken kavramlar\n\n- **Dolgu (fill-in):** çarpanlara ayırırken sıfır olan yerler dolar. Satır ve sütun sıralaması (AMD, COLAMD) dolguyu azaltır. Güç sistemi matrisleri için KLU bu işi en iyi yapan çözücüdür. AMD: Approximate Minimum Degree; COLAMD: Column Approximate Minimum Degree; ikisi de dolguyu azaltan sıralama yöntemidir. KLU, devre ve güç sistemi gibi çok seyrek matrisler için yazılmış seyrek LU çözücüsüdür.\n- **Simgesel ve sayısal ayrışma:** seyreklik deseni değişmiyorsa sıralama ve bellek planı (simgesel kısım) bir kez yapılır; her turda yalnız sayılar yenilenir. Newton turlarında desen aynıdır. **Seyreklik deseni**, sıfır olmayan elemanların yerleridir.\n- **Düşük ranklı güncelleme:** bir hat açılınca matris dört elemanda değişir. Baştan çarpanlara ayırmak yerine Sherman-Morrison-Woodbury ile mevcut çarpanlar kullanılır. LODF bunun kapalı biçimidir. LODF (Line Outage Distribution Factor, hat açılma dağılım katsayısı), bir hat açılınca akışının diğer hatlara nasıl dağıldığını verir.\n- **Biçim dönüşümü:** COO kurmak için, CSR satır dilimlemek ve matris-vektör çarpımı için, CSC sütun dilimlemek ve doğrudan çözücüler için. CSR: Compressed Sparse Row, sıkıştırılmış seyrek satır.\n\n| Biçim | Ne için |\n| --- | --- |\n| COO | Kurmak |\n| CSR | Satır dilimlemek ve matris-vektör çarpımı |\n| CSC | Sütun dilimlemek ve doğrudan çözücüler |\n\n> **Sade anlatım:** Simgesel ayrışma, bir rafın hangi gözüne ne konacağını planlamaktır. Desen değişmiyorsa planı bir kez yaparsın. Her turda yalnız gözlerin içini yenilersin.\n\n### Dürüst not\n\n`nr_yuk_akisi.py` Ybus'u ve Jacobian'ı okunurluk için **yoğun** kurup sonra seyreğe çevirir. **Yoğun** kurmak, bütün elemanları, sıfırlar dahil, bellekte tutmaktır.\n\nÜç bara için sorun değil; on bin bara için yanlış.\n\n`nr_canli_kodlama.py` baştan sona seyrektir.\n\nMülakatta bu farkı sen söyle.\n\n## Sayısal kararlılık\n\nBu tablo, yük akışı kodunda sayısal olarak ne bozulabileceğini, nedenini ve önlemini verir.\n\n| Sorun | Nedeni | Önlem |\n| --- | --- | --- |\n| Tekil veya neredeyse tekil Jacobian | Gerilim çökme noktası; ada; salınım barası yok | Bağlı bileşen denetimi; koşul sayısını izle |\n| Kötü koşullanma | Çok küçük empedans (kesici, bara bağlantısı) yanında uzun hat | Sıfır empedanslı dalları bara birleştirerek modelden çıkar |\n| Iraksama | Kötü başlangıç, ağır yük | Önceki çözümden veya DC çözümünden başla; adım küçült |\n| PV–PQ salınımı | Reaktif sınırda gidip gelen bara | Histerezis; tur sayısı sınırı |\n| Yanlış yakınsama | Düşük gerilimli ikinci çözüm | Sonuç gerilimlerini makullük için denetle (0,8–1,2 pu) |\n| Yuvarlama | Farklı ölçekte büyüklükler | Per-unit zaten ölçekler; MW ve pu karıştırma |\n\nTablodaki terimler:\n\n- **Tekil matris:** tersi alınamayan matris. Denklem sisteminin tek çözümü yoktur.\n- **Ada:** şebekenin geri kalanından kopmuş bara grubu.\n- **Koşul sayısı:** matrisin girdideki küçük hatayı ne kadar büyüttüğünü gösteren sayı. Büyükse matris kötü koşulludur.\n- **Iraksama:** yinelemenin bir çözüme yaklaşmaması.\n- **Histerezis:** geçiş için gidiş ve dönüşte farklı eşik kullanmak; bara iki tür arasında sürekli gidip gelmez.\n- **MW:** megavat.\n\n### Yakınsama ölçütü\n\nYakınsama ölçütü: artığın en büyük mutlak değeri (sonsuz norm), örneğin `1e-8` pu.\n\n100 MVA (megavoltamper) bazda bu 1 W'tır. Hesabın adımları:\n\n1. `1e-8` pu × 100 MVA = `1e-8` × 100 000 000 VA. Bu adım, pu değeri baz güçle çarpıp gerçek birime çevirir.\n2. Sonuç 1 VA, yani güç artığı için 1 W mertebesidir. Bu adım, toleransın fiziksel olarak ne kadar küçük olduğunu gösterir.\n\nPratikte `1e-4`–`1e-6` yeter.\n\nGöreli değil mutlak tolerans kullanılır, çünkü güç artığının fiziksel anlamı vardır.\n\n### Kayan nokta\n\n**Kayan nokta**, bilgisayarın ondalıklı sayıları sınırlı basamakla saklama biçimidir. Bu yüzden küçük yuvarlama farkları oluşur.\n\n- Eşitliği `==` ile sınama; `np.isclose` veya `math.isclose` kullan.\n- Açıları derece olarak saklama.\n- `float32` kullanma. (`float32` yaklaşık 7 anlamlı basamak tutar; yük akışı için yetmez.)\n\n## Test\n\nAnaliz kodunda test, \"sonuç neye göre doğru?\" sorusunun cevabıdır.\n\nKatmanlar ve bu depodaki karşılıkları:\n\n| Tür | Örnek (bu depoda) |\n| --- | --- |\n| Analitik doğrulama | İki baralı sistemin kapalı çözümü: `test_iki_bara_analitik_cozum` |\n| Fiziksel değişmez | Üretim − yük = kayıp: `test_guc_dengesi_kayba_esit` |\n| Çapraz doğrulama | İki ayrı Jacobian aynı matrisi veriyor: `test_iki_jacobian_ayni` |\n| Davranış | Q sınırında PV → PQ: `test_q_limiti_pv_barayi_pq_yapar` |\n| Olumsuz yol | Çözümsüz yükte hata fırlatılıyor: `test_cozumsuz_yuk_sessiz_kalmaz` |\n| Girdi doğrulama | Sıfır empedans reddediliyor: `test_sifir_empedans_reddedilir` |\n\nHer türün ne sınadığı:\n\n- **Analitik doğrulama:** kodun sonucunu, elle kesin çözülen bir örnekle karşılaştırır.\n- **Fiziksel değişmez:** fizik yasasının (güç dengesi) her durumda tuttuğunu sınar.\n- **Çapraz doğrulama:** aynı şeyi iki farklı yolla hesaplayıp sonuçları karşılaştırır.\n- **Davranış:** belli bir koşulda kodun beklenen kararı verdiğini sınar.\n- **Olumsuz yol:** kodun başarısız olması gereken yerde gerçekten hata verdiğini sınar.\n- **Girdi doğrulama:** anlamsız girdinin baştan reddedildiğini sınar.\n\n### Bu depoda olmayan ama söylemen gerekenler\n\n- **Referans araçla karşılaştırma:** aynı vakayı pandapower veya MATPOWER ile çöz, gerilimleri tolerans içinde karşılaştır. IEEE (Institute of Electrical and Electronics Engineers) 14, 30, 118 baralı test sistemleri bunun için vardır.\n- **Altın değer (regresyon) testi:** bilinen bir vakanın sonucu dosyada saklanır; kod değişince sonuç değişirse test düşer. Değişim bilinçliyse dosya gözden geçirilerek güncellenir.\n- **Özellik tabanlı test:** rastgele üretilen bağlı şebekelerde değişmezleri sına: güç dengesi, Ybus simetrisi, şöntsüz şebekede satır toplamı sıfır. **Şönt**, baradan toprağa bağlı eleman demektir (kondansatör, reaktör, hat şarj kapasitesi).\n- **Performans testi:** büyük vakada süre ve bellek eşiği. Karmaşıklık gerilemesini yakalar. Yani bir değişiklik kodu fark edilmeden yavaşlatırsa test düşer.\n\nGerçek şebeke modeli teste konmaz; gizlidir ve büyüktür. Sentetik veya maskelenmiş vaka kullanılır.\n\n## CI\n\nCI (Continuous Integration, sürekli entegrasyon), her itmede otomatik çalışan boru hattıdır. **İtme** (push), kodu ortak depoya göndermektir. **Boru hattı**, sırayla çalışan otomatik adımlar dizisidir.\n\nAnaliz yazılımında asgari adımlar:\n\n1. biçim ve statik denetim,\n2. testler,\n3. elle örneklerin doğrulaması.\n\n**Statik denetim**, kodu çalıştırmadan okuyup hata ve stil sorunu arayan denetimdir.\n\n### Örnek GitLab CI dosyası\n\nÖrnek GitLab CI dosyası (bu makinede çalıştırılmadı; betiklerin kendisi çalıştırıldı).\n\nBu dosya ne yapar:\n\n- `image`: işlerin `python:3.12-slim` kapsayıcısında koşacağını söyler.\n- `stages`: iki aşama tanımlar: önce `denetim`, sonra `test`.\n- `before_script`: her işten önce gerekli paketleri, `pytest`'i ve `ruff`'ı kurar. `ruff`, Python için biçim ve statik denetim aracıdır.\n- `denetim` işi: `ruff check` ile hata arar, `ruff format --check` ile biçimin doğru olup olmadığına bakar.\n- `test` işi: örnek klasörüne girer, `pytest -q` ile testleri koşar, `python elle_ornekler.py` ile elle örnekleri doğrular.\n\n```yaml\nimage: python:3.12-slim\n\nstages: [denetim, test]\n\nbefore_script:\n  - pip install -r 14-Programlama/ornekler/requirements.txt pytest ruff\n\ndenetim:\n  stage: denetim\n  script:\n    - ruff check 14-Programlama/ornekler\n    - ruff format --check 14-Programlama/ornekler\n\ntest:\n  stage: test\n  script:\n    - cd 14-Programlama/ornekler\n    - pytest -q\n    - python elle_ornekler.py\n```\n\nKurumun hangi CI aracını kullandığını bilmiyorum.\n\n> **Mülakatta şöyle söyle:** \"Analiz modüllerinde regresyon testini hangi vakalarla koşuyorsunuz?\"\n\nBu, panele sorabileceğin bir sorudur.\n\n### Analiz yazılımına özgü üç kural\n\n1. **Model, algoritma ve sınır değerleri ayrı sürümlenir.** Sonuç değiştiyse hangisinin değiştiği bilinmelidir.\n2. **Sonuç yinelenebilir olmalıdır.** Rastgelelik varsa tohum sabitlenir ve kaydedilir. **Tohum**, rastgele sayı üretecinin başlangıç değeridir.\n3. **Sayısal sonuç değişikliği gözden geçirme ister.** Bir yeniden düzenleme, sonucu beşinci basamakta değiştiriyorsa bu bir bulgudur.\n\n## Canlı kodlama provası\n\nKronometreyle, üç kez:\n\n| Dakika | İş |\n| --- | --- |\n| 0–2 | Sözleşmeyi söyle; iskeleti yorum satırı olarak yaz |\n| 2–6 | `ybus` |\n| 6–9 | Güç hesabı ve artık |\n| 9–15 | Jacobian ve çözüm |\n| 15–18 | Güncelleme, döngü, hata |\n| 18–20 | İki baralı test: `x = 0,1`, yük `0,5 + j0,2` → `V_2 = 0,97825` |\n\n### İki baralı testin elle hesabı\n\nSon satırdaki test, kodu kesin bir sonuçla sınamak içindir. Sistem şöyle: 1. bara salınım barası, gerilimi 1 pu. İki bara arasında yalnız reaktans var, `x = 0,1` pu. 2. barada yük `0,5 + j0,2` pu, yani P = 0,5 ve Q = 0,2.\n\nBu sistemin kapalı (formülle bulunan) çözümü vardır. Yük barası gerilimi V için denklem:\n\n`V⁴ + (2·Q·x − V₁²)·V² + x²·(P² + Q²) = 0`\n\nAdımlar:\n\n1. `2·Q·x − V₁² = 2·0,2·0,1 − 1 = 0,04 − 1 = −0,96`. Bu adım, denklemin V² teriminin katsayısını bulur.\n2. `x²·(P² + Q²) = 0,01·(0,25 + 0,04) = 0,01·0,29 = 0,0029`. Bu adım, denklemin sabit terimini bulur.\n3. Denklem `V⁴ − 0,96·V² + 0,0029 = 0` olur. Bu adım, V²'ye göre ikinci dereceden bir denklem elde eder.\n4. `V² = (0,96 + √(0,96² − 4·0,0029)) / 2 = (0,96 + √0,91) / 2 ≈ (0,96 + 0,95394) / 2 ≈ 0,95697`. Bu adım, iki kökten büyük olanı (işletmedeki yüksek gerilimli çözümü) seçer.\n5. `V = √0,95697 ≈ 0,97825`. Bu adım, testin beklediği `V_2 = 0,97825` değerini verir.\n\nKodun bulduğu `V_2` bu sayıyla tolerans içinde eşleşirse kod doğrudur.\n\n### Konuşarak yaz\n\nYazarken konuş. Sessiz yazan aday, yanlış yola girdiğinde yardım alamaz.\n\n## Yaygın yanlış\n\n- **\"`np.linalg.inv(J) @ artik` yazarım.\"** Tersini alma; `solve` veya `spsolve` kullan. Daha hızlı ve sayısal olarak daha sağlamdır.\n- **\"Ybus'u `np.zeros((n, n))` ile kurarım.\"** On bin barada 1,6 GB (gigabayt). Küçük örnekte kabul edilir; nedenini söyle.\n- **\"Açıyı derece tutarım.\"** `np.exp(1j * teta)` radyan ister.\n- **\"Yakınsama için tur sayısını artırırım.\"** Newton'da 20 tur fazlasıyla yeter; yetmiyorsa sorun başka yerdedir.\n- **\"Test yazmaya vakit yok.\"** Canlı kodlamada tek bir analitik test, kodun doğru olduğunu **senin** kanıtlamandır.\n- **\"`python -c` ile denedim, çalışıyor.\"** Elle deneme test değildir; yinelenemez.\n- **\"Python yavaştır, yük akışı C++ ile yazılır.\"** Süre çözücüde (derlenmiş kod) geçer. Python döngüsüyle Jacobian kurarsan yavaşlar; vektörel kurarsan fark küçülür. Önce ölç.\n\n### 1,6 GB nereden geliyor\n\nBu hesap, yoğun Ybus'un neden büyük şebekede kullanılamayacağını gösterir.\n\n1. On bin barada matris 10 000 × 10 000 = 100 000 000 elemanlıdır. Bu adım, yoğun matrisin eleman sayısını bulur.\n2. Ybus karmaşık sayıdır; NumPy'da her karmaşık sayı (`complex128`) 16 bayt tutar. Bu adım, eleman başına belleği verir.\n3. 100 000 000 × 16 bayt = 1 600 000 000 bayt ≈ 1,6 GB. Bu adım, toplam belleği bulur.\n\n## Panel takip sorusu\n\nPanelin kodundan sonra sorabileceği üç soru ve cevapları.\n\n**\"Bu kodu on bin baraya nasıl taşırsın?\"**\n\n> **Mülakatta şöyle söyle:** Ybus ve Jacobian baştan seyrek; Jacobian deseni sabit olduğu için simgesel ayrışmayı bir kez yaparım; başlangıç olarak önceki çözümü kullanırım; profil alır, sürenin kurulumda mı çözümde mi geçtiğine bakarım. Gerekirse KLU'ya geçerim.\n\n**Profil almak**, kodun zamanını nerede harcadığını ölçmektir.\n\n**\"Bu işlevi servis haline getirsen arayüzü ne olur?\"**\n\n> **Mülakatta şöyle söyle:** Girdi sürümlü bir şebeke modeli kimliği ve senaryo; çıktı gerilimler, akışlar, **yakınsama durumu, tur sayısı, son artık** ve uyarılar. Uzun işler kuyruğa girer. Aynı girdi aynı çıktıyı vermeli; sonuç, model ve algoritma sürümüyle birlikte saklanır.\n\n**\"Sonucun doğru olduğuna nasıl güvenirsin?\"**\n\n> **Mülakatta şöyle söyle:** Dört katman. Analitik küçük örnek, fiziksel değişmezler, referans araçla karşılaştırma ve gerçek ölçümle karşılaştırma. Yalnızca birincisini ve ikincisini yaptım; üçüncüsü için pandapower kuracağım, dördüncüsü kurum verisi ister.\n\n## 90 saniyelik metin için not\n\nAşağıdaki metin sayfanın sözlü özetidir. İçindeki terimler yukarıda açıldı: admitans matrisi (Ybus), karmaşık güç, Jacobian, seyrek çözücü, artık, güç dengesi, seyreklik deseni ve çarpanlar. Metindeki altı adım, \"İskelet: altı adım\" bölümündeki adımlardır.\n\n## 90 saniye\n\n\"Yük akışını sıfırdan yazarken altı adım izlerim: admitans matrisini seyrek kurarım, karmaşık gücü gerilim çarpı akımın eşleniği olarak hesaplarım, verilen güçle farkını alırım, Jacobian'ı kurarım, doğrusal sistemi seyrek çözücüyle çözerim, açı ve gerilimi güncellerim. Matrisin tersini almam. Yakınsamayan vakada sessiz sonuç dönmem, son artığı taşıyan bir hata fırlatırım. Doğruluğu kapalı çözümü olan iki baralı örnekle, güç dengesiyle ve iki ayrı Jacobian'ın karşılaştırmasıyla sınarım; bunlar otomatik testtir ve her değişiklikte koşar. Büyük ölçekte seyreklik desenini bir kez çözümler, çarpanları yeniden kullanırım.\"\n"}, {"id": "14-Programlama/ornekler/README.md", "group": "14  Programlama", "title": "Örnekler", "body": "# Örnekler\n\nBu klasör, mülakat notlarındaki hesapların çalışan halidir. Notlarda elle yapılan hesaplar burada Python betiği olarak yeniden yapılır.\n\nÜç özelliği var:\n\n- **Dış veri yok.** Her betik kendi küçük şebekesini içinde tanımlar. İnternetten veya başka dosyadan veri çekmez.\n- **Kendi sonucunu denetler.** Her betik, bulduğu sayıyı beklenen değerle karşılaştırır.\n- **Sapınca hata verir.** Sayı saparsa betik sessizce devam etmez, hata verir.\n\n## Nasıl çalıştırılır\n\nAşağıdaki komutlar şu sırayla iş görür:\n\n1. `pip install -r requirements.txt` gerekli kütüphaneleri `requirements.txt` dosyasındaki listeye göre kurar.\n2. Sonraki satırlar her betiği tek tek çalıştırır.\n3. `test_ornekler.py` satırındaki `#` sonrası bir yorumdur: testler `pytest -q` komutuyla da koşturulabilir. pytest, Python'un test çalıştırma aracıdır; `-q` (quiet) çıktıyı kısa tutar.\n\n```\npip install -r requirements.txt\npython nr_canli_kodlama.py\npython nr_yuk_akisi.py\npython elle_ornekler.py\npython test_ornekler.py        # veya: pytest -q\npython dc_yuk_akisi.py\npython wls_durum_kestirimi.py\npython ekonomik_dagitim.py\n```\n\n## Dosyalar\n\nTablodaki \"İlgili not\" sütunu, betiğin hangi not dosyasına ait olduğunu gösterir. `14/02` gibi bir yazım \"14 numaralı klasörün 02 numaralı dosyası\" demektir.\n\n| Dosya | Ne yapar | İlgili not |\n| --- | --- | --- |\n| `nr_canli_kodlama.py` | Seyrek Ybus ve Newton-Raphson, 59 satır. Canlı kodlamada yazılacak sürüm | `14/02` |\n| `nr_yuk_akisi.py` | Tam sürüm: açık formüllü ve vektörel Jacobian, Q limitinde PV→PQ, yakınsama hatası | `05/02` |\n| `test_ornekler.py` | 7 test: analitik çözüm, güç dengesi, Jacobian eşitliği, Q limiti, çözümsüz vaka, girdi denetimi | `14/02` |\n| `elle_ornekler.py` | 02–13 klasörlerindeki bütün elle örneklerin sayısal doğrulaması | Her klasörün `02` dosyası |\n| `dc_yuk_akisi.py` | Üç barada DC yük akışı | `05/01` |\n| `wls_durum_kestirimi.py` | Dört ölçümle açı kestirimi; bozuk ölçümü normalize artıkla bulur | `09/01` |\n| `ekonomik_dagitim.py` | Eşit λ çözümü ve üretim sınırı | `11/01` |\n\n### Tablodaki terimler\n\nİlk kez görüyorsan bu terimler tabloyu okumayı kolaylaştırır:\n\n| Terim | Anlamı |\n| --- | --- |\n| Ybus | Bara admitans matrisi. Hangi baranın hangisine hangi admitansla bağlı olduğunu tutar |\n| Seyrek | Matrisin yalnız sıfır olmayan elemanlarının saklanması |\n| Newton-Raphson | Doğrusal olmayan yük akışı denklemlerini yinelemeli çözen yöntem |\n| Jacobian | Güç denklemlerinin açıya ve gerilime göre türevlerinden oluşan matris |\n| Açık formüllü ve vektörel Jacobian | Aynı matrisin iki yazımı: biri eleman eleman formülle, biri dizi işlemleriyle |\n| Q limiti, PV→PQ | Bir PV barası (aktif gücü P ve gerilimi V sabit tutulan bara, genelde üretici) reaktif güç (Q) sınırına ulaşınca PQ barasına (P ve Q'su verilen bara, genelde yük) çevrilir |\n| Yakınsama hatası | Hesap belirlenen tur sayısında çözüme ulaşmazsa fırlatılan hata |\n| Çözümsüz vaka | Yükün şebekenin taşıyabileceğinden fazla olduğu, yük akışının çözümü olmayan durum |\n| DC yük akışı | DC (Direct Current, doğru akım) yaklaşımı: AC denklemlerinin doğrusallaştırılmış, hızlı hali |\n| WLS | Weighted Least Squares, ağırlıklı en küçük kareler. Ölçümlerden şebeke durumunu kestirir |\n| Normalize artık | Ölçümle kestirim arasındaki farkın, o farkın beklenen saçılımına bölünmüş hali. Büyük çıkan ölçüm bozuk sayılır |\n| Eşit λ | Ekonomik dağıtımda bütün üreticilerin artımlı maliyetinin (bir MW daha üretmenin maliyeti) eşit olduğu çözüm. λ (lambda) bu ortak maliyettir |\n\n## Son çalıştırma\n\nSon çalıştırma: Python 3.14, NumPy 2.3, SciPy 1.17. Yedi test geçti.\n\n## Sıradaki adım\n\nSıradaki adım: pandapower kurup aynı üç baralı şebekeyi onun AC (Alternating Current, alternatif akım) yük akışıyla çözmek ve gerilimleri `nr_yuk_akisi.py` ile karşılaştırmak.\n\nBu yapılmadı; pandapower bu makinede kurulu değil.\n\nBu karşılaştırma neden önemli: kendi yazdığın kodun sonucunu bağımsız bir referans araçla doğrulamış olursun. Bu, testin \"referans araçla karşılaştırma\" katmanıdır.\n"}, {"id": "15-Analiz-Yazilimlari/00-Alt-Basliklar.md", "group": "15  Analiz yazılımları", "title": "15 — Analiz yazılımları ve veri modelleri", "body": "# 15 — Analiz yazılımları ve veri modelleri\n\nBu klasör iki sayfadan oluşur. `01-Araclar-CIM-Dogrulama.md` araçları, veri modellerini ve doğrulamayı anlatır. `02-Acik-Kaynak-Araclar-ve-Durust-Strateji.md` açık kaynak araçları ve \"ticari yazılım kullanmadım\" cevabını anlatır.\n\nAşağıdaki on iki başlık klasörün konu listesidir. Her maddenin altında o başlıkta ne öğreneceğin tek cümleyle yazıyor.\n\n1. **Çevrimdışı planlama araçları**\n   Bu başlıkta PowerFactory ve PSS/E gibi, canlı şebekeye bağlı olmadan gelecek senaryoları çözen planlama araçlarının neye güçlü olduğunu öğreneceksin.\n2. **İşletme ve EMS araçları**\n   Bu başlıkta EMS (Energy Management System, enerji yönetim sistemi) gibi işletmede canlı veriyle çalışan araçların planlama araçlarından farkını öğreneceksin.\n3. **Elektromanyetik geçici araçlar**\n   Bu başlıkta PSCAD ve EMTP-RV gibi EMT (Electromagnetic Transient, elektromanyetik geçici hal) araçlarının milisaniye düzeyindeki olaylar için neden gerektiğini öğreneceksin.\n4. **Açık kaynak araçlar**\n   Bu başlıkta pandapower, MATPOWER, OpenDSS, PyPSA ve GridLAB-D'nin hangi işe yaradığını ve nerede zayıf kaldığını öğreneceksin.\n5. **Hangi soru hangi araca gider**\n   Bu başlıkta bir mühendislik sorusunu (termik yüklenme, kararlılık, koruma, dağıtım gerilimi gibi) doğru araç türüyle eşleştirmeyi öğreneceksin.\n6. **Model alışverişi neden kırılır**\n   Bu başlıkta bir şebeke modeli bir araçtan ötekine taşınırken baz güç, kademe, trafo grubu ve işaret gibi nedenlerle nasıl bozulduğunu öğreneceksin.\n7. **PSS/E raw, PowerFactory, UCTE/DEF**\n   Bu başlıkta iletim verisinin taşındığı eski ve yaygın dosya biçimlerini, örneğin PSS/E `.raw` ve UCTE (Union for the Co-ordination of Transmission of Electricity, Avrupa'nın eski iletim koordinasyon birliği) DEF biçimini öğreneceksin.\n8. **CIM ve CGMES**\n   Bu başlıkta CIM (Common Information Model, ortak bilgi modeli) ve onun Avrupa profili CGMES'in (Common Grid Model Exchange Standard, ortak şebeke modeli değişim standardı) ne olduğunu öğreneceksin.\n9. **Kontenjans, dinamik model ve koruma verisinin ayrı dosya olması**\n   Bu başlıkta arıza senaryosu (kontenjans), dinamik model ve koruma verisinin neden tek dosyada değil ayrı dosyalarda durduğunu öğreneceksin.\n10. **Türkiye modeliyle çalışma disiplini**\n    Bu başlıkta Türkiye şebeke modeli kamu malı olmadığı için mülakatta neyi konuşup neyi konuşmayacağını öğreneceksin.\n11. **Aracın ürettiği sayıyı doğrulama**\n    Bu başlıkta yeni araca geçmiş bir modeli sayılarla, seçilmiş akışlarla ve kısa devreyle nasıl denetleyeceğini öğreneceksin.\n12. **API ve betik: aracın ürünleşmesi**\n    Bu başlıkta API (Application Programming Interface, uygulama programlama arayüzü) ve betikle senaryoları otomatik koşmayı ve bunun bir servise nasıl dönüştüğünü öğreneceksin.\n"}, {"id": "15-Analiz-Yazilimlari/01-Araclar-CIM-Dogrulama.md", "group": "15  Analiz yazılımları", "title": "Analiz yazılımları ve veri modelleri", "body": "# Analiz yazılımları ve veri modelleri\n\nAraç bilmek, düğme bilmek değildir. Aracın hangi varsayımla çözdüğünü ve modelin komşu araca nasıl bozulduğunu anlatabilmektir.\n\n> **Sade anlatım:** Bir programın menüsünü ezberlemek yetmez. Programın arka planda neyi basitleştirdiğini bilmen gerekir. Bir de aynı şebekeyi başka bir programa taşıdığında nerelerin bozulduğunu bilmen gerekir.\n\nBu sayfa dört parçadan oluşur:\n\n1. Araçlar ve her birinin güçlü ve sınırlı olduğu yer.\n2. Hangi mühendislik sorusunun hangi araca gittiği.\n3. Veri modeli: model alışverişi neden kırılır, CIM ve CGMES nedir.\n4. Doğrulama ve betik: aracın verdiği sayıya nasıl güvenilir, iş nasıl otomatikleşir.\n\n## Araçlar\n\nÖnce tablodaki kısaltmaları açalım:\n\n| Kısaltma | Açılımı | Anlamı |\n| --- | --- | --- |\n| RMS | Root Mean Square (etkin değer) | Dinamik benzetimde dalga şekli yerine fazörün genliği ve açısı izlenir. Saniyeler ölçeğindeki olaylar içindir. |\n| EMT | Electromagnetic Transient (elektromanyetik geçici hal) | Gerilim ve akımın anlık dalga şekli izlenir. Milisaniye ve altı olaylar içindir. |\n| API | Application Programming Interface (uygulama programlama arayüzü) | Programı arayüz yerine kodla sürmeyi sağlar. |\n| PSS/E | Power System Simulator for Engineering | Siemens'in iletim analiz paketi. |\n| ETAP | Electrical Transient Analyzer Program | Endüstriyel şebeke analiz paketi. |\n| EMS | Energy Management System (enerji yönetim sistemi) | İşletmede canlı veriyle çalışan kontrol merkezi yazılımı. |\n| OPF | Optimal Power Flow (optimal güç akışı) | Maliyet gibi bir hedefi en iyileyen yük akışı. |\n| MATPOWER | MATLAB tabanlı güç sistemi paketi | Yük akışı ve OPF için akademik araç. |\n\nAşağıdaki tablo her aracın güçlü olduğu yeri ve sınırını gösterir:\n\n| Araç | Güçlü olduğu yer | Sınırı |\n| --- | --- | --- |\n| DIgSILENT PowerFactory | İletim ve dağıtım, dinamik, koruma, RMS/EMT, Python API | Lisans, büyük vaka dosyası disiplini |\n| Siemens PSS/E | İletim planlama, dinamik, ham veri dosyası yaygın | Dağıtım dengesiz modeli asıl işi değil |\n| PSCAD / EMTP-RV | Milisaniye, evirici kontrolü, yalıtım, ferrorezonans | Şebekenin tamamı değil, kritik kesit |\n| ETAP | Endüstriyel şebeke, kısa devre, koruma koordinasyonu | Ulusal iletim EMS’i değil |\n| PowerWorld | Eğitim, görsel yük akışı, duyarlılık | Büyük dinamik çalışma için değil |\n| MATLAB + MATPOWER / Simulink | Algoritma, kontrol, makale | Ürün sunucusu değil |\n| pandapower | Python ile yük akışı, OPF, zaman serisi | Üretici dinamik kütüphanesi sınırlı |\n| OpenDSS | Dağıtım, dengesiz, zaman serisi | İletim dinamik analizi değil |\n| GridLAB-D | Dağıtım, ev yükü, birlikte simülasyon | Öğrenme eşiği |\n| CYME | Dağıtım şirketi planlaması | Ekosisteme bağlı |\n| Gerçek zamanlı simülatör | Röle ve kontrolör kapalı çevrim | Pahalı, model sadeleştirilir |\n\nTablodaki bazı terimler ilk kez öğrenen biri için açıklama ister:\n\n- **Ferrorezonans:** Trafonun doymaya giren demir çekirdeği ile kablo veya kesici kapasitansı arasında oluşan, yüksek ve düzensiz aşırı gerilim olayıdır.\n- **Kritik kesit:** EMT araçları şebekenin tamamını değil, incelenen olaya yakın küçük bir bölümü ayrıntılı modeller.\n- **Dengesiz model:** Dağıtımda üç faz eşit yüklenmez. Bu yüzden her faz ayrı çözülür.\n- **Kapalı çevrim:** Gerçek röle veya kontrolör, simülatöre bağlanır. Simülatör ona sinyal verir, o da simülatöre karar döndürür.\n\nHangisini kullandıysan onu derin anlat. Kullanmadığını “biliyorum” deme.\n\nŞu cümle yeter: “PowerFactory’de şunu koştum, PSS/E ham verisini şu yüzden içeri aldım, doğrulamayı şu barada yaptım”.\n\nHiçbiri yoksa pandapower ile küçük bir N-1'i mülakattan önce kendi elinle koşmuş ol. N-1, şebekeden tek bir elemanın (bir hat, bir trafo veya bir üreteç) çıktığı durumda sistemin sınırlar içinde kalıp kalmadığını sınamaktır.\n\nBu klasörün kardeşi `14/ornekler` hesap içindir. pandapower kurulumu lisanssızdır.\n\n## Hangi soru nereye\n\nAracı ürün adına göre değil, sorunun türüne göre seçersin. Liste şöyle:\n\n| Soru | Gittiği araç veya yöntem |\n| --- | --- |\n| Günlük termik ve gerilim | AC yük akışı, planlama aracı veya EMS. |\n| Binlerce N-1 | DC elek + AC doğrulama, betik. |\n| Koruma eğrisi | Koruma modülü, kısa devre ile birlikte. |\n| Açı kararlılığı | RMS dinamik. |\n| Evirici kontrolü, TRV, ferrorezonans | EMT. |\n| Dağıtım gerilim, çatı güneş yılı | OpenDSS veya pandapower zaman serisi, üç faz gerekebilir. |\n| Kapalı çevrim röle testi | Gerçek zamanlı simülatör + ikincil enjeksiyon. |\n\nTablodaki terimler:\n\n- **AC yük akışı:** AC (Alternating Current, alternatif akım) yük akışı gerilim genliğini, açıyı ve reaktif gücü tam hesaplar.\n- **DC elek:** DC (Direct Current, doğru akım) yük akışı yaklaşık ve hızlıdır. Yalnız aktif güç ve açıyı hesaplar. Binlerce N-1 vakasını hızlıca eler. Şüpheli çıkanlar sonra AC ile doğrulanır.\n- **Termik:** Hattın veya trafonun akım yüzünden ısınma sınırıdır.\n- **TRV:** Transient Recovery Voltage (geçici toparlanma gerilimi). Kesici akımı kestikten hemen sonra kontakları arasında oluşan gerilimdir.\n- **Çatı güneş yılı:** Çatı güneş panellerinin bir yıl boyunca saat saat etkisinin izlenmesidir.\n- **İkincil enjeksiyon:** Röleye, gerçek akım ve gerilim trafosu yerine, test cihazından ikincil devre düzeyinde sinyal vermektir.\n\nAynı vakanın RMS ve EMT sonucu milisaniyede ayrışır. Ayrışınca hangisinin ihmalinin devrede olduğunu söyle: şebeke frekansı modeli RMS’te cebirseldir, EMT’de diferansiyeldir.\n\n> **Sade anlatım:** RMS aracı şebekeyi her an \"sabit frekansta sinüs\" sayar ve hat ile trafoyu cebirsel denklemle çözer. Bu yüzden çok hızlı olayları göremez. EMT aracı hat ve trafoyu diferansiyel denklemle çözer ve dalga şeklini anbean izler. İki sonuç ilk milisaniyelerde farklıysa sebep genelde bu ihmaldir.\n\n## Veri modeli\n\nBir şebeke modeli bir araçtan ötekine taşınır. Buna model alışverişi denir. Bu taşımada model sık sık bozulur.\n\nKırılan alışverişin alışılmış nedenleri:\n\n| Neden | Ne bozulur |\n| --- | --- |\n| Baz güç 100 MVA burada, 1000 orada | MVA (megavoltamper) cinsinden baz farklıysa per-unit (birim değer) empedanslar yanlış ölçeklenir. |\n| Kademe oranının hangi sargıya yazıldığı | Trafo kademesi yanlış tarafa uygulanırsa gerilim ters yönde kayar. |\n| Trafo grubu ve saat açısı | Sargı bağlantısının getirdiği faz kayması kaybolabilir. |\n| Hatın şönt B’sinin tamamı mı yarısı mı | Hattın şönt suseptansı (B) toplam mı yazılır, her uca yarısı mı, araçtan araca değişir. |\n| İşaret: yük negatif mi pozitif mi | Yük üretim gibi görünebilir. |\n| Slack’in kim olduğu | Slack (salınım barası), kayıpları ve dengesizliği karşılayan referans baradır. Farklı seçilirse akışlar değişir. |\n| Limitin nominal mi mevsimsel mi | Aynı hat bir araçta yüklü, ötekinde aşırı yüklü görünebilir. |\n| Dinamik modelin (AVR, PSS, governor) ayrı kütüphanede kalması | AVR (Automatic Voltage Regulator, otomatik gerilim regülatörü), PSS (Power System Stabilizer, güç sistemi kararlılık sağlayıcısı) ve governor (hız regülatörü) modelleri taşınmayabilir. |\n| Koordinat ve bara adının GIS ile uyuşmaması | GIS (Geographic Information System, coğrafi bilgi sistemi) ile model eşleşmez. |\n\n### Dosya biçimleri ve CIM\n\nPSS/E `.raw` iletim değiş tokuşunun eski ortak dilidir.\n\nAvrupa planlama verisi UCTE DEF ve bugün CGMES ile yürür. UCTE, Avrupa'nın eski iletim koordinasyon birliğidir (Union for the Co-ordination of Transmission of Electricity). DEF onun veri değişim biçimidir (Data Exchange Format).\n\nCIM (IEC 61970/61968) şebekeyi UML sınıflarıyla anlatır: ekipman, topoloji, durum.\n\n- CIM, Common Information Model (ortak bilgi modeli) demektir.\n- IEC, International Electrotechnical Commission (Uluslararası Elektroteknik Komisyonu) demektir. IEC 61970 iletim ve EMS tarafını, IEC 61968 dağıtım tarafını kapsar.\n- UML, Unified Modeling Language (birleşik modelleme dili) demektir. Nesneleri sınıf ve ilişki olarak tanımlar.\n\nCGMES, CIM’in Avrupa profilidir. CGMES, Common Grid Model Exchange Standard (ortak şebeke modeli değişim standardı) demektir. ENTSO-E model paylaşımı buna dayanır. ENTSO-E, European Network of Transmission System Operators for Electricity (Avrupa elektrik iletim sistemi işletmecileri ağı) demektir.\n\nTürkiye enterkonneksiyon çalışması Avrupa modeliyle konuşacaksa bu profil kapıdır.\n\n> **Sade anlatım:** CIM, şebekeyi anlatan ortak bir sözlüktür. CGMES, Avrupa'nın bu sözlükten seçtiği ve herkesin uyduğu kurallar setidir. Türkiye Avrupa şebekesiyle model paylaşacaksa bu kurallara uymak zorundadır.\n\n### CIM her şeyi tek dosyada çözmez\n\nCIM'de bilgi parçalara ayrılır. Her parçaya profil denir:\n\n| Profil | İçerik |\n| --- | --- |\n| Ekipman | Hat, trafo, üreteç gibi fiziksel elemanlar. |\n| Durum (kesici) | Kesici açık mı kapalı mı. |\n| Analog değer | Ölçülen akım, gerilim, güç. |\n| Diyagram | Şemanın çizim bilgisi. |\n\nDurum kestirimi “ekipman dosyası” ile çalışmaz; topoloji ve analog ister. Durum kestirimi, ölçümlerden şebekenin en olası anlık durumunu hesaplayan EMS işlevidir.\n\nKoruma modeli CIM’de zayıftır, çoğu zaman ayrı kalır.\n\nBunu bilmek, “CIM’e aktardık, bitti” cümlesini düzeltir.\n\n## Doğrulama\n\nYeni araca geçmiş bir model için asgari kontrol altı adımdır. Her adımın ne işe yaradığı yanında yazıyor:\n\n1. **Bara, hat, trafo sayısı.** Taşımada eleman kaybolmuş ya da çoğalmış mı, bunu yakalar.\n2. **Toplam üretim, yük, kayıp.** Sistemin genel güç dengesi eski araçla aynı mı, bunu gösterir.\n3. **Seçilmiş 10 hattın akışı, eski araçla.** Empedans, kademe ve topoloji hatalarını hat düzeyinde yakalar.\n4. **Seçilmiş 10 gerilim.** Kademe, reaktif kaynak ve şönt hatalarını bara düzeyinde yakalar.\n5. **Bir kısa devre barası, üç faz ve tek faz-toprak.** Sıfır bileşen ve topraklama verisinin doğru taşındığını sınar.\n6. **Slack gücü makul mü.** Slack çok büyük güç veriyor ya da çekiyorsa bir yerde yük, üretim veya işaret hatası vardır.\n\nFark varsa önce baz, işaret ve kademe. “Yeni araç daha doğrudur” kolay kaçıştır. Fark açıklanmadan rapor çıkmaz.\n\n### Türkiye modeli ve gizlilik\n\nTürkiye modeli kamu malı değildir. Mülakatta gerçek bara adı, gerçek kısıt veya müşteri verisi konuşulmaz.\n\nMülakatta konuşulanlar:\n\n- Yöntem\n- Büyüklük mertebesi\n- Senin rolün\n\nÖrnek veri olarak IEEE 14, 39, 118 veya küçük sentetik dağıtım fideri kullan. IEEE (Institute of Electrical and Electronics Engineers) test sistemleri herkese açık standart örnek şebekelerdir. Sayı, sistemdeki bara sayısını gösterir.\n\nAkademik vakada yöntemi anlatmak giz ihlali değildir.\n\n## Betik\n\nArayüzden elle 40 senaryo koşmak hata üretir.\n\nPowerFactory Python, PSS/E Python veya pandapower ile şu dört adımı betiğe yaptırırsın:\n\n1. Senaryo tablosunu oku.\n2. Çöz.\n3. İhlalleri yaz.\n4. Sürümü etiketle.\n\nÜrünleşme, bu betiğin bir servise ve veri tabanına taşınmasıdır. `16` klasörü o taşımayı anlatır.\n\n> **Sade anlatım:** Önce bilgisayarında çalışan bir betik yazarsın. Sonra bu betik, başkalarının da çağırabildiği bir servise dönüşür ve sonuçlar bir veri tabanında saklanır. Buna ürünleşme denir.\n\nAşağıdaki konuşma, bu sayfanın tamamını mülakatta tek nefeste anlatman içindir. İçinde araç seçimi, model taşıma, doğrulama, CGMES ve betik var.\n\n## 90 saniye\n\n“Aracı soruya göre seçerim: planlama AC ve dinamik için PowerFactory veya PSS/E, milisaniye için EMT, dağıtım dengesiz için OpenDSS veya pandapower, algoritma için MATPOWER. Model taşırken baz, kademe, trafo grubu ve işaret bozulur; sayı ve seçilmiş akışl
