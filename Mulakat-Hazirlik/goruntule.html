<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TÜBİTAK MAM · Mülakat hazırlığı</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1c1915;
    --muted: #6d655c;
    --line: #e3dcd0;
    --side: #fbf9f5;
    --accent: #0f6e56;
    --accent-soft: #e5f3ee;
    --speak: #fff7e8;
    --speak-line: #e0a106;
    --code: #f3eee6;
    --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121410;
      --ink: #ece7df;
      --muted: #a39b90;
      --line: #2a2d27;
      --side: #181b16;
      --accent: #7dcea0;
      --accent-soft: #1c2b24;
      --speak: #2a2416;
      --speak-line: #e0a106;
      --code: #1e211c;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  aside {
    background: var(--side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand { padding: 22px 18px 12px; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 650;
  }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
  .brand p.sub { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .search { padding: 0 14px 12px; }
  .search input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 10px;
    padding: 9px 12px;
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  #nav { overflow: auto; padding: 4px 8px 24px; }
  .group {
    margin: 14px 10px 6px;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 650;
  }
  #nav button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    line-height: 1.35;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #nav button:hover { background: var(--accent-soft); }
  #nav button.on { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) {
    #nav button.on { color: #102018; }
  }
  main { min-width: 0; overflow: auto; scroll-behavior: smooth; }
  .bar {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .bar button, .menu {
    border: 1px solid var(--line);
    background: var(--side);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .bar button:hover, .menu:hover { border-color: var(--accent); }
  .bar button:disabled { opacity: 0.4; cursor: default; }
  #pos { color: var(--muted); font-size: 12.5px; margin-right: auto; }
  .hint { color: var(--muted); font-size: 12px; }
  .menu { display: none; }
  article {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 28px 80px;
    font-size: 17px;
    line-height: 1.72;
  }
  article h1 { font-size: 1.85rem; letter-spacing: -0.03em; line-height: 1.2; margin: 0 0 0.6em; }
  article h2 { font-size: 1.28rem; margin: 1.6em 0 0.45em; letter-spacing: -0.02em; }
  article h3 { font-size: 1.05rem; margin: 1.3em 0 0.35em; }
  article p { margin: 0.7em 0; }
  article a { color: var(--accent); }
  article ul, article ol { padding-left: 1.25em; }
  article li { margin: 0.25em 0; }
  article code {
    font-family: Consolas, "Cascadia Code", ui-monospace, monospace;
    font-size: 0.88em;
    background: var(--code);
    padding: 0.1em 0.35em;
    border-radius: 5px;
  }
  article pre {
    background: var(--code);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    overflow: auto;
    line-height: 1.5;
  }
  article pre code { background: none; padding: 0; }
  article table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.95em; }
  article th, article td { border-bottom: 1px solid var(--line); text-align: left; padding: 8px 10px; vertical-align: top; }
  article th { font-size: 0.86em; color: var(--muted); font-weight: 650; }
  article blockquote {
    margin: 1.1em 0;
    padding: 0.7em 1em;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 12px 12px 0;
    color: var(--ink);
  }
  article hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
  .speak {
    margin: 1.4em 0;
    padding: 4px 16px 12px;
    background: var(--speak);
    border-radius: 14px;
    border: 1px solid color-mix(in srgb, var(--speak-line) 45%, var(--line));
  }
  .speak h2 { margin-top: 12px; }
  .speak h2::before {
    content: "Sesli söyle";
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--speak-line);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .empty { color: var(--muted); padding: 28px 10px; font-size: 13.5px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(320px, 88vw);
      z-index: 5;
      transform: translateX(-105%);
      transition: transform 0.18s ease;
      box-shadow: 8px 0 30px rgba(0,0,0,0.12);
    }
    aside.open { transform: none; }
    .menu { display: inline-flex; }
    .hint { display: none; }
    article { padding: 20px 16px 72px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <p class="eyebrow">TÜBİTAK MAM</p>
      <h1>Mülakat hazırlığı</h1>
      <p class="sub">Bütün notlar bu sayfada. Soldan konu seç, okları ile ilerle.</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Konu veya kelime ara" autocomplete="off">
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div class="bar">
      <button class="menu" id="menu" type="button">Konular</button>
      <button id="prev" type="button">Önceki</button>
      <button id="next" type="button">Sonraki</button>
      <span id="pos"></span>
      <span class="hint">← → sayfa · / ara</span>
    </div>
    <article id="doc"></article>
  </main>
</div>

<script id="data" type="application/json">[{"id": "00-BASLA-BURADAN.md", "group": "Başlangıç", "title": "Başla buradan", "body": "# Başla buradan\n\nBu klasör, TÜBİTAK MAM araştırmacı mülakatına hazırlanmak içindir. Bu sayfa üç şeyi anlatır: ilan neyi istiyor, mülakat neyi ölçecek ve klasörler hangi sırayla çalışılır.\n\nKısaltmalar:\n\n- **TÜBİTAK:** Türkiye Bilimsel ve Teknolojik Araştırma Kurumu.\n- **MAM:** Marmara Araştırma Merkezi. TÜBİTAK'ın araştırma merkezlerinden biridir.\n\n## İlan künyesi\n\n| Alan | Değer |\n| --- | --- |\n| İlan | **TBTK.MAM.A.2026-2.02** (ilan kodu TBTK.MAM.A.2026-2) |\n| Pozisyon | Ar-Ge Personeli / Araştırmacı, proje personeli, en az 3 yıl |\n| Yer | Ankara |\n| Birim | TÜBİTAK MAM Enerji Teknolojileri Başkan Yardımcılığı, **Güç Sistemleri Araştırma Grubu** |\n| İşin cümlesi | Elektrik **iletim ve dağıtım** şebekeleri için **analiz** ve **yazılım** |\n\nİlan kodundaki **TBTK**, TÜBİTAK'ın kısaltmasıdır. **Ar-Ge**, araştırma ve geliştirme demektir.\n\nİşin cümlesi iki parçalıdır ve ikisi birlikte istenir:\n\n- **İletim ve dağıtım:** elektriğin santralden yüksek gerilimle taşınması (iletim) ve şehir içinde tüketiciye ulaştırılması (dağıtım).\n- **Analiz ve yazılım:** şebekenin davranışını hesaplamak ve bu hesabı çalışan bir programa dönüştürmek.\n\n## Kaynaklar\n\nBu klasör, ilandaki her maddeyi ve grubun kamuoyuna açıkladığı işleri mülakatta anlatılabilir hale getirir.\n\n| Bilgi türü | Kaynak |\n| --- | --- |\n| Rakamlar | TEİAŞ 2025 faaliyet raporu |\n| Rakamlar | TEİAŞ “Sayılarla Elektrik İletimi” sayfası (Eylül–Ekim 2026) |\n| Kurallar | Elektrik Şebeke Yönetmeliği |\n| Ürün tanımları | MAM'ın kendi sayfaları |\n\n**TEİAŞ:** Türkiye Elektrik İletim A.Ş. Türkiye'nin iletim şebekesini işleten devlet şirketidir. Grubun ana müşterisidir.\n\n## Mülakatın omurgası\n\nPanel büyük ihtimalle şunu ölçecek:\n\n- Bir iletim veya dağıtım problemini fizikten kurup sayısal yönteme dökebiliyor musun?\n- Sonucu işletme kararına çevirebiliyor musun?\n- Bunu çalışan bir yazılıma bağlayabiliyor musun?\n\n> Sade anlatım: Panel üç halkalı bir zincir arar. Fizik → hesap → karar → yazılım. Halkalardan biri eksikse cevap havada kalır.\n\nDört katman, ilandaki tercih sebeplerinin tamamını karşılar:\n\n1. **Şebeke fiziği:** temeller, iletim, dağıtım, kısa devre, koruma, topraklama.\n2. **Analiz:** yük akışı, güvenlik (N-1), kararlılık, durum kestirimi.\n3. **Karar:** ekonomik işletme, planlama, optimizasyon, yenilenebilir entegrasyon.\n4. **Yazılım:** Python, MATLAB, Java, JavaScript, analiz paketleri, veri modeli, dijital ikiz, web servis.\n\nİki terim açıklaması:\n\n- **N-1:** şebekedeki herhangi tek bir eleman (bir hat, bir trafo, bir santral) devre dışı kaldığında sistemin hâlâ güvenli çalışması ölçütü.\n- **Dijital ikiz:** gerçek şebekenin ölçümlerle sürekli güncellenen bilgisayar modeli.\n\nYanına üç davranış ölçütü gelir:\n\n- araştırmaya istek,\n- analitik problem çözme,\n- koordinasyon ve planlama.\n\nLisansüstü motivasyonu da ayrıca sorulur.\n\n## Nasıl çalışılır\n\nHer teknik klasörde `00-Alt-Basliklar.md` dosyası o konunun tam listesidir. Diğer dosyalar bu başlıkları anlatır.\n\nDosyanın sonundaki **90 saniye** kutusunu sesli söyle. Takılırsan o kutu, mülakatta kullanacağın iskelettir.\n\nÇalışma sırası:\n\n1. `01` kurum, ilan, Türkiye sistemi, YTBS, SIPS. Bunları bilmeden teknik cevap havada kalır.\n2. `02` → `06` fizik ve klasik analiz.\n3. `07` → `12` güvenlik, kararlılık, kestirim, koruma, ekonomi, planlama. İlanın göbeği burası.\n4. `13` → `16` optimizasyon ve yazılım. `14-Programlama/ornekler` altındaki üç betiği kendi makinede çalıştır.\n5. `17` ve `18` yenilenebilir, depolama, tahmin, yapay zekâ.\n6. `19` anlatım. `20` soru bankasını kart gibi çevir. `21` takvim.\n\nİlk adımdaki iki kısaltma:\n\n- **YTBS:** Yük Tevzi Bilgi Sistemi. MAM'ın TEİAŞ için geliştirdiği enerji yönetim platformudur.\n- **SIPS:** System Integrity Protection Scheme, yani sistem bütünlüğünü koruma şeması. Büyük bir arızada şebekenin çökmesini önleyen özel koruma sistemidir.\n\n## Online sınav\n\nOnline teknik sınav veya envanter, mülakattan önce gelebilir. İlan bunu açıkça yazar.\n\nSoru bankasındaki kısa cevaplar ve `ornekler` klasörü bu sınav içindir. Ayrıntı `01-Kurum-Ilan-ve-Surec/05-Envanter-ve-Online-Degerlendirme.md` dosyasındadır.\n\n## Klasör haritası\n\n| Klasör | Ne işe yarar |\n| --- | --- |\n| 01 Kurum, ilan, süreç | Nereye başvurduğunu ve Türkiye sistemini kendi cümlelerinle anlatmak |\n| 02 Temeller | Fazör, birim sistem, dizi bileşenleri, P–δ ve Q–V |\n| 03 İletim | 400/154/66 kV, hat, trafo, FACTS, enterkonneksiyon |\n| 04 Dağıtım | Radyal şebeke, dağıtık üretim, barındırma kapasitesi, DMS |\n| 05 Yük akışı | NR, ayrık hızlı, DC, dağıtım yük akışı |\n| 06 Kısa devre | Simetrik bileşenler, IEC 60909, kesici |\n| 07 Güvenlik | N-1, beklenmeyen durum taraması, düzeltici kontrol, SIPS |\n| 08 Kararlılık | Açı, gerilim, frekans; atalet, AGC, PSS |\n| 09 Durum kestirimi | WLS, gözlenebilirlik, kötü veri, PMU |\n| 10 Koruma ve topraklama | Seçicilik, mesafe, diferansiyel, koordinasyon |\n| 11 Ekonomik işletme | Ekonomik dağıtım, ünite tahsisi, OPF, piyasa |\n| 12 Planlama | Talep tahmini, master plan, güvenilirlik, fizibilite |\n| 13 Optimizasyon | LP, MILP, KKT, şebeke formülasyonları |\n| 14 Programlama | Python, MATLAB, Java, JavaScript ve çalışan örnekler |\n| 15 Analiz yazılımları | PowerFactory, PSS/E, ETAP, pandapower, CIM/CGMES |\n| 16 Yazılım mimarisi | EMS zinciri, dijital ikiz, servis, veri tabanı |\n| 17 Yenilenebilir ve akıllı şebeke | Evirici tabanlı kaynak, depolama, şebeke kodu |\n| 18 Veri ve yapay zekâ | Yük ve RES tahmini, karar destek, model sınırı |\n| 19 Davranışsal | Araştırma, STAR, lisansüstü, sorulacak sorular |\n| 20 Soru bankası | Teknik, yazılım ve formül kartı |\n| 21 Çalışma planı | 14 günlük yoğun takvim |\n\n### Tablodaki kısaltmalar\n\nHer biri ilgili klasörde ayrıntılı anlatılır. Burada yalnızca açılımı var.\n\n| Kısaltma | Açılımı | Kısa anlamı |\n| --- | --- | --- |\n| P–δ, Q–V | Aktif güç–yük açısı, reaktif güç–gerilim | Aktif güç açıyla, reaktif güç gerilimle ilişkilidir |\n| kV | Kilovolt | 1000 volt |\n| FACTS | Flexible AC Transmission Systems | Esnek alternatif akım iletim sistemleri; güç elektroniğiyle hat akışını ve gerilimi denetler |\n| DMS | Distribution Management System | Dağıtım yönetim sistemi |\n| NR | Newton-Raphson | Yük akışında kullanılan yinelemeli çözüm yöntemi |\n| DC | Direct current (doğru akım) | Burada “DC yük akışı”: yalnızca aktif gücü hesaplayan doğrusal yaklaşık model |\n| IEC 60909 | International Electrotechnical Commission standardı 60909 | Kısa devre akımı hesaplama standardı |\n| AGC | Automatic Generation Control | Otomatik üretim kontrolü; frekansı ve bölgeler arası akışı düzeltir |\n| PSS | Power System Stabilizer | Güç sistemi kararlı kılıcısı; jeneratördeki salınımları sönümler |\n| WLS | Weighted Least Squares | Ağırlıklı en küçük kareler; durum kestiriminin temel yöntemi |\n| PMU | Phasor Measurement Unit | Fazör ölçüm birimi; zaman damgalı gerilim ve akım ölçer |\n| OPF | Optimal Power Flow | Optimal güç akışı; şebeke kısıtları altında maliyeti en aza indirir |\n| LP | Linear Programming | Doğrusal programlama |\n| MILP | Mixed-Integer Linear Programming | Karma tamsayılı doğrusal programlama |\n| KKT | Karush–Kuhn–Tucker koşulları | Kısıtlı optimizasyonda en iyi noktanın sağlaması gereken koşullar |\n| PSS/E | Power System Simulator for Engineering | Siemens'in iletim analiz yazılımı |\n| ETAP | Electrical Transient Analyzer Program | Ticari güç sistemi analiz yazılımı |\n| CIM/CGMES | Common Information Model / Common Grid Model Exchange Standard | Şebeke modelini kurumlar arasında paylaşmak için veri standardı |\n| EMS | Energy Management System | Enerji yönetim sistemi; iletim işletmesinin analiz yazılımı |\n| RES | Rüzgâr enerji santrali | — |\n| STAR | Situation, Task, Action, Result | Durum, görev, eylem, sonuç; davranışsal soruya cevap kalıbı |\n\n## Bu hazırlıkta bilinçli olarak yapılmayanlar\n\nBu klasörde şunlar yoktur:\n\n- gizli TEİAŞ modeli,\n- gerçek röle ayarı,\n- iç yazılım kodu,\n- personel bilgisi.\n\nMülakatta da olmaması gerekir. Ürünleri MAM'ın yayımladığı yeteneklerle anlat; içerideki mimariyi bildiğini iddia etme.\n\n## Ezber rakamlar\n\nGüncel kurulu güç her ay değişir. Ezber rakam söylerken ayını da söyle.\n\n| Rakam | Değer | Tarih |\n| --- | --- | --- |\n| Kurulu güç | 122.518,6 MW | 2025 sonu |\n| Ani puant | 60.414 MW | 2025, Temmuz |\n| Kurulu güç | 127.355,2 MW | Eylül 2026 sonu |\n\nTerimler:\n\n- **MW:** megavat, bir milyon vat.\n- **Kurulu güç:** ülkedeki bütün santrallerin toplam kapasitesi.\n- **Ani puant:** bir yıl içinde herhangi bir anda görülen en yüksek tüketim.\n\n> Mülakatta şöyle söyle: \"2025 sonunda kurulu güç 122.518,6 megavattı; Eylül 2026 sonu itibarıyla 127.355,2 megavat. 2025'in ani puantı Temmuz'da 60.414 megavat.\"\n"}, {"id": "01-Kurum-Ilan-ve-Surec/00-Alt-Basliklar.md", "group": "01  Kurum, ilan, süreç", "title": "01 — Kurum, ilan ve süreç", "body": "# 01 — Kurum, ilan ve süreç\n\nBu klasör, başvurduğun ilanı ve kurumu tanıtır. Kurum MAM'dır (TÜBİTAK Marmara Araştırma Merkezi). İlan ne istiyor, puan nasıl hesaplanıyor, mülakata kim çağrılıyor, grup ne iş yapıyor ve Türkiye elektrik sistemi hangi kurallarla işliyor; hepsi burada.\n\nAşağıdaki liste bir içindekiler tablosudur. Her maddenin altında, o konuda ne öğreneceğin tek cümleyle yazılı. Konuların hangi sayfada anlatıldığı da parantez içinde verildi.\n\n## Bu klasördeki sayfalar\n\n| Sayfa | Ne anlatır |\n|---|---|\n| [01-Ilan-Puan-ve-Mulakat.md](01-Ilan-Puan-ve-Mulakat.md) | İlanın kimliği, zorunlu koşullar, puan formülü, mülakat elemesi, belge ve beyan |\n| [02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md) | Grup, YTBS (Yük Tevzi Bilgi Sistemi), SIPS (System Integrity Protection Scheme, Akıllı Koruma Sistemi), STATCOM (statik senkron kompanzatör), Türkiye sisteminin kurumları, yönetmelik sınırları, büyüklükler, enterkonneksiyon |\n| [03-Guncel-Projeler-Yayinlar-Urunler.md](03-Guncel-Projeler-Yayinlar-Urunler.md) | Devam eden projeler, ürünler ve yayınlar; hangi bilginin doğrulandığı |\n| [04-Tercih-Sebebi-Kanit-Tablosu.md](04-Tercih-Sebebi-Kanit-Tablosu.md) | İlandaki tercih sebeplerinin her birine karşı senin kanıtın |\n| [05-Envanter-ve-Online-Degerlendirme.md](05-Envanter-ve-Online-Degerlendirme.md) | Mülakat öncesi envanter ve online değerlendirmeye hazırlık |\n\n## Alt başlıklar\n\n1. **İlan kimliği ve kadro**\n   Unvan, ilan ve referans kodu, görev yeri, kontenjan ve son başvuru tarihini öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n2. **İş tanımının çözümü: analiz ve yazılım, iletim ve dağıtım**\n   Kısa iş tanımı cümlesinin hangi somut iş parçalarına ayrıldığını öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n3. **Zorunlu koşullar: bölüm, yaş, 3 yıl, İngilizce, genel şartlar**\n   Başvurunun geçerli sayılması için şart olan her koşulu ve İngilizce puan eşiklerini öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n4. **Dokuz tercih sebebi ve her birinin mülakat karşılığı**\n   İlandaki tercih sebeplerinin her biri için mülakatta hangi kanıtı göstereceğini öğreneceksin. ([04](04-Tercih-Sebebi-Kanit-Tablosu.md)) Not: başlık \"dokuz\" diyor, 04 sayfasındaki tablo ise on madde sayıyor; sayıyı ilan metninden teyit et.\n5. **Tecrübeli araştırmacı puan formülü**\n   Mülakata çağrılma sırasını belirleyen formülü ve tecrübe teriminin nasıl davrandığını öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n6. **Özel koşul ek puanı**\n   Ödül ve derecelerin formüle kaç puan eklediğini ve tavanını öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n7. **Mülakat elemesi: 10 kat, 70 puan, asil ve yedek**\n   Kaç adayın çağrıldığını, barajın kaç olduğunu ve asil-yedek listesinin nasıl çıktığını öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n8. **Envanter ve online teknik değerlendirme**\n   Mülakattan önce gelebilecek testlerin olası biçimlerini ve her birine nasıl hazırlanacağını öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md), [05](05-Envanter-ve-Online-Degerlendirme.md))\n9. **Belge ve beyan riski**\n   Hangi belgelerin istendiğini ve beyanınla mülakatta anlattığının neden aynı olması gerektiğini öğreneceksin. ([01](01-Ilan-Puan-ve-Mulakat.md))\n10. **MAM Enerji Teknolojileri ve Güç Sistemleri Araştırma Grubu**\n    Başvurduğun grubun ne iş yaptığını ve hangi birime bağlı olduğunu öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md), [03](03-Guncel-Projeler-Yayinlar-Urunler.md))\n11. **Grubun çalışma alanlarının tam listesi**\n    Grubun kendi sayfasında saydığı on bir çalışma alanını ve içlerindeki terimleri öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n12. **Uygulama alanları ve EERA üyeliği**\n    Grubun işinin hangi kanallardan dışarı çıktığını ve EERA (European Energy Research Alliance, Avrupa Enerji Araştırma İttifakı) ile bağını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n13. **Yük Tevzi Bilgi Sistemi (YTBS)**\n    Grubun TEİAŞ (Türkiye Elektrik İletim A.Ş.) için geliştirdiği enerji yönetim platformunu ve SCADA'dan (Supervisory Control and Data Acquisition, Denetleyici Kontrol ve Veri Toplama) farkını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n14. **Akıllı Koruma Sistemi (SIPS)**\n    Geniş alan ölçümüyle çalışan koruma sistemini ve klasik röleden farkını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n15. **STATCOM'un bu ilanla ilişkisi**\n    MAM'ın STATCOM ürününün senin analiz işinle nasıl bağlandığını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n16. **Türkiye elektrik sisteminin kurumları**\n    TEİAŞ, EPİAŞ (Enerji Piyasaları İşletme A.Ş.), EPDK (Enerji Piyasası Düzenleme Kurumu), dağıtım ve üretim taraflarının kim olduğunu ve ne yaptığını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n17. **Gerilim seviyeleri ve şebeke yönetmeliği sınırları**\n    Ezberlenmesi gereken gerilim bantlarını, planlama kriterini ve N-1 (bir şebeke elemanı devre dışıyken) şartlarını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n18. **Kurulu güç, puant, hat ve trafo büyüklüğü**\n    Türkiye sisteminin büyüklüklerini kaynağıyla ve nasıl yorumlanacağıyla öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n19. **Enterkonneksiyon ve ENTSO-E**\n    Türkiye'nin ENTSO-E (European Network of Transmission System Operators for Electricity, Avrupa Elektrik İletim Sistemi İşletmecileri Ağı) bölgesine ve komşu ülkelere hangi hatlarla bağlı olduğunu, senkron bağlantı ile HVDC (High Voltage Direct Current, Yüksek Gerilim Doğru Akım) farkını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n20. **Milli Yük Tevzi ve frekans kontrolünün kurumsal yeri**\n    Şebekeyi gerçek zamanda kimin yönettiğini ve frekansın hangi kademelerle toparlandığını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md))\n21. **Adayın kendi tecrübesini bu listeye bağlama iskeleti**\n    Üç dakikalık girişini hangi sırayla kuracağını ve grubun işine nasıl köprü atacağını öğreneceksin. ([02](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md), [04](04-Tercih-Sebebi-Kanit-Tablosu.md))\n\n## Bu sayfayı dene\n\nÇoktan seçmeli. Bilemediğin soru tarayıcıda saklanır ve doğru bilinene kadar yeniden sorulur.\n\n[Bu sayfanın sorularına geç](test.html?sayfa=01-00)\n"}, {"id": "01-Kurum-Ilan-ve-Surec/01-Ilan-Puan-ve-Mulakat.md", "group": "01  Kurum, ilan, süreç", "title": "İlan, puan ve mülakat süreci", "body": "# İlan, puan ve mülakat süreci\n\nBu sayfa başvurduğun ilanı baştan sona anlatır. Önce ilanın kimliğini verir: kod, yer, kontenjan, tarih. Sonra kısa iş tanımının aslında hangi işleri kastettiğini açar. Ardından zorunlu koşulları, mülakata kimin çağrılacağını belirleyen puan formülünü ve mülakat elemesini anlatır. En sonda belge ve beyan riskini ve mülakatta söyleyeceğin kısa metni verir.\n\nİlanda geçen kurum adı **MAM**, TÜBİTAK Marmara Araştırma Merkezi'dir. Başvurduğun grup, MAM'ın Ankara'daki Güç Sistemleri Araştırma Grubu'dur.\n\n## Sayfa haritası\n\n1. **Kimlik:** ilanın kodu, görev yeri, kontenjanı, son başvuru tarihi ve grubun iletişim bilgisi.\n2. **İş tanımının çözümü:** tek cümlelik iş tanımından çıkan dört iş parçası.\n3. **Zorunlu koşullar:** bölüm, yaş, tecrübe, İngilizce ve genel şartlar.\n4. **Puan formülü:** mülakata çağrılma sırasını belirleyen hesap, tecrübe terimi ve özel koşul ek puanı.\n5. **Mülakat elemesi:** kaç kişinin çağrıldığı, baraj, asil ve yedek.\n6. **Mülakat öncesi değerlendirme:** envanter, teknik test ve ekibin yazılım yığını.\n7. **Beyan:** istenen belgeler ve tutarlılık riski.\n8. **Mülakatta 90 saniye:** mülakatta söyleyeceğin kısa metin.\n\n## 1. Kimlik\n\nİlanın temel bilgileri aşağıda. **Referans kodu**, aynı ilan içindeki belirli kadroyu gösteren alt koddur; başvuru bu koda yapılır.\n\n| Alan | Değer |\n| --- | --- |\n| Unvan | Araştırmacı (Ar-Ge personeli) |\n| İlan kodu | TBTK.MAM.A.2026-2 |\n| Referans | TBTK.MAM.A.2026-2.02 |\n| İş yeri | MAM |\n| Görev yeri | Ankara |\n| Statü | Proje personeli |\n| Tecrübe | 3 yıl ve daha fazlası |\n| Kontenjan | 3 |\n| Son başvuru | 05.10.2026, 17:00 |\n| Başvuru | Yalnızca kariyer.tubitak.gov.tr |\n| Aynı dönem kuralı | TBTK ile başlayan, son başvurusu aynı tarih olan ilanlardan en fazla 2 |\n\nSon satırı açalım. Kodu \"TBTK\" ile başlayan ve son başvuru tarihi aynı olan ilanlardan en fazla ikisine başvurabilirsin.\n\n**Proje personeli** statüsü, kadronun belirli projelere bağlı olarak açıldığını anlatır.\n\n### Görev yeri ve iletişim\n\nGörev yerinin Ankara olması önemlidir. Bu, Gebze'deki genel MAM adresinden ayrıdır.\n\n| Bilgi | Değer |\n| --- | --- |\n| Birim adı | Enerji Teknolojileri Başkan Yardımcılığı, Ankara |\n| Grubun iletişim telefonu | 0312 210 18 30 |\n| E-posta | `mam.byet-gsag@tubitak.gov.tr` |\n\n## 2. İş tanımının çözümü\n\nİlandaki iş tanımı kısadır ve bilinçli olarak geniştir:\n\n> Güç sistemleri araştırma alanında yürütülen projelerde, elektrik iletim ve dağıtım şebekeleri için analiz ve yazılım geliştirme.\n\nİki terim:\n\n- **İletim:** elektriği santrallerden şehirlere yüksek gerilimle taşıyan ana şebeke.\n- **Dağıtım:** bu elektriği daha düşük gerilimle evlere ve işyerlerine ulaştıran yerel şebeke.\n\nBu tek cümleden dört iş parçası çıkar:\n\n| İş parçası | İçinde ne var |\n| --- | --- |\n| Modeli kurmak | Bara, hat, trafo, üretim, yük, koruma |\n| Analizi koşmak | Yük akışı, kısa devre, güvenlik, kararlılık, durum kestirimi, ekonomik işletme, planlama |\n| Sonucu karara çevirmek | Limit ihlali, yatırım, işletme talimatı, koruma ayarı |\n| Bunu başkasının kullanacağı yazılıma koymak | Algoritma, veri, servis, arayüz, test |\n\nTablodaki birkaç terim:\n\n- **Bara:** şebeke modelinde hatların, trafoların ve yüklerin birleştiği bağlantı düğümü.\n- **Yük akışı:** belli bir üretim ve tüketim durumunda her hattan ne kadar güç geçtiğini ve baraların gerilimini hesaplayan temel analiz.\n- **Kısa devre:** arıza anında akan akımın hesabı.\n- **Durum kestirimi:** sahadan gelen, hatalı olabilecek ölçümlerden şebekenin en olası gerçek durumunu bulmak.\n- **Limit ihlali:** bir büyüklüğün izin verilen sınırı aşması.\n\n### İki yaygın tuzak\n\nİlan **hem iletim hem dağıtım** yazar. Yalnızca 400 kV anlatıp 34,5 kV'yi boş bırakmak ilanın yarısını kaçırır. 400 kV iletimin, 34,5 kV ise dağıtımın tipik gerilimidir.\n\nAynı şekilde yalnızca fizik anlatıp kod tarafını \"öğrenirim\" diye geçiştirmek, ilanın \"yazılım projelerinde aktif çalışmış olmak\" maddesine çarpar.\n\n> **Sade anlatım:** İlan \"analiz\" ve \"yazılım\" kelimelerini yan yana koyuyor. İkisinden birini boş bırakırsan, cevabının yarısı eksik kalır.\n\n## 3. Zorunlu koşullar\n\nBu koşulların hepsi sağlanmazsa başvuru geçersizdir.\n\n| Koşul | Ayrıntı |\n| --- | --- |\n| Bölüm | Elektrik veya Elektrik-Elektronik Mühendisliği, en az 4 yıllık lisans |\n| Doğum tarihi | 01.01.1991 ve sonrası |\n| Tecrübe | İş tanımındaki alanda en az 3 tam yıl. Bu süreden az başvuru geçersizdir. Doktora, istihdam edileceği alanda 4 yıl tecrübeye sayılır. |\n| Askerlik | Erkek adayda son başvuru itibarıyla askerlik bitmiş, muaf veya tecilli |\n| Genel şartlar | Kamu haklarından yasaklı olmamak, görevini sürekli engelleyecek hastalık bulunmamak, ilanda sayılan adli şartlar |\n\n**Tecilli**, askerliği yasal olarak ertelenmiş demektir.\n\n### İngilizce\n\nAşağıdaki sınavlardan birinde verilen puan veya düzey yeterlidir. Bu puanlarda **geçerlilik süresi aranmaz**; yani eski tarihli bir sonuç da kabul edilir.\n\n| Sınav | Gereken |\n| --- | --- |\n| YDS, YÖKDİL, KPDS veya ÜDS | 70 |\n| TOEFL iBT | 84 |\n| TOEFL CBT | 221 |\n| TOEFL PBT | 561 |\n| FCE | C |\n| CAE | B |\n| CPE | C |\n\nKısaltmalar:\n\n- **YDS:** Yabancı Dil Bilgisi Seviye Tespit Sınavı.\n- **YÖKDİL:** Yükseköğretim Kurumları Yabancı Dil Sınavı.\n- **KPDS:** Kamu Personeli Yabancı Dil Bilgisi Seviye Tespit Sınavı (eski sınav).\n- **ÜDS:** Üniversitelerarası Kurul Yabancı Dil Sınavı (eski sınav).\n- **TOEFL** (Test of English as a Foreign Language): uluslararası İngilizce sınavı. **iBT** internet tabanlı, **CBT** bilgisayar tabanlı, **PBT** kâğıt tabanlı sürümdür.\n- **FCE, CAE, CPE:** Cambridge sınavları. Sırasıyla First Certificate in English, Certificate in Advanced English, Certificate of Proficiency in English.\n\nİngilizce puanı **aranmayan** üç hal vardır:\n\n1. %100 İngilizce lisans. Alan dışı dersler hariç tutulur ve üniversite bunu onaylamalıdır.\n2. Resmi dili İngilizce olan bir ülkede lisans, YL (yüksek lisans) veya doktora.\n3. Ya da o ülkede iş tanımındaki alanda en az 3 yıl meslek.\n\n## 4. Puan formülü (bu ilan tecrübelidir)\n\nBu formül **mülakat notu değildir**. Mülakata kimin çağrılacağını sıralar. İlan \"araştırmacı ve tecrübe şartlı\" olduğu için aşağıdaki formül kullanılır.\n\nFormüldeki kısaltmalar:\n\n- **GNO:** Genel Not Ortalaması. Burada 4'lük sistemde lisans ortalaman.\n- **YKS:** Yükseköğretim Kurumları Sınavı. Üniversiteye yerleştiğin sınavdaki sıralaman kullanılır.\n\nAşağıdaki blok formülün kendisidir. Dört terimi toplar ve sonucun en az 3,20 olmasını ister.\n\n```\nLisans GNO (4'lük)\n+ 5 * (1 / (1 + e^(5 - tecrübe yılı)))\n+ 10000 / (YKS yerleştirme sıralaması)\n+ özel koşul ek puanı\n>= 3,20\n```\n\nTerimleri tek tek okuyalım:\n\n| Terim | Ne ölçer |\n| --- | --- |\n| Lisans GNO (4'lük) | Lisans başarın |\n| `5 * (1 / (1 + e^(5 - tecrübe yılı)))` | Tecrübe yılın; tavanı 5 puan |\n| `10000 / (YKS yerleştirme sıralaması)` | Sınav sıralaman; sıralama küçüldükçe (yani daha iyi oldukça) puan büyür |\n| Özel koşul ek puanı | Alanla ilgili ödül ve dereceler |\n| `>= 3,20` | Toplamın geçmesi gereken alt sınır |\n\n### Tecrübe terimi nasıl davranır?\n\nTecrübe terimi bir **lojistik doygunluktur**. Yani başta yavaş artar, ortada hızlanır, sonra tavana yaklaşıp yatay kalır. Burada `e`, doğal logaritmanın tabanıdır (yaklaşık 2,718).\n\n| Tecrübe yılı | Tecrübe terimi |\n| --- | --- |\n| 3 | Yaklaşık 0,56 |\n| 5 | 2,50 |\n| 7 | Yaklaşık 4,41 |\n| 10 | Yaklaşık 4,97 |\n| Tavan | 5 puan |\n\n5 yılda değer tam 2,50 çıkar, çünkü üs `5 − 5 = 0` olur, `e^0 = 1` olur ve terim `5 × 1/2 = 2,50` olur.\n\nSonuç: kıdem tek başına GNO'yu ezmez, fakat 3 yıl ile 7 yıl arasında ciddi fark açar.\n\nKontrol notu: formülü hesap makinesiyle yeniden koşarsan 3 yıl için yaklaşık 0,60 ve 7 yıl için yaklaşık 4,40 bulursun. Tablodaki 0,56 ve 4,41 değerleri bu notun önceki sürümünden aynen korundu; mülakatta kesin sayı söyleyeceksen kendin hesapla.\n\n> **Sade anlatım:** Tecrübe puanı bir doldurma kabı gibidir. İlk yıllarda yavaş dolar, 3 ile 7 yıl arasında hızla dolar, 10 yılda neredeyse ağzına kadar dolmuştur. Kabın hacmi 5 puandır.\n\n### Not ve sıralama dönüşümleri\n\n- **100 üzerinden not**, YÖK'ün (Yükseköğretim Kurulu) 4'lük dönüşüm tablosuyla çevrilir.\n- **Yurt dışı mezuniyette** GNO ve sıralama yerine Times Higher Education sıralaması kullanılır. İlk 1000 dışındaki üniversiteden başvuru alınmaz.\n- **ÖSYM'siz veya DGS ile gelen adayda**, başladığı yıldaki bölümün en düşük yerleştirme sıralaması kullanılır. ÖSYM, Ölçme, Seçme ve Yerleştirme Merkezi'dir; DGS, Dikey Geçiş Sınavı'dır (ön lisanstan lisansa geçiş sınavı).\n\n### Özel koşul ek puanı\n\n| Kural | Değer |\n| --- | --- |\n| Ne sayılır | Alanla ilgili ulusal veya uluslararası birincilik, ikincilik, üçüncülük ya da ödül |\n| Her biri | 0,3 |\n| Tavan | 0,9 |\n| Hangi dönem | Ön lisans, lisans veya sonrası sayılır |\n| Belge | Belgesiz beyan puan üretmez |\n\nYani en fazla üç ödül puan getirir: `3 × 0,3 = 0,9`.\n\n## 5. Mülakat elemesi\n\n### Kim çağrılır?\n\nÇağrı kuralı: her referans kodu için en yüksek puandan başlayarak **kontenjanın 10 katı** aday çağrılır.\n\n- Kontenjan 3 kişi olduğu için 30 aday çağrılır.\n- Son sıradaki puanı paylaşanlar da çağrılır. Yani 30. adayla aynı puanı alan herkes listeye girer.\n\n### Mülakatta baraj\n\nMülakat 100 üzerinden **70** barajlıdır.\n\n- Barajı geçenler kendi içinde sıralanır.\n- 3 asil, en fazla 3 yedek belirlenir.\n- 70 altı alan aday, formül puanı yüksek olsa da elenir.\n\n> **Sade anlatım:** Formül puanı seni yalnızca kapıdan içeri sokar. İçeride herkes sıfırdan başlar ve 70'i geçmek zorundadır.\n\n## 6. Mülakat öncesi değerlendirme\n\nMülakattan önce envanter, teknik değerlendirme veya online araç gelebilir. **Bu tur da elemedir.**\n\nGelebilecek biçimler:\n\n- kod,\n- kısa analiz sorusu,\n- kişilik envanteri.\n\n**Envanter**, kişilik ve yetkinlik özelliklerini ölçen anket tipi testtir. Ayrıntılı hazırlık [05-Envanter-ve-Online-Degerlendirme.md](05-Envanter-ve-Online-Degerlendirme.md) sayfasındadır.\n\n### Ekibin yazılım yığını\n\nAynı dönemde yayımlanan aday araştırmacı ilanı, ekibin yazılım tarafını gösterir:\n\n| Teknoloji | Ne işe yarar |\n| --- | --- |\n| Java | Programlama dili |\n| JavaScript | Web arayüzü ve programlama dili |\n| İlişkisel veri tabanı | Tablolar halinde veri saklama |\n| REST/SOAP | Web servis türleri. REST (Representational State Transfer) hafif, SOAP (Simple Object Access Protocol) daha katı kurallı bir servis biçimidir. |\n| Git | Sürüm kontrol |\n| Maven | Java projelerini derleme ve bağımlılık yönetimi |\n| Jenkins | Otomatik derleme ve test (sürekli entegrasyon) |\n| GitLab | Git deposu barındırma ve iş akışı platformu |\n\nSenin ilanın bu listeyi zorunlu tutmaz; sen analiz tarafındasın. Yine de aynı ürün ailesine kod yazılacağı için bu yığını tanımak gerekir.\n\n## 7. Beyan\n\nKariyer sistemindeki **beyan esastır**. Hatalı bilgi veya eksik belge başvuruyu düşürür.\n\nİstenen belgeler:\n\n- transkript,\n- diploma,\n- YKS sonuç ve yerleştirme belgesi,\n- yabancı dil belgesi,\n- SGK (Sosyal Güvenlik Kurumu) hizmet dökümü,\n- meslek kodu yoksa çalışma belgesi,\n- varsa ödül belgesi,\n- erkek adayda askerlik belgesi.\n\n**SGK hizmet dökümü**, hangi işyerinde hangi tarihler arasında sigortalı çalıştığını gösteren resmi kayıttır.\n\nMülakatta tecrübe yılın ile anlattığın projelerin, bu belgelerle aynı hikâyeyi anlatması gerekir. Bu konunun ayrıntısı [04-Tercih-Sebebi-Kanit-Tablosu.md](04-Tercih-Sebebi-Kanit-Tablosu.md) sayfasındaki \"Tecrübe beyanı uyarısı\" bölümündedir.\n\n### 90 saniyelik metin için not\n\nAşağıdaki metin bu sayfanın sözlü özetidir. Kısaltmalar:\n\n- **TEİAŞ:** Türkiye Elektrik İletim A.Ş., ülkenin iletim şebekesini işleten kurum.\n- **SIPS** (System Integrity Protection Scheme): Akıllı Koruma Sistemi; geniş alan ölçümüyle sistem bütünlüğünü koruyan sistem. Ayrıntısı [02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md](02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md) sayfasında.\n- **Yük Tevzi Bilgi Sistemi** (YTBS): grubun TEİAŞ için geliştirdiği enerji yönetim platformu.\n\n## Mülakatta 90 saniye\n\n“Başvurduğum kadro, Ankara’daki Güç Sistemleri Araştırma Grubu’nda iletim ve dağıtım şebekesi için analiz ve yazılım işi. Grup TEİAŞ’ın kullandığı Yük Tevzi Bilgi Sistemi’ni ve geniş alan ölçümüne dayanan SIPS’i geliştirmiş. Ben de analiz tarafında yük akışı, güvenlik, kararlılık ve durum kestirimini; yazılım tarafında bu hesapların veri modeli, servis ve test ile nasıl ürüne döndüğünü anlatabilirim. Kontenjan 3, baraj 70. Öncesinde online teknik değerlendirme olabileceğini de biliyorum.”\n\n## Kendini yokla\n\nÖnce cevabı kapat, kendin söyle, sonra kontrol et.\n\n1. **İlan kodu ve referans kodu nedir?**\n   İlan kodu TBTK.MAM.A.2026-2, referans TBTK.MAM.A.2026-2.02.\n\n2. **Görev yeri neresi, son başvuru ne zaman?**\n   Ankara. 05.10.2026, saat 17:00.\n\n3. **İş tanımından çıkan dört iş parçası nedir?**\n   Modeli kurmak, analizi koşmak, sonucu karara çevirmek, bunu başkasının kullanacağı yazılıma koymak.\n\n4. **Tecrübe şartı nedir? Doktora kaç yıl sayılır?**\n   İş tanımındaki alanda en az 3 tam yıl. Doktora, istihdam edileceği alanda 4 yıl tecrübeye sayılır.\n\n5. **YDS ve TOEFL iBT için gereken puan nedir?**\n   YDS 70, TOEFL iBT 84. Geçerlilik süresi aranmaz.\n\n6. **Tecrübe teriminin tavanı nedir ve 5 yılda kaç puan verir?**\n   Tavan 5 puan. 5 yılda 2,50.\n\n7. **Özel koşul ek puanı nasıl hesaplanır?**\n   Her alanla ilgili derece veya ödül 0,3; tavan 0,9; belgesiz beyan puan üretmez.\n\n8. **Mülakata kaç kişi çağrılır, baraj kaçtır?**\n   Kontenjanın 10 katı, yani 30 aday; son sıradaki puanı paylaşanlar da çağrılır. Baraj 100 üzerinden 70. 3 asil, en fazla 3 yedek.\n\n9. **Formül puanı yüksek ama mülakattan 65 alan aday ne olur?**\n   Elenir. 70 altı, formül puanı yüksek olsa da elenir.\n\n## Bu sayfayı dene\n\nÇoktan seçmeli. Bilemediğin soru tarayıcıda saklanır ve doğru bilinene kadar yeniden sorulur.\n\n[Bu sayfanın sorularına geç](test.html?sayfa=01-01)\n"}, {"id": "01-Kurum-Ilan-ve-Surec/02-MAM-YTBS-SIPS-ve-Turkiye-Sistemi.md", "group": "01  Kurum, ilan, süreç", "title": "MAM grubu, YTBS, SIPS ve Türkiye şebekesi", "body": "# MAM grubu, YTBS, SIPS ve Türkiye şebekesi\n\nBu sayfa üç şeyi anlatır. Önce başvurduğun grubu tanıtır: MAM'ın (TÜBİTAK Marmara Araştırma Merkezi) Güç Sistemleri Araştırma Grubu. Sonra bu grubun iki ana ürününü açıklar. Son olarak Türkiye elektrik sisteminin kurumlarını, kurallarını ve büyüklüklerini verir.\n\nGüç sistemlerini unuttuysan sorun değil. Her terim ilk geçtiği yerde açılıyor. Önce tek bir kelimeyle başlıyoruz, çünkü sayfanın yarısı ona dayanıyor.\n\n## Sayfa haritası\n\n1. **\"Nominal\" ne demek?** Sayfadaki bütün sayıları okumak için gereken anahtar kelime ve birkaç birim.\n2. **Güç Sistemleri Araştırma Grubu:** grup ne yapar, hangi alanlarda çalışır.\n3. **YTBS:** grubun enerji yönetim platformu.\n4. **SIPS:** grubun akıllı koruma sistemi ve klasik röleden farkı.\n5. **STATCOM:** MAM'ın bir başka ürünü ve seninle ilişkisi.\n6. **Türkiye sisteminin kurumları:** TEİAŞ, EPİAŞ, EPDK, dağıtım, üretim.\n7. **Şebeke yönetmeliğinden sınırlar:** gerilim, planlama, N-1, frekans, rezervler, PSS.\n8. **Büyüklükler:** kurulu güç, puant, tüketim, hat uzunluğu, trafo sayıları.\n9. **Enterkonneksiyon:** Türkiye'nin komşu ülkelerle bağlantısı.\n10. **Kendi tecrübeni bağlama:** üç dakikalık girişin sırası.\n11. **90 saniye:** mülakatta söyleyeceğin kısa metin.\n12. **Kendini yokla:** sorular ve cevaplar.\n\n## 1. Önce bir kelime: \"nominal\"\n\n**Nominal**, bir şeyin etiket değeridir. Tasarım değeri de denir. Ekipman bu değere göre tasarlanır, sistem bu değerle anılır. Ama o anda ölçtüğün değer değildir.\n\nİki örnek:\n\n- Bir hat \"400 kV hat\" diye anılır. 400 kV onun nominal gerilimidir. O an voltmetreye baktığında 389 kV görebilirsin. Hat yine 400 kV hattır; sadece o anki gerilim 389 kV'dir.\n- Türkiye şebekesinin nominal frekansı 50 Hz'dir. O an ölçülen frekans 49,9 Hz olabilir. Şebeke yine \"50 Hz şebeke\"dir.\n\nYönetmelik bu yüzden hep iki şey verir: nominal değer ve onun etrafında izin verilen bant. Aşağıda \"400 kV: 370–420 kV\" gibi satırlar göreceksin. Birincisi etiket, ikincisi gerçek değerin durması gereken aralıktır.\n\n> **Sade anlatım:** Nominal, şişenin üstündeki \"1 litre\" yazısıdır. İçinde o an ne kadar su olduğu ayrı bir sorudur.\n\n### Birimler, kısa hatırlatma\n\n| Birim | Ne ölçer | Not |\n|---|---|---|\n| kV (kilovolt) | Gerilim | 1 kV = 1.000 V |\n| V (volt) | Gerilim | Evdeki priz alçak gerilimdir |\n| Hz (hertz) | Frekans; alternatif akımın saniyede kaç kez yön değiştirme döngüsü yaptığı | Türkiye'de nominal 50 Hz |\n| mHz (milihertz) | Frekansın binde biri | **200 mHz = 0,2 Hz.** 200 Hz değil! |\n| MW (megavat) | Güç, yani o anki üretim veya tüketim hızı | 1 MW = 1.000 kW |\n| MVA (megavoltamper) | Trafo gibi ekipmanın taşıyabileceği görünür güç | Trafo büyüklüğü böyle verilir |\n| TWh (terawatt-saat) | Bir süre boyunca tüketilen toplam enerji | Yıllık tüketim böyle verilir |\n\n200 mHz'e özellikle dikkat et. \"Mili\" binde bir demektir. 200 mHz, frekansın 50,0 Hz'den 49,8 Hz'e düşmesi kadar küçük bir değişimdir.\n\n## 2. Güç Sistemleri Araştırma Grubu\n\n### Grup ne yapar?\n\nMAM'ın kendi sayfasındaki tanım şu alanları sayar: elektrik iletim ve dağıtım sistemleri, yenilenebilir entegrasyon, güç sistemleri güvenliği, optimizasyon, simülasyon ve veri analitiği.\n\nBiraz açalım. **İletim**, elektriği santrallerden şehirlere yüksek gerilimle taşıyan ana şebekedir. **Dağıtım**, bu elektriği daha düşük gerilimle evlere ve işyerlerine ulaştıran yerel şebekedir. **Yenilenebilir entegrasyon**, güneş ve rüzgâr gibi kaynakların şebekeye sorunsuz bağlanmasıdır.\n\nGrupta üç faaliyet biçimi birlikte yürür:\n\n- uygulamalı Ar-Ge,\n- ürün,\n- danışmanlık.\n\n### İş paketleri\n\nGrubun yazdığı iş paketleri, ilandaki tercih sebeplerinin açık hali gibidir. Yani ilan \"şunu bilen tercih edilir\" derken aslında bu işleri kastediyor:\n\n- Fayda/maliyet ve risk/etki eksenli yatırım planlaması\n- Yenilenebilir enerji ve depolama entegrasyonu\n- Şebeke işletimi için karar destek algoritmaları\n- Gerçek zamanlı modelleme ve dijital ikiz\n- Bilgi sistemi ve yazılım\n\n### Çalışma alanlarının tam listesi\n\n1. İletim ve dağıtım için gelişmiş dinamik ve statik analiz, master plan, enterkonneksiyon analizi\n2. Yenilenebilirin şebeke entegrasyonu ve uyumluluk\n3. Akıllı şebeke teknolojilerinin tümleştirilmesi\n4. Fizibilite ve fayda/maliyet\n5. Piyasa ile şebekeyi birlikte ele alan enerji ekonomisi\n6. Koruma-koordinasyon ve özel koruma sistemleri\n7. Topraklama analizi ve tasarımı\n8. Şebeke ekipmanının teknik yeterlilik ve performans değerlendirmesi\n9. Gerçek zamanlı modelleme ve benzetim\n10. Elektrik şebekesi bilgi sistemleri ve yazılımları\n11. Büyük veri, derin öğrenme ve optimizasyon destekli iletim işletme ve planlama araçları\n\nBirkaç terim:\n\n- **Statik analiz:** şebekenin belli bir andaki dengeli halini hesaplar. \"Bu yükte hangi hat ne kadar dolu, gerilimler ne?\" sorusu.\n- **Dinamik analiz:** bir arızadan sonra saniyeler içinde neler olduğunu zaman içinde izler. \"Jeneratörler birlikte dönmeye devam ediyor mu?\" sorusu.\n- **Enterkonneksiyon:** ülkeler arası şebeke bağlantısı. Bölüm 9'da ayrıca anlatılıyor.\n- **Benzetim:** simülasyonun Türkçesi.\n\n### Uygulama alanı ve Avrupa bağlantısı\n\nGrubun işi dört kapıdan dışarı çıkar:\n\n- Ar-Ge projesi,\n- enerji sektörüne ürün,\n- iletim ve dağıtım kuruluşlarına danışmanlık,\n- kamu ve özel sektör için karar destek.\n\nGrup, EERA (European Energy Research Alliance, Avrupa Enerji Araştırma İttifakı) Smart Grids ve Hydropower üyesidir. Smart Grids akıllı şebekeler, Hydropower hidroelektrik demektir.\n\n> **Mülakatta şöyle söyle:** Bunu \"Avrupa araştırma işbirliğini takip ediyoruz\" diye bir cümlede kullan. Üyelik listesini ezberleme.\n\nİletişim ve kurum bilgisi mülakatta adres okumak için değildir.\n\n> **Mülakatta şöyle söyle:** \"Gebze'deki genel MAM ile Ankara'daki enerji yazılım grubunu ayırıyorum.\" Bu kadarı yeter.\n\n## 3. YTBS\n\n### Ne olduğu\n\nYTBS, **Yük Tevzi Bilgi Sistemi**'dir. İngilizce adı Load Dispatch Information System. \"Yük tevzi\", elektriğin üretim ve tüketim arasında dağıtılıp dengelenmesi demektir.\n\nYTBS bir enerji yönetim platformudur. Şu üç özelliği aklında tut:\n\n- TEİAŞ (Türkiye Elektrik İletim A.Ş., ülkenin iletim şebekesini işleten kurum) tarafından lisanslanmıştır.\n- THS 9 seviyesindedir.\n- Geliştiren birim bu gruptur.\n\n**THS**, Teknoloji Hazırlık Seviyesi demektir. Bir teknolojinin fikirden gerçek kullanıma ne kadar ilerlediğini 1'den 9'a kadar basamaklarla ölçen bir ölçektir. 1 en erken aşamadır: temel fikir. **9 en üst basamaktır**: ürünün gerçek işletme ortamında çalışarak kanıtlandığı anlamına gelir. Yani \"THS 9\" demek, \"bu ürün laboratuvarda değil, sahada, gerçek kullanımda\" iddiasıdır.\n\n### MAM'ın saydığı yetenekler\n\n- Şebekenin yaşayan dijital ikizi: senaryo ve analiz\n- Yapay zekâ destekli güvenlik analizi, yük ve yenilenebilir üretim tahmini, işletme planlaması\n- En düşük maliyet ve yüksek güvenilirlik için enerji optimizasyonu\n- Merkezi veri tabanı; SCADA/EMS ile web servisleri üzerinden veri alışverişi\n\nSon maddedeki kısaltmalar:\n\n- **SCADA** (Supervisory Control and Data Acquisition, Denetleyici Kontrol ve Veri Toplama): sahadaki ölçümleri toplayan ve uzaktan kumanda veren sistem.\n- **EMS** (Energy Management System, Enerji Yönetim Sistemi): bu ölçümler üzerinde şebeke hesaplarını yapan yazılım katmanı.\n\n**Güvenlik analizi**, \"şu hat veya şu jeneratör aniden devre dışı kalırsa ne olur?\" sorusunu önceden hesaplamaktır.\n\n### TEİAŞ duyurularında geçen modüller\n\nTEİAŞ eğitim duyurularında ayrıca adı geçen modüller:\n\n- yük tahmini,\n- gerilim planlaması,\n- arz güvenilirliği,\n- sistem ataleti hesabı,\n- geçici hal kararlılığı.\n\nİki terim açıklaması:\n\n- **Atalet:** şebekede dönen büyük jeneratörlerin kütlesi, frekansın ani değişmesine direnç gösterir. Bu dirence atalet denir. Güneş ve rüzgâr arttıkça bu direnç azalabilir; bu yüzden hesaplanır.\n- **Geçici hal kararlılığı:** büyük bir arızadan hemen sonraki ilk saniyelerde jeneratörlerin birbiriyle uyumlu dönmeye devam edip etmediği.\n\n### Ölçek hissi\n\nFaz 3 duyurusunda verilen ölçek:\n\n| Büyüklük | Değer | Kaynak |\n|---|---|---|\n| Enerji yönetim modülü | 30'dan fazla | TEİAŞ YTBS Faz 3 duyurusu |\n| Arıza simülasyonu | 4000'den fazla | TEİAŞ YTBS Faz 3 duyurusu |\n| Web servis çağrısı | On binlerce | TEİAŞ YTBS Faz 3 duyurusu |\n| Kullanım | Çok kullanıcılı, yoğun ziyaret edilen sistem | TEİAŞ YTBS Faz 3 duyurusu |\n\nRakamı övünmek için değil, \"hesap performansının ve veri modelinin işin parçası olduğunu\" anlatmak için bil.\n\n### YTBS, SCADA'nın yerine geçmez\n\nYTBS bir SCADA'nın yerine geçtiğini iddia eden bir kutu değildir. İş bölümü şöyle:\n\n- **SCADA** ölçer ve kumanda eder.\n- **YTBS** ölçümü modele bağlar, analizi ve kararı üretir, sonucu operatöre ve diğer sistemlere servis eder.\n\nDijital ikiz burada pazarlama sözü değildir. Aynı şebekenin, ölçümle güncellenen, üzerinde senaryo koşulabilen hesap kopyasıdır.\n\n> **Sade anlatım:** SCADA şebekenin gözü ve elidir. YTBS, gözün gördüğünü bir haritaya işleyip \"şimdi ne olur, ne yapmalı\" diye düşünen beyindir.\n\n## 4. SIPS\n\n### Ne olduğu\n\nSIPS, **System Integrity Protection Scheme**'in kısaltmasıdır. Türkçe adı **Akıllı Koruma Sistemi**. Kelime kelime \"sistem bütünlüğü koruma düzeni\" demektir.\n\nBu da grubun ürünüdür. O da THS 9 ve TEİAŞ lisanslıdır.\n\n### Nasıl çalışır\n\nSIPS, geniş alan ölçümüyle şebekenin anlık bütünlüğünü izler. Bu ölçümlerin başında PMU fazörleri gelir.\n\n- **PMU** (Phasor Measurement Unit, Fazör Ölçüm Birimi): gerilim ve akımı hem büyüklüğü hem açısıyla, çok hassas zaman damgasıyla ölçen cihaz.\n- **Fazör:** bu \"büyüklük + açı\" ölçümünün adı. Farklı yerlerdeki PMU'lar aynı saate bağlı olduğu için şebekenin uzak noktaları aynı anda karşılaştırılabilir.\n\nBüyük bir arızada SIPS, önceden tanımlanmış eylemleri otomatik tetikler. Örnek: jeneratör atma veya yük atma. **Atmak**, bir jeneratörü ya da bir yük grubunu bilerek şebekeden ayırmak demektir.\n\nAmaç zincirleme çökmeyi durdurmaktır. Yani bir arızanın başka arızaları tetikleyip yayılmasını engellemek.\n\nÜrün tanımında ayrıca şunlar da vardır:\n\n- web arayüzü,\n- olay kaydı,\n- modüler büyüme.\n\n### SIPS ile klasik röle korumasını ayır\n\n- **Röle**, kendi koruma bölgesindeki ekipmanı arızadan korur. Örneğin tek bir hattı veya tek bir trafoyu.\n- **SIPS**, sistem bütünlüğünü korumak için geniş alan verisiyle sistem düzeyinde eylem alır.\n\nİkisi aynı \"koruma\" kelimesinin iki katmanıdır. İlanda hem koruma hem güvenlik hem kararlılık geçtiği için bu ayrım sorulabilir.\n\n> **Sade anlatım:** Röle, tek bir evin sigortasıdır. SIPS, mahallenin tamamı karanlığa gömülmesin diye bazı sokakların elektriğini bilerek kesen merkezdir.\n\n## 5. STATCOM\n\nSTATCOM, Static Synchronous Compensator'ın kısaltmasıdır: **statik senkron kompanzatör**. MAM'ın milli STATCOM ürünü, güç elektroniği tabanlı reaktif kompanzasyondur.\n\n**Reaktif güç**, iş yapmayan ama gerilimi ayakta tutmak için gereken güç bileşenidir. **Kompanzasyon**, bu ihtiyacı yerinde karşılamaktır. STATCOM bunu hızlı tepki veren güç elektroniğiyle yapar.\n\nSTATCOM için anlatılan konular:\n\n- gerilim regülasyonu,\n- geçici ve dinamik kararlılık,\n- güç kalitesi.\n\nİlan metni STATCOM tasarımı istemez. Mülakatta \"grubun güç elektroniği kartı basan ekip olduğunu\" varsayma.\n\n> **Mülakatta şöyle söyle:** \"STATCOM gibi hızlı reaktif kaynaklar, gerilim kararlılığı ve dinamik analizde modellenmesi gereken cihazlardır; analiz yazılımı bunları hem statik hem dinamik olarak temsil edebilmelidir.\"\n\n## 6. Türkiye sisteminin kurumları\n\n| Kurum | Açılımı | Görevi |\n|---|---|---|\n| **TEİAŞ** | Türkiye Elektrik İletim A.Ş. | İletim sistem işletmecisi. 400, 154 ve 66 kV. Milli Yük Tevzi Merkezi arz-talep dengesini, enterkonneksiyonu ve bölge yük tevzi merkezlerinin koordinasyonunu yürütür. Dengeleme Güç Piyasası'nı işletir. AGC burada çalışır. |\n| **EPİAŞ** | Enerji Piyasaları İşletme A.Ş. | Gün öncesi ve gün içi piyasayı işleten piyasa operatörü. Şebeke fiziği ile fiyatı burada birbirine değer. |\n| **EPDK** | Enerji Piyasası Düzenleme Kurumu | Lisans, tarife, yönetmelik. Elektrik Şebeke Yönetmeliği bu ilanın \"milli kriter\" kaynağıdır. |\n| **Dağıtım** | — | 21 dağıtım şirketi. CIGRE 2026 Türkiye özetinde tüketici sayısı 2025 sonu için yaklaşık 51,9 milyon. |\n| **Üretim** | — | Lisanslı ve lisanssız. Analiz modeli her ikisini de görmek zorundadır; YTBS istatistik sayfası da ikisini birlikte topladığını yazar. |\n\nTablodaki kısaltmalar:\n\n- **AGC** (Automatic Generation Control, Otomatik Üretim Kontrolü): santrallerin üretimini otomatik olarak artırıp azaltarak frekansı hedefte tutan sistem. Bölüm 7'de rezervlerle birlikte tekrar geçiyor.\n- **CIGRE** (Conseil International des Grands Réseaux Électriques, Uluslararası Büyük Elektrik Sistemleri Konseyi): güç sistemleri alanında uluslararası mesleki ve teknik kuruluş.\n- **Dengeleme Güç Piyasası:** gerçek zamanda üretim ile tüketim arasındaki farkı kapatmak için santrallere talimat verilen piyasa.\n- **Gün öncesi / gün içi piyasa:** elektriğin bir gün önceden ve aynı gün içinde alınıp satıldığı piyasalar.\n\n### MYTM\n\n**MYTM**, Milli Yük Tevzi Merkezi'dir. TEİAŞ'ın şebekeyi gerçek zamanda yöneten merkezidir. Tanımını yönetmelik diliyle bil. MYTM:\n\n- üretimi, iletimi ve tüketimi güvenli, kaliteli ve ekonomik işletir;\n- gerçek zamanlı dengeyi sağlar;\n- dengeleme piyasasını işletir;\n- uluslararası hatları koordine eder.\n\n## 7. Şebeke yönetmeliğinden ezberlenecek sınırlar\n\nBu bölümün kaynağı Elektrik Şebeke Yönetmeliği'dir. Bölüm 1'deki \"nominal\" anlatımını burada kullanacaksın.\n\n### Gerilim\n\nNominal iletim gerilimleri: **400 kV, 154 kV, 66 kV**. Bunlar hatların etiket değerleridir. Gerçek gerilim aşağıdaki bantlarda kalmalıdır.\n\nYönetmelik iki farklı bant verir:\n\n- **Arıza öncesi planlama gerilimleri:** şebekeyi planlarken, henüz hiçbir arıza yokken hedeflenen dar aralık.\n- **Normal işletme:** günlük işletmede izin verilen daha geniş aralık.\n\n| Nominal | Arıza öncesi planlama | Normal işletme | Kaynak |\n|---|---|---|---|\n| 400 kV | 370–420 kV | 340–420 kV | Elektrik Şebeke Yönetmeliği |\n| 154 kV | 146–162 kV; iletim kısıtı olan bölgede planlama kabulü 140–170 kV | 140–170 kV | Elektrik Şebeke Yönetmeliği |\n| 66 kV | 62–70 kV | 66 kV ve altı iletim: ±%10 | Elektrik Şebeke Yönetmeliği |\n\nBölüm 1'deki örneğe dön: 400 kV hattın o an 389 kV olması, hem planlama bandının (370–420 kV) hem normal işletme bandının (340–420 kV) içindedir.\n\n**İletim kısıtı**, bir bölgede hatların taşıyabileceğinden fazla güç aktarılmak istenmesi durumudur.\n\n### Diğer gerilim seviyeleri\n\n| Seviye | Değerler | Kaynak |\n|---|---|---|\n| İletim sistemi içindeki dağıtım ve iç ihtiyaç seviyeleri | 34,5 kV, 33 kV, 31,5 kV, 15,8 kV, 10,5 kV, 6,3 kV | Elektrik Şebeke Yönetmeliği |\n| Alçak gerilim | 400/230 V | Elektrik Şebeke Yönetmeliği |\n\n**İç ihtiyaç**, bir santralin veya trafo merkezinin kendi çalışması için kullandığı elektriktir.\n\n### Planlama yükü ve planlama kriteri\n\n**Puant**, bir dönemdeki en yüksek tüketim anıdır.\n\n**Planlama yükü:** ilgili planlama yılında puantın **%5 üzeri**. Yani şebeke, beklenen en yüksek tüketimin yüzde 5 fazlasını taşıyacak şekilde planlanır.\n\n**Planlama kriteri:** normal koşullarda santraller azami üretimi aktarabilmeli.\n\n**N-1** ve **N-2** şunu anlatır: şebekede N tane eleman (hat, trafo, jeneratör) varsa, N-1 bunlardan birinin devre dışı kaldığı, N-2 ikisinin birden devre dışı kaldığı durumdur. N-1 durumunda şu şartlar sağlanmalıdır:\n\n- gerilim ve frekans limit içinde,\n- hatlar termik limitin altında,\n- hiçbir kullanıcı kaybedilmemeli,\n- kararlılık bozulmamalı,\n- sistem adalara bölünmemeli.\n\nNükleer bağlantı noktasında kriter **N-2**'dir.\n\nTerimler:\n\n- **Termik limit:** hattın aşırı ısınmadan taşıyabileceği en yüksek akım.\n- **Adalara bölünmek:** şebekenin birbirinden kopmuş, ayrı ayrı çalışan parçalara ayrılması.\n\n### Frekans\n\nNominal frekans 50 Hz'dir. Bölüm 1'deki örnekte olduğu gibi, o an 49,9 Hz ölçmek bu bandın içindedir.\n\n**LFSM** (Limited Frequency Sensitive Mode, Sınırlı Frekans Duyarlı Mod): frekans belli bir eşiği aştığında santralin üretimini otomatik olarak değiştirdiği çalışma modu. Düşük modda frekans düşünce, yüksek modda frekans yükselince devreye girer.\n\n| Büyüklük | Değer | Kaynak |\n|---|---|---|\n| Nominal frekans | 50 Hz | Elektrik Şebeke Yönetmeliği |\n| TEİAŞ'ın normal kontrol bandı | **49,8–50,2 Hz** | Elektrik Şebeke Yönetmeliği |\n| LFSM düşük mod eşiği | 49,8 Hz | Elektrik Şebeke Yönetmeliği |\n| LFSM yüksek mod eşiği | 50,2 Hz | Elektrik Şebeke Yönetmeliği |\n| Kararsız işletmede tasarımın gördüğü uçlar | 47,5 Hz ve 51,5 Hz | Elektrik Şebeke Yönetmeliği |\n\nÜretim tesisleri bu uçlarda yönetmelikteki asgari süreler kadar bağlı kalacak şekilde tasarlanır. Yani frekans 47,5 Hz'e ya da 51,5 Hz'e kadar savrulsa bile santral hemen şebekeden kopmamalıdır.\n\n### Rezervler: frekans nasıl geri getirilir?\n\nTüketim aniden artar veya bir santral düşerse frekans düşer. Bunu toparlamak için üç kademe vardır. Hızlıdan yavaşa:\n\n| Kademe | Ne yapar | Zaman ölçeği | Kaynak |\n|---|---|---|---|\n| Primer rezerv | 200 mHz'lik basamak frekans değişiminde verilebilecek azami güç değişimi | En geç 30 saniye | Elektrik Şebeke Yönetmeliği |\n| Sekonder kontrol | AGC ile frekansı 50 Hz'e ve sınır programını hedefine çeker | Dakikalar mertebesinde | Elektrik Şebeke Yönetmeliği |\n| Tersiyer | Dengeleme piyasasında talimat | 15 dakikalık talimat | Elektrik Şebeke Yönetmeliği |\n\nTekrar hatırlat: **200 mHz = 0,2 Hz**. Yani primer rezerv tanımı, frekansın bir anda 0,2 Hz değişmesi durumunu esas alır.\n\n**Basamak değişim**, kademeli değil, tek seferde ani değişim demektir. **Sınır programı**, ülkeler arası hatlardan planlanan güç alışverişidir.\n\n> **Sade anlatım:** Primer rezerv refleks gibidir; düşünmeden, saniyeler içinde tepki verir. Sekonder kontrol dakikalar içinde frekansı tam hedefe oturtur. Tersiyer ise piyasa üzerinden yeni santral talimatıyla yükü devralır.\n\n### PSS\n\n**PSS** (Power System Stabilizer, Güç Sistemi Dengeleyicisi): jeneratörün uyarma sistemine eklenen, salınımları sönümleyen kontrol devresi.\n\n| Şart | Değer | Kaynak |\n|---|---|---|\n| PSS aranan üniteler | 75 MW ve üzeri konvansiyonel ünite veya 300 MW ve üzeri konvansiyonel santral üniteleri | Elektrik Şebeke Yönetmeliği |\n| Söndürülecek salınımlar | 0–5 Hz elektromekanik salınımlar ve bölgeler arası salınım | Elektrik Şebeke Yönetmeliği |\n\nTerimler:\n\n- **Konvansiyonel:** geleneksel, dönen jeneratörlü santral (termik, hidro gibi).\n- **Elektromekanik salınım:** jeneratörlerin dönüş hızının birbirine göre ileri geri sallanması.\n- **Söndürmek (sönümlemek):** bu sallanmayı giderek küçültüp yok etmek.\n\n## 8. Büyüklükler (kaynağıyla söyle)\n\n| Büyüklük | Değer | Kaynak |\n|---|---|---|\n| 2025 sonu kurulu güç | **122.518,6 MW** (artışın büyük kısmı güneş ve rüzgâr) | TEİAŞ 2025 faaliyet raporu |\n| 2025 ani puant | **60.414 MW** (Temmuz 2025) | Ayrıca kaynak yazılmamış (2025 verileri bloğunda) |\n| 2025 tüketim | Yaklaşık **360,9 TWh** | Raporda geçici değer |\n| Eylül 2026 sonu kurulu güç | **127.355,2 MW** | TEİAŞ sayılarla elektrik iletimi |\n| Ekim 2026 sonu enerji iletim hattı devre uzunluğu | **77.863 km** | TEİAŞ sayılarla elektrik iletimi |\n| 2025 sonu transformatör merkezi ölçeği, 400 kV | 450 transformatör | Ayrıca kaynak yazılmamış |\n| 2025 sonu transformatör merkezi ölçeği, 154 kV | 1.756 transformatör | Ayrıca kaynak yazılmamış |\n| 2025 sonu transformatör merkezi ölçeği, 66 kV | 18 transformatör | Ayrıca kaynak yazılmamış |\n| 2025 sonu toplam kurulu trafo gücü | Yaklaşık 237.700 MVA | Ayrıca kaynak yazılmamış |\n| Dağıtım şirketi sayısı | 21 | Bölüm 6 |\n| 2025 sonu tüketici sayısı | Yaklaşık 51,9 milyon | CIGRE 2026 Türkiye özeti |\n\nTerimler:\n\n- **Kurulu güç:** bütün santrallerin etiket kapasitelerinin toplamı. Yani hepsi aynı anda tam çalışsa ulaşılacak üretim. Bu da bir tür nominal değerdir.\n- **Ani puant:** yıl içinde ölçülen en yüksek anlık tüketim.\n- **Devre uzunluğu:** hatların toplam uzunluğu; aynı direk üzerinde iki devre varsa ikisi ayrı sayılır.\n\n### Rakamı yorumla\n\nKurulu güç puantın iki katına yakındır. Bunun anlamı \"sistem bol\" değildir. Güneş ve rüzgâr aynı anda puantta değildir; iletim kısıtı, atalet ve gerilim yerel kalır.\n\n> **Sade anlatım:** Kurulu güç etiket değeridir. Güneş gece üretmez, rüzgâr her zaman esmez. Üstelik bir bölgede üretilen elektrik, hat kapasitesi yetmezse başka bölgeye taşınamaz.\n\n> **Mülakatta şöyle söyle:** Bu cümle, rakamı ezberlediğini değil, yorumladığını gösterir.\n\n## 9. Enterkonneksiyon\n\n### Senkron bağlantı\n\n**Senkron** çalışmak, iki şebekenin aynı frekansta, birlikte dönen tek bir sistem gibi çalışması demektir.\n\nTürkiye, Kıta Avrupası senkron bölgesi ile Yunanistan ve Bulgaristan 400 kV hatları üzerinden paralel çalışır. Bu bölge, **ENTSO-E**'nin (European Network of Transmission System Operators for Electricity, Avrupa Elektrik İletim Sistemi İşletmecileri Ağı) senkron bölgesidir.\n\n| Olay | Yıl |\n|---|---|\n| Deneme paralel işletme başladı | 2010 |\n| Kalıcı senkron bağlantı tesis edildi | 2015 |\n\n### Doğu ve kuzeydoğu bağlantıları\n\nDoğu ve kuzeydoğu bağlantıları (Gürcistan, Ermenistan, İran) aynı senkron adanın parçası gibi anlatılmaz.\n\n- **Gürcistan** tarafında back-to-back HVDC vardır.\n- **İran ve Ermenistan** hatları ayrı işletme rejimidir.\n\n**HVDC** (High Voltage Direct Current, Yüksek Gerilim Doğru Akım): elektriği alternatif akım yerine doğru akımla aktaran bağlantı. **Back-to-back HVDC**, alternatif akımı doğru akıma çevirip aynı istasyonda hemen tekrar alternatif akıma çeviren düzenektir. Böylece iki taraf frekanslarını birbirinden bağımsız tutarak güç alışverişi yapabilir.\n\nDikkat: bu sayfa Gürcistan'daki back-to-back HVDC'yi belirli bir hatta bağlamıyor. Mülakatta sen de bağlama.\n\n### Hat çiftleri\n\nFaaliyet raporundaki isimler:\n\n| Hat | Komşu ülke | Gerilim | Kaynak |\n|---|---|---|---|\n| Hamitabat–Maritsa | Bulgaristan | 400 kV | TEİAŞ faaliyet raporu |\n| Babaeski–Nea Santa | Yunanistan | 400 kV | TEİAŞ faaliyet raporu |\n| Borçka–Ahıska | Gürcistan | 400 kV | TEİAŞ faaliyet raporu |\n| Hopa–Batum | (Gürcistan, Batum) | 220 kV | TEİAŞ faaliyet raporu |\n| Kars–Gümrü | (Ermenistan, Gümrü) | 220 kV | TEİAŞ faaliyet raporu |\n| Doğubeyazıt–Bazargan | (İran, Bazargan) | 154 kV | TEİAŞ faaliyet raporu |\n\nParantezli ülke adları, karşı uçtaki şehrin bulunduğu ülkeyi okumana yardım içindir; raporda hat adıyla birlikte geçen ülke yalnızca ilk üç hatta yazılıdır.\n\nHat adlarını ve gerilimlerini bil. Transfer kapasitesini ezberleme, çünkü mevsimsel ve anlaşmaya bağlıdır.\n\n> **Mülakatta şöyle söyle:** Güncel MW değeri sorulursa \"TEİAŞ enterkonneksiyon ve kapasite tahsis verisinden bakarım\" de.\n\n### Senkron ile HVDC farkı\n\nEnterkonneksiyon analizi grubun çalışma alanıdır. İki bağlantı türü farklı sorular doğurur:\n\n- **Senkron alan:** frekans, primer rezerv paylaşımı, bölgeler arası salınım ve N-1'de komşu sisteme etki.\n- **HVDC bağlantı:** frekansı paylaşmaz, güç ayar noktasıyla kontrol edilir.\n\n**Güç ayar noktası**, bağlantıdan ne kadar güç aktarılacağının operatör tarafından belirlenen değeridir.\n\n> **Sade anlatım:** Senkron bağlantıda iki ülke aynı ipe bağlı iki koşucu gibidir; biri yavaşlarsa diğeri hisseder. HVDC'de aradaki bir vana gibidir; geçen miktar ayarlanır, frekans geçmez.\n\n## 10. Kendi tecrübeni bağlama\n\nÜç dakikalık giriş için şu sıra yeter:\n\n1. Kim olduğun ve 3 yılın hangi şebekede, hangi analizde, hangi yazılımda geçtiği.\n2. O işte kullandığın model büyüklüğü: bara sayısı, gerilim, araç (PowerFactory, PSS/E, MATLAB, Python).\n3. Çıktının kararı nasıl değiştirdiği: bir hat, bir trafo, bir ayar, bir yatırım.\n4. Grubun işine köprü.\n\n**Bara**, şebeke modelindeki bağlantı düğümüdür; hatların, trafoların ve yüklerin birleştiği nokta. Bara sayısı modelin büyüklüğünü anlatır.\n\nDördüncü adım için iki hazır köprü cümlesi:\n\n> **Mülakatta şöyle söyle:** \"Aynı hesabı operatörün her gün kullanacağı servise taşımak istiyorum.\"\n>\n> veya: \"Planlama çalışmasını tekrarlanabilir bir araca bağlamak istiyorum.\"\n\nSomut olmayan \"güç sistemlerine ilgiliyim\" cümlesi bu panelde zayıftır. Model, varsayım, limit ve sonuç söyle.\n\n### 90 saniyelik metin için not\n\nAşağıdaki metin sayfanın kısa sözlü özetidir. İçindeki kısaltmalar yukarıda açıldı: YTBS (Bölüm 3), SIPS ve PMU (Bölüm 4), SCADA (Bölüm 3), ENTSO-E (Bölüm 9), N-1 (Bölüm 7).\n\nİki noktayı söylemeden önce kontrol et:\n\n- Metin \"400 ve 154 kV'de ENTSO-E ile senkron\" diyor. Bölüm 9 ise senkron bağlantıyı Yunanistan ve Bulgaristan **400 kV** hatlarıyla anlatıyor. İfadeyi bu farkı bilerek kullan.\n- Metindeki \"Dağıtım ... 36 kV ve altı\" sınırı bu sayfanın başka bir bölümünde geçmiyor. Kullanmadan önce yönetmelikten teyit et.\n\n## 90 saniye\n\n“Grup Ankara’da, TEİAŞ için YTBS ve SIPS’i üretmiş. YTBS dijital ikiz, güvenlik analizi, tahmin, optimizasyon ve SCADA’ya web servis tarafı. SIPS, PMU ile geniş alan izleyip sistem bütünlüğü için otomatik eylem alıyor. Türkiye 400 ve 154 kV’de ENTSO-E ile senkron, normal frekans bandı 49,8–50,2 Hz, planlama kriteri puantın yüzde 5 üzerinde N-1. Dağıtım 21 şirkette, 36 kV ve altı. Benim anlatacağım tecrübe de analiz sonucunu yazılıma ve işletme kararına bağlayan taraf.”\n\n## Kendini yokla\n\nÖnce cevabı kapat, kendin söyle, sonra kontrol et.\n\n1. **\"Nominal\" ne demek? Örnek ver.**\n   Etiket, yani tasarım değeri; o an ölçülen değer değil. 400 kV hat o an 389 kV olabilir; 50 Hz şebeke o an 49,9 Hz olabilir.\n\n2. **200 mHz kaç Hz'dir?**\n   0,2 Hz. 200 Hz değil.\n\n3. **THS 9 ne anlatır?**\n   Teknoloji Hazırlık Seviyesi'nin en üst basamağı; ürünün gerçek işletmede kanıtlandığı iddiası. YTBS ve SIPS THS 9'dur.\n\n4. **YTBS ile SCADA arasındaki fark nedir?**\n   SCADA ölçer ve kumanda eder. YTBS ölçümü modele bağlar, analizi ve kararı üretir, sonucu operatöre ve diğer sistemlere servis eder.\n\n5. **SIPS ile klasik röle arasındaki fark nedir?**\n   Röle kendi koruma bölgesindeki ekipmanı korur. SIPS geniş alan verisiyle (özellikle PMU fazörleri) sistem bütünlüğü için sistem düzeyinde eylem alır; örneğin jeneratör veya yük atma. Amaç zincirleme çökmeyi durdurmak.\n\n6. **400 kV için arıza öncesi planlama ve normal işletme bantları nedir?**\n   Planlama 370–420 kV, normal işletme 340–420 kV.\n\n7. **154 kV için planlama bandı nedir? İletim kısıtı olan bölgede ne değişir?**\n   146–162 kV; iletim kısıtı olan bölgede planlama kabulü 140–170 kV.\n\n8. **Planlama yükü nedir?**\n   İlgili planlama yılında puantın %5 üzeri.\n\n9. **N-1 durumunda hangi şartlar sağlanmalı? Nükleer bağlantı noktasında kriter nedir?**\n   Gerilim ve frekans limit içinde, hatlar termik limitin altında, kullanıcı kaybı yok, kararlılık bozulmuyor, sistem adalara bölünmüyor. Nükleerde N-2.\n\n10. **TEİAŞ'ın normal frekans bandı ve kararsız işletmede tasarımın gördüğü uçlar nedir?**\n    Normal bant 49,8–50,2 Hz. Uçlar 47,5 Hz ve 51,5 Hz.\n\n11. **Primer, sekonder ve tersiyer kontrolün zaman ölçekleri nedir?**\n    Primer: 200 mHz basamak değişimde en geç 30 saniye. Sekonder: AGC ile dakikalar mertebesinde. Tersiyer: dengeleme piyasasında 15 dakikalık talimat.\n\n12. **PSS hangi ünitelerde aranır?**\n    75 MW ve üzeri konvansiyonel ünite veya 300 MW ve üzeri konvansiyonel santral ünitelerinde; 0–5 Hz elektromekanik ve bölgeler arası salınımlar için.\n\n13. **2025 sonu kurulu güç ve 2025 ani puant kaç? Bu iki rakamı nasıl yorumlarsın?**\n    122.518,6 MW ve 60.414 MW (Temmuz 2025). Kurulu güç puantın iki katına yakın, ama bu \"sistem bol\" demek değil: güneş ve rüzgâr aynı anda puantta değil; iletim kısıtı, atalet ve gerilim yerel kalır.\n\n14. **Türkiye ENTSO-E ile ne zaman ve hangi hatlarla senkron oldu?**\n    Deneme paralel işletme 2010, kalıcı senkron bağlantı 2015. Yunanistan ve Bulgaristan 400 kV hatları üzerinden: Babaeski–Nea Santa ve Hamitabat–Maritsa.\n\n15. **Senkron bağlantı ile HVDC bağlantı arasındaki fark nedir?**\n    Senkron alanda frekans, primer rezerv paylaşımı, bölgeler arası salınım ve N-1'de komşuya etki konuşulur. HVDC frekansı paylaşmaz, güç ayar noktasıyla kontrol edilir.\n\n16. **Transfer kapasitesi sorulursa ne dersin?**\n    \"TEİAŞ enterkonneksiyon ve kapasite tahsis verisinden bakarım.\" Çünkü kapasite mevsimsel ve anlaşmaya bağlıdır.\n\n## Bu sayfayı dene\n\nÇoktan seçmeli. Bilemediğin soru tarayıcıda saklanır ve doğru bilinene kadar yeniden sorulur.\n\n[Bu sayfanın sorularına geç](test.html?sayfa=01-02)\n"}, {"id": "01-Kurum-Ilan-ve-Surec/03-Guncel-Projeler-Yayinlar-Urunler.md", "group": "01  Kurum, ilan, süreç", "title": "Güncel projeler, yayınlar, ürünler", "body": "# Güncel projeler, yayınlar, ürünler\n\nBu sayfa, başvurduğun birimin şu an ne üzerinde çalıştığını kaynaklarıyla anlatır. Panel \"bizi tanıyor musun?\" diye sorduğunda bu sayfadan cevap verirsin.\n\nKısaltmalar:\n\n- **MAM:** TÜBİTAK Marmara Araştırma Merkezi. TÜBİTAK, Türkiye Bilimsel ve Teknolojik Araştırma Kurumu demektir.\n- **TEİAŞ:** Türkiye Elektrik İletim A.Ş. İletim şebekesini işleten devlet şirketi.\n- **YTBS:** Yük Tevzi Bilgi Sistemi. MAM'ın TEİAŞ için geliştirdiği enerji yönetim platformu.\n\n## Etiketler\n\nBu sayfadaki her bilgi üç etiketten birini taşır:\n\n- **Doğrulandı:** kurumun kendi sayfasında Kasım 2026'da okundu.\n- **İkincil:** haber, bildiri özeti veya üçüncü taraf sayfası. Mülakatta \"okuduğum kadarıyla\" diye söyle.\n- **Bilinmiyor:** bulunamadı. Mülakatta uydurma, sor.\n\nEtiketin işi, mülakatta hangi cümleyi ne kadar kesin söyleyebileceğini belirlemektir.\n\n## Mülakattan önceki gün\n\nİki sayfayı yeniden aç. Rakamlar değişmiş olabilir.\n\n| Sayfa | Adres |\n| --- | --- |\n| MAM \"Enerji – Devam Eden Projeler\" | `mam.tubitak.gov.tr/gundem/enerji-devam-eden-projeler/` |\n| TEİAŞ YTBS bilgi sitesi | `ytbsbilgi.teias.gov.tr` |\n\n## Birim\n\nDoğrulandı: birimin güncel adı **Enerji Teknolojileri Başkan Yardımcılığı**'dır.\n\n- Eski adı Enerji Enstitüsü'dür.\n- Yayınlarda hâlâ \"TUBITAK MRC Energy Institute\" diye geçer. **MRC**, Marmara Research Center, yani MAM'ın İngilizce adıdır.\n- İlandaki iş **Güç Sistemleri Araştırma Grubu**'na aittir.\n- Grubun yeri Ankara'dır.\n\nDikkat: aynı başkan yardımcılığında başka gruplar da vardır. Rüzgâr tahmin sistemi RİTM'i geliştiren **Enerji İzleme ve Tahmin Araştırma Grubu** ayrı bir gruptur.\n\nAşağıdaki proje listesinde hangi projenin hangi gruba ait olduğu, YTBS ve SIPS dışında **doğrulanmadı**. **SIPS**, System Integrity Protection Scheme, yani sistem bütünlüğünü koruma şemasıdır.\n\n> Mülakatta şöyle söyle: \"Başkan yardımcılığının sayfasında gördüğüm şu proje…\" \"Grubunuzun şu projesi\" deme.\n\n## Devam eden projeler (MAM sayfası, doğrulandı)\n\n| Proje | Müşteri | Dönem | Bilinen ölçek |\n| --- | --- | --- | --- |\n| YTBS Geliştirme Faz 3 | TEİAŞ | 2022–2026 | 30'dan fazla modül, 4000'den fazla arıza benzetimi, 85.000 web servis talebi, 12.000 kullanıcı, günde yaklaşık 100.000 ziyaret, THS 9 |\n| Güneş Üretim Tahmin Sistemi ve YTBS–Sistem Kullanıcıları Entegrasyonu | TEİAŞ | 2023–2027 | 34.259 santral, 23.140 MW, ulusal ölçekte NMAE %2, THS 9 |\n| TEKİS-C | — | 2022–2028 | 20.678 yüksek gerilim ölçüm noktası, 4150 cihaz, THS 8 |\n| TCDD Yerli Telekomand | TCDD | 2022–2028 | — |\n| Sun-Trans | AB projesi | 2025–2029 | — |\n| Sarıyar HES | EÜAŞ | 2020–2026 | — |\n| Keban ve Hirfanlı HES kontrol sistemleri | TEİAŞ | 2022–2027 | — |\n| Batman HES | — | — | — |\n| ATHOM | DSİ | 2024–2031 | — |\n\n### Tablodaki terimler\n\n| Terim | Anlamı |\n| --- | --- |\n| THS | Teknoloji Hazırlık Seviyesi. 1'den 9'a kadar ölçektir; 9, ürünün gerçek işletme ortamında kanıtlandığını gösterir |\n| NMAE | Normalized Mean Absolute Error, normalize edilmiş ortalama mutlak hata. Tahmin hatasının kurulu güce oranıdır; küçük olması iyidir |\n| MW | Megavat, bir milyon vat |\n| Arıza benzetimi | Bir arızanın şebekede ne yapacağını bilgisayarda canlandırmak |\n| Web servis talebi | Başka sistemlerin YTBS'den ağ üzerinden veri veya hesap istemesi |\n| TCDD | Türkiye Cumhuriyeti Devlet Demiryolları |\n| Telekomand | Uzaktan kumanda; sahadaki cihazı merkezden açıp kapamak |\n| AB | Avrupa Birliği |\n| HES | Hidroelektrik santrali |\n| EÜAŞ | Elektrik Üretim A.Ş. Devletin üretim şirketi |\n| DSİ | Devlet Su İşleri |\n| TEKİS-C, ATHOM, Sun-Trans | Proje adları. Açılımları bu notlarda doğrulanmadı; mülakatta açılım uydurma |\n\nTablodaki \"—\" işareti, sayfada o bilginin verilmediğini gösterir.\n\n### TEİAŞ YTBS bilgi sitesinden doğrulanan tarihler\n\n| Olay | Tarih |\n| --- | --- |\n| Güneş tahmin projesinin imzası | 25 Eylül 2023 |\n| EDAŞ çalıştayı | 17 Eylül 2025 |\n| **YTBS Geliştirme Projesi 4** imzası | 18 Aralık 2025 |\n\n**EDAŞ:** Elektrik dağıtım anonim şirketi. Bir bölgenin dağıtım şebekesini işleten şirkettir.\n\nSon madde önemlidir. İlan büyük ihtimalle bu yeni fazın ve dağıtım tarafına açılan entegrasyonun kadrosudur.\n\nBu bir çıkarımdır, doğrulanmış bilgi değildir. Soru olarak kullan:\n\n> Mülakatta şöyle söyle: \"Faz 4'ün kapsamında dağıtım şirketleriyle entegrasyonun payı nedir?\"\n\n### Bu tablodan ne çıkar\n\n1. İşin ağırlığı TEİAŞ'ladır ve iletim işletmesidir. İlandaki \"dağıtım\" kelimesi, sistem kullanıcıları entegrasyonu ve dağıtıma bağlı güneş ile anlam kazanır.\n2. On binlerce dağıtık santral tek tek ölçülemez. Güneş tahmin projesinin özü, az sayıda ölçümden ülke toplamını kestirmektir (aşağıdaki bildiri).\n3. 85.000 web servis talebi ve 12.000 kullanıcı, bunun bir araştırma prototipi değil üretim yazılımı olduğunu söyler. Yazılım geçmişin burada değerlidir.\n\n> Sade anlatım: \"Sistem kullanıcısı\", şebekeye bağlanan santral, dağıtım şirketi veya büyük tüketicidir. Dağıtım şebekesine bağlı küçük güneş santralleri iletim işletmecisinin göremediği üretimdir. Onları tahmin etmek, dağıtımı iletim işletmesine bağlar.\n\n## Ürünler (MAM ürün sayfaları, doğrulandı)\n\n| Ürün | Ne yapar | Olgunluk |\n| --- | --- | --- |\n| YTBS | TEİAŞ için enerji yönetim platformu: dijital ikiz, güvenlik analizi, tahmin, optimizasyon, SCADA/EMS ile web servis | THS 9 |\n| SIPS | Geniş alan ölçümüyle sistem bütünlüğünü koruyan özel koruma sistemi | THS 9 |\n| STATCOM | Güç elektroniği tabanlı reaktif güç kompanzasyonu | — |\n| RİTM | Rüzgâr üretim izleme ve tahmin; 6–72 saat ufuk; GFS, ECMWF, WRF sayısal hava modelleri | Ayrı grup |\n\n### Tablodaki terimler\n\n| Terim | Anlamı |\n| --- | --- |\n| Dijital ikiz | Gerçek şebekenin ölçümlerle güncellenen bilgisayar modeli |\n| SCADA | Supervisory Control and Data Acquisition, denetleyici kontrol ve veri toplama. Sahadan ölçüm alır, sahaya kumanda gönderir |\n| EMS | Energy Management System, enerji yönetim sistemi. Ölçümü modele bağlayıp analiz yapan yazılım katmanı |\n| Geniş alan ölçümü | Şebekenin uzak noktalarından eş zamanlı alınan ölçüm |\n| STATCOM | Static Synchronous Compensator, statik senkron kompanzatör |\n| Reaktif güç kompanzasyonu | Gerilimi tutmak için şebekeye reaktif güç vermek veya çekmek |\n| RİTM | Bu notlarda resmi açılım yok. Sayfa onu rüzgâr tahmin sistemi diye anıyor |\n| Ufuk | Tahminin ne kadar ileriyi kapsadığı; burada 6 ile 72 saat arası |\n| GFS | Global Forecast System, ABD'nin küresel hava tahmin modeli |\n| ECMWF | European Centre for Medium-Range Weather Forecasts, Avrupa Orta Vadeli Hava Tahminleri Merkezi |\n| WRF | Weather Research and Forecasting, bölgesel hava tahmin modeli |\n\n## Yayınlar\n\n**Doğrulandı:**\n\n- SEERC 2025 bildirisi: \"The solar power generation forecast methodology for secure system operation with highly distributed power generation\".\n  - Yazarlar: Yusuf Yanık, Sinan Eren, Melih Bilgen (TÜBİTAK MAM) ve Utku Yılmaz (TEİAŞ).\n  - Konu: dağıtık güneş üretiminin, güvenli sistem işletmesi için tahmini.\n  - SEERC, bildirinin sunulduğu konferansın kısaltmasıdır. Açılımı bu notlarda doğrulanmadı.\n- Cem Şahin (2021), \"The Development of Renewable Energy in Turkish Electricity Markets\".\n  - Dergi: European Journal of Science and Technology (EJOSAT).\n  - DOI `10.31590/ejosat.893539`. **DOI**, Digital Object Identifier, yani makalenin kalıcı kimlik numarasıdır.\n  - Yazar adresi: TUBITAK MRC Energy Institute, Ankara.\n\n**Bilinmiyor:** YTBS'nin iç algoritmalarını (durum kestirimi, güvenlik analizi) anlatan hakemli bir makale bulunamadı.\n\n- **Durum kestirimi:** gürültülü ölçümlerden şebekenin en olası gerilim ve açı değerlerini hesaplamak.\n- **Güvenlik analizi:** bir eleman devre dışı kalırsa şebekenin güvenli kalıp kalmayacağını sınamak.\n\nMülakatta \"YTBS'nin şu algoritmayı kullandığını okudum\" deme.\n\n> Mülakatta şöyle söyle: \"Kamuya açık sayfalarda modül adlarını gördüm, yöntem ayrıntısını bulamadım; merak ediyorum.\"\n\n**Karıştırma:** Türkiye'de geçici hal kararlılığını karar ağacıyla sınıflandıran 2018 tarihli bir üniversite çalışması aramalarda çıkar. Bu MAM'ın yayını değildir. Kuruma atfetme.\n\n**Geçici hal kararlılığı**, büyük bir arızadan hemen sonra jeneratörlerin senkron kalıp kalmadığıdır.\n\n### Yapılacak iş (yarım saat)\n\n1. İki yayının özetini oku.\n2. Her biri için üç cümle yaz: problem neydi, yöntem neydi, sonuç neydi.\n3. Yazarların adını ezberleme; karşına panel üyesi olarak çıkabileceklerini bil.\n\n## Yaygın yanlış\n\n- **\"MAM Gebze'dedir, mülakat da iş de orada.\"** Merkez Gebze'dedir; bu grup ve ilanın görev yeri Ankara'dır.\n- **\"YTBS bir SCADA'dır.\"** Değil. SCADA ölçer ve kumanda eder; YTBS ölçümü modele bağlar, analiz ve karar üretir.\n- **\"RİTM'i de bu grup yaptı.\"** Ayrı grup.\n- **\"THS 9 araştırma bitti demektir.\"** THS 9, ürünün gerçek ortamda kanıtlandığını söyler. Faz 3 ve Faz 4, geliştirmenin sürdüğünü gösterir.\n- **\"Rakamları ezberden kesin söylerim.\"** Kaynağını ve tarihini söyle: \"MAM'ın proje sayfasına göre\".\n\n## Panel takip sorusu\n\n**\"Projelerimizden hangisini biliyorsun?\"**\n\nTek proje seç, üç cümle söyle: ne, kimin için, hangi ölçekte. Sonra bir soru sor. Listeyi sayma.\n\n**\"Güneş tahmini neden bir güç sistemi problemi?\"**\n\n> Mülakatta şöyle söyle: \"Tahmin hatası doğrudan yedek ihtiyacına ve dengeleme maliyetine döner. On binlerce lisanssız santral ölçülmediği için net yük belirsizleşir; güvenlik analizi yanlış yük dağılımıyla koşar.\"\n\nTerimler:\n\n- **Lisanssız santral:** belirli gücün altında, üretim lisansı almadan kurulabilen küçük santral. Çoğu dağıtım şebekesine bağlı güneştir.\n- **Net yük:** tüketimden, görünmeyen yerel üretimin düşülmesiyle kalan, iletim şebekesinin gördüğü yük.\n\nAşağıdaki konuşma metni üç parçalıdır: birimi tanıt, bildiğin işleri ölçeğiyle söyle, bilmediğini açıkça söyleyip merakınla bitir.\n\n## 90 saniye\n\n\"Başvurduğum grup Ankara'da, Enerji Teknolojileri Başkan Yardımcılığı'na bağlı Güç Sistemleri Araştırma Grubu. Kamuya açık sayfalardan bildiğim iki ürün YTBS ve SIPS; ikisi de TEİAŞ'ta kullanımda. Devam eden işlerden YTBS'nin üçüncü fazını ve güneş üretim tahmin projesini okudum; ikincisi otuz dört bin santrali, yirmi üç bin megavatı kapsıyor. Geçen aralıkta dördüncü faz imzalanmış. Algoritma ayrıntısını bilmiyorum, yayımlanmış bir kaynak bulamadım; bana en çok ilginç gelen kısım, bu kadar kullanıcıya hizmet eden bir analiz yazılımının nasıl doğrulandığı.\"\n\n## Bu sayfayı dene\n\nÇoktan seçmeli. Bilemediğin soru tarayıcıda saklanır ve doğru bilinene kadar yeniden sorulur.\n\n[Bu sayfanın sorularına geç](test.html?sayfa=01-03)\n"}, {"id": "01-Kurum-Ilan-ve-Surec/04-Tercih-Sebebi-Kanit-Tablosu.md", "group": "01  Kurum, ilan, süreç", "title": "Tercih sebebi ve kanıt", "body": "# Tercih sebebi ve kanıt\n\nİlanda on tercih sebebi var. **Tercih sebebi**, zorunlu olmayan ama adayı öne çıkaran özelliktir.\n\nPanel her birine karşılık senden bir kanıt arar. Bu sayfa, her madde için ne söyleyeceğini **önceden** yazman içindir.\n\n## Önce dürüst durum tespiti\n\nBu tablo bir şablondur. Güçlü ve boş sütunlarını kendi özgeçmişinle doldur. Yıl, unvan ve proje adı buraya hazır yazılmaz.\n\nBu profil bazı maddelerde güçlü, bazılarında boştur. Boş maddeyi dolu göstermeye çalışmak mülakatta en hızlı puan kaybettiren şeydir, çünkü panel alanın içindendir ve tek bir takip sorusu yeter.\n\nStrateji üç cümledir:\n\n1. Güçlü olduğun maddeleri (yazılım, öğrenme, koordinasyon) somut kanıtla söyle.\n2. Boş maddeleri açıkça boş söyle ve ne yaptığını göster: bu klasördeki çalışma, sıfırdan yazdığın yük akışı kodu, elle çözdüğün örnekler.\n3. Aradaki köprüyü kur: üretim yazılımı disiplinini analiz yazılımına taşımak.\n\n> Sade anlatım: Eksiğini saklama, eksiğin üstüne ne koyduğunu göster. Panel alan bilgisini öğretebilir; dürüstlüğü ve öğrenme hızını öğretemez.\n\n## Tecrübe beyanı uyarısı\n\nİlanın üçüncü özel koşulu: \"İşin tanımında belirtilen alanlarda en az 3 yıl mesleki tecrübe.\"\n\nİşin tanımı: elektrik iletim ve dağıtım şebekeleri için **analiz ve yazılım geliştirme**. Dipnot ayrıca tecrübe yılını \"belirtilen alanlarda tam süreli çalışılan süre\" diye tanımlar.\n\nBunun üç sonucu var:\n\n- Kariyer sistemine girdiğin beyan, SGK hizmet dökümü ve onaylı çalışma belgesiyle karşılaştırılır. İlanın g maddesi, hatalı bilginin başvuruyu geçersiz kıldığını yazar.\n- Yazılım geliştirme tecrübenin bu tanıma sayılıp sayılmayacağı **kurumun kararıdır**. Benim ya da senin yorumun değildir.\n- Mülakatta \"Bu üç yılın hangisi şebekeyle ilgili?\" sorusu gelebilir. Cevabın belgeyle aynı olmalı.\n\n**SGK:** Sosyal Güvenlik Kurumu. **SGK hizmet dökümü**, hangi işyerinde hangi tarihler arasında sigortalı çalıştığını gösteren resmî belgedir.\n\n### Yapılacak iş\n\nSGK dökümündeki her işyeri için bir satır yaz:\n\n| Tarih aralığı | Unvan | Yaptığın iş | Enerji veya şebekeyle ilişkisi |\n| --- | --- | --- | --- |\n| | | | **var / dolaylı / yok** |\n\n- \"Dolaylı\" yazdıysan ilişkiyi bir cümleyle anlat.\n- \"Yok\" yazdıysan mülakatta da \"yok\" de.\n- Emin değilsen mülakattan önce İnsan Kaynakları'na sor: `mam.ik@tubitak.gov.tr`.\n\n### Hazır cevap iskeleti\n\nKöşeli parantezli kısım yalnızca şebekeyle doğrudan ilgili bir işin varsa söylenir.\n\n> Mülakatta şöyle söyle: \"Tecrübem yazılım geliştirme tarafında. [Şebekeyle
